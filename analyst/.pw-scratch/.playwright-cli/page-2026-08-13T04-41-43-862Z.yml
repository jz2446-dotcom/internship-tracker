                    - text: Overview
                    - generic [ref=f671e365]:
                      - paragraph [ref=f671e366]:
                        - text: Microsoft Advertising, part of
                        - strong [ref=f671e367]
                        - text: Microsoft AI (MAI), is a rapidly growing business powering global advertisers across search, display, and emerging AI-driven channels. Our Advertising CRM team is building the next generation of customer relationship management solutions that unify advertiser data, enable intelligent workflows, and deliver actionable insights across Sales, Marketing, Operations, Billing, and Customer Success.
                      - paragraph [ref=f671e368]:
                        - text: We are seeking a
                        - strong [ref=f671e369]: Senior Software Engineer
                        - text: passionate about AI innovation, Copilot experiences, Dynamics 365 CRM, and full-stack engineering to help drive the transformation from OneCRM to TrueCRM. In this role, you will build scalable cloud-native solutions, introduce AI-powered capabilities, and deliver modern customer experiences that empower thousands of sellers, marketers, and business users worldwide.
                      - paragraph [ref=f671e370]: At Microsoft, our mission is to empower every person and every organization on the planet to achieve more. We foster a culture rooted in growth mindset, innovation, collaboration, respect, integrity, accountability, and inclusion.
                      - paragraph [ref=f671e371]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.
                      - paragraph [ref=f671e372]: Starting January 26, 2026, Microsoft AI (MAI) employees who live within a 50- mile commute of a designated Microsoft office in the U.S. or 25-mile commute of a non-U.S., country-specific location are expected to work from the office at least four days per week. This expectation is subject to local law and may vary by jurisdiction.
                    - text: Responsibilities
                    - list [ref=f671e373]:
                      - listitem [ref=f671e374]: Design, develop, and operate scalable, secure, and highly available full-stack solutions supporting Microsoft Advertising CRM platforms.
                      - listitem [ref=f671e375]: Build modern web applications, APIs, and cloud-native services using Azure technologies to enable sales productivity, customer engagement, and advertiser lifecycle management.
                      - listitem [ref=f671e376]: Build next-generation CRM solutions by driving modernization efforts, improving scalability, and delivering enhanced user experiences.
                      - listitem [ref=f671e377]: Leverage CRM platforms, including Microsoft Dynamics 365 CRM, Dataverse, and Power Platform, to deliver customer engagement solutions, workflow automation, and business process improvements.
                      - listitem [ref=f671e378]: Develop and integrate AI-powered capabilities, including Copilot experiences, intelligent recommendations, conversational workflows, predictive insights, and automation solutions.
                      - listitem [ref=f671e379]: Partner with Product Managers, Applied Scientists, Data Scientists, and engineering teams to deliver innovative, customer-centric solutions.
                      - listitem [ref=f671e380]: Build scalable backend services, distributed systems, APIs, and data platforms using Azure cloud services and modern engineering practices.
                      - listitem [ref=f671e381]: Drive engineering excellence through architecture and code reviews, testing automation, observability, reliability, security, and performance optimization.
                      - listitem [ref=f671e382]: Take ownership of end-to-end engineering solutions, including design, implementation, deployment, and operational excellence.
                      - listitem [ref=f671e383]: Mentor engineers and contribute to a culture of innovation, collaboration, ownership, and continuous learning.
                      - listitem [ref=f671e384]: Evaluate and adopt emerging technologies including Generative AI, Agentic AI, LLMs, Copilot extensibility, and intelligent automation frameworks.
                    - text: Qualifications
                    - paragraph [ref=f671e385]:
                      - heading "Required Qualifications:" [level=3] [ref=f671e386]
                    - list [ref=f671e387]:
                      - listitem [ref=f671e388]:
                        - text: Bachelor's Degree in Computer Science or related technical field AND 4+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python.
                        - list [ref=f671e389]:
                          - listitem [ref=f671e390]: OR equivalent experience.
                      - listitem [ref=f671e391]: 4+ years of software engineering experience building enterprise-scale applications and cloud services.
                      - listitem [ref=f671e392]: Solid full-stack development skills using C#, .NET, React/TypeScript, REST APIs, and modern web technologies.
                      - listitem [ref=f671e393]: Experience building cloud-native solutions on Microsoft Azure, including microservices, distributed systems, and data platforms.
                      - listitem [ref=f671e394]: Knowledge of software design patterns, DevOps, CI/CD, security, reliability, and operational excellence.
                      - listitem [ref=f671e395]: Experience building or integrating AI-powered solutions, including Copilot experiences, intelligent automation, or Generative AI capabilities.
                      - listitem [ref=f671e396]: Solid problem-solving, communication, and collaboration skills.
                    - paragraph [ref=f671e397]:
                      - heading "Preferred Qualifications:" [level=3] [ref=f671e398]
                    - list [ref=f671e399]:
                      - listitem [ref=f671e400]: Experience building CRM, Sales Enablement, Customer Engagement, or Advertising Technology platforms.
                      - listitem [ref=f671e401]: Hands-on experience with Microsoft Dynamics 365 CRM, Dataverse, and Power Platform.
                      - listitem [ref=f671e402]: Knowledge of Dynamics 365 Sales, Customer Service, Marketing, and Customer Insights modules.
                      - listitem [ref=f671e403]: Experience with Azure AI Services, LLMs, Copilot extensibility, and Agentic AI solutions.
                      - listitem [ref=f671e404]: Familiarity with enterprise modernization, cloud transformation, and platform migration initiatives.
