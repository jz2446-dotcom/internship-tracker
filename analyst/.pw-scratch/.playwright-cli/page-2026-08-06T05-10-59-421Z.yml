                            - 'img "Crochet: Beginner Basics 6 p.m. Wednesday, Aug. 12 Central Library Adults & Teens 13+ New to crocheting? Join us at the Central Library to learn the basics! We''ll cover beginner stitches such as slip knot, chain stitch and single crochet. Yarn provided. Crochet hook supplies are limited; participants are encouraged to bring their own crochet hooks if possible. We''ll be working with hooks E, G or H (3.5mm-5mm) and medium worsted yarn. Registration required: https://ow.ly/UZbp50ZqVy6 @garlandtxgov @choosegarlandisd" [ref=f16e57]'
