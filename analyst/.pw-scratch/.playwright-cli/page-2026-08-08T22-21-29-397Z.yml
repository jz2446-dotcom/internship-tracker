          - heading "Summary" [level=2] [ref=f226e33]
          - paragraph [ref=f226e35]: Northrop Grumman internships offer hands-on experience from day one, mentorship, and broad networking, with 71% interns converting to full-time roles supporting diverse STEM career pathways.
        - generic [ref=f226e36]:
          - heading "Key Takeaways" [level=2] [ref=f226e37]
          - list [ref=f226e39]:
            - listitem [ref=f226e40]: Internships at Northrop Grumman provide practical experience and strong career pathways, with most interns becoming full-time employees.
            - listitem [ref=f226e41]: Early immersion in real projects with mentorship reflects Northrop Grumman’s commitment to developing future technical leaders.
    - generic [ref=f226e44]:
