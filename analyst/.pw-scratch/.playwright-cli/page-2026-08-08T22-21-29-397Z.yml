        - paragraph [ref=f226e115]: Your internship at Northrop Grumman can give you the practical knowledge that will make your education come to life. You’ll be taking what you know and making a difference immediately. With the potential to become a full time Northrop Grumman employee, you’ll also earn benefits like tuition assistance and educational reimbursement.
