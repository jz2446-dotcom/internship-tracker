      - generic [ref=f226e52]:
        - heading "Internships that Challenge Convention from the Start" [level=2] [ref=f226e53]
        - generic [ref=f226e55]:
          - heading [level=4] [ref=f226e56]:
            - strong [ref=f226e57]: Hands-On from Day 1
          - paragraph [ref=f226e58]: You’ve got a lot of choices ahead of you. Practical experience. Building your network. Growth opportunities. When you become an intern at Northrop Grumman, you’ll contribute from your first day on a wide range of projects – some with high visibility, others with a low profile. While getting hands-on experience you might discover an interest you didn’t know you had.
          - paragraph [ref=f226e59]: From science, technology and engineering, there are so many career possibilities here that we challenge you to find a field we don’t have. Your internship with us will be your first step toward a career of pushing the boundaries of possible.
          - paragraph [ref=f226e60]: While you’re exploring your interests, you’ll have the flexibility, mentorship and support to become the best at what you do.
          - paragraph [ref=f226e61]:
            - text: Stay up to date on job openings, events and our amazing people by joining our talent community. We’ll also let you know when our 2023 internship positions are posted, which occurs throughout the fall and spring.
