          - heading "Internship Program" [level=3] [ref=f1349e26]
          - paragraph [ref=f1349e27]: Shopify offers 4-month paid Engineering internships that are open to students, recent graduates, and those early in their careers.
          - link "Learn more about our Internship Program" [ref=f1349e30] [cursor=pointer]:
            - /url: https://internships.shopify.com/
        - generic [ref=f1349e31]:
          - heading "APM Program" [level=3] [ref=f1349e32]
          - paragraph [ref=f1349e33]: Shopify’s 12-month Apprentice Product Manager program is designed to help you gain the skills needed to start a product management career.
          - link "Learn more about our APM Program" [ref=f1349e36] [cursor=pointer]:
            - /url: https://apm.shopify.com
        - generic [ref=f1349e37]:
          - heading "Design Apprentice Program" [level=3] [ref=f1349e38]
          - paragraph [ref=f1349e39]: Shopify's 6-month Design Apprentice Program pairs early-career designers with senior mentors through two rotations. Built for new graduates, career switchers, and those early in their design careers.
          - link "Learn more about our Design Apprentice Program" [ref=f1349e42] [cursor=pointer]:
