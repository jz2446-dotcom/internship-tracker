      - paragraph [ref=f21e196]: © 2026 Cerberus Capital Management, L.P. Assets Under Management ("AUM") is as of March 31, 2024. The AUM referenced represents the total Cerberus-managed funds' AUM, excluding co-investments, but, depending on the type of fund, the AUM calculation would vary. For unlevered commitment funds in their investment period, AUM represents equity commitments, and during those funds' post-investment period AUM represents, either adjusted cost or NAV, depending on the fund. The AUM of each multi-strategy fund is assigned across the relevant strategies in proportion to the percent of market value of the investments in the various strategies. For commitment funds with fund level leverage, AUM during the funds' investment period is calculated based on equity commitments plus outstanding leverage and in the post-investment period based on NAV plus outstanding leverage. Outstanding leverage excludes subscription facilities. For evergreen funds, AUM represents NAV. HR data as of May 1, 2024, unless noted otherwise. There can be no assurances that any of these professionals will remain with the Firm. Descriptions herein of the Cerberus advantage are subject to a number of key assumptions regarding market conditions and the ability to attain investment objectives. There can be no guarantee that the investment strategy for any Cerberus-managed fund will be successful or that any of the advantages identified above will be realized to the benefit of any Cerberus-managed fund.