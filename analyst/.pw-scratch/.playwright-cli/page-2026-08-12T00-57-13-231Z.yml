        - heading "Applicants with Disabilities" [level=3] [ref=f23e229]
        - paragraph [ref=f23e230]: PIMCO is an Equal Employment Opportunity/Affirmative Action employer. We provide reasonable accommodation for qualified individuals with disabilities, and disabled veterans, in job application procedures. If you have any difficulty using our online system and you need an accommodation due to a disability, you may contact us at 949-720-7744 and leave a message. This is a dedicated line designed exclusively to assist disabled job seekers whose disability prevents them from being able to apply online. Only messages left for this purpose will be considered. A response to your request may take up to two business days.
