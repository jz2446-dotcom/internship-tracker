              - text: with a project to make sure associates were up to date on their training.
            - paragraph [ref=f154e89]: “The uncertainty in the journey is embraced,” Robby said. “From day one, Capital One has told us to explore and find things that give you joy.”
            - paragraph [ref=f154e90]:
              - strong [ref=f154e91]: We’re excited to help
            - paragraph [ref=f154e92]:
              - text: During the Technology Internship Program, Cayla has received help from plenty of resources and teammates to learn about back-end and front-end development, along with machine learning. Colleagues and leaders encourage her curiosity, always welcome questions and take the time to teach her. Resources like
              - link "Tech College" [ref=f154e93] [cursor=pointer]:
                - /url: https://www.capitalonecareers.com/developing-cutting-edge-skills-with-tech-college-tech-cdev
              - text: —our engineer-designed, and associate-led, learning platform with thousands of free courses—boost her skills.
            - paragraph [ref=f154e94]: “My team is open and receptive to my questions while I’m familiarizing myself with tech stacks and product strategies,” Cayla said. “People here are so nice, knowledgeable and want to see you succeed. My voice and experience feel important to them.”
            - paragraph [ref=f154e95]: Matthew finds the same support and learning opportunities in the Product Development Internship Program. While he assists in developing servicing solutions for other teams, Matthew often turns to his colleagues to understand their best practices. He’s also used Product College, an in-house resource, to learn and to connect with product managers outside his team.
            - paragraph [ref=f154e96]: “I have a dream to lead a team of developers, designers and business experts to create transformative products that benefit many people around the world,” Matthew said. “Everyone at Capital One is willing to help me take the time to get there. I feel included.”
            - paragraph [ref=f154e97]: Xiomara hopes to one day work at the United Nations or World Bank to reform international finance and lending involving developing countries. Her participation in the Management Internship Program will help her understand the business side of banking, as she gets to meet with associates working in Card, Risk and Emerging Platforms.
            - paragraph [ref=f154e98]: “My experience with Card Risk will help me understand how processes are documented, what regulations are applicable to different business decisions and how expansive regulations are in regards to lending and banking,” Xiomara said. “People are so accommodating in my learning.”
            - paragraph [ref=f154e99]:
              - strong [ref=f154e100]: We want you to be yourself
