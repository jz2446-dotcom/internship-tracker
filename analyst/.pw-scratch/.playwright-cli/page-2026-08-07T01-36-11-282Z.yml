              - generic [ref=f154e86]: Meanwhile, Robby is still searching for his dream job. He sees his work with the Management Internship Program as a valuable way to add value to his team and explore career paths. He’s worked on data sets that help advance automation products. He had one-on-one meetings with executives in product and card teams. He assisted a
