                - text: company's culture
                - generic [ref=f154e103]: (opens in new window)
              - text: played an even more important factor in her return.
            - paragraph [ref=f154e104]: “I always assumed the corporate world was dull, but that’s not the case here,” Megan said. “Capital One has so much personality. Individuality is encouraged. They want us to have diverse perspectives and bring our ideas forward.”
            - paragraph [ref=f154e105]: Allie, who’s in the Cyber Security Internship Program was immediately put at ease when she saw how many other women and people of color were working in Tech and part of the internship program.
            - paragraph [ref=f154e106]: “There are so many different people working with varied identities and education backgrounds,” Allie said. “That’s not something I’ve experienced in other internships. That pushed me to get out of my shell to reach out, learn and take stepping stones for my career. I’m in awe.”
