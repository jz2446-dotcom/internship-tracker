                  - generic [ref=f1144e152]: The Museum of Modern Art is currently accepting applications for a Curatorial Assistant in the Department of Painting and Sculpture with a focus on African Modernism. MoMA is the repository of the world’s largest and most inclusive collection of modern painting and sculpture, comprising some 4,000 works dating from the late nineteenth century to the present day. The Painting and Sculpture Department produces a rigorous and innovative program of acquisitions, exhibitions and scholarship. Assists senior curators in all areas of responsibilities, including administrative work in the context of curatorial functions such as research for exhibitions and publications, loans, acquisitions, collections records, bibliographic and biographical records and files, and general curatorial inquiries.
