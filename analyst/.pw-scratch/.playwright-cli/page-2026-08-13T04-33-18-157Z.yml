                  - generic [ref=f1144e182]: The Museum of Modern Art is currently accepting applications for a Petrie Fellow. Working under the Division of Young Learners within the Department of Learning and Engagement, the Petrie Fellow supports the planning, administration, and facilitation of Young Learners programs and initiatives with a focus on Teen Programs. In supporting Teen Programs, the Fellow will be exposed to the process by which MoMA’s Teen Programs are developed and executed, including best practices in teaching and facilitating teens, working with living artists to create programs for young audiences, administration, event and program coordination, and project management. This is a two-year grant funded position.
