              - strong [ref=f46e233]: encouraging and valuing inclusivity
              - text: because every partner contributes unique perspectives.
        - generic [ref=f46e235]:
          - generic [ref=f46e236]:
            - heading "Are we for you?" [level=2] [ref=f46e237]
            - paragraph [ref=f46e238]: As an organization we know the value of a strong culture dedicated to the emotional and physical well-being of our employees. Learn more about our commitment to our employee’s health and happiness below.
          - generic [ref=f46e239]:
            - generic [ref=f46e240]:
              - img "background image" [ref=f46e242]
              - generic [ref=f46e243]:
                - heading "Culture of partnership" [level=4] [ref=f46e244]
                - paragraph [ref=f46e245]: We believe diverse teams with unique backgrounds, skills and experiences yield more innovative solutions.
                - link "Learn more" [ref=f46e246] [cursor=pointer]:
                  - /url: /commitments/connecting-people-with-opportunity
            - generic [ref=f46e247]:
              - img "background image" [ref=f46e249]
              - generic [ref=f46e250]:
                - heading "Community leadership" [level=4] [ref=f46e251]
                - paragraph [ref=f46e252]: We offer both employee giving programs and funding to nonprofit organizations to make a positive impact on the communities where we live and work.
                - link "Learn more" [ref=f46e253] [cursor=pointer]:
                  - /url: /commitments/community-leadership
            - generic [ref=f46e254]:
              - img "background image" [ref=f46e256]
              - generic [ref=f46e257]:
                - heading "Benefits" [level=4] [ref=f46e258]
                - paragraph [ref=f46e259]: At Piper Sandler we do our best to attract and retain high quality talent. We know our employee's worth and we compensate them accordingly.
                - link "Learn more" [ref=f46e260] [cursor=pointer]:
                  - /url: /careers/benefits
        - generic [ref=f46e262]:
          - generic [ref=f46e263]:
            - heading "Employee resource groups" [level=2] [ref=f46e264]
            - paragraph [ref=f46e265]: "Our employee resource groups support engagement and connection for all employees. Each network is open to all and employees are encouraged to join any that are of interest. The firm has cultivated the following networks:"
          - generic [ref=f46e266]:
            - generic [ref=f46e268]:
              - heading "Multicultural Network" [level=4] [ref=f46e269]
              - paragraph [ref=f46e270]: To proactively help Piper Sandler unlock the power of multicultural diversity and inclusion by promoting racial and cultural awareness within our firm and our communities.
            - generic [ref=f46e272]:
              - heading "Pride Network" [level=4] [ref=f46e273]
              - paragraph [ref=f46e274]: The Pride Network is dedicated to fostering the inclusion of LGBTQ+ employees and their allies through awareness, education, empowerment, and involvement with the communities in which we live and work.
            - generic [ref=f46e276]:
              - heading "Veterans Network" [level=4] [ref=f46e277]
              - paragraph [ref=f46e278]: The Veterans Network supports former military personnel within and beyond Piper Sandler. This group serves as an internal resource for community engagement, training, events and recruiting initiatives, as well as to assist veterans in their transition to the corporate workforce.
            - generic [ref=f46e280]:
              - heading "Women's Network" [level=4] [ref=f46e281]
              - paragraph [ref=f46e282]: The Women’s Network is an inclusive, companywide network designed to foster gender equality through networking, career development, philanthropy and informal mentorship.
            - generic [ref=f46e284]:
              - heading "Young Professionals Network" [level=4] [ref=f46e285]
              - paragraph [ref=f46e286]: YPN provides a forum for employees to develop professionally, build lasting connections, foster collaboration across the firm, and enrich the communities in which we live and work.
        - generic [ref=f46e290]:
          - heading "Our Guiding Principles" [level=3] [ref=f46e291]
          - paragraph [ref=f46e292]: We create and implement superior financial solutions for our clients. Serving clients is our fundamental purpose. We earn our clients’ trust by delivering the best guidance and service. Great people working together as a team are our competitive advantage.
          - paragraph [ref=f46e293]: "As we serve, we are committed to these core values:"
          - list [ref=f46e294]:
            - listitem [ref=f46e295]: Always place our clients’ interests first
            - listitem [ref=f46e296]: Conduct ourselves with integrity and treat others with respect
            - listitem [ref=f46e297]: Work in partnership with our clients and each other
            - listitem [ref=f46e298]: Maintain a high-quality environment that attracts, retains and develops the best people
            - listitem [ref=f46e299]: Contribute our talents and resources to serve the communities in which we live and work
          - paragraph
