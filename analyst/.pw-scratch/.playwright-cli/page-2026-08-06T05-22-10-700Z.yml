          - generic [ref=f46e188]:
            - generic [ref=f46e189]:
              - heading "More than a 130-year legacy" [level=3] [ref=f46e192]
              - paragraph [ref=f46e193]: Founded in 1895, Piper Sandler has been helping clients achieve their goals for over 130 years.
            - generic [ref=f46e194]:
              - heading "Publicly traded" [level=3] [ref=f46e197]
              - paragraph [ref=f46e198]: As a public company with a $6.5 billion market capitalization (as of January 2026), Piper Sandler trades on the NYSE under the ticket PIPR. As an employee, you have the potential to earn stock awards.
            - generic [ref=f46e199]:
              - heading "1,850+ employees" [level=3] [ref=f46e202]
              - paragraph [ref=f46e203]: As a human capital business, we realize our most valuable assets are the people we hire. We are firm believers in the importance of a strong, highly productive culture that empowers employees to achieve their professional and personal goals.
            - generic [ref=f46e204]:
              - heading "60+ global offices" [level=3] [ref=f46e207]
              - paragraph [ref=f46e208]:
                - text: Piper Sandler has more than
                - link "60 offices" [ref=f46e209] [cursor=pointer]:
                  - /url: /locations
                - text: across the United States as well as international offices in London, Aberdeen, Zurich, Munich and Hong Kong. We're headquartered in Minneapolis, Minnesota, and pride ourselves on being a Wall Street bank with midwest values.
