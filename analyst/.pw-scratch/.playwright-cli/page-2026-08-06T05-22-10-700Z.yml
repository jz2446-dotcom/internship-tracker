          - heading "Our culture" [level=3] [ref=f46e222]
          - list [ref=f46e223]:
            - listitem [ref=f46e224]:
              - text: Our 130+ year legacy has perpetuated because of the
              - strong [ref=f46e225]: partnerships we forge
              - text: — among our clients, our employees and the communities where we live and work.
            - listitem [ref=f46e226]:
              - text: Our
              - strong [ref=f46e227]: empowered entrepreneurial culture
              - text: recognizes the value of our individual employees and gives them the flexibility to pursue opportunities.
            - listitem [ref=f46e228]:
              - text: We are
              - strong [ref=f46e229]: collaborative, not prescriptive
              - text: across teams rendering unique solutions.
            - listitem [ref=f46e230]:
              - text: Our teams are
              - strong [ref=f46e231]: intelligent and industrious
