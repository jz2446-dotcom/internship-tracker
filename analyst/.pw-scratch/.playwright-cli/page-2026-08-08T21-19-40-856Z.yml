                  - generic [ref=f224e364]:
                    - text: Overview
                    - paragraph [ref=f224e366]: Microsoft Industry Solution - Global Center for Innovation and Delivery (GCID) delivers end-to-end solutions by enabling accelerated adoption and productive use of Microsoft technologies. An organization of well over 1000+ exceptional people, MS GCID presents a great opportunity for highly skilled services professionals to make a foray into consulting, solution development and delivery roles. The ideal consultant is passionate about technology, has breadth rather than specific product depth, and has the drive and courage to articulate and stand up for a great solution delivering true value for the client.
                    - paragraph [ref=f224e368]: As a Microsoft consultant, you will deliver quality engagements with your expertise, either as an advisor, reviewer, contributor, or resource in high profile projects to ensure customer value. The ideal candidate must have the ability to combine their technical skills, creativity, and customer focus to deliver great solutions to the customers and ensure they get the best out of our technologies and solutions. Consulting Delivery professionals bring subject matter and solution expertise to architectural teams, customers, and partners. They apply deep technical and business knowledge to accelerate the adoption of Microsoft devices and services by ensuring strategic, architectural, and operational alignment to customer and partner
                    - text: Responsibilities
                    - list [ref=f224e370]:
                      - listitem [ref=f224e371]:
                        - paragraph [ref=f224e372]: As a full Stack Infrastructure Consultant, design, build, and optimize endtoend cloud and onpremises infrastructure solutions, ensuring secure, scalable, and highperforming environments across the entire technology stack.
                    - list [ref=f224e374]:
                      - listitem [ref=f224e375]:
                        - paragraph [ref=f224e376]: Responsible for technical quality assurance, identification, and mitigation of technical risk across customer or partner deliverables delivery technology strategy aligned solutions
                    - list [ref=f224e378]:
                      - listitem [ref=f224e379]:
                        - paragraph [ref=f224e380]: Applies technical experience and industry-specific knowledge to develop solutions, based on an analysis of how the proposed approach affects the business objectives of customers and partners.
                    - list [ref=f224e382]:
                      - listitem [ref=f224e383]:
                        - paragraph [ref=f224e384]: Applies information-compliance and assurance policies to ensure stakeholder confidence.
                    - list [ref=f224e386]:
                      - listitem [ref=f224e387]:
                        - paragraph [ref=f224e388]: Identifies new processes and innovations to help customers or partners build and accelerate capabilities by using Microsoft technologies.
                    - list [ref=f224e390]:
                      - listitem [ref=f224e391]:
                        - paragraph [ref=f224e392]: Identifies the best practice approach for a project, across a wide scope of technical issues, and develops or reuses intellectual capital with customers, world-wide, and for programs and initiatives across Microsoft.
                    - list [ref=f224e394]:
                      - listitem [ref=f224e395]:
                        - paragraph [ref=f224e396]: Defines engagements and opportunities to use Intellectual Property (IP) and address product gaps, while leveraging existing IP and community resources to ensure consistency and improve predictability.
                    - text: Qualifications
                    - list [ref=f224e398]:
                      - listitem [ref=f224e399]:
                        - paragraph [ref=f224e400]: 10+ years of industry experience with a minimum of 3+ years of Azure Infrastructure experience
                    - list [ref=f224e402]:
                      - listitem [ref=f224e403]:
                        - paragraph [ref=f224e404]: Bachelor’s degree in computer science, Engineering, or equivalent professional experience; advanced technical certifications or higher education preferred.
                    - list [ref=f224e406]:
                      - listitem [ref=f224e407]:
                        - paragraph [ref=f224e408]: Mandatory Microsoft Azure Administrator certification (AZ104); Azure Solutions Architect Expert (AZ305) highly preferred.
                    - list [ref=f224e410]:
                      - listitem [ref=f224e411]:
                        - paragraph [ref=f224e412]: Terraform Associate certification strongly valued, with proven experience in InfrastructureasCode (IaC) automation.
                    - list [ref=f224e414]:
                      - listitem [ref=f224e415]:
                        - paragraph [ref=f224e416]: Cloud AI certification such as Microsoft Azure AI Fundamentals (AI‑900) or equivalent is a strong advantage, with practical understanding of AI/ML workloads on cloud platforms.
