                  - strong [ref=f721e138]: Internship recruitments at the County may close at any time at the discretion of the Agency.
                  - text: EMAIL NOTIFICATIONEmail is the primary form of notification during the recruitment process. Please ensure your correct email address is included in our application and use only one email account.
                  - strong [ref=f721e139]: "NOTE: User accounts are established for one person only and should not be shared with another person. Multiple applications with multiple users may jeopardize your status in the recruitment process for any positions for which you apply."
                  - text: Candidates will be notified regarding their status as the recruitment proceeds via email through the GovernmentJobs.com site. Please check your email folders, including spam/junk folders, and/or accept emails ending with "governmentjobs.com" and "ocgov.com." If your email address should change, please update your profile at
