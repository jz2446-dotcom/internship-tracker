              - definition [ref=f721e113]:
                - paragraph
                - generic [ref=f721e115]:
                  - generic [ref=f721e116]:
                    - img "Position" [ref=f721e117]
                    - text: Position
                  - strong [ref=f721e118]: Accounting Intern (Unpaid Intern)
                - strong [ref=f721e120]: Auditor-Controller's Office
                - strong [ref=f721e123]:
                  - emphasis [ref=f721e124]: Applications will be accepted year round on a continuous basis.
                - generic [ref=f721e126]:
                  - text: "Auditor ControllerThe Auditor-Controller's Office provides professional accounting services to many clients and stakeholders while also meeting numerous legal mandates. Our customer focus includes the public, County departments/agencies and employees, individuals, vendors, and other governmental agencies.THE OPPORTUNITYDuties may include, but are not limited to: Extract, input or scan information into the County's imaging system and/or accounting and personnel system; data mine using Electronic Report Management Imagining system (ERMI); access the department's computerized systems, through Access, Excel and/or Word; and input general information into various systems. Duties may also include matching documents, memos and ledger sheets, and/or reviewing and analyzing financial reports, journal vouchers, accounting transactions, legal opinions, government codes and the County's Chart of Accounts. EDUCATIONAL REQUIREMENTS"
                  - generic [ref=f721e127]:
                    - generic [ref=f721e128]:
                      - text: Applicants must currently be enrolled in an accredited college/university majoring in
                      - strong [ref=f721e129]: accounting or finance.
                    - text: Recent graduates (within 6 months) who have completed their degree in one of the above fields are also eligible to apply.
                  - text: SKILLS AND QUALIFICATIONSThe department is seeking students or recent graduates who express a sincere interest in a career in the accounting division of a large governmental agency. The position is best suited for applicants with a concentration in accounting. Experience with Microsoft Office Suite and calculator is a plus. Previous office experience is preferred.TIME COMMITMENTThe internship is
                  - strong [ref=f721e130]: in-person only
                  - text: . Minimum 10 – 20 hours per week for 10 - 12 weeks. Hours must be scheduled during normal business hours (Monday – Friday between 8 a.m. and 5 p.m.). Applicants able to schedule the maximum hours/duration listed for the internship typically gain a more in-depth experience.BENEFITS AVAILABLE TO INTERNAlthough this is an unpaid internship that does not lead to permanent employment or include employee benefits, students and recent graduates are offered an excellent opportunity to build their resumes, develop career skills and apply academic knowledge, network with professionals in their fields of interest and explore career options with the Auditor-Controller's Office and other County of Orange agencies/departments.APPLICATION PROCEDUREApplicants must attach a cover letter, resume, and unofficial transcripts to their application. The cover letter is an opportunity for students to describe career and academic goals, to elaborate upon personal and academic accomplishments, and to identify what type of internship experience they are seeking. Learn more about what to include in a cover letter
                  - link "HERE" [ref=f721e131] [cursor=pointer]:
                    - /url: https://hrs.ocgov.com/page/cover-letter-procedures
                  - text: .
                - generic [ref=f721e133]: Applications that do not include a cover letter, resume, and unofficial transcripts will not be considered.REQUIRED BACKGROUND SCREENING/REFERENCE CHECKThe background screening requires the applicant's full legal name, date of birth, address and U.S. Social Security number. Turn-around time for the background screening is approximately 72 hours.
                - paragraph
