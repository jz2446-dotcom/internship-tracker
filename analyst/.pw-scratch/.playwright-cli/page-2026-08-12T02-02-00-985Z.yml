        - generic [ref=f869e43]: Description
        - generic [ref=f869e44]:
          - paragraph [ref=f869e45]:
            - strong [ref=f869e47]: ABOUT CITY FIRST ENTERPRISES
          - paragraph [ref=f869e48]: City First Enterprises (CFE) is a certified Community Development Financial Institution (CDFI) specializing in flexible lending for affordable housing, commercial real estate, small businesses, nonprofits, and clean energy projects. With a mission to create financial solutions to support people and communities in achieving their economic aspirations, we envision a future where all individuals and communities thrive through access to capital.
          - paragraph [ref=f869e49]
          - paragraph [ref=f869e50]: CFE, headquartered in Washington, DC, with a core market focus on the DMV metro region and the broader Mid-Atlantic, partners nationwide to deliver tailored financial solutions that advance economic opportunity.
          - paragraph [ref=f869e51]
          - paragraph [ref=f869e52]:
            - text: To learn more about our organization, please visit our site at
            - link "City First Enterprises" [ref=f869e53] [cursor=pointer]:
              - /url: https://www.cfenterprises.org/
            - text: .
          - paragraph [ref=f869e54]
          - paragraph [ref=f869e55]:
            - strong [ref=f869e57]: THE POSITION
          - paragraph [ref=f869e58]: City First Enterprises (CFE) seeks an experienced Chief Credit Officer (CCO) to lead the organization's credit risk management, underwriting, portfolio oversight, and credit governance. Reporting to the CEO and serving on the senior leadership team, the CCO owns CFE's credit policies, underwriting standards, approval processes, risk-rating discipline, and reporting on loan portfolio status to leadership and the board, safeguarding the quality of CFE's growing loan portfolio while enabling responsible capital deployment in historically disinvested communities. The role partners closely with lending originations, portfolio management, finance, operations, and impact teams to keep lending aligned with CFE's mission, risk appetite, funder and investor requirements, and financial sustainability.
          - paragraph [ref=f869e59]
          - paragraph [ref=f869e60]: The ideal candidate is a practical, strategic credit executive with deep experience in commercial lending, community development finance, and affordable housing and/or commercial real estate finance. Experience in small business lending, nonprofit lending, clean energy finance, or community banking is a plus but not required. The ideal candidate brings strong technical credit judgment, policy discipline, analytical rigor, and collaborative leadership, and balances prudent risk management with a flexible, borrower-centered community development lending approach.
          - paragraph [ref=f869e61]
          - paragraph [ref=f869e62]: This role requires a minimum of 2 days/week in our downtown office, with flexibility for additional on-site days as needed. Occasional travel required for external partner and client meetings and events.
          - paragraph [ref=f869e63]
          - paragraph [ref=f869e64]:
            - strong [ref=f869e66]: ESSENTIAL FUNCTIONS AND RESPONSIBILITIES
          - paragraph [ref=f869e67]:
            - strong [ref=f869e68]: Credit Strategy, Policy, and Risk Appetite
          - list [ref=f869e69]:
            - listitem [ref=f869e70]: Lead CFE's commercial credit function as the primary executive owner of credit policy, underwriting standards, approval authorities, risk-rating methodology, and credit governance.
            - listitem [ref=f869e71]: Translate CFE's strategic goals, capital sources, and risk appetite into clear credit policies, underwriting guidance, exception protocols, and approval thresholds.
            - listitem [ref=f869e72]: Partner with senior leadership team to align lending growth with credit quality, capital deployment goals, and financial sustainability.
            - listitem [ref=f869e73]: Monitor emerging risks, market conditions, and concentration trends, and recommend timely credit guardrails and policy updates.
          - paragraph [ref=f869e74]:
            - strong [ref=f869e75]: Underwriting, Approval, and Transaction Review
          - list [ref=f869e76]:
            - listitem [ref=f869e77]: Oversee underwriting quality and credit analysis across CFE's lending, including affordable housing, commercial real estate, small business and nonprofit lending, community facilities, and clean energy.
            - listitem [ref=f869e78]: Review and recommend transactions for credit approval, partnering with loan committee members and senior leadership to ensure well-reasoned, timely credit decisions across all approval tiers.
            - listitem [ref=f869e79]: Ensure credit memoranda are complete and decision-ready, grounded in borrower capacity, project feasibility, cash flow, collateral, repayment sources, and mission alignment.
            - listitem [ref=f869e80]: Provide hands-on guidance to lenders, underwriters, and portfolio managers on complex credits, exceptions, workouts, and higher-risk transactions.
            - listitem [ref=f869e81]: Maintain disciplined standards for pricing, terms, collateral, covenants, and documentation while preserving CFE's ability to provide flexible capital where it is most needed.
            - listitem [ref=f869e82]: Partner with external counsel and lending teams to oversee loan closing, ensuring all documentation and conditions are satisfied before funding.
          - paragraph [ref=f869e83]:
            - strong [ref=f869e84]: Underwriting Innovation and Credit Technology
          - list [ref=f869e85]:
            - listitem [ref=f869e86]: Methodically modernize CFE's underwriting and credit practices by identifying and responsibly deploying artificial intelligence and advanced data tools that strengthen analysis, automate routine review, and speed decisioning. This will be done in close coordination with and with full support from the rest of the leadership team.
            - listitem [ref=f869e87]: Pilot and scale AI-enabled capabilities — such as automated document and financial-statement analysis, cash-flow spreading, and risk scoring — while preserving rigorous, mission-aligned credit judgment.
            - listitem [ref=f869e88]: Establish governance and controls for the use of AI in credit, including data quality, model validation, fair-lending and bias review, explainability, and human oversight.
          - paragraph [ref=f869e89]:
            - strong [ref=f869e90]: Portfolio Risk Management and Asset Quality
          - list [ref=f869e91]:
            - listitem [ref=f869e92]: Ensure portfolio soundness through proactive monitoring of risk ratings, delinquencies, covenant compliance, and watchlist credits.
            - listitem [ref=f869e93]: Lead regular portfolio reviews, trend analysis, and stress considerations that surface emerging issues and sector concentrations early.
            - listitem [ref=f869e94]: Work closely with the portfolio management team on implementation of the allowance for credit losses (CECL) methodology and reserve adequacy, in partnership with finance and external auditors.
            - listitem [ref=f869e95]: In close collaboration with leadership team, work on troubled credits, including workouts, restructurings, modifications, and charge-offs, working with internal teams and external counsel as needed.
            - listitem [ref=f869e96]: Partner with portfolio management, servicing, and finance to keep portfolio data accurate and audit- and diligence-ready.
          - paragraph [ref=f869e97]:
            - strong [ref=f869e98]: Credit Committee, Governance, and Board Reporting
          - list [ref=f869e99]:
            - listitem [ref=f869e100]: Lead and continuously improve credit committee processes, from agenda setting and materials review through decision documentation and follow-up on conditions.
            - listitem [ref=f869e101]: Prepare and present clear credit, portfolio, and risk updates for senior leadership, board committees, auditors, funders, and investors.
            - listitem [ref=f869e102]: Ensure credit decisions comply with CFE policies, approval authorities, funder and investor requirements, CDFI obligations, and applicable regulatory standards.
            - listitem [ref=f869e103]: Strengthen documentation, internal controls, credit files, and covenant tracking to support transparency and audit readiness.
            - listitem [ref=f869e104]: Serve as a trusted advisor to executive leadership and the board on credit risk, portfolio performance, and responsible capital deployment.
          - paragraph [ref=f869e105]:
            - strong [ref=f869e106]: Cross-Functional Leadership and Continuous Improvement
          - list [ref=f869e107]:
            - listitem [ref=f869e108]: Partner with lending leadership to improve the quality, consistency, and borrower-centered execution of the lending process, from intake through servicing.
            - listitem [ref=f869e109]: Collaborate with impact and data staff so credit and portfolio information supports mission alignment, impact measurement, and funder reporting.
            - listitem [ref=f869e110]: Advance continuous improvement of credit tools, underwriting templates, portfolio dashboards, and reporting systems.
            - listitem [ref=f869e111]: Build credit capacity across the organization by coaching staff, clarifying decision rights, and training teams on policy and risk standards.
            - listitem [ref=f869e112]: Model CFE's values through sound judgment, transparent decision-making, and commitment to measurable community impact.
        - generic [ref=f869e113]: Requirements
        - generic [ref=f869e114]:
          - paragraph [ref=f869e115]:
            - strong [ref=f869e117]: QUALIFICATIONS, EXPERIENCE, and EDUCATION
          - list [ref=f869e118]:
            - listitem [ref=f869e119]: At least 10 years of progressive experience in credit and lending, including a minimum of 5 years in a senior credit role (e.g., senior credit officer, credit risk director, or chief credit officer) with policy and approval-authority responsibility.
            - listitem [ref=f869e120]: "Depth in several of these areas: credit underwriting and risk management, portfolio management, commercial lending, community development finance, affordable housing or real estate finance, or small business and nonprofit lending."
            - listitem [ref=f869e121]: Demonstrated success leading credit policy, underwriting standards, transaction review, and credit governance in a CDFI, loan fund, community bank, or similarly mission-driven institution.
            - listitem [ref=f869e122]: Strong technical credit expertise, including cash-flow analysis, borrower and guarantor analysis, collateral and project-feasibility evaluation, loan structuring, covenants, and risk ratings.
            - listitem [ref=f869e123]: Experience reviewing and approving complex loans and presenting clear recommendations to loan committees, boards, funders, or regulators.
            - listitem [ref=f869e124]: Working knowledge of the allowance for credit losses (CECL) methodology, reserve adequacy, and related portfolio-risk reporting.
            - listitem [ref=f869e125]: Interest in, and ideally experience with, applying artificial intelligence or advanced data tools to underwriting and credit, along with an understanding of the associated model-risk, fair-lending, and governance considerations.
            - listitem [ref=f869e126]: Excellent analytical and communication skills, including the ability to prepare concise executive- and board-level materials and explain complex credit issues clearly.
            - listitem [ref=f869e127]: Collaborative leadership style, building trust across lending, finance, operations, portfolio management, impact, and executive teams.
            - listitem [ref=f869e128]: Familiarity with CDFI Fund requirements, public or philanthropic capital programs, or clean energy and community facilities finance is a plus.
            - listitem [ref=f869e129]: Knowledge of the Washington, DC, and Baltimore metropolitan markets, or experience lending in comparable urban markets affected by historic disinvestment, is preferred.
            - listitem [ref=f869e130]: Demonstrated commitment to CFE's mission of expanding equitable access to capital in communities historically affected by discrimination, disinvestment, and redlining.
            - listitem [ref=f869e131]: Bachelor's degree or equivalent experience required; advanced degree in finance, business, real estate, public administration, community development, or a related field preferred.
          - paragraph [ref=f869e132]
          - paragraph [ref=f869e133]:
            - strong [ref=f869e135]: COMPENSATION
          - paragraph [ref=f869e136]: In addition to a competitive salary range of $160,000–$200,000, commensurate with experience. CFE offers a generous benefits package that includes employee-sponsored health, dental, and vision insurance; life insurance; a health savings account with annual employer contributions; a retirement plan with employer matching; and a generous paid time off program.
          - paragraph [ref=f869e137]
          - paragraph [ref=f869e138]:
            - strong [ref=f869e139]: "Our robust benefits package includes:"
          - paragraph [ref=f869e140]: 403(b) with employer match
          - paragraph [ref=f869e141]: Medical, dental, and vision insurance with employer contribution
          - paragraph [ref=f869e142]: $2,800 annual HSA employer contribution for a family; $1,400 for an individual
          - paragraph [ref=f869e143]: 16 PTO days to start; more after three years
          - paragraph [ref=f869e144]: 13 paid holidays
          - paragraph [ref=f869e145]: 7 paid sick days
          - paragraph [ref=f869e146]: Paid Winter Break
          - paragraph [ref=f869e147]: Employer-paid short-term and long-term disability insurance
          - paragraph [ref=f869e148]: A minimum of two in-office days per week is expected (subject to change)
          - paragraph [ref=f869e149]: Paid commuter benefits
          - paragraph [ref=f869e150]: Professional development benefit
          - paragraph [ref=f869e151]: Employer-paid life insurance
        - generic [ref=f869e152]: Salary Description
        - generic [ref=f869e153]: Annual salary range of $160,000–$200,000
