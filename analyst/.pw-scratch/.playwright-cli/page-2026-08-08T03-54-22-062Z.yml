            - emphasis [ref=f116e79]: Qualifications
            - list [ref=f116e80]:
              - listitem [ref=f116e81]:
                - emphasis [ref=f116e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f116e83]:
                - emphasis [ref=f116e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f116e85]:
                - emphasis [ref=f116e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f116e87]:
                - emphasis [ref=f116e88]: Must be a team player with a “no job is too big or too small attitude”
              - listitem [ref=f116e89]:
