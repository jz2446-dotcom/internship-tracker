                - paragraph [ref=f22e108]:
                  - strong [ref=f22e109]: Victoria Terevinto Cuello
                  - text: Future Builder InternClass of 2024
              - paragraph [ref=f22e111]: "\"My internship at Lennar has been an overall incredible experience and has allowed me to gain invaluable knowledge under the communications department. As my second year interning here, the supportive and friendly environment has enabled me to grow professionally and personally. I am truly grateful for the hard work and dedication of the Early Careers Recruitment team, and more, whose efforts made the program possible.\""
            - generic [ref=f22e112]: Day in the Life of a Tech Intern
