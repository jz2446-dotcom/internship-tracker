        - generic [ref=f22e73]:
          - generic [ref=f22e74]:
            - generic [ref=f22e75]:
              - generic [ref=f22e76]:
                - img "Donovan" [ref=f22e77]
                - generic [ref=f22e79]:
                  - strong [ref=f22e81]: Donovan Miller
                  - generic [ref=f22e82]: Future Builder AlumClass of 2025
              - paragraph [ref=f22e84]: "\"Joining the Future Builders Program gave me invaluable experiences, mentors, and challenges that shaped the professional I am today. I’m grateful for the foundation it provided and for the chance to learn from industry leaders across multiple areas of operations. It’s the best career investment I could have made.\""
            - generic [ref=f22e85]: Day in the Life of an RCG
            - generic [ref=f22e88]:
              - generic [ref=f22e89]:
                - img "Amy" [ref=f22e90]
                - paragraph [ref=f22e93]:
                  - strong [ref=f22e94]: Amy Horan
                  - text: Future Builder AlumClass of 2025
              - paragraph [ref=f22e96]: "\"The Future Builders Program has given me an exceptional introduction to the construction industry after graduating from college. I have learned so much in just the first year that I experienced the different rotations and found a field that I enjoy and see real growth opportunities in.\""
