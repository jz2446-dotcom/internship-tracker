        - generic [ref=f22e50]:
          - paragraph [ref=f22e51]: Lennar’s Future Builders Program is designed to offer recent college graduates and college students a unique experience to gain valuable insight into the homebuilding industry. The program features internships and full-time roles in Homebuilding, Technology, and Corporate Functions.
          - paragraph [ref=f22e52]: The Future Builders will have the opportunity to contribute to meaningful projects and make an impact across our different lines of business.
