      - heading "CAREERS" [level=1] [ref=f1333e61]
      - generic [ref=f1333e63]:
        - generic [ref=f1333e69]:
          - paragraph [ref=f1333e70]: Since 1979, Lee & Associates has been attracting the best and brightest in the industry who share an entrepreneurial spirit and commitment to delivering world-class service through local market expertise and state-of-the-art resources. Now a powerful organization of top professionals, the company enjoys its hard-earned reputation as a top tier international commercial real estate brokerage and integrated services provider.
          - paragraph [ref=f1333e71]: Our structure makes our culture unique and attracts like-minded entrepreneurs who leverage their expertise to spur innovation and help Lee & Associates sustain a competitive advantage. As shareholders of the company this separates us from our competition and creates one common goal; to provide seamless, consistent execution and value driven market-to-market services to our clients.
        - paragraph [ref=f1333e77]:
          - link "View Career Opportunities" [ref=f1333e78] [cursor=pointer]:
            - /url: https://www.lee-associates.com/jobs/
      - generic [ref=f1333e84]:
        - paragraph [ref=f1333e85]: At Lee & Associates our culture, which is driven by entrepreneurialism that is steeped in client services, has always attracted the best and brightest in the industry. Our core values, coupled with our professional’s expertise and knowledge, have always been the foundation of our success.
        - paragraph [ref=f1333e86]:
          - text: To ensure that our clients always receive the highest level of expertise and service, we believe that continued education and training are key. In addition to our annual
          - link "Lee Summit" [ref=f1333e87] [cursor=pointer]:
            - /url: https://www.lee-associates.com/summit/
          - text: conference, each year we host both online and small group training sessions focusing on continued education for our brokerage, integrated services, marketing, IT, and administrative professionals. Lee & Associates is home to the 5
          - superscript [ref=f1333e88]: th
          - text: largest number of
          - link "Society of Industrial and Office Realtors (SIOR)" [ref=f1333e89] [cursor=pointer]:
            - /url: https://www.sior.com/
          - text: members in the world and is ranked in the top 10
          - link "Certified Commercial Investment Member (CCIM)" [ref=f1333e90] [cursor=pointer]:
            - /url: https://www.ccim.com/?gmSsoPc=1
          - text: designee companies in North America.
