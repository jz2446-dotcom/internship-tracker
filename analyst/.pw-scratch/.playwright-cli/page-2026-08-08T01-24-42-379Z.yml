            - heading "Not a Librarian?" [level=3] [ref=f303e183]
            - paragraph [ref=f303e184]: We have positions available at all levels, for a variety of positions.
            - list [ref=f303e185]:
              - listitem [ref=f303e186]:
                - strong [ref=f303e187]: Public Services Support
                - text: – Help customers and shelve materials.
              - listitem [ref=f303e188]:
                - strong [ref=f303e189]: Information Technology
                - text: – Provide technical support to library staff.
              - listitem [ref=f303e190]:
                - strong [ref=f303e191]: Administrative support
                - text: – Support staff and programs.
              - listitem [ref=f303e192]:
                - strong [ref=f303e193]: Warehouse workers
                - text: – Process and ship materials to our libraries.
              - listitem [ref=f303e194]:
                - strong [ref=f303e195]: Facilities
                - text: – Maintain library buildings.
            - paragraph [ref=f303e196]: To view a listing of current openings, please visit the County of Los Angeles Department of Human Resources Job Search page for filing instructions and an employment application. You can also call the 24-hour Job Information Hotline at 800.970.LIST (5478) to get a weekly update on open competitive job information in Los Angeles County departments.
          - link "Search Jobs" [ref=f303e198] [cursor=pointer]:
            - /url: http://hr.lacounty.gov/
        - generic [ref=f303e203]:
          - heading "Interested in becoming a Librarian?" [level=3] [ref=f303e204]
          - paragraph [ref=f303e205]:
            - text: "To work in a library as a professional librarian you must have a Master’s degree in Library and Information Science (MLIS) awarded from a school accredited by the American Library Association. There are currently three schools in Southern California that offer the MLIS:"
            - link "San Jose State University (link opens in new window)" [ref=f303e206] [cursor=pointer]:
              - /url: http://ischool.sjsu.edu/
              - text: San Jose State University
            - text: (fully online program), the
            - link "University of California, Los Angeles (link opens in new window)" [ref=f303e207] [cursor=pointer]:
              - /url: http://is.gseis.ucla.edu/
              - text: University of California, Los Angeles
            - text: ", and the"
            - link "University of Southern California (link opens in new window)" [ref=f303e208] [cursor=pointer]:
              - /url: http://librarysciencedegree.usc.edu/
              - text: University of Southern California
            - text: .
          - paragraph [ref=f303e209]: People with good written, verbal and interpersonal communications skills, a strong commitment to customer service and a desire to serve the needs of their community are perfect candidates for public librarianship.
          - paragraph [ref=f303e210]:
            - text: You can visit the
            - link "American Library Association's website (link opens in new window)" [ref=f303e211] [cursor=pointer]:
              - /url: https://www.ala.org/educationcareers
              - text: American Library Association’s website
            - text: to find more information about librarianship as a career and schools offering the MLIS in other states.
