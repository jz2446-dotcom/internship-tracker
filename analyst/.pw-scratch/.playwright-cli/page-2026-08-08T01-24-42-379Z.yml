            - heading "Join Our Team!" [level=2] [ref=f303e88]
            - paragraph [ref=f303e89]: LA County Library offers a variety of rewarding and challenging career opportunities in diverse locations throughout the County. Our commitment to excellence extends into every area of our organization, including our unique special collections and the development of new and innovative programs and services. Our full and part-time positions offer competitive salaries and comprehensive benefits packages. The Library has opportunities for advancement and professional development through workshops, conferences and ongoing training.
