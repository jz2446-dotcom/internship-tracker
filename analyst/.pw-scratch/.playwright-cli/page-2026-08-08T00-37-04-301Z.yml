            - heading "Job Description" [level=2] [ref=f2e123]
            - paragraph [ref=f2e125]:
              - text: BeZero Carbon is seeking a Ratings Analyst to research global carbon projects, engage with project developers, and contribute to the development of ratings and analytical models. Candidates should have a background in environmental sciences or climate technology, strong communication skills, and a solid research foundation. The role offers competitive salary, equity options, and benefits, with opportunities for remote work and periodic nomad working.About us:BeZero Carbon is a global ratings agency for Carbon Markets. We distribute our ratings via our SaaS Product, BeZero Carbon Markets, informing all market participants on how to price and manage risk. Our ratings and research tools support buyers, intermediaries, investors and carbon project developers.Founded in April 2020, our 190+ strong team combines climatic and earth sciences, sell-side financial research, earth observation, machine learning, data and technology, engineering, and public policy expertise. We work from four continents.Having recently raised a Series C funding round in January 2025, we’re continuing to accelerate climate action through ratings.
              - link "www.bezerocarbon.com" [ref=f2e126] [cursor=pointer]:
                - /url: http://www.bezerocarbon.com
              - text: Job Description:BeZero continues to build our Ratings team in 2025. This advert will stay live throughout the year; if it's active, we're seeking candidates!As a Ratings Analyst at BeZero, you will work at the forefront of tangible climate action, researching carbon projects globally. This could be a forestry project in the Amazon, a seagrass project in the Bahamas, a Direct Air Capture project in Iceland or a renewables project in India. You will have the opportunity to engage with project developers, attend events and even visit projects in-person as you progress in your BeZero journey. We are looking for motivated, creative and intellectually curious individuals excited by the prospect of working at an innovative climate start-up.This role will be focused on researching the science and evidence behind different types of projects. You will continue to build our database of evidence, ratings and content streams.Responsibilities• Research offset projects in Carbon Markets, collaborating with industry leaders in Climate & Earth Sciences, policy, sustainability & more.• Expand and develop our ratings & analytical models for project sectors• Curating our literature database• Writing research reports on market trends and dynamics• Attending conferences and events, representing BeZero Carbon• Working towards monthly goals through delivery of ratings, reviews and contentOur ideal candidate’s will:• Ideally, candidates will have an academic background relevant to either environmental sciences (such as Earth / Natural / Climate Sciences), or alternatively climate technology solutions (Engineering / Renewable Energy/ Carbon Removals)• This role demands strong communication skills, both written and verbal, as you will interact with internal and external stakeholders on a regular basis• Have a solid research background and analytical skills• Be comfortable speaking to high-level clients and external stakeholders• Have a strong understanding of the voluntary carbon market and the risks carbon projects faceWhat we’ll offer:• Competitive salary and equity in a rapidly growing VC-backed start-up through share options.• 25 days leave (with additional time off between Christmas and New Year, and for your birthday).• Benefits package covering private medical insurance, dental, critical illness cover, income protection, life assurance, medical cash plan and cycle to work scheme.• Health and wellness cash allowance.• Enhanced parental leave.• The opportunity to work remotely.• Regular social events.• Periodic nomad working, allowing you to work from another country.We value diversity at BeZero Carbon. We need a team that brings different perspectives and backgrounds together to build the tools needed to make the voluntary carbon market transparent. We are therefore committed to not discriminate based on race, religion, colour, national origin, sex, sexual orientation, gender identity, marital status, veteran status, age, or disability.
