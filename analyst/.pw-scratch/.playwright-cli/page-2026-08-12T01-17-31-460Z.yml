    - main [ref=f331e58]:
      - heading "Internship opportunities with Citizens Private Bank" [level=1] [ref=f331e61]
      - generic [ref=f331e65]:
        - paragraph [ref=f331e66]:
          - text: As a Private Bank intern within
          - link "Citizens Private Bank (opens in new window)" [ref=f331e67] [cursor=pointer]:
            - /url: https://www.citizensbank.com/private-banking/overview.aspx
            - text: Citizens Private Bank
            - generic [ref=f331e68]: (opens in new window)
          - text: ", you'll have the opportunity to support the Preferred Banking team and Relationship Managers in managing client relationships. Our interns shadow Private Bankers as they transition clients to the bank, while developing an understanding of the full range of deposit products and services."
        - paragraph [ref=f331e69]: In this role, you'll support Private Bankers with documentation, new client follow-up, administrative duties and assist on various special projects.
        - paragraph [ref=f331e70]: You'll gain exposure to Citizens Private Bank, helping to build and apply exceptional client-service skills and ingenuity to solve problems and enhance relationships with our clients.
      - generic [ref=f331e72]:
        - paragraph [ref=f331e73]: "Throughout your 10-week internship, you'll assist in managing client relationships, participate in weekly team meetings, and contribute to special projects and client servicing initiatives. Depending on your education, skills and experience, you may be assigned to one of the following areas:"
        - list [ref=f331e74]:
          - listitem [ref=f331e75]: Operations
          - listitem [ref=f331e76]: Relationship Management support
          - listitem [ref=f331e77]: Specialty Lending
      - generic [ref=f331e81]:
        - heading "Are you qualified?" [level=2] [ref=f331e82]
        - paragraph [ref=f331e83]: "We're looking for candidates with a background in Corporate Finance, Accounting, or a related field, as well as:"
        - list [ref=f331e84]:
          - listitem [ref=f331e85]: Strong written and verbal communication skills
          - listitem [ref=f331e86]: "Required Minimum GPA: 3.0"
          - listitem [ref=f331e87]: "Expected Graduation Date: May 2027"
      - heading "We're hiring in:" [level=2] [ref=f331e90]
      - generic [ref=f331e93]:
        - paragraph [ref=f331e96]: Menlo Park, California
        - paragraph [ref=f331e99]: Boston, Massachusetts
        - paragraph [ref=f331e102]: New York, New York
        - paragraph [ref=f331e105]: San Francisco, California
      - generic [ref=f331e107]:
        - heading "How we hire" [level=2] [ref=f331e108]
        - paragraph [ref=f331e109]:
          - text: After submitting an application, qualified intern candidates will receive notification to complete a self-guided video interview assessment within 4 days of receiving the link. If not completed within the timeframe, the application will be automatically withdrawn from consideration for our internship program.
          - link "Click here" [ref=f331e110] [cursor=pointer]:
            - /url: https://jobs.citizensbank.com/en/Video-Interview-Assessment
          - text: to learn more about what to expect, and how to best prepare. From there, qualified candidates will then move on to interview with us, to see if we’re a fit for one another.
        - link "logo Linkedin (opens in new window)" [ref=f331e112] [cursor=pointer]:
          - /url: https://www.linkedin.com/company/citizens-private-bank/
          - img "logo Linkedin" [ref=f331e113]
          - generic [ref=f331e114]: (opens in new window)
        - paragraph [ref=f331e115]:
          - text: Check out Citizens Private Bank on
          - link "LinkedIn (opens in new window)" [ref=f331e116] [cursor=pointer]:
            - /url: https://www.linkedin.com/company/citizens-private-bank/
            - text: LinkedIn
            - generic [ref=f331e117]: (opens in new window)
          - text: to see our latest news and get to know us.
        - paragraph [ref=f331e118]: Here, skills are honed, experience is one of a kind, and ambition is rewarded. If this role sounds like a fit for you, apply to join our team today!
