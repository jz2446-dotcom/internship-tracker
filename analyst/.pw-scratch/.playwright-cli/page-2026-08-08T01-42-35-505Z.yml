                    - generic [ref=f65e553]:
                      - text: Valar was founded in 2023 and is headquartered in Torrance, California, with a pilot plant in Orangeville, Utah. That Utah site is where Ward250, our research reactor, is currently operating and generating power. One of the biggest recent milestones was achieving criticality in June through the Department of Energy’s Reactor Pilot Program. At a high level, Valar’s mission is to unlock abundant, reliable energy for industrial customers — including hydrogen, next-generation manufacturing, and AI infrastructure. The way we’re doing that is by building clean, high-temperature nuclear systems that are designed to be faster to deploy, factory-made, and practical for real industrial demand. The company has moved very quickly. Ward Zero, our full-scale thermal prototype, was built in about 10 months for roughly $12 million. Valar then achieved cold criticality in November 2025, and Ward250 achieved criticality and entered power operations in June 2026. So this isn’t just a concept on paper — the team is already operating hardware and learning from it. The team is still relatively lean, about 175 employees today, so people joining now can have a meaningful impact. It’s very builder...
