                  - text: "222"
                - paragraph [ref=f65e451]:
                  - strong [ref=f65e452]: About Valar Atomics
                - paragraph [ref=f65e453]: At Valar Atomics, we're redefining what's possible in energy. Our mission is to make clean, high-temperature nuclear power scalable—unlocking abundant energy for industry, hydrogen, and next-generation manufacturing. We are a team of builders, engineers, and operators who believe nuclear energy should be fast to deploy, factory-made, and built for the real world. Our first pilot plant in Orangeville, Utah will demonstrate how advanced nuclear systems and fuel fabrication can power the future. Joining Valar Atomics means becoming part of a company where autonomy, ownership, and impact exist at every level.
                - paragraph [ref=f65e454]
                - paragraph [ref=f65e455]:
                  - strong [ref=f65e456]: The Team
                - paragraph [ref=f65e457]:
                  - generic [ref=f65e458]: As part of the
                  - generic [ref=f65e459]: Engineering
                  - generic [ref=f65e460]: organization, Fuels & Materials develops and qualifies the advanced materials and fuel technologies that form the foundation of Valar's reactor systems. The team ensures performance, reliability, and long-term durability under demanding operating conditions.
                - paragraph [ref=f65e461]
                - paragraph [ref=f65e462]:
                  - strong [ref=f65e463]: The Role
                - paragraph [ref=f65e464]: We’re seeking highly skilled and motivated Chemical Vapor Deposition Engineers to join our TRIOS manufacturing pilot line. In this role, you’ll be responsible for state-of-the-art chemical processing equipment; taking radical ownership of the system performance and operations. You’ll work closely with cross-functional teams to install, troubleshoot, and optimize pilot scale uranium processing equipment. This job is full-time in Orangeville, Utah.
                - paragraph [ref=f65e465]
                - paragraph [ref=f65e466]:
                  - strong [ref=f65e467]: Key Responsibilities
                - list [ref=f65e468]:
                  - listitem [ref=f65e469]:
                    - strong [ref=f65e470]: System Ownership
                    - text: ": Take ownership of fluidized bed/ chemical vapor deposition coater; ensuring alignment between performance targets, manufacturability, and cost."
                  - listitem [ref=f65e471]:
                    - strong [ref=f65e472]: Procedure Improvement
                    - text: ": Refine, validate, and continuously improve operating, maintenance, and troubleshooting procedures as the process transitions into production."
                  - listitem [ref=f65e473]:
                    - strong [ref=f65e474]: Process & Safety Improvement
                    - text: ": Build upon completed HAZOPs and existing safety analyses to improve operational robustness and production readiness."
                  - listitem [ref=f65e475]:
                    - strong [ref=f65e476]: Engineering Improvement
                    - text: ": Interpret existing engineering analyses and translate them into measurable improvements in process capability, reliability, and throughput."
                  - listitem [ref=f65e477]:
                    - strong [ref=f65e478]: Development Execution
                    - text: ": Develop detailed understanding and modeling of equipment operations and optimize output to meet stringent specifications."
                  - listitem [ref=f65e479]:
                    - strong [ref=f65e480]: "Yield Improvement:"
                    - text: Improve yields and throughput time.
                  - listitem [ref=f65e481]:
                    - strong [ref=f65e482]: Cross-Functional Collaboration
                    - text: ": Drive QC lab analysis to maintain development goals, process yields, and improvement planning; own data management, retention, and reporting; and partner with other functions across engineering and management."
                  - listitem [ref=f65e483]:
                    - strong [ref=f65e484]: Root Cause & Corrective Action (RCCA)
                    - text: ": Lead root-cause investigations and corrective action plans for failed or underperforming coater equipment, including coating defects, fluidization behavior, nozzle accretions, bed stagnation, and deposition variability."
                  - listitem [ref=f65e485]:
                    - strong [ref=f65e486]: Supplier & Manufacturing Interface
                    - text: ": Work closely with vendors to manage cost, timelines, manufacturing process selection, and quality control."
                  - listitem [ref=f65e487]:
                    - strong [ref=f65e488]: Design Process Development
                    - text: ": Contribute to the best internal practices for safety, documentation, and personnel management."
                - paragraph [ref=f65e489]
                - paragraph [ref=f65e490]:
                  - strong [ref=f65e491]: You Will Be Successful in This Role If
                - list [ref=f65e492]:
                  - listitem [ref=f65e493]: Demonstrate ability and eagerness learn while providing mentorship.
                  - listitem [ref=f65e494]: Achieve operational completeness of mechanical installation and documentation.
                  - listitem [ref=f65e495]: Collaborate effectively with technicians and other engineers.
                  - listitem [ref=f65e496]: Adapt to changing priorities and environments without losing sight of all tasks.
                  - listitem [ref=f65e497]: Exhibit extreme ownership, curiosity, and attention to details.
                - paragraph [ref=f65e498]:
                  - strong [ref=f65e499]
                - paragraph
                - paragraph [ref=f65e500]:
                  - strong [ref=f65e501]: Basic Qualifications
                - list [ref=f65e502]:
                  - listitem [ref=f65e503]: Direct experience with chemical vapor deposition
                  - listitem [ref=f65e504]: Bachelor’s degree in engineering or related field
                  - listitem [ref=f65e505]: Proven track record of engineering excellence
                  - listitem [ref=f65e506]: Strong knowledge of materials, manufacturing processes, and mechanical systems fluidized beds and CVD coating
                  - listitem [ref=f65e507]: Strong analytical mindset with the ability to lead root cause investigations
                  - listitem [ref=f65e508]: Experience in production environment
                  - listitem [ref=f65e509]: Experience overseeing and mentoring a team
                  - listitem [ref=f65e510]: Excellent communication, technical documentation, and leadership skills
                  - listitem [ref=f65e511]: Willingness to relocate to Emery County, Utah
                - paragraph [ref=f65e512]
                - paragraph [ref=f65e513]:
                  - strong [ref=f65e514]: Preferred Skills and Experience
                - paragraph [ref=f65e515]: List additional qualifications that are not required but would strengthen a candidate’s application.
                - list [ref=f65e516]:
