                    - /url: "#returnfootnote-1"
                - text: Extel, formerly Institutional Investor Research, announced BofA Global Research as one of the Top Global Research Firms in 2024 based on surveys held throughout the year. Extel creates rankings of the top research analysts in a wide variety of specializations, drawn from the choices of portfolio managers and other investment professionals. The 2024 Global Research Leaders ranking lists sell-side research providers by the combined total number of positions earned across Extel’s 2024 research team surveys. Results of each survey are published separately throughout the year, beginning in March 2024 with the Japan Research Team and concluding in December 2024 with the Global Fixed Income Research Team. Rankings for each poll are determined strictly by using numerical scores. Extel takes the number of votes awarded to each firm in a sector and weight it in relation to the size of the institution responding and rating it awarded. Firms are designated runners-up when their scores fall within 35 percent of the third-place scores. BofA Global Research is research produced by BofA Securities, Inc. (“BofAS”) and/or one or more of its affiliates. BofAS is a registered broker-dealer, Member SIPC, and wholly owned subsidiary of Bank of America Corporation. Rankings and recognition from Extel are no guarantee of future investment success and do not ensure that a current or prospective client will experience a higher level of performance results and such rankings should not be construed as an endorsement.
