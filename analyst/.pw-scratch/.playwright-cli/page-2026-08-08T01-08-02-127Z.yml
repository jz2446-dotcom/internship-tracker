    - main [ref=f118e135]:
      - generic [ref=f118e137]:
        - heading "Careers & Internships" [level=1] [ref=f118e139]
        - article [ref=f118e141]:
          - generic [ref=f118e144]:
            - paragraph [ref=f118e145]:
              - text: All current open positions are listed on our
              - link [ref=f118e146] [cursor=pointer]:
                - /url: https://american-antiquarian-society.breezy.hr/
                - text: careers portal
                - img "(link is external)" [ref=f118e147]
              - text: . Positions are listed until they are filled. If you do not see a position that fits your current situation, you are encouraged to submit a general interest application
              - link [ref=f118e150] [cursor=pointer]:
                - /url: https://american-antiquarian-society.breezy.hr/p/5194b74f087d-general-employment-inquiries
                - text: here
                - img "(link is external)" [ref=f118e151]
              - text: .
            - paragraph [ref=f118e154]:
              - strong [ref=f118e155]: "Note: We are aware of a recent scam in which people represent themselves as AAS recruiters. AAS does not use external recruiters. If you have a question concerning the legitimacy of a position you have seen posted online, please call our main phone line at 508-755-5221."
            - heading "General Employment Information" [level=2] [ref=f118e156]
            - paragraph [ref=f118e157]: The American Antiquarian Society is represented by a staff of approximately 50 employees, including part-time, full-time and seasonal. We are always looking to build our inclusive community of thoughtful and friendly people who care about our mission to cultivate a deeper understanding of the American past. Our work spans many departments across the library, programs and administration, who collaborate to create a positive and professional working environment.
            - paragraph [ref=f118e158]: As an equal opportunity employer, AAS values diversity, equity, and inclusion. We are committed to equal employment and promotion opportunity regardless of ability, age, ethnicity, gender, gender identity, marital status, national origin, race, religion, sexual orientation, or veteran status.
            - paragraph [ref=f118e159]:
              - text: For all inquiries on employment, volunteering and internships, please contact
              - link "careers@mwa.org" [ref=f118e160] [cursor=pointer]:
                - /url: mailto:careers@mwa.org
              - text: .
            - heading "Summer Employment" [level=2] [ref=f118e161]
            - paragraph [ref=f118e162]:
              - text: Typically, the Society employs one or two people during the summer to work in the Reader Services department as a page. Summer employment is for eight to twelve weeks from mid-May until mid-August and will be posted on our
              - link [ref=f118e163] [cursor=pointer]:
                - /url: https://american-antiquarian-society.breezy.hr/
                - text: careers portal
                - img "(link is external)" [ref=f118e164]
              - text: ", typically between March and April for the upcoming summer. We have filled our page positions for Summer 2026."
            - heading "Internships" [level=2] [ref=f118e167]
            - paragraph [ref=f118e168]:
              - text: The Society has several standing paid internships, and on occasion will have internships available for specific AAS projects. All internships will be listed on our
              - link [ref=f118e169] [cursor=pointer]:
                - /url: https://american-antiquarian-society.breezy.hr/
                - text: careers portal
                - img "(link is external)" [ref=f118e170]
              - text: . We do not host unpaid internships. If you are seeking an internship for school credit, please contact
              - link "careers@mwa.org" [ref=f118e173] [cursor=pointer]:
                - /url: mailto:careers@mwa.org
              - text: to discuss.
            - paragraph [ref=f118e174]: "The following are our recurring paid internships:"
            - paragraph [ref=f118e175]:
              - link "Conservation Internship" [ref=f118e176] [cursor=pointer]:
                - /url: /careers-internships/conservation-internship
              - text: "- The Conservation Internship provides training opportunities for emerging professionals in the field of book and archives conservation. The internship is held in the"
              - link "conservation lab" [ref=f118e177] [cursor=pointer]:
                - /url: https://www.americanantiquarian.org/conservation-lab
              - text: at the American Antiquarian Society in Worcester, Massachusetts. This internship typically takes place in the summer for ten weeks. Our 2026 position has been filled and applications for 2027 will be available this fall/winter.
            - paragraph [ref=f118e178]:
              - link "Indigenous Collections Internship" [ref=f118e179] [cursor=pointer]:
                - /url: /careers-internships/indigenous-collections-internship
              - text: "- This paid internship provides an opportunity to work with our Indigenous collections, primarily those of our local Nipmuc community, on whose ancestral homelands the Society is built. This internship is subject to project manager availability, so interested candidates should submit a statement of interest at:"
              - link [ref=f118e180] [cursor=pointer]:
                - /url: https://american-antiquarian-society.breezy.hr/p/ad18732cf8c2
                - text: https://american-antiquarian-society.breezy.hr/p/ad18732cf8c2
                - img "(link is external)" [ref=f118e181]
              - text: .
            - paragraph [ref=f118e184]:
              - link "Seiler Library Internship" [ref=f118e185] [cursor=pointer]:
                - /url: /careers-internships/seiler-library-internship
              - text: "- This internship is an opportunity to explore librarianship by working at a national research library, participating in its daily activities, completing library-based projects, and beginning to develop a network of contacts in the field. This ten- to twelve-week internship will provide an overview of possible careers in the library field. Our 2026 position has been filled and this will also be the final year of this program."
            - heading "Volunteering" [level=2] [ref=f118e186]
            - paragraph [ref=f118e187]:
              - text: On occasion we are able to host unpaid volunteers for discrete projects. This is subject to capacity of our managers and supervisors. If you are interested in volunteering please contact
              - link "careers@mwa.org" [ref=f118e188] [cursor=pointer]:
                - /url: mailto:careers@mwa.org
              - text: .
            - paragraph [ref=f118e189]
            - paragraph [ref=f118e190]
