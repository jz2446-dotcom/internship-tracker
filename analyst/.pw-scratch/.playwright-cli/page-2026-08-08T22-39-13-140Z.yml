                - definition [ref=f211e181]:
                  - paragraph [ref=f211e182]:
                    - strong [ref=f211e183]: WHO WE ARE
                  - paragraph [ref=f211e184]:
                    - text: As an employer, the
                    - strong [ref=f211e185]: City of Philadelphia
                    - text: values inclusion, integrity, innovation, empowerment, and hard work above all else. We offer a vibrant work environment, comprehensive health care and benefits, and the experience you need to grow and excel. If you’re interested in working with a passionate team of people who care about the future of Philadelphia, start here.
                  - paragraph [ref=f211e186]:
                    - strong [ref=f211e187]: "What We Offer:"
                  - paragraph [ref=f211e188]:
                    - strong [ref=f211e189]: Impact -
                    - text: The work you do here matters to millions.
                  - paragraph [ref=f211e190]:
                    - strong [ref=f211e191]: Growth -
                    - text: Philadelphia is growing, why not grow with it?
                  - paragraph [ref=f211e192]:
                    - strong [ref=f211e193]: Diversity & Inclusion -
                    - text: Find a career in a place where everyone belongs.
                  - paragraph [ref=f211e194]:
                    - strong [ref=f211e195]: Benefits -
                    - text: We care about your well-being.
                  - paragraph [ref=f211e196]:
                    - strong [ref=f211e197]: The City of Philadelphia is a Public Service Loan Forgiveness Program qualified employer.
                  - paragraph [ref=f211e198]:
                    - text: "Learn more here:"
                    - link "https://studentaid.gov/manage-loans/forgiveness-cancellation/public-service" [ref=f211e199] [cursor=pointer]:
                      - /url: https://studentaid.gov/manage-loans/forgiveness-cancellation/public-service
                  - paragraph [ref=f211e200]:
                    - strong [ref=f211e201]: Equal Access to Civil Service Testing
                  - paragraph [ref=f211e202]:
                    - text: The
                    - strong [ref=f211e203]: City of Philadelphia
                    - text: "is an Equal Opportunity employer and does not permit discrimination based on race, ethnicity, color, sex, sexual orientation, gender identity, religion, national origin, ancestry, age, disability, marital status, source of income, familial status, genetic information or domestic or sexual violence victim status. If you believe you were discriminated against, call the Philadelphia Commission on Human Relations at 215-686-4670 or send an email to faqpchr@phila.gov. For more information, go to: www.phila.gov/humanrelations"
                  - paragraph [ref=f211e204]: The City of Philadelphia is committed to ensuring access to Civil Service examinations by providing appropriate accommodation for candidates with documented medical or religious reasons. Candidates may request accommodation for a Civil Service examination by contacting the Office of Human Resources (OHR) at 215-686-2350 or by email at janine.labletta@phila.gov. The accommodation process is interactive and requires cooperation and communication between the applicant and OHR. Decisions will be made on a case-by-case basis using the required documentation that is submitted. Requests are to be made in a timely manner prior to the scheduled date of the Civil Service examination.
                  - paragraph [ref=f211e205]: Only an on-line application will be accepted for this exam. Paper applications will not be accepted.
                  - paragraph [ref=f211e206]: Computers are available in the 3-1-1 Walk-In Center located in Room 167 of City Hall (Weekdays from 9 AM to 5 PM) and at your local Philadelphia Free Library branch.
                  - paragraph [ref=f211e207]:
                    - text: For inquiries regarding City employment, contact the
                    - strong [ref=f211e208]: Office of Human Resources
                    - text: Monday through Friday between 8 AM and 4 PM by telephone at 215-686-0880 or by email at hrhelpdesk@phila.gov
                  - paragraph [ref=f211e209]:
                    - strong [ref=f211e210]: "Information concerning employment with the City of Philadelphia may be found at:"
                  - list [ref=f211e211]:
                    - listitem [ref=f211e212]:
                      - link "work.phila.gov" [ref=f211e213] [cursor=pointer]:
                        - /url: https://work.phila.gov/
