              - generic [ref=f211e224]:
                - term [ref=f211e225]:
                  - heading "General Definition" [level=2] [ref=f211e226]
                - definition [ref=f211e227]:
                  - paragraph [ref=f211e228]:
                    - strong [ref=f211e229]:
                      - generic [ref=f211e230]: This posting is for City employees only. This is a promotional opportunity. This list will be used to fill positions in the confidential/non-represented role and the non-confidential/represented role
                    - text: This is administrative staff work performing a variety of assignments of a non-confidential nature for a division manager or higher. An employee in this class serves in a liaison capacity between the manager and other staff and officials. Work includes composing a wide variety of correspondence and reports, performing research, and developing and recommending work standards and procedures. Work may also include providing direction to a small clerical or administrative support staff. Assignments require familiarity with the functions of the agency in which the position is employed. Work is performed under the supervision of a manager or administrator.
                    - strong [ref=f211e231]: CONTACT INFORMATION
                    - text: "The analyst responsible for reviewing applications and additional documentation for this job opportunity isCornell Q. WeaverCity of Philadelphia – Office of Human Resources1401 JFK Blvd., Room 1530Philadelphia, PA 19102-1675Phone: 215-686-2387Fax: 215-686-0861Email:"
                    - link "cornell.weaver@phila.gov" [ref=f211e232] [cursor=pointer]:
                      - /url: mailto:cornell.weaver@phila.gov
                    - strong [ref=f211e233]: For all other inquiries, please contact Customer Service at 215-686-0880 or email
                    - link "hrhelpdesk@phila.gov" [ref=f211e234] [cursor=pointer]:
                      - /url: mailto:hrhelpdesk@phila.gov
                      - strong [ref=f211e235]: hrhelpdesk@phila.gov
                - term [ref=f211e236]:
                  - heading "Notes to Applicants and Projected Exam Information" [level=2] [ref=f211e237]
                - definition [ref=f211e238]:
                  - paragraph
                  - paragraph [ref=f211e239]:
                    - strong [ref=f211e240]: "ELIGIBLE LIST: CITY-WIDE PROMOTIONAL"
                  - text: Departmental and interdepartmental promotional eligible lists will be established as a result of this examination. An appointment in any department may be made from either one of the above-established promotional lists as deemed appropriate by the appointing authority.
                  - paragraph [ref=f211e241]: Candidates who pass the exam and are placed on the civil service list will be retained on the list for a minimum of one year and a maximum of two years after the establishment of the Eligible List.
                  - paragraph [ref=f211e242]
                  - paragraph [ref=f211e243]:
                    - strong [ref=f211e244]: PREFERENCE FOR PHILADELPHIA RESIDENTS
                  - paragraph [ref=f211e245]: Candidates who have maintained a bona fide residence in Philadelphia for at least one year prior to the date of the civil service examination shall have priority over all other people receiving an identical test score.
                  - paragraph [ref=f211e246]
                  - paragraph [ref=f211e247]: To receive such preference, candidates must respond to the question regarding residence later in this form. The response on this application will be used to determine eligibility for preference for residents. Documentation of residence may be required if there is any question as to whether you meet the residency preference requirements.
                  - text: If an applicant does not respond to the appropriate residence question, it will be assumed that the applicant does not qualify for residence preference. Eligibility for residence preference must be determined by the date of the test administration. No requests for residence preference will be granted after the test administration
                  - strong [ref=f211e248]: "EXAM INFORMATION:"
                  - text: This computer-based examination will be scheduled for
                  - strong [ref=f211e249]: September 17
                  - strong [ref=f211e250]: ", 2026"
                  - text: . Please note that this examination date is subject to change
                  - paragraph [ref=f211e251]: Candidates will need access to a desktop computer or laptop with a webcam and internet access to take the examination. Candidates will need to be able to operate computerized software proficiently and independently.
                  - paragraph [ref=f211e252]
                  - paragraph [ref=f211e253]: If you do not have access to a desktop computer or laptop with a webcam and internet access, or cannot operate computerized software proficiently and independently, please contact Cornell Q. Weaver at cornell.weaver@phila.gov, and alternative arrangements will be made for you to take this examination.
                  - paragraph [ref=f211e254]
                  - paragraph [ref=f211e255]:
                    - text: An Eligible List will be established the week of
                    - strong [ref=f211e256]: September 28, 2026.
                    - text: Please note that this date may change.
                  - strong [ref=f211e257]: "TEST REVIEW:"
                  - text: In accordance with Civil Service Regulation 9.091B, candidates will have 30 days after the results have been mailed to review their test and to file appeals to the key answers. Call 215-686-0880 if you wish to schedule a Test Review
                  - paragraph
                - term [ref=f211e258]:
                  - heading "Level of Education Required" [level=2] [ref=f211e259]
                - definition [ref=f211e260]:
                  - paragraph [ref=f211e261]:
                    - generic [ref=f211e262]: High School/GED
                - term [ref=f211e263]:
                  - heading "Minimum Acceptable Training and Experience" [level=2] [ref=f211e264]
                - definition [ref=f211e265]:
                  - paragraph [ref=f211e266]:
                    - text: The following statement represents the minimum training and experience requirements that will be used to admit or reject applicants for tests.
                    - generic [ref=f211e267]:
                      - strong [ref=f211e268]: ANTICIPATED ELIGIBILITY
                      - generic [ref=f211e269]:
                        - text: Candidates who meet all eligibility requirements within
                        - strong [ref=f211e270]: six (6) months
                        - text: of the application deadline will be admitted to this examination. Successful candidates will be placed on the eligible list but may not be hired or promoted until all requirements have been satisfied.
                  - paragraph [ref=f211e271]:
                    - strong [ref=f211e272]: "1. CIVIL SERVICE STATUS:"
                    - text: Presently employed by the City of Philadelphia with permanent Civil Service status and a Performance Rating of Satisfactory or higher.
                  - strong [ref=f211e273]: AND
                  - strong [ref=f211e274]: 2. EDUCATION
                  - text: ": Education equivalent to completion of the twelfth school grade."
                  - strong [ref=f211e275]: "AND3. SPECIFIC EXPERIENCE:"
                  - text: Five years of advanced-level clerical or administrative experience at or above pay range 11 or EP 7.
                  - strong [ref=f211e276]: OR
                  - text: Any equivalent combination of education and experience determined to be acceptable by the Office of Human Resources that has included the specific experience described above.
                  - strong [ref=f211e277]: "NOTE:"
                  - text: An Associate's Degree in Business Administration or related field may be substituted for two years of experience.
                  - paragraph [ref=f211e278]:
                    - strong [ref=f211e279]: "PHYSICAL AND MEDICAL REQUIREMENTS:"
                    - text: Ability to physically perform the duties and to work in the environmental conditions required of a position in this class.
                  - paragraph [ref=f211e280]:
                    - strong [ref=f211e281]: TRANSCRIPT, LICENSES, REGISTRATIONS, AND CERTIFICATION REQUIREMENTS
                  - paragraph [ref=f211e282]: Candidates MUST submit a copy of their license, registration, or certification. If you have ever submitted a paper transcript, license, registration, or certification for any City of Philadelphia civil service examination, you must submit another document
                  - paragraph [ref=f211e283]
                  - paragraph [ref=f211e284]:
                    - strong [ref=f211e285]: Option 1 - Upload a paperless transcript, license, registration or certification – One time only!
                  - paragraph [ref=f211e286]: You may upload documents into your account and attach a document with this application. Once the document is uploaded to your account, it may be attached to all future applications. Attaching your document will save you time and money if you apply for an examination in the future, and you will be assured that your transcript cannot be misplaced.
                  - paragraph [ref=f211e287]
                  - paragraph [ref=f211e288]: Your documents should be uploaded and attached to your application before it is submitted. They cannot be uploaded or added to your application electronically after your application has been submitted.
                  - paragraph [ref=f211e289]:
                    - strong
                  - paragraph [ref=f211e290]:
                    - strong [ref=f211e291]: Option 2
                    - strong [ref=f211e292]: – Submit a paper transcript, license, registration or certification – Separate document required for each application
                  - paragraph [ref=f211e293]:
                    - text: If you submit a paper copy of a transcript, license, registration or certification, the document will be used for this application only. You will have to submit documents again whenever you apply for an examination in the future.
                    - strong [ref=f211e294]: Paper documents will not be retained and will not be returned to applicants.
                  - paragraph [ref=f211e295]
                  - paragraph [ref=f211e296]:
                    - strong [ref=f211e297]: Mailing address for paper transcript and other required materials
