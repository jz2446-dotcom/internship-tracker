      - main [ref=f201e87]:
        - article [ref=f201e88]:
          - heading "VC Associate @ Lowercarbon Capital in San Francisco, CA" [level=1] [ref=f201e91]
          - generic [ref=f201e94]:
            - list [ref=f201e95]:
              - listitem [ref=f201e96]:
                - text: 
                - link "San Francisco, CA" [ref=f201e97] [cursor=pointer]:
                  - /url: https://maps.google.com/maps?q=San%20Francisco%2C%20CA&zoom=14&size=512x512&maptype=roadmap&sensor=false
              - listitem [ref=f201e98]:
                - text: 
                - time [ref=f201e99]: Posted 2 years ago
            - generic [ref=f201e100]:
              - img "Lowercarbon Capital" [ref=f201e101]
              - paragraph [ref=f201e103]:
                - strong [ref=f201e104]: Lowercarbon Capital
            - generic [ref=f201e105]:
              - paragraph [ref=f201e106]:
                - text: Lowercarbon Capital backs kickass companies that make real money slashing CO
                - subscript [ref=f201e107]: "2"
                - text: emissions, sucking carbon out of the sky, and buying us time to unf**k the planet. We invest in early-stage companies that combine hard science with some bonkers ambitions to decarbonize all sectors of the economy, remove billions of tons of CO
                - subscript [ref=f201e108]: "2"
                - text: straight out of the atmosphere, and buy more time for people and ecosystems getting hit first and worst by rising temperatures.
              - paragraph [ref=f201e109]: We’re looking for an Associate with a technical background to play a key role on our investment team. You’ll support our dealflow processes to make sure nothing falls through the cracks, drive research and diligence for companies we are evaluating for investment, dig in with founders in the throes of company-building, and undoubtedly pick up other responsibilities in the day-to-day running of a venture capital fund. In this job, you’ll work closely with the founders, partners, and climate experts in our community. For curious, driven, and independent candidates, this will be a unique opportunity to develop as a leader in the climate space.
              - heading [level=2] [ref=f201e110]:
                - mark [ref=f201e111]: Responsibilities
              - paragraph [ref=f201e112]: "As an Associate, your time will be spent:"
              - list [ref=f201e113]:
                - listitem [ref=f201e114]:
                  - strong [ref=f201e115]: "Supporting dealflow:"
                  - text: You’ll manage internal systems and processes for tracking deals, keep records updated, and make sure nothing falls through the cracks.
                - listitem [ref=f201e116]:
                  - strong [ref=f201e117]: "Diligencing promising opportunities:"
                  - text: You’ll do market research, competitive analysis, customer calls, expert interviews, and talk to other investors who’re looking at similar opportunities.
                - listitem [ref=f201e118]:
                  - strong [ref=f201e119]: "Researching and building out investment theses:"
                  - text: You’ll do background research on specific questions and areas of interest so that you and the rest of the team can come to pitch meetings prepared with strong opinions.
              - heading [level=2] [ref=f201e120]:
                - mark [ref=f201e121]: Skills & Background
              - paragraph [ref=f201e122]: This list of qualifications is intended to highlight characteristics we believe are most essential to have immediate success in this role, but there is a wide range of potentially relevant professional and academic experiences. While a background in investing or start-ups could be valuable in this role, we do not consider these prerequisites and look forward to meeting with a diverse group of candidates.
              - list [ref=f201e123]:
                - listitem [ref=f201e124]:
                  - strong [ref=f201e125]: "Mission oriented:"
                  - text: Perhaps most importantly, curiosity alone doesn’t drive you. You’re a climate-head intrinsically motivated by the need to meaningfully address the challenge of our times.
                - listitem [ref=f201e126]:
                  - strong [ref=f201e127]: "Quantitative training:"
                  - text: You have a degree or training in economics, data science, or engineering, for example civil, environmental, mechanical, chemical or nuclear engineering, or another relevant STEM field.
                - listitem [ref=f201e128]:
                  - strong [ref=f201e129]: "Technology wonk:"
                  - text: You’re fired up about the various sources of energy required to decarbonize the global economy. You can engage in a lively discussion on “electrify everything”, you’re interested in the market signals and new business models needed to roll out new generation and storage technology, from baseload energy options like nuclear whether it’s fusion or fission, to various forms of renewable energy resources. You also have a penchant for the value of distributed energy resources and get excited about energy as a service models.
                - listitem [ref=f201e130]:
                  - strong [ref=f201e131]: "Highly autonomous:"
                  - text: You are comfortable working on and completing projects independently. You are not afraid to ask questions, but err toward having hypotheses or recommendations ready to go alongside them.
                - listitem [ref=f201e132]:
                  - strong [ref=f201e133]: "Creative thinker:"
                  - text: You enjoy thinking about big problems and exploring hard (and sometimes outlandish) solutions. You’re comfortable admitting what you don’t know, nurturing the creativity of others, and being open to feedback.
                - listitem [ref=f201e134]:
                  - strong [ref=f201e135]: "Analytical prowess:"
                  - text: You can build Excel models in your sleep. You know the right questions to ask, the right data to gather, and how to tease out insights without boiling the ocean.
                - listitem [ref=f201e136]:
                  - strong [ref=f201e137]: "Excellent verbal and written communicator:"
                  - text: You’re able to engage with a diverse range of stakeholders in-person and comfortable drafting memos or written works for a variety of internal and external audiences.
                - listitem [ref=f201e138]:
                  - strong [ref=f201e139]: Holistic research abilities
                  - text: ": You have a curious sensibility, anchor on the right concepts quickly, and go deep enough to be credible in the targeted subject. You know where to go to track down the information you need (including experts in your network)."
                - listitem [ref=f201e140]:
                  - strong [ref=f201e141]: "Highly attentive to detail:"
                  - text: You take pride in the accuracy and polish of your work. Whether it’s an internal memo or a conference presentation, you always sweat the details.
                - listitem [ref=f201e142]:
                  - strong [ref=f201e143]: "Task juggler:"
                  - text: You enjoy working on multiple projects simultaneously and can switch gears quickly.
              - heading [level=2] [ref=f201e144]:
                - mark [ref=f201e145]: How to Apply
              - paragraph [ref=f201e146]:
                - text: If you’re interested in applying for this position, please submit an application
                - link "here" [ref=f201e147] [cursor=pointer]:
                  - /url: https://jobs.ashbyhq.com/lowercarboncapital/7ea1a71b-a77d-4e3f-916b-f6d7c900893b/application
                - text: .
              - paragraph [ref=f201e148]: We believe diversity is a source of strength. Lowercarbon Capital is an equal opportunity employer and all qualified applicants will receive consideration for employment without regard to race, color, religion, sex, national origin, disability status, protected veteran status, gender identity, sexual orientation, or any other characteristic protected by law.
              - paragraph [ref=f201e149]: "Salary Range: $150,000–$175,000"
