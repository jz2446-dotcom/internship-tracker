      - generic [ref=f12e65]:
        - heading "Launch your career at the center of digital infrastructure" [level=3] [ref=f12e66]
        - paragraph [ref=f12e67]:
          - text: The Equinix internship program is designed to launch early careers through hands‑on experience, meaningful work, and real exposure to how the digital world runs. Interns work on real business challenges across functions such as
          - link "data center operations" [ref=f12e68] [cursor=pointer]:
            - /url: https://careers.equinix.com/data-center-operations-jobs
          - text: ","
          - link "sales" [ref=f12e69] [cursor=pointer]:
            - /url: https://careers.equinix.com/sales-jobs
          - text: ","
          - link "finance, legal, human resources" [ref=f12e70] [cursor=pointer]:
            - /url: https://careers.equinix.com/corporate-functions
          - text: ", customer success, sales engineering,"
          - link "software engineering" [ref=f12e71] [cursor=pointer]:
            - /url: https://careers.equinix.com/software-engineering-jobs
          - text: and more, contributing to projects that matter while gaining practical industry experience.
        - paragraph [ref=f12e72]: With structured onboarding, mentorship, and learning opportunities, our internships help students build skills, confidence, and professional networks in a global, innovative environment.
        - heading "Why build your career at Equinix?" [level=3] [ref=f12e73]
        - list [ref=f12e74]:
          - listitem [ref=f12e75]:
            - strong [ref=f12e76]: Do real work that makes an impact
            - text: Interns at Equinix aren’t observers. You’ll contribute to real projects and real business outcomes, working alongside experienced professionals who trust you with meaningful responsibility.
          - listitem [ref=f12e77]:
            - strong [ref=f12e78]: Learn with the right support from day one
            - text: Equinix interns benefit from structured onboarding, mentorship, and ongoing guidance from managers, mentors, and peers. You’ll also have access to learning sessions and
            - link "Employee Connection Networks (EECNs)" [ref=f12e79] [cursor=pointer]:
              - /url: https://careers.equinix.com/employee-experience-community-impact-and-our-wellbeing
            - text: ", helping you grow both professionally and personally."
        - list [ref=f12e80]:
          - listitem [ref=f12e81]:
            - strong [ref=f12e82]: Explore careers across a global company
            - text: The program spans multiple business functions and global locations, giving interns exposure to how different teams collaborate to power digital infrastructure worldwide. This breadth helps you discover where your strengths and interests can take you next.
          - listitem [ref=f12e83]:
            - strong [ref=f12e84]: Build a foundation for what’s next
            - text: Equinix internships are a pipeline to future opportunities. Many interns go on to join Equinix as full‑time employees or continue growing through other early‑career pathways, turning early experience into long‑term careers.
