                          - /url: https://www.related.com/press-releases/2026-06-04/related-argent-launches-ferry-island-build-rent-scheme-complete-1000-home
                      - paragraph [ref=f1520e222]:
                        - text: On June 4, Related Argent unveiled
                        - link "Ferry Island" [ref=f1520e223] [cursor=pointer]:
                          - /url: https://www.ferryislandn17.co.uk/
                        - text: ", a new Build-to-Rent (BtR) residence that has completed the company's 1,000-home Tottenham Hale master plan in London. Designed by Allford Hall Monaghan Morris Architects and featuring interiors by Conran and Partners, Ferry Island offers 484 high-quality residences across two buildings, ranging from one- to three-bedroom homes. Residents benefit from a retail offering, adjacent location to the Tottenham Hale underground station and 15,000 square feet of amenity space managed by Related Argent, which includes two roof terraces, a gym and fitness suite, co-working lounges, a screening room and dedicated social spaces."
                      - link "Read More" [ref=f1520e224] [cursor=pointer]:
                        - /url: https://www.related.com/press-releases/2026-06-04/related-argent-launches-ferry-island-build-rent-scheme-complete-1000-home
