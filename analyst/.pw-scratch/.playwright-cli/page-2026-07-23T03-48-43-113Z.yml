                      - paragraph [ref=f1520e178]: Related Beal and Related Affordable, in partnership with the Commonwealth of Massachusetts and MassHousing, announced a plan for the comprehensive renovation of Loring Towers, a 250-unit affordable housing community in Salem, MA, originally built in 1974. The $38 million renovation will preserve the community's long-term affordability while delivering significant upgrades for residents. Expected to be completed by 2028, the project includes fully renovated apartment units, a new basketball court and a playground.
                      - link "Read More" [ref=f1520e179] [cursor=pointer]:
