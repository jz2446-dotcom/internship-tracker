      - generic [ref=f1e96]:
        - heading "Employee Life at Kidder Mathews" [level=2] [ref=f1e98]
        - generic [ref=f1e99]:
          - article [ref=f1e100]:
            - generic [ref=f1e101]:
              - figure [ref=f1e102]
              - generic [ref=f1e104]:
                - heading "Health Benefits" [level=4] [ref=f1e105]
                - paragraph [ref=f1e106]: We value the health and welfare of our employees and offer a comprehensive suite of benefits including medical, dental, vision, long and short term disability, life insurance, flexible spending (FSA) and HSA accounts, and a life assistance program. Also we have several voluntary benefits including pet insurance, ID theft protection and supplemental plans.
          - article [ref=f1e107]:
            - generic [ref=f1e108]:
              - figure [ref=f1e109]
              - generic [ref=f1e111]:
                - heading "Paid Time Off" [level=4] [ref=f1e112]
                - paragraph [ref=f1e113]: We work hard and encourage our people to take time off to recharge by spending time with family, traveling, or doing whatever they enjoy while away from work. Our plans include vacation and personal time, sick leave, and twelve paid holidays per year. Performing jury duty is important to us so we pay you while you serve. We also encourage volunteering by offering two paid instances per year.
          - article [ref=f1e114]:
            - generic [ref=f1e115]:
              - figure [ref=f1e116]
              - generic [ref=f1e118]:
                - heading "Financial Well-Being" [level=4] [ref=f1e119]
                - paragraph [ref=f1e120]: We offer a 401(k) with company match program that includes a ROTH option. Financial education classes or other educational information is available.
          - article [ref=f1e121]:
            - generic [ref=f1e122]:
              - figure [ref=f1e123]
              - generic [ref=f1e125]:
                - heading "Continuing Education" [level=4] [ref=f1e126]
                - paragraph [ref=f1e127]: We understand and value professional licenses, designations, and certifications and believe it is essential for our success. Kidder Mathews reimburses our employees for continuing education to keep needed credentials for their roles.
          - article [ref=f1e128]:
            - generic [ref=f1e129]:
              - figure [ref=f1e130]
              - generic [ref=f1e132]:
                - heading "Culture and Values" [level=4] [ref=f1e133]
                - paragraph [ref=f1e134]: "At Kidder Mathews we strive to do our best every day and have fun doing it. As a professional services firm, we know our people are our greatest asset. The long-term viability of our company — as well as our individual and collective success — depends on our commitment to certain guiding values: integrity, professionalism, entrepreneurship, and respect."
          - article [ref=f1e135]:
            - generic [ref=f1e136]:
              - figure [ref=f1e137]
              - generic [ref=f1e139]:
                - heading "Community" [level=4] [ref=f1e140]
                - paragraph [ref=f1e141]: We believe in giving back to our communities. We provide two paid instances of volunteer time per year to all employees who work more than 20 hours per week to volunteer at any 403(c) of their choice.
          - article [ref=f1e142]:
            - generic [ref=f1e143]:
              - figure [ref=f1e144]
              - generic [ref=f1e146]:
                - heading "Diversity" [level=4] [ref=f1e147]
                - paragraph [ref=f1e148]: We support diversity with a respectful, inclusive culture as an equal opportunity employer. We seek people from all backgrounds to be part of the Kidder Mathews team and encourage our people to bring their original and best self to work every day.
          - article [ref=f1e149]:
            - generic [ref=f1e150]:
              - figure [ref=f1e151]
              - generic [ref=f1e153]:
                - heading "Military Veterans" [level=4] [ref=f1e154]
                - paragraph [ref=f1e155]: Kidder Mathews thanks military veterans for their service and sacrifice made to support our safety and freedom. We appreciate the values, work ethic, and leadership veterans bring to our team and seek high-performance people with a deep passion for customer service.
