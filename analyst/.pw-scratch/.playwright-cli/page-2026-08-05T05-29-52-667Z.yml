        - paragraph [ref=f31e298]: "Employees at every level are empowered to take ownership, contribute and make a lasting impact. Talented, highly motivated individuals who value a collaborate and innovative culture have the opportunity to make a meaningful impact for our clients by demonstrating the below qualities:"
        - list [ref=f31e299]:
          - listitem [ref=f31e300]:
            - strong [ref=f31e301]: "Client Relationship Skills:"
            - text: The judgment, poise, and preparedness to thoughtfully engage with clients and internal and external stakeholders.
          - listitem [ref=f31e302]:
            - strong [ref=f31e303]: "Collaboration:"
            - text: The ability to work effectively across teams, building strong relationships and contributing to shared goals with both colleagues and clients.
          - listitem [ref=f31e304]:
            - strong [ref=f31e305]: "Drive to Succeed:"
            - text: Ambition matched by focus, motivation, and commitment to excellence.
          - listitem [ref=f31e306]:
            - strong [ref=f31e307]: "Resilience:"
            - text: Adaptability and determination to excel in a fast-paced environment.
          - listitem [ref=f31e308]:
            - strong [ref=f31e309]: "Intellectual Curiosity:"
            - text: A passion for continued learning, complex problem solving, and innovative solutions that result in long term success for our clients and team.
          - listitem [ref=f31e310]:
            - strong [ref=f31e311]: "Analytical Thinking:"
            - text: Strong problem-solving skills, attention to detail, and the ability to think critically under pressure.
