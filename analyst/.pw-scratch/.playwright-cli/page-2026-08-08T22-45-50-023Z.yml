                - heading "Position Description" [level=2] [ref=f562e123]
              - definition [ref=f562e124]:
                - paragraph
                - paragraph [ref=f562e125]:
                  - strong [ref=f562e126]: THE DEPARTMENT
                - paragraph [ref=f562e127]: The Seattle Department of Neighborhoods (DON) is responsible for strengthening Seattle by engaging all communities. Our purpose is to bring government closer to Seattle's residents by engaging them in civic participation, empowering them to make positive contributions to their communities, and involving more of Seattle’s Black, Indigenous, and People of Color (BIPOC) communities in civic discussions, processes, and opportunities.
                - paragraph
              - term [ref=f562e128]:
                - heading "Job Responsibilities" [level=2] [ref=f562e129]
              - definition [ref=f562e130]:
                - paragraph
                - paragraph [ref=f562e131]:
                  - strong [ref=f562e132]: THE JOB
                - paragraph [ref=f562e133]: DON is recruiting a new Accounting Technician to join our team and support our community-centered work. We are looking for a combination of strong accounts payable and purchase order processing skills, and the motivation and ability to work well with internal and external partners with varying levels of technical expertise in accounting. In this role, you will work closely with the Finance team, DON contract managers, and community organizations. The community organizations you will work with are often small and under-resourced, so prompt processing and payment are crucial.
                - paragraph [ref=f562e134]: "Your work will include:"
                - paragraph [ref=f562e135]:
                  - strong [ref=f562e136]: Accounts payable (AP)
                  - strong [ref=f562e137]: processing
                - paragraph [ref=f562e138]:
                  - strong [ref=f562e139]: Purchase order (PO) processing
                - paragraph [ref=f562e140]:
                  - strong [ref=f562e141]: Ad Hoc AP and PO Reports
                - paragraph [ref=f562e142]:
                  - generic [ref=f562e143]: "To be successful in this job, you are committed to:"
                - list [ref=f562e144]:
                  - listitem [ref=f562e145]: Equity-based, community-centered work
                  - listitem [ref=f562e146]: Using your accounting skills to support impactful programs
                  - listitem [ref=f562e147]: Supportive, respectful, and responsive interactions with internal and external partners
                  - listitem [ref=f562e148]: Accuracy, attention to detail, timeliness, and documentation
                - paragraph [ref=f562e149]
                - paragraph [ref=f562e150]:
                  - generic [ref=f562e151]: "To be effective in this assignment, you have:"
                - list [ref=f562e152]:
                  - listitem [ref=f562e153]: Centered equity and social justice in your accounting work
                  - listitem [ref=f562e154]: Demonstrated a customer service orientation and attention to timeliness
                  - listitem [ref=f562e155]: Built strong working relationships with internal and external partners
                  - listitem [ref=f562e156]: Listened and communicated helpfully and clearly with people who have varying levels of financial expertise
                  - listitem [ref=f562e157]: Performed Accounts Payable and Purchase Order processing
                  - listitem [ref=f562e158]: Proficiency in Excel, Word, Outlook, PeopleSoft
                  - listitem [ref=f562e159]: Proficiency with contracts and grant management systems, like CCMS and FLUXX
                  - listitem [ref=f562e160]: Run Ad Hoc reports such as Women and Minority Owned Business Enterprises (WMBE) payments
                  - listitem [ref=f562e161]: Identified errors and managed corrective action in a personable and solutions-oriented manner
                - paragraph [ref=f562e162]:
                  - emphasis [ref=f562e163]: Please note this job advertisement is not designed to cover or contain a comprehensive listing of activities, duties or responsibilities that are required of the employee for this job.
                - paragraph
              - term [ref=f562e164]:
                - heading "Qualifications" [level=2] [ref=f562e165]
              - definition [ref=f562e166]:
                - paragraph
                - paragraph [ref=f562e167]: Qualifications
                - paragraph [ref=f562e168]: "In addition to the skills and experience listed above, this job requires the following (or a combination of training, experience, or education that provides the skills needed to perform the job):"
                - paragraph [ref=f562e169]: Requires two years of accounting/bookkeeping experience or one year of experience as an Accounting Technician I.
                - paragraph
              - term [ref=f562e170]:
                - heading "Additional Information" [level=2] [ref=f562e171]
              - definition [ref=f562e172]:
                - paragraph
                - paragraph [ref=f562e173]: This job is classified as an Accounting Technician II – BU and is represented by a Collective Bargaining Agreement with PROTEC17 – Administrative Support Unit. The salary range is $33.72 – 39.18. New City employees start at Step 1, in a 5-step salary schedule. Personnel Rules will determine the salary placement of current regular City employees.
                - paragraph [ref=f562e174]
                - paragraph [ref=f562e175]: This position offers the flexibility of a hybrid work schedule. Individual schedules will be based on agreement between the employee and management.
                - paragraph [ref=f562e176]
                - paragraph [ref=f562e177]:
                  - generic [ref=f562e178]:
                    - text: "The City of Seattle offers a comprehensive benefits package, including vacation, holiday, and sick leave as well as medical, dental, vision, life, and long-term disability insurance for employees and their dependents. More information about employee benefits is available on the City's website at:"
                    - link "https://www.seattle.gov/human-resources/benefits" [ref=f562e179] [cursor=pointer]:
                      - /url: https://www.seattle.gov/human-resources/benefits
                - paragraph [ref=f562e180]
                - paragraph [ref=f562e181]:
                  - strong [ref=f562e182]: In addition to completing the application at
                  - link [ref=f562e184] [cursor=pointer]:
                    - /url: http://www.governmentjobs.com/careers/seattle
                    - strong [ref=f562e185]: www.governmentjobs.com/careers/seattle
                  - strong [ref=f562e186]: "fully, please attach:"
                - paragraph [ref=f562e187]
                - generic [ref=f562e188]:
                  - strong [ref=f562e189]: A PDF of your current resume
                  - strong [ref=f562e190]:
                    - generic [ref=f562e191]: A cover letter explaining how your experience, skills, and approach align with this job
                  - strong [ref=f562e193]: with the Department of Neighborhoods
                - paragraph [ref=f562e194]
                - paragraph [ref=f562e195]:
                  - generic [ref=f562e196]: This hiring process involves a background check of conviction and arrest records in compliance with Seattle's Fair Chance Employment Ordinance, SMC 14.17. Applicants will be provided with an opportunity to explain or correct background information.
                - paragraph [ref=f562e197]
                - paragraph [ref=f562e198]:
                  - strong [ref=f562e199]: Why Work for the City of Seattle?
                  - text: "At the City of Seattle, public service is more than a job; it’s a chance to shape the future and make a meaningful difference in the lives of everyone who works, lives, or plays in our city. With 12,000 employees across 40+ departments and 1,100 job titles, we are united by a common purpose: to create a Seattle that is vibrant, and welcoming for all. Whatever your role, you’ll help power a forward-looking city that leads by example — inclusive, innovative, equitable, and community-focused — while joining a diverse team committed to solving challenges and making a lasting impact together."
                  - strong [ref=f562e200]: Join us in building a Seattle that thrives!
                - paragraph [ref=f562e201]
                - paragraph [ref=f562e202]: This position is open to applicants who meet the minimum qualifications. The Department of Neighborhoods values diverse perspectives and life experiences. Applicants will be considered regardless of race, color, creed, national origin, ancestry, sex, marital status, disability, religious or political affiliation, age, sexual orientation, medical condition, or pregnancy. The Department of Neighborhoods encourages people of all backgrounds to apply, including people of color, immigrants, refugees, women, LGBTQ+, people with disabilities, veterans, and those with diverse life experiences.
                - paragraph [ref=f562e203]
                - paragraph [ref=f562e204]:
                  - strong [ref=f562e205]: "Accommodations:"
                - paragraph [ref=f562e206]: Individuals with disabilities will be provided with reasonable accommodations to participate in the job application or interview process, perform essential job functions, and receive other benefits and privileges of employment. Please get in touch with Kate.Moore@seattle.gov for questions or to request accommodations.
