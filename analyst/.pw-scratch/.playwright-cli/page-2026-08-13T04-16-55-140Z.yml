                - heading "Collections On View" [level=3] [ref=f486e86]
                - 'heading "Then and Now: Selections from the Collection Ongoing West Gallery | South Gallery" [level=2] [ref=f486e87]': "Then and Now: Selections from the CollectionOngoingWest Gallery | South Gallery"
                - paragraph [ref=f486e88]:
                  - emphasis [ref=f486e89]: Then and Now
                  - text: is an ongoing exhibition featuring rotating selections from the Museum’s collection. It brings together sculptural works originally given by founding patron Roy R. Neuberger alongside objects added over time, reflecting a broad range of cultures, generations, and artistic traditions.
                  - emphasis [ref=f486e90]: "Then and Now: Selections from the Collection"
                  - text: is organized by the Neuberger Museum of Art, SUNY Purchase, and curated by Curator of New Media and Director of Digital Initiatives Jacqueline Shilkoff and Curatorial Assistant Rebecca Elisabeta Marya (Rem) Ribeiro. Generous support for this ongoing exhibition is provided by the Friends of the Neuberger Museum of Art and the Roy R. Neuberger Legacy Endowment.
                - paragraph [ref=f486e91]:
                  - strong [ref=f486e92]: More about the permanent collection
                - paragraph [ref=f486e93]: Since its founding in 1969, with the initial promised gift of 300 objects from founding patron Roy R. Neuberger (1903–2010), the collection of the Neuberger Museum of Art has grown to approximately 7,000 pieces, representing a wide spectrum of styles and eras.
                - paragraph [ref=f486e94]: At the heart of this diverse collection is Roy R. Neuberger’s guiding vision. He was deeply committed to supporting the careers of living artists, guided by a belief that collecting contemporary art was most meaningful when it provided encouragement and tangible support in real time. As he often said, the donation of his collection was “very much in line with my whole philosophy,” rooted in his desire to “encourage young artists.”
                - paragraph [ref=f486e95]: Neuberger collected not as an investment or a retrospective exercise, but as a way to recognize artists while they were actively making work, allowing them to experience both affirmation and financial support when it mattered most.
                - paragraph [ref=f486e96]:
                  - emphasis [ref=f486e97]: Then and Now
                  - text: places sculptural works originally given to the Museum by Roy R. Neuberger in conversation with objects added to the collection over time. It creates a dynamic dialogue across generations, movements, and artistic approaches, inviting visitors to experience the collection as a living resource that honors the Museum’s origins while affirming its continuing commitment to artists of our time.
                - figure "Marisol. Queen, 1957. Wood and terracotta. 29 x 14 1/2 x 8 inches. Collection Friends of the Neuberger Museum of Art, Purchase College, SUNY. Gift from the Estate of Roy R. Neuberger. EL 02.2011.59 a&b. © 2026 Estate of Marisol / Artists Rights Society (ARS), New York." [ref=f486e98]:
                  - img "A sculpted bust of a woman with intricate curly hair and a large, ornate crown, set against a plain gray background." [ref=f486e99]
