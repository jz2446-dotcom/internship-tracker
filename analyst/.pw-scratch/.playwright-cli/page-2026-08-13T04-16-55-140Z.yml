          - generic [ref=f486e347]:
            - heading [level=2] [ref=f486e348]:
              - strong [ref=f486e350]: About the Neuberger Museum of Art
            - paragraph [ref=f486e351]: The Neuberger Museum of Art is a center of teaching and learning for all stages of life. Experience exhibitions of modern, contemporary and African art and art-inspired events in our Philip Johnson-designed building at the heart of SUNY Purchase.
            - paragraph [ref=f486e352]: Founded in 1969 with a promised gift of 300 works by Roy R. Neuberger—one of the greatest private collectors, philanthropists, and arts advocates of the twentieth century—the Museum’s collection has grown to over 6,000 objects by artists including Milton Avery, Romare Bearden, Willem de Kooning, Edward Hopper, Georgia O’Keeffe, and Jackson Pollock.
            - paragraph [ref=f486e353]: Our signature biannual award, the Roy R. Neuberger Prize, recognizes the work of exceptional contemporary artists, continuing our founding patron’s dedication to supporting artists early in their careers.
            - paragraph [ref=f486e354]: Alongside our permanent collection, critically acclaimed special exhibitions draw local, regional, and international audiences to our galleries in Westchester.
            - paragraph [ref=f486e355]: Tours, lectures, and programs engage our broad and diverse community. On any day, you can see adults, families, K-12 school children and their teachers, and Purchase College students, faculty, and staff enjoying the museum.
            - paragraph [ref=f486e356]: At the Neuberger, appreciating art is active and interactive. Here, students, scholars, artists, and art lovers find common ground to experiment, question, and grow.
            - paragraph [ref=f486e357]:
              - link "Department Directory" [ref=f486e358] [cursor=pointer]:
                - /url: https://www.purchase.edu/neuberger-museum-of-art/directory/
            - heading [level=2] [ref=f486e359]:
              - strong [ref=f486e361]: "About the Friends of the Neuberger Museum of Art:"
            - paragraph [ref=f486e362]: Friends Board members provide advice, counsel, and seek to ensure that the Museum has the support and resources needed to realize its goals.
            - paragraph [ref=f486e363]: The Friends of the Neuberger Museum of Art is a 501(c)(3) organization founded to support the Museum as it fosters a diverse community where art thrives and people are inspired to engage with new ideas. This support enables the Museum to host events for our public and members, produce world class exhibitions, provide art education opportunities for underserved students, and be a cultural ambassador to all those who visit us.
