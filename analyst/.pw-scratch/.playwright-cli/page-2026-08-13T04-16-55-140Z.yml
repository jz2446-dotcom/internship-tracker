          - generic [ref=f486e243]:
            - heading "Tours and Programs" [level=2] [ref=f486e250]
            - generic [ref=f486e256]:
              - paragraph [ref=f486e257]: The Neuberger Museum of Art offers education programs which introduce visitors to American art of the 20th century, traditional African art and contemporary art through visitor-centered experiences. The museum staff develops and implements educational programs, under the umbrella of The Phillip and Lynn Straus Center for Education in the Arts, that serve diverse audiences and establish the Neuberger Museum of Art as a regional center for curriculum-based art education.
              - heading [level=3] [ref=f486e258]:
                - link "View our upcoming events and programs" [ref=f486e259] [cursor=pointer]:
                  - /url: https://www.purchase.edu/neuberger-museum-of-art/events/
            - generic [ref=f486e260]:
              - generic [ref=f486e265]:
                - heading "Tours and Groups" [level=3] [ref=f486e266]
                - paragraph [ref=f486e267]: The Neuberger Museum’s docent educators welcome visitors and help them appreciate the art collections presented in our galleries. The art comes alive as you walk the museum with a docent and hear the stories behind the artists and works on view.
                - paragraph [ref=f486e268]:
                  - text: To arrange a guided or self-guided group tour, please contact the Education Department
                  - link "via e-mail" [ref=f486e269] [cursor=pointer]:
                    - /url: mailto:nma.education@purchase.edu
                  - text: .
                - paragraph [ref=f486e270]:
                  - strong [ref=f486e271]: Adult Tours ($10 per person)
                  - strong [ref=f486e272]: School Tours ($10 per person)
              - generic [ref=f486e277]:
                - heading "Pre-K-12 School Tours" [level=3] [ref=f486e278]
                - paragraph [ref=f486e279]: Each school visit is unique. We curate your experience by creating classroom connections that tie our African, Modern and Contemporary art directly to your curriculum. Our goal is to help students develop an appreciation for visual art by creating descriptive dialogue that leaves a lasting impression. We are flexible and work with teachers to meet curriculum objectives and learning standards. (Max Group Size 40 students)
                - heading "Neu Kids Art Access Program" [level=3] [ref=f486e280]
                - paragraph [ref=f486e281]:
                  - text: The Neuberger Museum of Art’s NEU Kids Art Access Program fills an educational gap by providing field trips to the museum for close to 2,000 local children each year. This includes waived admissions, round-trip school bus transportation, lunch, and guided tours with talented docents who bring the galleries to life!
                  - strong [ref=f486e282]: This program is fully subsidized for Title 1 and other qualifying schools.
          - generic [ref=f486e286]:
            - generic [ref=f486e288]:
              - heading "Membership" [level=2] [ref=f486e292]
              - paragraph [ref=f486e296]: As a member of the Neuberger Museum of Art at SUNY Purchase, you are a champion for those who make art, engage with art, and discover meaning through art. Members empower the NEU to move boldly forward, continuing founding patron Roy R. Neuberger’s legacy by showcasing the work of contemporary global artists, fostering arts education, and building a creative community through art. In return, members enjoy benefits such as free parking, discounts in the NEU Museum Store, and invitations to programs and special events through the year.
              - link "Learn about membership opportunities here." [ref=f486e299] [cursor=pointer]:
                - /url: https://neuberger.org/membership-levels/
