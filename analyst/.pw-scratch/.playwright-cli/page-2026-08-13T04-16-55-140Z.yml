                  - heading "Address and Directions" [level=3] [ref=f486e185]
                  - paragraph [ref=f486e186]:
                    - text: 735 Anderson Hill Road Purchase, NY 10577
                    - link "(914)251-6100" [ref=f486e187] [cursor=pointer]:
