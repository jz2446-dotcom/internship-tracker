                  - heading [level=2] [ref=f486e188]:
                    - link "Driving and Parking Directions" [ref=f486e190] [cursor=pointer]:
                      - /url: https://www.purchase.edu/admissions/travel-and-transportation/#Directions
                  - paragraph [ref=f486e191]: Museum visitors should park in the West 1 Visitor Parking Lot. From the main entrance to the SUNY Purchase campus, turn left and continue on the West Loop for approximately one mile; the entrance to the West 1 parking lot will be on your right.
                  - paragraph [ref=f486e192]: Use the pay station located near The Performing Arts Center (located near the ADA-accessible handicap parking spaces) to obtain your parking receipt. Select the duration of your stay and follow the on-screen instructions to obtain your printed receipt. Be sure to place the receipt face up on your vehicle’s dashboard.
                  - paragraph [ref=f486e193]: After parking in West 1, cross the roadway towards the main entrance to campus. At the entrance, there is a glass case with a map of the campus you can use to orient yourself. To get to the plaza level where the museum is located, take the steps or the elevator.
                  - paragraph [ref=f486e194]:
                    - strong [ref=f486e195]: Stairs
                    - text: to the plaza level are located to the right of the amphitheater. Once on the plaza, proceed along the South Arcade (covered walkway). The Museum will be the second building on your right. The entrance is directly across from the large pillar with the “Neuberger Museum of Art” name and color bar.
                  - paragraph [ref=f486e196]:
                    - strong [ref=f486e197]: Elevator
                    - text: access to the plaza level is available inside the Center for Media, Film, and Theatre. When facing the amphitheater and staircase, to your left is a set of glass doors. Enter the CMFT Building and proceed ahead and then to the left through another set of doors. The elevator will be on your right. Button “2” will take you up to the plaza level. As you exit the elevator enclosure, proceed ahead to the South Arcade (covered walkway) then follow the walkway to the left. The Museum will be the second building on your right. The entrance is directly across from the large pillar with the “Neuberger Museum of Art” name and color bar.
