                  - text: here
                - text: for Fairfax County’s policy on candidate use of artificial intelligence in the employment process.
              - paragraph [ref=f274e57]
              - paragraph [ref=f274e58]:
                - text: "Note: All fields must be completed on the application, to include detailed work experience, licenses, certifications, credentials, and education details. Blank fields, and/or initialed, or \"See attached resume\" in those fields will cause your application to be REJECTED. Resumes may be attached as supplemental information only. Your application is the primary tool used to evaluate your job qualifications. For additional information about Application Guidelines and Tips,"
                - link [ref=f274e59] [cursor=pointer]:
                  - /url: https://www.fairfaxcounty.gov/hr/job-application-guidelines-and-tips
                  - text: click here
