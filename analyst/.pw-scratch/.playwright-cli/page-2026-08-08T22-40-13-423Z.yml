                  - strong [ref=f274e52]: Welcome to Fairfax County's job application process
                  - text: "!"
              - paragraph [ref=f274e53]
              - paragraph [ref=f274e54]:
                - text: Click on the job title that you are interested in, review the job description, employment standards and supplemental questions (located on the tab). If you believe you have the required qualifications, then click the 'Apply' link. First-time users will need to create an account in NEOGOV and select a Username and Password. Next, you can build an application by clicking the 'Build Job Application' link. A first-time user may upload their resume into the application – be sure to check all fields to ensure it accurately updates before submitting the application. Once you submit your application, you may check your Status page on your account, which is typically updated within 10 days after the job posting closes. Please
                - link [ref=f274e55] [cursor=pointer]:
                  - /url: https://www.fairfaxcounty.gov/hr/hiring-process-overview
                  - text: click here
                - text: for the Hiring Process Overview. Click
                - link [ref=f274e56] [cursor=pointer]:
