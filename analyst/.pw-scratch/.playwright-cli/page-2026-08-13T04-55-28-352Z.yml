          - paragraph [ref=f1211e33]: Shopify’s 12-month Apprentice Product Manager program is designed to help you gain the skills needed to start a product management career.
          - link "Learn more about our APM Program" [ref=f1211e36] [cursor=pointer]:
            - /url: https://apm.shopify.com
        - generic [ref=f1211e37]:
