          - paragraph [ref=f1211e27]: Shopify offers 4-month paid Engineering internships that are open to students, recent graduates, and those early in their careers.
          - link "Learn more about our Internship Program" [ref=f1211e30] [cursor=pointer]:
            - /url: https://internships.shopify.com/
        - generic [ref=f1211e31]:
