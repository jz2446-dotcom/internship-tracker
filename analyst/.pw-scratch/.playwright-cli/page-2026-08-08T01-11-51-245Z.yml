        - article [ref=f416e99]:
          - generic [ref=f416e103]:
            - heading "Fall 2025 Internship Applications Due" [level=3] [ref=f416e104]
            - heading "Friday, July 18th!" [level=3] [ref=f416e105]
            - paragraph [ref=f416e106]: "Interns at the George W. Bush Presidential Library have the opportunity to work in a variety of areas, such as:"
            - list [ref=f416e107]:
              - listitem [ref=f416e108]: Archival Digitization
              - listitem [ref=f416e109]: History Engagement
              - listitem [ref=f416e110]: Museum Collections
            - paragraph [ref=f416e111]:
              - text: Internships are unpaid, yet can be done for academic credit or volunteer hours. Interns work between 10-40 hours per week for 12 weeks.
              - link "Learn more about the program and apply online for Fall 2025!" [ref=f416e112] [cursor=pointer]:
                - /url: https://www.archives.gov/careers/internships/vip-opportunities-fall-2025
            - figure "Katharine Papp, Summer 2025 intern, Museum Collections" [ref=f416e114]
            - paragraph [ref=f416e116]: What has been your favorite project to work on?
            - paragraph [ref=f416e117]:
              - emphasis [ref=f416e118]: "\"I have enjoyed doing inventory on the 2006 White House Easter Eggs; it was really special to see how artists thoughtfully depicted their home states on delicate eggshells through paintings of landscapes or egg-shaped politicians"
              - text: ."
            - figure "Lauren Davis, Summer 2025 intern, Archival Digitization" [ref=f416e120]
            - paragraph [ref=f416e122]: What drew you to an internship at the George W. Bush Presidential Library?
            - paragraph [ref=f416e123]:
              - emphasis [ref=f416e124]: "\"Getting to learn more about the archival process. It’s been really cool seeing behind the scenes because I’m so familiar with archival work from a researcher standpoint.”"
            - figure "Laura Richardson, Summer 2025 intern, Archival Digitization" [ref=f416e126]
            - paragraph [ref=f416e128]: What have you most enjoyed during your internship?
            - paragraph [ref=f416e129]:
              - emphasis [ref=f416e130]: "“I've really enjoyed working with our specific collection because there are all different types of documents: pamphlets, letters, even Christmas and Thanksgiving cards a teacher had his students send to the Attorney General!”"
