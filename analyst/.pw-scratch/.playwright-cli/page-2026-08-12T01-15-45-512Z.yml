                - heading "Description" [level=3] [ref=f339e101]
                - paragraph [ref=f339e103]:
                  - paragraph [ref=f339e104]:
                    - text: The American Library Association (ALA) is seeking an experienced, organized
                    - strong [ref=f339e105]: Program Manager
                    - text: to support strategic initiatives for its Public Library Association (PLA) division. Working with the Deputy Director and with staff, external partners, and consultants, this grant-funded position will manage a range of programs for PLA’s expanding program/partnership portfolio. Programs address ongoing and emerging public library service areas, helping public libraries become more responsive to and reflective of community needs.
                  - paragraph [ref=f339e106]: At ALA, you will play a key role in delivering impactful programs that support public libraries and communities nationwide. This position offers the opportunity to grow your strategic and organizational expertise, while contributing to a mission-driven organization.
                  - paragraph [ref=f339e107]:
                    - strong [ref=f339e108]: "Responsibilities include:"
                  - list [ref=f339e109]:
                    - listitem [ref=f339e110]: Creating processes, procedures, and workplans for existing and emerging PLA programs, grants, and initiatives as assigned
                    - listitem [ref=f339e111]: Developing content for special projects, presentations, and initiatives in coordination with members, staff, external partners, and consultants
                    - listitem [ref=f339e112]: Effectively communicating the value of engagement with PLA and public libraries to advance shared goals with diverse stakeholders
                    - listitem [ref=f339e113]: Managing complex contracts, RFPs, workflows, and relationships
                    - listitem [ref=f339e114]: Developing, managing, and tracking budgets
                    - listitem [ref=f339e115]: Grant writing and reporting
                    - listitem [ref=f339e116]: Developing and executing evaluation and impact assessment strategies
                    - listitem [ref=f339e117]: Overseeing the work of internal and external stakeholders to meet deadlines
                    - listitem [ref=f339e118]: Researching, identifying, and reaching out to potential new partners to grow programs, resources, and membership
                    - listitem [ref=f339e119]: Serving as liaison to stakeholder groups as assigned, including volunteer management and funder engagement
                  - paragraph [ref=f339e120]: This is a regular full-time position based in our Chicago office.
                  - paragraph [ref=f339e121]: ALA staff are currently working on a hybrid schedule. Please note that although we have a generous telecommuting policy for our employees, we do not have fully remote positions outside of our workplace sites.
                  - paragraph [ref=f339e122]: All offers of employment are contingent upon satisfactory completion of a background check and proof of eligibility to work in the United States.
                  - paragraph [ref=f339e123]:
                    - strong [ref=f339e124]: Salary & Benefits
                  - paragraph [ref=f339e125]:
                    - text: Starting salary range is negotiable from
                    - strong [ref=f339e126]: $75k
                    - text: based on relevant experience. ALA offers an excellent benefits package that includes flexible work schedules, medical and dental coverage, generous paid time off, a retirement annuity, and a 35-hour work week. You may also qualify for the Public Service Loan Forgiveness Program (PSLF).
                  - paragraph [ref=f339e127]:
                    - strong [ref=f339e128]: For Consideration
                  - paragraph [ref=f339e129]:
                    - generic [ref=f339e130]:
                      - text: Apply online including a cover letter and resume at
                      - link "https://www.ala.org/aboutala/contactus/workatala" [ref=f339e131] [cursor=pointer]:
                        - /url: https://www.ala.org/aboutala/contactus/workatala
                  - paragraph [ref=f339e132]:
                    - strong [ref=f339e133]: Requirements
                  - list [ref=f339e134]:
                    - listitem [ref=f339e135]: Demonstrated project management experience with on-time and on-budget results
                    - listitem [ref=f339e136]: Outstanding written and verbal communication skills
                    - listitem [ref=f339e137]: Expertise in relationship building and collaboration
                    - listitem [ref=f339e138]: Strong organizational abilities and attention to detail
                    - listitem [ref=f339e139]: Excellent judgment, strategic thinking, and problem-solving skills that demonstrate a proactive and curious approach to workplace challenges
                    - listitem [ref=f339e140]: Demonstrated grant writing and grant management experience
                    - listitem [ref=f339e141]: Excellent budget development and management skills
                    - listitem [ref=f339e142]: Nonprofit or association management experience, or experience working with volunteer membership organizations
                    - listitem [ref=f339e143]: Ability to work independently and within a team; familiarity with matrixed workplace structure
                    - listitem [ref=f339e144]: Experience with a variety of project management and productivity tools, including proficiency in Microsoft Office 365
                    - listitem [ref=f339e145]: Up to 5% travel may be required for this position
                  - paragraph [ref=f339e146]:
                    - strong [ref=f339e147]: Preferred but not Required
                  - list [ref=f339e148]:
                    - listitem [ref=f339e149]: Supervisory experience
                    - listitem [ref=f339e150]: Public speaking experience
                    - listitem [ref=f339e151]: Experience with donor engagement/funder management tools such as Foundant
                    - listitem [ref=f339e152]: Knowledge and understanding of public librarianship and education trends
                  - paragraph [ref=f339e153]:
                    - strong [ref=f339e154]: Additional Information
                  - list [ref=f339e155]:
                    - listitem [ref=f339e156]: This position is funded through a grant that enables the Association to expand and enhance its programs and services. We are seeking a candidate who is passionate about our mission and excited to contribute to the long-term success of this initiative. Employment is contingent upon the continued availability of grant funding.
