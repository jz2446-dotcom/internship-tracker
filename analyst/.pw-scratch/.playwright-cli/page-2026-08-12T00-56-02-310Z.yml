  - generic [ref=f50e277]:
    - generic [ref=f50e279]:
      - generic [ref=f50e282]:
        - heading "Who Can Become a Member of Beginnings Credit Union?" [level=2] [ref=f50e283]
        - paragraph [ref=f50e284]
        - paragraph [ref=f50e285]: At the heart of every great beginning is a community. At Beginnings Credit Union, we are proud to serve 33 counties full of possibility!
        - paragraph [ref=f50e286]:
          - text: If you live, work, worship, attend school, or own a business located in our service area, or if you're connected* to one of our
          - link "Select Employer Groups (SEGs)" [ref=f50e287] [cursor=pointer]:
            - /url: /docs/default-source/default-document-library/core-seg-groups.pdf?sfvrsn=a386e80d_1
          - text: ", you're invited to join. All it takes is maintaining $5.00 in your membership share account to get started."
        - paragraph [ref=f50e288]:
          - text: And because we believe in
          - emphasis [ref=f50e289]: all that is possible
          - text: through connection, your spouse as well as your lineal ancestors and descendants — including those related by adoption — are also welcome to join as long as you're eligible.
        - paragraph [ref=f50e290]
        - paragraph [ref=f50e291]:
          - emphasis [ref=f50e292]: "*Affiliation with a Select Employer Group includes employment, volunteering, attending school, worshipping, or membership with a listed group."
        - paragraph [ref=f50e293]
      - list [ref=f50e295]:
        - listitem [ref=f50e296]:
          - link "Become a Beginnings Member" [ref=f50e297] [cursor=pointer]:
            - /url: https://forms.fivision.com/beginnings/oa/
    - generic [ref=f50e299]:
      - generic [ref=f50e301]:
        - heading "You Can Be a Member for Life" [level=2] [ref=f50e302]
        - paragraph [ref=f50e303]:
          - text: Once you are a member at Beginnings Credit Union, you are a member for life* even if you move. Our
          - link "Digital Banking" [ref=f50e304] [cursor=pointer]:
            - /url: /personal/resources/digital-banking
          - text: and network of surcharge-free ATMs makes it easy to continue to conduct business with us and benefit from our outstanding loan rates and deposit yields.
        - heading [level=4] [ref=f50e305]:
          - generic [ref=f50e306]:
            - text: Banking for THIS moment.
            - superscript [ref=f50e307]: ®
      - list [ref=f50e311]:
        - listitem [ref=f50e312]:
          - link "Join Beginnings Today" [ref=f50e313] [cursor=pointer]:
            - /url: https://forms.fivision.com/beginnings/oa/
      - paragraph [ref=f50e316]: "*Member share must remain open to maintain membership. If member share is closed, one must meet our membership eligibility requirements at the time of re-establishing membership."
    - generic [ref=f50e325]:
      - heading "What is a Credit Union and Why Should You Join?" [level=2] [ref=f50e326]
      - paragraph [ref=f50e327]: Credit Unions are similar to banks, we offer checking, savings, loans, credit cards, and many other financial products and services. However, there are some important differences between Banks and Credit Unions. As a Credit Union, we are a not-for-profit, owned by our members. We have a Volunteer Board of Directors and Supervisory Committee who are elected by our members and are members themselves. Our profits are used to lower interest on loans, increase interest on savings, lower fees, offer products like our No Closing Cost Mortgages, and give back to our local communities.
      - paragraph [ref=f50e328]:
        - text: Maybe Your Bank Should be a Credit Union
        - superscript [ref=f50e329]: ®
