    - generic [ref=f2050e68]:
      - heading "Our Culture and Values" [level=2] [ref=f2050e70]
      - list [ref=f2050e72]:
        - listitem [ref=f2050e73]:
          - heading "We are Changemakers" [level=3] [ref=f2050e74]
          - paragraph [ref=f2050e76]: ...we make a real impact on communities, to our fellow people and partners and to our planet. Our aim is to achieve maximum environmental benefit for all.
        - listitem [ref=f2050e77]:
          - heading "We are Entrepreneurs" [level=3] [ref=f2050e78]
          - paragraph [ref=f2050e80]: ...we bring entrepreneurial flair, agility and an open mind. We get the support and space to succeed, with the freedom to achieve our ambitions.
        - listitem [ref=f2050e81]:
          - heading "We are One Team" [level=3] [ref=f2050e82]
          - paragraph [ref=f2050e84]: ...we are unified through our shared purpose and work together to deliver genuine climate impact for all. We constantly evolve — we do things differently, and we think differently.
        - listitem [ref=f2050e85]:
          - heading "We Celebrate Differences" [level=3] [ref=f2050e86]
          - paragraph [ref=f2050e88]: ... we are driven by curiosity, passion, purpose & optimism, we believe everyone can make a difference. We know everyone plays a part in shaping the future.
    - list [ref=f2050e92]:
      - listitem [ref=f2050e93]:
        - generic [ref=f2050e95]:
          - figure
        - generic [ref=f2050e96]:
          - heading "Act and Empower Others" [level=3] [ref=f2050e97]
          - paragraph [ref=f2050e99]: We share our knowledge with each other and ensure all of our people have the tools they need to be a success. We care about each other and by appreciating one another, we make our people feel like they count because we all play our part at South Pole.
      - listitem [ref=f2050e100]:
        - generic [ref=f2050e102]:
