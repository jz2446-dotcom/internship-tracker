    - generic [ref=f2050e133]:
      - generic [ref=f2050e134]:
        - figure
      - generic [ref=f2050e135]:
        - heading "Diversity is our Strength" [level=2] [ref=f2050e136]
        - paragraph [ref=f2050e138]: At South Pole, we strive to build and nurture a culture where inclusiveness is an automatic reflex. We know that the power to start building a better future and climate for everyone begins with inclusivity and social justice. Equity, access, participation, visibility and rights for all of our employees are vital as we tackle those challenges we face, these all signify an environment where all colleagues feel supported to bring their whole selves to work. We are made up of a wonderful tapestry of people all of who play their part in the future of our business and the world.
    - generic [ref=f2050e140]:
      - heading "Our Penguin Resource Groups (PRG)" [level=2] [ref=f2050e142]
      - list [ref=f2050e144]:
        - listitem [ref=f2050e145]:
          - generic [ref=f2050e147]:
            - figure
          - generic [ref=f2050e148]:
            - heading "WIN" [level=3] [ref=f2050e149]
            - paragraph [ref=f2050e151]: The Women Inclusion Network’s aim is to positively and proactively contribute to creating a diverse workforce at South Pole where women are empowered to reach their full potential.
        - listitem [ref=f2050e152]:
          - generic [ref=f2050e154]:
            - figure
          - generic [ref=f2050e155]:
            - heading "MOAK" [level=3] [ref=f2050e156]
            - paragraph [ref=f2050e158]: Minds of All Kinds is focused on neurodiversity and mental health. The mission of MOAK is to champion neurodiversity and mental health at South Pole in order to create an inclusive workplace for minds of all kinds.
        - listitem [ref=f2050e159]:
          - generic [ref=f2050e161]:
            - figure
          - generic [ref=f2050e162]:
            - heading "FUSION" [level=3] [ref=f2050e163]
            - paragraph [ref=f2050e165]: FUSION serves to foster an inclusive community at South Pole, advancing equality for lesbian, gay, bisexual, transgender, queer/questioning, intersex and asexual people. The LGBTQIA+ PRG consists of LGBTQIA+ individuals and allies interested in LGBTQIA+ issues.
        - listitem [ref=f2050e166]:
          - generic [ref=f2050e168]:
            - figure
          - generic [ref=f2050e169]:
            - heading "REACH" [level=3] [ref=f2050e170]
            - paragraph [ref=f2050e172]: The aim of the REACH (Race, Ethnicity and Cultural Heritage) resource group is to create a supportive and collaborative community for South Pole employees who represent racial, ethnic and cultural minorities.
        - listitem [ref=f2050e173]:
          - generic [ref=f2050e175]:
            - figure
          - generic [ref=f2050e176]:
            - heading "PACT" [level=3] [ref=f2050e177]
            - paragraph [ref=f2050e179]: Developed to provide a network of support and resources to fellow employees who face the unique challenges of being a working caregiver, an avenue for us to build solutions, advocate for needs to advance in the workplace, and contribute to the success of South Pole’s mission and core values.
    - list [ref=f2050e184]:
      - listitem [ref=f2050e185]:
        - heading "Work-life balance" [level=3] [ref=f2050e186]
        - paragraph [ref=f2050e188]: From flexible working hours to flexible workplace (home office), with above-average vacation allowances, we strive to make the work and family life puzzle an easy one for our employees.
      - listitem [ref=f2050e189]:
        - heading "Flexible Vacation Benefits" [level=3] [ref=f2050e190]
        - paragraph [ref=f2050e192]: Options to buy up to 5 extra days of time off.
      - listitem [ref=f2050e193]:
        - heading "Life Insurance" [level=3] [ref=f2050e194]
        - paragraph [ref=f2050e196]: Available to all employees across the world.
      - listitem [ref=f2050e197]:
        - heading "Care for your Wellbeing" [level=3] [ref=f2050e198]
        - paragraph [ref=f2050e200]: Access to mental, physical and financial wellbeing support through our Employee Assistance Program (TELUS Health).
      - listitem [ref=f2050e201]:
        - heading "Parental leave" [level=3] [ref=f2050e202]
        - paragraph [ref=f2050e204]: Should any of our employees need to take time off the Iceberg as a result of a new addition to their household, we are happy to be able to offer competitive Paid Parental leave to support them during this time.
      - listitem [ref=f2050e205]:
        - heading "Compassionate Leave" [level=3] [ref=f2050e206]
        - paragraph [ref=f2050e208]: Sometimes life is unpredictable, and when unfortunate events occur, we want to give you peace of mind so you feel fully supported during this time.
