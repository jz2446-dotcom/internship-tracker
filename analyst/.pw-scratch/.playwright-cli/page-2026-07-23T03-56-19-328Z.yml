        - generic [ref=f2050e103]:
          - heading "Build Trust" [level=3] [ref=f2050e104]
          - paragraph [ref=f2050e106]: We build trust by showing that we are caring, fair, open and honest people at South Pole. We build trust through our knowledge, experience, expertise and excellent results. We are a team that trusts each other, we work together to deliver world-class, change-making solutions.
      - listitem [ref=f2050e107]:
        - generic [ref=f2050e109]:
          - figure
        - generic [ref=f2050e110]:
          - heading "Be Ambitious" [level=3] [ref=f2050e111]
          - paragraph [ref=f2050e113]: We are a team focused on achieving the net-zero ambitions of all of our clients. We continue to innovate and find new ways to deliver unique solutions that enable the organisations we work alongside to exceed their targets and goals on climate change.
