    - paragraph [ref=f2050e403]:
      - emphasis [ref=f2050e404]: We’re a planet of 8 billion unique and different people. We all have a contribution to make and South Pole is proud to be an Equal Opportunity Employer. We do not discriminate on the basis of race, religion, colour, sex, gender identity, sexual orientation, age, national origin, marital status, or disability. Our recruitment is decided on the basis of qualifications, merit and business need.South Pole has a centralised Recruitment function and only engages with preferred suppliers when required where we have pre-agreed terms and conditions in place. We do not accept unsolicited resumes from agencies and will not be bound by terms not agreed centrally with the recruitment function.
