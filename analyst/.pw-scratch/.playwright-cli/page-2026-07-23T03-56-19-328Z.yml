    - generic [ref=f2050e59]:
      - heading "Purpose is our Power" [level=2] [ref=f2050e60]
      - generic [ref=f2050e61]:
        - paragraph [ref=f2050e62]
        - paragraph [ref=f2050e63]: At South Pole, our people are connected through our shared purpose and united through our passion. We all play our part as we work together to build a place that nurtures and sustains a global, inclusive culture. Our different backgrounds and varied perspectives help us innovate, generate better ideas and deliver world-class solutions that help solve global climate issues. We continue our mission to build a sustainable and equitable society.
        - paragraph [ref=f2050e64]:
          - text: Whether we are strategists, defenders or protectors - we all make a difference -
