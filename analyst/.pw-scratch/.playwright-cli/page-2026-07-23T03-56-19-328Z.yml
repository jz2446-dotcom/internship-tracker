        - generic [ref=f2050e414]:
          - heading "About South Pole" [level=2] [ref=f2050e415]
          - generic [ref=f2050e416]:
            - paragraph [ref=f2050e417]
            - paragraph [ref=f2050e418]: Our story began in Zurich, with 5 friends* in 2002. They had a belief and a vision to shape and change the future of the world through climate empowerment, education and projects with their non-profit organisation; MyClimate. These ‘social entrepreneurs’ went on to pioneer climate change with the introduction of South Pole in 2006*. More than 20 years on, with the support of some of the most passionate and talented entrepreneurs around them, who are empowered to all play their part and with their founding belief in aligning purpose with passion, people and profit, they have created South Pole, an organisation that has gone onto positively impact the lives of over 20 million people across the world through its projects, saving over 20,000 km2 of forests from deforestation.
            - paragraph [ref=f2050e419]
            - paragraph [ref=f2050e420]:
              - emphasis [ref=f2050e421]: "*Patrick Bürgi, Thomas Camerata, Renat Heuberger, Ingo Puhl, and Christoph Sutter"
