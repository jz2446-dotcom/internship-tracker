      - term [ref=f72e68]:
        - heading "Job Summary" [level=2] [ref=f72e69]
      - definition [ref=f72e70]:
        - paragraph [ref=f72e71]:
          - text: Under general supervision, is assigned to the Library Department to assist in general administrative and/or research functions for the purpose of developing a working knowledge of a targeted area in library operations. Performs internship duties in accordance with benchmarked professional positions. Will perform advanced Internship duties. Working conditions are primarily inside an office environment. Exercises no supervision.
          - generic [ref=f72e72]: This position is an "unclassified" position and has no disciplinary appeal rights to the Municipal Civil Service Commission. This position is likewise subject to at-will employment status and can be terminated at any time for any reason.
          - strong [ref=f72e74]: Work Location
          - text: One of 28 library locations
          - strong [ref=f72e76]: Work Hours
          - generic [ref=f72e77]: Hours vary but are limited to less than 20 hours per week.
      - term [ref=f72e78]:
        - heading "Essential Job Functions" [level=2] [ref=f72e79]
      - definition [ref=f72e80]:
        - paragraph
        - list [ref=f72e81]:
          - listitem [ref=f72e82]: Apply major area of studies of career interest by observing and assisting professionals in the assigned department where work will be performed.
          - listitem [ref=f72e83]: May take the lead in the coordination, administration and/or monitoring of specific programs.
          - listitem [ref=f72e84]: Responsible for conducting research, collecting and organizing data, performing analyses and preparing reports.
          - listitem [ref=f72e85]: Propose solutions to existing problems and discuss recommendations with administrative personnel.
          - listitem [ref=f72e86]: Responsible for special projects as assigned.
        - paragraph
      - term [ref=f72e87]:
        - heading "Job Requirements" [level=2] [ref=f72e88]
      - definition [ref=f72e89]:
        - paragraph
        - list [ref=f72e90]:
          - listitem [ref=f72e91]: Must be enrolled in a U.S. Department of Education accredited degree program, graduate or post graduate.
        - strong [ref=f72e92]: Preferred Qualifications
        - list [ref=f72e93]:
          - listitem [ref=f72e94]: Enrolled in a U.S. Department of Education graduate Library and Information Sciences Program. Prefer Internship be completed in conjunction with practicum class required for graduation.
          - listitem [ref=f72e95]: Knowledge of fundamental public library principles, methods, materials, and practices
        - strong [ref=f72e96]: Applicant Information
        - list [ref=f72e97]:
          - listitem [ref=f72e98]: If selected for this position, official transcripts, diplomas, certifications and licenses must be submitted at the time of processing. Unofficial transcripts and copies of other relevant documents may be attached to the application for consideration in advance.
          - listitem [ref=f72e99]: Please be advised that if selected for this position, information regarding employment history as it relates to the qualifications of the position will be needed for employment verification. Applicants claiming military service to meet the experience requirement for this position may attach a DD214 to the application.
          - listitem [ref=f72e100]: Unless otherwise stated, applicants are permitted to substitute two years of related full-time experience for one year of higher education or one year of related higher education for two years of experience in order to meet the minimum requirements of the job. One year of full-time experience is defined as 30 or more hours worked per week for 12 months. One year of higher education is defined as 30 credit hours completed at an accredited college or university.
          - listitem [ref=f72e101]: Applicants selected for employment with the City of San Antonio in this position must receive satisfactory results from pre-employment drug testing and background checks. If required for the position, a physical, motor vehicle record evaluation, and additional background checks may be conducted.
        - paragraph
      - term [ref=f72e102]:
        - heading "Knowledge, Skills, and Abilities" [level=2] [ref=f72e103]
      - definition [ref=f72e104]:
        - paragraph
        - list [ref=f72e105]:
          - listitem [ref=f72e106]: Effective interpersonal skills, strong oral and written communications skills and computer skills.
          - listitem [ref=f72e107]: Effective problem solving ability.
          - listitem [ref=f72e108]: Self-motivation and ability to work with minimal supervision.
          - listitem [ref=f72e109]: Knowledge of statistical analysis.
          - listitem [ref=f72e110]: Skill in operating a personal computer and utilizing rudimentary software.
          - listitem [ref=f72e111]: Ability to operate a computer keyboard and other basic office equipment.
          - listitem [ref=f72e112]: Ability to communicate clearly and effectively.
          - listitem [ref=f72e113]: Ability to create clear and concise reports.
          - listitem [ref=f72e114]: Ability to learn pertinent Federal, State, and local laws and ordinances.
          - listitem [ref=f72e115]: Ability to establish and maintain effective working relationships with City staff and the general public.
        - paragraph
