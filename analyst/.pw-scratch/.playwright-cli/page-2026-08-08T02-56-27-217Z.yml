          - generic [ref=f155e66]:
            - emphasis [ref=f155e68]: Andreessen Horowitz is a Silicon Valley-based venture capital firm with $10 billion under management. Focused on investing in software eating the world, the firm partners with entrepreneurs in their company building at all stages – from seed to late-stage – in the biology, consumer, crypto, and enterprise industries.
            - emphasis [ref=f155e70]: Summer Intern
            - emphasis [ref=f155e72]: "Under the supervision of our departmental teams; the intern responsibilities include:"
            - list [ref=f155e73]:
              - listitem [ref=f155e74]:
                - emphasis [ref=f155e75]: Handling a variety of special ad-hoc projects and research
              - listitem [ref=f155e76]:
