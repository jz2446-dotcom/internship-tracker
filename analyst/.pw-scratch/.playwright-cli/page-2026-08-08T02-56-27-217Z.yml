            - emphasis [ref=f155e79]: Qualifications
            - list [ref=f155e80]:
              - listitem [ref=f155e81]:
                - emphasis [ref=f155e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f155e83]:
                - emphasis [ref=f155e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f155e85]:
                - emphasis [ref=f155e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f155e87]:
                - emphasis [ref=f155e88]: Must be a team player with a “no job is too big or too small attitude”
              - listitem [ref=f155e89]:
