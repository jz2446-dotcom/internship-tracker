                - list [ref=f1670e47]:
                  - listitem [ref=f1670e48]:
                    - paragraph [ref=f1670e51]: Winterthur proudly sponsors two graduate programs with the University of Delaware. Our fellowship program offers unparalleled access to a wealth of museum, garden, and library collections supporting material culture research.
              - listitem [ref=f1670e52]:
