                - list [ref=f1670e40]:
                  - listitem [ref=f1670e41]:
                    - paragraph [ref=f1670e44]: Be inspired by America’s heritage on guided tours of the 175-room former home and gardens of Henry Francis du Pont. Groups can work with us to customize the visit.
