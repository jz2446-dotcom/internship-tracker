      - generic [ref=f175e258]:
        - paragraph [ref=f175e259]:
          - strong [ref=f175e260]: "Partner with Texas Southern University: Invest in Talent, Impact the Future"
          - text: "At Texas Southern University (TSU), we are cultivating the next generation of leaders, innovators, and changemakers. As one of the nation’s premier historically Black universities, TSU offers a rich pipeline of diverse, driven, and career-ready students across a wide range of disciplines. We invite companies and organizations to partner with us in two powerful ways:"
          - strong [ref=f175e261]: "• Recruitment:"
          - text: Connect with top-tier talent through internships, career fairs, and on-campus engagement opportunities. Our students bring fresh perspectives, strong academic foundations, and a commitment to excellence.
          - strong [ref=f175e262]: "• Philanthropic Support:"
          - text: "Your investment in scholarships, academic programs, and student success initiatives helps us expand access to education and empower future leaders. Together, we can create lasting impact in our communities and industries. Join us in shaping a brighter future—partner with TSU today. Texas Southern University Career Pathways Center is proudly connected with leading professional organizations that enhance career development, employer engagement, and student success. We are active members of: National Association of Colleges and Employers (NACE) The leading source for career services standards, trends, and best practices in higher education and workforce readiness. Southern Association of Colleges and Employers (SoACE) A regional network supporting collaboration between career services professionals and employers across the South. Houston Area Consortium of Career Centers (HACCC) A partnership of Houston-area universities working together to connect students with top local employers and opportunities. For more information please contact Jeff Wallace or Bea Emanuel-Sims in the Office of Development at 713.313.6747."
        - link [ref=f175e264] [cursor=pointer]:
          - /url: https://give.tsu.edu/campaign/617673/donate
          - strong [ref=f175e265]: Give A Gift
