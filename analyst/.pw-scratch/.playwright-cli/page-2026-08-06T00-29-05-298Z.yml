            - paragraph [ref=f175e100]: Internship Program
            - paragraph [ref=f175e101]:
              - strong [ref=f175e102]: "Division:"
            - paragraph [ref=f175e103]: "Investment Bank: Investment Banking & Capital Markets (IBCM)"
            - paragraph [ref=f175e104]:
              - strong [ref=f175e105]: "Role:"
            - paragraph [ref=f175e106]: IBCM Capital Markets (DCM, ECM, SETG, LDCM Desk)
            - paragraph [ref=f175e107]:
              - strong [ref=f175e108]: "Location:"
            - paragraph [ref=f175e109]: New York
            - paragraph [ref=f175e110]:
              - strong [ref=f175e111]: "About the program:"
            - paragraph [ref=f175e112]:
              - text: The Deutsche Bank
              - link "Internship Program" [ref=f175e113] [cursor=pointer]:
                - /url: https://careers.db.com/students-graduates/internship-programme/
              - text: is designed to help you develop your skills through formal training and continuous support. You’ll quickly gain the confidence to take on real projects by learning first-hand how and what we deliver for clients worldwide. You’ll feel supported by colleagues from across our business and start to develop your professional network.
            - paragraph [ref=f175e114]:
              - strong [ref=f175e115]: "About the division:"
            - paragraph [ref=f175e116]: Our Investment Banking & Capital Markets business provides the full range of advisory and financing products and services of a leading global investment bank. Our clients include large-cap and mid-cap corporates, financial institutions, governments, government agencies and financial sponsors.
            - paragraph [ref=f175e117]: We recognize that selecting the right investment banking partner can be the key to a company’s success. Our relationships are enhanced by industry sector, country and regional expertise, closely aligned to high-quality client solutions. We offer both buyside and sellside advisory services for mergers and acquisitions, restructuring advisory, debt and equity capital raising services (including our dedicated Environmental Social Governance (ESG) solutions) and structured equity transactions. We advise on innovative cross-border and regional transactions in the US, Europe and Asia Pacific.
            - paragraph [ref=f175e118]:
              - strong [ref=f175e119]: "About the role:"
            - paragraph [ref=f175e120]: "As an IBCM Analyst Intern, you’ll work on projects to help our clients reach their financial goals. Your day-to-day tasks may vary depending on your business area, but Analyst Intern responsibilities include:"
            - list [ref=f175e121]:
              - listitem [ref=f175e122]: Performing in-depth company and industry research and analysis
              - listitem [ref=f175e123]: Supporting the execution of external client advisory and live financial transactions while managing multiple projects with rigid and, at times, global timelines
              - listitem [ref=f175e124]: Preparing marketing materials and transaction documentation, including but not limited to confidential memoranda, pitch books, corporate profiles, and analysis
              - listitem [ref=f175e125]: Conducting detailed financial modeling, valuation and forecasting of financial statements
              - listitem [ref=f175e126]: Understanding of the Bank’s product suite
            - paragraph [ref=f175e127]: "Areas in which you could work:"
            - paragraph [ref=f175e128]: "‒ Product Groups: Debt Capital Markets, Equity Capital Markets, Strategic Equity Transactions Group, Leveraged Debt Capital Markets"
            - paragraph [ref=f175e129]:
              - strong [ref=f175e130]: "What we look for:"
            - paragraph [ref=f175e131]: "We recruit students and graduates who have:"
            - list [ref=f175e132]:
              - listitem [ref=f175e133]: A strong foundational knowledge and interest in Corporate Finance and Accounting
              - listitem [ref=f175e134]: Confident, constructive and effective communication skills
              - listitem [ref=f175e135]: An ability to solve problems, organize tasks, be agile, and work flexibly to manage multiple projects with rigid and fluctuating timelines, often driven by external client demands
              - listitem [ref=f175e136]: An interest and ability to work collaboratively across the Deutsche Bank platform and global teams in support of our clients
              - listitem [ref=f175e137]: Proven ability to leverage AI tools to enhance productivity, optimise workflows to solve business problems, while applying critical judgment to ensure responsible and ethical use of data and AI outputs.
            - paragraph [ref=f175e138]: A formal mathematical or financial background isn’t required. Our comprehensive training programs and apprentice-style learning will provide you technical skills you’ll need to build a career with us.
            - paragraph [ref=f175e139]: "To be eligible for the 2027 Internship Program you must:"
            - list [ref=f175e140]:
              - listitem [ref=f175e141]: Complete your studies (all final exams, coursework and have no outstanding requirements for graduation) between 1st December 2027 and 31st July 2028.
            - paragraph [ref=f175e142]: At this time, Deutsche Bank will only consider applicants who are presently authorized to work for any employer in the United States and who will not require work visa sponsorship from Deutsche Bank, now or in the future, to retain their authorization to work in the United States.
            - paragraph [ref=f175e143]:
              - strong [ref=f175e144]: "Benefits and wellbeing:"
            - paragraph [ref=f175e145]:
              - text: Feeling healthy, engaged and well-supported, enables us to do our best work and get the most out of life outside the office. That’s why Deutsche Bank is committed to providing benefits and programs centered around wellbeing.
              - link "Benefits & Wellbeing – Deutsche Bank Careers (db.com)" [ref=f175e146] [cursor=pointer]:
                - /url: https://careers.db.com/explore-the-bank/working-environment/benefits-wellbeing/
            - paragraph [ref=f175e147]: The annualized salary for this position is $110,000. Interns are not eligible for incentive compensation.
            - paragraph [ref=f175e148]:
              - strong [ref=f175e149]: "About us and our teams:"
            - paragraph [ref=f175e150]: Our values define the working environment we strive to create – where our people have a sense of belonging and everyone feels welcomed, respected and can contribute and grow. We know that high-performing teams have different skills, backgrounds, and experiences. We collaborate, encourage and enable open dialogue and diversity of views. We build talented and diverse teams to drive business results and encourage our people to develop to their full potential. Talk to us about flexible work arrangements and other initiatives we offer.
            - paragraph [ref=f175e151]: We promote good working relationships and encourage high standards of conduct and work performance. We welcome applications from talented people from all cultures, countries, races, genders, sexual orientations, disabilities, beliefs and generations and are committed to providing a working environment free from harassment, discrimination and retaliation.
            - paragraph [ref=f175e152]:
              - text: Visit
              - link "This is DB – Deutsche Bank Careers" [ref=f175e153] [cursor=pointer]:
                - /url: https://careers.db.com/this-is-db/
              - text: to discover more about the culture of Deutsche Bank including Diversity, Equity & Inclusion, Leadership, Learning, Future of Work and more besides.
            - paragraph [ref=f175e154]:
              - text: Deutsche Bank is an Equal Opportunity Employer – Veterans/Disabled and other protected categories. Click these links to view the “
              - link "EEO is the Law" [ref=f175e155] [cursor=pointer]:
                - /url: http://www.dol.gov/ofccp/regs/compliance/posters/pdf/eeopost.pdf
              - text: ” poster and “
              - link "pay transparency statement." [ref=f175e156] [cursor=pointer]:
                - /url: https://www.dol.gov/ofccp/PayTransparency.html
              - text: “
            - paragraph [ref=f175e157]:
              - strong [ref=f175e158]: "How to apply:"
            - paragraph [ref=f175e159]:
              - text: Whether you’re fresh out of school or already have some experience, you’ll find a wealth of helpful tools and information on our
              - link "Employability Hub" [ref=f175e160] [cursor=pointer]:
                - /url: https://careers.db.com/students-graduates/employability-hub/
              - text: that will support you with your application, prepare for the assessment processes and adapt to a new working environment.
            - paragraph [ref=f175e161]:
              - text: Please visit
              - link "www.careers.db.com" [ref=f175e162] [cursor=pointer]:
                - /url: http://www.careers.db.com/
              - text: /students-graduates to apply.
            - paragraph [ref=f175e163]:
              - strong [ref=f175e164]: The application deadline for this role is August 14th, 2026 at 9:00 AM EDT
            - paragraph [ref=f175e165]:
              - link "A notice on Recruitment Scams" [ref=f175e166] [cursor=pointer]:
                - /url: https://careers.db.com/professionals/a-notice-on-recruitment-scams
            - paragraph [ref=f175e167]: "Please note that candidates are not required to pay money as part of the recruitment or job placement process. Do not divulge personal information if you are unsure of the authenticity of a communication from someone who claims to be representing Deutsche Bank. A notice on such scams and practices has been hosted on our website on the link below:"
            - paragraph [ref=f175e168]:
              - link "https://careers.db.com/professionals/a-notice-on-recruitment-scams" [ref=f175e169] [cursor=pointer]:
                - /url: https://careers.db.com/professionals/a-notice-on-recruitment-scams
            - paragraph [ref=f175e170]: "#LI-EC1"
