            - paragraph [ref=f352e63]
            - paragraph [ref=f352e64]:
              - strong [ref=f352e65]: About Lee & Associates Houston
            - paragraph [ref=f352e66]: Lee & Associates – Houston was founded in 2015 and has consistently been named one of Houston Business Journal’s Top Brokerage Firms. We are a fully integrated commercial real estate company ready to creatively respond to our clients’ needs. In addition to brokerage services, the Houston office has expanded to include a property management portfolio, a medical office business line, and a retail division. Lee & Associates – Houston is part of a nation-wide team of brokers, with more than 80 office locations in cities across the US and Canada. Our unrivaled capabilities and unwavering dedication to integrity appeal to smart building owners and company managers who recognize the value of partnering with a business-minded broker. Through hard work and fierce commitment, Lee & Associates – Houston promises to deliver optimum returns on a company or client’s real estate investments.
            - paragraph [ref=f352e67]:
              - strong [ref=f352e68]: Position Summary
            - paragraph [ref=f352e69]:
              - text: We are seeking a seasoned
              - strong [ref=f352e70]: Multifamily Property Manager
              - text: to lead the day-to-day operations, financial performance, resident experience, and overall success of a multifamily community. This individual will be responsible for maximizing occupancy and revenue, controlling operating expenses, maintaining the physical asset, developing a high-performing onsite team, and delivering exceptional service to residents and ownership.
            - paragraph [ref=f352e71]: The ideal candidate is an experienced, hands-on property management professional with strong leadership, financial, operational, and customer-service skills. The successful candidate will be comfortable managing competing priorities, making sound business decisions, and holding themselves and their team accountable for results.
            - paragraph [ref=f352e72]:
              - strong [ref=f352e73]: Key Responsibilities
            - paragraph [ref=f352e74]:
              - strong [ref=f352e75]: Property Operations
            - list [ref=f352e76]:
              - listitem [ref=f352e77]: Oversee all aspects of daily operations for the assigned multifamily community.
              - listitem [ref=f352e78]: Maintain high standards for curb appeal, cleanliness, safety, maintenance, and overall property condition.
              - listitem [ref=f352e79]: Conduct regular property inspections and ensure timely resolution of deficiencies.
              - listitem [ref=f352e80]: Coordinate capital projects, renovations, vendor activities, and preventative maintenance programs.
              - listitem [ref=f352e81]: Ensure compliance with company policies, local regulations, Fair Housing requirements, and applicable housing laws.
            - paragraph [ref=f352e82]:
              - strong [ref=f352e83]: Financial Management
            - list [ref=f352e84]:
              - listitem [ref=f352e85]: Develop, manage, and achieve annual operating budgets and financial goals.
              - listitem [ref=f352e86]: Monitor monthly financial performance, variances, collections, expenses, and operating trends.
              - listitem [ref=f352e87]: Identify opportunities to increase revenue and improve operating efficiencies.
              - listitem [ref=f352e88]: Manage accounts receivable, delinquency, bad debt, concessions, and resident balances.
              - listitem [ref=f352e89]: Prepare and present financial and operational reports to ownership and senior leadership.
            - paragraph [ref=f352e90]:
              - strong [ref=f352e91]: Leasing & Revenue Performance
            - list [ref=f352e92]:
              - listitem [ref=f352e93]: Drive occupancy, leasing velocity, retention, and revenue growth.
              - listitem [ref=f352e94]: Monitor market conditions, competitive properties, pricing, concessions, and rental trends.
              - listitem [ref=f352e95]: Develop and implement strategies to maximize rental income and minimize vacancy.
              - listitem [ref=f352e96]: Oversee leasing activity and ensure prospects and residents receive an exceptional customer experience.
              - listitem [ref=f352e97]: Analyze leasing performance and take corrective action when necessary.
            - paragraph [ref=f352e98]:
              - strong [ref=f352e99]: Team Leadership
            - list [ref=f352e100]:
              - listitem [ref=f352e101]: Recruit, train, coach, and develop onsite team members.
              - listitem [ref=f352e102]: Establish clear performance expectations and hold employees accountable for results.
              - listitem [ref=f352e103]: Foster a positive, professional, and service-oriented team culture.
              - listitem [ref=f352e104]: Conduct regular team meetings, performance reviews, and training initiatives.
              - listitem [ref=f352e105]: Lead by example and maintain high standards of professionalism and integrity.
            - paragraph [ref=f352e106]:
              - strong [ref=f352e107]: Resident Relations
            - list [ref=f352e108]:
              - listitem [ref=f352e109]: Build strong relationships with residents and promote a positive community environment.
              - listitem [ref=f352e110]: Resolve resident concerns, complaints, and escalated issues professionally and promptly.
              - listitem [ref=f352e111]: Oversee renewals, resident retention initiatives, and resident communications.
              - listitem [ref=f352e112]: Ensure consistent and fair enforcement of community policies and procedures.
            - paragraph [ref=f352e113]:
              - strong [ref=f352e114]: Vendor & Risk Management
            - list [ref=f352e115]:
              - listitem [ref=f352e116]: Select, manage, and evaluate contractors and service providers.
              - listitem [ref=f352e117]: Negotiate vendor agreements and ensure quality work at competitive pricing.
              - listitem [ref=f352e118]: Monitor insurance, safety, emergency preparedness, and risk-management practices.
              - listitem [ref=f352e119]: Ensure all required inspections, licenses, certifications, and documentation are maintained.
            - paragraph [ref=f352e120]:
              - strong [ref=f352e121]: Qualifications
            - list [ref=f352e122]:
              - listitem [ref=f352e123]:
                - strong [ref=f352e124]: 5+ years of progressive multifamily property management experience
                - text: ", preferably managing a Class A/B community or similar asset."
              - listitem [ref=f352e125]: Proven experience managing property operations, budgets, financial reporting, leasing, and resident relations.
              - listitem [ref=f352e126]: Strong understanding of multifamily KPIs, including occupancy, retention, delinquency, NOI, rent growth, and expense management.
              - listitem [ref=f352e127]: Demonstrated ability to lead, coach, and develop onsite teams.
              - listitem [ref=f352e128]: Strong knowledge of Fair Housing regulations and applicable federal, state, and local requirements.
              - listitem [ref=f352e129]: Excellent written, verbal, organizational, and interpersonal skills.
              - listitem [ref=f352e130]: Strong problem-solving and decision-making abilities.
              - listitem [ref=f352e131]: Proficiency with property management and Microsoft Office software.
              - listitem [ref=f352e132]: Ability to manage multiple priorities in a fast-paced environment.
            - paragraph [ref=f352e133]:
              - strong [ref=f352e134]: Preferred Qualifications
            - list [ref=f352e135]:
              - listitem [ref=f352e136]: Bachelor’s degree in business, real estate, property management, or a related field.
              - listitem [ref=f352e137]: ARM, CAM, CPM, or other relevant professional designation.
              - listitem [ref=f352e138]: Experience with value-add, lease-up, renovation, or repositioning projects.
              - listitem [ref=f352e139]: Experience presenting financial and operational results to ownership or senior leadership.
            - paragraph [ref=f352e140]:
              - strong [ref=f352e141]: What Success Looks Like
            - paragraph [ref=f352e142]: "The successful Property Manager will be measured by their ability to:"
            - list [ref=f352e143]:
              - listitem [ref=f352e144]: Consistently achieve or exceed occupancy and revenue objectives.
              - listitem [ref=f352e145]: Improve NOI through disciplined revenue management and expense control.
              - listitem [ref=f352e146]: Maintain the property at a high operational and physical standard.
              - listitem [ref=f352e147]: Build and retain a strong, accountable onsite team.
              - listitem [ref=f352e148]: Deliver excellent resident satisfaction and retention.
              - listitem [ref=f352e149]: Maintain compliance and minimize operational and financial risk.
              - listitem [ref=f352e150]: Communicate effectively with ownership, residents, employees, and vendors.
            - paragraph [ref=f352e151]
            - paragraph [ref=f352e152]:
              - strong [ref=f352e153]: This is an opportunity for an experienced multifamily professional who takes ownership of results, leads with confidence, and understands that exceptional property performance starts with exceptional leadership.
            - paragraph [ref=f352e154]:
              - text: Learn more about Lee & Associates Houston
              - link "here" [ref=f352e155] [cursor=pointer]:
                - /url: https://www.lee-associates.com/houston
