      - heading "The Solomon R. Guggenheim Museum - Open Positions" [level=1] [ref=f1146e7]
    - generic [ref=f1146e8]:
      - paragraph [ref=f1146e9]: Welcome to the Solomon R. Guggenheim Museum employment opportunities page. We are proud of the significant history and remarkable achievements of our world-renowned, international institution, and offer a variety of interesting and rewarding work opportunities. These range from entry-level to advanced positions for professionals who have achieved distinction in their field, and include jobs that are full-time, part-time, and seasonal.
      - paragraph [ref=f1146e10]: Employment opportunities may be available in departments throughout the museum including Curatorial, Conservation, Exhibition Design, Development, Publishing and Digital Media, Media and Public Relations, Education, Visitor Experience, Security, Finance, Information Systems, and Human Resources.
      - paragraph [ref=f1146e11]: The Guggenheim Museum provides its staff with a generous benefits package, including medical, dental, and vision plans, life insurance, and short-term and long-term disability. The museum also offers paid vacation, personal days, sick leave, and holidays, as well as participation in a 403(b) Retirement Plan.
      - paragraph [ref=f1146e12]: We invite you to review our current full-time, part-time, and temporary/project-based openings.
