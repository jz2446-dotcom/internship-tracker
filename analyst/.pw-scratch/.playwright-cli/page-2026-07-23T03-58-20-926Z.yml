          - generic [ref=f2168e134]:
            - heading "THERE’S NO BETTER TIME TO JOIN LUMENT" [level=2] [ref=f2168e135]
            - paragraph [ref=f2168e136]: Lument is distinguished by its emphasis on relationships. This principle, which guides our interactions with clients and industry partners, also makes Lument a great place to work. We strive to create an environment where differences are celebrated, people are treated equitably, and everyone has the respect and support they need to perform at their best.
            - paragraph [ref=f2168e137]: At Lument, we are making our mark. Join Lument—and make yours!
          - generic [ref=f2168e139]:
            - generic [ref=f2168e140]:
              - heading "Benefits" [level=2] [ref=f2168e141]
              - paragraph [ref=f2168e142]: At Lument, we offer a robust array of employee benefits — including a variety of medical plans, company-paid parental leave, and 401(k) matching — to assist employees in balancing their professional and personal lives and plan for a fulfilling future. We are also committed to developing and training members of our team at every stage of their careers. Although our standards are high, we’ll help you reach them.
