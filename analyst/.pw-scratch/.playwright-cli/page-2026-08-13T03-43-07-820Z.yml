              - tabpanel "Branch & Contact Center" [ref=f121e158]:
                - heading "Branch & Contact Center" [level=3] [ref=f121e159]
                - paragraph [ref=f121e160]:
                  - strong [ref=f121e161]: Branch
                  - text: When you think of Visions, these member service employees probably come to mind. At
                  - link "more than 50 locations" [ref=f121e162] [cursor=pointer]:
                    - /url: https://www.visionsfcu.org/locations
                  - text: in New Jersey, New York, and Pennsylvania, our Branch teams are comprised of tellers, accounts specialists, loan officers, and managers. Together, they ensure quality, in-person service for our members – from cashing checks to applying for loans. They also process overnight transactions and act as a liaison for all members and support departments.
                - paragraph [ref=f121e163]:
                  - strong [ref=f121e164]: Contact Center
                  - text: Whether temporarily out of town, living across the globe, or just handling their personal banking at home – all Visions members deserve full, equitable access to our products and services. That’s where our Contact Center comes in! This department is our one-stop shop for over 90% of our products, services, and solutions. From offices in Endwell (NY), Reading (PA), and Saddle Brook (NJ), our Contact Center answers calls beyond Visions’ regular office hours, responds to Live Chat requests, and serves members in both English and Spanish across all 50 states and abroad.
                - paragraph [ref=f121e165]:
                  - link "View Current Openings" [ref=f121e166] [cursor=pointer]:
                    - /url: https://recruiting.ultipro.com/VIS1010VFCU/JobBoard/8aa6443c-bdeb-4ca6-a33d-6c538463a2c4/?q=&o=postedDateDesc&w=&wc=&we=&wpst=
          - region "Content" [ref=f121e167]:
            - article [ref=f121e168]:
              - generic [ref=f121e172]:
                - heading "Employee Benefits" [level=2] [ref=f121e173]
                - generic [ref=f121e174]:
                  - paragraph [ref=f121e175]: In exchange for your time and talents, we offer generous benefits. After all, you make us awesome, so we take care of you with things like…
                  - list [ref=f121e176]:
                    - listitem [ref=f121e177]: Pension Plan, 401k Plan, and 401k matching contributions
                    - listitem [ref=f121e178]: Excellent health benefits
                    - listitem [ref=f121e179]: Flexible Paid Time Off (PTO), Volunteer Time Off (VTO), and Wellness Time Off (WTO)
                    - listitem [ref=f121e180]: More than ten paid holidays per year
                    - listitem [ref=f121e181]: Tuition reimbursement
                    - listitem [ref=f121e182]: Student loan repayment
                    - listitem [ref=f121e183]: Employee recognition program
                    - listitem [ref=f121e184]: Educational incentives
                    - listitem [ref=f121e185]:
                      - text: Wellness program
                      - emphasis [ref=f121e186]:
                        - strong [ref=f121e187]: ...and more!
                  - paragraph [ref=f121e188]:
                    - text: Take a look at our complete list of
                    - link "benefits" [ref=f121e189] [cursor=pointer]:
                      - /url: https://www.visionsfcu.org/benefits
                    - text: .
                - link "View Current Openings" [ref=f121e191] [cursor=pointer]:
                  - /url: https://recruiting.ultipro.com/VIS1010VFCU/JobBoard/8aa6443c-bdeb-4ca6-a33d-6c538463a2c4/?q=&o=postedDateDesc&w=&wc=&we=&wpst=
          - generic [ref=f121e193]:
            - heading "Our Inclusive Workplace" [level=2] [ref=f121e194]
            - generic [ref=f121e195]:
              - paragraph [ref=f121e196]: Working for Visions means more than just having a good job. It’s a workplace where you can share great experiences both with members and co-workers – individuals with a range of backgrounds, including neurodivergence, veteran service members, BIPOC, and LGBTQIA+ – all while making a positive impact in your community!
              - paragraph [ref=f121e197]: Want proof? Hear from our CEO and some of our employees.
              - paragraph [ref=f121e198]:
                - link "Learn more about us" [ref=f121e199] [cursor=pointer]:
                  - /url: https://www.visionsfcu.org/aboutus
                - text: and discover how we
                - emphasis [ref=f121e200]:
                  - strong [ref=f121e201]: Make Visions Matter
                - text: and live out our Corporate Values of Service, Integrity, Community, and Trust.
            - heading "Our President and CEO Talks Company Culture" [level=3] [ref=f121e202]
            - article [ref=f121e204]:
              - iframe [ref=f121e206]:
                
            - generic [ref=f121e207]:
              - paragraph [ref=f121e208]: When President/CEO Tyrone Muse decided to join the Visions family, the company culture was a huge part of his decision. It should be a part of your decision, too. Here Ty gives the rundown of what it means to thrive at Visions.
              - paragraph [ref=f121e209]
          - region "Content" [ref=f121e210]:
            - article [ref=f121e211]:
              - generic [ref=f121e215]:
                - heading "Why Choose Visions?" [level=2] [ref=f121e216]
                - article [ref=f121e218]:
                  - iframe [ref=f121e220]:
                    
                - generic [ref=f121e221]:
                  - paragraph [ref=f121e222]:
                    - text: People join our Visions team for many reasons, and they stick around because of our culture and impactful values. Don't believe us? Listen for yourself! Or, learn more about
                    - link "our culture" [ref=f121e223] [cursor=pointer]:
                      - /url: /culture
                    - text: .
                  - paragraph [ref=f121e224]: We’re really proud of what we do every day to serve our communities. Imagine having a job where you can share that pride.
