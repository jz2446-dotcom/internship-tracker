                - paragraph [ref=f121e414]:
                  - emphasis [ref=f121e415]:
                    - strong [ref=f121e417]: We are committed to supporting and lifting up our communities. Now, more than ever, we need to come together with a cooperative spirit to support our friends and neighbors.
