              - generic [ref=f121e405]:
                - paragraph [ref=f121e406]:
                  - emphasis [ref=f121e407]:
                    - strong [ref=f121e409]: At Visions, we condemn racism, violence, discrimination, and hatred toward any person or persons. It is in our foundation as a credit union to accept and serve all members equitably, regardless of their race, social status, or financial position.
                - paragraph [ref=f121e410]:
                  - emphasis [ref=f121e411]:
