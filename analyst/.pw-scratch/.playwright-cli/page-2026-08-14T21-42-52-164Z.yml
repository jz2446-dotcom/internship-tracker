            - paragraph: The latest BMW 2.0 litre engine provides ample power for a car weighing just over 1,000kg. This engine is coupled to either a six-speed manual or eight-speed automatic transmission.
      - group:
        - generic:
          - generic:
            - heading [level=4]: SENNHEISER AUDIO
            - paragraph: Sennheiser’s revolutionary sound system utilises advanced software and invisible speakers to offer an unprecedented audio experience, creating the illusion of a sound stage in front of occupants.
      - group:
        - generic:
          - generic:
            - heading [level=4]: NATURAL MATERIALS
            - paragraph: Natural materials are celebrated throughout the cockpit of Plus Four. From ash wood in a range of different finishes, exquisite marquetry veneers, the finest leather and sustainable fabrics.
      - group:
        - generic:
          - generic:
            - heading [level=4]: mirrors
            - paragraph: New interior rear-view mirror and wing mirrors are machined from aluminium, beautifully finished and robust in their construction. Designed by Morgan and exclusively manufactured for Plus Four.
      - group:
        - generic:
          - generic:
            - heading [level=4]: DYNAMIC HANDLING PACK
            - paragraph: In addition to the AP Racing braking system, electronic stability control and double wishbone suspension, a new Dynamic Handling Pack is also available on Plus Four. This options features adjustable suspension and a rear anti-roll bar.
      - group:
        - generic:
          - generic:
            - heading [level=4]: ADAPTIVE SPORTS EXHAUST
            - paragraph: A soundtrack to more spirited driving. The adaptive sports exhaust system is linked to driving mode and provides a greater level of audible experience.
