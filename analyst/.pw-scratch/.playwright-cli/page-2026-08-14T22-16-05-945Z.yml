                  - generic [ref=f1364e525]: The Assistant Conservator plays an important role in the preservation, research, and stewardship of works of art on paper and other paper-based collections. Working collaboratively with conservators, scientists, curators, registrars, and collections staff, this position conducts examinations, research, and conservation treatments and supports long-term care of the museum's permanent collection, exhibitions, acquisitions, and loans. The Assistant Conservator contributes to innovative conservation practices through technical study, scholarly research, and professional engagement. This role also supports the museum's commitment to fostering a diverse, inclusive, and equitable workplace where varied perspectives and experiences strengthen our work and mission.
