    - generic [ref=f26e4]:
      - generic [ref=f26e6]:
        - generic [ref=f26e7]: Outdoor Watering Restrictions In Place
        - paragraph [ref=f26e9]:
          - text: The Evans City Council declared by unanimous vote on April 21 a drought emergency in the City of Evans. In order to make the best, most efficient use of precious water resources, outdoor watering restrictions are in place and will be enforced in accordance with the Evans Municipal Code. Details about what restrictions are in place can be found
          - link "here" [ref=f26e10] [cursor=pointer]:
            - /url: /living-here/water-and-utilities/water-conservation/watering-restrictions-and-seasonal-recommendations/
          - text: . Please call Evans Customer Service at (970) 475-1170 or email
          - link "info@evanscolorado.gov" [ref=f26e11] [cursor=pointer]:
            - /url: mailto:info@evanscolorado.gov
          - text: with any questions.
      - button "Close alert" [ref=f26e12] [cursor=pointer]:
