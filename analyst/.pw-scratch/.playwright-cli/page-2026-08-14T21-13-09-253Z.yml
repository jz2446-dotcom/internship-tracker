        - heading "City Council" [level=1] [ref=f26e36]
        - generic [ref=f26e37]:
          - generic [ref=f26e38]:
            - generic [ref=f26e43]:
              - paragraph [ref=f26e44]:
                - text: The Evans City Council is made up of seven members, with a Mayor elected at large and two council members representing each of three wards. Council elections are held in November of every even-numbered year. Evans operates under the Council-Manager form of government and follows a
                - link "Home Rule Charter" [ref=f26e45] [cursor=pointer]:
                  - /url: https://library.municode.com/co/evans/codes/municipal_code?nodeId=HORUCH
                - text: which was first adopted in 1973. Under the Charter, the City Council appoints a City Manager, City Attorney, and Municipal Judge as well as members of all advisory boards and commissions. The City’s mission is to deliver sustainable, citizen-driven services for the health, safety, and welfare of the community.
              - paragraph [ref=f26e46]: The Evans City Council meets on the first and third Tuesdays of each month at 7:00 p.m. Work sessions often precede council meetings and begin between 5:00 p.m. and 6:30 p.m. depending upon council business. The meeting schedule for the current calendar year is listed below.
              - paragraph [ref=f26e47]:
                - strong [ref=f26e48]: June 3, 2026
                - text: ": At the regular meeting on June 2, 2026, the Evans City Council declared a vacancy in Ward One following the resignation of former Councilman Kyle Fehr. The City Council is currently accepting applications to fill this term through the election in November, 2026."
              - paragraph [ref=f26e49]: "To be eligible to apply to fill this vacancy, interested parties must:"
              - list [ref=f26e50]:
                - listitem [ref=f26e51]: Be a citizen of the United States
                - listitem [ref=f26e52]: At least 18 years of age
                - listitem [ref=f26e53]: A qualified elector (registered voter) in the City of Evans
                - listitem [ref=f26e54]:
                  - text: Must have resided for at least 30 days in Ward 1 (if you are unsure of in which ward you reside, go
                  - link "here." [ref=f26e55] [cursor=pointer]:
                    - /url: https://experience.arcgis.com/experience/2eb33fa12d4a482bac6d5187a146121b
              - paragraph [ref=f26e56]:
                - text: To apply to fill this vacancy, please complete the
                - link "the Ward 1 Application form" [ref=f26e57] [cursor=pointer]:
                  - /url: /media/0qnhtjwi/ward-1-application.pdf
              - paragraph [ref=f26e58]:
                - text: If you have questions, please contact the City Clerk's office at (970) 475-1104 or email
                - link "cityclerk@evanscolorado.gov" [ref=f26e59] [cursor=pointer]:
                  - /url: mailto:cityclerk@evanscolorado.gov
