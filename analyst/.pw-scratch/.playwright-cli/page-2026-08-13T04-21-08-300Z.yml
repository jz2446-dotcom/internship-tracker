            - generic [ref=f412e236]:
              - paragraph [ref=f412e237]: Crédit Agricole CIB is the corporate and investment banking arm of the Credit Agricole Group, the 9th largest banking group worldwide in terms of balance sheet size in 2023 (The Banker, July 2024). Our 9,587 employees in Europe, the Americas, Asia-Pacific and the Middle East support our large corporate and institutional clients by meeting their financial needs throughout the world.
              - paragraph [ref=f412e238]: Crédit Agricole CIB provides a broad range of products and services in the businesses of capital markets, investment banking, structured financing, commercial banking and international trade.
              - paragraph [ref=f412e239]: Crédit Agricole CIB today is a world leader on the green bond and sustainability-linked loan markets. Our mission is to support our clients in their energy transition by offering financial solutions that fight against climate change.
          - article [ref=f412e242]:
            - heading "Good to know" [level=2] [ref=f412e244]
            - paragraph [ref=f412e246]: Nous sommes implantés dans plus de 30 pays à travers le monde et rassemblons plus de 100 nationalités. La dimension internationale de nos activités et la diversité des profils de nos collaborateurs font notre richesse.
          - article [ref=f412e249]:
