            - heading "Research internship" [level=3] [ref=f10e167]
            - paragraph [ref=f10e168]
            - paragraph [ref=f10e169]: Interested in an internship as a research intern? During this four to six month internship, we offer an opportunity to gain substantial experience within our Amsterdam office. As a research intern, you will support multiple project teams at the same time through providing research to help them assess clients question thoroughly. You have full responsibility over the research activities within our office and you will be instructed on analytical and communicative skills. This internship offers an opportunity to get to know the office’s culture, people, and project portfolio better.
