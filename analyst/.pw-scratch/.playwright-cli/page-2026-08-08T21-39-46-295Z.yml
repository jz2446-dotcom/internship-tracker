      - generic [ref=f10e222]:
        - heading "Everything you need to know about the application process" [level=3] [ref=f10e227]
        - list [ref=f10e233]:
          - listitem [ref=f10e234]:
            - heading [level=2] [ref=f10e235]:
              - button "What educational background is EY-Parthenon Netherlands looking for? " [ref=f10e236] [cursor=pointer]:
                - generic [ref=f10e237]: What educational background is EY-Parthenon Netherlands looking for?
                - generic [ref=f10e238]: 
            - paragraph [ref=f10e245]:
              - generic [ref=f10e246]: We do not recruit from specific universities and/or educational programs. What we are looking for are motivated, enthusiastic and talented people who combine excellent analytical skills with the ability to communicate clearly and succinctly, and a strong personality, capable of original and creative thinking and problem-solving.
          - listitem [ref=f10e247]:
            - heading [level=2] [ref=f10e248]:
              - button "Are grammar school (VWO) grades a critical selection criterion? " [ref=f10e249] [cursor=pointer]:
                - generic [ref=f10e250]: Are grammar school (VWO) grades a critical selection criterion?
                - generic [ref=f10e251]: 
            - paragraph [ref=f10e258]:
              - generic [ref=f10e259]: School grades are one of the things we look at. Equally important are university grades, work experience (if any, both domestically and internationally as the case may be), extra-curricular activities and your motivation. The combination of these factors determines whether we will invite you for the first interview round.
          - listitem [ref=f10e260]:
            - heading [level=2] [ref=f10e261]:
              - button "How should I apply? " [ref=f10e262] [cursor=pointer]:
                - generic [ref=f10e263]: How should I apply?
                - generic [ref=f10e264]: 
            - paragraph [ref=f10e271]:
              - generic [ref=f10e272]: To apply, you need to submit your resume, copies of your secondary school graduation and university scores (Bachelor and Master) and a motivation letter via the 'Apply Now' button at the bottom of the page. In your resume, make sure to include any extra-curricular activities which have helped you develop teamwork skills, decisiveness, communication skills and your personality. Your motivation letter should provide insight into your values and drive. The copies of your secondary school and university scores provide us with an indication of your (numerical) analytical skills.
          - listitem [ref=f10e273]:
            - heading [level=2] [ref=f10e274]:
              - button "What does the process look like? " [ref=f10e275] [cursor=pointer]:
                - generic [ref=f10e276]: What does the process look like?
                - generic [ref=f10e277]: 
            - generic [ref=f10e283]:
              - paragraph [ref=f10e284]:
                - generic [ref=f10e285]: When we select you for the application process we will invite you to our office for a first selection round which consists of a numerical test, an interview with a member of our recruitment staff and two case interviews. In these case interviews, you are tested on your problem-solving, structuring, quantitative skills and your conceptual thinking. You will have plenty of opportunity to ask questions and get to know us better in this first round as well. The second and final round consists of three interviews, each with an Associate Partner or Partner.
              - paragraph [ref=f10e286]:
                - generic [ref=f10e287]:
                  - text: If you have any questions or if you would like to discuss the application process, please contact our recruiter
                  - link [ref=f10e288] [cursor=pointer]:
                    - /url: /en_nl/functional/forms/form-snippets/contact/marketo-contact-us-form-no-request-type
                    - text: Tess Wielaard.
          - listitem [ref=f10e289]:
            - heading [level=2] [ref=f10e290]:
              - button "When should I submit my application? " [ref=f10e291] [cursor=pointer]:
                - generic [ref=f10e292]: When should I submit my application?
                - generic [ref=f10e293]: 
            - paragraph [ref=f10e300]:
              - generic [ref=f10e301]: "We accept applications all year round. Although we encourage talented individuals to apply as soon as possible, we can imagine that you would like to know more beforehand. An informal chat over coffee with one of our consultants is a great way to learn more about us. This way you are fully informed when starting the application process. Contact us for any questions or queries: we're just a phone call away!"
          - listitem [ref=f10e302]:
            - heading [level=2] [ref=f10e303]:
              - button "What can I expect when I start working at EY-Parthenon? " [ref=f10e304] [cursor=pointer]:
                - generic [ref=f10e305]: What can I expect when I start working at EY-Parthenon?
                - generic [ref=f10e306]: 
            - paragraph [ref=f10e313]:
              - generic [ref=f10e314]: From your first day at EY-Parthenon, we will staff you directly on projects, where you'll be making a significant contribution straightaway. There will be ample opportunity for on the job learning. In addition, you will regularly receive formal training.
          - listitem [ref=f10e315]:
            - heading [level=2] [ref=f10e316]:
              - button "Will I be expected to specialize in a specific sector? " [ref=f10e317] [cursor=pointer]:
                - generic [ref=f10e318]: Will I be expected to specialize in a specific sector?
                - generic [ref=f10e319]: 
            - paragraph [ref=f10e326]:
              - generic [ref=f10e327]: No. We aim to staff our consultants on as wide a variety of projects where possible, to maximize the learning opportunity for you. In later stages of your career at EY-Parthenon, you are expected to start specializing in specific sectors and/or project types.
          - listitem [ref=f10e328]:
            - heading [level=2] [ref=f10e329]:
              - button "Other than work, what activities do you organize at your office? " [ref=f10e330] [cursor=pointer]:
                - generic [ref=f10e331]: Other than work, what activities do you organize at your office?
                - generic [ref=f10e332]: 
            - paragraph [ref=f10e339]: We like to spend time with our colleagues outside working hours as well. Apart from Friday afternoon drinks, we participate in various sports events, such as the EY-Parthenon Ringvaart Regatta (rowing) and the Rotterdam Marathon. Most of these events are initiated by individuals. We applaud personal initiative! Also, we take time out several times a year to get to know each other more informally during events like our Summer Retreat and International Training Events, where colleagues from international offices meet.
          - listitem [ref=f10e340]:
            - heading [level=2] [ref=f10e341]:
              - button "What is the work-life balance like? " [ref=f10e342] [cursor=pointer]:
                - generic [ref=f10e343]: What is the work-life balance like?
                - generic [ref=f10e344]: 
            - paragraph [ref=f10e351]:
              - generic [ref=f10e352]: Consulting is not a 9 to 5 occupation. The pace of our projects is driven by our clients' needs and our motivation to deliver outstanding results. Therefore, the workload can be hefty at times. More importantly, it is hard to sketch a typical working week or even put a number of hours on it. It just varies. That being said, we believe that a healthy balance between professional and personal time boosts our performance and joy in life. We don't believe in ‘face time', so if you finish early or happen not to be staffed, there is no one holding you at the office. We believe in watching out for one another, but also in individual responsibility and dialogue in managing the balance.
          - listitem [ref=f10e353]:
            - heading [level=2] [ref=f10e354]:
              - button "What are my career opportunities after EY-Parthenon? " [ref=f10e355] [cursor=pointer]:
                - generic [ref=f10e356]: What are my career opportunities after EY-Parthenon?
                - generic [ref=f10e357]: 
            - paragraph [ref=f10e364]:
              - generic [ref=f10e365]: "EY-Parthenon alumni have moved on to make their careers in many different professional and business contexts. Some take on management positions with companies and organizations in a wide variety of industries or not-for-profit sectors. These companies can be (former) clients e.g. in retail, FMCG or transportation, but also other leading enterprises in their respective fields. Others take our entrepreneurial spirit to the next level and start their own businesses: we've had our share of internet / new media managers, business-to-business and services initiatives, but for instance also an impresario and several high tech and ICT entrepreneurs. Given our leading M&A and private equity practice, it won't come as a surprise that quite a few of us eventually move into investment banking or join private equity firms. Others opt for academic careers, upping the ante on our intellectual prowess. Perhaps the better question therefore would be: what can't I do after EY-Parthenon?"
          - listitem [ref=f10e366]:
            - heading [level=2] [ref=f10e367]:
              - button "How can I find out more about EY-Parthenon? " [ref=f10e368] [cursor=pointer]:
                - generic [ref=f10e369]: How can I find out more about EY-Parthenon?
                - generic [ref=f10e370]: 
            - paragraph [ref=f10e377]:
              - generic [ref=f10e378]:
                - text: We organize and take part in a range of events where you can meet our consultants face to face, and discover what EY-Parthenon stands for. Please review our Important Dates section for details about dates and venues. Please contact
                - link [ref=f10e379] [cursor=pointer]:
                  - /url: /en_nl/functional/forms/form-snippets/contact/marketo-contact-us-form-no-request-type
                  - text: Tess Wielaard
                - text: from our recruitment team by e-mail with any questions. We're eager to meet talent any day of the week!
