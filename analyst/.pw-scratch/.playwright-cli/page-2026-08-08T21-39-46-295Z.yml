            - paragraph [ref=f10e147]
            - paragraph [ref=f10e148]: Are you one of the best in your year? Do you want to transform your excellent academic performance, business sense and curiosity into added value for clients? If so, immerse yourself in the world of EY-Parthenon for eight to 12 weeks. As an associate intern, you will be a full-fledged member of one of our project teams. Just like other team members, you will assume responsibility for your duties and you will have the opportunity to get to know the team, and the team will get to know you. Based on your performance, you may be offered a full-time position.
          - link "Apply now" [ref=f10e152] [cursor=pointer]:
