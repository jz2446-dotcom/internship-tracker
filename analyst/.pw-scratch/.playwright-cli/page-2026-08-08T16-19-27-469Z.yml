      - paragraph [ref=f118e205]: Current City leaders who started as interns
      - generic [ref=f118e206]:
        - generic [ref=f118e207]:
          - heading "Rolando Charvel | Chief Financial Officer" [level=2] [ref=f118e212]
          - paragraph [ref=f118e214]: I initially started working for the City as an intern in 1999. My goal was to obtain work experience as a soon-to-be graduate and then jump over to the private sector. I thought government work would be boring and bureaucratic. That couldn’t have been further from the truth. It turned out to be a very exciting place to work, where things move quickly and there are so many complexities due to the variety of services the City provides. While there is always a focus of operating a large organization effectively, everything happens within a political and public arena, adding more dynamism to the experience of working in the City. With over 12,000 employees, there is always opportunity for growth and personal development while at the same time serving the community. Plus, the organization offers employee benefits that are hard to find anywhere else. Now, as the Director of Finance, I am able to influence the direction of City, trying to make the best decisions for the benefit of the organization while safeguarding taxpayer dollars.
        - generic [ref=f118e215]:
          - heading "Krista Davidson | Debt Coordinator" [level=2] [ref=f118e220]
          - paragraph [ref=f118e222]: I began working with the City of San Diego in 2015 as a Communications Intern for then Council President Sherri Lightner. This internship gave me first-hand experience with working with the community and gave me the opportunity to see how policy and politics interact to solve problems for my community. While I found the political aspect of City Hall fascinating, I found myself drawn to public administration, which works towards executing policies and services the elected officials put in place. I used the knowledge I gained from my internship to land a job with the City’s Debt Management Department as a Management Trainee, helping to finance large-scale City projects. I am now a Debt Coordinator where I coordinate those financings. I work with a great team of people, and I love going to work every day, knowing that my work is making my community a better place.
        - generic [ref=f118e223]:
          - heading "Maureen Jugar | Deputy Director" [level=2] [ref=f118e228]
          - generic [ref=f118e229]:
            - paragraph [ref=f118e230]: "Little did I know the road less traveled, to public service, was for me. Here I am today, 22 years in and thriving! I started my journey as a Management Intern with the Water Department (now PUD) and discovered I was able to do all the things I loved: helping people, crunching numbers and working with the public. The geek in me knew the possibilities were endless. Within months into my internship my passion grew, and I became energized by the City’s diverse organization, the wealth of job opportunities and the common goal for greater good. I remember telling my mom, “while I’m an intern today, I can also be a Librarian tomorrow!” Since, I’ve had the privilege of working with DoF (where the best bean counters live), PandA (where datasets were born) and ESD (where I really learned what operations was all about)."
            - paragraph [ref=f118e231]: Now, I am a Deputy Director in the Communications Department, where I work with the most thoughtful people and lead with integrity and compassion, AND I still get to crunch numbers. I’m honored to be a public servant, truly a noble vocation!
