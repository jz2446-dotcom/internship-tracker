  - generic [ref=f54e23]:
    - heading "Can a $100 Billion Company be Considered an Outsider? We Think So." [level=1] [ref=f54e26]
    - generic [ref=f54e27]:
      - generic [ref=f54e28]:
        - generic [ref=f54e30]:
          - heading "Owners Wanted" [level=2] [ref=f54e31]
          - paragraph [ref=f54e32]: At Welltower, the only easy day was yesterday. Everyone is empowered to think and behave like owners. Creative thinking, collaboration and a deep sense of purpose are core to who we are. We are obsessive about impacting outcomes and driven to deliver operational excellence in everything we do.
          - paragraph [ref=f54e33]: When seeking individuals for key roles, we are looking for those who grasp the long-term benefits of patience and strategic decision-making, valuing sustained growth over immediate gains. Candidates with a strong sense of stewardship, or a “fiduciary gene” – guided by an innate responsibility to act in the best interest of others – demonstrate the qualities of trust, accountability, and ethical decision-making that define true custodians of leadership.
          - paragraph [ref=f54e34]: We work shoulder to shoulder to invest for the long-term with an unwavering belief that compounding cash flow is the surest path to delivering per share value for our existing investors.
          - paragraph [ref=f54e35]: We believe these guiding principles set us apart.
          - link "Learn more about our culture" [ref=f54e36] [cursor=pointer]:
            - /url: /culture/
        - generic [ref=f54e39]:
          - heading "Careers" [level=2] [ref=f54e40]
          - paragraph [ref=f54e41]: Independent thinking is essential to collective success. We want people who bring a vast wealth of individual talents and life experiences to share their unique perspectives. There is no one profile that can be a surefire success. It is the effort of a dynamic whole who sits shoulder to shoulder, impassioned by our mission and with a mindset of showing up every day to win, that will drive our success. You will not be expected to fit into any pre-conceived mold but you will be encouraged to be limited only by the constraints of your own drive and creativity.
          - paragraph [ref=f54e42]: We think deeply about our culture, believing it is made richer by a broad swath of personality types… extroverts to introverts and everything in between, backgrounds… educational and personal journeys outside the classroom and worldviews accumulated over your lives and that you bring through our front door. Help us think outside the box and to approach problem solving from the perspective of an outsider.
          - paragraph [ref=f54e43]: We are proud of our best-in-class team and are committed to ensuring that all individuals have equal opportunities to learn, contribute, and strive for success. Our employees bring a unique combination of skills and experiences to our work and are deeply committed to achieving Welltower’s mission and driving shareholder value. Our culture is fast paced and endlessly ambitious – we want individuals who share our passion, our work ethic, and our devotion to driving the transformation of healthcare infrastructure.
          - paragraph [ref=f54e44]: Are you interested in working for Welltower?
          - link "View job opportunities" [ref=f54e45] [cursor=pointer]:
            - /url: https://recruiting.ultipro.com/WEL1008WLLT/JobBoard/30969ce4-3b7e-40a6-b86c-34d3616fe0ed/?q=&o=postedDateDesc&w=&wc=&we=&wpst=
        - generic [ref=f54e48]:
          - heading "Internship Program" [level=2] [ref=f54e49]
          - heading "Meaningful Work Alongside Meaningful Relationships." [level=3] [ref=f54e50]
          - paragraph [ref=f54e51]: Our interns don’t get tasked with “projects”; they’re thrown into the deep end on day one, working side-by-side with our team, evaluating opportunities to create value through capital allocation, forming innovative structures to mitigate risk, and collaborating on the same solutions to extend duration. Our interns are directly immersed in high-priority assignments and provided with the mentorship and support required to build extraordinary skill sets. The success of this approach is demonstrated by the 90% acceptance rate when full-time offers are extended. If you are interested in disrupting an industry through creative solutions and a belief in the power of astute capital allocation and compounding growth, contact us to learn more about our internship program.
      - generic [ref=f54e53]:
