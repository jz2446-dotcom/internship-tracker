                - strong [ref=f393e51]: Build your career. Build your community.
              - paragraph [ref=f393e52]
              - paragraph [ref=f393e53]: Welcome to the Metropolitan Nashville and Davidson County career page, where employees make the difference in the lives of our city’s 694,000 residents and the millions who visit here. Visits to our city, known for its music, hot chicken and diversity, topped 16 million in 2019. As a progressive city, we are proud to be the nation’s first true city-county consolidated government. As an employer we take pride in our competitive salary offerings and generous benefit package. We invite you to review this page, get a feel for what we do and how we do it. We look forward to the opportunity to include you as a part of our dynamic team!
              - paragraph [ref=f393e54]
              - paragraph [ref=f393e55]: Metropolitan Nashville Davidson County only accepts online applications. The application process is made easy by clicking on the job title you are interested in and clicking on the "Apply" link! First time applying using our online job application - use a valid email address and unique password. Password requirement- Upper case, lower case, number, and special character. (@?!$)
              - paragraph [ref=f393e56]
              - paragraph [ref=f393e57]:
                - strong [ref=f393e58]: Or Sign in with Google account
              - paragraph [ref=f393e59]
              - paragraph [ref=f393e60]: "Online applications should include the following information: Work Experience- dates and hours worked per week. List each position with the same company as a separate job. Education-Name of School and location,credit hours earned, dates attended and major and degree."
              - paragraph [ref=f393e61]
              - paragraph [ref=f393e62]:
                - strong [ref=f393e63]: For Governmentjobs.com applicant technical support including password help, please contact NEOGOV/Governmentjobs.com toll free at 855-524-5627 or email support@governmentjobs.com.
                - text: Please contact Talent Acquisition Team for assistance in your job search Monday - Friday 8:00 a.m. to 4:30 p.m. (615) 862-6640
              - paragraph [ref=f393e64]: Online applications are stored on a secure site. Only authorized Human Resource employees and hiring authorities have access to the information submitted.
              - paragraph [ref=f393e65]:
                - strong [ref=f393e66]: We are an equal opportunity employer that values diversity at all levels. All individuals, regardless of personal characteristics, are encouraged to apply. MetroNashville is committed to selecting the most qualified candidate for each of our roles.
              - paragraph [ref=f393e67]
              - paragraph [ref=f393e68]:
                - strong [ref=f393e69]: Metro Nashville Government respects the religious beliefs and practices of all employees and will make, on request, an accommodation for such observances when a reasonable accommodation is available that does not create an undue hardship of business operations.
              - paragraph [ref=f393e70]
              - paragraph [ref=f393e71]:
