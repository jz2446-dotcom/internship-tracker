            - emphasis [ref=f14e79]: Qualifications
            - list [ref=f14e80]:
              - listitem [ref=f14e81]:
                - emphasis [ref=f14e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f14e83]:
                - emphasis [ref=f14e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f14e85]:
                - emphasis [ref=f14e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f14e87]:
                - emphasis [ref=f14e88]: Must be a team player with a “no job is too big or too small attitude”
              - listitem [ref=f14e89]:
