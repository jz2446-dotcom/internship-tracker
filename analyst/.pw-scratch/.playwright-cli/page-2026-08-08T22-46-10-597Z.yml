              - term [ref=f583e129]:
                - heading "General Position Summary" [level=2] [ref=f583e130]
              - definition [ref=f583e131]:
                - paragraph
                - paragraph [ref=f583e132]:
                  - strong [ref=f583e133]:
                    - generic [ref=f583e134]: "Job Number: 2026-00033R"
                - paragraph [ref=f583e135]:
                  - generic [ref=f583e136]:
                    - text: King County Library System (KCLS) is looking for an
                    - strong [ref=f583e137]: Adult Services Coordinator
                    - text: "(classification: Public Services Coordinator) who will further KCLS strategic goals by developing and coordinating programs for patrons in the adult’s specialty area. The position emphasizes services that respond to their educational, recreational, cultural and social needs and interests and oversees the work of assigned staff while also participating in the selection, hiring, and training of librarians."
                - paragraph [ref=f583e138]:
                  - generic [ref=f583e139]:
                    - strong [ref=f583e140]: "About the Opportunity:"
                    - text: The Adult Services Coordinator will work on developing and implementing structure of Librarian service to our King County Adult Patrons. Our ideal candidate is someone willing to change and adapt to an ever- growing diverse community and who understands how to incorporate a service leadership model, strategically coach, and how to guide our librarians. This person would need experience with managing grants, budgets, and developing relationships with outside stakeholders. The role will need a strong understanding of the role librarians play in supporting adults in KCLS Service Directions. (Life Long Learning, Engaging with Books & Reading, Obtaining Trustworthy Information, and Making Meaningful Connections)
                - strong [ref=f583e142]: This job posting is open continuously until the position is filled. Submitted applications will be reviewed weekly beginning on June 25, 2026.
                - strong [ref=f583e144]:
                  - strong [ref=f583e145]: "Required: Applicants must attach a current resume and cover letter that addresses relevant work experience, education, and training as it relates to this position."
                - generic [ref=f583e146]:
                  - strong [ref=f583e147]:
                    - strong [ref=f583e148]: About King County Library System (KCLS)
                  - strong [ref=f583e149]: ":"
                  - text: KCLS has a vision of a world where knowledge allows diverse communities to prosper and grow. In order to support this vision, we create opportunities through meaningful connections by acting as the knowledge sharing center for over 1.5 million diverse patrons, providing an unparalleled collection of library materials, resources, technology, services, and programs. Approximately 1,000 engaged and passionate staff provide service in 50 community library locations and patron engagement using direct outreach, programs, and virtual assistance. Our service area includes cities, towns, tribal lands, and unincorporated districts of King County, with the exception of the city of Seattle. From a 2021-2022 comprehensive Diversity, Equity, and Inclusion (DEI) Assessment Demographics and Language Report, of the more than 1.5 million residents who live within the KCLS service area, almost half identify as Black, Indigenous, or People of Color (BIPOC). Moreover, roughly one-third of the KCLS community speaks a language other than English as their first language. The King County Library System values the diverse perspectives, lived experiences, and cultures of all qualified individuals. We seek applicants that reflect the diversity of the communities we serve and encourage individuals of all backgrounds to apply, including BIPOC (Black, Indigenous, and other people of color), immigrants, refugees, women, LGBTQIA+, individuals with disabilities, veterans, etc. KCLS welcomes reasonable accommodations for persons with disabilities as an opportunity to assist qualified individuals to participate in the job application or interview process and/or perform the essential functions of the position upon hire.
                  - emphasis [ref=f583e150]
                  - text: Need an accommodation to apply or interview? Call (425) 369-3224 or email
                  - link "employment@kcls.org" [ref=f583e151] [cursor=pointer]:
                    - /url: mailto:employment@kcls.org
                  - text: .
                  - emphasis [ref=f583e152]
                  - text: KCLS ensures equal opportunities and consideration for all job applicants, without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state, or local laws. KCLS does not tolerate discrimination or harassment during any stage of employment, including in recruiting, hiring, promotion, termination, leave of absence, compensation, or training.
                - paragraph
              - term [ref=f583e153]:
                - heading "Examples of Duties" [level=2] [ref=f583e154]
              - definition [ref=f583e155]:
                - paragraph [ref=f583e156]:
                  - strong [ref=f583e157]: Essential Duties
                  - emphasis [ref=f583e159]: The items listed in this section are the key duties and responsibilities for this job and do not represent an exhaustive list. Our organization is dynamic and therefore duties may change based on business necessity; however, any new duties will remain within the scope of the job.
                - list [ref=f583e160]:
                  - listitem [ref=f583e161]: Develops and facilitates system-wide specialty programs, services, and promotions for adults, teens, or children.
                  - listitem [ref=f583e162]: Plans and leads librarian specialty meetings for associated programs.
                  - listitem [ref=f583e163]: Works with community librarians to advise and develop effective, equitable and community-centered local services that support patrons in area of focus.
                  - listitem [ref=f583e164]: Responsible for initiation and coordination of information services that address system-wide goals such as community outreach and collaboration, digital literacy, and school coordination.
                  - listitem [ref=f583e165]: Serves as a programming and community engagement resource partner and subject matter expert for librarians and other public services staff.
                  - listitem [ref=f583e166]: Assists in the selection and development of new librarians.
                  - listitem [ref=f583e167]: Participates in the development and facilitation of relevant training for library staff that addresses the learning and development needs of librarians.
                  - listitem [ref=f583e168]: Partners with staff that maintain current and relevant online content, identifying community needs and participating in long-range planning.
                  - listitem [ref=f583e169]: Represents KCLS in developing community partnerships and coordinated engagement of library staff in alignment with the services strategy and values of diversity, equity, and inclusion and intellectual freedom.
                  - listitem [ref=f583e170]: Recommends and reviews system-wide policies, procedures, and guidelines related to public service provision, programming, and specialty area of focus.
                  - listitem [ref=f583e171]: Supervises assigned staff including selection and hiring, training and development, performance evaluation, discipline, and scheduling.
                - strong [ref=f583e173]: Secondary Duties
                - list [ref=f583e174]:
                  - listitem [ref=f583e175]: Participates in the planning and distribution of promotional materials for programs in specialty areas.
                  - listitem [ref=f583e176]: Makes presentations on KCLS programs and services.
                  - listitem [ref=f583e177]: Maintains professional expertise to provide relevant subject matter expertise.
                  - listitem [ref=f583e178]: Leads, coordinates, and actively participates on internal and external committees.
                  - listitem [ref=f583e179]: Performs other related duties as assigned.
                - generic [ref=f583e180]:
                  - strong [ref=f583e181]: Core Competencies
                  - strong [ref=f583e182]
                  - emphasis [ref=f583e183]: Each KCLS position has job-specific competencies. These competencies describe characteristics needed for optimum performance in the position. In addition, there are organizational competencies applicable to all positions at KCLS that encompass the culture and set expectations for how work is performed and leadership competencies for all supervisory roles.
                  - emphasis [ref=f583e184]
                  - emphasis [ref=f583e185]: Organizational Competencies
                  - strong [ref=f583e186]
                - list [ref=f583e187]:
                  - listitem [ref=f583e188]:
                    - strong [ref=f583e190]: Valuing Diversity
                - generic [ref=f583e191]: Manages relationships with all kinds and classes of people inclusively and equitably. Respects, values, and encourages the unique dimension each employee adds to the organization and each member of the community brings to the whole. Seeks opportunities to learn about differences.
                - list [ref=f583e192]:
                  - listitem [ref=f583e193]:
                    - strong [ref=f583e195]:
                      - strong [ref=f583e196]: Customer Focus
                - generic [ref=f583e197]: Primarily focused on customer needs, able to deliver high-quality, value-added services. Constantly strives to find new ways to increase customer satisfaction and understanding, foster equitable services, and forge meaningful connections.
                - list [ref=f583e198]:
                  - listitem [ref=f583e199]:
                    - strong [ref=f583e201]:
                      - strong [ref=f583e202]: Ethics, Values and Judgement
                - generic [ref=f583e203]: Exercises best judgment, trustworthiness, and professional standards of conduct. Consistently demonstrates organization’s values, moral principles, and accountability through behavior, character, and action. Defends intellectual freedom and confidentiality.
                - list [ref=f583e204]:
                  - listitem [ref=f583e205]:
                    - strong [ref=f583e207]:
                      - strong [ref=f583e208]: Professional and Technical Knowledge
                - generic [ref=f583e209]:
                  - text: Demonstrates proficiency in professional and technical skills and/or knowledge in position-related areas. Purposely keeps up with current developments and trends in areas of expertise, in order to better foster personal success and connections for others.
                  - emphasis [ref=f583e210]
                  - emphasis [ref=f583e211]: Leadership Competencies
                - list [ref=f583e212]:
                  - listitem [ref=f583e213]:
                    - strong [ref=f583e215]:
                      - strong [ref=f583e216]: Coaching and Counseling
                - generic [ref=f583e217]: Facilitates the development of other’s knowledge, abilities, and skills to fulfill job and role responsibilities more effectively. Provides timely feedback, guidance, and encouragement to help others achieve better performance and goals. Builds confidence of others.
                - list [ref=f583e218]:
                  - listitem [ref=f583e219]:
                    - strong [ref=f583e221]:
                      - strong [ref=f583e222]: Managerial Courage
                - generic [ref=f583e223]:
                  - text: Tactfully provides direct and actionable feedback in a timely manner. Is open and direct but not intimidating. Deals head-on with people and problems even in the most difficult situations.
                  - emphasis [ref=f583e224]
                  - emphasis [ref=f583e225]: Job-Specific Competencies
                - list [ref=f583e226]:
                  - listitem [ref=f583e227]:
                    - strong [ref=f583e229]:
                      - strong [ref=f583e230]: Communicates Effectively
                - generic [ref=f583e231]: Conveys ideas and information in a way that is clear, engaging, and suitable to the audience. Main point of their message is apparent. Listens more than they speak and responds appropriately. Seeks influence.
                - list [ref=f583e232]:
                  - listitem [ref=f583e233]:
                    - strong [ref=f583e235]:
                      - strong [ref=f583e236]: Vision and Strategic Thinking
                - generic [ref=f583e237]: Supports, promotes, and ensures alignment with the organization’s vision, mission, and values. Holds big picture view while setting priorities, often using breakthrough strategies to find the way forward.
                - list [ref=f583e238]:
                  - listitem [ref=f583e239]:
                    - strong [ref=f583e241]:
                      - strong [ref=f583e242]: Decision Quality
                - text: Makes decisions and solves problems. Can deal adeptly with varied levels of complexity, ambiguity, and risk. Takes responsibility and accepts ownership for decisions regardless of outcome. Responds promptly and appropriately in crisis situations.
                - paragraph
              - term [ref=f583e243]:
                - heading "Desired Minimum Qualification" [level=2] [ref=f583e244]
              - definition [ref=f583e245]:
                - paragraph [ref=f583e246]:
                  - strong [ref=f583e247]: Education and Experience
                  - emphasis [ref=f583e249]: The items listed below are the minimum requirements for the job and are relevant to this position. The organization values both work experience and education and realizes that individuals take different paths to acquire knowledge.
                - list [ref=f583e250]:
                  - listitem [ref=f583e251]: Master of Library Science degree from an American Library Association (ALA) accredited program.
                  - listitem [ref=f583e252]: Three to five years’ experience as a public service librarian, ideally in a large system.
                  - listitem [ref=f583e253]: Any equivalent combination of education and experience that provides the necessary qualifications to successfully perform the duties of the position will be considered.
                - strong [ref=f583e255]: Knowledge and Skills
                - list [ref=f583e256]:
                  - listitem [ref=f583e257]: Model for customer service mindset and delivery.
                  - listitem [ref=f583e258]: Demonstrated commitment to community and the values of diversity, equity, and inclusion.
                  - listitem [ref=f583e259]: Analytical and decision-making skills to assess an issue and determine an optimal solution.
                  - listitem [ref=f583e260]: Highly organized and detail oriented.
                  - listitem [ref=f583e261]: Demonstrated willingness to receive and respond to feedback.
                  - listitem [ref=f583e262]: Flexible and adapts to changing needs.
                  - listitem [ref=f583e263]: Project management from inception through completion.
                  - listitem [ref=f583e264]: Effectively designs, implements, and evaluates programs and services.
                  - listitem [ref=f583e265]: Adept verbal, active listening, and written communication skills with various and diverse audiences.
                  - listitem [ref=f583e266]: Develops and maintains cooperative working relationships.
                - strong [ref=f583e268]: Professional Licenses and Certifications
                - list [ref=f583e269]:
                  - listitem [ref=f583e270]: Washington State Librarian’s Certificate is required.
                  - listitem [ref=f583e271]: A valid Washington State driver’s license is required.
                - paragraph
              - term [ref=f583e272]:
                - heading "Physical Demands & Work Environment" [level=2] [ref=f583e273]
              - definition [ref=f583e274]:
                - paragraph [ref=f583e275]:
                  - strong [ref=f583e276]: PHYSICAL DEMANDS
                  - generic [ref=f583e277]: "While performing the duties of this job, the employee will:"
                - list [ref=f583e278]:
                  - listitem [ref=f583e279]: Constantly sit throughout work shift and occasionally will stand and walk.
                  - listitem [ref=f583e280]: Occasionally reach up or down and frequently reach up to chest level with hands and arms.
                  - listitem [ref=f583e281]: Constantly use hands in conjunction with frequent finger use. Keyboarding may be repetitive up to frequently.
                  - listitem [ref=f583e282]: Rotate neck up to occasionally.
                  - listitem [ref=f583e283]: Change tasks depending upon the shift.
                  - listitem [ref=f583e284]: Occasionally operate foot controls.
                  - listitem [ref=f583e285]: Require extensive close work including use of a computer monitor.
                  - listitem [ref=f583e286]: Occasionally lift and carry up to 10 lbs. and seldom lift up to 50 lbs.
                  - listitem [ref=f583e287]: Seldom push/pull carts and wheeled equipment with light force.
                - paragraph [ref=f583e288]:
                  - strong [ref=f583e290]: WORK ENVIRONMENT
                - paragraph [ref=f583e291]: Work is primarily performed in a typical office environment. May also work in a typical library setting and in the community for engagement activities. Work schedule may include early morning and evening meetings. Occasional travel between locations required. Incumbent may be permitted hybrid telework schedule upon request.
                - paragraph
