            - heading "Internships in Digital Technology" [level=3] [ref=f91e118]
            - generic [ref=f91e119]: Build the future of travel and technology. Dive into 12 weeks of hands-on projects in cybersecurity, app development, data analytics, cloud engineering, and beyond — gaining skills at the forefront of innovation.
          - listitem [ref=f91e121]:
            - heading "Internships in Commercial" [level=3] [ref=f91e122]
            - generic [ref=f91e123]: Drive revenue and transform the customer experience. Join teams such as Sales, Network Planning, Pricing and Revenue, MileagePlus and Loyalty, and Cargo to shape the very strategies powering our airline forward.
          - listitem [ref=f91e125]:
            - heading "Internships in Finance" [level=3] [ref=f91e126]
            - generic [ref=f91e127]: Sharpen your business acumen and lead with impact. Work alongside Financial Planning and Analysis, Internal Audit, Procurement, Accounting, and other teams to influence decisions that drive our financial success.
