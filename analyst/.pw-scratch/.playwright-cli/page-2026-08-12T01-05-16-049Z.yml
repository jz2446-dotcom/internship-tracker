          - generic [ref=f91e97]: Define what's next with us
          - generic [ref=f91e101]:
            - text: "Join our team and work on projects that move the business forward while learning from leaders invested in your growth. What you'll experience:"
            - list [ref=f91e102]:
              - listitem [ref=f91e103]: Mentorship and hands-on learning from day one
              - listitem [ref=f91e104]: Employee-run Business Resource Groups (BRGs) to build community
