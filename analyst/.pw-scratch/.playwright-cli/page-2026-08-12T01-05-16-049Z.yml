              - generic [ref=f91e219]:
                - generic [ref=f91e220]: Application Review
                - generic [ref=f91e225]:
                  - paragraph [ref=f91e226]
                  - paragraph [ref=f91e228]: Our Campus Recruiting team reviews applications after each application window closes. You’ll hear from us via email, and response times typically range from two weeks to two months.
              - generic [ref=f91e233]:
                - generic [ref=f91e234]: Candidate Screening
                - generic [ref=f91e236]: If your application is selected, you’ll receive an invitation via email for a candidate screening with a recruiter. This screening determines next steps to interview with our hiring team.
              - generic [ref=f91e245]:
                - generic [ref=f91e246]: Interviews
                - generic [ref=f91e248]: Selected candidates will interview with the hiring team. You may have one to two additional interviews depending on the team or department, and some roles may include a technical assessment.
              - generic [ref=f91e257]:
                - generic [ref=f91e258]: Offer Notification
                - generic [ref=f91e260]: Accepted candidates will receive an offer via email. Offers are extended on a rolling basis, and timelines may vary.
              - generic [ref=f91e269]:
                - generic [ref=f91e270]: Onboarding
                - generic [ref=f91e272]: The new hire onboarding process begins one to two months before your start date. You’ll receive information on required background checks and clearance requirements.
              - generic [ref=f91e281]:
                - generic [ref=f91e282]: Program Timeline & Orientation
                - generic [ref=f91e284]: New hires will attend orientation at United, which takes place on the first day of the program. Start dates may vary depending on the role and program.
