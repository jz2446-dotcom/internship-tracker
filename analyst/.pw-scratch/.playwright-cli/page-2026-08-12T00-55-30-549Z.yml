        - generic [ref=f38e220]:
          - heading [level=3] [ref=f38e222]:
            - strong [ref=f38e223]: Competitive salaries & bonuses
          - paragraph [ref=f38e224]: To reward excellent performance, we offer competitive salaries and bonuses to non-commissioned employees.
        - generic [ref=f38e225]:
          - heading [level=3] [ref=f38e227]:
            - strong [ref=f38e228]: Retirement plans & 401(k) matching
          - paragraph [ref=f38e229]: Build your nest egg while building your career with Walker & Dunlop. We offer retirement plans with generous 401(k) matching opportunities.
        - generic [ref=f38e230]:
          - heading [level=3] [ref=f38e232]:
            - strong [ref=f38e233]: Service awards
          - paragraph [ref=f38e234]: All our employees are valued, and we take special pride in honoring longevity with our company via service awards that recognize three-, five-, 10-, 20-, 30-, and 40-year milestones with bonuses and paid vacations of up to $25,000.
        - generic [ref=f38e235]:
          - heading [level=3] [ref=f38e237]:
            - strong [ref=f38e238]: Health coverage & life insurance
          - paragraph [ref=f38e239]: We offer competitive medical, dental, vision, and mental health coverage, along with company-paid life insurance and medical and dependent care flexible spending accounts.
        - generic [ref=f38e240]:
          - heading [level=3] [ref=f38e242]:
            - strong [ref=f38e243]: Disability benefits
          - paragraph [ref=f38e244]: We provide short- and long-term disability benefits to make your life easier should you become temporarily or permanently disabled.
        - generic [ref=f38e245]:
          - heading [level=3] [ref=f38e247]:
            - strong [ref=f38e248]: Family benefits & paid leave
          - paragraph [ref=f38e249]: All benefit-eligible employees, including same-sex couples, can take advantage of our family-friendly benefits such as paid maternity, paternity, adoption, and foster care leave, as well as paid time off to care for sick family members.
        - generic [ref=f38e250]:
          - heading [level=3] [ref=f38e252]:
            - strong [ref=f38e253]: Paid holidays & vacation time
          - paragraph [ref=f38e254]: Recharge with paid federal holidays, floating holidays, personal days, and vacation time that accumulates with milestone anniversaries.
        - generic [ref=f38e255]:
          - heading [level=3] [ref=f38e257]:
            - strong [ref=f38e258]: Flexible work schedules
          - paragraph [ref=f38e259]: Make your daily life easier with flexible work schedules, including working remotely, that help you integrate your work/life priorities and allow you to take time for what’s important to you.
        - generic [ref=f38e260]:
          - heading [level=3] [ref=f38e262]:
            - strong [ref=f38e263]: Wellness rewards
          - paragraph [ref=f38e264]: Love to work out at the gym or enjoy a great home meditation session? We want you to take care of yourself and earn! The more you invest in yourself, the more money you earn–up to $150 per month.
