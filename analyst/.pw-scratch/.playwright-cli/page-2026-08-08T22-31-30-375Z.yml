              - heading [level=2] [ref=f282e85]:
                - strong [ref=f282e86]: Gain valuable skills and start your career with a summer internship.
              - paragraph [ref=f282e87]:
                - strong [ref=f282e88]: The Forest Service is looking to hire summer interns in various career fields; positions will open from January 12th to February 7th.
              - paragraph [ref=f282e89]: A summer internship is a great way to start a lifelong career with the Forest Service. Positions are available for high school, college undergraduates, and college graduates. Career focuses include natural resources, business, technology, engineering, physical sciences, and more.
            - heading "Details About the Openings" [level=2] [ref=f282e90]
            - paragraph [ref=f282e91]: Positions will be open to students, and you can apply on USAJOBS from January 12th to February 7th. Positions are available in various locations across the nation, location information will be available on the USAJOBS announcements.
