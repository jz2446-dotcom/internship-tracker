            - heading "Eligibility" [level=4] [ref=f282e120]
            - paragraph [ref=f282e121]:
              - text: These positions fall under our
              - link "Pathways Program" [ref=f282e122] [cursor=pointer]:
                - /url: https://www.fs.usda.gov/working-with-us/careers/pathways-internships
              - text: . Applications will be accepted from any U.S. citizen or national who is at least 18 years of age. We hire eligible students on a temporary basis for up to 1 year or for an indefinite period. You may work full-time or part-time and may be eligible to convert into a permanent position.
