      - generic [ref=f327e41]:
        - complementary
        - generic [ref=f327e42]:
          - generic [ref=f327e43]: Vista Consulting Group
          - heading "Associate Director, UI/UX Architect, Agentic Factory" [level=1] [ref=f327e44]
          - generic [ref=f327e45]:
            - generic [ref=f327e46]:
              - generic [ref=f327e47]: Level
              - generic [ref=f327e48]: Full Time
            - generic [ref=f327e49]:
              - generic [ref=f327e50]: Location
              - generic [ref=f327e51]: Remote, US
            - generic [ref=f327e52]:
              - generic [ref=f327e53]: Function
              - generic [ref=f327e54]: Value Creation
          - link "Apply" [ref=f327e55] [cursor=pointer]:
            - /url: https://careers2-vistaequitypartners.icims.com/jobs/2971/associate-director%2c-ui-ux-architect%2c-agentic-factory/job
          - separator [ref=f327e60]
          - heading "Summary" [level=2] [ref=f327e61]
          - generic [ref=f327e62]:
            - paragraph [ref=f327e63]: Vista Equity Partners is seeking a hands-on UI/UX Architect to design and ship the front-end experiences that bring agentic AI products to life across our 90+ portfolio companies. This role sits at the center of Vista’s Agentic Factory, our methodology for collaborating with portfolio companies to identify high-value agentic use cases and rapidly build production AI agents that deliver measurable business impact.
            - paragraph [ref=f327e64]: The ideal candidate pairs deep product design and front-end engineering skill with the ability to move fast — prototyping and shipping production-track interfaces in hours, not sprints — and to collaborate closely, often on-site, during compressed build cycles. You will work directly with portfolio company product and engineering teams to design and ship front-ends and user flows that build on existing UIs to integrate new agentic functionality.
            - paragraph [ref=f327e65]: This is a deeply hands-on role centered on design and front-end engineering work alongside the portfolio product teams.
          - heading "Responsibilities" [level=2] [ref=f327e66]
          - generic [ref=f327e67]:
            - paragraph [ref=f327e68]:
              - strong [ref=f327e69]: Portfolio Company Collaboration & Rapid Front-End Delivery
            - list [ref=f327e70]:
              - listitem [ref=f327e71]: Partner with portfolio company product and engineering teams to design and ship front-ends and user flows that integrate new agentic functionality into existing products.
              - listitem [ref=f327e72]: Rapidly prototype — in hours — interactive, production-track interfaces that demonstrate agentic value, then iterate collaboratively with the team.
              - listitem [ref=f327e73]: Lead end-to-end delivery of the UI/UX layer for agent implementations using Vista’s Agentic Factory methodology, targeting MVP delivery in weeks.
              - listitem [ref=f327e74]: Translate emerging agentic patterns — chat, copilots, autonomous workflows, human-in-the-loop review — into intuitive, trustworthy interaction models.
            - paragraph [ref=f327e75]:
              - strong [ref=f327e76]: UI/UX Architecture & Design Systems
            - list [ref=f327e77]:
              - listitem [ref=f327e78]: Design scalable, maintainable front-end architectures in React/TypeScript that integrate cleanly with cloud-deployed agentic backends.
              - listitem [ref=f327e79]: Build and extend reusable design systems and component libraries that let portfolio teams ship consistent agentic experiences at speed.
              - listitem [ref=f327e80]: Define interaction patterns for agentic UX, including surfacing agent reasoning, confidence, citations, and human-in-the-loop checkpoints calibrated to risk and domain complexity.
              - listitem [ref=f327e81]: Establish standards for accessibility, responsiveness, and front-end performance across portfolio deployments.
            - paragraph [ref=f327e82]:
              - strong [ref=f327e83]: Design & AI Innovation
            - list [ref=f327e84]:
              - listitem [ref=f327e85]: Serve as a subject matter expert on agentic UX and modern front-end practice, providing thought leadership and hands-on guidance to portfolio companies and Vista leadership.
              - listitem [ref=f327e86]: Identify and evaluate emerging front-end frameworks, design tooling, and AI interface patterns, assessing their impact on portfolio company product roadmaps.
              - listitem [ref=f327e87]: Develop and evangelize best practices for agentic interface design, prototyping velocity, and front-end quality across the portfolio.
            - paragraph [ref=f327e88]:
              - strong [ref=f327e89]: Due Diligence
            - list [ref=f327e90]:
              - listitem [ref=f327e91]: Assist in the due diligence process for potential portfolio companies, assessing product UX maturity, front-end technical debt, and readiness for agentic AI adoption.
              - listitem [ref=f327e92]: Provide design and front-end assessments that inform investment decisions and post-acquisition value creation plans.
            - heading "What You Are an Expert In" [level=1] [ref=f327e93]
            - paragraph [ref=f327e94]:
              - strong [ref=f327e95]: Technical Expertise
            - list [ref=f327e96]:
              - listitem [ref=f327e97]: Front-end engineering with React and TypeScript, modern CSS (e.g., Tailwind), and component-driven architecture
              - listitem [ref=f327e98]: Product design and prototyping in Figma, including design systems and interactive prototypes
              - listitem [ref=f327e99]: Rapid prototyping and production delivery under compressed timelines
              - listitem [ref=f327e100]: Integrating front-ends with cloud-deployed agentic backends (e.g., LangGraph/LangChain, REST and streaming APIs)
              - listitem [ref=f327e101]: "UX for AI: chat and copilot interfaces, agent observability, and human-in-the-loop workflows"
              - listitem [ref=f327e102]: Accessibility, responsive design, and front-end performance optimization
            - paragraph [ref=f327e103]:
              - strong [ref=f327e104]: Operational Expertise
            - list [ref=f327e105]:
              - listitem [ref=f327e106]: Rapid proof-of-value delivery and compressed development cycles
              - listitem [ref=f327e107]: Cross-organizational, often on-site collaboration and stakeholder management across multiple companies simultaneously
              - listitem [ref=f327e108]: Translating design and front-end decisions for both technical and executive audiences
              - listitem [ref=f327e109]: Problem-solving and analytical thinking in ambiguous environments
          - heading "Qualifications" [level=2] [ref=f327e110]
          - generic [ref=f327e111]:
            - list [ref=f327e112]:
              - listitem [ref=f327e113]: Bachelor’s or Master’s degree in Design, Human-Computer Interaction, Computer Science, or a related field — or equivalent demonstrated experience.
              - listitem [ref=f327e114]: 5+ years shipping production-grade product front-ends and user experiences at scale, with recent hands-on experience integrating interfaces with AI or agentic backends.
              - listitem [ref=f327e115]: Demonstrated track record of shipping polished product UI to production environments, not just prototypes.
              - listitem [ref=f327e116]: Fluency with React and a modern design toolchain (Figma, design systems), with the ability to move from concept to working interface quickly.
              - listitem [ref=f327e117]: Excellent communication, presentation, and interpersonal skills.
              - listitem [ref=f327e118]: Experience within private equity portfolio companies, consulting, or multi-client environments is a strong plus.
              - listitem [ref=f327e119]:
                - text: Ability and willingness to travel approximately
                - strong [ref=f327e120]: 6 days per month
                - text: to collaborate with Vista portfolio companies and other stakeholders.
            - paragraph [ref=f327e121]: The annualized base pay range for this role is expected to be between $160,000 - $210,000. Actual base pay could vary based on factors including but not limited to experience, subject matter expertise, geographic location where work will be performed and the applicant’s skill set. The base pay is just one component of the total compensation package for employees. Other components may include an annual cash bonus and a comprehensive benefits package.
