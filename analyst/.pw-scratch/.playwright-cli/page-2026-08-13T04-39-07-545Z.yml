        - insertion [ref=f737e246]
        - heading "About Africa" [level=2] [ref=f737e248]
        - generic [ref=f737e249]:
          - paragraph [ref=f737e250]: Africa is the second largest and most populous continent in the world after Asia. The area of Africa without islands is 11.3 million square miles (29.2 million sq km), with islands - about 11.7 million square miles (30.3 million sq km), thus covering 6% of the total surface area of the Earth and 20.4% of the land surface. It is 5,000 miles (8,000 kilometers) long from north to south and 4700 miles (7,500 kilometers) long from west to east in the northern part. As of 2023, about 1.5 billion people lived in Africa, which is about 18.2% of the world's population.
          - paragraph [ref=f737e251]:
            - text: The continent is washed by the
            - link "Mediterranean Sea" [ref=f737e252] [cursor=pointer]:
              - /url: //ontheworldmap.com/oceans-and-seas/mediterranean-sea/
            - text: to the north, the
            - link "Red Sea" [ref=f737e253] [cursor=pointer]:
              - /url: //ontheworldmap.com/oceans-and-seas/red-sea/
            - text: to the northeast, the
            - link "Atlantic Ocean" [ref=f737e254] [cursor=pointer]:
              - /url: //ontheworldmap.com/oceans-and-seas/atlantic-ocean/
            - text: to the west, and the
            - link "Indian Ocean" [ref=f737e255] [cursor=pointer]:
              - /url: //ontheworldmap.com/oceans-and-seas/indian-ocean/
            - text: to the east and south. Africa is connected to Asia by the Isthmus of Suez, on which the Suez Canal is located. Africa is separated from Europe by the Strait of Gibraltar. Africa comprises 54 fully recognized sovereign states, as well as a number of dependent territories and unrecognized gusadarstvo. Algeria is the largest country in Africa by area, and Nigeria is the largest by population.
