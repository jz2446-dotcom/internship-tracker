        - 'heading "Stay vigilant: Recruiting fraud" [level=2] [ref=f118e174]'
        - paragraph [ref=f118e175]: Your safety as a candidate is important to us. As you explore opportunities at BlackRock, please stay alert to any job posts or recruiter communications that may seem suspicious.
        - paragraph [ref=f118e176]: "Keep in mind:"
        - list [ref=f118e177]:
          - listitem [ref=f118e178]: All roles we are recruiting for externally are posted on our careers site.
          - listitem [ref=f118e179]:
            - text: Recruiter emails will always come from an official
            - link "BlackRock.com" [ref=f118e180] [cursor=pointer]:
              - /url: http://blackrock.com/
            - text: address and never from a webmail address (like Gmail or Yahoo). Recruiters will also never reach out or conduct interviews via chat or text. If a recruiter reaches out on LinkedIn, make sure it’s from a verified account.
          - listitem [ref=f118e181]: BlackRock will never request payment, deposits, bank details, or other financial information at any time during our hiring process. We recommend that you do not disclose personal or financial information to anyone you do not know.
        - paragraph [ref=f118e182]:
          - text: If you believe you’ve received fraudulent communication from someone claiming to represent BlackRock or our Talent Acquisition team, please contact
          - link "reportascam@blackrock.com" [ref=f118e183] [cursor=pointer]:
            - /url: mailto:reportascam@blackrock.com
          - text: .
        - paragraph [ref=f118e184]:
          - text: For more information and additional guidance, please visit
          - link "our page" [ref=f118e185] [cursor=pointer]:
            - /url: https://www.blackrock.com/corporate/compliance/scams-and-fraud
          - text: on scam and fraud awareness.
