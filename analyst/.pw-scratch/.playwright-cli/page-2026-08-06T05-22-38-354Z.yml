                    - heading "SMR potential in Europe & Belgium" [level=2] [ref=f48e273]
                    - paragraph [ref=f48e275]:
                      - text: Europe's and Belgium's energy landscape is undergoing profound change, making Small Modular Reactors (SMRs) an increasingly important topic for industry and investors. In this Webinar, our experts
                      - link "Pierre Bastien" [ref=f48e276] [cursor=pointer]:
                        - /url: https://www.rolandberger.com/en/Persons/Pierre.Bastien.html
                      - text: ","
                      - link "Matthias Van Steendam" [ref=f48e277] [cursor=pointer]:
                        - /url: https://www.rolandberger.com/en/Persons/Matthias.Van-Steendam.html
                      - text: ","
                      - link "Arnoud Van der Slot" [ref=f48e278] [cursor=pointer]:
                        - /url: https://www.rolandberger.com/en/Persons/Arnoud.van-der-Slot.html
                      - text: and
                      - link "Mike Granowski" [ref=f48e279] [cursor=pointer]:
                        - /url: https://www.rolandberger.com/en/Persons/Mike.Granowski.html
                      - text: will discuss the outlook for SMRs in Europe and Belgium, the latest technology and market developments, emerging business cases across industries, and the key factors for successful SMR deployment. Further information can be found
                      - link "here" [ref=f48e280] [cursor=pointer]:
                        - /url: https://content.rolandberger.com/smr-potential-in-europe-and-belgium
                      - text: .
