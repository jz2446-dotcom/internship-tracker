      - heading "Refrigeration Equipment Operator" [level=1] [ref=f126e41]
    - generic [ref=f126e42]:
      - article [ref=f126e43]:
        - heading "Position Overview" [level=2] [ref=f126e44]
        - paragraph
        - paragraph [ref=f126e45]: Under general supervision, responsible for assisting in the operation, maintenance, and repair of refrigeration and mechanical equipment for the Detroit Public Library (DPL) in assigned location; ensures the safe operation of equipment on assigned schedules; operates and maintains mechanical, electrical, pneumatic, heating, and refrigeration and/or air conditioning systems.
        - paragraph
        - generic [ref=f126e46]:
          - term [ref=f126e47]: Position Type
          - definition [ref=f126e48]: Full Time
        - generic [ref=f126e49]:
          - term [ref=f126e50]: Agency
          - definition [ref=f126e51]: Facilities
        - generic [ref=f126e52]:
          - term [ref=f126e53]: Salary Range
          - definition [ref=f126e54]: $57,995
        - generic [ref=f126e55]:
          - term [ref=f126e56]: Job Family
          - definition [ref=f126e57]: Facilities Maintenance Group
        - generic [ref=f126e58]:
          - term [ref=f126e59]: FLSA Status
          - definition [ref=f126e60]: Non-Exempt
        - generic [ref=f126e61]:
