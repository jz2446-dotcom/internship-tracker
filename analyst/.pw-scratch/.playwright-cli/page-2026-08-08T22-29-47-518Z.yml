          - definition [ref=f126e63]: International Union of Operating Engineers
        - generic [ref=f126e64]:
          - term [ref=f126e65]: Revision Date
          - definition [ref=f126e66]: June 2026
        - heading "General Purpose" [level=3] [ref=f126e67]
        - paragraph [ref=f126e68]: Under general supervision, responsible for assisting in the operation, maintenance, and repair of refrigeration and mechanical equipment for the Detroit Public Library (DPL) in assigned location; ensures the safe operation of equipment on assigned schedules; operates and maintains mechanical, electrical, pneumatic, heating, and refrigeration and/or air conditioning systems.
        - heading "Supervision" [level=3] [ref=f126e69]
        - paragraph [ref=f126e70]: Works under the general supervision of the Library – Manager, Facilities Maintenance; and does not exercise supervisory responsibility.
        - heading "Distinguishing Characteristics" [level=3] [ref=f126e71]
        - paragraph [ref=f126e72]: This is first in a series of two in the Refrigeration Equipment Operator – First Class job series. It is distinguished from the Chief Refrigeration Equipment Operator – First Class by the more general and routine nature of the work performed. The Chief Refrigeration Equipment Operator – First Class would generally perform more complex refrigeration and mechanical work requiring additional specialized expertise and/or take the lead role in projects requiring a City of Detroit First Class Refrigeration Equipment Operator’s License. Both jobs in the series require incumbents to work independently and under their own initiatives with only general supervision.
        - heading "Primary Responsibilities" [level=3] [ref=f126e73]
        - paragraph [ref=f126e74]:
          - emphasis [ref=f126e75]:
            - text: The following duties
            - strong [ref=f126e76]: ARE NOT
            - text: intended to serve as a comprehensive list of all duties performed by all employees in this classification, only a representative summary of the primary duties and responsibilities. Incumbent(s) may not be required to perform all duties listed and may be required to perform additional, position-specific duties.
        - list [ref=f126e77]:
          - listitem [ref=f126e78]: In area of assignment, regularly makes rounds and inspects the library buildings and monitors temperature levels; makes adjustments as necessary or requested.
          - listitem [ref=f126e79]: Starts, stops, and controls all equipment operated; checks all mechanical rooms and equipment for proper operation; checks belts, filters, bearings, temperatures, and pressure; balances, adjusts or replaces, and sets mechanical equipment and controls as necessary.
          - listitem [ref=f126e80]: Operates chilled water equipment when necessary such as pumps, towers, and water treatment systems; and tracks, records, and maintains data.
          - listitem [ref=f126e81]: Checks Trackit system, e-mail, and room reservation schedules for work orders and set ups; sets up and tears down stages, moves podiums, and moves/adds extension cords in preparation for various scheduled events and meetings.
          - listitem [ref=f126e82]: Assists any contractors and vendors with building issues, repairs, and projects.
          - listitem [ref=f126e83]: Assists with maintaining records and inventories of materials and supplies needed; performs other maintenance, building and equipment repair projects; and cleans equipment, shop area and work site area
          - listitem [ref=f126e84]: Assists management with special projects such as setting up for holidays, special events, concerts, and conferences.
          - listitem [ref=f126e85]: Attends regularly scheduled staff and departmental meetings to discuss issues, problems, project planning and departmental goals and objectives.
          - listitem [ref=f126e86]: Provides support to the Library – Manager, Facilities Maintenance on matters as directed; participates on a variety of committees as assigned; prepares and presents reports and other necessary correspondence; attends and participates in trade group meetings; maintains awareness of new trends and developments in the fields related to area of assignment; ensures processes, policies and practices are interpreted and applied consistently and effectively; ensures accountability and compliance with all current and applicable state and federal laws, Library policies and procedures, rules and regulations.
          - listitem [ref=f126e87]: Ensures an environment of customer-responsive services, providing customer-responsive service and handling customer service issues.
          - listitem [ref=f126e88]: Performs other duties as assigned or required.
        - heading "Minimum Qualifications" [level=3] [ref=f126e89]
        - paragraph [ref=f126e90]:
          - strong [ref=f126e91]: "Education and Experience:"
        - paragraph [ref=f126e92]: High School Diploma/GED and valid First Class Refrigeration Operator’s License and five years experience as an operator, two years of which must be at or above the required level of license, that includes performing a variety of maintenance, and repair of refrigeration and mechanical equipment; preferably for a large, multi-sited organization.
        - paragraph [ref=f126e93]:
          - strong [ref=f126e94]: "Required Licenses or Certifications:"
        - list [ref=f126e95]:
          - listitem [ref=f126e96]: Must possess a valid State of Michigan Driver’s License.
          - listitem [ref=f126e97]: Possession of a valid City of Detroit First Class Refrigeration Operator’s License.
        - paragraph [ref=f126e98]:
          - strong [ref=f126e99]: "Required Knowledge of:"
        - list [ref=f126e100]:
          - listitem [ref=f126e101]: Applicable codes, standards, and regulations common to the trade.
          - listitem [ref=f126e102]: Tools, equipment, and materials common to the trade.
          - listitem [ref=f126e103]: Preventative and general maintenance.
          - listitem [ref=f126e104]: Safety practices common to the operation of maintenance equipment.
          - listitem [ref=f126e105]: Records and documentation relative to refrigeration maintenance and repair
          - listitem [ref=f126e106]: Available resources such as repair manuals, schematics, blue prints, and building codes.
          - listitem [ref=f126e107]: Other pertinent federal, state, and local laws, codes, and regulations.
          - listitem [ref=f126e108]: Modern office procedures, methods, and equipment including computers and computer applications such as word processing, spreadsheets, and statistical databases.
          - listitem [ref=f126e109]: Public library operations, services, and policies.
          - listitem [ref=f126e110]: Customer service standards and procedures.
        - paragraph [ref=f126e111]:
          - strong [ref=f126e112]: "Required Skill in:"
        - list [ref=f126e113]:
          - listitem [ref=f126e114]: Interacting with different people of social, economic, and ethnic backgrounds.
          - listitem [ref=f126e115]: Installation, repair, and maintenance of all refrigeration and other mechanical systems common to the trade.
          - listitem [ref=f126e116]: Estimating time and material requirements needed for work projects.
          - listitem [ref=f126e117]: The use and care of hand tools and power equipment necessary to perform trade work and other various building maintenance and repair tasks.
          - listitem [ref=f126e118]: Promoting and enforcing safe work practices.
          - listitem [ref=f126e119]: Preparing and maintaining accurate maintenance records, reports, and documentation.
          - listitem [ref=f126e120]: Reading a variety of resources used in repair and troubleshooting such as equipment manuals, repair manuals, schematics, blue prints, and building codes.
          - listitem [ref=f126e121]: Meeting deadlines and adapting to unexpected changes and interruptions in workflow and in individual assignments.
          - listitem [ref=f126e122]: Responding to inquiries and in effective oral and written communication.
          - listitem [ref=f126e123]: Utilizing personal computer software programs affecting assigned work and in compiling and preparing spreadsheets and reports.
          - listitem [ref=f126e124]: Establishing and maintaining effective working relationships with Library and department staff, board members, outside agencies, and the general public.
        - paragraph [ref=f126e125]:
          - strong [ref=f126e126]: "Physical Demands / Work Environment:"
        - list [ref=f126e127]:
          - listitem [ref=f126e128]: Work is performed in a standard library environment.
          - listitem [ref=f126e129]: Subject to sitting, standing, walking, bending, reaching, and lifting of objects up to 50 pounds.
