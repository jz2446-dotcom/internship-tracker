            - generic [ref=f509e46]:
              - heading "Studio Art Classes Intern" [level=2] [ref=f509e47]
              - generic [ref=f509e48]: June - August 2019 • Boston, MA
            - generic [ref=f509e50]:
              - img [ref=f509e53]: 
              - generic [ref=f509e55]:
                - heading "What I liked" [level=3] [ref=f509e56]
                - generic [ref=f509e57]: I LOVED my internship at the Museum of Fine Arts since I was able to shadow professional artists as they taught students (varying in ages from 4-18yrs old) in a setting such as the famous museum of the MFA, as well as learn about jobs and opportunities I could pursue in the future! Also, I was able to meet dozens of other interns from around the world who traveled to Boston for the same experience I happily took a 3hr commute to attend every day. It was eye-opening as an Art Education Major to see all the opportunities there were for me outside of the traditional setting of a school!
            - generic [ref=f509e64]:
              - heading "What I wish was different" [level=3] [ref=f509e65]
              - generic [ref=f509e66]: The only complaint is that the Studio Art Classes Internship position, which was practically a full-time job, (40hrs a week), was unpaid. The Museum of Fine Arts used its title as its' payment, which I am extremely grateful to have connections to the MFA and be able to put such a renowned museum on my resume, but I wasn't able to have a job because of how time-consuming the MFA position was! However, I did receive a scholarship for $1,000 from UVM's Art/Art History Department to take the unpaid internship! This scholarship covered the costs of transportation and food so that definitely took off a lot of stress for me!
            - generic [ref=f509e73]:
              - heading "Advice" [level=3] [ref=f509e74]
              - generic [ref=f509e75]: I would tell those interested in hopping right into a big position/internship/job the summer after freshmen year (or just in general)- to go for it! I felt that I wasn't experienced enough and too young to take such a position at the MFA, but I'm so happy I did since I learned so much from it. It's fantastic to learn about art history and what it would be like to be an art teacher, but its another experience to be in a classroom or gallery with students, and sharing your passion with them, seeing them learn and (for some students) find that same love for creativity-that you're able to know that what you chose for an academic path is perfect and fitting. So in the general sense, always look for experiences to have, even if it's scary since it is the most eye-opening and 'worth it' experience!
