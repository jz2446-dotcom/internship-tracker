            - generic [ref=f509e276]:
              - img [ref=f509e279]: 
              - generic [ref=f509e281]:
                - heading "What I liked" [level=3] [ref=f509e282]
                - generic [ref=f509e283]: I loved that I was able to work in a museum setting using some of my creative skills. Also working with children who are really interested in art and being able to show them around the museum spaces was fun.
            - generic [ref=f509e290]:
              - heading "What I wish was different" [level=3] [ref=f509e291]
              - generic [ref=f509e292]: I wanted to have more responsibilities, sometimes, I felt that I was not doing a lot but it was also because there were always two people as well as the teacher supervising the students.
            - generic [ref=f509e299]:
              - heading "Advice" [level=3] [ref=f509e300]
              - generic [ref=f509e301]: Do not be afraid to lead a class. I was very intimidated to do it and it took me most of the summer to gain the confidence to finally lead a class discussion in the galleries. Especially leading a class discussions with children who were just very curious and there was no judgement from them or my coworkers if I stuttered.
