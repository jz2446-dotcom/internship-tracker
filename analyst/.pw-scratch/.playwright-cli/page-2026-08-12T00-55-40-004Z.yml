      - paragraph [ref=f45e360]:
        - strong
        - strong [ref=f45e361]: Equal Opportunity/Affirmative Action Employer
        - text: Equal employment opportunity has been and will continue to be a basic principle at the Credit Union. Beginnings Credit Union provides equal employment opportunities, without discrimination because of race, color, religion, creed, sex, sexual orientation, gender identity or expression, pregnancy, marital status, age, national origin, citizenship, handicap or disability, veteran or military status, political beliefs, victim of domestic violence status, familial status, or predisposing genetic characteristics or status, or any other status protected by federal, state, local or other law. This policy includes, but is not limited to recruitment, hiring, compensation, training, and apprenticeship, promotion, upgrading, demotion, downgrading, transfer, lay-off and termination, and all other terms and conditions of employment.
      - paragraph [ref=f45e362]:
        - 'link "Know Your Rights: Workplace Discrimination is Illegal" [ref=f45e363] [cursor=pointer]':
          - /url: "https://www.eeoc.gov/sites/default/files/2023-06/22-088_EEOC_KnowYourRights6.12ScreenRdr.pdf "
        - text: (English)
      - paragraph [ref=f45e364]:
        - strong [ref=f45e365]: Disability Accommodation
        - text: If you are interested in applying for an employment opportunity and require special assistance or accommodation to apply due to a disability, please contact us at
