    - main [ref=f51e110]:
      - article [ref=f51e113]:
        - generic [ref=f51e116]:
          - generic [ref=f51e122]:
            - heading "Roles at L.E.K." [level=1] [ref=f51e126]
            - img "Lek career hero" [ref=f51e133]
          - generic [ref=f51e138]:
            - heading "No matter what your role is, you have the opportunity to make a real impact." [level=2] [ref=f51e142]
            - generic [ref=f51e146]:
              - paragraph [ref=f51e147]: We offer the broadest, most comprehensive and fastest acquisition of business skills in the industry and prepare you for future endeavors by providing early management responsibility, assigning shorter cases and emphasizing critical decision making for clients.
              - paragraph [ref=f51e148]: Our apprenticeship approach and diversity of challenging business experiences build your business toolkit and accelerate your career. Our people develop into problem solvers, coaches, leaders, facilitators and trusted advisors. There are no limits to how you can grow.
          - generic [ref=f51e151]:
            - heading "Select a Role for More Details:" [level=3] [ref=f51e156]
            - generic [ref=f51e161]:
              - generic [ref=f51e163]:
                - heading "Summer Associate" [level=4] [ref=f51e168]
                - generic [ref=f51e169]:
                  - paragraph [ref=f51e176]: An ideal opportunity for undergraduates to experience management consulting at L.E.K. You’ll spend your internship helping solve our clients’ most challenging business issues.
                  - group [ref=f51e181]:
                    - generic "The Role of the Summer Associate" [ref=f51e182] [cursor=pointer]
              - separator [ref=f51e187]
              - generic [ref=f51e189]:
                - heading "Summer Consultant" [level=4] [ref=f51e194]
                - generic [ref=f51e195]:
                  - paragraph [ref=f51e202]: An ideal opportunity for MBA students to experience management consulting at L.E.K. You’ll spend your internship helping solve our clients’ most challenging business issues.
                  - group [ref=f51e207]:
                    - generic "The Role of the Summer Consultant" [ref=f51e208] [cursor=pointer]
              - separator [ref=f51e213]
              - generic [ref=f51e215]:
                - heading "Associate" [level=4] [ref=f51e220]
                - generic [ref=f51e221]:
                  - paragraph [ref=f51e228]: Kickstart your L.E.K. career journey, where you will dive into complex business challenges, collaborate with industry leaders, and develop high-impact insights that shape our client strategies. You will gain hands-on experience across multiple industries, clients and business issues providing the platform for early responsibility and development of a highly analytical skill set. You will be a part of a strong inclusive team working in a collaborative and dynamic environment that values curiosity, initiative, and continuous learning.
                  - group [ref=f51e233]:
                    - generic "More on the Associate role" [ref=f51e234] [cursor=pointer]
              - separator [ref=f51e239]
              - generic [ref=f51e241]:
                - heading "Senior Associate" [level=4] [ref=f51e246]
                - generic [ref=f51e253]:
                  - paragraph [ref=f51e254]: Elevate your career at L.E.K. Consulting, where you’ll lead strategic analyses, work on high-stakes projects, and help shape the future of top businesses. As a Senior Associate, you’ll take on a greater leadership role - driving critical insights, mentoring junior team members, and collaborating with top-tier talent to solve complex challenges. With fast-tracked learning, international exposure, and clear advancement opportunities, this role is designed for ambitious professionals ready to make a lasting impact.
                  - paragraph [ref=f51e255]:
                    - emphasis [ref=f51e256]: "Please note: This role is not available in our Asia offices."
              - separator [ref=f51e261]
              - generic [ref=f51e263]:
                - heading "Associate Consultant" [level=4] [ref=f51e268]
                - paragraph [ref=f51e276]: Take your career to the next level at L.E.K. Consulting, where you’ll lead workstreams, drive strategic insights, and mentor junior team members while solving complex business challenges. As an Associate Consultant, you’ll work directly with executives, gain broad industry exposure, and contribute to high-stakes decisions at critical inflection points. If you're ready for a fast-paced, high-impact role with clear advancement opportunities, this is your chance to lead, innovate, and make a lasting impact.
              - separator [ref=f51e281]
              - generic [ref=f51e283]:
                - heading "Senior Associate Consultant" [level=4] [ref=f51e288]
                - generic [ref=f51e295]:
                  - paragraph [ref=f51e296]: Senior Associate Consultants are focused on honing skills to prepare for the Consultant role at L.E.K. In this role, you’ll elevate your thought leadership and bolster your team management skills as you progress through the firm.
                  - paragraph [ref=f51e297]:
                    - emphasis [ref=f51e298]: "Please note: This role is offered exclusively in our Asia offices."
              - separator [ref=f51e303]
              - generic [ref=f51e305]:
                - heading "PhD Analyst" [level=4] [ref=f51e310]
                - generic [ref=f51e311]:
                  - paragraph [ref=f51e318]: As a PhD Analyst in the U.S., you will gain experience as not only a technical expert, but a business expert, and will develop cutting-edge strategic and managerial skills that will provide an excellent foundation for a career at L.E.K. and beyond.
                  - group [ref=f51e323]:
                    - generic "More on the PhD Analyst role" [ref=f51e324] [cursor=pointer]
              - separator [ref=f51e329]
              - generic [ref=f51e331]:
                - heading "Life Sciences Specialist" [level=4] [ref=f51e336]
                - generic [ref=f51e337]:
                  - paragraph [ref=f51e344]: In this Americas, Europe, and Asia-based position, you will not only be a technical expert, but also a business expert, developing cutting-edge strategic and managerial skills that provide a strong foundation for a career at L.E.K.
                  - group [ref=f51e349]:
                    - generic "More on the Life Sciences Specialist role" [ref=f51e350] [cursor=pointer]
              - separator [ref=f51e355]
              - generic [ref=f51e357]:
                - heading "Senior Life Sciences Specialist" [level=4] [ref=f51e362]
                - paragraph [ref=f51e370]: As a Senior Life Sciences Specialist, you’ll continue providing the scientific expertise that is often a critical element in solving a case, while continuing to build your leadership skills and take on increasing responsibilities.
              - separator [ref=f51e375]
              - generic [ref=f51e377]:
                - heading "Consultant" [level=4] [ref=f51e382]
                - generic [ref=f51e383]:
                  - paragraph [ref=f51e390]: As a Consultant, you’ll deliver impactful solutions to clients across multiple industries. Leading case teams day-to-day, you’ll have immediate management responsibility.
