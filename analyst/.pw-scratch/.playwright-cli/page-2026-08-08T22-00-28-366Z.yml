              - separator [ref=f51e422]
              - generic [ref=f51e424]:
                - heading "Manager" [level=4] [ref=f51e429]
                - paragraph [ref=f51e437]: You’ll lead multiple case teams, maintain deep, long-term relationships with multiple clients, and develop expertise in particular industries or sectors.
              - separator [ref=f51e442]
              - generic [ref=f51e444]:
                - heading "Senior Manager" [level=4] [ref=f51e449]
                - paragraph [ref=f51e457]: Senior Managers will tackle more complex cases and develop broader leadership skills beyond their case teams. They will be more active in overall firm leadership and serve as mentors to those around them.
              - separator [ref=f51e462]
              - generic [ref=f51e464]:
                - heading "Principal" [level=4] [ref=f51e469]
                - paragraph [ref=f51e477]: One step away from Partner, you are a mentor to staff at all levels of the firm and a leader in your office. Principals will actively participate in firm business development efforts and serve as trusted advisors to L.E.K. clients.
              - separator [ref=f51e482]
              - generic [ref=f51e484]:
                - heading "Partner" [level=4] [ref=f51e489]
                - paragraph [ref=f51e497]: Partners are responsible for the growth of our business and the culture of the firm. They are acknowledged experts and trusted partners to our clients. Partners are at the forefront of industry trends and drive the overall success of the firm.
              - separator [ref=f51e502]
              - generic [ref=f51e504]:
                - heading "Core Services Staff" [level=4] [ref=f51e509]
                - generic [ref=f51e510]:
                  - paragraph [ref=f51e517]: As a dedicated professional, you’ll find challenging and rewarding opportunities in areas such as marketing, human resources, recruiting, knowledge management, finance, legal and more in our offices across the globe.
                  - group [ref=f51e522]:
                    - generic "More on professional staff opportunities" [ref=f51e523] [cursor=pointer]
