                    - text: Overview
                    - paragraph [ref=f10e366]: Microsoft Cloud Operations and Innovation (CO&I) is the team behind the cloud. Within CO&I, the Engineering Procurement & Construction (EPC) organization is responsible for delivering core datacenter infrastructure for Microsoft’s cloud business. The MS portfolio consists of complex, multi-disciplinary, large scale, multi-year datacenter construction and lease projects. We are looking for a passionate, high-energy individual to help build the cloud datacenters that power the world’s largest online services. “Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.”
                    - paragraph [ref=f10e367]:
                      - text: We are seeking a passionate, high-energy Integration and
                      - strong [ref=f10e368]: Technical Infrastructure Manager (ITIM)
                      - text: to help deliver the infrastructure that powers Microsoft’s global cloud services.
                    - text: Responsibilities
                    - paragraph [ref=f10e369]: The ITIM is a critical member of Microsoft’s Cloud Operations & Innovation (CO+I) team, responsible for project management of all integration and fit-out activities for Microsoft-owned systems and services in new data center builds or leased facilities. This role ensures timely delivery of technical infrastructure to support Microsoft’s cloud capacity needs.
                    - paragraph [ref=f10e370]: "Project Management:"
                    - list [ref=f10e371]:
                      - listitem [ref=f10e372]: Oversee integration and technical infrastructure fit-out activities for data center construction and lease projects.
                      - listitem [ref=f10e373]: Develop and manage project plans, track major milestones (e.g., Early Access, Ready Network Install, Corpnet Live, ).
                    - paragraph [ref=f10e374]: "Stakeholder Coordination:"
                    - list [ref=f10e375]:
                      - listitem [ref=f10e376]: Align internal Microsoft teams (Operations, Security, IT, Networking) with external stakeholders (General Contractors, landlords, vendors, suppliers).
                    - paragraph [ref=f10e377]:
                      - heading "Safety & Compliance:" [level=3] [ref=f10e378]
                    - list [ref=f10e379]:
                      - listitem [ref=f10e380]: Advocate for safe worksites and implement Microsoft’s High Risk Activity (HRA) program.
                      - listitem [ref=f10e381]: Ensure compliance with Microsoft safety standards and risk management processes.
                      - listitem [ref=f10e382]: Coordinate procurement and installation of telecom systems, security systems, furniture/fixtures/equipment (FFE), and corporate network infrastructure.
                      - listitem [ref=f10e383]: Collaborate with Data Center Engineering (DCE) and specialty consultants to review and execute design improvements.
                      - listitem [ref=f10e384]: Drive lean delivery strategies and process improvements across multiple sites.
                    - text: Qualifications
                    - paragraph [ref=f10e385]:
                      - heading "Required Qualifications:" [level=3] [ref=f10e386]
                    - list [ref=f10e387]:
                      - listitem [ref=f10e388]:
                        - text: Bachelor's Degree in Construction Project Management, Architecture, Engineering, or related field AND 10+ years related experience OR equivalent experience
                        - strong [ref=f10e389]: .
                    - paragraph [ref=f10e390]:
                      - heading "Preferred Qualifications:" [level=3] [ref=f10e391]
                    - list [ref=f10e392]:
                      - listitem [ref=f10e393]: Bachelor's Degree in Construction Project Management, Architecture, Engineering, or related field AND 12+ years related experience OR equivalent experience.
                      - listitem [ref=f10e394]: 12+ years experience working on data center projects.
                      - listitem [ref=f10e395]: Proven experience in data center construction, telecom infrastructure, and fit-out projects.
                      - listitem [ref=f10e396]: Strong understanding of mechanical/electrical systems, commissioning, and integrated testing.
                      - listitem [ref=f10e397]: Ability to manage complex, multi-disciplinary projects and deadlines independently.E
                      - listitem [ref=f10e398]: xcellent communication and cross-group collaboration skills.
                      - listitem [ref=f10e399]: Experience with mission-critical facilities and vendor management.Knowledge of ISO-accredited safety and quality management systems.
                    - paragraph [ref=f10e400]:
                      - heading "Background Check Requirements:" [level=3] [ref=f10e402]
                    - paragraph [ref=f10e403]: "Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings:"
