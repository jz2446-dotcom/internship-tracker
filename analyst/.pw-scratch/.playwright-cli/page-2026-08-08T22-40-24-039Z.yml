            - generic [ref=f295e49]:
              - paragraph [ref=f295e50]: The City of Houston can’t function without great employees. We’re always on the lookout for talented, caring people to join us. Employment with City of Houston represents more than just a job. A career in public service is an opportunity to serve fellow citizens across our city. Professions in city government help to support many aspects of life in Houston and considering a career in public service is an honorable choice.
              - paragraph [ref=f295e51]:
                - strong [ref=f295e52]: "Instructions:"
              - list [ref=f295e53]:
                - listitem [ref=f295e54]: Apply online by clicking on the job title you are interested in below and then clicking on the "Apply" link.
                - listitem [ref=f295e55]: If this is the first time you are applying using our online job application process, you will need to create an account and select a User Name and Password.
                - listitem [ref=f295e56]: After your account has been established, you can upload your resume and follow the steps to create and submit an application. This application can be saved and used to apply for more than one job opening.
                - listitem [ref=f295e57]: It is important that your application show all the relevant education and experience you possess. Applications may be rejected if they are incomplete when submitted.
                - listitem [ref=f295e58]: If you do not see a current opening below that you are interested in, please fill out a Job Interest Card from the Menu to receive future notifications of open positions within selected categories.
              - paragraph [ref=f295e59]:
