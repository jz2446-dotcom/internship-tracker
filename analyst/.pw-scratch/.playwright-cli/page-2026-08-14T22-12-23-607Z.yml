        - generic [ref=f571e88]:
          - heading "What is Beneficial Banking™?" [level=2] [ref=f571e89]
          - paragraph [ref=f571e90]:
            - text: Beneficial State is a
            - link "B Corp" [ref=f571e91] [cursor=pointer]:
              - /url: https://www.beneficialstatebank.com/impact/b-corp
            - text: and a triple-bottom-line bank. This means that rather than serving the single bottom line of profit, as do most traditional businesses, we equally prioritize the three goals of serving our communities, supporting positive environmental outcomes, and achieving long-term financial sustainability.
          - paragraph [ref=f571e92]:
            - text: We design our products and services to optimize
            - link "social" [ref=f571e93] [cursor=pointer]:
              - /url: https://www.beneficialstatebank.com/impact/community
            - text: and
            - link "environmental" [ref=f571e94] [cursor=pointer]:
              - /url: https://www.beneficialstatebank.com/impact/environment
            - text: impact, and our commitments include no predatory lending, no investments (meaning lending) to the fossil fuel, private prison, or weapons manufacturing industries. Instead of working to maximize shareholder profits, we work to further social justice and equity, invest in environmental sustainability and regeneration, and strive to extend prosperity to all members of our communities.
          - paragraph [ref=f571e95]: "We operate with purpose and strive toward a lofty goal: building an economy that restores our planet and extends prosperity to everyone."
          - paragraph [ref=f571e96]:
            - strong [ref=f571e97]: Help us work toward a world where we bank with purpose.
        - generic [ref=f571e100]:
          - figure [ref=f571e102]:
            - img "A few Beneficial State Bank staff stand outside our Pearl Branch in Portland, OR." [ref=f571e103]
          - generic [ref=f571e105]:
            - heading "Why choose Beneficial State Bank" [level=2] [ref=f571e106]
            - paragraph [ref=f571e107]: Beneficial State Bank’s benefits include a comprehensive package designed to support you and your eligible dependents. We focus on the holistic health of our team members and promote work-life balance.
            - link "See Open Positions" [ref=f571e109] [cursor=pointer]:
