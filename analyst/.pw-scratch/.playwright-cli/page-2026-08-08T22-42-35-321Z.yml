              - term [ref=f441e122]:
                - heading "Definition" [level=2] [ref=f441e123]
              - definition [ref=f441e124]:
                - paragraph
                - paragraph [ref=f441e125]: Under direction, the function of this position is to provide quality AOD services to clients referred for assessment and treatment of alcohol and drug related problems. Every client requesting services at CPH will be provided a complete assessment by a counselor to determine the appropriate level of care. The purpose of this position is to assist clients in changing their lifestyle through the provision of individual, group counseling, education and case management services. Postion performs related duties as required.
                - generic [ref=f441e126]: "Starting Pay Range:"
                - text: $28.68 to $31.87 per hour
                - generic [ref=f441e127]: "Preferred Qualifications:"
                - list [ref=f441e128]:
                  - listitem [ref=f441e129]: Minimum of a bachelor’s degree in a related field.
                  - listitem [ref=f441e130]: Licensed as either a social worker (LSW), chemical dependency professional (LCDC), or a licensed professional counselor (LPC); preferred license is an LISW, LICDC, or LPCC.
                  - listitem [ref=f441e131]: Minimum of 1 year experience working in substance use/mental health, specific to assessment, individual and group counseling.
                - paragraph
              - term [ref=f441e132]:
                - heading "Examples of Work" [level=2] [ref=f441e133]
              - definition [ref=f441e134]:
                - paragraph
                - emphasis [ref=f441e136]: (Any one position may not include all of the duties listed, nor do the examples cover all of the duties that may be performed.)
                - paragraph [ref=f441e137]: Screens individuals using a biopsychosocial assessment to determine if a substance use disorder exists and for eligible admission to a particular program;
                - paragraph [ref=f441e138]
                - paragraph [ref=f441e139]: Provides the intake administrative procedures for admission to a substance use disorder treatment program and orientates clients to the nature and goals of the program, facility, program rules, costs, and client rights;
                - paragraph [ref=f441e140]
                - paragraph [ref=f441e141]: Assesses clients for substance use disorder and for other problems through the use of the psychosocial history, evaluation tools, collateral information, and breath and urine tests and recommends the appropriate levels of client care;
                - paragraph [ref=f441e142]
                - paragraph [ref=f441e143]: Engages clients in treatment planning to identify and rank problems needing resolution, establish immediate and long-term goals, and decide on the treatment processes and resources to be used;
                - paragraph [ref=f441e144]
                - paragraph [ref=f441e145]: Counsels clients through on-going individual and group treatment sessions using evidence-based interventions and other therapeutic methods that best serve the diverse needs of the clients;
                - paragraph [ref=f441e146]
                - paragraph [ref=f441e147]: Provides crisis intervention and de-escalation techniques with clients;
                - paragraph [ref=f441e148]
                - paragraph [ref=f441e149]: Coordinates case management activities that bring services, agencies, and resources together within a planned framework of action for the client;
                - paragraph [ref=f441e150]
                - paragraph [ref=f441e151]: Consults and corresponds with courts, attorneys, referral sources, agencies, family members, and others regarding client issues or general substance use disorder information;
                - paragraph [ref=f441e152]
                - paragraph [ref=f441e153]: Maintains a working referral relationship with a variety of community professionals and agencies to obtain collateral information;
                - paragraph [ref=f441e154]
                - paragraph [ref=f441e155]: Provides a referral to the Medication Assisted Treatment (MAT) program when the client requests this service and is deemed appropriate for MAT services;
                - paragraph [ref=f441e156]
                - paragraph [ref=f441e157]: Prepares and maintains clinical records according to program and certification standards; prepares reports as needed by courts and other referral sources and maintains statistical data;
                - paragraph [ref=f441e158]
                - paragraph [ref=f441e159]: Delivers substance use disorder related education services to individuals and groups;
                - paragraph [ref=f441e160]
                - paragraph [ref=f441e161]: May give legal testimony under court order;
                - paragraph [ref=f441e162]
                - paragraph [ref=f441e163]: May provide driver intervention, problem identification, outreach, environmental, and information dissemination services;
                - paragraph [ref=f441e164]
                - text: May be assigned to serve as a member of an Incident Command System (ICS) Team, or a similar public health response team, which may include the conduct of operations on a 24/7 basis at remote locations.
                - paragraph
              - term [ref=f441e165]:
                - heading "Minimum Qualifications" [level=2] [ref=f441e166]
              - definition [ref=f441e167]:
                - paragraph
                - paragraph [ref=f441e168]: Possession of valid State of Ohio certification by the Ohio Chemical Dependency Professionals Board as a Chemical Dependency Counselor Assistant Preliminary (CDCA PRE). (Certification as an Ohio Chemical Dependency Counselor Assistant must be obtained within thirteen (13) months.)
                - paragraph [ref=f441e169]
                - paragraph [ref=f441e170]: OR
                - paragraph [ref=f441e171]
                - paragraph [ref=f441e172]: Possession of valid State of Ohio licensure by the Ohio Chemical Dependency Professionals Board as a Chemical Dependency Counselor Assistant (CDCA), Licensed Chemical Dependency Counselor II (LCDC II), Licensed Chemical Dependency Counselor III (LCDC III), Licensed Independent Chemical Dependency Counselor (LICDC), or Licensed Independent Chemical Dependency Counselor-Clinical Supervisor (LICDC-CS).
                - paragraph [ref=f441e173]
                - paragraph [ref=f441e174]: OR
                - paragraph [ref=f441e175]
                - paragraph [ref=f441e176]: Possession of valid State of Ohio licensure by the Counselor, Social Worker, and Marriage & Family Therapist Board as a Licensed Professional Clinical Counselor (LPCC), Licensed Professional Counselor (LPC), Licensed Social Worker (LSW), Licensed Independent Social Worker (LISW), Marriage and Family Therapist (MFT), or Independent Marriage and Family Therapist (IMFT), AND one (1) year of licensed or internship experience providing substance use disorder counseling services.
                - paragraph [ref=f441e177]: OR
                - paragraph [ref=f441e178]
                - paragraph [ref=f441e179]: Possession of a valid State of Ohio licensure as a Registered Nurse, Certified Nurse Practitioner, Clinical Nurse Specialist Psychologist, or Physician AND one (1) year of licensed or internship experience providing substance use disorder counseling services.
                - paragraph
