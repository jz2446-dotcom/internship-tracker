          - paragraph [ref=f62e106]:
            - generic [ref=f62e108]:
              - generic [ref=f62e109]: Compensation
              - generic [ref=f62e112]: Interns will be paid a stipend of $3000.
              - generic [ref=f62e114]: Generous support for Ostrover Family Academic Year Interns is provided by Julie and Doug Ostrover.
              - text: If you believe that you could excel in this role, we encourage you to apply. We are dedicated to considering a broad array of candidates. Whether you’re new to arts and culture administration, returning to work after a gap in employment, simply looking to transition, or take the next step in your career path, we will be glad to have you on our radar. Please use your cover letter to tell us about your interest in the arts and culture space and what you hope to bring to this role.
              - generic [ref=f62e116]:
                - strong [ref=f62e117]:
                  - generic [ref=f62e118]: "About the Whitney:"
                - generic [ref=f62e119]: The Whitney Museum of American Art, founded in 1930 by the artist and philanthropist Gertrude Vanderbilt Whitney, houses the foremost collection of American art from the twentieth and twenty-first centuries. From her vision arose the Whitney Museum of American Art, which has been championing the most innovative art of the United States for 86 years. The core of the Whitney’s mission is to collect, preserve, interpret, and exhibit American art of our time and serve a wide variety of audiences in celebration of the complexity and diversity of art and culture in the United States. Through this mission and a steadfast commitment to artists themselves, the Whitney has long been a powerful force in support of modern and contemporary art and continues to help define what is innovative and influential in American art today.
                - strong [ref=f62e120]:
                  - generic [ref=f62e121]: "EEO Statement:"
              - text: The Whitney Museum of American Art is an Equal Opportunity Employer. The Museum does not discriminate because of age, sex, religion, race, color, creed, national origin, alienage or citizenship, disability, marital status, pregnancy, partnership status, caregiver status, veteran status, gender (including gender identity), sexual orientation, genetic information, predisposition, or carrier status, arrest or conviction record to the extent required by applicable law, credit history, domestic violence, sexual violence, or stalking victim status, or any other factor prohibited by law. The Museum hires and promotes individuals solely on the basis of their qualifications for the job to be filled. The Museum encourages all qualified candidates to apply for vacant positions at all levels.
