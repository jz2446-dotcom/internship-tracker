            - generic [ref=f62e21]:
              - text: The Whitney’s Academic Year Internship program offers a semester-long paid internship for undergraduate and graduate students currently enrolled in an accredited academic program. The program includes training, direct work experience, professional development, and a weekly speaker series. The Whitney’s Fall internship program is a full-time, paid, nine-week session. The internship is hybrid, with some onsite work. For Fall 2026, interns commit between 16–21 hours per week over 10–12 weeks for a total of 176 hours. The program will begin on September 15, 2026, and end on December 5, 2026 (this may vary depending on schedule). For more information, including information on eligibility requirements, please visit our
              - link "internships page" [ref=f62e22] [cursor=pointer]:
                - /url: https://whitney.org/about/internships
              - text: . The application window for our Fall 2026 Ostrover Family Academic Internship is now open through August 14. Please note that all candidates will be considered on a rolling basis, and as such, some opportunities may close before the deadline.
