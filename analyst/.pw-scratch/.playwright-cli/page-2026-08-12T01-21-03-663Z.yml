            - paragraph [ref=f314e150]: Online Application
            - paragraph [ref=f314e151]: "& Pre-Interview"
            - paragraph [ref=f314e152]: Assessment
          - paragraph [ref=f314e154]:
            - strong [ref=f314e155]: Enter basic details and upload your resume/CV. You'll receive a link to complete a pre-interview assessment where you record answers to questions based on the program you applied to. For those applying to Software Engineering and Analytics & Modeling functions, this includes a coding challenge. Applications will not be considered if the pre-interview assessment is not completed.
        - generic [ref=f314e156]:
          - generic [ref=f314e157]:
            - paragraph [ref=f314e158]:
              - img "White icon of people talking" [ref=f314e159]
            - paragraph [ref=f314e160]: Interviews
            - paragraph [ref=f314e161]
          - paragraph [ref=f314e163]:
            - strong [ref=f314e164]: Participate in interviews with representatives of the function(s) of interest. These conversations will be focused on the BlackRock Principles, your experience or your capabilities and may include a group exercise, presentation or case study. For software engineers, this may include problem-solving exercises or technical questions.
