      - heading "Our programs" [level=2] [ref=f314e81]
      - generic [ref=f314e83]:
        - generic [ref=f314e87]:
          - heading "Full-Time Analyst Program" [level=2] [ref=f314e88]
          - paragraph [ref=f314e89]: Join our two-year Analyst Program and do work that matters. You’ll learn by doing, collaborate globally and help millions achieve financial well-being – all with the support of mentors who invest in your growth.
          - paragraph [ref=f314e90]:
            - strong [ref=f314e91]: Eligibility
            - text: ": Undergraduate or master’s students graduating between September 2026 and July 2027"
          - paragraph [ref=f314e92]:
            - emphasis [ref=f314e93]: "Mexico City only: In addition to Spanish, English language fluency is required."
          - paragraph [ref=f314e94]:
            - link "Learn more and apply" [ref=f314e95] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/ottawa/2027-full-time-analyst-program-amrs/45831/97843197536
        - generic [ref=f314e99]:
          - heading "Summer Internship Program" [level=2] [ref=f314e100]
          - paragraph [ref=f314e101]: Our nine-week Summer Internship (from June to August) gives you a real taste of life at BlackRock. You’ll work with a team, join conversations with leaders and connect with mentors – all while building skills that shape your future.
          - paragraph [ref=f314e102]:
            - strong [ref=f314e103]: Eligibility
            - text: ": Undergraduate or master’s students graduating between September 2027 and July 2028"
          - paragraph [ref=f314e104]:
            - link "Learn more and apply" [ref=f314e105] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/new-york/2027-summer-internship-program-amers/45831/90628276544
          - paragraph [ref=f314e106]: Applications to Operations and Technology functions open in July 2026
        - generic [ref=f314e110]:
          - heading "MBA Internship Program" [level=2] [ref=f314e111]
          - paragraph [ref=f314e112]: Our nine-week MBA Internship, from June to August, puts you at the heart of BlackRock. You’ll work with a team, gain exposure across our businesses and connect with leaders who invest in your growth.
          - paragraph [ref=f314e113]:
            - strong [ref=f314e114]: Eligibility
            - text: ": MBA students graduating between September 2027 and July 2028 with at least two years of relevant pre-MBA work experience"
      - generic [ref=f314e116]:
        - generic [ref=f314e118]:
          - heading "Quantitative Master’s Internship Program" [level=2] [ref=f314e119]
          - paragraph [ref=f314e120]: This program mirrors the MBA Internship but is tailored for master’s students in quantitative disciplines – giving you the same exposure and impact, with a focus on advanced analytics and problem-solving.
          - paragraph [ref=f314e121]:
            - strong [ref=f314e122]: Eligibility
            - text: ": Students enrolled in analytics, computational finance, financial engineering, mathematics and/or a quantitative-disciplined master’s program and graduating between September 2027 and July 2028 with relevant pre-master’s work experience"
        - generic [ref=f314e124]:
          - heading "Mexico City Internship Program" [level=2] [ref=f314e125]
          - paragraph [ref=f314e126]: Our Mexico City Internship is a 7- to 12-month experience starting in June 2027 that immerses you in life at BlackRock. You’ll take on real responsibilities, build skills and connect through professional development, networking and social events – all designed to help you grow and make an impact.
          - paragraph [ref=f314e127]:
            - strong [ref=f314e128]: Eligibility
            - text: ": Undergraduate students attending university in Mexico, graduating between September 2027 and July 2028. In addition to Spanish, English language fluency is required."
          - paragraph [ref=f314e129]:
            - link "Learn more and apply" [ref=f314e130] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/mexico-city/2027-mexico-city-internship-program/45831/97843197600
      - generic [ref=f314e133]:
        - heading "Events" [level=2] [ref=f314e135]
        - generic [ref=f314e136]:
          - heading "Future of Asset Management Virtual Series" [level=2] [ref=f314e137]
          - paragraph [ref=f314e138]: Investing is changing – and asset management is changing with it. Join the Future of Asset Management Virtual Series for live, interactive sessions with BlackRock professionals that unpack what’s shifting across technology, data, risk management and new market structures – then explore the lineup to see where you fit.
          - paragraph [ref=f314e139]:
            - link "Explore the sessions" [ref=f314e140] [cursor=pointer]:
              - /url: https://careers.blackrock.com/students-and-graduates-future-of-asset-management-series
