          - heading "BlackRock Founders Scholarship" [level=2] [ref=f314e170]
          - paragraph [ref=f314e171]: The BlackRock Founders Scholarship is a merit award of $20,000 associated with our Summer Internship Program in the U.S. It is for students who have demonstrated leadership while exemplifying the BlackRock Principles in their communities.
          - paragraph [ref=f314e172]:
            - strong [ref=f314e173]: Eligibility
            - text: ": All 2027 Summer Interns are eligible to apply."
      - generic [ref=f314e177]:
        - 'heading "BlackRock for Universities: Shaping the future of fintech and investments" [level=2] [ref=f314e178]'
        - paragraph [ref=f314e179]: BlackRock for Universities is a unique educational initiative designed to teach the principles of portfolio construction to the next generation of fintech and investment professionals. Currently implemented in over 20 colleges and universities across the U.S. and Canada (and growing!), this program partners with students involved in student-managed investment funds – bringing them unique access to our Aladdin technology paired with courses led by our own investment experts.
        - paragraph [ref=f314e180]:
          - link "Learn more about BlackRock for Universities" [ref=f314e181] [cursor=pointer]:
            - /url: https://careers.blackrock.com/en/blackrock-for-universities
