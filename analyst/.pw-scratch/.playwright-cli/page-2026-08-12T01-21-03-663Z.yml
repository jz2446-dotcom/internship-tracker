      - generic [ref=f314e50]:
        - heading "Your move." [level=2] [ref=f314e51]
        - paragraph [ref=f314e52]: "This is your opportunity to join a global team that sees the world diﬀerently. Where curious minds come together to take on some of the greatest, most complex challenges in global markets. We’re driven by a simple belief: that there’s a better ﬁnancial system out there – one where markets are a force for good, and investing can work for everyone."
        - paragraph [ref=f314e53]: From day one, you’ll do work that matters. You’ll ﬁnd your place here, and contribute to impactful work that makes a real diﬀerence across the world. We know the decisions we make today shape the impact we have tomorrow. That’s why we’re relentless about innovation and ﬁnding smarter ways of doing things.
        - paragraph [ref=f314e54]: We’re building a team of people who aren’t afraid to think diﬀerently. Who see the whole picture. And know that high performance isn’t possible without support. You’ll be surrounded by leaders and colleagues who are both inspired by your potential and invested in your growth.
        - paragraph [ref=f314e55]: In turn, you’ll be focused on helping our clients achieve their goals, at scale. Because while individuals make changes, it’s together that we create real change.
        - paragraph [ref=f314e56]:
          - strong [ref=f314e57]: Are you ready to move forward?
