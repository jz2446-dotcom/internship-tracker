        - generic [ref=f462e462]:
          - separator [ref=f462e463]
          - paragraph [ref=f462e464]:
            - strong [ref=f462e465]: Find your future at Jefferies
          - paragraph [ref=f462e466]: Our student and graduate employees are a foundation of our success and are heavily involved in the day-to-day workflow at Jefferies.
        - heading "What you can expect" [level=2] [ref=f462e467]
        - list [ref=f462e468]:
          - listitem [ref=f462e469]: Each of our employee-partners can expect a hands-on approach to their development, with an opportunity to solve challenging and complex tasks alongside some of the best and brightest minds in the industry.
          - listitem [ref=f462e470]: Jefferies offers a wide range of opportunities for undergraduate and graduate students to gain experience in our Investment Banking, Fixed Income, Equities, Research, Wealth Management and Corporate divisions.
          - listitem [ref=f462e471]: If you enjoy working in an entrepreneurial environment where creativity and performance is rewarded, then we invite you to explore opportunities with Jefferies and learn more about our winning team.
        - generic [ref=f462e472]:
          - heading "Summer internships for Analysts & Associates" [level=2] [ref=f462e473]
          - paragraph [ref=f462e474]:
            - text: Our
            - strong [ref=f462e475]: Analyst and Associate Summer Interns
            - text: participate in a 10-week summer program designed for students interested in pursuing a career in finance. Through training, seminars, social events and mentoring programs, our interns gain valuable industry experience as well as a unique look into our core businesses.
          - heading "Summer program highlights" [level=3] [ref=f462e476]
          - paragraph [ref=f462e477]: Following an enriching orientation and training program, interns work on their day-to-day responsibilities with support from colleagues serving as both instructors and mentors. You’ll engage with senior leaders, meet industry experts and participate in educational and social events with colleagues. We strongly encourage all our interns to make connections and grow their professional network. To help maximize your experience, interns receive formal performance reviews.
          - paragraph [ref=f462e478]: "While each experience differs by division, you can expect:"
          - list [ref=f462e479]:
            - listitem [ref=f462e480]: Experience and exposure across a variety of groups and individuals
            - listitem [ref=f462e481]: Mentoring from senior professionals
            - listitem [ref=f462e482]: Deep understanding of market data and technical skills across a range of products
            - listitem [ref=f462e483]: Case study analysis and formal presentation training
            - listitem [ref=f462e484]: Consideration for a full-time offer based on demonstrated performance and potential
          - heading "What we look for in candidates" [level=3] [ref=f462e485]
          - paragraph [ref=f462e486]: We look for energetic and enthusiastic individuals with a strong academic background, an interest in pursuing a career in finance and the ability to work independently and in teams. We hire summer interns who have studied a variety of disciplines including finance, accounting, economics, computer science, engineering, applied mathematics and liberal arts.
          - list [ref=f462e487]:
            - listitem [ref=f462e488]: Successful interns can multitask and manage a variety of projects in a dynamic, team-oriented environment.
            - listitem [ref=f462e489]: Candidates must demonstrate the highest levels of professionalism, along with strong analytical skills and attention to detail.
        - generic [ref=f462e490]:
          - heading "Full-time Analyst & Associate program" [level=2] [ref=f462e491]
          - paragraph [ref=f462e492]:
            - text: Our
            - strong [ref=f462e493]: Analyst and Associate Program
            - text: provides a valuable, global platform for undergraduate, Masters and MBA students to develop skills and apply them in real-world situations. The program begins with comprehensive formal training, offering a unique opportunity to gain experience across an array of products and industries.
          - heading "Full-time program highlights" [level=3] [ref=f462e494]
          - list [ref=f462e495]:
            - listitem [ref=f462e496]: You’ll learn corporate valuation methodologies, accounting and financial modeling, as well as the importance of relationship building through interaction with Jefferies’ clients and senior leaders.
            - listitem [ref=f462e497]: Afterwards, you’ll apply your learnings through formal case study presentations and preparation for your regulatory exams (specific to Investment Banking, Equities and Fixed Income).
            - listitem [ref=f462e498]: You’ll experience how businesses operate on a global scale and work on providing innovative solutions and thoughtful advice to our clients.
          - heading "What we look for in candidates" [level=3] [ref=f462e499]
          - paragraph [ref=f462e500]: "You should have a strong academic background: a four-year Bachelor’s degree (Analyst), or a two-year Master’s and or MBA degree (Associate), or equivalent. We hire graduates who have studied a variety of disciplines including finance, accounting, economics, computer science, engineering, applied mathematics, data science, and liberal arts. Additionally, you should be able to:"
          - list [ref=f462e501]:
            - listitem [ref=f462e502]: Demonstrate the highest level of professionalism, ethics and client management skills.
            - listitem [ref=f462e503]: Manage multiple projects simultaneously, under pressure and with adherence to tight deadlines.
            - listitem [ref=f462e504]: Possess strong technical, written and verbal communication skills.
            - listitem [ref=f462e505]: Work independently and as a member of a team.
          - paragraph [ref=f462e506]:
            - emphasis [ref=f462e507]: We encourage you to apply to summer intern and entry-level opportunities roles for which you may be eligible.
