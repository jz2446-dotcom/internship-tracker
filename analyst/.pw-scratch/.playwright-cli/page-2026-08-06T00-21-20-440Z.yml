        - paragraph [ref=f99e299]: "Employees at every level are empowered to take ownership, contribute and make a lasting impact. Talented, highly motivated individuals who value a collaborate and innovative culture have the opportunity to make a meaningful impact for our clients by demonstrating the below qualities:"
        - list [ref=f99e300]:
          - listitem [ref=f99e301]:
            - strong [ref=f99e302]: "Client Relationship Skills:"
            - text: The judgment, poise, and preparedness to thoughtfully engage with clients and internal and external stakeholders.
          - listitem [ref=f99e303]:
            - strong [ref=f99e304]: "Collaboration:"
            - text: The ability to work effectively across teams, building strong relationships and contributing to shared goals with both colleagues and clients.
          - listitem [ref=f99e305]:
            - strong [ref=f99e306]: "Drive to Succeed:"
            - text: Ambition matched by focus, motivation, and commitment to excellence.
          - listitem [ref=f99e307]:
            - strong [ref=f99e308]: "Resilience:"
            - text: Adaptability and determination to excel in a fast-paced environment.
          - listitem [ref=f99e309]:
            - strong [ref=f99e310]: "Intellectual Curiosity:"
            - text: A passion for continued learning, complex problem solving, and innovative solutions that result in long term success for our clients and team.
          - listitem [ref=f99e311]:
            - strong [ref=f99e312]: "Analytical Thinking:"
            - text: Strong problem-solving skills, attention to detail, and the ability to think critically under pressure.
