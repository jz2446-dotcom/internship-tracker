        - generic [ref=f392e40]:
          - generic [ref=f392e41]: Job Type
          - generic [ref=f392e42]: Part-time
        - generic [ref=f392e43]: Description
        - generic [ref=f392e44]:
          - paragraph [ref=f392e45]:
            - strong [ref=f392e46]: Basic Information
          - list [ref=f392e47]:
            - listitem [ref=f392e48]: Work on as-needed basis throughout the Library system to fill in for regularly scheduled employees.
            - listitem [ref=f392e49]: Reports to the Administrative and Substitute Coordinator and works under the direction of supervising staff at assigned locations.
            - listitem [ref=f392e50]: Schedule variable with a maximum of 29 hours per week. The successful candidates will have the opportunity to provide schedule parameters.
            - listitem [ref=f392e51]: $17.07 per hour.
            - listitem [ref=f392e52]: Position open until 4:30 pm (Central Time) on August 9, 2026.
            - listitem [ref=f392e53]: Selected candidates must attend the mandatory trainings on September 16, 17, and 18 (Wednesday, Thursday, and Friday).
          - paragraph [ref=f392e54]
          - paragraph [ref=f392e55]:
            - strong [ref=f392e56]: Job Duties (Essential Functions)
          - list [ref=f392e57]:
            - listitem [ref=f392e58]: "Provides basic circulation and registration services to assure patrons ready access to library materials: Checks materials in and out; issues library cards; collects fines and charges; updates customer records in the computer; verbally explains circulation policies and procedures; makes other computer inquiries; and processes patron requests for reserve items."
            - listitem [ref=f392e59]: "Provides excellent customer service (in person and over the phone): assist patrons with the use of library databases, computer equipment, and software; process patrons' request materials; provides patrons with reader's advisory assistance; and if unable to assist with the request, directs call to the appropriate staff person."
            - listitem [ref=f392e60]: Maintains effective courteous working relationships with all library patrons and staff.
            - listitem [ref=f392e61]: Uses decision making skills to improve the patron experience.
            - listitem [ref=f392e62]: Lifts and routes materials, which may weigh up to 10 pounds from book bins and shelves.
            - listitem [ref=f392e63]: May on occasion be offered special assignments with different duties.
            - listitem [ref=f392e64]: If in possession of a Class E Driver's license, may drive bookmobile or other outreach vehicles.
            - listitem [ref=f392e65]: Performs other related work and undertakes special projects as assigned.
        - generic [ref=f392e66]: Requirements
        - generic [ref=f392e67]:
          - list [ref=f392e68]:
            - listitem [ref=f392e69]: Demonstrated ability to meet and serve the public, working effectively with customers of all ages.
            - listitem [ref=f392e70]: Demonstrated ability to be a team player.
            - listitem [ref=f392e71]: Demonstrated ability to learn library operations, services and policies, including computer procedures; willingness to learn and keep current with emerging technologies.
            - listitem [ref=f392e72]: Demonstrated ability to use decision making skills to improve the patron experience.
            - listitem [ref=f392e73]: Demonstrated ability to organize daily work routines for location effectively.
            - listitem [ref=f392e74]: Demonstrated ability to follow oral and/or written instructions.
            - listitem [ref=f392e75]: Must be able to work at the counter used for patron interactions.
            - listitem [ref=f392e76]: Must be able to access materials from shelves which may be overhead or those which may be below the waist level.
            - listitem [ref=f392e77]: Many duties performed while standing and bending; ability to lift up to 10 lbs.
            - listitem [ref=f392e78]: Ability to understand and be understood in English is required. Additional consideration will be given to individuals that are proficient in any non-English languages utilized in Jackson County, MO, including Spanish, American Sign Language, Vietnamese, French, Arabic, and Swahili.
          - paragraph [ref=f392e79]:
            - strong [ref=f392e80]: Required Education and Experience
          - list [ref=f392e81]:
            - listitem [ref=f392e82]: High school diploma or G.E.D. This requirement may also be met by a combination of education, work experience, and life experience.
            - listitem [ref=f392e83]: Possession of a Class E driver's license is not required for most shifts, only required for driving outreach vehicles.
          - paragraph [ref=f392e84]:
            - strong [ref=f392e85]: Work Environment
          - paragraph [ref=f392e86]:
            - text: Work is performed at a
            - link "Library location" [ref=f392e87] [cursor=pointer]:
              - /url: https://kclibrary.org/locations
            - text: . Workspace is shared with coworkers and patrons from a diverse socio-economic community.
          - paragraph [ref=f392e88]
          - paragraph [ref=f392e89]:
            - strong [ref=f392e90]: Other Duties
          - paragraph [ref=f392e91]: Please note this job description is not designed to cover or contain a comprehensive listing of activities, duties or responsibilities that are required of the employee for this job. Duties, responsibilities, and activities may change at any time with or without notice.
          - paragraph [ref=f392e92]
          - paragraph [ref=f392e93]:
            - emphasis [ref=f392e94]: The employee must be able to perform the essential functions and job requirements of the position satisfactorily. If requested, reasonable accommodations may be made to enable employees with disabilities to perform the essential functions of the job, absent undue hardship.
          - paragraph [ref=f392e95]
          - paragraph [ref=f392e96]:
            - strong [ref=f392e97]: How to Apply
          - paragraph [ref=f392e98]:
            - text: Please apply for this position through our web application system. We only accept applications for specific currently open positions made through our online system. Access the online application from the job listing on the
            - link "Job Opportunities page" [ref=f392e99] [cursor=pointer]:
              - /url: https://recruiting.paylocity.com/Recruiting/Jobs/All/a45c252a-e08e-4f47-8138-cd684ec9a0dd
            - text: . The
          - paragraph [ref=f392e100]: application system allows you to attach a document (such as a cover letter or a resume) to your application (10MB limit per document). When you submit your application, an acknowledgement will be sent to the email address you provided. You are welcome to apply for as many positions as you wish. However, to minimize problems, close and restart your browser between each application.
          - paragraph [ref=f392e101]
          - paragraph [ref=f392e102]: All online Application for Employment forms must be completely filled out. For technical assistance, call 816.701.3712.
          - paragraph [ref=f392e103]
          - paragraph [ref=f392e104]: Kansas City Public Library is an equal opportunity employer and is committed to creating an inclusive environment for all employees.
