          - heading "Dev Degree Program" [level=3] [ref=f1595e20]
          - paragraph [ref=f1595e21]: A 3-4-year program that allows people to earn a computer science degree while working. It’s designed for those looking to break into computer science or transition into the tech field.
          - link "Learn more about our Dev Degree Program" [ref=f1595e24] [cursor=pointer]:
            - /url: https://devdegree.ca/
        - generic [ref=f1595e25]:
          - heading "Internship Program" [level=3] [ref=f1595e26]
          - paragraph [ref=f1595e27]: Shopify offers 4-month paid Engineering internships that are open to students, recent graduates, and those early in their careers.
          - link "Learn more about our Internship Program" [ref=f1595e30] [cursor=pointer]:
            - /url: https://internships.shopify.com/
        - generic [ref=f1595e31]:
          - heading "APM Program" [level=3] [ref=f1595e32]
          - paragraph [ref=f1595e33]: Shopify’s 12-month Apprentice Product Manager program is designed to help you gain the skills needed to start a product management career.
          - link "Learn more about our APM Program" [ref=f1595e36] [cursor=pointer]:
            - /url: https://apm.shopify.com
        - generic [ref=f1595e37]:
          - heading "Design Apprentice Program" [level=3] [ref=f1595e38]
          - paragraph [ref=f1595e39]: Shopify's 6-month Design Apprentice Program pairs early-career designers with senior mentors through two rotations. Built for new graduates, career switchers, and those early in their design careers.
          - link "Learn more about our Design Apprentice Program" [ref=f1595e42] [cursor=pointer]:
            - /url: https://shopify.design/dap
