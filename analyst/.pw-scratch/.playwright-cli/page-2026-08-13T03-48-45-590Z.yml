  - main [ref=f195e46]:
    - generic [ref=f195e48]:
      - generic [ref=f195e50]:
        - img "Hero Image" [ref=f195e52]
        - heading "Higher Education Institutions" [level=1] [ref=f195e55]
      - paragraph [ref=f195e60]: Louisville is home to a diverse range of colleges and universities, offering everything from world-class research programs to hands-on technical training. Whether you’re pursuing a four-year degree, exploring the arts, or gaining in-demand career skills, you’ll find an educational path that fits your goals.
      - generic [ref=f195e67]:
        - generic [ref=f195e70]:
          - heading "ATA College" [level=2] [ref=f195e71]
          - paragraph [ref=f195e73]: Provides quality instruction, training, and career placement in the allied health fields, offering hands-on instruction that prepares students with real-world skills.
          - button "Learn More" [ref=f195e75] [cursor=pointer]
        - generic [ref=f195e78]:
          - heading "Bellarmine University" [level=2] [ref=f195e79]
          - paragraph [ref=f195e81]: A dynamic, growing university with a strong liberal arts focus in the Catholic higher education tradition, offering undergraduate and graduate programs.
          - button "Learn More" [ref=f195e83] [cursor=pointer]
        - generic [ref=f195e86]:
          - heading "Boyce College" [level=2] [ref=f195e87]
          - paragraph [ref=f195e89]: A confessional Christian college offering undergraduate programs with a focus on theological education and ministry preparation.
          - button "Learn More" [ref=f195e91] [cursor=pointer]
        - generic [ref=f195e94]:
          - heading "Campbellsville University (Louisville)" [level=2] [ref=f195e95]
          - paragraph [ref=f195e97]: A comprehensive, Christian institution offering non-credit technical programs, certificates, associate, undergraduate, and graduate programs.
          - button "Learn More" [ref=f195e99] [cursor=pointer]
        - generic [ref=f195e102]:
          - heading "Caris College" [level=2] [ref=f195e103]
          - paragraph [ref=f195e105]: Caris College has a mission to provide their students with a solid foundation in their area of study. Whether it’s a career as a medical assistant, dental assistant, veterinary assistant, acute clinical technician, or medical sonographer/ultrasound technician, Caris College strives to give students a well-balanced curriculum in the classroom, and, when appropriate, include laboratory training and supervised clinical experience. Caris College aims to produce superior graduates with the knowledge and confidence necessary to succeed both professionally and financially. Their goal is to make Caris College the preferred source of medical career education in the community for our respective fields of study.
          - button "Learn More" [ref=f195e107] [cursor=pointer]
        - generic [ref=f195e110]:
          - heading "Elizabethtown Community & Technical College" [level=2] [ref=f195e111]
          - paragraph [ref=f195e113]: Provides certificates, diplomas, and associate degrees in over 30 programs, with small class sizes and dedicated faculty.
          - button "Learn More" [ref=f195e115] [cursor=pointer]
        - generic [ref=f195e118]:
          - heading "Galen College of Nursing" [level=2] [ref=f195e119]
          - paragraph [ref=f195e121]: Galen College of Nursing has programs to cater to those new to nursing or looking to advance their nursing career. Galen College of Nursing’s campus in Louisville, KY offers PN, LPN Bridge, ADN, BSN, and MSN degree programs to meet your highest standards – from experienced faculty to hands-on learning to student support. Our regionally accredited nursing school prepares new nurses to sit for the NCLEX-RN® and NCLEX-PN® licensure exams.
          - button "Learn More" [ref=f195e123] [cursor=pointer]
        - generic [ref=f195e126]:
          - heading "Indiana University Southeast" [level=2] [ref=f195e127]
          - paragraph [ref=f195e129]: Indiana University Southeast, a regional campus of Indiana University, is a four-year, public, comprehensive university located in New Albany, IN, just across the Ohio River from Louisville, KY. Founded in 1941, it provides high-quality educational programs and services that promote student learning and prepare students for productive citizenship in a diverse society, and that contribute to the intellectual, cultural, and economic development of our region. The campus is home to a diverse and eclectic student community. Besides our core of traditional students who arrive as freshmen straight out of high school or homeschool, nontraditional students such as adult learners and veterans also play a prominent role in shaping campus life. Student involvement is high, with over 100 student groups and organizations.
          - button "Learn More" [ref=f195e131] [cursor=pointer]
        - generic [ref=f195e134]:
          - heading "Indiana Wesleyan University" [level=2] [ref=f195e135]
          - paragraph [ref=f195e137]: Accredited by The Higher Learning Commission, offering a wide range of programs for adults seeking associate’s, bachelor’s, or master’s degrees.
          - button "Learn More" [ref=f195e139] [cursor=pointer]
        - generic [ref=f195e142]:
          - heading "Ivy Tech Community College" [level=2] [ref=f195e143]
          - paragraph [ref=f195e145]: Offers associate degrees, short-term certificates, and workforce certifications in fields where workers are needed most, with classes in over 75 communities in Indiana.
          - button "Learn More" [ref=f195e147] [cursor=pointer]
        - generic [ref=f195e150]:
          - heading "Jefferson Community & Technical College" [level=2] [ref=f195e151]
          - paragraph [ref=f195e153]: Offers associate degrees, diplomas, and certificates in various fields, with transfer agreements to many four-year institutions.
          - button "Learn More" [ref=f195e155] [cursor=pointer]
        - generic [ref=f195e158]:
          - heading "Kentucky School of Phlebotomy" [level=2] [ref=f195e159]
          - paragraph [ref=f195e161]: Kentucky School of Phlebotomy is a dynamic educational institution focused on community education and specializing in training for phlebotomy and related health careers. We are committed to teaching the essential fundamentals for starting a career in healthcare. Students gain valuable experience in both hands on skills and understanding the theories essential to practice. Our primary goal is to share our experiences in the field of medicine to produce students whose skills are exceptional and whose understanding of safety is superior. Our school consists of experienced professionals who provide students with the personal attention they need to succeed.
          - button "Learn More" [ref=f195e163] [cursor=pointer]
        - generic [ref=f195e166]:
          - heading "Knight School of Welding" [level=2] [ref=f195e167]
          - paragraph [ref=f195e169]: Knight School of Welding offers a variety of welding certification classes and completes small welding jobs in the Louisville, KY area. You’ll get hands-on experience with our MIG, STICK, TIG, and pipe welding training programs. We have classes during the day and at night for your convenience, and we charge less than other welding schools. We also support you after your classes and certification with our lifetime employment assistance. We can help you with your employment search, your resume, and preparations for employer welding tests.
          - button "Learn More" [ref=f195e171] [cursor=pointer]
        - generic [ref=f195e174]:
          - heading "KyCAD" [level=2] [ref=f195e175]
          - paragraph [ref=f195e177]: KyCAD is Kentucky’s only independent college of art and design—an accredited, private nonprofit offering an intensive, interdisciplinary program focused on research, practice, and the role of the artist. Based in historic Old Louisville, KyCAD is driven by passionate faculty, staff, and trustees committed to academic excellence, student success, and community engagement.
          - button "Learn More" [ref=f195e179] [cursor=pointer]
        - generic [ref=f195e182]:
          - heading "Louisville Bible College" [level=2] [ref=f195e183]
          - paragraph [ref=f195e185]: A private, co-educational college that educates preachers and other Christian leaders, authorized to grant degrees in the Commonwealth of Kentucky.
          - button "Learn More" [ref=f195e187] [cursor=pointer]
        - generic [ref=f195e190]:
          - heading "Louisville Presbyterian Theological Seminary" [level=2] [ref=f195e191]
          - paragraph [ref=f195e193]: Louisville Seminary will provide students with an outstanding theological and practical education that prepares them for service in a pluralistic society with a focus on retaining excellent faculty who form students in their personal, professional, and spiritual lives, and support faculty and students in creative and rigorous scholarship opportunities, through grant writing, sabbaticals, and any other means of support. Louisville Seminary will encourage those faculty who are called to research to do that work well. This institution celebrates, publicizes, and supports the research, writing, and scholarship of members of the Louisville Seminary community.
          - button "Learn More" [ref=f195e195] [cursor=pointer]
        - generic [ref=f195e198]:
          - heading "Metropolitan College" [level=2] [ref=f195e199]
          - paragraph [ref=f195e201]: Metropolitan College is a Kentucky partnership between UPS, The University of Louisville and Jefferson Community and Technical College. Participating students get their full-time undergraduate tuition paid to The University of Louisville or Jefferson Community & Technical College as well as fee payment money, bonuses, and other benefits.
          - button "Learn More" [ref=f195e203] [cursor=pointer]
        - generic [ref=f195e206]:
          - heading "Mid-America College of Funeral Service" [level=2] [ref=f195e207]
          - paragraph [ref=f195e209]: Offers contemporary education for those pursuing a career in funeral service, with a foundation rooted in a century of tradition.
          - button "Learn More" [ref=f195e211] [cursor=pointer]
        - generic [ref=f195e214]:
          - heading "Northwood University (Louisville)" [level=2] [ref=f195e215]
          - paragraph [ref=f195e217]: Prepares students with real-world practice and values that guide lifelong learning and success, with a focus on business education.
          - button "Learn More" [ref=f195e219] [cursor=pointer]
        - generic [ref=f195e222]:
          - heading "Prosser Career Education Center" [level=2] [ref=f195e223]
          - paragraph [ref=f195e225]: Prosser Career Education Center is committed to providing multiple work-based learning experiences and programs to all students. Prosser offers 26 different exciting Career and Technical programs with work-based learning activities. These programs allow students to collaboratively engage with local employers and Prosser instructors for structured learning experiences. These experiences allow students to apply knowledge and skills learned in the classroom and lab to real-world situations. All work-based learning experiences and activities are strategically integrated within the CTE curriculum. Some of this valuable learning will occur within the classroom environment while much of it will occur in a place of business or community organization.
          - button "Learn More" [ref=f195e227] [cursor=pointer]
        - generic [ref=f195e230]:
          - heading "Purdue University Polytechnic Institute" [level=2] [ref=f195e231]
          - paragraph [ref=f195e233]: The Purdue University Polytechnic Institute New Albany is a part of the world-class Purdue Polytechnic Institute at Purdue University. This institution has a variety of degree and class offerings that will allow you to extend your higher education right here in the Greater Louisville area.
          - button "Learn More" [ref=f195e235] [cursor=pointer]
        - generic [ref=f195e238]:
          - heading "Right Choice Health Care Training Institute" [level=2] [ref=f195e239]
          - paragraph [ref=f195e241]: RightChoice has dedicated teachers with a desire to help train the next generation of nurse aides and nurses. We offer small clinical class sizes (8 students) to allow for more personal, individualized attention. RightChoice Healthcare Training Institute offers online coursework and provides the clinical/practical training in a simulated clinical setting at their facility on Hurstbourne Pkwy. The training center is also open and available by appointment on non-class days for students to watch videos and practice skills.
          - button "Learn More" [ref=f195e243] [cursor=pointer]
        - generic [ref=f195e246]:
          - heading "Simmons College of Kentucky" [level=2] [ref=f195e247]
          - paragraph [ref=f195e249]: A historically Black college committed to providing a Christian-based education, focusing on social justice and community service.
          - button "Learn More" [ref=f195e251] [cursor=pointer]
        - generic [ref=f195e254]:
          - heading "The Southern Baptist Theological Seminary" [level=2] [ref=f195e255]
          - paragraph [ref=f195e257]: The Southern Baptist Theological Seminary is comprised of three separate schools — two premier graduate schools and an undergraduate college. It is a private, not-for-profit institution accredited by the Southern Association of Colleges and Schools Commission on Colleges and by the Commission on Accrediting of the Association of Theological Schools in the United States and Canada. This institution offers a number of different degree programs and concentrations so that students can prepare for the ministry.
          - button "Learn More" [ref=f195e259] [cursor=pointer]
        - generic [ref=f195e262]:
          - heading "Spalding University" [level=2] [ref=f195e263]
          - paragraph [ref=f195e265]: A private university offering a range of undergraduate and graduate programs, emphasizing a commitment to compassion and service.
          - button "Learn More" [ref=f195e267] [cursor=pointer]
        - generic [ref=f195e270]:
          - heading "Sullivan University" [level=2] [ref=f195e271]
          - paragraph [ref=f195e273]: A private institution providing career-focused programs in various fields, including business, technology, and health sciences.
          - button "Learn More" [ref=f195e275] [cursor=pointer]
        - generic [ref=f195e278]:
          - heading "University of Louisville" [level=2] [ref=f195e279]
          - paragraph [ref=f195e281]: A state-supported research university located in Kentucky’s largest metropolitan area, offering a wide range of undergraduate, graduate, and professional programs.
          - button "Learn More" [ref=f195e283] [cursor=pointer]
        - generic [ref=f195e286]:
          - heading "Webster University, Louisville Campus" [level=2] [ref=f195e287]
          - paragraph [ref=f195e289]: Webster University helps you take your career to the next level with 60+ undergraduate, graduate, and certificate programs! We know our students need flexibility when it comes to the classroom, which is why we offer our programs online or in-person. That means you can take our courses on your schedule so you can balance school with work and life. We offer four-year degrees, accelerated master’s degrees, doctoral programs, certificates, and professional development series — all with more than 160 program offerings and a variety of flexible study options.
          - button "Learn More" [ref=f195e291] [cursor=pointer]
        - generic [ref=f195e294]:
          - heading "Western Kentucky University (Elizabethown)" [level=2] [ref=f195e295]
          - paragraph [ref=f195e297]: A student-centered, applied research university dedicated to helping students achieve their goals and graduate with skills for success.
          - button "Learn More" [ref=f195e299] [cursor=pointer]
