              - heading "We’re Seeking the Best" [level=2] [ref=f45e97]
              - paragraph [ref=f45e98]: NewMark Merrill is looking for ambitious individuals to bring their passion, expertise and talents to daily endeavors within our organization. We promote a welcoming team-oriented environment where we lead with innovation, address challenges head-on, encourage out-of-the-box thinking and celebrate our successes.
            - generic [ref=f45e99]:
