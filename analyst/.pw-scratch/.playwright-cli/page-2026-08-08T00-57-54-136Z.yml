          - generic [ref=f45e102]:
            - generic [ref=f45e103]:
              - heading [level=3] [ref=f45e104]:
                - emphasis [ref=f45e105]: Why NewMark Merrill
              - paragraph [ref=f45e106]: Whether you’re just getting started or are a seasoned professional, NewMark Merrill offers unique opportunities to learn, grow and contribute to an ever-evolving, growing and industry-leading company. Starters will benefit from daily doses of new experiences in a 40-year old established company that has the heart of a grass-roots entrepreneur. Pros will find themselves immersed in and leading hands-on innovative projects that hone talents, challenge critical thinking and make a difference in the communities we serve.
              - paragraph [ref=f45e107]: As an equal opportunity employer, NewMark Merrill is committed to extending opportunities to the most qualified applicants on an equal basis regardless of age, race, gender, sexual orientation, religion, national origin, disability, or any other non-merit factor.
