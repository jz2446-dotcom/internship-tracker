                - heading "Marketing Director - Oceanside" [level=3]
                - generic:
                  - generic:
                    - generic:
                      - paragraph: At NewMark Merrill Companies, our Marketing Director leads strategy and performance across an assigned portfolio of properties, driving traffic, tenant sales, and asset value through integrated, data-informed marketing initiatives. This role partners closely with leasing, operations, and executive leadership to position properties competitively, strengthen community engagement, and enhance brand perception.
                      - paragraph: The Marketing Director is accountable for delivering measurable results and serves as a key advisor in translating insights into actions that improve both property and tenant performance. If you are an experienced marketing professional looking for a position that will allow you to lead and grow in a fast-paced environment within a company with a great culture, this position may be for you!
