      - paragraph [ref=f493e58]: Work with Veris
      - generic [ref=f493e67]:
        - generic [ref=f493e71]:
          - heading "Why Veris?" [level=3] [ref=f493e74]
          - list [ref=f493e77]:
            - listitem [ref=f493e78]: Competitive pay, health care, and retirement benefits
            - listitem [ref=f493e79]: A unique, diverse, inclusive work environment
