        - generic [ref=f493e92]:
          - heading "Join The Team" [level=4] [ref=f493e93]
          - paragraph [ref=f493e94]: At Veris, we aim to help our clients achieve their financial objectives while seeking to build a more just, equitable, and sustainable world.
          - paragraph [ref=f493e95]: Our team of seasoned investment advisors, analysts, and client service professionals are dedicated to helping meet our clients’ needs with integrity and exemplary service.
          - paragraph [ref=f493e96]: Our current job openings are listed below.
      - generic [ref=f493e103]:
        - generic [ref=f493e109]:
          - heading "Current Opportunities" [level=2] [ref=f493e112]
          - generic [ref=f493e114]:
            - heading [level=2] [ref=f493e115]:
              - strong [ref=f493e116]: "Position: Senior Associate, Sales"
            - 'heading "Location: New York, NY" [level=5] [ref=f493e117]'
            - heading "The Opportunity:" [level=5] [ref=f493e118]
            - paragraph [ref=f493e119]: Veris is seeking a Senior Associate, Sales to join our New York team. This is a meaningful role for a relationship oriented wealth management professional who brings organizational strength and technological curiosity, is energized by complex planning and sales work, thrives in collaborative, fast paced environments, and wants their career to contribute to something larger than returns. This position will play a key role in both supporting and shaping our growth strategy as it evolves beyond traditional support functions, with clear opportunities to take on greater ownership of sales and business development over time.
            - heading [level=5] [ref=f493e120]:
              - strong [ref=f493e121]: "What You’ll Do:"
            - list [ref=f493e122]:
              - listitem [ref=f493e123]: Collaborate with the Managing Director in executing the firm’s sales and business development strategy.
              - listitem [ref=f493e124]: Take ownership of strategic growth initiatives, sales pipeline activity, and business development priorities across the organization.
              - listitem [ref=f493e125]: Support business development initiatives targeting high net worth (HNW) individuals, foundations, and mission-aligned organizations.Partner with Marketing to support integrated lead generation and prospect engagement campaigns.
              - listitem [ref=f493e126]: Coordinate webinars, events, conferences, and thought leadership activities that support business development goals.
              - listitem [ref=f493e127]: Manage campaign follow-up, content distribution, and related tracking and reporting.
              - listitem [ref=f493e128]: Manage and continuously improve the firm’s RFP process, database, response library, and supporting documentation.
              - listitem [ref=f493e129]: Collaborate with Operations and Marketing to enhance CRM utilization, sales processes, workflow efficiency, and consistency.Identify and implement opportunities to improve sales infrastructure through automation, AI-enabled tools, and process enhancements.
              - listitem [ref=f493e130]: Contribute input on market trends, client needs, and product positioning to inform the firm’s sales and marketing strategy.
            - heading [level=5] [ref=f493e131]:
              - strong [ref=f493e132]: "What You’ll Need to Succeed:"
            - list [ref=f493e133]:
              - listitem [ref=f493e134]: Three or more years of experience supporting sales, business development or marketing functions in wealth management, private banking, asset management, or impact investment organization.
              - listitem [ref=f493e135]: Solid working knowledge of financial planning, retirement planning, trusts, cash flow analysis, portfolio construction, and asset allocation.
              - listitem [ref=f493e136]: Experience managing or supporting complex sales processes, including RFP responses and high-level prospect presentations.
              - listitem [ref=f493e137]: Familiarity with CRM systems, pipeline reporting, and sales operations workflows.
              - listitem [ref=f493e138]: Experience working with sophisticated clients and stakeholders, including high-net-worth individuals, family offices, foundations, endowments, or institutional investors, preferred.
            - heading [level=5] [ref=f493e139]:
              - strong [ref=f493e140]: "What Sets You Apart:"
            - list [ref=f493e141]:
              - listitem [ref=f493e142]: A degree or formal training in finance, marketing, communications or a related field.
              - listitem [ref=f493e143]: Comfort learning and leveraging new technologies, including CRM tools and AI-enabled applications.
              - listitem [ref=f493e144]: Strong organizational and project management skills with high attention to detail.
              - listitem [ref=f493e145]: Ability to translate data and process insights into practical recommendations that enhance sales effectiveness.
            - heading [level=5] [ref=f493e146]:
              - strong [ref=f493e147]: "What Veris Offers You:"
            - list [ref=f493e148]:
              - listitem [ref=f493e149]: Comprehensive health, dental, and vision coverage with 100% employer premium coverage
              - listitem [ref=f493e150]: Flexible Spending Accounts (FSA) traditional and dependent care
              - listitem [ref=f493e151]: 100% employer premium coverage on Short Term Disability, Long Term Disability, and Basic Life and Accidental Death & Dismemberment insurance
              - listitem [ref=f493e152]: 401(k) retirement plan with employer matching
              - listitem [ref=f493e153]: 3 weeks of Paid Time Off
              - listitem [ref=f493e154]: 9 days of Sick Leave
              - listitem [ref=f493e155]: 11 paid Holidays
              - listitem [ref=f493e156]: Paid Leave (Jury Duty, Volunteer Time off, Disability, Parental Leave, etc.)
              - listitem [ref=f493e157]: Employee Assistance & Employee Discount Programs
              - listitem [ref=f493e158]: Professional development opportunities, including tuition reimbursement and training programs
            - paragraph [ref=f493e159]:
              - emphasis [ref=f493e160]: Please note that these are just some potential examples, and the specific benefits and perks offered may vary based on the position and location.
            - heading [level=5] [ref=f493e161]:
              - strong [ref=f493e162]: Compensation
            - heading "Salary ranges:" [level=5] [ref=f493e163]
            - paragraph [ref=f493e164]: "New York: $110,000 – $135,000"
            - paragraph [ref=f493e165]:
              - emphasis [ref=f493e166]: Compensation will be determined based on a number of factors including educational background and relevant experience.
            - heading "Application Instructions" [level=5] [ref=f493e167]
            - paragraph [ref=f493e168]:
              - text: "To apply, please submit your resume and a cover letter outlining your specific interest in this opportunity to the following email address:"
              - link "careers@veriswp.com" [ref=f493e169] [cursor=pointer]:
                - /url: mailto:careers@veriswp.com
              - text: .
            - paragraph [ref=f493e170]:
              - text: "Please use the following for the subject line: “"
              - strong [ref=f493e171]: Veris Senior Associate, Sales | Your Name
              - text: ”
            - paragraph [ref=f493e172]: Resumes will be reviewed as received.
        - generic [ref=f493e183]:
          - heading [level=3] [ref=f493e184]:
            - strong [ref=f493e185]: About Veris
          - paragraph [ref=f493e186]: Founded in 2007, Veris is an independent, SEC-registered investment advisory and wealth management firm focused on helping high-net-worth families and individuals align their investments with their values and foundations and endowments activate their investments in service of their missions.
          - paragraph [ref=f493e187]: A Certified B Corporation since 2011 and a majority-women- and majority-employee-owned firm, Veris brings investment rigor across public and private markets to the pursuit of financial goals alongside measurable social and environmental impact. We serve clients across the United States from offices in New York, NY; Oakland, CA; Portsmouth, NH; Philadelphia, PA; and Denver, CO.
          - paragraph [ref=f493e188]:
            - strong [ref=f493e189]: "Please note: We are not accepting phone inquiries regarding the status of applications. Only qualified candidates will be contacted. Additionally, we are not currently seeking new agencies or third-party recruiters to work with at this time. Thank you for your understanding."
