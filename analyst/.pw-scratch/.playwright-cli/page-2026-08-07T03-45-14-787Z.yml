      - generic [ref=f249e65]:
        - heading "Career Opportunities" [level=2] [ref=f249e66]
        - paragraph [ref=f249e67]: American Airlines Center serves more than 2 million guests during 200+ live events each year. We aim to provide genuine, memorable and innovative experiences to every single one of our guests and demand excellence and creativity in everything that we do.
        - paragraph [ref=f249e68]: We strive to hire the best team members that want to be even better and be an integral part of creating a one of a kind, world class experience for our guests.
        - paragraph [ref=f249e69]: We accept applications and resumes for posted positions only. Applications must be submitted online to be considered. American Airlines Center is a drug-free workplace and proud to be an Equal Opportunity Employer.
        - paragraph [ref=f249e70]: The success of the American Airlines Center is dependent on the talents of individuals with different experiences, strengths, cultures and perspectives. We recognize that bringing together people with different backgrounds and points of view allows us to promote new ways of thinking about our core business and the service levels we continuously strive to achieve. Diversity, equity and inclusion allows us to better represent and serve our customer base, which is people of every possible background.
        - heading [level=2] [ref=f249e71]:
          - link "Click here to watch our AAC Highlight Reel!" [ref=f249e72] [cursor=pointer]:
            - /url: https://www.americanairlinescenter.com/assets/video/AAC_2019_Reel_HQ_v3-app-f40b4a504e.mp4
        - heading [level=2] [ref=f249e73]
        - heading "American Airlines Center Job Opportunities" [level=2] [ref=f249e74]
      - list [ref=f249e76]:
        - listitem [ref=f249e77]:
          - link "American Airlines Center Job Opportunities" [ref=f249e78] [cursor=pointer]:
            - /url: https://americanairlinescenter.acquiretm.com/home.aspx
          - paragraph [ref=f249e80]: For an opportunity to be a part of the American Airlines Center team, click here for current openings.
        - listitem [ref=f249e81]:
          - link "Levy Job Opportunities" [ref=f249e82] [cursor=pointer]:
            - /url: https://careers.compass-usa.com/jobs?location_type=1&radius=5&page_number=1&page_size=10&filter%5Bbrand%5D%5B0%5D=Levy%20Sector&location_name=2500%20VICTORY%20AVE%2C%20DALLAS%2C%20TX
          - paragraph [ref=f249e84]: The Levy family culture has nurtured our incredible growth from a single delicatessen in Chicago, to an industry-leading, food organization over 30 years later. Today, we create great dining experiences at restaurants throughout the country and many of the highest profile sporting and entertainment venues in the world, including American Airlines Center.
        - listitem [ref=f249e85]:
          - link "Legends Job Opportunities" [ref=f249e86] [cursor=pointer]:
            - /url: https://recruiting.ultipro.com/LEG1003LGNDS/JobBoard/7cb7e3f4-053b-4339-af7b-1c62dc39bfc9/?q=&o=distance&w=75219%2C+Dallas%2C+Texas%2C+USA&wc=-96.80994341825027%2C32.809950035993964&we=-96.85994399999996%2C32.859950000000026%7C-96.75994400000005%2C32.759949999999975&wpst=4
          - paragraph [ref=f249e88]: Legends oversees the operations for the American Airlines Center’s Fan Shops and retail points of sale of Mavericks and Stars merchandise at American Airlines Center. Click here for current job descriptions with Legends.
        - listitem [ref=f249e89]:
          - link "ABM Industries" [ref=f249e90] [cursor=pointer]:
            - /url: http://abm.jobs.jobaline.com
          - paragraph [ref=f249e92]: ABM Industries takes the time and energy to recruit quality and qualified employees who understand that their profession goes far beyond pushing a broom and emptying trash receptacles.
