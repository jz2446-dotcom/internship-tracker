        - generic [ref=f1076e144]:
          - heading "What is Oracle?" [level=2] [ref=f1076e146]
          - paragraph [ref=f1076e149]:
            - text: Oracle is a U.S.-based information technology company that offers a wide range of business-oriented products and services that include Oracle Database, a
            - link "relational database" [ref=f1076e150] [cursor=pointer]:
              - /url: https://www.ibm.com/think/topics
            - text: management system (RDBMS).
          - generic [ref=f1076e152]:
            - paragraph [ref=f1076e153]:
              - text: The company was founded in 1977 in California and is among the largest software and hardware companies in the world.
              - superscript [ref=f1076e154]: "1"
              - text: Since its inception nearly fifty years ago, Oracle has developed a vast number of
              - link "information technology" [ref=f1076e155] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/infrastructure?
              - text: (IT) solutions and acquired an extensive portfolio of companies.It is particularly renowned for its cloud-based
              - link "enterprise resource planning" [ref=f1076e156] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/enterprise-resource-planning?
              - text: (ERP) offerings in business intelligence and financial services, as well as for systems such as Solaris, Java and Oracle Linux.Oracle also manufactures and sells purpose-built servers and network solutions to run its platforms and databases.Its Oracle Database was the first SQL-based
              - link "relational database management system" [ref=f1076e157] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/relational-databases?
              - text: (RDBMS) released commercially in the United States.
              - superscript [ref=f1076e158]: "2"
            - paragraph [ref=f1076e159]:
              - text: The company invests heavily in open source technologies, lending resources to the development and testing of open source products and frequently highlighting that key platforms such as the Oracle Cloud Infrastructure (OCI) are “open by design.”
              - superscript [ref=f1076e160]: "3"
              - text: Oracle products and services are used worldwide in government services, telecommunications companies and in healthcare setting where data security, redundancy and complex workload management are critical.
          - generic [ref=f1076e166]:
            - generic [ref=f1076e167]:
