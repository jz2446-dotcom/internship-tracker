          - heading "History of Oracle" [level=2] [ref=f1076e205]
          - generic [ref=f1076e207]:
            - paragraph [ref=f1076e208]:
              - text: The Oracle Corporation was founded in California by Larry Ellison, Bob Miner and Ed Oats under the name Software Development Laboratories in 1977. Inspired by a British research paper outlining a relational database model, the founders believed that there was potential in the system. Two years later, the company released Oracle, the first commercial relational database to use structured query language (SQL).
              - superscript [ref=f1076e209]: "4"
              - text: The company was renamed after its first product in 1982 and went public in 1986, trading on the New York Stock Exchange (NYSE) as Oracle Corp (ORCL).
            - paragraph [ref=f1076e210]: In the 40 years since its founding, Oracle has acquired a vast number of companies to expand its offerings and services. High profile examples include PeopleSoft, Siebel, BEA, Sun Microsystems, Netsuite and Cerner.
            - paragraph [ref=f1076e211]:
              - text: In 2010, the company acquired Sun Microsystems, a software development company that developed the
              - link "Java programming language" [ref=f1076e212] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/java?
              - text: ", further enmeshing it in the world of computer systems and software. The purchase also brought the company into a"
              - link "vast hardware business" [ref=f1076e213] [cursor=pointer]:
                - /url: https://www.nytimes.com/2010/01/27/technology/business-computing/27oracle.html
              - text: ", bringing the operating system Solaris and Java under the company’s purview."
              - superscript [ref=f1076e214]: "5"
              - text: It also acquired the popular open-source database MySQL.
            - paragraph [ref=f1076e215]:
              - text: In 2020, Oracle moved its longtime headquarters from Redwood Shores, California to Austin, Texas. In 2021, it acquired Cerner, a healthcare records company, in its largest acquisition to date.
              - superscript [ref=f1076e216]: "6"
              - text: As of 2023, the company had a total quarterly revenue of more than 200 million USD and continued to grow sharply, according to Forbes.
              - superscript [ref=f1076e217]: "7"
              - text: In the fall of 2023, the company announced it would invest heavily in generative AI use cases across its Fusion Cloud services.
              - superscript [ref=f1076e218]: "8"
          - heading "What is Oracle Database?" [level=2] [ref=f1076e220]
          - paragraph [ref=f1076e223]:
            - text: The Oracle Database is Oracle’s flagship product. It is a popular
            - link "database management" [ref=f1076e224] [cursor=pointer]:
              - /url: https://www.ibm.com/think/topics/data-management?
            - text: and warehousing system used by organizations across the globe to manage and store their data.
          - generic [ref=f1076e226]:
            - paragraph [ref=f1076e227]: It uses SQL for manipulation and querying and was the first database of its kind that is offered for commercial release. The Oracle Database can be run on Linux® or Microsoft Windows.
            - paragraph [ref=f1076e228]: "The Oracle Database features:"
            - paragraph [ref=f1076e229]:
              - strong [ref=f1076e230]: Advanced analytics
              - text: ": The Oracle Database supports big data and advanced analytics. Systems can read and process data and run predictive analytics or automated systems, quickly."
            - paragraph [ref=f1076e231]:
              - strong [ref=f1076e232]: High data availability
              - text: ": The Oracle Database is designed for a high level of operational performance with features like data replication, backup and server clustering."
            - paragraph [ref=f1076e233]:
              - strong [ref=f1076e234]: Scalability
              - text: ": The Oracle Database is capable of running on a single server or on a massive distributed database."
            - paragraph [ref=f1076e235]:
              - strong [ref=f1076e236]: Security
              - text: ": The Oracle Database has a range of features to protect privacy and integrity with encryption and security risk monitoring."
            - paragraph [ref=f1076e237]:
              - text: The Oracle Database is currently offered
              - superscript [ref=f1076e238]: "9"
              - text: "in four editions, each offering various levels of functionality:"
            - paragraph [ref=f1076e239]:
              - strong [ref=f1076e240]: Enterprise edition
              - text: ": Designed for large organizations, Oracle Database Enterprise Edition supports high-volume"
              - link "online transaction processing (OLTP)" [ref=f1076e241] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/oltp
              - text: as well as query-intensive
              - link "data warehousing" [ref=f1076e242] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/data-warehouse
              - text: . It can be enhanced with a wide variety of Oracle options and packs
              - superscript [ref=f1076e243]: "10"
              - text: for advanced analytics, security or functionality.
            - paragraph [ref=f1076e244]:
              - strong [ref=f1076e245]: "Express edition:"
              - text: Oracle Database Express is the free entry-level edition of the Oracle Database. It is simple to install, easy to manage and can be used on any computer. The edition is designed to easily support upgrades to more advanced Oracle Database products.
            - paragraph [ref=f1076e246]:
              - strong [ref=f1076e247]: "Personal edition:"
              - text: This edition of Oracle Database includes nearly all the components of the database’s Enterprise Edition but supports single-use development environments. This edition is a cost-effective way for a software developer to take advantage of Oracle Database’s full functionality.
            - paragraph [ref=f1076e248]:
              - strong [ref=f1076e249]: "Standard edition:"
              - text: Oracle Database Standard Edition provides basic Oracle functionality and is well-suited to workgroup, department-level or web applications.
          - generic [ref=f1076e257]:
            - generic [ref=f1076e258]: What is AI Data Management?
            - button [ref=f1076e264] [cursor=pointer]:
              - img "What is AI Data Management? Discover, Clean, & Secure Data with AI" [ref=f1076e267]
            - heading "Discover, Clean, & Secure Data with AI" [level=3] [ref=f1076e276]
            - paragraph [ref=f1076e279]: Discover how AI Data Management tackles shadow data, poor data quality, and security risks, using AI-powered classification, natural language queries, and anomaly detection to unlock insights and streamline operations.
            - link [ref=f1076e281] [cursor=pointer]:
              - /url: https://www.ibm.com/products/watsonx-data
              - link [ref=f1076e283]:
                - /url: https://www.ibm.com/products/watsonx-data
          - heading "Key Oracle products and services" [level=2] [ref=f1076e293]
          - generic [ref=f1076e300]:
            - heading "Cloud applications" [level=4] [ref=f1076e301]
            - paragraph [ref=f1076e304]:
              - text: The Oracle Fusion Cloud Application Suite
              - superscript [ref=f1076e305]: "11"
              - text: is a family of
              - link "software-as-a-service" [ref=f1076e306] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/saas?
              - text: (SaaS) applications for specific businesses use cases. It includes the Oracle Fusion Enterprise Resource Planning (
              - link "ERP" [ref=f1076e307] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/enterprise-resource-planning?
              - text: ) suite for financials, project management and compliance. The suite also offers specific platforms for
              - link "supply chain and manufacturing" [ref=f1076e308] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/supply-chain-management?
              - text: (SCM),
              - link "human capital management" [ref=f1076e309] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/human-capital-management?
              - text: (HCM) and sales. The cloud ERP also offers industry-specific add-ons for sectors such as higher education or customer experience for consumer goods. Using the Oracle E-Business Suite, organizations can simplify data entry and data management with prebuilt templates.
          - generic [ref=f1076e316]:
            - heading "Cloud infrastructure" [level=4] [ref=f1076e317]
            - paragraph [ref=f1076e320]:
              - text: Oracle Cloud Infrastructure (OCI) is a cloud platform that supports traditional business applications as well as leading-edge technologies like
              - link "artificial intelligence (AI)" [ref=f1076e321] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/artificial-intelligence
              - text: and
              - link "machine learning" [ref=f1076e322] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/machine-learning?
              - text: . The distributed cloud platform includes options for a multicloud solution, a public cloud option, a hybrid cloud or a dedicated cloud running entirely on an organization's data centers. OCI offers tools to run applications and analyze data as well as securely store information. The platform supports Oracle applications, custom applications and independent software vendor (ISV) applications for automation, analytics, networking and storage.
          - generic [ref=f1076e329]:
            - heading "Hardware" [level=4] [ref=f1076e330]
            - paragraph [ref=f1076e333]:
              - text: Oracle offers a wide range of engineered systems that are built with scale in mind. These include x86- and SPARC-based servers, engineered systems for running Java applications and storage and networking solutions. The Oracle Exdata platform
              - superscript [ref=f1076e334]: "12"
              - text: ", an engineered system developed specifically to run Oracle Database, combines database servers, storage and networking."
          - generic [ref=f1076e341]:
            - heading "Middleware" [level=4] [ref=f1076e342]
            - paragraph [ref=f1076e345]:
              - text: Oracle provides a range of
              - link "middleware" [ref=f1076e346] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/middleware
              - text: products and tools to help developers integrate and deploy applications, such as Oracle Application Express (APEX), a low-code web app builder. The company’s Oracle Fusion Middleware, a family of tools for
              - link "enterprise applications" [ref=f1076e347] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/enterprise-applications
              - text: ", offers a suite of products for"
              - link "data integration" [ref=f1076e348] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/data-integration
              - text: ","
              - link "business intelligence" [ref=f1076e349] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/business-intelligence
              - text: and content management. Fusion Middleware can provide infrastructure for
              - link "Internet of Things (IoT)" [ref=f1076e350] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/internet-of-things
              - text: functionality, big data integration and content management.
          - generic [ref=f1076e357]:
            - heading "Software" [level=4] [ref=f1076e358]
            - generic [ref=f1076e360]:
              - paragraph [ref=f1076e361]:
                - text: Oracle produces and licenses a wide range of on-premises applications
                - superscript [ref=f1076e362]: "13"
                - text: "for businesses, including back-office software to help employees manage their core business functions. Some notable offerings include:"
              - list [ref=f1076e363]:
                - listitem [ref=f1076e364]: – PeopleSoft, an ERP for human resources, financial management and campus solutions.
                - listitem [ref=f1076e365]: – The Oracle E-Business Suite, which covers order management, logistics and other business functions.
                - listitem [ref=f1076e366]: – Oracle Business Intelligence (OBIEE) for reporting and analysis.
                - listitem [ref=f1076e367]:
                  - text: – Oracle Enterprise Manager for advanced
                  - link "DevOps" [ref=f1076e368] [cursor=pointer]:
                    - /url: https://www.ibm.com/think/topics/devops?
                  - text: data operations in large-scale organizations.
          - heading "Oracle Database use cases" [level=2] [ref=f1076e370]
          - paragraph [ref=f1076e373]:
            - text: Organizations use Oracle Database across different industries and use cases, including the maintenance of sensitive
            - link "data lakes" [ref=f1076e374] [cursor=pointer]:
              - /url: https://www.ibm.com/think/topics/data-lake?
            - text: "and the tracking of massive real-time financial transactions. Among the most popular use cases for Oracle Database are:"
          - generic [ref=f1076e381]:
            - heading "Business applications and back-office management" [level=4] [ref=f1076e382]
            - paragraph [ref=f1076e385]:
              - text: Organizations use Oracle Database for applications like ERP,
              - link "customer relationship management" [ref=f1076e386] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/crm?
              - text: (CRM) and
              - link "human resources management" [ref=f1076e387] [cursor=pointer]:
                - /url: https://www.ibm.com/think/topics/human-capital-management?
              - text: (HRM), which provide interactive and up-to-date insights on a company’s day-to-day operations.
          - generic [ref=f1076e394]:
            - heading "Data management and data warehousing" [level=4] [ref=f1076e395]
            - paragraph [ref=f1076e398]: Organizations use Oracle Database as a central repository to store and manage vast troves of structured data, or as a data warehouse to facilitate analysis and reporting.
          - generic [ref=f1076e405]:
            - heading "E-commerce platforms" [level=4] [ref=f1076e406]
            - paragraph [ref=f1076e409]: Organizations use Oracle's e-commerce platforms that provide back-office solutions to manage product catalogs, inventory and transaction data.
          - generic [ref=f1076e416]:
            - heading "Financial and insurance services" [level=4] [ref=f1076e417]
            - paragraph [ref=f1076e420]: Financial firms and insurance providers use Oracle’s secure and encrypted database to manage payments, track transactions and audit potential risk.
          - generic [ref=f1076e427]:
            - heading "Government and nonprofits" [level=4] [ref=f1076e428]
            - paragraph [ref=f1076e431]:
              - text: Government agencies like the Department of Defense
              - superscript [ref=f1076e432]: "14"
              - text: and public sector companies use Oracle to securely manage public records and data including classified information.
          - generic [ref=f1076e439]:
            - heading "Healthcare services" [level=4] [ref=f1076e440]
            - paragraph [ref=f1076e443]: In the healthcare industry, organizations use Oracle’s database and solutions to streamline operations, maintain data integrity and optimize multiple workflows with predictive insights.
          - generic [ref=f1076e450]:
            - heading "Online transaction processing (OLTP)" [level=4] [ref=f1076e451]
            - paragraph [ref=f1076e454]: Organizations, from e-commerce to online banks and telecommunications firms, use Oracle Database’s capacity to execute large numbers of database transactions by large numbers of people in real-time.
