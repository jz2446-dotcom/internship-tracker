            - generic [ref=f102e166]:
              - figure [ref=f102e168]:
                - img "img-R3_Logo-1" [ref=f102e169]
              - button "Opportunity R3" [ref=f102e174] [cursor=pointer]
              - paragraph [ref=f102e176]: Opportunity R3, a City of Memphis program, offers a guided path to further your education or to prepare for workforce readiness.
              - paragraph [ref=f102e177]: Opportunity R3 is removing barriers and connecting the gap between preparation and opportunity for young people to realize their full potential to transform lives and the stability of communities.
            - generic [ref=f102e178]:
              - figure [ref=f102e180]:
                - img "img-logo-Microsoft-large-570-350" [ref=f102e181]
              - button "Microsoft Digital Literacy" [ref=f102e186] [cursor=pointer]
              - paragraph [ref=f102e188]: Microsoft is offering courses and resources through the Microsoft Digital Literacy site. Take Digital Literacy courses and find programs & resources to help increase your digital literacy.
            - generic [ref=f102e189]:
              - figure [ref=f102e191]:
                - img "img-digital-learn-feature-570-350" [ref=f102e192]
              - button "Digital Learn" [ref=f102e197] [cursor=pointer]
              - paragraph [ref=f102e199]: Whether you are new to computers or just a little rusty find the tools to become more comfortable interacting with this essential technology. Curated by PLA (Public Library Association) this program is an online hub for digital literacy support and training.
            - generic [ref=f102e200]:
              - figure [ref=f102e202]:
                - img "img-jobs4tn-570-350" [ref=f102e203]
              - button "Jobs 4 TN" [ref=f102e208] [cursor=pointer]
              - paragraph [ref=f102e210]: Need a new career path? Unemployment claims or Job training? Search all of that you need and more at www.jobs4tn.gov.
            - generic [ref=f102e211]:
              - figure [ref=f102e213]:
                - img "img-careeronestop-570-350" [ref=f102e214]
              - button "Career One Stop" [ref=f102e219] [cursor=pointer]
              - paragraph [ref=f102e221]: Their mission to deliver integrated, easy-to-understand workforce information that helps job seekers, students, workers, workforce intermediaries, and employers develop their capacity and make sound economic decisions in the new economy.
            - generic [ref=f102e222]:
