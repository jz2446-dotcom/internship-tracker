          - generic [ref=f102e58]:
            - generic [ref=f102e59]:
              - heading "What are job and career services?" [level=2] [ref=f102e60]
              - paragraph [ref=f102e61]: Need help finding a job? Looking to start a business or discover a new career path? JobLINC is the employment outreach service of the Memphis Public Libraries. We have partnered with several organizations and collected resources for you to explore.
            - figure [ref=f102e64]:
              - img "JOBLINC Career Center Logo" [ref=f102e65]
          - generic [ref=f102e67]:
            - 'button "JobLINC: Our Services" [ref=f102e70] [cursor=pointer]'
            - button "Job & Career Blog" [ref=f102e74] [cursor=pointer]
