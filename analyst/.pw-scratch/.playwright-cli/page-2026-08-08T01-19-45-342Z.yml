          - heading "JobLINC" [level=2] [ref=f102e88]
          - generic [ref=f102e89]:
            - generic [ref=f102e90]:
              - heading "About JobLinc" [level=3] [ref=f102e91]
              - paragraph [ref=f102e92]: JobLINC, a service within the Memphis Public Libraries, has served the Memphis community since 1990. By serving as a model for targeted employment outreach. JobLINC helps job seekers locate employment opportunities. It also helps employers find workers.
              - paragraph [ref=f102e93]:
                - strong [ref=f102e94]: "Location:"
                - link "Benjamin Hooks Central Library" [ref=f102e95] [cursor=pointer]:
                  - /url: https://www.memphislibrary.org/about/locations/benjamin-l-hooks-central-library/
              - paragraph [ref=f102e96]:
                - strong [ref=f102e97]: "Hours of Operation: Monday-Friday from 10 am to 4 pm."
              - paragraph [ref=f102e98]:
                - strong [ref=f102e99]: Contact Us
                - text: ": Call our phone 901-415-2787, or email us at"
                - link "joblinc@memphistn.gov" [ref=f102e100] [cursor=pointer]:
                  - /url: mailto:joblinc@memphistn.gov
                - text: .
              - heading "Our Services" [level=3] [ref=f102e101]
              - heading [level=4] [ref=f102e102]:
                - link "Job and Career Blog" [ref=f102e103] [cursor=pointer]:
                  - /url: https://www.memphislibrary.org/joblinc/job-and-career-blog/
              - paragraph [ref=f102e104]:
                - text: JobLINC partners with companies in the community to post available jobs on our
                - link "Job and Career Blog" [ref=f102e105] [cursor=pointer]:
                  - /url: https://www.memphislibrary.org/joblinc/job-and-career-blog/
                - text: . We also work with employers to connect them with job seekers. To post open positions onto our jobs blog, please fill out the
                - link "Employer Contact Form" [ref=f102e106] [cursor=pointer]:
                  - /url: https://www.memphislibrary.org/joblinc/joblinc-employer-contact-form/
                - text: . You can also email us at
                - link "joblinc@memphistn.gov" [ref=f102e107] [cursor=pointer]:
                  - /url: mailto:joblinc@memphistn.gov
                - text: with a flyer, job posting or jobs fair information.
              - heading "Career Counseling" [level=4] [ref=f102e108]
              - paragraph [ref=f102e109]:
                - text: JobLINC Specialists can provide career counseling via email, phone calls, and virtual meetings. Assistance is available on a first-come, first-served basis. Please fill out the
                - link "Customer/Job Seeker Contact Form" [ref=f102e110] [cursor=pointer]:
                  - /url: "#customercontactform"
                - text: and email your resume to
                - link "joblinc@memphistn.gov" [ref=f102e111] [cursor=pointer]:
                  - /url: mailto:joblinc@memphistn.gov
                - text: . If you have questions please email
                - link "joblinc@memphistn.gov" [ref=f102e112] [cursor=pointer]:
                  - /url: mailto:joblinc@memphistn.gov
                - text: or call the department phone and leave a message at 901-415-2787. Please expect a 48-hour turnaround on all emails or calls during business hours. Days & times are subject to change.
              - list [ref=f102e113]:
                - listitem [ref=f102e114]:
                  - strong [ref=f102e115]: "One-on-One Resume Review:"
                  - text: For a complete review of your resume, please fill out the
                  - link "Customer/Job Seeker Contact Form" [ref=f102e116] [cursor=pointer]:
                    - /url: "#customercontactform"
                  - text: and email your resume to
                  - link "joblinc@memphistn.gov" [ref=f102e117] [cursor=pointer]:
                    - /url: mailto:joblinc@memphistn.gov
                  - text: or call 901-415-2787 and leave a message.
                - listitem [ref=f102e118]:
                  - strong [ref=f102e119]: "Interview Preparation and Job Application Assistance:"
                  - text: JobLINC Specialists are available to do mock interviews with job seekers. Please fill out the
                  - link "Customer/Job Seeker Contact Form" [ref=f102e120] [cursor=pointer]:
                    - /url: "#customercontactform"
                  - text: or call 901-415-2787 and leave a message.
              - heading "Ask a Question/Contact JOBLINC" [level=4] [ref=f102e121]
              - paragraph [ref=f102e122]:
                - text: Are you looking for a job or need career help? Use the form below to contact a member of JobLINC to get help. If you are an employer looking to post your open positions or job fair please use our
                - link "Employer Contact Form" [ref=f102e123] [cursor=pointer]:
                  - /url: https://www.memphislibrary.org/joblinc/joblinc-employer-contact-form/
                - text: . A member of JobLINC can then post your openings on our
                - link "Job and Career Blog" [ref=f102e124] [cursor=pointer]:
                  - /url: https://www.memphislibrary.org/joblinc/job-and-career-blog/
                - text: .
              - heading "Grow with Google Career Certificates:" [level=4] [ref=f102e125]
              - paragraph [ref=f102e126]:
                - text: Memphis Public Libraries, in collaboration with Coursera, is offering
                - strong [ref=f102e127]: Free Google Career Certificate Scholarship Program
                - text: in various high demand fields! More information below.
              - heading "Customer/Job Seeker Contact Form" [level=5] [ref=f102e128]
