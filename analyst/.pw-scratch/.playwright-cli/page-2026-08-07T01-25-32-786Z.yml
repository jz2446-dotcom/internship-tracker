          - generic [ref=f46e66]:
            - emphasis [ref=f46e68]: Andreessen Horowitz is a Silicon Valley-based venture capital firm with $10 billion under management. Focused on investing in software eating the world, the firm partners with entrepreneurs in their company building at all stages – from seed to late-stage – in the biology, consumer, crypto, and enterprise industries.
            - emphasis [ref=f46e70]: Summer Intern
            - emphasis [ref=f46e72]: "Under the supervision of our departmental teams; the intern responsibilities include:"
            - list [ref=f46e73]:
              - listitem [ref=f46e74]:
                - emphasis [ref=f46e75]: Handling a variety of special ad-hoc projects and research
              - listitem [ref=f46e76]:
                - emphasis [ref=f46e77]: Researching and compiling data on various Venture related topics
            - emphasis [ref=f46e79]: Qualifications
            - list [ref=f46e80]:
              - listitem [ref=f46e81]:
                - emphasis [ref=f46e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f46e83]:
                - emphasis [ref=f46e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f46e85]:
                - emphasis [ref=f46e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f46e87]:
                - emphasis [ref=f46e88]: Must be a team player with a “no job is too big or too small attitude”
              - listitem [ref=f46e89]:
                - emphasis [ref=f46e90]: Strong organizational and time management skills are critical, as multi-tasking is essential to monitor and engage in the overall responsibilities
              - listitem [ref=f46e91]:
                - emphasis [ref=f46e92]: Excellent verbal, written, and interpersonal communication skills
