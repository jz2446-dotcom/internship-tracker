              - generic [ref=f1557e145]:
                - paragraph [ref=f1557e146]: Whether you are a new graduate, an MBA candidate or a midcareer professional, L.E.K. Consulting can offer you exciting opportunities to pursue your career goals.
                - paragraph [ref=f1557e147]: From new joiners to seasoned partners, we share a common value of developing others as we develop ourselves, leading to deeper relationships and a sense of belonging. We are committed to creating a diverse and inclusive environment, enriched with an accelerated career path and the ability to shape your better future, from day one. Be part of an international, closely connected team of exceptionally smart and aspirational yet decidedly humble and down-to-earth individuals who leverage their unique backgrounds and experiences to help our clients make better decisions and solve high-impact strategic issues at critical inflection points.
                - paragraph [ref=f1557e148]: We solve for a better future. Come grow with us!
