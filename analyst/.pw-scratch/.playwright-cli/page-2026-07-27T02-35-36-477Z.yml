      - generic [ref=f598e96]: "EQT has become aware of fraudulent job postings and communications falsely using EQT's name on various platforms such as Indeed. To ensure your safety and security, please verify any job postings using the \"Find Your EQT Career\" widget below or by contacting us via the \"Contact Us\" page at the top of this site.If you are a resident of New Jersey, New York, or California (or present in the State of NJ, NY,or CA at the time of applying online), EQT will not accept and/or process any job applications from you submitted via this website. Instead, your cover letter, resume and job application either must be emailed to sabrina.davis@eqt.com or sent via US Mail to EQT Corporation, Attention: Human Resources Job Application, 2200 Energy Drive, Canonsburg, PA 15317, in order to be considered for a position."
