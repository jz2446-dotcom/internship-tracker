  - main [ref=f1366e14]:
    - generic [ref=f1366e17]:
      - generic [ref=f1366e18]:
        - paragraph [ref=f1366e19]:
          - strong [ref=f1366e20]: We Are Committed to an Inclusive Workplace
          - text: At the Philadelphia Museum of Art, we actively seek to employ a diverse group of people who embody our organizational values. We welcome and encourage individuals of all backgrounds to apply, especially those from marginalized and underrepresented groups in the museum field, who are inspired by our shared purpose and enjoy working collaboratively with others. We are proud to be an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to age, ancestry, citizenship or immigration status, color, disability, ethnicity, familial status, gender identity and/or expression, genetic information, marital status, national origin, race, religion, sex, sexual orientation, veteran status, or any other protected status.
          - strong [ref=f1366e21]: What We Do
          - text: We are Philadelphia's art museum, a landmark building, a world-renowned collection. A place that welcomes everyone. We bring the arts to life, inspiring visitors—through scholarly study or creative play—to discover the creative spirit that lies within each of us. We connect people with the arts in rich and varied ways, making the experience of the Museum surprising, lively, and always memorable.
          - strong [ref=f1366e22]: Who We Are
          - text: Our values define who we are. They drive the way we do things and the decisions we make. We are open – we welcome everyone, opening eyes and minds to the expressive power of the arts. We are connected – we sustain and strengthen the communities we serve, bringing together diverse audiences. We are vital – we bring the arts to life, engaging visitors from Philadelphia and around the world. We are provocative – we believe that the arts can change the way we understand ourselves and how we see the world.
          - strong [ref=f1366e23]: Working Together
          - text: We expect every employee, department, and division to work collaboratively with all others, inspired by a shared purpose. We respect each other as individuals and colleagues. We encourage innovation and support one another’s efforts, recognizing that innovation involves risk.
          - strong [ref=f1366e24]: What We Offer
          - text: "Our employees are at the center of the museum. As an employee, you will have access to numerous museum perks including, but not limited to:"
        - list [ref=f1366e25]:
          - listitem [ref=f1366e26]:
            - paragraph [ref=f1366e27]: Free general admission to the museum for you and your immediate family
          - listitem [ref=f1366e28]:
            - paragraph [ref=f1366e29]: Discounted guest tickets for admission
          - listitem [ref=f1366e30]:
            - paragraph [ref=f1366e31]: Discounts on gift memberships
          - listitem [ref=f1366e32]:
            - paragraph [ref=f1366e33]: Special staff tours and presentations from our curatorial and conservation teams
          - listitem [ref=f1366e34]:
            - paragraph [ref=f1366e35]: Discounts at the museum restaurant, museum cafés, and museum retail and online stores
        - paragraph [ref=f1366e36]: "We offer a comprehensive benefits package for employees* including:"
        - list [ref=f1366e37]:
          - listitem [ref=f1366e38]:
            - paragraph [ref=f1366e39]: Medical, dental, and vision benefits
          - listitem [ref=f1366e40]:
            - paragraph [ref=f1366e41]: Fully paid short-term disability insurance, long-term disability insurance, and life insurance
          - listitem [ref=f1366e42]:
            - paragraph [ref=f1366e43]: Health savings or flexible spending account program
          - listitem [ref=f1366e44]:
            - paragraph [ref=f1366e45]: Retirement savings program with museum match
          - listitem [ref=f1366e46]:
            - paragraph [ref=f1366e47]: Paid vacation, personal days, sick days, and holidays
        - paragraph [ref=f1366e48]:
          - emphasis [ref=f1366e49]: "*Eligibility for certain benefits is based on a variety of factors including the employee’s regular schedule and tenure."
