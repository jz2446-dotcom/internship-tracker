          - paragraph [ref=f1223e39]: Shopify's 6-month Design Apprentice Program pairs early-career designers with senior mentors through two rotations. Built for new graduates, career switchers, and those early in their design careers.
          - link "Learn more about our Design Apprentice Program" [ref=f1223e42] [cursor=pointer]:
