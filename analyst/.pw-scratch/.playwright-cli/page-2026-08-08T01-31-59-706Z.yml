    - main [ref=f136e40]:
      - article [ref=f136e41]:
        - generic [ref=f136e42]:
          - heading "Summer 2022 Internship at The Fine Arts Museum of San Francisco" [level=1] [ref=f136e44]
          - generic [ref=f136e45]:
            - generic [ref=f136e46]:
              - generic [ref=f136e47]: " Posted on:"
              - link [ref=f136e48] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/2022/03/17/summer-2022-internship-at-the-fine-arts-museum-of-san-francisco/
                - time [ref=f136e49]: March 17, 2022
              - text: 
            - generic [ref=f136e50]:
              - generic [ref=f136e51]: " Written by:"
              - link "Charlie Maliha" [ref=f136e52] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/author/cm6232/
          - generic [ref=f136e53]:
            - paragraph [ref=f136e54]: PROGRAM OVERVIEW
            - paragraph [ref=f136e55]:
              - text: FAMSF’s Summer Internship program provides an opportunity to work in one of the largest public arts institutions in San Francisco. FAMSF’s summer internship is a paid, full-time eight-week program primarily for undergraduate, graduate students, or recent graduates interested in arts and museum careers and who are passionate about equity and inclusion. Interns will work directly within museum staff to support departmental goals and will be responsible for individual projects. Interns participate in training sessions, professional development, and a weekly Career Insights guest speaker series. They will gain knowledge of museum careers and culture, receive mentorship from full-time staff, hands-on project experience and feedback, and join a network of emerging museum professionals. FAMSF values diversity in culture, race and ethnicity, and gender expression. Candidates from backgrounds traditionally underrepresented in the arts and museum fields are encouraged to apply.
              - strong [ref=f136e56]
            - paragraph [ref=f136e57]: DEPARTMENTS
            - paragraph [ref=f136e58]: "Summer 2022 Internships are offered in the following departments:"
            - list [ref=f136e59]:
              - listitem [ref=f136e60]:
                - strong [ref=f136e61]: Communications
                - text: – This team designs strategies and approaches to communicate the Museum’s goals and programs internally and externally to the public.
              - listitem [ref=f136e62]:
                - strong [ref=f136e63]: Conservation
                - text: – This department leads the treatment, care and preservation of artworks in the Museum’s collections.
              - listitem [ref=f136e64]:
                - strong [ref=f136e65]: Contemporary Art and Performance
                - text: – This team is dedicated to the research, collection and creation of exhibitions, programs and performances with leading contemporary artists.
              - listitem [ref=f136e66]:
                - strong [ref=f136e67]: Exhibition Management
                - text: – This department works across collections and curatorial areas to support the development and management of the permanent and special exhibitions.
              - listitem [ref=f136e68]:
                - strong [ref=f136e69]: Facilities and Operations
                - text: – This team is responsible for maintaining and enhancing the iconic buildings of the de Young and Legion of Honor as well as ensuring the Museums run at optional effectiveness and safety for staff, visitors, and the art collection.
              - listitem [ref=f136e70]:
                - strong [ref=f136e71]: Graphic Design
                - text: – This team is responsible for developing the Museum’s graphic and brand identity across various digital and printed collaterals and materials.
              - listitem [ref=f136e72]:
                - strong [ref=f136e73]: Registration
                - text: – Responsible for the policies and practices related to the acquisition, transport, storage, and installation of the Fine Arts Museums art collections.
              - listitem [ref=f136e74]:
                - strong [ref=f136e75]: Web and Digital
                - text: – This team develops and maintains the Museum’s web, video, and social media content.
            - paragraph [ref=f136e76]: SPECIFICS OF THE PROGRAM
            - paragraph [ref=f136e77]: The 2022 internship will be hybrid, meaning interns will be expected to work onsite a minimum of 3 days per week. The program will begin on Monday, June 13 and end on Friday, August 5. Interns are expected to commit 35 hours per week over a period of eight weeks.
            - paragraph [ref=f136e78]:
              - text: PROGRAM DATES and COMPENSATION
              - strong [ref=f136e79]
            - list [ref=f136e80]:
              - listitem [ref=f136e81]: "Internship Dates: June 13 – August 5, 2022."
              - listitem [ref=f136e82]:
                - text: 35 hours per week for 8 weeks. Hybrid program with a minimum of 3 days onsite work.
                - list [ref=f136e83]:
                  - listitem [ref=f136e84]: Thursdays are a required onsite work day for professional development training and events. The other onsite work days are flexible.
              - listitem [ref=f136e85]: "Compensation: $5250 for the summer ($18.75/hr)"
              - listitem [ref=f136e86]:
                - text: We are happy to work with educational institutions to provide credit for an internship.
                - strong [ref=f136e87]
            - paragraph [ref=f136e88]:
              - text: OVERALL QUALIFICATIONS
              - strong [ref=f136e89]
            - list [ref=f136e90]:
              - listitem [ref=f136e91]: Interest in art and museums, research, writing, and/or engaging with the public.
              - listitem [ref=f136e92]: Comfortable communicating with a diverse group of people including museum staff, stakeholders, peers and the public.
              - listitem [ref=f136e93]: Must be reliable, self-motivated, enthusiastic, open-minded, and collaborative.
              - listitem [ref=f136e94]: Ability to commit 35 hours per week for 8 weeks; from June 13 to August 5.
              - listitem [ref=f136e95]: Previous museum experience is not required.
            - paragraph [ref=f136e96]: "Additional Materials:"
            - list [ref=f136e97]:
              - listitem [ref=f136e98]: Resume (optional)
              - listitem [ref=f136e99]:
                - text: "Written response answering the following questions:"
                - list [ref=f136e100]:
                  - listitem [ref=f136e101]: What are your top three department choices?
                  - listitem [ref=f136e102]: What is your interest and experience in these department areas?
                  - listitem [ref=f136e103]: What do you hope to gain from this internship experience?
              - listitem [ref=f136e104]: We are committed to making COFAM a more diverse, inclusive, equitable and accessible institution. Please describe how your past experience and future career goals align with these efforts.
            - paragraph [ref=f136e105]: "Selection Timeline:"
            - list [ref=f136e106]:
              - listitem [ref=f136e107]: "Application Deadline: April 15, 2022"
              - listitem [ref=f136e108]: Interviews will be held the week of May 2nd
              - listitem [ref=f136e109]: Final selection will be made by Monday, May 16th
            - paragraph [ref=f136e110]:
              - strong [ref=f136e111]: "To Apply:"
            - paragraph [ref=f136e112]:
              - link "Apply via full job listing here" [ref=f136e113] [cursor=pointer]:
                - /url: https://famsf.snaphire.com/jobdetails?ajid=R31U7
            - paragraph [ref=f136e114]: If you require an alternative method of completing this application please contact humanresources@famsf.org.
            - paragraph [ref=f136e115]:
              - strong [ref=f136e116]: All new COFAM employees and interns are required to be vaccinated against COVID-19 as a condition of employment. Please contact humanresources@famsf.org with any questions.
            - paragraph [ref=f136e117]: ___
            - paragraph [ref=f136e118]:
              - emphasis [ref=f136e119]: COFAM is the Corporation of Fine Arts Museums and is the privately funded non-profit corporation which supports the Fine Arts Museums of San Francisco, a department of the City and County of San Francisco.
            - paragraph [ref=f136e120]:
              - emphasis [ref=f136e121]: COFAM is proud to be an equal opportunity employer and is committed to a policy of nondiscrimination in all phases of employment in accordance with all federal, state, and local laws. Pursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.
            - paragraph [ref=f136e122]:
              - emphasis [ref=f136e123]: Comprising the de Young Museum in Golden Gate Park and the Legion of Honor in Lincoln Park, we are the largest public arts institution in the City of San Francisco and one of the largest art museums in the United States. The de Young, designed by Herzog & de Meuron and located in Golden Gate Park, showcases American art from the 17th through the 21st centuries, international contemporary art, textiles and costumes, and art from the Americas, the Pacific, and Africa. The Legion of Honor displays a collection of over 4,000 years of ancient and European art including Auguste Rodin’s The Thinker and houses the Achenbach Foundation for Graphic Arts in a Beaux-Arts style building overlooking Lincoln Park and the Golden Gate Bridge.
