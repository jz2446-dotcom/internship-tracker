            - strong [ref=f55e56]: Hennepin County Library
          - strong [ref=f55e57]:
            - text: (HCL) is seeking a Library Information Services Intern to work with Information Programs and Services at the Ridgedale Library at 12601 Ridgedale Drive in Minnetonka and the Central Library at 300 Nicollet Mall in downtown Minneapolis
            - strong [ref=f55e58]: .
            - text: This is an unpaid internship from January - May of 2017, working 8 - 16 hours per week. This opportunity can be used for college credit or work experience.The Information Programs and Services area coordinates information and reference services provided in library buildings, online, and in the community. We work with services to readers of all ages. Our services include reference and information, digital literacy, and web content.HCL's mission is to nourish minds, transform lives, and build community together. We envision a Hennepin County where library services ensure every person has the opportunity and resources to read, graduate, engage, work and learn.
        - strong [ref=f55e60]: "The primary duties and responsibilities of this internship include:"
        - generic [ref=f55e61]:
          - list [ref=f55e62]:
            - listitem [ref=f55e63]: Support the library's online services, including the website, catalog, and online customer service.
            - listitem [ref=f55e64]: Research current trends in information and online services to support service development.
            - listitem [ref=f55e65]: Perform other duties and projects developed based on library needs, candidate skills, and interest.
          - strong [ref=f55e66]: "Best Qualified Candidates will have:"
          - list [ref=f55e67]:
            - listitem [ref=f55e68]: Current enrollment or recent completion of a master's degree in library/information science from an ALA accredited program.
            - listitem [ref=f55e69]: Strong interest in serving public library patrons of all ages.
            - listitem [ref=f55e70]: Interest in both in-library and online services for library patrons and a comfort with new and developing technologies.
            - listitem [ref=f55e71]: Understanding of current trends in library services.
            - listitem [ref=f55e72]: Demonstrated ability to work independently, as well as with teams.
            - listitem [ref=f55e73]: Not previously completed an internship with Hennepin County Library.
        - generic [ref=f55e74]:
          - strong [ref=f55e75]: "To Apply:"
          - text: Submit a resume, brief cover letter outlining your qualifications for this internship, and contact information for two references to Barb McKenzie. Barb McKenzieHennepin County Library - Ridgedale12601 Ridgedale DriveMinnetonka, MN 55305
          - link "bamckenzie@hclib.org" [ref=f55e76] [cursor=pointer]:
            - /url: mailto:bamckenzie@hclib.org
          - text: (preferred)
