            - article [ref=f1855e52]:
              - generic [ref=f1855e54]:
                - generic [ref=f1855e55]:
                  - generic [ref=f1855e56]: Introduction
                  - generic [ref=f1855e57]:
                    - paragraph [ref=f1855e58]: A career in IBM Consulting is rooted in long-term relationships and close collaboration with clients across the globe.
                    - paragraph [ref=f1855e59]
                    - paragraph [ref=f1855e60]: You'll work with visionaries across multiple industries to improve the hybrid cloud and AI journey for the most innovative and valuable companies in the world. Your ability to accelerate impact and make meaningful change for your clients is enabled by our strategic partner ecosystem and our robust technology platforms across the IBM portfolio, including Software and Red Hat.
                    - paragraph [ref=f1855e61]
                    - paragraph [ref=f1855e62]: Curiosity and a constant quest for knowledge serve as the foundation to success in IBM Consulting. You will be encouraged to challenge the norm, investigate ideas outside of your role, and come up with creative solutions resulting in groundbreaking impact for a wide network of clients. Our culture of evolution and empathy centers on long-term career growth and development opportunities in an environment that embraces your unique skills and experience.
                - paragraph [ref=f1855e65]: In this role, you'll work in one of our IBM Consulting Client Innovation Centers (Delivery Centers), where we deliver deep technical and industry expertise to a wide range of public and private sector clients around the world. Our delivery centers offer our clients locally based skills and technical expertise to drive innovation and adoption of new technology.
                - generic [ref=f1855e66]:
                  - generic [ref=f1855e67]: Your role and responsibilities
                  - generic [ref=f1855e68]:
                    - paragraph [ref=f1855e69]: During your internship, you can enhance your knowledge and gain professional experience by working on client projects. This role provides an exceptional opportunity to build a compelling portfolio, acquire new skills, gain insights into diverse industries, and embrace novel challenges for your future career.
                    - paragraph [ref=f1855e70]
                    - paragraph [ref=f1855e71]: At IBM, we prioritize continuous learning, skill development, and personal growth within a culture of coaching and mentorship. As an intern, you'll experience this culture and have the opportunity to advance to our associate program based on results and performance.
                    - paragraph [ref=f1855e72]: "Work experiences you could be exposed to:"
                    - list [ref=f1855e73]:
                      - listitem [ref=f1855e74]: "Team Collaboration and Innovation: Join cross functional teams to understand requirements and define technical specs for various projects, fostering collaboration innovation."
                      - listitem [ref=f1855e75]: "Precision in Documentation: Document technical specifications and design decisions with clarity ensuring effective communication within the team and stakeholders."
                      - listitem [ref=f1855e76]: "Code Excellence: develop scalable reusable code and champion code review processes/tools to uphold top notch code quality."
                      - listitem [ref=f1855e77]: "Full Stack Versatility: Engage in full stack cloud native development, utilizing design thinking to create products that prioritize user experience, performance, security, quality, and stability. Gain exposure to a diverse tech stack including databases, operating systems, cloud providers, and modern UI frameworks, contributing to the entire product delivery life cycle."
                    - paragraph [ref=f1855e78]
                - generic [ref=f1855e79]:
                  - generic [ref=f1855e80]: Required education
                  - generic [ref=f1855e81]: None
                - generic [ref=f1855e82]:
                  - generic [ref=f1855e83]: Required technical and professional expertise
                  - list [ref=f1855e85]:
                    - listitem [ref=f1855e86]: Currently pursuing a university degree with a track-record of academic success
                    - listitem [ref=f1855e87]: Strong Interpersonal skills that enhance collaboration and relationship building, while also managing dynamic workloads in an agile environment
                    - listitem [ref=f1855e88]: Have initiative and passion to actively seek new knowledge and improve skills while embracing a growth mindset to assimilate diverse viewpoints
                    - listitem [ref=f1855e89]: Demonstrate leadership experience and ability to communicate effectively through active listening; while also be willing to adapt and have a readiness to take ownership of tasks and challenges.
                    - listitem [ref=f1855e90]: Experience with 1 of the following (Java, C++, Python, Scala, R, SAS, SQL, HTML, SPSS, VBA, Tableau, etc.), as well as systems design/development, hyperscale platforms, and information technology world
                - generic [ref=f1855e91]:
                  - generic [ref=f1855e92]: Preferred technical and professional experience
                  - list [ref=f1855e94]:
                    - listitem [ref=f1855e95]: Knowledge or interested in database development, as well as a curiosity in a wide range of cloud platforms, web markup languages, deploying applications with container technology, and generative AI.
                    - listitem [ref=f1855e96]: Exposure to web services, API, and multiple Java application frameworks highly desired.
                    - listitem [ref=f1855e97]: Knowledge or interest in best practices around design patterns, performance tuning, automated and unit testing.
            - group [ref=f1855e98]:
              - generic "Press space or enter keys to toggle section visibility" [ref=f1855e99]:
                - heading "ABOUT BUSINESS UNIT" [level=3] [ref=f1855e101]
                - generic [ref=f1855e102]: 
              - generic [ref=f1855e105]: IBM Consulting is IBM’s consulting and global professional services business, with market leading capabilities in business and technology transformation. With deep expertise in many industries, we offer strategy, experience, technology, and operations services to many of the most innovative and valuable companies in the world. Our people are focused on accelerating our clients’ businesses through the power of collaboration. We believe in the power of technology responsibly used to help people, partners and the planet.
            - group [ref=f1855e109]:
              - generic "Press space or enter keys to toggle section visibility" [ref=f1855e110]:
                - heading "YOUR LIFE @ IBM" [level=3] [ref=f1855e112]
                - generic [ref=f1855e113]: 
              - generic [ref=f1855e119]:
                - paragraph [ref=f1855e120]: In a world where technology never stands still, we understand that, dedication to our clients success, innovation that matters, and trust and personal responsibility in all our relationships, lives in what we do as IBMers as we strive to be the catalyst that makes the world work better.
                - paragraph [ref=f1855e121]: Being an IBMer means you’ll be able to learn and develop yourself and your career, you’ll be encouraged to be courageous and experiment everyday, all whilst having continuous trust and support in an environment where everyone can thrive whatever their personal or professional background.
                - paragraph [ref=f1855e122]
                - paragraph [ref=f1855e123]: Our IBMers are growth minded, always staying curious, open to feedback and learning new information and skills to constantly transform themselves and our company. They are trusted to provide on-going feedback to help other IBMers grow, as well as collaborate with colleagues keeping in mind a team focused approach to include different perspectives to drive exceptional outcomes for our customers. The courage our IBMers have to make critical decisions everyday is essential to IBM becoming the catalyst for progress, always embracing challenges with resources they have to hand, a can-do attitude and always striving for an outcome focused approach within everything that they do.
                - paragraph [ref=f1855e124]
                - paragraph [ref=f1855e125]: Are you ready to be an IBMer?
            - group [ref=f1855e126]:
              - generic "Press space or enter keys to toggle section visibility" [ref=f1855e127]:
                - heading "ABOUT IBM" [level=3] [ref=f1855e129]
                - generic [ref=f1855e130]: 
              - generic [ref=f1855e134]:
                - generic [ref=f1855e136]:
                  - paragraph [ref=f1855e137]: IBM’s greatest invention is the IBMer. We believe that through the application of intelligence, reason and science, we can improve business, society and the human condition, bringing the power of an open hybrid cloud and AI strategy to life for our clients and partners around the world.
                  - paragraph [ref=f1855e138]
                  - paragraph [ref=f1855e139]: Restlessly reinventing since 1911, we are not only one of the largest corporate organizations in the world, we’re also one of the biggest technology and consulting employers, with many of the Fortune 500 companies relying on the IBM Cloud to run their business.
                  - paragraph [ref=f1855e140]
                  - paragraph [ref=f1855e141]: At IBM, we pride ourselves on being an early adopter of artificial intelligence, quantum computing and blockchain. Now it’s time for you to join us on our journey to being a responsible technology innovator and a force for good in the world.
                - paragraph [ref=f1855e144]: IBM is proud to be an equal-opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, gender, gender identity or expression, sexual orientation, national origin, genetics, pregnancy, disability, neurodivergence, age, or other characteristics protected by the applicable law. IBM is also committed to compliance with all fair employment practices regarding citizenship and immigration status.
            - group [ref=f1855e145]:
              - generic "Press space or enter keys to toggle section visibility" [ref=f1855e146]:
                - heading "OTHER RELEVANT JOB DETAILS" [level=3] [ref=f1855e148]
                - generic [ref=f1855e149]: 
              - paragraph [ref=f1855e156]: For additional information about location requirements, please discuss with the recruiter following submission of your application.
