    - generic [ref=f670e50]:
      - paragraph
      - paragraph [ref=f670e51]: With a history going back 29 years, PAG has built the largest fully diversified alternative investment business in the Asia Pacific region. Our funds and tailored accounts cover a broad spectrum of investments and asset classes – public and private, equity and debt, corporate and asset based. This range gives us a unique perspective when it comes to evaluating opportunities in the world’s fastest-growing region.
      - paragraph [ref=f670e52]: We act as a local player in each of our markets, with on-the-ground teams who drive original idea generation, underwrite local risks and source off-market opportunities. We support these teams with continuous investment in our platform, delivering best-in-class processes and standards in risk management, compliance and transparency.
      - paragraph [ref=f670e53]
