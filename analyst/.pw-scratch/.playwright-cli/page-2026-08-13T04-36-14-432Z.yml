    - heading "Our history" [level=2] [ref=f670e1890]
    - generic [ref=f670e1893]:
      - paragraph [ref=f670e1894]: The roots of PAG date back more than two decades. The PAG brand evolved from Pacific Alliance Group, a multi-strategy hedge fund manager co-founded by Chris Gradel in 2002, which became PAG’s Credit & Markets business. PAG Real Assets grew out of Secured Capital Japan, a Tokyo Stock Exchange-listed real estate investment firm co-founded in 1997 by Jon-Paul Toppino. Weijian Shan founded PAG’s Private Equity business in 2010 after a successful career leading deals for U.S.-based investor TPG and its Asia-focused affiliate Newbridge Capital.
      - paragraph [ref=f670e1895]: In 2010, these three successful investment businesses united to create a single multi-strategy platform; the following year the brand officially relaunched as PAG. Since 2010, PAG has expanded into multiple new markets and asset classes, with 37 funds investing across more than a dozen investment strategies. Today PAG operates as one firm with 15 offices and more than 350 investment professionals around the world. We manage over USD55 billion in assets for more than 300 global institutions, including some of the world’s largest pension plans, sovereign wealth funds, insurers and endowments.
