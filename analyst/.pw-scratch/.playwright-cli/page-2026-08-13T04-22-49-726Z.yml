              - paragraph [ref=f826e126]: To help prevent lead poisoning in young children and pregnant women, the owners of buildings with two or more apartments in certain zip codes in Mount Vernon, New Rochelle and Yonkers are required by state law to register their properties at Lead Safe NY and to have them inspected every three years to certify they are free of lead paint hazards.
