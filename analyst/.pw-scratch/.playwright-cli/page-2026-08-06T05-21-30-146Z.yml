      - generic [ref=f70e51]:
        - heading "Internships" [level=1] [ref=f70e52]
        - paragraph [ref=f70e53]: Citi's internship programs provide students with a transformative opportunity to gain practical experience and launch a career at a global investment bank. These programs include 8-16 weeks Summer Analyst roles, 10-weeks Associate roles and Placement Analyst positions ranging from 3 to 11 months. Interns receive structured training, dedicated mentorship and hands-on exposure across diverse business areas. Available in multiple locations, these programs offer a clear pathway to potential full-time roles, enabling interns to build valuable networks and make a tangible impact from day one.
      - list [ref=f70e57]:
        - listitem [ref=f70e58]:
          - heading [level=2] [ref=f70e59]:
            - button "Summer Analyst" [expanded] [ref=f70e60] [cursor=pointer]
          - generic [ref=f70e63]:
            - paragraph [ref=f70e64]: "Locations: Multiple on-site locations."
            - paragraph [ref=f70e65]: "Structure: Full-time internship; some programs may include rotations."
            - paragraph [ref=f70e66]: "Duration: May vary between 8-16 weeks."
            - paragraph [ref=f70e67]: "Start Date: May-June (applications typically open in September the year prior)."
            - paragraph [ref=f70e68]: "Eligibility: Penultimate year university students."
            - paragraph [ref=f70e69]: "Areas of Business: Banking (Commercial Banking, Corporate Banking, Investment Banking, Capital Markets, US Personal Banking), Client (Research, Equity Research, Global Strategy & Macro Group), Chief Operating Officer, Enterprise Services& Public Affairs, Finance, Human Resources, Internal Audit, Markets (incl. Quantitative Analysis), Operations, Risk Management, Services (Treasury & Trade Solutions, Securities Services), Technology (Application Development, Cybersecurity, Infrastructure, Production Support), Wealth."
            - paragraph [ref=f70e70]: "Benefits: Structured training with Citi and external vendors, dedicated mentorship, networking opportunities, hybrid work arrangements across many roles, the opportunity to be offered a full-time analyst role after successful internship."
