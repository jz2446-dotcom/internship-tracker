        - heading "Description" [level=3] [ref=f16e19]
        - paragraph
        - generic [ref=f16e20]:
          - generic [ref=f16e21]: "Starwood Capital Overview:"
          - generic [ref=f16e23]: Starwood Capital Group is a private investment firm with a primary focus on global real estate. Since its inception in 1991, the Firm has raised over $90 billion of capital and currently has $125+ billion of assets under management. Over the past 34 years, Starwood Capital has invested in excess of $270 billion of assets, including properties within every major real estate asset class.
        - generic [ref=f16e25]: "Program Description:"
        - generic [ref=f16e28]: Starwood Capital’s Internship Program is 9-weeks long and we select a group of highly motivated summer interns with the goal of identifying talent for our Full-time Analyst Program. Our size and structure provides individuals with a high level of responsibility and the unique opportunity to work directly with senior management, joint venture partners, investment bankers, brokers and commercial lenders in all real estate classes. Summer Interns will participate in a variety of specialized trainings that will refine their skills and assist them in transitioning into the professional working environment of Starwood and the investment industry as a whole. A mentorship driven program allows our Summer Interns to create lasting relationships that will support the continued growth of a successful career.
        - generic [ref=f16e29]: "Responsibilities:"
        - generic [ref=f16e31]: The role’s core responsibilities include interfacing with financial firms to track incoming business, general logistics/follow up efforts, working with internal marketing and operations teams, and executing email merges. A successful candidate will have a sales mindset, existing investment/financial acumen, an approachable/likable personality, competitive spirit, and is truly self-driven. It is Starwood’s desire to have the top performing sought after distribution talent in the financial services sales industry. This role is designed for individuals interested in a fund-raising career for real estate-based products.
        - list [ref=f16e32]:
          - listitem [ref=f16e33]:
            - generic [ref=f16e34]: Existing Producer Sales Support - tracking new monthly business procuring documents to resolve NIGO (not in good order) items. Be available to existing producers, fulfilling offering/marketing document requests (resolve or escalate as necessary), documenting interactions in Sales Force CRM
          - listitem [ref=f16e35]:
            - generic [ref=f16e36]: Clean Note Taking and Follow Up – Track and maintain follow up tasks as needed to ensure items assigned are delivered on time and as expected. This may include daily review of sales numbers, pulling reports from Sales Force, participating and documenting calls and meetings (internal/external) regarding topics that may impact equity raise in the territory.
          - listitem [ref=f16e37]: Effective Use Salesforce CRM to gain a full picture of the territory’s opportunity set, log phone calls, meetings, emails, notes, and pull activity reports as needed
          - listitem [ref=f16e38]: Comply with all rules and regulations of selling securities as outlined by FINRA and SEC as well as any internal guidelines established by Starwood Capital.
          - listitem [ref=f16e39]:
            - generic [ref=f16e40]: Support Prospecting Efforts – Support the teams prospecting activities through email merges, tracking inbound calls, following up or escalating as necessary.
        - generic [ref=f16e41]: "Qualifications:"
        - list [ref=f16e42]:
          - listitem [ref=f16e43]: Ability to work independently and in a team environment
          - listitem [ref=f16e44]: Excellent planning, time management, prioritization, and organizational skills
          - listitem [ref=f16e45]: Strong interpersonal skills with proven ability to build deep lasting relationships
          - listitem [ref=f16e46]: Excellent communication skills including voice, language, etiquette, interpersonal, and presentation skills
          - listitem [ref=f16e47]: Proactive and innovative self-starter, takes initiative and is a solution-oriented thinker
          - listitem [ref=f16e48]: Possesses strong (or a desire to develop) sales skills
          - listitem [ref=f16e49]: High degree of investment acumen and analytical skills
        - generic [ref=f16e50]: "To be considered for the 2027 Summer Internship Program, applicants must meet the following criteria:"
        - list [ref=f16e51]:
          - listitem [ref=f16e52]: Currently enrolled as an undergraduate student
          - listitem [ref=f16e53]: "Anticipated graduation date: Fall 2027 – Spring 2028"
