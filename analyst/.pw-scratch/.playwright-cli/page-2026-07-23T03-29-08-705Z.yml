        - generic [ref=f151e39]:
          - heading "Integrity and a commitment to excellence are central to our culture and inform our hiring decisions, as we seek to cultivate and maintain a diverse community of engaging team members." [level=2] [ref=f151e40]
          - paragraph [ref=f151e41]: At Rockpoint, we make professional growth a priority at all levels by creating and providing mentoring opportunities, encouraging industry involvement, supporting innovation and skill development, and rewarding collaborative problem solving.
        - generic [ref=f151e42]:
          - generic [ref=f151e45]:
            - heading "Our People" [level=2] [ref=f151e46]
            - paragraph [ref=f151e47]: We have long said that our people are our greatest strength, and a key driver of our status as a valued partner among investors globally. We prioritize development and retention of our teams, with the understanding that our continued success depends on it.
            - paragraph [ref=f151e48]: Consistent with Rockpoint’s culture and corporate values, we are dedicated to fostering a diverse and inclusive work environment where employees from all backgrounds can thrive.
