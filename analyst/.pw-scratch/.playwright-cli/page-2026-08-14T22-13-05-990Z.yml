  - main [ref=f1315e45]:
    - generic [ref=f1315e46]:
      - heading "Careers" [level=1] [ref=f1315e47]
      - paragraph [ref=f1315e48]: Eastdil Secured Savills is the original commercial real estate investment bank and has completed more than $3 trillion in capital markets transactions over the past 20 years. We uniquely combine commercial real estate and capital markets expertise to advise provide clients with advisory services and investment strategies for all major markets, transaction types, and asset classes.
      - paragraph [ref=f1315e49]: We thrive on our intelligence-driven team, state-of-the-art technology, and collaboration across 21 offices on 3 continents. Our collective experience, expertise, and resources provide us with the ability to successfully execute the world’s most impactful transactions in the capital markets.
      - heading [level=2]
      - paragraph [ref=f1315e50]
      - heading "Culture & Community" [level=2] [ref=f1315e51]
      - paragraph [ref=f1315e52]: At Eastdil Secured Savills, our people are our greatest strength and the foundation of our culture of community and collaboration. Through teamwork and a shared commitment to excellence and innovation, we strive for individual and collective success by recruiting and retaining top talent regardless of race, gender, religion, or any other characteristic.
      - paragraph [ref=f1315e53]: We embrace the unique experiences and perspectives of each individual and are committed to providing an atmosphere where people feel welcomed, valued, connected and rewarded. As a performance-driven meritocracy, we champion equal opportunity for all while recognizing and rewarding individual contributions. Starting from recruitment, we provide mentorship and guidance to support professional growth and develop future leaders through the highest levels of the company.
      - paragraph [ref=f1315e54]: Beyond the workplace, we believe in giving back. Through partnerships, employee engagement, and community involvement, we support initiatives that make a positive impact. Together, we strengthen the communities where we live and work – making contributions that drive real, lasting change.
      - paragraph [ref=f1315e55]
      - paragraph [ref=f1315e56]
      - heading "Who We Look For" [level=2] [ref=f1315e57]
      - paragraph [ref=f1315e58]: Our people are our most valuable assets. We continually seek hard-working, like-minded individuals with exceptional interpersonal and analytic skills looking to be a part of the most productive team in commercial real estate.
      - paragraph [ref=f1315e59]: At Eastdil Secured Savills, we invest in our people to maximize their talent, knowledge, skills and experience. We operate as a unified team, sharing these characteristics throughout the firm and around the globe.
      - paragraph [ref=f1315e60]
      - paragraph [ref=f1315e61]
