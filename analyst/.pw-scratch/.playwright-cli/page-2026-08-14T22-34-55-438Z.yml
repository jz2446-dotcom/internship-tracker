                    - heading "Coordinator, Public Relations" [level=2] [ref=f1696e168]
                  - generic [ref=f1696e172]:
                    - generic [ref=f1696e173]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e174]: Posted Wednesday, August 5, 2026
                  - generic [ref=f1696e175]: "Department: Public Relations Title of Position: Coordinator, Public Relations Reports to Position: Chief Communications Officer Scope of Responsibilities: Provide general office support to Carnegie Hall’s Public Relations team. Serve as Cision system administrator, working with publicists to build digital press releases, coordinate and develop media contact lists, collect coverage, and prepare weekly press clip reports. Coordinate frequent electronic press release mailings, including HTML coding of materials. Work with PR team to support select WMI programs, including drafting press releases and pitch plans. Assist team with special projects as needed. Some press duty, including escorting photographers/video crews and staffing concerts and events Tasks & Responsibilities: Provide general administrative support to Carnegie Hall’s Public Relations team, including departmental phone coverage. Assist team with external and intradepartmental info requests as needed. Serve as Cision system coordinator, working with publicists to build digital press releases using HTML; coordinate creation and maintenance of media contact lists; and collect/prepare weekly electronic distribution of Carnegie Hall press clips to all-staff. Maintain departmental subscriptions. Complete paste-ups and scans of key articles and prepare special coverage reports as needed. Maintain media web sites (Carnegie Hall and Carnegie Hall+) to keep them updated. Prepare chronological concert listings to accompany monthly press calendars. Work with PR team to support select WMI programs, including drafting some press releases and pitch plans. Participate in promotional work tied to Carnegie Hall’s national youth ensembles, supporting photography, social media, and media research as directed. Coordinate departmental systems for computers, phones, supplies, mail, and office files (paper and shared drive). Plan for occasional assembly/mailing of hard press kits. Assist with press ticketing for concerts/events and provide back-up support for PR work with rental clients. Proofread materials for team as assigned. Help team with photo tagging projects when needed. Participate in planning for season announcement and other major events. Work concert duty for Carnegie Hall performances, handing out press tickets to journalists for CHC performances and working with photographers and videographers, all in line with Carnegie Hall press guidelines. Work press duty during the day (rehearsals) as assigned, accompanying approved cameras in the concert venues and Resnick Education Wing. Skills & Qualifications: Minimum 1–2 years of professional experience in public relations, communications, journalism, arts administration, or a related field Knowledge of classical music and interest in media/public relations is a plus Excellent organizational and interpersonal skills; Solid writing skills and strong attention to detail; Comfortable with technology, and learning new digital platforms and tools Demonstrated ability to work both independently and collaboratively as part of a team in fast-paced environment Must be available to work some evenings and weekends."
                  - link "Read more about Coordinator, Public Relations" [ref=f1696e180]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1696
                    - text: Read More
                  - generic [ref=f1696e181]: Req# 273
              - listitem [ref=f1696e183]:
                - generic [ref=f1696e185] [cursor=pointer]:
                  - link [ref=f1696e188]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1688
                    - heading "Coordinator, Development" [level=2] [ref=f1696e189]
                  - generic [ref=f1696e193]:
                    - generic [ref=f1696e194]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e195]: Posted Sunday, August 2, 2026
                  - generic [ref=f1696e196]: "Department: Development Title of Position: Coordinator, Development Reports to Position: Chief Development Officer Carnegie Hall seeks to fill the position of Coordinator, Development who provides general and specialized support to the Chief Development Officer, the Development Department more broadly, and adjunct support to the office of the Executive and Artistic Director, as needed. Responsibilities: Scheduling appointments and meetings, accompanied by preparation of agendas and minutes Assisting with writing and coordinating the production of donor reports, solicitation letters, and special acknowledgment letters Assisting with prospect research and proposal development for various departments within Development, as needed Coordinating and streamlining communications within the Development Department, and with other departments within the Administration Tracking all open projects within the department and track correspondence as it routes through the department and externally Creating monthly expense statements for the Chief Development Officer Assisting with database entry and maintenance of donor lists including assurance of database accuracy Maintaining files and database portfolio Providing support when the Executive Assistant is absent Performing other related duties and special projects as assigned Assisting with and attending performances and events as needed Qualifications: Bachelor’s degree required Some music or other arts/humanities background preferred. Must demonstrate excellent verbal and written communication skills; and have the ability to exercise excellent judgment, decorum, and diplomacy in all interactions. Ability to work with minimal supervision and maintain a high level of confidentiality required. Must be able to accurately handle diverse projects and a large volume of detailed work simultaneously and use good judgment in prioritizing work. Must be able to remain calm and focused in a high-paced environment. Must demonstrate the ability to work with information systems and software systems."
                  - link "Read more about Coordinator, Development" [ref=f1696e201]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1688
                    - text: Read More
                  - generic [ref=f1696e202]: Req# 272
              - listitem [ref=f1696e204]:
                - generic [ref=f1696e206] [cursor=pointer]:
