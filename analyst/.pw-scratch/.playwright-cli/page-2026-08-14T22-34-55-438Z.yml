                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1675
                    - heading "Manager, Patron Programs" [level=2] [ref=f1696e210]
                  - generic [ref=f1696e214]:
                    - generic [ref=f1696e215]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e216]: Posted Tuesday, July 14, 2026
                  - generic [ref=f1696e217]: "Department: Development Title of Position: Manager, Patron Programs Reports to Position: Director, Patron Programs SUMMARY OF ROLE The Manager, Patron Programs supports the annual fundraising goals of Carnegie Hall’s Patron Programs by overseeing operations that strengthen donor engagement and ensure a seamless membership experience for Patrons, Notables, and Explorers through benefit fulfillment and cultivation events. Tasks & Responsibilities: In coordination with the Director and additional Manager of Patron Programs, oversees the fulfilment of Patron benefits for all Patron groups. Manages planning and execution of 15-20 cultivation and stewardship events each season, including Patron dinners, Notables Fall and Spring events, Chairman’s Dinner, Explorers events, and offsite donor events. Manages internal and external event calendars and event-related communications, including digital invitations, website updates, and print invitation creation and mailing. Oversee RSVP tracking and guest list management. Coordinates complimentary donor ticketing allocations for events and member benefits in coordination with additional Manager. Communicates and liaises with event leadership, managing important donor relationships with underwriters and event hosts. Manages event budgets, including drafting expense budgets, processing invoices, and maintaining accurate ledger reconciliation. Oversees Patron Lounge operations, Notable Nights activations, and Box Party logistics in coordination with Event Services and Development Services. Oversees Patron tour benefit in coordination with Director and Archives team. Builds and maintains strong relationships with donors through regular engagement and event participation. Skills & Qualifications: Bachelor’s degree with 3-5 years in Individual Giving or relevant experience. Stellar written, verbal, communication, budget competencies, and organizational skills. Excellent interpersonal skills, ability to work with high level donors and trustees and engage leadership. Highly motivated, self-starter, able to work independently and manage multiple projects on tight deadlines. High attention to detail and ability to work in a fast-paced environment. Experience with Tessitura preferred but not required. Understanding of classical music and enthusiasm for the arts preferred. Requires occasional late nights for events and concerts."
                  - link "Read more about Manager, Patron Programs" [ref=f1696e222]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1675
                    - text: Read More
                  - generic [ref=f1696e223]: Req# 264
              - listitem [ref=f1696e225]:
                - generic [ref=f1696e227] [cursor=pointer]:
                  - link [ref=f1696e230]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1664
                    - heading "Manager, Customer Relations" [level=2] [ref=f1696e231]
                  - generic [ref=f1696e235]:
                    - generic [ref=f1696e236]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e237]: Posted Wednesday, July 8, 2026
                  - generic [ref=f1696e238]: "Manager, Customer Relations Department: Ticketing Services Title of Position: Manager, Customer Relations Reports to Position: Associate Director, Customer Relations Overview: Assist the Associate Director of Customer Relations in overseeing Carnegie Hall's omni-channel contact center operations, ensuring exceptional customer service across phone, email, and live chat. Provide day-to-day leadership and supervision to Customer Relations staff while supporting operational excellence, staff development, customer communications, and departmental initiatives. Serve as a resource for employees, ticket buyers, and internal stakeholders, helping to ensure a seamless and consistent ticket buying experience across all touchpoints. Required schedule for this position is Saturday–Wednesday, 12:00 PM–8:00 PM. Tasks & Responsibilities: Assist the Associate Director of Customer Relations in overseeing daily omni-channel contact center operations, including phone, email, and live chat. Demonstrate strong leadership by providing supervision, guidance, and training to Customer Relations Representatives, promoting a culture of service excellence, accountability, and teamwork. Manage and maintain weekly call center staff schedules, break schedules, and daily staffing adjustments to ensure appropriate service coverage. Prepare daily shift reports, service summaries, and communications for Ticketing Services leadership and senior staff. Assist with escalated ticket buyer interactions and complex service situations, ensuring timely and professional resolution while maintaining Carnegie Hall's customer service standards. Oversee incoming customer service and feedback communications, providing supervision and support to staff responsible for email response management. Ensure timely assignment, monitoring, and resolution of customer inquiries received through Zendesk and other ticket buyer support platforms. Prepare daily reconciliation reports and assist with other operational reporting as needed. Train new employees and provide ongoing staff training related to policies, procedures, systems, and customer service best practices. Manage call center technology and telephony systems. Prepare, distribute, and monitor ticket buyer communications including robocalls. Assist in managing and investigating issues related to online fraud, suspicious activity, chargebacks, and patron account concerns, escalating matters when appropriate. Oversee adherence to Carnegie Hall's ADA-related ticketing procedures and ensure appropriate accommodations, documentation, and follow-up are completed accurately and consistently. Coordinate with other departments, including Marketing, House Management, Booking, Box Office, Information Technology, Finance, and Human Resources to support customer service initiatives and operational needs. Perform administrative duties and special projects as assigned by the Associate Director of Customer Relations. Assist in implementing new procedures, workflows, technologies, and ticket service initiatives that improve operational efficiency and the customer experience. In addition to supervisory responsibilities, the Manager of Customer Relations performs the same customer-facing responsibilities as a Customer Relations Representative, including: Provide customer support across phone, live chat, and email in an omni-channel contact center environment. Process single ticket sales, subscription series sales, and subscription exchanges. Assist with contributions, ticket donations, and related transactions. Support workshop and rehearsal registrations and general event inquiries. Handle ticket reissuing, refunds, exchanges, and order adjustments. Guide ticket buyers through website navigation and provide support for chatbot and self-service tools. Respond to inquiries regarding performances, policies, and general Carnegie Hall information. Skills & Qualifications: A bachelor’s degree is preferred. A knowledge of music and live entertainment is desired. Leadership and supervisory experience in a customer service or contact center environment. Strong customer service, coaching, and employee development skills. Experience working in an omni-channel customer service environment including phone, email, and live chat. Ability to manage multiple priorities in a fast-paced, high-volume environment. Strong interpersonal, written, and verbal communication skills. Excellent organizational skills and attention to detail. Experience handling escalated customer situations with professionalism and sound judgment. Strong problem-solving and decision-making abilities. Proficiency with telephony software, and Microsoft Office applications. Ability to work independently while collaborating effectively with cross-functional teams. Familiarity with Tessitura and Zendesk preferred. Knowledge of performing arts ticketing and customer service operations preferred."
                  - link "Read more about Manager, Customer Relations" [ref=f1696e243]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1664
                    - text: Read More
                  - generic [ref=f1696e244]: Req# 270
              - listitem [ref=f1696e246]:
                - generic [ref=f1696e248] [cursor=pointer]:
                  - link [ref=f1696e251]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1644
                    - heading "Coordinator, Corporate Relations & Sponsorships" [level=2] [ref=f1696e252]
                  - generic [ref=f1696e256]:
                    - generic [ref=f1696e257]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e258]: Posted Monday, June 15, 2026
                  - generic [ref=f1696e259]: "We seek a Coordinator, Corporate Relations & Sponsorships to collaborate with the team in all functions of Carnegie Hall’s robust corporate sponsorship and membership program, raising vital funds for Carnegie Hall’s performance presentations, music education and social impact programs, and digital initiatives. The Coordinator’s responsibilities will include, but are not limited to: written annual solicitations and gift acknowledgments; prospect research; activity tracking including via database including report generation, and monitoring action items for all department members; corporate member employee benefits management and direct communications; reviewing and communicating with sponsors regarding print and digital recognition materials; department financials including gifts and expenses; assistance with/attendance at hospitality events, on-site and off-site activations; as well as vital administrative duties related to all department activity. BA/BS degree required with preferred 2-3 years of professional experience. Individual must possess attention to detail and strong organizational skills, and the ability to prioritize and pivot in a fast-paced environment. Strong written communication skills are essential, as well as a spirit of flexibility, enthusiasm, collaboration. Computer knowledge and experience with database management, specifically Tessitura, is helpful. An expectation of some evening and weekend hours during performance season."
                  - link "Read more about Coordinator, Corporate Relations & Sponsorships" [ref=f1696e264]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1644
                    - text: Read More
                  - generic [ref=f1696e265]: Req# 267
              - listitem [ref=f1696e267]:
                - generic [ref=f1696e269] [cursor=pointer]:
                  - link [ref=f1696e272]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1640
                    - heading "Assistant Director, Special Events" [level=2] [ref=f1696e273]
                  - generic [ref=f1696e277]:
                    - generic [ref=f1696e278]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e279]: Posted Sunday, June 14, 2026
                  - generic [ref=f1696e280]: "Department: Development Title of Position: Assistant Director, Special Events Reports to Position: Director, Special Events Scope of responsibilities: The Assistant Director of Special Events is an integral member of a five-person team and serves as a senior fundraising strategist for the Special Events department, leading the development and execution of comprehensive revenue strategies for approximately four major fundraising events annually. This role leads the fundraising strategy for the organization’s galas, including establishing contribution levels, building and managing sales matrices and revenue projections, determining prospects for each contribution level, and developing targeted sales strategies and messaging to drive sponsorship, leadership, table, and ticket sales. The Assistant Director oversees prospect pipelines and donor engagement strategies, ensuring alignment with institutional fundraising priorities while working closely with Development leadership to maximize philanthropic revenue. The Assistant Director serves as project lead for 1–2 major galas each season, providing strategic leadership from concept through execution and maintaining direct communication with senior leadership and key stakeholders to ensure successful delivery of event goals and revenue targets. In addition, the Assistant Director manages the day-to-day operations and workflow of the team to ensure an efficient, high-performing, and results-driven operation. This includes overseeing staff workload, approving gift entry and revenue tracking, reviewing print and digital fundraising materials, and ensuring accuracy of prospect and solicitation lists used across event campaigns. The role also oversees key operational elements of gala execution, including dinner seating strategy to support donor cultivation and stewardship. Through strategic planning, strong project management, and cross-departmental collaboration, the Assistant Director plays a critical role in maximizing fundraising outcomes and delivering exceptional special events that advance the organization’s mission. Qualifications Bachelor's Degree 7 years of professional experience preferably in events and/or non-profit organization A background with working with high-level donors and trustees. Management experience to track revenue and donor financials Excellent writing skills and solicitation strategies Speed and accuracy in a fast-paced work environment with the ability to prioritize the entire Special Events department Excellent communication and organizational skills, plus efficiency in office procedure Computer facility critical and Tessitura or Raiser’s Edge experience necessary. Evening and weekend hours around the Special Events schedule are required during performance season."
                  - link "Read more about Assistant Director, Special Events" [ref=f1696e285]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1640
                    - text: Read More
                  - generic [ref=f1696e286]: Req# 266
              - listitem [ref=f1696e288]:
                - generic [ref=f1696e290] [cursor=pointer]:
                  - link [ref=f1696e293]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1599
                    - heading "Senior Manager, Ensemble Connect" [level=2] [ref=f1696e294]
                  - generic [ref=f1696e298]:
                    - generic [ref=f1696e299]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e300]: Posted Wednesday, May 6, 2026
                  - generic [ref=f1696e301]: Carnegie Hall seeks a Senior Manager, Ensemble Connect - a program of Carnegie Hall, the Juilliard School, and the Weill Music Institute in partnership with the NYC Department of Education. The Senior Manager plays a key part in shaping a two-year fellowship that blends high level performances with meaningful education and community engagement. A particular focus for this position is leading the two-year arc of experience of professional development, managing artistic planning for the program, and overseeing recruitment and auditions. Administratively, the Senior Manager will oversee budget maintenance and contracting.The Senior Manager will complete a team of three and will be expected to bring a positive, collaborative, and flexible professional attitude to the workplace. Some weekend and evening work is necessary based on program activities. Professional Development Lead the process of creating professional development content for fellows and school partners each year with a focus on the two-year arc of experience and intentional scope and sequence. Prepare fellows for upcoming sessions and attend all PD activities Develop observation and assessment tools Manage all coaching and lesson requests Performance Lead and facilitate programming process for all Ensemble Connect concerts Manage personnel hiring for performances Assist in selecting Up‑Close Artistic Partners Attend Ensemble Connect performances Collaborate on production requirements as needed Recruitment & Auditions Lead recruitment, audition, and admissions processes Hire and contract prescreen and audition panelists and related personnel Update audition requirements annually Chair live audition panels Residencies Co‑lead planning and execution of biannual Skidmore Residencies, including attending two Skidmore residencies per year Support development and delivery of additional residency opportunities School Partnerships Assist with partner school recruitment and selection as needed The Connected Musician Collaborate on creation, development, and rollout of Connected Musician content Identify opportunities to share content throughout the season Administrative Oversee daily budget maintenance Manage contracting for all Ensemble Connect hires Serve as liaison with other Carnegie Hall departments Collaborate with the Ensemble Connect administrative team Support general program operations as needed Qualifications 7+ years of experience in performance, arts administration, artist development, or related fields Commitment to Ensemble Connect’s mission, goals and values Knowledge of classical chamber music Strong organizational and administrative skills Demonstrated experience designing or managing educational or professional development programs Proven ability to lead complex projects and coordinate across multiple stakeholders Excellent communication, facilitation, and relationship‑building skills Ability to work collaboratively across departments and partner institutions Commitment to equity and access in the arts Availability to attend performances, residencies, and program events as required
                  - link "Read more about Senior Manager, Ensemble Connect" [ref=f1696e306]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1599
                    - text: Read More
                  - generic [ref=f1696e307]: Req# 262
              - listitem [ref=f1696e309]:
                - generic [ref=f1696e311] [cursor=pointer]:
                  - link [ref=f1696e314]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1543
                    - heading "BI Data Architect" [level=2] [ref=f1696e315]
                  - generic [ref=f1696e319]:
                    - generic [ref=f1696e320]: Carnegie Hall, 881 7th Avenue, New York, New York, United States of America
                    - generic [ref=f1696e321]: Posted Thursday, February 5, 2026
                  - generic [ref=f1696e322]: "Department: Business Intelligence Title of Position: BI Data Architect Reports to Position: Director, BI & Web Development SUMMARY OF ROLE The BI Data Architect is a strategic leadership role responsible for architecting and advancing Carnegie Hall’s data ecosystem. This position ensures that data is a trusted, governed asset for decision-making across the organization, driving innovation and empowering business users. The role oversees the design, deployment, and management of the department’s data infrastructure and integrations to support current and future initiatives. It requires exceptional technical expertise, analytical thinking, and experience navigating complex organizational structures, combined with strong communication skills to foster collaboration across stakeholder groups. PRIMARY RESPONSIBILITIES & DUTIES:Data Architecture & Governance Design, deploy, and manage the department’s data architecture, including data inventories, ingestion, ETL/ELT processes, and warehouse/data lake design. Establish and enforce robust data governance standards for storage, consumption, integration, and management; translate these principles into scalable, functional data models aligned with organizational objectives. Implement systems and monitoring to ensure data quality, accuracy, performance, and security. Develop data governance schema, documentation and policies that meet business standards. · Analytics & Visualization Champion the use of Microsoft Fabric and Power BI for unified analytics, reporting, and self-service BI. Focus on designing, building, and managing data pipelines and lakehouses using Microsoft Fabric's tools (Pipelines, Dataflows, Notebooks) to move data through Bronze (raw ingestion), Silver (cleaned/enriched), and Gold (curated for BI/analytics) layers. Collaborate with analysts to translate data architecture into end-user dashboards and provide technical oversight to ensure adherence to governance standards. · Integration & API Management Manage API governance to deliver reliable integrations. Drive adoption of API-first architecture to support scalability and modernization. · Strategic Leadership Contribute to the roadmap for architecture changes and future initiatives, aligning with organizational goals. Evaluate existing data and analytics stack for best practices, security, and performance; recommend improvements. Provide mentorship and technical leadership to staff on data architecture, integration, and pipelines. · Innovation & Continuous Improvement Explore emerging tools and technologies to enhance data visualization, integration, and analytics capabilities. Support reactive stakeholder incidents and ensure timely resolution. Promote self-service enablement for business users. Knowledge and curiosity around AI enablement, including an understanding of how data architecture, governance, and data quality directly support machine learning and generative AI use cases REQUIREMENTS & QUALIFICATIONS: · Education & Experience Bachelor’s degree or equivalent work experience. 5–10 years of experience in data architecture · Technical Expertise Experience with Azure Data Factory, Azure Data Lake Storage, and Azure Storage Explorer for orchestration and data management. Knowledge of Azure API Management for API lifecycle governance, security, and versioning during migrations. Expertise in Power BI for enterprise reporting and integration with governed data models. Expertise with Microsoft Fabric for unified analytics and orchestration of data pipelines. Advanced knowledge of T-SQL and Azure Programming skills in Python (and optionally JavaScript and C#) for data engineering and automation. Expertise with SSRS, Power BI, and modern data reporting tools. · Additional Skills Strong understanding of data governance, security, and compliance frameworks. Excellent communication and stakeholder engagement skills. Ability to mentor technical teams while driving strategic initiatives. This is not a remote position. The role requires an in‑office start, with eligibility for a hybrid schedule at the manager’s discretion after the first three months."
                  - link "Read more about BI Data Architect" [ref=f1696e327]:
                    - /url: /en-US/carnegie/CANDIDATEPORTAL/jobs/1543
                    - text: Read More
