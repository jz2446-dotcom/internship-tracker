            - emphasis [ref=f174e79]: Qualifications
            - list [ref=f174e80]:
              - listitem [ref=f174e81]:
                - emphasis [ref=f174e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f174e83]:
                - emphasis [ref=f174e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f174e85]:
                - emphasis [ref=f174e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f174e87]:
