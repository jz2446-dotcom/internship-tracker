      - generic [ref=f14e134]:
        - heading "Meaning & History" [level=2] [ref=f14e137]
        - generic [ref=f14e138]:
          - text: From the Germanic name Hrodebert meaning "bright fame", derived from the elements
          - link "hruod" [ref=f14e140] [cursor=pointer]:
            - /url: /element/hruod
          - text: "\"fame\" and"
          - link "beraht" [ref=f14e142] [cursor=pointer]:
            - /url: /element/beraht
          - text: "\"bright\" . The"
          - link "Normans" [ref=f14e143] [cursor=pointer]:
            - /url: /glossary/view/normans
          - text: introduced this name to Britain, where it replaced the rare Old English
          - link "cognate" [ref=f14e144] [cursor=pointer]:
            - /url: /glossary/view/cognate
          - text: Hreodbeorht. It has been consistently among the most common English names from the 13th to 20th century. In the United States it was the most popular name for boys between 1924 and 1939 (and again in 1953).
          - paragraph
          - text: This name has been borne by two kings of the Franks, two dukes of Normandy, and three kings of Scotland, including Robert the Bruce who restored the independence of Scotland from England in the 14th century. Several
          - link "saints" [ref=f14e145] [cursor=pointer]:
            - /url: /glossary/view/saint
          - text: have also had the name, the earliest known as Saint
          - link "Rupert" [ref=f14e146] [cursor=pointer]:
            - /url: /name/rupert
          - text: ", from an Old German variant. The author Robert Browning (1812-1889) and poets Robert Burns (1759-1796) and Robert Frost (1874-1963) are famous literary namesakes. Other bearers include Robert E. Lee (1807-1870), the commander of the Confederate army during the American Civil War, and American actors Robert Redford (1936-2025), Robert De Niro (1943-) and Robert Downey Jr. (1965-)."
