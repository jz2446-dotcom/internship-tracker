            - heading "Cindy Le" [level=2] [ref=f796e25]
            - heading "Analyst" [level=3] [ref=f796e26]
          - paragraph [ref=f796e29]: Cindy is responsible for project management and manager due diligence at Park Madison Partners. In this role, she works with Park Madison’s senior leadership team providing capital raising and advisory services to the firm’s commercial real estate clients and helps diligence new business prospects. Prior to joining Park Madison Partners, Cindy was an Investment Summer Analyst at PGIM Real Estate.Cindy earned her BSBA with a Concentration in Real Estate Finance from Babson College.
    - generic [ref=f796e31]:
      - heading "Questions & Answers" [level=2] [ref=f796e32]
      - generic [ref=f796e33]:
        - generic [ref=f796e35]:
          - heading "How did you end up in your role at Park Madison?" [level=3] [ref=f796e36]
          - paragraph
          - paragraph [ref=f796e37]: I was introduced to Park Madison Partners through Coffee Connectors, an initiative by Northbridge Partners that helps first-generation college students interested in commercial real estate establish their networks and land internships. I was fortunate to intern at Park Madison Partners through the Coffee Connectors opportunity internship program during my sophomore year. The experience was so valuable that I decided to return full-time after graduation.
          - paragraph
        - generic [ref=f796e39]:
          - heading "What is the most important part of your job?" [level=3] [ref=f796e40]
          - paragraph
          - paragraph [ref=f796e41]: My team. As a young professional just starting my career, I really value being part of a team I can learn from and look up to. During my internship, I was able to ask questions and receive guidance from senior leadership which is a rare opportunity that's unique to a boutique firm like Park Madison Partners. That mentorship has been invaluable to my professional development.
          - paragraph
        - generic [ref=f796e43]:
          - heading "If you weren't in financial services, what would you be doing?" [level=3] [ref=f796e44]
          - paragraph
          - paragraph [ref=f796e45]: I would love to work in fashion. I've had a passion for it since I was young, and I'm drawn to the creative expression that comes through clothing and accessories.
          - paragraph
