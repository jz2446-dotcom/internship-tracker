            - generic [ref=f807e75]:
              - paragraph [ref=f807e76]:
                - strong [ref=f807e77]: "COMPANY OVERVIEW:"
              - paragraph [ref=f807e78]
              - paragraph [ref=f807e79]: Nuveen Real Estate is one of the largest real estate investment managers in the world with $125 billion of assets under management. Managing a suite of funds and mandates, across both public and private investments, and spanning both debt and equity across diverse geographies and investment styles, we provide access to every aspect of real estate investing.
              - paragraph [ref=f807e80]
              - paragraph [ref=f807e81]:
                - strong [ref=f807e82]: "POSITION SUMMARY:"
              - paragraph [ref=f807e83]
              - paragraph [ref=f807e84]:
                - text: During a 10 week summer internship, you will work with our real estate investment management teams across Product and Solutions, Research, Asset Management, and Transactions. The intent of the internship is to provide a robust, cross-functional experience with our real estate platform to ensure a valuable, educational and mutually beneficial internship. Interns will be place in our New York City, Charlotte, or Newport Beach office depending on the team they are working with.
                - strong [ref=f807e85]: Please apply directly through our careers site
                - text: (link included below).
              - paragraph [ref=f807e86]
              - paragraph [ref=f807e87]:
                - strong [ref=f807e88]: "KEY RESPONSIBILITIES AND DUTIES:"
              - paragraph [ref=f807e89]: "Typical Intern related responsibilities may include:"
              - list [ref=f807e90]:
                - listitem [ref=f807e91]: Perform underwriting and market research of potential acquisitions targets using Argus and Excel
                - listitem [ref=f807e92]: Contribute to production of investment memorandums
                - listitem [ref=f807e93]: Support transactions officers in the due diligence and closing of acquisitions and dispositions
                - listitem [ref=f807e94]: Maintain and source information for the team’s acquisitions pipeline
                - listitem [ref=f807e95]: Keep Research Team up to date with local market trends and topics – ensure relevant data bases are created and maintained
                - listitem [ref=f807e96]: Participate in industry events
                - listitem [ref=f807e97]: Research and analysis of industry trends, competitors and product characteristics to support product development activities
                - listitem [ref=f807e98]: Preparation of detailed product presentations, proposals and recommendations
                - listitem [ref=f807e99]: Responding to inquiries from external business partners, as well as business partners across the organization
                - listitem [ref=f807e100]: Ensure that the investment stories for assigned products are presented consistently and that the products are properly positioned across all customer touch points
                - listitem [ref=f807e101]: Screen, evaluate, and help execute on new product, new business, M&A and partnership opportunities that align with the overall NRE strategy
                - listitem [ref=f807e102]: Participate and contribute to pipeline discussions and teleconferences as required
                - listitem [ref=f807e103]: Develop and manage detailed project plans in support of product development and product enhancement initiatives
              - paragraph [ref=f807e104]
              - paragraph [ref=f807e105]:
                - strong [ref=f807e106]: "QUALIFICATIONS:"
              - paragraph [ref=f807e107]:
                - strong [ref=f807e108]: "Required Skills:"
              - list [ref=f807e109]:
                - listitem [ref=f807e110]: Currently pursuing a Bachelor’s Degree, preferably majoring in business, real estate, or finance
                - listitem [ref=f807e111]: Graduating between December 2020 and August 2021
              - list [ref=f807e112]:
                - listitem [ref=f807e113]:
                  - strong [ref=f807e114]: Minimum GPA of 3.0 or better
                  - strong [ref=f807e115]
              - paragraph [ref=f807e116]:
                - strong [ref=f807e117]: Desired Skills
              - list [ref=f807e118]:
                - listitem [ref=f807e119]: Interest in or a basic understanding of investment markets
                - listitem [ref=f807e120]: Strong communication, word, excel and PowerPoint skills
                - listitem [ref=f807e121]: Financially astute, well-structured and analytical
                - listitem [ref=f807e122]: Analytical with sound business judgment
                - listitem [ref=f807e123]: Strong analytical skills and ability to create and run detailed financial analysis for real estate investment
                - listitem [ref=f807e124]: Ability to operate across business functionalities and regions if and when required
                - listitem [ref=f807e125]: Excellent organizational and time management skills , with a proven ability to set and work to priorities and deadlines
                - listitem [ref=f807e126]: An ability to work independently and proactively in a small team for the greater good of Nuveen Real Estate
                - listitem [ref=f807e127]: A strong sense of ‘team’ and a strong focus on client/investor requirements
                - listitem [ref=f807e128]: Obvious enjoyment, involvement, achievement and personal satisfaction in the role
