      - generic [ref=f431e20]:
        - heading "We Are at the Front Lines of Clean Energy Finance" [level=1] [ref=f431e22]
        - generic [ref=f431e23]:
          - paragraph [ref=f431e24]: At CleanCapital, we are leading the industry with bold innovations in climate finance. And we are laser-focused on achieving a fully decarbonized future.
          - paragraph [ref=f431e25]: Our close-knit, dynamic team is made up of experts dedicated to accelerating investments in clean energy. We are looking for team members who share our drive, our passion for renewable energy, and our belief that individuals can make a difference in the fight against the climate crisis. Exchange ideas. Grow with us. And help to build something great.
    - generic [ref=f431e30]:
      - generic [ref=f431e31]:
        - heading "Benefits for every aspect of your life" [level=2] [ref=f431e33]
        - generic [ref=f431e34]:
          - paragraph [ref=f431e35]: We believe that the highest-performing team is one where employees are fulfilled in their work life and also outside of it. That’s why we prioritize employee wellness and personal success.
          - paragraph [ref=f431e36]: CleanCapital offers a holistic benefits program that supports physical, mental-emotional, and financial wellness. Ample paid time off, flexible work schedules including hybrid and remote work, and fully paid-for benefits are just some of the ways we support our team and their families.
          - paragraph [ref=f431e37]: We frequently survey the market to ensure that CleanCapital’s salary and bonus programs are fair and competitive. And we give employees opportunities to develop their career within the company based on individual goals. Meaningful career advancement opportunities include paid-for trainings, cross-functional projects, leadership programs, & dynamic options that may allow for the ability to move geographically, functionally, laterally, and vertically.
      - generic [ref=f431e38]:
        - generic [ref=f431e40]:
          - heading "Competitive Compensation" [level=4] [ref=f431e41]
          - paragraph [ref=f431e42]: High-performance culture rewards innovation, collaboration and achievement with competitive salaries & annual bonuses.
        - generic [ref=f431e44]:
          - heading "Free Health Coverage" [level=4] [ref=f431e45]
          - paragraph [ref=f431e46]: Fully paid-for medical, dental, vision coverage for employees and eligible dependents plus wellness benefits like a Healthy Living reimbursement.
        - generic [ref=f431e48]:
          - heading "Holistic Employee Support" [level=4] [ref=f431e49]
          - paragraph [ref=f431e50]: 16 weeks of 100% paid parental leave, flexible schedules including fully remote & hybrid work, & access to free 24/7 Employee Assistance Program.
        - generic [ref=f431e52]:
          - heading "Generous Paid Time Off" [level=4] [ref=f431e53]
          - paragraph [ref=f431e54]: Unlimited paid time off plus 11 paid holidays.
        - generic [ref=f431e56]:
          - heading "Financial Peace of Mind" [level=4] [ref=f431e57]
          - paragraph [ref=f431e58]: 401k with company match & fully paid-for short term disability, long term disability, & basic life insurance coverage.
