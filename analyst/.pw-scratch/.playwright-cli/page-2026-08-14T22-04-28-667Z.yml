          - heading "Our Commitment to Diversity" [level=4] [ref=f431e66] [cursor=pointer]
          - paragraph [ref=f431e68]: CleanCapital is committed to fostering a diverse and equitable workforce reflective of our community while also valuing each persons’ unique perspective, skills, and experiences. CleanCapital does not discriminate against any individual’s race, religion, sexual orientation, gender identity, age or nationality and is committed to promoting a more just and inclusive world through intentional policies and actions.
        - generic [ref=f431e69]:
          - heading "Equal Employment Opportunity Statement" [level=4] [ref=f431e71] [cursor=pointer]
          - paragraph [ref=f431e73]: CleanCapital provides equal employment opportunities to all employees and applicants in all company facilities without regard to race, color, religious creed, sex, national origin, ancestry, citizenship status, pregnancy, childbirth, physical disability, mental and/or intellectual disability, age, military status or status as a Vietnam-era or special disabled veteran, marital status, registered domestic partner or civil union status, gender (including sex stereotyping and gender identity or expression), medical condition (including, but not limited to, cancer related or HIV/AIDS related), genetic information, or sexual orientation in accordance with applicable federal, state and local laws.
    - generic [ref=f431e75]:
      - generic [ref=f431e76]:
        - heading "Why CleanCapital" [level=2] [ref=f431e78]
        - generic [ref=f431e79]:
          - paragraph [ref=f431e80]: We know that individuals with talent and drive have lots of options in a competitive job market. But we also know that the average person spends one third of their life at work, and that a great (or terrible) work environment can have an enormous impact on one’s health and happiness.
          - paragraph [ref=f431e81]: CleanCapital offers a fantastic team environment and collaborative company culture that puts employees first. We lead with transparency and integrity, always. And we encourage everyone to bring their whole self to work. Join us in our mission to lead the energy transition, doing work that matters within a team that supports and values one another.
          - paragraph [ref=f431e82]
