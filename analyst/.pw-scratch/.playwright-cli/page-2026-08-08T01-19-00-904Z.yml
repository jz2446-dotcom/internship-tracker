              - text: Full and part-time job opportunities at Nashville Public Library are listed on
              - link "Metro Nashville Career Opportunities" [ref=f37e169] [cursor=pointer]:
                - /url: https://www.governmentjobs.com/careers/nashville
              - text: ", along with all Metropolitan Government of Nashville and Davidson County job openings. Select \"Library\" from the options list to view only Library job listings. Nashville Public Library only accepts applications for currently posted positions. Applications must be submitted by 11:59 PM CT of the announced closing date."
            - paragraph [ref=f37e170]:
              - emphasis [ref=f37e171]: Nashville Public Library is an Equal Opportunity Employer
            - 'heading "Part-time employment: Less than 32 hours per week" [level=3] [ref=f37e172]'
            - paragraph [ref=f37e173]: Most positions are budgeted for 19.5 hours per week with no benefits and may require evening and weekend work.
            - 'heading "Full-time employment: 32–40 hours per week" [level=3] [ref=f37e174]'
            - paragraph [ref=f37e175]: Some locations are open 7 days a week, with various shifts requiring evening and weekend work. Benefits include medical, dental, vision, life, and pension, 10 vacation days per year (increasing after 5 years), 12 sick days per year, and 10 paid holidays.
            - paragraph [ref=f37e176]: Contact the Library's Human Resources department at (615) 862-5770 for questions regarding application procedures.
            - paragraph [ref=f37e177]:
              - link "View Metro Government Job Opportunities" [ref=f37e178] [cursor=pointer]:
