              - heading "The History of the Rothschilds" [level=2] [ref=f111e256]
              - paragraph [ref=f111e257]: The Rothschilds first rose to prominence as a European banking family in the 1700s. The first Rothschild patriarch, Mayer Amschel Rothschild, grew up in the Jewish ghetto in Frankfurt, Germany.
              - paragraph [ref=f111e258]: Through his father's textiles company, Mayer Amschel Rothschild was able to learn trading and eventually became a dealer in rare coins. That occupation brought him to the attention of the crown prince, for whom he later worked.
              - paragraph [ref=f111e259]: After marrying the daughter of a money changer, he had 10 children. The family moved from Germany to France, Italy, Austria and the United Kingdom—with its branches of lenders and traders linking to create one of the first international banks.
              - paragraph [ref=f111e261]: Among the successful early Rothschilds was Nathan Mayer Rothschild, who moved to Manchester, England, to set up a textiles business and then to London to establish the N.M. Rothschild bank, which is still in operation.
              - generic [ref=f111e262]: ADVERTISING
              - paragraph [ref=f111e263]: Nathan Mayer Rothschild also helped to finance the British army in its fight against Napoleon. His involvement in the conflict was the subject of an early conspiracy theory about the family, with some claiming that he paid to go to the Battle of Waterloo so he could profit from announcing that Britain had won the war.
              - paragraph [ref=f111e264]: He and his daughter Louise Rothschild also paid for the creation of synagogues in London and Jewish Free Schools across Europe.
              - heading "Which Rothschilds Are Alive Today?" [level=2] [ref=f111e265]
              - paragraph [ref=f111e266]: Many Rothschilds still live in Europe, as well as in Israel and the United States. Emma Rothschild is a history professor at Harvard and an honorary professor at Cambridge. David Mayer de Rothschild is an environmental activist, and Hannah Rothschild is an author.
              - paragraph [ref=f111e267]:
