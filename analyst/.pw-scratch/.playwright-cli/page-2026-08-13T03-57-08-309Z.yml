              - paragraph [ref=f111e210]: The Rothschild family, known for its work in banking, real estate and philanthropy, has existed as a financial dynasty since the 18th century.
              - paragraph [ref=f111e211]:
                - text: Amid centuries of success, the Rothschilds have been the
                - link "subject of conspiracy theories" [ref=f111e212] [cursor=pointer]:
                  - /url: https://www.newsweek.com/lara-logan-rothschild-charles-darwin-evolution-theory-1692813
                - text: ", with many alleging that the prominent Jewish family has undue influence over global politics."
              - generic [ref=f111e213]: ADVERTISING
              - paragraph [ref=f111e214]:
                - text: The Rothschilds have long been accused of running a global financial cabal in the 19th century, while recent antisemitic conspiracy theories claim they
                - link "control natural disasters to profit from them" [ref=f111e215] [cursor=pointer]:
                  - /url: https://www.newsweek.com/trayon-white-srs-trip-holocaust-museum-went-badly-you-might-expect-894750
                - text: —a theory put forward by Washington, D.C., Councilmember Trayon White Sr. in 2018.
              - region "Loading related stories" [ref=f111e216]:
