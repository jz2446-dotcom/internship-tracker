              - paragraph [ref=f111e244]: After making its money through financial institutions over the past three centuries, the family, which can trace its history back to Germany, now has many members in Europe, Israel and the United States.
              - paragraph [ref=f111e245]:
                - text: On Wednesday, a member of the family, Will Rothschild,
                - link "reportedly died in a house fire" [ref=f111e246] [cursor=pointer]:
