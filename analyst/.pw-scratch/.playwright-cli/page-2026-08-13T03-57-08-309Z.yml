              - heading "Who Was Will Rothschild, and How Did He Die?" [level=2] [ref=f111e277]
              - paragraph [ref=f111e278]: On Wednesday, a million-dollar Hollywood home believed to be owned by Will Rothschild, an older and more reclusive member of the family, went up in flames.
              - paragraph [ref=f111e279]: The Los Angeles Fire Department said in a news release, "In a systematic search inside the burned premises, firefighters discovered the body of an elder male, who was determined to be deceased at the scene."
              - paragraph [ref=f111e280]: The medical examiner's office for Los Angeles County has not determined the identity of the body, but neighbors said the house belonged to Will Rothschild, leading them to believe he had died in the fire.
              - generic [ref=f111e281]: ADVERTISING
              - paragraph [ref=f111e282]: "One of his neighbors, Jim Moore, told local news channel KABC: \"It is very sad. He was a good guy. A good neighbor.\""
              - heading "How Much Is the Rothschild Family Worth?" [level=2] [ref=f111e283]
              - paragraph [ref=f111e284]:
                - text: The combined wealth of the Rothschild family across all its branches is estimated to be $15.7 trillion. A more conservative estimate from a
                - emphasis [ref=f111e285]: Sunday Times
                - text: report in 2023 said the Rothschilds were worth $1 billion.
              - paragraph [ref=f111e286]: The family did not appear on the outlet's 2024 Rich List.
