              - heading "What Companies Do the Rothschilds Own?" [level=2] [ref=f111e295]
              - paragraph [ref=f111e296]: The Rothschilds own and sit on the boards of various companies. Nathaniel Rothschild was the co-chair of the hedge fund Atticus Capital from 1996 until it closed in 2009.
              - paragraph [ref=f111e297]: He is now the executive chairman of the board of directors at Volex, an electrical manufacturing company.
              - paragraph [ref=f111e298]: Lynn Forester de Rothschild is the CEO of E.L. Rothschild, a company with investments in media, including the Economist Group.
              - paragraph [ref=f111e299]: David Mayer de Rothschild launched a sustainable clothing brand called the Lost Explorer. The brand also sells mezcal.
