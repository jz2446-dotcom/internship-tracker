      - article [ref=f51e41]:
        - generic [ref=f51e42]:
          - heading "(P/T) Engagement Coordinator at The Digital Public Library of America (DPLA)" [level=1] [ref=f51e44]
          - generic [ref=f51e45]:
            - generic [ref=f51e46]:
              - generic [ref=f51e47]: " Posted on:"
              - link [ref=f51e48] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/2025/03/18/p-t-engagement-coordinator-at-the-digital-public-library-of-america-dpla/
                - time [ref=f51e49]: March 18, 2025
              - text: 
            - generic [ref=f51e50]:
              - generic [ref=f51e51]: " Written by:"
              - link "Charlie Maliha" [ref=f51e52] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/author/cm6232/
          - generic [ref=f51e53]:
            - paragraph [ref=f51e54]: "Job Title: Engagement Coordinator"
            - paragraph [ref=f51e55]: "Job Status: Part-time"
            - paragraph [ref=f51e56]: "Location: Remote"
            - paragraph [ref=f51e57]: "Salary: $2,500 – $2,833 monthly"
            - separator [ref=f51e58]
            - paragraph [ref=f51e59]:
              - strong [ref=f51e60]: DPLA Engagement Coordinator, part-time
              - text: "Summary: Conduct partner outreach in support of DPLA’s 2025 goals. Target Start Date: May 1, 2025"
            - paragraph [ref=f51e61]:
              - text: The
              - link "Digital Public Library of America" [ref=f51e62] [cursor=pointer]:
                - /url: https://dp.la/
              - text: (DPLA) amplifies the value of libraries and cultural organizations as Americans’ most trusted sources of shared knowledge. We do this by collaborating with partners to accelerate innovative tools and ideas that empower and equip libraries to make information more accessible.
            - paragraph [ref=f51e63]: DPLA seeks a strategic, and team-oriented colleague to support our work connecting archives, libraries and museums. A successful candidate will be passionate about free-to-use cultural heritage as fundamental to DPLA’s mission to maximize access to our shared history, culture, and knowledge. A desire to advance this work, in a collaborative spirit within and beyond the organization, is essential.
            - paragraph [ref=f51e64]: The ideal candidate will be an exceptional communicator, with the ability to analyze and present complex ideas effectively to different audiences. The candidate should also have sound judgment, diplomacy, and discretion, and feel comfortable working with people of all levels and backgrounds, internally and externally. The ideal candidate will be intellectually curious, enthusiastic about the work and possess a self-awareness of their strengths and areas for growth.
            - paragraph [ref=f51e65]: "Responsibilities include:"
            - list [ref=f51e66]:
              - listitem [ref=f51e67]: Outreach and collaborating with institutional partners to build interest, support and engagement for this project
              - listitem [ref=f51e68]: Developing and implementing training workshops and conducting trainings with and for our partner institutions
              - listitem [ref=f51e69]: Educating partners on rights and metadata issues
              - listitem [ref=f51e70]: Conducting partner trainings and webinars about DPLA’s Wikimedia project
              - listitem [ref=f51e71]: Building the capacity of DPLA and its partners for contributing to Wikimedia Commons
              - listitem [ref=f51e72]: Participating in DPLA Working Groups
              - listitem [ref=f51e73]: Codifying project findings and work products for replication
            - paragraph [ref=f51e74]: Requirements
            - list [ref=f51e75]:
              - listitem [ref=f51e76]: Familiarity with the needs and challenges of digital practices and systems of archives, libraries and museums, including cultural heritage metadata standards.
              - listitem [ref=f51e77]: Excellent verbal and written communication skills, including the ability to relay complex concepts and projects in depth to broad audiences.
            - paragraph [ref=f51e78]: Preferred Qualifications
            - list [ref=f51e79]:
              - listitem [ref=f51e80]: Familiarity with DPLA and its work would be great to have, but we will train the right person.
              - listitem [ref=f51e81]: Experience working with community archives historically underrepresented by projects like ours.
              - listitem [ref=f51e82]: Experience working with remote and small distributed teams.
              - listitem [ref=f51e83]: Working knowledge of Wikimedia community policies and practices
            - paragraph [ref=f51e84]: This is a part-time temporary position working 20 hours per week through 2025. The position will be compensated in the monthly rate range of $2,500 to $2,833, depending on skills and experience, and paid semi-monthly. The hours have the potential to grow and there may be the possibility of renewal at the end of the year. Part-time employees are eligible for medical, dental, and vision benefits as well as flexible pto. This position is fully or partially funded by grants; the position is contingent upon the continuation of such program funding. Applicants must be authorized to work in the United States, this is a remote only position.
            - paragraph [ref=f51e85]: DPLA strives to create an inclusive work environment for everyone. We embrace and celebrate the unique experiences, perspectives and cultural backgrounds that each employee brings to our workplace. DPLA strives to foster an environment where our employees feel respected, valued and empowered.
            - paragraph [ref=f51e86]:
              - strong [ref=f51e87]: About the Digital Public Library of America
            - paragraph [ref=f51e88]:
              - text: The Digital Public Library of America amplifies the value of libraries and cultural organizations as Americans’ most trusted sources of shared knowledge. We do this by collaborating with partners to accelerate innovative tools and ideas that empower and equip libraries to make information more accessible. DPLA is a 501(c)(3) non-profit. Visit
              - link "https://dp.la" [ref=f51e89] [cursor=pointer]:
                - /url: https://dp.la/
              - text: .
            - paragraph [ref=f51e90]:
              - text: Application review will continue until the position is filled.
              - link "Please submit an application here." [ref=f51e91] [cursor=pointer]:
                - /url: https://digital-public-library-of-america.breezy.hr/p/1493906f8a0e-dpla-engagement-coordinator-part-time
            - paragraph [ref=f51e92]: This job was sourced via WordsofMouth newsletter.
