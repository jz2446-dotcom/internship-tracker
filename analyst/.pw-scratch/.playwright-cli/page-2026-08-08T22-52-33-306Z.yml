      - generic [ref=f931e111]:
        - heading "Fellowship and Internship Opportunities" [level=2] [ref=f931e112]
        - paragraph [ref=f931e113]: The Saint Louis Art Museum is committed to building the community of arts professionals through internships and fellowships across a range of Museum departments.
        - heading "ROMARE BEARDEN GRADUATE MUSEUM FELLOWSHIP" [level=3] [ref=f931e114]
        - paragraph [ref=f931e115]: The Romare Bearden Graduate Museum Fellowship honors the pioneering artist’s legacy by providing opportunities to early-career museum professionals. The goal of the Fellowship is to promote greater access to the field for individuals from backgrounds that are historically and statistically underrepresented at American art museums. During the two-year paid Fellowship, Fellows work in various museum departments and gain the skills, experience, and confidence necessary to pursue careers in art museums and related fields. The Fellowship embodies Romare Bearden’s vision of creating opportunities and spaces for new voices to thrive and contribute meaningfully to the art world.
        - paragraph [ref=f931e116]:
          - strong [ref=f931e117]: Who should apply?
        - paragraph [ref=f931e118]: "The Museum welcomes candidates from various backgrounds who will advance the goals of the Bearden Fellowship program. Examples include, but are not limited to:"
        - list [ref=f931e119]:
          - listitem [ref=f931e120]: Individuals who are the first from their families to attend college
          - listitem [ref=f931e121]: Individuals who live in households with incomes below 80% of the national median household income
          - listitem [ref=f931e122]: Applicants who grew up in households or communities that afforded limited opportunities to visit and engage with museums
          - listitem [ref=f931e123]: Individuals who have encountered other specific articulable barriers to entry into a museum career
        - paragraph [ref=f931e124]: The Bearden Fellowship program also provides opportunities for individuals who articulate and demonstrate a commitment to the goals of the program, even if the candidate does not come from a historically and statistically underrepresented background.
        - paragraph [ref=f931e125]: The Fellowship program welcomes all applicants without regard to sex, race, age, disability, religion, national origin, color, sexual orientation, gender identity or expression, veteran status or any classification protected by law.
        - paragraph [ref=f931e126]:
          - strong [ref=f931e127]: Applications for the next Fellowship pool will be accepted in November, 2026.
        - paragraph [ref=f931e128]:
          - link "Learn More" [ref=f931e129] [cursor=pointer]:
            - /url: https://www.slam.org/careers-opportunities/romare-bearden-fellowship/
        - heading "SUMMER INTERNSHIPS" [level=3] [ref=f931e130]
        - paragraph [ref=f931e131]: Join a community of interns to gain professional skills and learn about museum practice. The paid internships at the Saint Louis Art Museum offer opportunities to gain first-hand experience working in a major art museum. Over the course of the summer program, interns will have opportunities to learn more about the Museum’s collections through curatorial tours and participate in tours of local collections and institutions. In addition, they will participate in tours of the conservation facilities, weekly brownbag lunches with department and division heads, and a meeting with the Museum’s director. At the culmination of the internship term, interns will present on an aspect of their department’s project and/or their professional achievements.
        - paragraph [ref=f931e132]: The Saint Louis Art Museum is pleased to offer four full-time, paid summer internships in 2026.
        - paragraph [ref=f931e133]:
          - strong [ref=f931e134]: Applications for 2026 internships are now closed. Please check back in 2027 for new opportunities.
      - generic [ref=f931e138]:
        - heading "Volunteer Opportunities" [level=2] [ref=f931e139]
        - paragraph [ref=f931e140]: The Saint Louis Art Museum is continually looking for individuals to help us better serve the community. Volunteers have the unique opportunity to support the arts while learning new skills and meeting people with similar interests. When you volunteer, you not only lend your time and expertise, you also give back to a beloved St. Louis cultural institution.
        - paragraph [ref=f931e141]:
          - text: Please check our
          - link "open positions" [ref=f931e142] [cursor=pointer]:
            - /url: https://jobs.dayforcehcm.com/en-US/slam/CANDIDATEPORTAL
          - text: for volunteer opportunities.
      - generic [ref=f931e146]:
        - heading "Volunteer Educator Program" [level=3] [ref=f931e147]
        - paragraph [ref=f931e148]: Volunteer educators (previously called docents) are trained volunteers who enhance the visitor experience through guided tours and gallery engagements. They facilitate discussion of artworks in the Museum’s collection and exhibitions to deepen visitors’ understanding and foster personal connections. Volunteer educators work with the Museum’s many audiences, including school groups, families, Members, and general audiences, adapting their communication style to suit different learning needs and lived experiences.
        - paragraph [ref=f931e149]: Volunteer educators participate in a six-month training led by Engagement and Interpretation staff that includes information on visitor engagement and gallery-teaching strategies as well as different areas of the collection before leading tours in the galleries. Training sessions happen weekly and are held at accessible times to support candidates balancing work, caregiving, and other commitments. Monthly continuing education sessions are offered for learning about upcoming exhibitions and installations as well as best practices in inclusive tour facilitation, from August through May.
        - paragraph [ref=f931e150]:
          - strong [ref=f931e151]: Who should apply?
        - list [ref=f931e152]:
          - listitem [ref=f931e153]: "We welcome interest from individuals with a wide range of backgrounds and experiences. Consider applying if you have:"
          - listitem [ref=f931e154]: The ability to commit to the six-month training course and, following the initial training, participate in continuing monthly education sessions and facilitate approximately two hour-long tours per month
          - listitem [ref=f931e155]: An interest in engaging visitors of all ages, and a desire to work with diverse audiences and colleagues.
          - listitem [ref=f931e156]: Passion and curiosity about art. Please note that a background in art history or museum education is not required to participate.
          - listitem [ref=f931e157]: Cultural awareness and openness to learning about art from different historical and contemporary perspectives
          - listitem [ref=f931e158]: A desire to learn and try multiple engagement techniques, including play, storytelling, and art making.
          - listitem [ref=f931e159]: Strong interpersonal communication and basic computer skills.
          - listitem
        - paragraph [ref=f931e160]:
          - text: "If you have specific questions, please contact Karla Aguilar, associate educator, guide programs: karla.aguilarv@slam.org."
          - strong [ref=f931e161]: The soonest we anticipate conducting another recruitment and training cycle is 2027.
