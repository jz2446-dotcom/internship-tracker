        - paragraph [ref=f931e58]:
          - text: If you need any accommodations or special arrangements to apply or to interview for a position, please contact Human Resources at
          - link "human.resources@slam.org" [ref=f931e59] [cursor=pointer]:
            - /url: mailto:human.resources@slam.org
          - text: .
      - generic [ref=f931e63]:
        - heading "Employment Opportunities" [level=2] [ref=f931e64]
        - paragraph [ref=f931e65]: Jobs span a broad range of careers, from entry-level to professional, including curatorial, conservation, development, marketing, education, visitor services, finance, information systems, protection services, and human resources.
        - paragraph [ref=f931e66]:
