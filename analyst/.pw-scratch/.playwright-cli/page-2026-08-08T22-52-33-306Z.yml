      - heading "Careers and Opportunities" [level=1] [ref=f931e39]
      - generic [ref=f931e43]:
        - paragraph [ref=f931e44]: The Museum is supported by more than 300 employees and 200 dedicated volunteers. The Saint Louis Art Museum is an exciting place to be. We have rewarding opportunities available for interested volunteers and interns. Join us!
        - paragraph [ref=f931e45]:
          - text: Contact us |
          - link "human.resources@slam.org" [ref=f931e46] [cursor=pointer]:
            - /url: mailto:human.resources@slam.org
      - generic [ref=f931e50]:
        - heading "Diversity" [level=2] [ref=f931e51]
        - paragraph [ref=f931e52]: The Saint Louis Art Museum seeks to build and maintain a workforce that reflects the rich diversity of our community. The Museum is an Equal Opportunity Employer. We are committed to treating all applicants and employees fairly based on their abilities, achievements, and experience, without regard to sex, race, age, disability, religion, national origin, color, sexual orientation, gender identity, or any other classification protected by law.
      - generic [ref=f931e56]:
