          - cell [ref=f764e150]:
            - generic [ref=f764e154]:
              - paragraph [ref=f764e155]: Welcome to our website. Meridian has been producing, structuring, financing, and managing apartment communities for over 40 years.
              - paragraph [ref=f764e156]: The experience gained over this time has allowed us to focus in on those things that matter most for the owner and the resident. Our current management portfolio includes over 5,500 apartment units and reporting responsibility for several different ownership entities.
              - paragraph [ref=f764e157]: We encourage you to check us out. We are confident you will like what you see.
              - paragraph [ref=f764e158]
              - list [ref=f764e159]:
                - listitem [ref=f764e160]:
                  - heading "Affordable Senior Housing" [level=2] [ref=f764e161]
                  - paragraph [ref=f764e162]:
                    - text: "Looking for low income affordable senior housing? Meridian has a large selection of apartments for older adults, in communities tailored to independent living. Our large selection of senior apartments for rent gives you the freedom to choose the best option for you and your elderly loved ones. To find the best option for you click on the link:"
                    - link "Search for Affordable Senior Housing Now >>" [ref=f764e163] [cursor=pointer]:
                      - /url: /n-property/properties.asp?property_type=Residential+for+Lease&property_subtype=Senior
                - listitem [ref=f764e164]:
                  - heading "Affordable Housing Apartments for Individuals with Disabilities" [level=2] [ref=f764e165]
                  - paragraph [ref=f764e166]:
                    - text: "Looking for affordable housing designed for individuals with disabilities? Meridian has a large selection of rental apartments designated for independent living for persons with a disability. To find the best option for you please click on the link:"
                    - link "Search our Affordable Housing Apartments for Persons with Disabilities >>" [ref=f764e167] [cursor=pointer]:
                      - /url: /n-property/properties.asp?city=&state=&property_type=Residential+for+Lease&property_subtype=Disabled&cboLocation=
                - listitem [ref=f764e168]:
                  - heading "Affordable Housing for Families and Individuals" [level=2] [ref=f764e169]
                  - paragraph [ref=f764e170]:
                    - text: "Looking for low income affordable housing for families and individuals? Meridian has a large selection of affordable apartments and townhomes for rent in communities designed to meet your needs. To find the best option for you please click on the link:"
                    - link "Search our Affordable Housing for Families and Individuals >>" [ref=f764e171] [cursor=pointer]:
                      - /url: /n-property/properties.asp?city=&state=&property_type=Residential+for+Lease&property_subtype=Family&cboLocation=
                - listitem [ref=f764e172]:
                  - heading "Market Rate Apartments" [level=2] [ref=f764e173]
                  - paragraph [ref=f764e174]:
                    - text: "Looking for affordable apartments for rent that do not have rental subsidies? Meridian offers several apartment communities. To find the best option for you please click on the link:"
                    - link "Search our Market Rate Apartments >>" [ref=f764e175] [cursor=pointer]:
                      - /url: /n-property/properties.asp?city=&state=&property_type=Residential+for+Lease&property_subtype=Market+Rate&cboLocation=
