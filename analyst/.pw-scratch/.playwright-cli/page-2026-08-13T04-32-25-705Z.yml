              - img "We'll Meet Your Affordable Housing Apartments Investment Needs�" [ref=f764e205]
              - paragraph [ref=f764e206]:
                - text: We've built a reputation for preserving and managing real estate value for our clients. Since many of today's real estate owners have varied investment portfolios, they appreciate our experience, professional status, and what we can do for them.
                - link "More Information >" [ref=f764e208] [cursor=pointer]:
