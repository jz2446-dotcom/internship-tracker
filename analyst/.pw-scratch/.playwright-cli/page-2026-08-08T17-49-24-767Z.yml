                - paragraph [ref=f139e235]:
                  - generic [ref=f139e236]: Head of Global Finance Operations Natixis CIB Americas
                - paragraph [ref=f139e239]: "\"I began my career at Natixis in Paris in 2013 through the Graduate Program and relocated to New York in 2015 as an intern in Global Trade, where I gained extensive knowledge of the banking sector through trade finance. Over the past ten years, I have collaborated with various transversal teams, enhancing my understanding of banking operations. Ready for a new challenge, I recently transitioned to Global Banking Operations, where I currently lead the Financing Operations teams, leveraging my market insights and products knowledge to drive team success.”"
