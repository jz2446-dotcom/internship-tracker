            - paragraph [ref=f139e407]: Natixis Corporate & Investment Banking Americas is committed to transforming the client experience by offering innovative, expertise-driven solutions and capabilities to clients across an array of financing and capital markets products—all of which is powered by the caliber of our skilled professionals. Whether in Global Markets, Investment Banking, Coverage, ESG, Support & Control, if you are ready for the next level, consider joining a team of supportive colleagues dedicated to shaping the future of our business, unlimited advancement and having a positive impact on the world.
