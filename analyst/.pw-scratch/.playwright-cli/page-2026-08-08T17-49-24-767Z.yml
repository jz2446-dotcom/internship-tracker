                    - paragraph [ref=f139e265]: Head of Green & Sustainable Hub - Americas
                    - paragraph [ref=f139e268]: "\"Joining Natixis has had an important impact on both my career and personal life. It has given me greater opportunity to be at the forefront of structuring sustainable finance transactions at an organisation which is globally recognised for its excellence in the field. I also greatly enjoy working in international environments and am very proud to be in such a global institution like Natixis.”"
              - option [ref=f139e269]:
