                      - paragraph [ref=f1116e220]:
                        - text: On June 20, DATALAND celebrated its grand opening at
                        - link "The Grand LA" [ref=f1116e221] [cursor=pointer]:
                          - /url: https://www.thegrandla.com/
                        - text: ", welcoming visitors to experience the very first AI Arts and omni-sensory museum, located in the heart of downtown Los Angeles' cultural corridor. From now through January 31, 2027, visitors can experience"
                        - emphasis [ref=f1116e222]: "Machine Dreams: Rainforest"
                        - text: ", the museum's inaugural exhibition that seeks to redefine what art can be in the age of machine intelligence."
