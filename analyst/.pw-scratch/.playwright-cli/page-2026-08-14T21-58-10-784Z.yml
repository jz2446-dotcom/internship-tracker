                      - generic [ref=f1116e258]: Internships at Related
                      - generic [ref=f1116e260]: That’s a wrap on our 2026 Summer Internship Program
                      - paragraph [ref=f1116e263]: This summer, 31 analysts and 6 associates joined our teams in New York, Chicago, Boston, San Francisco and Dallas for 10 weeks to work across development, affordable housing, commercial management, finance, accounting, marketing, leasing and construction. Our 2026 intern class took part in a memorable lineup of programming, from property tours and an inspiring speaker series to hands-on experience working on current development projects. Thank you to our 2026 intern class for bringing curiosity, energy and fresh perspectives to our team!
