                      - paragraph [ref=f1116e191]:
                        - text: On July 24, Related Midwest and its development partners announced that
                        - link "400 Lake Shore Drive" [ref=f1116e192] [cursor=pointer]:
                          - /url: https://www.relatedrentals.com/apartment-rentals/chicago/streeterville/400-lake-shore-drive
                        - text: has reached its full height, marking the completion of the residence's exterior. Designed by David Childs and Skidmore, Owings & Merrill (SOM) and scheduled to launch in 2027, the 72-story waterfront tower will present a total of 635 rental residences, with 127 of them set aside as affordable.
                      - link "Read More" [ref=f1116e193] [cursor=pointer]:
