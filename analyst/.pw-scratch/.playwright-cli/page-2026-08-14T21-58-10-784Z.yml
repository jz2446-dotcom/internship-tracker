                        - link "Edge celebrates grand opening for new immersive experience at Hudson Yards" [ref=f1116e233] [cursor=pointer]:
                          - /url: https://www.edgenyc.com/
                      - paragraph [ref=f1116e236]: From June 11-14, Edge at Hudson Yards celebrated the grand opening of its new immersive experience, which features seven permanent interactive installations inspired by New York City's unforgettable lights, movement and energy. Opening weekend visitors explored the brand new multi-sensory experience 1,110 feet above Manhattan's West Side, along with meditation sessions, Vinyl & Views DJ sets, face painting, live music, dance performances, giveaways and more. Thank you to everyone who joined us and helped bring this amazing experience to life!
