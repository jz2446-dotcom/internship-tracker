  - generic [ref=f5e56]:
    - heading "VOTED BEST" [level=4] [ref=f5e57]
    - heading "CHRISTIAN WORKPLACE" [level=2] [ref=f5e58]
    - separator [ref=f5e59]
    - paragraph [ref=f5e60]:
      - text: In 2018, Rock Point was certified by the Best Christian Workplaces Institute (BCWI) as one of the top churches at which to work. Lead Pastor Bill Bush and Executive Pastor Dave Sutherland are quoted in the BCWI Blog dated December 3, 2019,
      - link "The Most Important Question Every Leader Must Ask…" [ref=f5e62] [cursor=pointer]:
        - /url: https://workplaces.org/articles/certified-org-best-practice-story/most-important-question-leader
      - text: Says Bill, “What has really transformed our culture is who we hire. When you look for people who are going to fit, then culture fits. We’re not training our people thinking, ‘You better be these core values.’ Instead, you find people who are your core values.” “We’re really in the relationship business,” adds Dave. “We need to take care of our team and who they are as people and care for each one as a person in a healthy sustainable role, not stressed out and on the edge.” “And,” says Bill, “we can’t forget that one of our core values is FUN. To further the Body of Christ at Rock Point, we’re trying to do something that sometimes can be brutally hard. In all of this, we need to be able to laugh out loud…we take our jobs seriously, but don’t take ourselves seriously.”
  - generic [ref=f5e66]:
    - heading "ADDED EMPLOYEE PERKS" [level=2] [ref=f5e67]
    - separator [ref=f5e68]
    - list [ref=f5e69]:
      - listitem [ref=f5e70]: Employer-paid medical, dental, and vision for full-time employees
      - listitem [ref=f5e71]: 403(b) retirement plan for full-time and part-time employees (over 20 hours weekly)
      - listitem [ref=f5e72]: Free childcare offered weekly on Tuesday, Wednesday, and Thursday
      - listitem [ref=f5e73]: Generous hours offered for paid time off
      - listitem [ref=f5e74]: Multiple paid holidays including the week after Christmas and two days after Easter
  - generic [ref=f5e79]:
