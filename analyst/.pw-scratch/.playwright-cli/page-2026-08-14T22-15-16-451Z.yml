        - generic [ref=f614e43]: Description
        - generic [ref=f614e44]:
          - paragraph [ref=f614e45]:
            - strong [ref=f614e46]: "ABOUT REINVESTMENT FUND:"
          - paragraph [ref=f614e47]: At Reinvestment Fund, we are dedicated to making a tangible difference in the lives of underserved individuals and communities. Our mission is to create opportunity for underserved people and places through partnerships. We marshal the capital, analytics, and expertise necessary to build strong, healthy, and more equitable communities.
          - paragraph [ref=f614e48]
          - paragraph [ref=f614e49]: As a federally certified community development financial institution (CDFI), our job is to make finance an agent of positive change and equitable growth. We provide loans, grants and technical assistance to businesses and nonprofits. Our borrowers and grantees educate students, support local economies, and create jobs. They build affordable housing and provide community goods and services that include access to nutritious food, hunger relief, physical and mental health care, and other social services.
          - paragraph [ref=f614e50]
          - paragraph [ref=f614e51]: In addition to our core lending activities, Reinvestment Fund manages several initiatives with the support of local or national foundations, and state, local and federal public agencies and governments. These initiatives offer a range of capacity investments, technical assistance, and grants to a portfolio of recipients in sectors including early childhood, equitable food systems, and Historically Black College and Universities (HBCUs).
          - paragraph [ref=f614e52]
          - paragraph [ref=f614e53]:
            - strong [ref=f614e54]: "ABOUT THE POSITION:"
            - text: Reinvestment Fund is seeking a Program Impact Data Manager to develop and manage processes for collecting, validating, analyzing, and reporting quantitative and qualitative data related to Reinvestment Fund’s programs. Reporting to the Senior Director, Programs Impact and Operations, this role will contribute to the design of new initiatives within the department and collaborate with data colleagues across departments to capture the collective impact of Reinvestment Fund.
          - paragraph [ref=f614e55]
          - paragraph [ref=f614e56]: This role operates in a high-volume, fast-paced environment and supports 15 to 20 active programs simultaneously. The successful candidate will be able to work independently, manage competing priorities and timelines, and collaborate effectively with program, data, and fundraising colleagues
          - paragraph [ref=f614e57]
          - paragraph [ref=f614e58]:
            - strong [ref=f614e59]: "RESPONSIBILITIES:"
          - list [ref=f614e60]:
            - listitem [ref=f614e61]: Lead processes to identify key output, outcome, and impact metrics to assess impact performance and support the mission of providing responsive, community-informed programs with a commitment to racial equity.
            - listitem [ref=f614e62]: Own the design, implementation, maintenance, and accuracy of impact data frameworks, systems, and workflows across all active programs, including the tools and processes used to collect, process and analyze.
            - listitem [ref=f614e63]: Establish and maintain data quality standards, shared definitions, documentation, and validation processes to ensure complete, accurate, and comparable impact reporting across programs.
            - listitem [ref=f614e64]: Align impact data collection and reporting processes with organization-wide KPIs and standards to ensure program-level data can be combined and aggregated for organization-wide impact reporting.
            - listitem [ref=f614e65]: Establish and maintain consistent reporting cadences for all active programs, preparing and delivering accurate and timely impact reports to internal stakeholders and active funders in compliance with grant requirements and reporting deadlines.
            - listitem [ref=f614e66]: Develop and administer surveys and other tools to evaluate programs and services and to incorporate community voice and participant feedback.
            - listitem [ref=f614e67]: Design, build, and maintain impact dashboards using available organizational tools including SmartSimple, Power BI, Tableau, Excel, or equivalent platforms.
            - listitem [ref=f614e68]: Develop slide decks and presentations with actionable insights to support external communication of impact data.
            - listitem [ref=f614e69]: Support program design and fundraising activities by contributing impact analysis to application narratives, reports, and evaluations.
            - listitem [ref=f614e70]: Contribute to interdepartmental collaborations to develop and improve impact data collection, analysis, and reporting.
            - listitem [ref=f614e71]: Contribute to sector knowledge by attending industry events and developing strong working relationships with partners and peers.
            - listitem [ref=f614e72]: Other duties as assigned.
        - generic [ref=f614e73]: Requirements
        - generic [ref=f614e74]:
          - paragraph [ref=f614e75]: To perform this job successfully, an individual must be able to perform each essential duty satisfactorily. The requirements listed below are representative of the knowledge, skill, and/or ability required. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions.
          - paragraph [ref=f614e76]
          - paragraph [ref=f614e77]: "Required Qualifications:"
          - list [ref=f614e78]:
            - listitem [ref=f614e79]: Minimum bachelor's degree or equivalent experience. Advanced degree a plus.
            - listitem [ref=f614e80]: At least five years of relevant experience in analytics, research, and/or nonprofit management with a demonstrated focus on impact measurement.
            - listitem [ref=f614e81]: Proven experience gathering requirements from stakeholders and translating business needs into scalable and effective data architecture designs.
            - listitem [ref=f614e82]: Direct experience identifying key project impact metrics, defining evaluation questions and methodologies, and designing data collection tools and processes.
            - listitem [ref=f614e83]: Excellent analytical skills and demonstrated ability to synthesize information into meaningful, actionable conclusions.
            - listitem [ref=f614e84]: Strong project management skills, including organization, time management, priority-setting, independent problem-solving, proactive risk communication, and the ability to manage multiple concurrent projects for internal and external stakeholders.
            - listitem [ref=f614e85]: Experience with qualitative and quantitative data collection and analysis.
            - listitem [ref=f614e86]: Experience with survey design and administration, especially through Qualtrics XM.
            - listitem [ref=f614e87]: Experience with quantitative data processing and analysis in SQL. (Experience with Microsoft SQL Server Management Studio is a plus.)
            - listitem [ref=f614e88]: Demonstrated ability to communicate clearly and concisely in writing, including producing outcome-focused progress updates, meeting summaries, and stakeholder reports.
            - listitem [ref=f614e89]: Experience building or maintaining data dashboards using Power BI, Tableau, Excel, or equivalent business intelligence tools.
            - listitem [ref=f614e90]: Demonstrated interest in and understanding of community development and commitment to social change.
            - listitem [ref=f614e91]: Commitment to ethical data practices, community-informed evaluation, and translating data into decisions that advance equitable outcomes.
          - paragraph [ref=f614e92]: "Preferred Qualifications:"
          - list [ref=f614e93]:
            - listitem [ref=f614e94]: Familiarity with impact measurement frameworks such as IRIS+, the UN Sustainable Development Goals (SDGs), and Environmental, Social, and Governance (ESG) criteria.
            - listitem [ref=f614e95]: Experience with SmartSimple or a comparable grant management or program data platform.
            - listitem [ref=f614e96]: Experience in a CDFI, community development, or mission-driven nonprofit environment managing multiple concurrent grant-funded programs.
            - listitem [ref=f614e97]: Experience with geospatial data analysis, especially ESRI ArcGIS Online.
          - paragraph [ref=f614e98]:
            - strong [ref=f614e99]: "WORK LOCATION:"
          - paragraph [ref=f614e100]: For this position, we will consider remote employees within the Eastern Time Zone, with a preference towards candidates in the Philadelphia, PA area to allow for occasional team-based face-to-face interactions. If a remote employee is ultimately selected for the position, travel will be occasionally required to our Philadelphia headquarters for staff meetings.
          - paragraph [ref=f614e101]
          - paragraph [ref=f614e102]:
            - strong [ref=f614e103]: "COMPENSATION AND BENEFITS:"
            - text: Reinvestment Fund offers a competitive salary based on experience and skills, as well as an excellent benefits package including employer-paid health, disability, and life insurance, 401(k) savings plan with employer match, flexible spending accounts (medical, dependent care and transportation), tuition reimbursement, paid time off, and EAP program.
          - paragraph [ref=f614e104]
          - paragraph [ref=f614e105]: The salary range for this position at commencement of employment is expected to be between $80,000 and $100,000/year, however, base pay offered may vary depending on multiple individualized factors, including market location, job-related knowledge, skills, and experience.
          - paragraph [ref=f614e106]
          - paragraph [ref=f614e107]: If hired, employee will be in an “at-will position” and the Company reserves the right to modify base salary (as well as any other discretionary payment or compensation program) at any time, including for reasons related to individual performance, Company or individual department/team performance, and market factors.
          - paragraph [ref=f614e108]
          - paragraph [ref=f614e109]: Reinvestment Fund uses E-Verify to validate all new hires' ability to legally work in the United States and all new hires may be subject to a background check.
          - paragraph [ref=f614e110]
          - paragraph [ref=f614e111]:
            - text: Reinvestment Fund is an
            - strong [ref=f614e112]: Equal
            - strong [ref=f614e113]: Opportunity
            - strong [ref=f614e114]: Employer
            - text: . We do not discriminate in hiring or employment practices based on race, color, religion, gender, age, sexual orientation, marital or familial status, national origin, non-job-related disability, or status as a veteran. Reinvestment Fund is committed to belonging, culture and engagement throughout our organization and in our external investment practices.
          - paragraph [ref=f614e115]
          - paragraph [ref=f614e116]: Reinvestment Fund, Inc. has an affiliate, RF Impact Advisers, Inc. (“RFIA”) that is a state-registered investment adviser. In order to advance compliance with and prevent violations of federal and state securities laws and to avoid even the appearance of a conflict of interest, RFIA has adopted a Code of Ethics to govern certain conduct of its staff, including certain staff of Reinvestment Fund because Reinvestment Fund is an advisory affiliate of RFIA. As part of this Code of Ethics, there are specific personal reporting and other requirements and disclosures of personal financial and/or securities transactions information for certain individuals, and this reporting may extend to your household members.
