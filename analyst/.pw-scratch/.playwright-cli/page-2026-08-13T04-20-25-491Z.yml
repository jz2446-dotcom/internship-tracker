    - heading "Career Resources" [level=1] [ref=f785e67]
    - generic [ref=f785e72]:
      - generic [ref=f785e75]:
        - paragraph [ref=f785e76]: At the Newark Public Library, you will find books and other resources about careers, resume writing, and job seeking strategies. As always, if you need assistance, staff will be glad to help you.
        - paragraph [ref=f785e77]: Free with a Newark Library card wherever you have internet access.
        - paragraph [ref=f785e78]: Use these databases for job vacancies, resume guidance, interviewing techniques, practice exams, job searching tips, and occupational information.
        - heading "Books" [level=2] [ref=f785e79]
        - paragraph [ref=f785e80]:
          - text: Check out books with your free
          - link "Newark Public Library card" [ref=f785e81] [cursor=pointer]:
            - /url: http://www.npl.org/collections-services/borrowing-services/
          - text: .
        - paragraph [ref=f785e82]:
          - text: Find useful materials in the
          - link "library catalog" [ref=f785e83] [cursor=pointer]:
            - /url: http://catalog.npl.org/search/
          - text: ", or browse in these areas of the Dewey Decimal System:"
        - paragraph [ref=f785e84]:
          - text: DDS Number / Subject heading
          - strong [ref=f785e85]: "331.21"
          - text: –
          - emphasis [ref=f785e86]: Wage surveys
          - strong [ref=f785e87]: "331.702"
          - text: –
          - emphasis [ref=f785e88]: Job descriptions, job vacancies, occupations, vocational guidance
          - strong [ref=f785e89]: "650.14"
          - text: –
          - emphasis [ref=f785e90]: Career changes, cover letters, interviewing, job hunting, resumes, unemployment
        - heading "Databases" [level=2] [ref=f785e91]
        - paragraph [ref=f785e92]:
          - generic [ref=f785e93]:
            - link [ref=f785e94] [cursor=pointer]:
              - /url: http://online.infobaselearning.com/direct.aspx?pid=WE34&aid=17226
              - strong [ref=f785e95]: Ferguson’s Career Guidance Center
            - text: Contains career information, with job and industry profiles, and career forecasting.
        - paragraph [ref=f785e96]:
          - generic [ref=f785e97]:
            - link [ref=f785e98] [cursor=pointer]:
              - /url: https://www.learningexpresshub.com/productengine/LELIndex.html#/center/jobandcareeraccelerator5/home
              - strong [ref=f785e99]: Job & Career Accelerator
            - text: Create resumes and cover letters, learn interviewing techniques, and prepare for related exams. Access millions of job listings. Requires users to create a username and password to store your information in complete confidentiality.
        - paragraph [ref=f785e100]:
          - generic [ref=f785e101]:
            - link [ref=f785e102] [cursor=pointer]:
              - /url: http://www.learningexpresshub.com/learningexpresslibrary?AuthToken=BD433F1A-2883-4373-A0C6-D2586AC9595B
              - strong [ref=f785e103]: LearningExpress Library
            - text: Offers interactive practice exams, including ASVAB, GED, GMAT, PRAXIS, SAT, LPN, civil service exams, language and math skill building, and more.
        - paragraph [ref=f785e104]:
          - generic [ref=f785e105]:
            - strong [ref=f785e106]:
              - link "Reference Solutions by Data Axle (formerly ReferenceUSA)" [ref=f785e107] [cursor=pointer]:
                - /url: https://www.referenceusa.com/Static/UrlChallengeForGeoAuth?returnUrl=https://www.referenceusa.com/&referringUrl=https://www.njstatelib.org/
            - text: With information on over 13 million U.S. businesses, this database is searchable by company name, business size, location, NAICS and SIC codes, and more. There is also a residential directory, Canadian business and residential information, and physician and dental directories.
        - paragraph [ref=f785e108]:
          - generic [ref=f785e109]:
            - text: View the
            - link "complete list of databases" [ref=f785e110] [cursor=pointer]:
              - /url: http://www.npl.org/internet-electronic-resources/
            - text: . The Business section of databases may also be useful to job searchers.
