        - heading "Other Resources" [level=2] [ref=f785e137]
        - paragraph [ref=f785e138]: "Our circulating and reference collections offers information to job seekers trying to: • study for civil service exams • refresh grammar and math skills • research companies • start a small business ( business plans, proposals, and funding)"
        - paragraph [ref=f785e139]:
          - text: Computers for word processing, internet access, and wifi are available in the VTC and all Newark Public Library branches. Fill out online job applications, create a resume, search for jobs postings online, check email, or research a company. The library also offers
          - link "computer classes" [ref=f785e140] [cursor=pointer]:
            - /url: http://www.npl.org/public-access-computers/drop-in-computer-and-job-search-assistance/
          - text: .
        - paragraph [ref=f785e141]: If you need to fax applications or resumes, a fax machine is also available at the Main Library in the Periodicals Room on the second floor.
