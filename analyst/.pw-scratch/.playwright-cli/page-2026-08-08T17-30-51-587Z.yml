          - generic [ref=f52e131]:
            - paragraph [ref=f52e134]: GCF aims to address the impact of climate change around the world. Headquartered in Songdo, in the Republic of Korea, our home base provides the team plenty of opportunities to experience life in one of Asia’s most exciting locations. We strive to help countries create a low-emission and climate-resilient future. As our climate investment portfolio grows, we continue to build our capacity by recruiting people who are eager to be part of an international organization that works globally to tackle the world’s most pressing issue.
