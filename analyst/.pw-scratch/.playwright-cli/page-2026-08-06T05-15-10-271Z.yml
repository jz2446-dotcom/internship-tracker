        - generic [ref=f287e64]:
          - heading "This vacancy has now expired." [level=2] [ref=f287e66]
          - generic "Job description" [ref=f287e67]:
            - paragraph [ref=f287e68]: "NOTE: Applicants must be enrolled in an accredited undergraduate degree program for the Fall 2026 semester. Please clearly indicate your expected graduation date on your resume.The New York City Comptroller’s Office works to promote the financial health, integrity, and effectiveness of New York City government, in order to strengthen trust, secure a thriving future for all New Yorkers, and build a more just, equitable, and resilient city. Led by an independently elected citywide official, the comptroller’s office provides checks and balances needed to hold City government accountable for budgeting wisely, investing responsibly, operating efficiently, acting fairly, living up to its obligations and promises, and paying attention to the long-term challenges we face together.The Bureau of Asset Management is responsible for oversight of the investment portfolios of the five New York City pension systems. Through a culture of collaboration, individual development, and teamwork that leverages diverse talent and strives for continuous improvement, the goal of the Bureau of Asset Management is to achieve exceptional investment outcomes for all stakeholders; to deliver outstanding support to plan Trustees; and to serve as a responsible steward of the resources of plan beneficiaries and the City of New York. Responsibilities of the Alternative Credit Intern include, but are not limited to:- Assist with risk and exposure analysis of private credit portfolio- Perform other duties and assignments as may be requiredQUALIFICATION REQUIREMENT: Matriculation at an accredited college. Employment is conditioned upon continuance as a student in college. Applicants must be enrolled in an accredited undergraduate degree program for the Fall 2026 semester. Please clearly indicate your expected graduation date on your resume. This position is ideal for college students pursuing majors/minors in the fields of Applied Economics and/or Statistics.IMPORTANT:- Our office is located at the David Dinkins Municipal Building, 1 Centre St. in Manhattan/New York.- All interns will work in-person in the office, Monday – Thursday, 28 hours per week.- The employment period will be from June 1 – July 30, 2026.SUMMER COLLEGE INTERN - 10234"
            - generic [ref=f287e69]: Minimum Qualifications
            - paragraph [ref=f287e70]: "As of June of the Program year the prospective intern must be a student matriculated in a college or be a recent college graduate (winter/spring term of the Program year).NOTE: Appointment to this title is only valid for the duration of the Program, June - August each year."
            - generic [ref=f287e71]: Preferred Skills
            - text: 1. Strong programming skills 2. Strong background in mathematics and data analysis 3. Self-starter and entrepreneurial
            - generic [ref=f287e72]: Public Service Loan Forgiveness
            - text: As a prospective employee of the City of New York, you may be eligible for federal loan forgiveness programs and state repayment assistance programs. For more information, please visit the U.S. Department of Education’s website at https://studentaid.gov/pslf/.
            - generic [ref=f287e73]: Residency Requirement
            - text: New York City residency is generally required within 90 days of appointment. However, City Employees in certain titles who have worked for the City for 2 continuous years may also be eligible to reside in Nassau, Suffolk, Putnam, Westchester, Rockland, or Orange County. To determine if the residency requirement applies to you, please discuss with the agency representative at the time of interview.
            - generic [ref=f287e74]: Additional Information
            - paragraph [ref=f287e75]: The City of New York is an inclusive equal opportunity employer committed to recruiting and retaining a diverse workforce and providing a work environment that is free from discrimination and harassment based upon any legally protected status or protected characteristic, including but not limited to an individual's sex, race, color, ethnicity, national origin, age, religion, disability, sexual orientation, veteran status, gender identity, or pregnancy.
