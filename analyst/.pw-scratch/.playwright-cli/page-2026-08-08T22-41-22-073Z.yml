              - heading "Position Description" [level=2] [ref=f407e111]
            - definition [ref=f407e112]:
              - paragraph [ref=f407e113]:
                - img "MDHA Red Logo(2).JPG" [ref=f407e115]
              - paragraph [ref=f407e116]:
                - strong [ref=f407e117]: "Position Open: July 31, 2026"
              - paragraph [ref=f407e118]:
                - strong [ref=f407e119]: "Position Close: August 14, 2026"
              - paragraph [ref=f407e120]:
                - strong [ref=f407e121]: JOB ANNOUNCEMENT
              - paragraph [ref=f407e122]:
                - strong [ref=f407e124]: "Position: Housing Choice Vouchers Quality Control/Training Analyst"
              - paragraph [ref=f407e125]:
                - strong [ref=f407e126]: "Salary: $74,557 - $85,081"
              - paragraph [ref=f407e127]:
                - strong [ref=f407e128]: Metropolitan Development and Housing Agency (MDHA)
              - paragraph [ref=f407e129]:
                - strong [ref=f407e130]: Nashville, TN
              - paragraph [ref=f407e131]: MDHA serves Nashville and Davidson County. The mission of MDHA is to create quality affordable housing opportunities, support neighborhoods, strengthen communities, and help build a greater Nashville.
              - paragraph [ref=f407e132]: MDHA employs over 300 staff members, has a budget of $215 million, and houses approximately 30,000 people, primarily through nearly 8,000 Section 8 Vouchers and over 6,800 apartments, which are mainly Project-Based Rental Assistance (PBRA) units, at 39 properties. MDHA is a housing authority, a community development agency, and a redevelopment agency.
              - paragraph [ref=f407e133]:
                - strong [ref=f407e134]: Position Summary
              - paragraph [ref=f407e135]: The Quality Control/Training Analyst is responsible for monitoring the accuracy and quality of program transactions, identifying trends and errors, and translating those findings into practical training and coaching for staff and the Housing Choice Voucher Program. The role conducts regular quality reviews, develops and delivers training, and partners with leaders to strengthen compliance, data integrity, and customer service. This position supports the Rental Assistance Department by ensuring that core processes are consistent, compliant, and resident-focused.
              - paragraph
            - term [ref=f407e136]:
              - heading "Typical Duties" [level=2] [ref=f407e137]
            - definition [ref=f407e138]:
              - paragraph
              - paragraph [ref=f407e139]:
                - strong [ref=f407e140]: Quality Control
              - list [ref=f407e141]:
                - listitem [ref=f407e142]: Performs ongoing quality control reviews to ensure program compliance and adherence to departmental policies and procedures, HUD regulations, and other applicable requirements. Documenting findings and follow-up actions.
                - listitem [ref=f407e143]: Participates in internal assessments, audits, and monitoring activities as required.
                - listitem [ref=f407e144]: Identifies quality problems and trends, recommends practical solutions, and supports implementation of corrective action.
                - listitem [ref=f407e145]: Conduct routine quality control reviews on case files, transactions, and system records to ensure adherence to agency policies, HUD regulations, and other applicable requirements.
              - paragraph [ref=f407e146]:
                - strong [ref=f407e147]: Training and Staff Development
              - list [ref=f407e148]:
                - listitem [ref=f407e149]: Provides supervision and guidance to new hires during the training period, including coordinating onboarding activities and addressing initial personnel matters.
                - listitem [ref=f407e150]: Provides facilities training and policy interpretation for applicable local, state, and federal housing programs.
                - listitem [ref=f407e151]: Reviews federal and state legislation, HUD notices, and other guidance. Analyzes regulations, prepares concise briefs, and provides related staff training.
                - listitem [ref=f407e152]: Develops and delivers staff training to implement changes in systems, policies, and procedures. Where appropriate, develop workload measures and performance indicators to support management decisions.
                - listitem [ref=f407e153]: Assists in the development, testing, and implementation of automated systems and technology solutions used by the department.
                - listitem [ref=f407e154]: Assists department directors with management, technical, and procedural issues. Prepare routine correspondence and written guidance as needed.
              - paragraph [ref=f407e155]:
                - strong [ref=f407e156]: Compliance
              - list [ref=f407e157]:
                - listitem [ref=f407e158]: Manages departmental compliance with HUD systems, including PIC and EIV, ensuring accurate and timely reporting and resolution of discrepancies.
                - listitem [ref=f407e159]: Collects and monitors SEMAP data for compliance; prepares and submits MDHA's annual SEMAP certification and supporting documentation.
                - listitem [ref=f407e160]: Assists in maintaining and updating the Section 8 Administrative Plan, and helps develop related policies, procedures, and user guides.
                - listitem [ref=f407e161]: Receives and evaluates reasonable accommodation requests; makes determinations in accordance with applicable laws and agency policies.
                - listitem [ref=f407e162]: Prepares case files and represents the Agency at hearings when determinations are appealed.
              - paragraph
            - term [ref=f407e163]:
              - heading "Minimum Qualifications" [level=2] [ref=f407e164]
            - definition [ref=f407e165]:
              - paragraph
              - paragraph [ref=f407e166]:
                - strong [ref=f407e167]: Minimum Qualifications
              - list [ref=f407e168]:
                - listitem [ref=f407e169]: Bachelor's degree in business administration, public administration, social services, education, or a related field, and
                - listitem [ref=f407e170]: 5-7 years of progressive experience in quality control, auditing, compliance, training, or closely related work, preferably in a housing, public sector, or highly regulated environment.
                - listitem [ref=f407e171]: Experience reviewing case files, transactions, or service interactions for accuracy and compliance using checklists or standardized tools.
                - listitem [ref=f407e172]: Experience developing and/or delivering training, coaching, or technical assistance to staff.
              - paragraph [ref=f407e173]:
                - strong [ref=f407e174]: Preferred Qualifications
              - list [ref=f407e175]:
                - listitem [ref=f407e176]: Master's degree in public administration, business administration, or a closely related field from an accredited institution, and
                - listitem [ref=f407e177]: 4-5 years of progressive direct experience in a public housing authority, Housing Choice Voucher (HCV) public housing, RAD/PBV, or similar housing program environment, and
                - listitem [ref=f407e178]: Formal training or certification in quality assurance, internal auditing, training and development, or process improvement; and
                - listitem [ref=f407e179]: Experience using learning management systems (LMS) or e-learning tools for training delivery and tracking.
              - paragraph [ref=f407e180]
              - paragraph
            - term [ref=f407e181]:
              - heading "Preferred Experience, Knowledge, Skills, and Abilities" [level=2] [ref=f407e182]
            - definition [ref=f407e183]:
              - paragraph
              - list [ref=f407e184]:
                - listitem [ref=f407e185]: Working knowledge of quality assurance principles, basic audit techniques, and performance measurement concepts.
                - listitem [ref=f407e186]: Ability to interpret and apply policies, procedures, and regulatory requirements; housing program or HUD experience is strongly preferred.
                - listitem [ref=f407e187]: Strong analytical and problem-solving skills, with the ability to recognize patterns, identify root causes, and propose practical solutions.
                - listitem [ref=f407e188]: Strong attention to detail, organization, and follow-through in a high-volume, deadline-driven environment.
                - listitem [ref=f407e189]: Ability to build collaborative working relationships with staff at all levels and to support a culture of continuous improvement and accountability.
                - listitem [ref=f407e190]: Proficiency with MS Office (Word, Excel, PowerPoint, and other Microsoft software. Familiar with Yardi.
              - paragraph [ref=f407e191]:
                - strong [ref=f407e192]: THE METROPOLITAN DEVELOPMENT AND HOUSING AGENCY IS AN EQUAL OPPORTUNITY EMPLOYER AND HIRES REGARDLESS OF RACE, COLOR, NATIONAL ORIGIN, SEX, SEXUAL ORIENTATION, GENDER IDENTITY, AGE, RELIGION, AND DISABILITY, GENETIC INFORMATION OR ANY OTHER LEGALLY PROTECTED STATUS.
