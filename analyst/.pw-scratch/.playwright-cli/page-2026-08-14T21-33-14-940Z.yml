        - heading "Jobs" [level=1] [ref=f198e14]
        - generic [ref=f198e15]:
          - paragraph [ref=f198e16]: A little bit about how we work and what we do.
          - figure [ref=f198e17]
          - heading "Interns & Apprentices" [level=4] [ref=f198e18]
          - paragraph [ref=f198e19]:
            - text: We offer
            - strong [ref=f198e20]: Internships
            - text: (ages 13–17) for those just beginning their agricultural path, and
            - strong [ref=f198e21]: Apprenticeships
            - text: (generally ages 18+) for individuals pursuing farming as a more serious endeavor. Both positions are paid (weekly stipend plus farm share).
          - paragraph [ref=f198e22]: "We offer the opportunity to:"
          - list [ref=f198e23]:
            - listitem [ref=f198e24]: Connect to local food producers and learn about agriculture, particularly vegetable farming, in northern New Mexico
            - listitem [ref=f198e25]: Gain insight into small farm business operations and engage with our community
            - listitem [ref=f198e26]: Practice organic farming techniques
            - listitem [ref=f198e27]: Work with the support of mentors and farm educators to build knowledge and skills
            - listitem [ref=f198e28]:
              - text: Experience an established business model and intensive mentorship at
              - link "Cerro Vista Farm" [ref=f198e29] [cursor=pointer]:
                - /url: https://cerrovistafarm.com/
            - listitem [ref=f198e30]:
              - text: Work in teams to plant, weed, harvest, and
              - emphasis [ref=f198e31]: wash & pack
              - text: for retail and wholesale clients
            - listitem [ref=f198e32]:
              - text: Sell produce at
              - link "Questa Farmers Market" [ref=f198e33] [cursor=pointer]:
                - /url: https://questafarmersmarket.org/
              - text: and Tuesday Farm Stand
            - listitem [ref=f198e34]: Deliver produce to wholesale customers, including Sangre de Cristo Valley Market
            - listitem [ref=f198e35]: Create friendships, connect with the land, and grow food
          - paragraph [ref=f198e36]:
            - mark [ref=f198e37]: Our Internship positions are closed for the 2026 season.
            - mark [ref=f198e38]: We are a nonprofit program facing limited funding this season. You may
            - mark [ref=f198e39]:
              - link "contact us" [ref=f198e40] [cursor=pointer]:
                - /url: https://www.cultivoproject.org/contact/
            - mark [ref=f198e41]: to check on the possibility of additional positions becoming available.
          - paragraph [ref=f198e42]:
            - mark [ref=f198e43]: We accept
            - mark [ref=f198e44]:
              - link "donations" [ref=f198e45] [cursor=pointer]:
                - /url: https://www.cultivoproject.org/donate/
            - mark [ref=f198e46]: to help support our work.
          - generic [ref=f198e48]:
            - code
          - heading "Mentorship" [level=4] [ref=f198e49]
          - paragraph [ref=f198e50]:
            - text: We hire
            - strong [ref=f198e51]: Mentors
            - text: to work alongside Interns, Apprentices and farmers/educators. If you are interested in this work, please
            - link "contact" [ref=f198e52] [cursor=pointer]:
              - /url: https://www.cultivoproject.org/contact/
            - text: us.
          - paragraph [ref=f198e53]: "Mentor tasks include:"
          - list [ref=f198e54]:
            - listitem [ref=f198e55]: Supporting young farmers, interns and apprentices
            - listitem [ref=f198e56]: Assisting with production planning for 2026 season with Cerro Vista Farm
            - listitem [ref=f198e57]: Building and maintaining local business relationships
            - listitem [ref=f198e58]: Preparing and delivering CSA shares
            - listitem [ref=f198e59]: Marketing and writing Newsletters
            - listitem [ref=f198e60]: Developing and supporting wholesale clients, including delivery schedules
            - listitem [ref=f198e61]:
              - text: Managing Media, Social Media, and archiving
              - emphasis [ref=f198e62]: farming education videos
            - listitem [ref=f198e63]: Working collaboratively with other community programs
            - listitem [ref=f198e64]: Organizing farm and garden volunteers
          - figure [ref=f198e65]
          - paragraph
