        - generic [ref=f11e92]:
          - paragraph [ref=f11e93]: Guggenheim Securities offers a wide range of internship and full-time opportunities for Analysts and Associates. When you join our team, you will work on important strategic assignments alongside senior bankers and clients. We invest in the success of our people. We will support your career development with robust training programs as well as formal and informal mentoring.
          - heading "Campus Recruiting and Undergraduate Programs" [level=4] [ref=f11e94]
          - paragraph [ref=f11e95]:
            - strong [ref=f11e97]: Freshman and Sophomore Programs
            - text: Our Freshman Day on the Job and Sophomore FOCUS programs are geared towards individuals who have demonstrated resilience and excellence under challenging circumstances, whether from a personal, academic, or professional perspective. Select undergraduate participants will be offered early exposure to our business and people through various educational and networking events, providing insight into the upcoming recruiting processes. Upon completion of the FOCUS Program, participants are eligible for a job interview the following Summer.
