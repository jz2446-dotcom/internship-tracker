      - paragraph [ref=f13e56]:
        - strong [ref=f13e57]: ABOUT US
      - paragraph [ref=f13e58]: Sonoma County Library creates community through discovery, culture and connection.
      - paragraph [ref=f13e59]:
        - text: We are known locally for our engaged, creative, and empowered staff. We rely on community input to guide our decisions, and we proudly champion diversity and equity in all aspects of our organization. Libraries are for everyone. Read more about the library’s mission, vision, and values
        - link "here" [ref=f13e60] [cursor=pointer]:
          - /url: https://sonomalibrary.org/about/missionvision
        - text: .
      - paragraph [ref=f13e61]: This is a tremendous opportunity to be part of a mission-driven public agency, and help transform the literacy and education landscape for all Sonoma County residents. If you would like to join our team of dedicated professionals, we invite you to apply.
      - paragraph [ref=f13e62]
      - paragraph
    - generic [ref=f13e64]:
