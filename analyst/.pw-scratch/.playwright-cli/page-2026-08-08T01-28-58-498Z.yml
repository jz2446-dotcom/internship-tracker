            - text: to
          - paragraph [ref=f13e123]: apply. Applications must be completed and submitted by the final filing date in order to be considered.
          - paragraph [ref=f13e124]:
            - strong [ref=f13e125]: "***You must use a non-school email account to apply.***"
          - paragraph [ref=f13e126]
