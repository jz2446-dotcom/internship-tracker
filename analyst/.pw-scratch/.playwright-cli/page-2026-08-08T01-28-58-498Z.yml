        - strong [ref=f13e135]: "Employment Information:"
      - paragraph [ref=f13e136]: Employment offers will be contingent upon a successful reference check, pre-employment verification, and criminal records clearance. Having a criminal record will not necessarily disqualify an applicant from employment.
      - paragraph [ref=f13e137]:
        - strong [ref=f13e138]: "Request for Accommodation:"
      - paragraph [ref=f13e139]:
        - text: Sonoma County Library will make reasonable accommodations in the recruitment process to accommodate applicants with disabilities. If you are invited to participate in an examination or interview and have a disability for which you require an accommodation, please contact the Human Resources Department at (707) 545-0831 extension 1591 as soon as possible to make arrangements for your accommodation. Please refer to the Library’s
        - link "Notice Under the Americans with Disabilities Act (ADA) Policy" [ref=f13e140] [cursor=pointer]:
          - /url: https://sonomalibrary.org/sites/default/files/attachments/governance/policies/Policy-3009-Notice-ADA-1.7.2026.pdf
        - link "(Download PDF reader)" [ref=f13e141] [cursor=pointer]:
          - /url: https://get.adobe.com/reader/
        - text: for additional information.
      - paragraph [ref=f13e142]: We are committed to diversity and inclusion in the recruiting and hiring of staff and encourage applicants of all backgrounds and abilities to apply.
