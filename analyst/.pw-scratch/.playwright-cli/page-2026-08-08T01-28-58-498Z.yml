        - heading "Description" [level=2] [ref=f13e66]
      - definition [ref=f13e67]:
        - paragraph
        - paragraph [ref=f13e68]:
          - strong [ref=f13e69]: Sonoma County Library
        - paragraph [ref=f13e70]:
          - strong [ref=f13e71]: Announces an Employment Opportunity
        - paragraph [ref=f13e72]:
          - strong [ref=f13e73]: TEEN INTERN- LUNCH AT THE LIBRARY
        - paragraph [ref=f13e74]:
          - strong [ref=f13e75]: 15 HOURS PER WEEK- SUMMER
        - paragraph [ref=f13e76]:
          - strong [ref=f13e77]: Paid Internship opportunity for Sonoma County teens aged 16-18 years old.
        - paragraph [ref=f13e78]:
          - text: Sonoma County Library is hiring Teen Interns for Summer Lunch at the Library. This program ensures that Sonoma County children can receive free healthy lunches during the summer. The Lunch at the Library Teen Intern is responsible for a variety of activities of the program working under the direction of library staff. All Sonoma County teens aged 16-18 years old are encouraged to apply.
          - strong [ref=f13e79]:
            - text: No previous work experience required. When applying, y
            - strong [ref=f13e80]: ou must USE A NON-SCHOOL EMAIL ACCOUNT.
        - paragraph [ref=f13e81]:
          - strong [ref=f13e82]: "KEY DUTIES INCLUDE:"
        - list [ref=f13e83]:
          - listitem [ref=f13e84]: Set-up, serve, and clean up meal service.
          - listitem [ref=f13e85]: Maintain a clean site before, during and after meal service.
          - listitem [ref=f13e86]: Promote the Library’s Summer Reading Challenge, lead activities with children and parents.
          - listitem [ref=f13e87]: Participate in professional development workshops.
          - listitem [ref=f13e88]: Lunch at the Library is a joint partnership between the library and a federally funded program. Teen Interns will be expected to learn and follow all Federal guidelines and Sonoma County Library regulations and procedures.
        - paragraph [ref=f13e89]:
          - strong [ref=f13e90]: "WHEN:"
        - list [ref=f13e91]:
          - listitem [ref=f13e92]: "May 19 to May 29: onboarding and training, approximately 10 hours, which will occur after school. We understand that school will still be in session during the training period."
          - listitem [ref=f13e93]: "June 8 to August 7: Monday – Friday, 10:30am to 1:30pm (shifts are firm). Total time commitment is approximately 130 hours."
          - listitem [ref=f13e94]: Interns must be able to complete all 10 hours of training and at least 120 of the 130 scheduled hours to be considered for the internship opportunity.
        - paragraph [ref=f13e95]:
          - strong [ref=f13e96]: "WHERE:"
        - paragraph [ref=f13e97]:
          - strong [ref=f13e98]: "We will hire two Teen Interns for each of these Sonoma County Library locations:"
        - list [ref=f13e99]:
          - listitem [ref=f13e100]: Central Santa Rosa Library
          - listitem [ref=f13e101]: Cloverdale Regional Library
          - listitem [ref=f13e102]: Healdsburg Regional Library
          - listitem [ref=f13e103]: Petaluma Regional Library
          - listitem [ref=f13e104]: Rohnert Park-Cotati Regional Library
          - listitem [ref=f13e105]: Roseland Regional Library
          - listitem [ref=f13e106]: Sonoma Valley Regional Library
          - listitem [ref=f13e107]: Windsor Regional Library
        - paragraph [ref=f13e108]:
          - strong [ref=f13e109]: "MINIMUM QUALIFICATIONS:"
        - paragraph [ref=f13e110]:
          - text: Teenagers aged 16-18 years old, who are Sonoma County residents. Minors (ages 16-17) must obtain a work permit from their school to participate in this paid internship.
          - strong [ref=f13e111]:
            - text: You must be at least 16 years old by May 19, 2026, to apply.
            - emphasis [ref=f13e112]
        - paragraph [ref=f13e113]:
          - strong [ref=f13e114]: "SALARY RANGE: $18.47/hour"
        - paragraph [ref=f13e115]:
          - strong [ref=f13e116]: "CLOSING DATE: 11:59 PM on Monday, March 16, 2026"
        - paragraph [ref=f13e117]:
          - strong [ref=f13e118]: In-person interviews are scheduled for April 28 through April 30.
        - generic [ref=f13e119]:
          - paragraph [ref=f13e120]:
            - strong [ref=f13e121]: "APPLICATION PROCESS:"
            - text: Please go to
            - link "www.governmentjobs.com/careers/sonomalibrary" [ref=f13e122] [cursor=pointer]:
