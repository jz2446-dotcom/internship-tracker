        - heading "Jobs" [level=1] [ref=f262e14]
        - generic [ref=f262e15]:
          - paragraph [ref=f262e16]: A little bit about how we work and what we do.
          - figure [ref=f262e17]
          - heading "Interns & Apprentices" [level=4] [ref=f262e18]
          - paragraph [ref=f262e19]:
            - text: We offer
            - strong [ref=f262e20]: Internships
            - text: (ages 13–17) for those just beginning their agricultural path, and
            - strong [ref=f262e21]: Apprenticeships
            - text: (generally ages 18+) for individuals pursuing farming as a more serious endeavor. Both positions are paid (weekly stipend plus farm share).
          - paragraph [ref=f262e22]: "We offer the opportunity to:"
          - list [ref=f262e23]:
            - listitem [ref=f262e24]: Connect to local food producers and learn about agriculture, particularly vegetable farming, in northern New Mexico
            - listitem [ref=f262e25]: Gain insight into small farm business operations and engage with our community
            - listitem [ref=f262e26]: Practice organic farming techniques
            - listitem [ref=f262e27]: Work with the support of mentors and farm educators to build knowledge and skills
            - listitem [ref=f262e28]:
              - text: Experience an established business model and intensive mentorship at
              - link "Cerro Vista Farm" [ref=f262e29] [cursor=pointer]:
                - /url: https://cerrovistafarm.com/
            - listitem [ref=f262e30]:
              - text: Work in teams to plant, weed, harvest, and
              - emphasis [ref=f262e31]: wash & pack
              - text: for retail and wholesale clients
            - listitem [ref=f262e32]:
              - text: Sell produce at
              - link "Questa Farmers Market" [ref=f262e33] [cursor=pointer]:
                - /url: https://questafarmersmarket.org/
              - text: and Tuesday Farm Stand
            - listitem [ref=f262e34]: Deliver produce to wholesale customers, including Sangre de Cristo Valley Market
            - listitem [ref=f262e35]: Create friendships, connect with the land, and grow food
          - paragraph [ref=f262e36]:
            - mark [ref=f262e37]: Our Internship positions are closed for the 2026 season.
            - mark [ref=f262e38]: We are a nonprofit program facing limited funding this season. You may
            - mark [ref=f262e39]:
              - link "contact us" [ref=f262e40] [cursor=pointer]:
                - /url: https://www.cultivoproject.org/contact/
            - mark [ref=f262e41]: to check on the possibility of additional positions becoming available.
          - paragraph [ref=f262e42]:
            - mark [ref=f262e43]: We accept
            - mark [ref=f262e44]:
              - link "donations" [ref=f262e45] [cursor=pointer]:
                - /url: https://www.cultivoproject.org/donate/
            - mark [ref=f262e46]: to help support our work.
          - generic [ref=f262e48]:
            - code
          - heading "Mentorship" [level=4] [ref=f262e49]
          - paragraph [ref=f262e50]:
            - text: We hire
            - strong [ref=f262e51]: Mentors
            - text: to work alongside Interns, Apprentices and farmers/educators. If you are interested in this work, please
            - link "contact" [ref=f262e52] [cursor=pointer]:
              - /url: https://www.cultivoproject.org/contact/
            - text: us.
          - paragraph [ref=f262e53]: "Mentor tasks include:"
          - list [ref=f262e54]:
            - listitem [ref=f262e55]: Supporting young farmers, interns and apprentices
            - listitem [ref=f262e56]: Assisting with production planning for 2026 season with Cerro Vista Farm
            - listitem [ref=f262e57]: Building and maintaining local business relationships
            - listitem [ref=f262e58]: Preparing and delivering CSA shares
            - listitem [ref=f262e59]: Marketing and writing Newsletters
            - listitem [ref=f262e60]: Developing and supporting wholesale clients, including delivery schedules
            - listitem [ref=f262e61]:
              - text: Managing Media, Social Media, and archiving
              - emphasis [ref=f262e62]: farming education videos
            - listitem [ref=f262e63]: Working collaboratively with other community programs
            - listitem [ref=f262e64]: Organizing farm and garden volunteers
          - figure [ref=f262e65]
          - paragraph
