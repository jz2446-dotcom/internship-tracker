        - generic [ref=f237e112]:
          - heading "Your development" [level=2] [ref=f237e117]
          - generic [ref=f237e121]:
            - paragraph [ref=f237e122]: You’ll begin your summer internship with an interactive induction (or orientation) program, introducing you to all aspects of life at UBS. Throughout your time with us as a summer intern, we’ll also hold further interactive, informative sessions to help grow your skills. And events like Lunch & Learns with our senior leaders and social networking with colleagues will give you an even greater understanding of what a career with us would be like.
            - paragraph [ref=f237e123]: From the moment you join one of our summer internships, you’ll be supported by our experienced Junior Talent team for anything you might need, along with your line manager and buddy. In addition to professional skills, you’ll also gain a network of colleagues and the opportunity to join our UBS Graduate Talent Program if you excel in your summer internship.
        - generic [ref=f237e125]:
          - heading "What we look for and when to apply" [level=2] [ref=f237e131]
          - generic [ref=f237e133]:
            - generic [ref=f237e136]:
              - generic [ref=f237e139]:
                - paragraph [ref=f237e140]: You don’t need a degree in finance to be eligible for our summer internship, but we love performance-driven people who share their unique perspectives. Ideally, you’re a people person who doesn’t shy away from a good challenge. The world of finance is fast paced, but we’re known for thoughtful and well-defined solutions. It’s how we’ve come this far. We’re a great place to build a career, so bring your ambitions and we’ll match them.
                - paragraph [ref=f237e141]: Don’t want to miss out when new summer internship roles are posted?
