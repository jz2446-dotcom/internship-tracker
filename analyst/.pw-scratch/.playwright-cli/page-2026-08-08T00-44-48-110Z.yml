          - generic [ref=f237e84]:
            - generic [ref=f237e90]:
              - heading "Career experience and networking before you even get your degree." [level=3] [ref=f237e91]
              - paragraph [ref=f237e92]: If you’re going to be starting your second-to-last or final year of studies and have an interest in the world of finance, this is the summer internship for you. We welcome students from all academic backgrounds and perspectives to join us as a summer intern, building towards your career and learning from the best in the business. Your progression is our priority.
            - generic [ref=f237e98]:
              - figure [ref=f237e99]
