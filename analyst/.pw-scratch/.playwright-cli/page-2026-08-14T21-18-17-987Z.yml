                    - text: Overview
                    - generic [ref=f74e367]:
                      - paragraph [ref=f74e368]:
                        - text: The Surface Software organization works on the low-level firmware and Windows drivers that runs on millions of devices. The Power, Thermal, and Battery team is looking for a
                        - strong [ref=f74e369]: Senior Software Engineer
                        - text: to join our team and help build the next generation of platform software, diagnostics, telemetry, power and performance solutions that enable world-class hardware experiences across Microsoft devices.
                      - paragraph [ref=f74e370]: In this role, you will design and develop software, services, tools, and platform capabilities that improve system performance, power efficiency, reliability, manageability, and customer experience. You will work across hardware, firmware, Windows, and partner ecosystems to solve complex engineering problems that range across the full stack of software development.
                      - paragraph [ref=f74e371]: The candidate is a solid technical leader who enjoys working at the intersection of software and hardware, driving architecture, mentoring engineers, and delivering solutions that have broad impact across products and organizations.
                      - paragraph [ref=f74e372]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.
                    - text: Responsibilities
                    - list [ref=f74e373]:
                      - listitem [ref=f74e374]: Lead architecture discussions, develop complex design specifications, and ensure system design meets performance, resiliency, security, and compliance standards.
                      - listitem [ref=f74e375]: Continuously update skills, share knowledge, and drive adherence to engineering practices across security, scalability, performance, and accessibility.
                      - listitem [ref=f74e376]: Integrate logging and telemetry for system monitoring, security investigation, and continuous improvement, considering privacy implications.
                      - listitem [ref=f74e377]: Use debugging, logging, and telemetry proactively to prevent and investigate issues, applying root cause analysis and remediation.
                      - listitem [ref=f74e378]: Utilize AI tools responsibly across the software development lifecycle, improving processes and driving AI-enabled development practices.
                    - text: Qualifications
                    - paragraph [ref=f74e379]:
                      - heading "Required/Minimum Qualifications:" [level=3] [ref=f74e380]
                    - list [ref=f74e381]:
                      - listitem [ref=f74e382]:
                        - text: Bachelor's Degree in Computer Science or related technical field AND 4+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python.
                        - list [ref=f74e383]:
                          - listitem [ref=f74e384]: OR equivalent experience.
                    - paragraph [ref=f74e385]:
                      - strong [ref=f74e386]: "Other Requirements:"
                      - text: "Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include but are not limited to the following specialized security screenings:"
                    - list [ref=f74e387]:
                      - listitem [ref=f74e388]:
                        - strong [ref=f74e389]: "Microsoft Cloud Background Check:"
                        - text: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter.
                    - paragraph [ref=f74e390]:
                      - heading "Preferred Qualifications:" [level=3] [ref=f74e391]
                    - list [ref=f74e392]:
                      - listitem [ref=f74e393]: 5+ years of professional software engineering experience developing production software.
                      - listitem [ref=f74e394]: "Solid programming skills in one or more of: C, C#, C++, Python, Rust."
                      - listitem [ref=f74e395]: Experience with software architecture, distributed systems, system design, and debugging.
                      - listitem [ref=f74e396]: Experience developing Windows platform software, drivers, firmware interfaces, or device management solutions.
                      - listitem [ref=f74e397]: Experience in power management, performance optimization, telemetry, diagnostics, or system validation.
                      - listitem [ref=f74e398]: Experience working with hardware vendors, silicon partners, or OEM ecosystems.
                      - listitem [ref=f74e399]: Knowledge of reliability engineering, observability platforms, and production service operations.
                    - paragraph [ref=f74e400]: "#W+DJOBS"
                    - paragraph [ref=f74e401]: Software Engineering IC4 - The typical base pay range for this role across the U.S. is USD $119,800 - $234,700 per year. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $160,200 - $261,000 per year.
                    - paragraph
                    - paragraph [ref=f74e402]:
                      - text: "Certain roles may be eligible for benefits and other compensation. Find additional benefits and pay information here:"
