            - heading "Area Maintenance Manager Intern - Summer 2027 (Nationwide)" [level=1] [ref=f852e38]
            - paragraph [ref=f852e40]: "Job ID: 10495055 | Amazon.com Services LLC - A57"
          - link "Apply now for Area Maintenance Manager Intern - Summer 2027 (Nationwide)" [ref=f852e43] [cursor=pointer]:
