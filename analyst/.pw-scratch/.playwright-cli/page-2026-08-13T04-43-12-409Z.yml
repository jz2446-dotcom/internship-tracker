            - text: Apply now
        - generic [ref=f852e45]:
          - generic [ref=f852e47]:
            - generic [ref=f852e48]:
              - heading "Description" [level=2] [ref=f852e49]
              - paragraph [ref=f852e50]: "Application deadline: Applications will be accepted on an ongoing basisPower that runs the world | Discover careers in OperationsOperations roles at Amazon put you at the center of how things move from a click to a doorstep. You'll help design, improve, and run systems that connect people, products, and places at scale. You'll take ownership early, work closely with teams to solve real-world challenges, and see the direct results of your decisions as they reach customers every day. Here, the impact of what you build isn't abstract, it's visible, immediate, and meaningful - keeping one of the world's most complex operations moving forward. This is where your journey takes shape through action, responsibility, and the opportunity to grow in many directions. This is not a corporate, remote or office-based position. This is a ten-week internship (40 hours per week) during the summer of 2027 located within one of Amazon’s fulfillment centers, sort centers, delivery stations or other operations buildings. Amazon is seeking customer focused individuals eager to develop a collaborative leadership style with a team of hourly technicians across our Operations network! Our warehouses are fast-paced supply chain environments where standing, walking, and having on-the-production floor conversations are common. As an Area Maintenance Manager Intern, you will learn how to coach, motivate and mentor a team of Amazon mechanical technicians in a warehouse environment. At Amazon, we’re committed to maintaining a safe working environment and being the most maintenance-centric company. If you are eager to lead maintenance initiatives and engineering efficiency, apply to join our team in Reliability, Maintenance, and Engineering (RME)!During your internship you will learn from site Area Maintenance Manager(s), dive into standard work, innovation, and continuous improvement through a metric-impacting intern project. Most projects are rooted in engineering process improvement and in the past have included creating operator based preventative maintenance initiatives, equipment performance and efficiency statistical analyses, and maintenance process mapping. We strive to continuously improve and optimize our fulfillment processes to ensure customer satisfaction and exceed their expectations. Term: 10 weeks Benefits: Access to Amazon's Medical Advice Line, Employee Assistance Program (EAP), and financial benefits. Visit www.aboutamazon.com/workplace/facilities to find more information on each of our building types. Please note we are not able to provide sponsorship now or in the future for these positions. Eligible candidates must have work authorization without employer intervention to be considered. This role will require the flexibility to relocate, as we prioritize placing candidates based on business need. Site placement is matched by aligning your location preferences with location availability after your interview. Summer relocation and housing assistance provided if eligible.Based on your performance during the internship, you will have the opportunity to receive an offer for full-time employment upon graduation. Key job responsibilitiesDedicated to supporting multi-site production by working in a safe, customer-focused manner; and must be highly self-motivated and customer-centric• Develop and design solutions to difficult problems, manage outside contractors and be on call for emergencies• Handle multiple projects and daily activities, meet deadlines and develop plans on how to accomplish departmental and distribution goals• Ensuring that all safety programs and procedures are followed, develop and maintain preventative maintenance programs and good working relationships with operations• Develop business plans and provide guidance and direction for the successful implementation of those plans• Help to develop, set and track budgets• Understand and implement safety programs• Successful candidates must have the ability to provide enriched feedback to enhance individual performance, provide associates with written performance appraisals including discipline and up to termination• Mentor all facilities associates by motivating and providing direction to help them achieve their goals and make a consistent effort to go above and beyond• Project planning and cost analysis• The Area Maintenance Manager Intern promotes and conducts good housekeeping"
            - generic [ref=f852e51]:
              - heading "Basic Qualifications" [level=2] [ref=f852e52]
              - paragraph [ref=f852e53]: "- Currently enrolled in a bachelor’s degree program with all requirements anticipated to be completed between December 2027 and August 2028."
            - generic [ref=f852e54]:
              - heading "Preferred Qualifications" [level=2] [ref=f852e55]
              - paragraph [ref=f852e56]:
                - text: "- Strong communication skills, both verbal and written.- Excellent customer service and interpersonal skills.- Currently enrolled in a Bachelor's program for Civil, Electrical, Industrial, Mechanical, or another related field.Amazon is an equal opportunity employer and does not discriminate on the basis of protected veteran status, disability, or other legally protected status.Los Angeles County applicants: Job duties for this position include: work safely and cooperatively with other employees, supervisors, and staff; adhere to standards of excellence despite stressful conditions; communicate effectively and respectfully with employees, supervisors, and staff to ensure exceptional customer service; and follow all federal, state, and local laws and Company policies. Criminal history may have a direct, adverse, and negative relationship with some of the material job duties of this position. These include the duties and responsibilities listed above, as well as the abilities to adhere to company policies, exercise sound judgment, effectively manage stress and work safely and respectfully with others, exhibit trustworthiness and professionalism, and safeguard business operations and the Company’s reputation. Pursuant to the Los Angeles County Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.Our inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit"
                - link "https://amazon.jobs/content/en/how-we-hire/accommodations" [ref=f852e57] [cursor=pointer]:
