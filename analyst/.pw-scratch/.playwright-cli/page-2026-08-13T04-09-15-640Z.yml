    - main [ref=f287e78]:
      - generic [ref=f287e83]:
        - paragraph [ref=f287e84]: From selling properties to supporting the achievement of net zero spaces of tomorrow, we have compelling roles across every dimension of the industry. This is the place where talented people who want to do impactful work can create their own path to success. Don’t just imagine the future of work—create it.
        - paragraph [ref=f287e85]: Careers at CBRE combine the support and resources of a global powerhouse with the opportunity to create your own path to success. We’re an organization of dynamic professionals that welcome challenge and thrive in creating impact for communities and businesses.
      - generic [ref=f287e89]:
        - heading "Discover CBRE" [level=3] [ref=f287e90]
        - paragraph [ref=f287e91]: Commercial real estate is considerably more than the confines of physical space. It’s management, investments, finance, logistics, workplace experience, strategic consulting, valuations, environmental sustainability, digital solutions and most significantly, people.
      - generic [ref=f287e95]:
        - paragraph [ref=f287e98]:
          - text: Why CBRE
          - link:
            - /url: https://www.cbre.com/about-us/culture-and-history
          - text: When you join CBRE, you become part of a global leader in commercial real estate and investment services that help businesses and people thrive. We are dynamic problem solvers and forward-thinking professionals who create significant impact. Our collaborative culture is built on our shared values — respect, integrity, service, and excellence — and we value the diverse perspectives, backgrounds, and skillsets of our people. At CBRE, you have the opportunity to chart your own course and realize your full potential. Discover more about CBRE and join us.
