        - generic [ref=f287e151]:
          - generic [ref=f287e152]: Cookies help make this site more useful for you by supporting faster page loading, relevant content, and reliable features. Essential cookies help the site function properly. With your permission, optional cookies remember preferences, understand how pages are used, understand interests, and show relevant content and ads. These cookies collect information such as which pages are viewed, how visitors move through the site, what content is engaged with, and whether actions like form submissions are completed. Some of this data may be shared with trusted third‑party partners. Your consent is valid for up to one year, and you can accept, reject, or update your choices any time in Cookie Settings.
