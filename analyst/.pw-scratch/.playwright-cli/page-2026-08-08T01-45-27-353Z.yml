            - heading "Jobs at CPL" [level=1] [ref=e148]
            - generic [ref=e149]:
              - paragraph [ref=e150]: At the Chicago Public Library, we value our innovative services, transformative collections and renovated buildings, but our most valuable asset is our staff. We employ approximately 900 people at more than 80 locations in jobs ranging from pages, clerks and librarians to support and administrative positions.
              - paragraph [ref=e151]: We welcome candidates who are committed to excellent customer service. We invite you to consider us as a place to begin or continue your career.
              - heading "Current Openings" [level=2] [ref=e152]
              - paragraph [ref=e153]:
                - link "City of Chicago Job Opportunities" [ref=e154] [cursor=pointer]:
                  - /url: http://www.cityofchicago.org/city/en/depts/dhr/provdrs/emp.html
              - paragraph [ref=e155]: We are a department of the City of Chicago, and our hiring process is handled by the City’s Human Resources Department. Library employment opportunities are posted along with those for other departments. Please check weekly for any new openings.
              - paragraph [ref=e156]: See individual postings for information on job qualifications and duties. Please note, Bid Opportunities are postings for Chicago Public Library employees who are members of the bargaining unit that represents the position.
          - button "Print this page" [ref=e158] [cursor=pointer]
