                  - heading "Center Parcs" [level=2] [ref=f11e1246]
                - paragraph [ref=f11e1249]: Center Parcs owns and operates six villages across the U.K. and Ireland, with capacity for ~25,000 guests, high–quality accommodations and a range of exceptional leisure facilities—each set within 400 acres of protected and enhanced woodland. Work is underway on a seventh village in the Scottish Borders. Since 2015, Brookfield has partnered with Center Parcs’ outstanding management team, reinvesting over £750 million into the business.
