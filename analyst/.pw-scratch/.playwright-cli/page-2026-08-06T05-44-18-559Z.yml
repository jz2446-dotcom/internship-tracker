              - generic [ref=f11e1229]:
                - paragraph [ref=f11e1230]: In the heart of Dubai’s financial core, ICD Brookfield Place blends 990,000 square feet of modern, sustainable office space with 160,000 square feet of curated retail, dining, and community amenities across four acres of vibrant public realm.
                - paragraph [ref=f11e1231]: Built to LEED Platinum standards, the property reflects our commitment to best-in-class operations, tenant wellbeing, and long-term value. With over 98% occupancy by top-tier global firms, ongoing enhancements to retail, arts programming, and wellness facilities continue to strengthen engagement and performance.
