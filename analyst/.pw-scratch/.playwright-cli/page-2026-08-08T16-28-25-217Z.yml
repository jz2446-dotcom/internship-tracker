      - article [ref=f415e41]:
        - generic [ref=f415e42]:
          - heading "Summer 2025 Internships at The Solomon R. Guggenheim Museum" [level=1] [ref=f415e44]
          - generic [ref=f415e45]:
            - generic [ref=f415e46]:
              - generic [ref=f415e47]: " Posted on:"
              - link [ref=f415e48] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/2025/01/16/summer-2025-internships-at-the-solomon-r-guggenheim-museum/
                - time [ref=f415e49]: January 16, 2025
              - text: 
            - generic [ref=f415e50]:
              - generic [ref=f415e51]: " Written by:"
              - link "Charlie Maliha" [ref=f415e52] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/author/cm6232/
          - generic [ref=f415e53]:
            - paragraph [ref=f415e54]:
              - strong [ref=f415e55]: "Solomon R. Guggenheim Museum Internship Program: Summer 2025"
            - paragraph [ref=f415e56]:
              - text: "Position/Title: Intern Position Type: Part-time, 32 hours a week, 8 weeks Internship Period: Monday, June 2, to Friday, July 25, 2025 Compensation: $18 per hour Application Deadline: Friday, January 31, 2025, at 11:59 pm EST (Eastern Standard Time)"
              - strong [ref=f415e57]: Overview
              - text: The Guggenheim is committed to championing the aspirations of early career arts professionals. In support of our
              - link "Diversity, Equity, Access, and Inclusion plan" [ref=f415e58] [cursor=pointer]:
                - /url: https://www.guggenheim.org/foundation/diversity-equity-access-and-inclusion
              - text: ", the paid Guggenheim Museum Internship Program creates paths that lead to a more inclusive and diverse institution and arts field. The program provides practical training experience to currently enrolled undergraduate and graduate students, as well as recent graduates interested in pursuing careers in the arts and museum fields. Interns are assigned to one department for the duration of the program based on their academic background and interests and gain a broad understanding of how a particular department functions within the context of a major museum, as well as specific knowledge and skills related to departmental responsibilities. Under the supervision of designated staff members, interns work independently on projects, attend group meetings, and participate in ongoing conversations and processes within their department."
            - paragraph [ref=f415e59]:
              - strong [ref=f415e60]: Department Placements
              - text: The summer 2025 internship program will offer
              - strong [ref=f415e61]: twelve
              - text: "internship positions in the following departments: Advancement (Corporate or Development Operations and Individual Giving), Communications (PR), Conservation, Curatorial (Contemporary or European Modernist with German language knowledge), Education (Academic Engagement or School, Youth, and Family Programs), Exhibition Design, Library and Archives, Photography, Publications, and Registrar. For a full list of departments, see"
              - link "https://www.guggenheim.org/internships-and-academic-programs/internship-departments" [ref=f415e62] [cursor=pointer]:
                - /url: https://www.guggenheim.org/internships-and-academic-programs/internship-departments
              - text: . Please note that not all departments offer internships every cycle.
            - paragraph [ref=f415e63]:
              - strong [ref=f415e64]: Internship Description
              - text: The summer 2025 internship is hybrid, meaning interns are expected to work on-site a minimum of three days a week. The program begins on Monday, June 2, and ends on Friday, July 25, 2025. Summer internships require a commitment of approximately 32 hours per week for the full 8 weeks, and as a part of that requirement, participants are expected to be available on Friday mornings for Museum Culture Seminars. Museum Culture Seminars are weekly professional development meetings that bring together interns from different departments to connect and learn from one another. Museum Culture Seminars are held primarily on-site at the museum and include presentations by Guggenheim staff and other arts professionals, as well as discussions of current issues and trends within the field. They may also include the opportunity for field trips to other institutions. Interns are expected to provide their own computer to ensure participation in the remote work portion of the internship.
            - paragraph [ref=f415e65]:
              - strong [ref=f415e66]: Eligibility
              - text: Applicants must have completed at least two years of undergraduate studies to apply. Priority is given to rising juniors or seniors in undergraduate programs and to graduate students. Recent graduates are also welcome to apply. Applicants do not need an art history background or previous internship experience to apply for this position. The museum welcomes candidates of all backgrounds to apply. Applicants must be authorized to work in the United States.
            - paragraph [ref=f415e67]:
              - strong [ref=f415e68]: Compensation
              - text: The Summer 2025 Internship Program is a paid opportunity. The Guggenheim Museum is pleased to offer interns $18 per hour for their participation in the program.
            - paragraph [ref=f415e69]:
              - strong [ref=f415e70]: Application Process
              - text: Please visit our Careers Page (
              - link "https://www.guggenheim.org/careers" [ref=f415e71] [cursor=pointer]:
                - /url: https://www.guggenheim.org/careers
              - text: ") to apply for internships and select the top two departments of interest. In addition to completing the online form, applicants are asked to submit the following materials:"
            - list [ref=f415e72]:
              - listitem [ref=f415e73]: Resume
            - list [ref=f415e74]:
              - listitem [ref=f415e75]: Cover letter, including an explanation of your interest in two specific departments and a description of how this internship would enhance your professional and academic goals
            - list [ref=f415e76]:
              - listitem [ref=f415e77]: Writing sample (3–5 pages), if you are applying to departments not requiring a portfolio
            - list [ref=f415e78]:
              - listitem [ref=f415e79]: Portfolio (website or PDF), if applying to Exhibition Design or Photography
            - paragraph [ref=f415e80]:
              - strong [ref=f415e81]: Deadline
              - text: All applications must be submitted by Friday, January 31, 2025, at 11:59 pm EST (eastern standard time).
            - paragraph [ref=f415e82]: Following an initial review of the applications, selected candidates will be contacted to schedule a virtual interview. If you have not been contacted by March 14, then you have not been selected as a finalist for the program.
            - paragraph [ref=f415e83]:
              - text: For any questions, please email
              - link "internships@guggenheim.org" [ref=f415e84] [cursor=pointer]:
                - /url: mailto:internships@guggenheim.org
              - text: .
            - paragraph [ref=f415e85]:
              - link "Apply Here" [ref=f415e86] [cursor=pointer]:
                - /url: https://theapplicantmanager.com/jobs?pos=NY571&utm_medium=Email&utm_source=SFMC&utm_campaign=InternApp_122425
