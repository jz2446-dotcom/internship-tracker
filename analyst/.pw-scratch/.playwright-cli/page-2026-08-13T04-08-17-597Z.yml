            - generic [ref=f259e64]:
              - text: "Job Description The US Internship Program The Kraft Heinz Internship Program is designed to grow the future leaders of Kraft Heinz. This program is for high-performing, ambitious, and creative individuals who are ready to lead the future of food and beverage. Throughout the program, Interns will hone their understanding of our business and industry, collaborate across the business to grow our iconic brands, and learn how to build their own legacy here at Kraft Heinz. What's on the Menu for the Internship Program? The Kraft Heinz Internship Program is a ten-week leadership development program that includes:"
              - list [ref=f259e65]:
                - listitem [ref=f259e66]: One week of immersive onboarding to learn about our business and prepare important skills for a successful summer project
              - list [ref=f259e67]:
                - listitem [ref=f259e68]: Eight weeks dedicated to a project exploring new business opportunities and unlocking creative solutions
              - list [ref=f259e69]:
                - listitem [ref=f259e70]: One week of final presentations and celebrations with our executive leadership team and intern peers
              - list [ref=f259e71]:
                - listitem [ref=f259e72]: Weekly sessions to deep dive into our values, grow as leaders, and develop impactful skills for early career success.
              - list [ref=f259e73]:
                - listitem [ref=f259e74]: A group business challenge to research insights and uncover opportunities for our business.
              - list [ref=f259e75]:
                - listitem [ref=f259e76]: Based on performance, interns will have an opportunity to return to Kraft Heinz in the 202 7 Internship or Trainee Programs.
              - text: "Throughout the program, Interns can also expect regular opportunities to meet with our CEO, North America President, Chief People Officer, and other senior executives; mentorship from previous Trainees and business leadership; and curated learning experiences to help with grow as leaders and as cultural ambassadors of Kraft Heinz. Our internship will run from June 8 th 202 6 to August 14 th 202 6 . What Do Interns Work On? Intern projects propel our beloved brands forward, from exploring emerging opportunities to appeal to Gen Z audiences, to digitally revolutionizing our ability to track our supply chain in real time, to developing new packaging in support of our Environmental, Social and Governance goals. When applying, applicants will select a track that they most want to pursue for their internship experience:"
              - list [ref=f259e77]:
                - listitem [ref=f259e78]: Marketing
              - list [ref=f259e79]:
                - listitem [ref=f259e80]: Sales
              - list [ref=f259e81]:
                - listitem [ref=f259e82]: Operations (Procurement, Logistics, Supply Chain)
              - list [ref=f259e83]:
                - listitem [ref=f259e84]: Finance
              - list [ref=f259e85]:
                - listitem [ref=f259e86]: Research & Development
              - list [ref=f259e87]:
                - listitem [ref=f259e88]: Human Resources
              - text: Recipe for Success We are looking for candidates who...
              - list [ref=f259e89]:
                - listitem [ref=f259e90]: Are pursuing a Bachelors degree with anticipated graduation between December 1, 202 6 and June 30, 2028
              - list [ref=f259e91]:
                - listitem [ref=f259e92]: Are innovative thinkers and problem solvers
              - list [ref=f259e93]:
                - listitem [ref=f259e94]: Choose greatness by challenging the status quo
              - list [ref=f259e95]:
                - listitem [ref=f259e96]: Take leadership opportunities to make an impact
              - list [ref=f259e97]:
                - listitem [ref=f259e98]: Have a passion for our values and the future of our brands
              - list [ref=f259e99]:
                - listitem [ref=f259e100]: Are able to lead through challenges
              - list [ref=f259e101]:
                - listitem [ref=f259e102]: Take complex concepts and look for ways to simplify
              - text: "New Hire Rate:"
              - list [ref=f259e103]:
                - listitem [ref=f259e104]: $26 USD per Hour ( $ 1040 USD Weekly)
              - text: "Our Values Our Interns are expected to live out the Kraft Heinz values as cultural champions and future leaders at the organization. At Kraft Heinz, our values are:"
              - list [ref=f259e105]:
                - listitem [ref=f259e106]: We are consumer obsessed
              - list [ref=f259e107]:
                - listitem [ref=f259e108]: We dare to do better every day
              - list [ref=f259e109]:
                - listitem [ref=f259e110]: We champion great people
              - list [ref=f259e111]:
                - listitem [ref=f259e112]: We demand diversity
              - list [ref=f259e113]:
                - listitem [ref=f259e114]: We do the right thing
              - list [ref=f259e115]:
                - listitem [ref=f259e116]: We own it
              - text: The Recruitment Process Internship program applications are accepted through October, 2 nd 2025 .
              - list [ref=f259e117]:
                - listitem [ref=f259e118]: "Step 1: Application and Games-Based Assessment"
              - list [ref=f259e119]:
                - listitem [ref=f259e120]: "Step 2 : Virtual Interviews with Business Leaders"
              - list [ref=f259e121]:
                - listitem [ref=f259e122]: "Step 3 : Final On-Site Interview Day at our Chicago Headquarters"
              - text: "Program Location Interns on the Marketing , Sales, Finance, HR, and Operations tracks will be based in Chicago, IL and Interns on the R&D track will be based in Glenview, IL. All interns will be provided housing for the duration of their program. About Us Kraft Heinz is a global food company with a delicious heritage. With iconic and emerging food and beverage brands around the world, we deliver the best taste, fun and quality to every meal table we touch. We're on a mission to disrupt not only our own business, but the global food industry. A consumer obsession and unexpected partnerships fuel our progress as we drive innovation across every part of our company. Around the world, our people are connected by a culture of ownership, agility and endless curiosity. We also believe in being good humans, who are working to improve our company, communities, and planet. We're proud of where we've been - and even more thrilled about where we're headed - as we nourish the world and lead the future of food. Why Us We grow our people to grow our business. We champion great people who bring ambition, curiosity, and high performance to the table as the guardians of our beloved and nostalgic brands. Good isn't good enough. We choose greatness every day by challenging the ordinary and making bold decisions. All while celebrating our wins - and our failures - as we work together to lead the future of food. Challenging the status quo takes talent. We invest in your purpose and potential by developing skills and nurturing strengths that leave a legacy on our business and a lasting impact on your career. Because great people make great companies, and we're growing something great here at Kraft Heinz. Office Collaboration & Hybrid Work Environment We believe our office environment fuels our collaboration, connection & community as an organization and allows our employees to grow toward greatness. We also believe providing a more flexible and agile model is essential in today's workplace. A majority of our office-based employees will be able to work remotely for up to two days each week. Some jobs may be required to be performed fully in office depending on the role's responsibilities and requirements. Kraft Heinz is an Equal Opportunity Employer that prohibits discrimination or harassment of any type. All qualified applicants are considered for employment without regard to race, color, national origin, age, sex, sexual orientation, gender, gender identity or expression, disability status, protected veteran status, or any other characteristic protected by law. Applicants who require an accommodation to participate in the job application or hiring process should contact NATAI@kraftheinz.com. Benefits: Coverage for employees (and their eligible dependents) through affordable access to healthcare, protection, and saving for the future, we offer plans tailored to meet you and your family's needs. Coverage for benefits will be in accordance with the terms and conditions of the applicable plans and associated governing plan documents.Wellbeing: We offer events, resources, and learning opportunities that inspire a physical, social, emotional, and financial well-being lifestyle for our employees and their families.You'll be able to participate in a variety of benefits and wellbeing programs that may vary by role, country, region, union status, and other employment status factors, for example:"
              - list [ref=f259e123]:
                - listitem [ref=f259e124]: Physical - Medical, Prescription Drug, Dental, Vision, Screenings/Assessments
                - listitem [ref=f259e125]: Social - Paid Time Off, Company Holidays, Leave of Absence, Recognition, Training
                - listitem [ref=f259e126]: Emotional - Employee Assistance Program , Wellbeing Programs, Family Support Programs
                - listitem [ref=f259e127]: Financial - 401k, Life, Accidental Death & Dismemberment, Disability
              - text: Location(s) Chicago/Aon CenterKraft Heinz is an Equal Opportunity Employer that prohibits discrimination or harassment of any type. All qualified applicants are considered for employment without regard to race, color, national origin, age, sex, sexual orientation, gender, gender identity or expression, disability status, protected veteran status, or any other characteristic protected by law. Applicants who require an accommodation to participate in the job application or hiring process should contact NAZTAOps@kraftheinz.com .
