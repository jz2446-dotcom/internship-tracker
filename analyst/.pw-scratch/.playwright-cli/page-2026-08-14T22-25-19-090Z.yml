                  - generic [ref=f927e364]:
                    - text: Overview
                    - paragraph [ref=f927e365]: Microsoft’s Discovery and Quantum (MDQ) division develops and delivers advanced artificial intelligence (AI), cloud-enabled capabilities, and strategic technologies to help solve the world’s major challenges. From accelerating scientific discovery with advanced AI tools, to pioneering breakthroughs in quantum computing, to advancing robotics and AI capabilities that drive real-world impact, joining MDQ means building the future, partnering with fast-moving innovators, and operating in a high-impact, mission-driven environment.
                    - paragraph [ref=f927e366]: At Microsoft Robotics within MDQ, we build and deploy technologies that enable people, robots, and AI agents to collaborate and achieve more.
                    - paragraph [ref=f927e367]: We are building Microsoft’s platform for physical intelligence—an integrated robotics software and AI platform that brings together humans, robots, and agents through robotics AI models, innovative teaming solutions and experiences, physically grounded agentic AI workflows, trustworthy test and evaluation, and real-world customer-focused validation. Built on Microsoft’s core platforms and delivered through and with a global ecosystem of partners and customers, this platform accelerates AI for the physical world and helps robotics solutions move from experimentation to reliable, scaled deployment.
                    - paragraph [ref=f927e368]: We are hiring a Member of Technical Staff, Microsoft Robotics (Hardware Systems) at the hardware Semnior engineer level, to support the design, integration, testing, and maintenance of robotic hardware platforms used across Microsoft’s robotics development and validation programs. This engineer will work hands-on with commercial and customized robotic platforms, sensor suites, compute modules, networking equipment, and lab infrastructure to ensure robots are reliable, well-instrumented, and ready for software development, AI model evaluation, and field deployment. The role combines mechanical aptitude, electrical systems knowledge, networking systems depth, and systems integration skills in a fast-paced robotics development environment.
                    - paragraph [ref=f927e369]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.
                    - text: Responsibilities
                    - list [ref=f927e370]:
                      - listitem [ref=f927e371]: Support the design, assembly, integration, and maintenance of robotic hardware platforms, including manipulators, mobile bases, sensor arrays, compute enclosures, power systems, and end-effector tooling.Ingest device specification sheets, electrical schematics, and mechanical drawings into AI systems to support and accelerate configuration, calibration, and troubleshooting of robotic hardware components and subsystems.
                      - listitem [ref=f927e372]: Perform hardware-software integration for robotic platforms, including sensor bring-up (cameras, LiDAR, force/torque sensors, tactile arrays), compute module configuration, network provisioning, and firmware updates.
                      - listitem [ref=f927e373]: Develop and execute hardware verification and validation test plans, including functional testing, environmental stress testing, endurance testing, and safety compliance verification for robotic subsystems.
                      - listitem [ref=f927e374]: Create and maintain design documentation including assembly drawings, wiring diagrams, bills of materials, specifications, and calibration procedures for robotic hardware configurations.
                      - listitem [ref=f927e375]: Set up and maintain robotics lab environments, including workstations, test fixtures, safety infrastructure, tool inventories, and environmental controls, following established safety guidelines.
                      - listitem [ref=f927e376]: Identify common project risks (e.g., supplier delays, incomplete specifications, component obsolescence) and develop mitigation plans to keep hardware integration timelines on track.
                      - listitem [ref=f927e377]: Gather information and participate in make-versus-buy decisions based on complexity, cost, quality, reliability, and schedule impact for robotic hardware components and subsystems.
                      - listitem [ref=f927e378]: Develop prototype components and assemblies for validation of new robotic capabilities, working closely with software and AI teams to ensure hardware meets requirements for AI model training and evaluation.
                      - listitem [ref=f927e379]: Communicate project progress and technical status within the project team, including hardware readiness, integration milestones, and issue escalations, providing clear and timely updates to engineering and program leadership.
                    - list [ref=f927e380]:
                      - listitem [ref=f927e381]:
                        - text: Embody our
                        - link "Culture" [ref=f927e382] [cursor=pointer]:
                          - /url: https://../sites/Culture/
                        - text: and
                        - link "Values" [ref=f927e383] [cursor=pointer]:
                          - /url: https://../sites/Values
                    - text: Qualifications
                    - paragraph [ref=f927e384]:
                      - strong [ref=f927e385]: Required Qualifications
                    - list [ref=f927e386]:
                      - listitem [ref=f927e387]:
                        - text: Doctorate in Physics, Engineering, or related field AND 1+ year(s) experience in industry or in a research and development environment, could include completion of a post doctoral research position
                        - list [ref=f927e388]:
                          - listitem [ref=f927e389]: OR Master's Degree in Physics, Engineering, or related field AND 4+ years experience in industry or in a research and development environment
                          - listitem [ref=f927e390]: OR Bachelor's Degree in Physics, Engineering, or related field AND 6+ years experience in industry or in a research and development environment
                          - listitem [ref=f927e391]: OR equivalent experience.
                    - paragraph [ref=f927e392]:
                      - strong [ref=f927e393]: Other Requirements
                    - list [ref=f927e394]:
                      - listitem [ref=f927e395]:
                        - text: Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include but are not limited to the following specialized security screenings
                        - list [ref=f927e396]:
                          - listitem [ref=f927e397]: "Microsoft Cloud Background Check: This position will be required to pass the Microsoft Cloud Background Check upon hire/transfer and every two years thereafter."
                    - paragraph [ref=f927e398]:
                      - strong [ref=f927e399]: Preferred Qualifications
                    - list [ref=f927e400]:
                      - listitem [ref=f927e401]:
                        - text: Doctorate in Physics, Engineering, or related field AND 3+ years experience in industry or in a research and development environment, could include completion of a post doctoral research position
                        - list [ref=f927e402]:
                          - listitem [ref=f927e403]: OR Master's Degree in Physics, Engineering, or related field AND 6+ years experience in industry or in a research and development environment OR Bachelor's Degree in Physics, Engineering, or related field AND 8+ years experience in industry or in a research and development environment
                          - listitem [ref=f927e404]: OR equivalent experience.
                      - listitem [ref=f927e405]: Hands-on experience assembling, integrating, or maintaining robotic systems, including commercial platforms (e.g., Universal Robots, Franka, Boston Dynamics, mobile robots, legged robots, (semi-)humanoids) or custom research robots.
                      - listitem [ref=f927e406]: Familiarity with sensor technologies used in robotics (cameras, depth sensors, LiDAR, IMUs, force/torque sensors, encoders) and their integration, calibration, and debugging.
                      - listitem [ref=f927e407]: Experience with embedded computing platforms (NVIDIA Jetson, Intel NUC, or equivalent), Linux-based systems, and robotics networking (Ethernet, CAN bus, EtherCAT).
                      - listitem [ref=f927e408]: Proficiency with CAD tools (SolidWorks, Fusion 360, or equivalent) and basic mechanical prototyping skills (3D printing, machining, soldering).
                      - listitem [ref=f927e409]: Understanding of electrical safety, lab safety protocols, and experience working in robotics or electromechanical lab environments.
                      - listitem [ref=f927e410]: Experience with hardware-in-the-loop (HIL) testing, automated hardware test systems, or robot calibration workflows.
                    - paragraph [ref=f927e411]: "#MicrosoftRobotics #MDQ"
                    - paragraph [ref=f927e412]: Hardware Engineering IC4 - The typical base pay range for this role across the U.S. is USD $119,800 - $234,700 per year. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $160,200 - $261,000 per year.
