    - main [ref=f392e14]:
      - generic [ref=f392e16]:
        - heading "Research Room Internship, John F. Kennedy Presidential Library, (Boston, MA)" [level=1] [ref=f392e17]
        - paragraph [ref=f392e18]: Posted December 11, 2024
        - paragraph [ref=f392e19]:
          - strong [ref=f392e20]: "Job Description:"
        - paragraph [ref=f392e21]: The John F. Kennedy Presidential Library and Museum is currently seeking applicants for one part-time internship positions in the Library’s research room. Interns in the Research Room at the John F. Kennedy Presidential Library assist professional reference staff in responding to research requests for textual (paper-based) archival collections. The intern’s primary responsibility will be answering reference requests from off-site researchers, including anyone from scholars to publishers to the general public, and covering a wide range of topics. Interns also support other aspects of textual reference work including preservation, database management, digitization, interlibrary loan, and other duties as necessary. The internship requires excellent research and writing ability and customer service skills; interest in learning new subjects and technologies; initiative to start new research requests; and a strong commitment to public service.
        - paragraph [ref=f392e22]: As an intern at the Kennedy Library, you will work alongside and learn from professional archivists. You will be encouraged to ask questions about the profession and the processes employed by the Library, and you will have the unique opportunity to gain experience at a Presidential Library, which is part of the National Archives and Records Administration.
        - paragraph [ref=f392e23]:
          - strong [ref=f392e24]: Requirements
          - text: ":"
        - paragraph [ref=f392e25]: Candidates must be US citizens currently enrolled in a graduate program, preferably in archival studies, history, or public history. The internship is part-time at two days a week and interns will receive a monthly stipend of $750, paid on the 15th of the month. This internship would start January 15th and end May 14th, with the strong possibility of continuing the internship into the academic year. Available days are Tuesday through Friday. Currently, there is one internship position open.
        - heading "How to Apply:" [level=2] [ref=f392e26]
        - paragraph [ref=f392e27]: "Applications will be accepted through December 17, 2024. To apply, please send in the following documents:"
        - list [ref=f392e28]:
          - listitem [ref=f392e29]: Completed Intern Application Form
          - listitem [ref=f392e30]: Unofficial College Transcript
          - listitem [ref=f392e31]: Letter of Recommendation
          - listitem [ref=f392e32]: Cover Letter
          - listitem [ref=f392e33]: Résumé
        - paragraph [ref=f392e34]: These should be sent as pdf attachments to corbin.apkin@nara.gov. Please include your name and the posting number (above) in the subject line of your email. Cover letters should also reference the posting number.
