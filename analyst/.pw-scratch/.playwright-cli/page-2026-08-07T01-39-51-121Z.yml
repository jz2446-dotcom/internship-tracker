            - paragraph [ref=f212e157]:
              - strong [ref=f212e158]: "New Professionals:"
              - text: CITIC CLSA takes young professionals with a minimum of three years’ experience rather than new graduates. We provide training and opportunities for movement across the business.
          - generic [ref=f212e159]:
            - img "Icon4" [ref=f212e160]
            - paragraph
