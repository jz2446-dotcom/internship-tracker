            - paragraph [ref=f212e162]:
              - strong [ref=f212e163]: "Learning and Development:"
              - text: At CITIC CLSA, development is a two-way process; the more you put in, the more you will get out. From day one you have access to an extensive online platform, which is complemented by various face-to-face development initiatives.
