    - generic [ref=f212e107]:
      - heading [level=1]
      - paragraph
      - generic [ref=f212e108]:
        - generic [ref=f212e109]: DISCOVER CITIC CLSA
        - paragraph [ref=f212e111]: At CITIC CLSA, we believe that curiosity, creativity, and intelligence drive success in a dynamic, global organisation. We value your unique ideas and experiences, empowering you to make an immediate impact. Discover our commitment to fostering a vibrant culture, embracing diversity, and supporting our employees through robust networks and opportunities across various business areas.
      - generic [ref=f212e114]:
        - heading "Culture" [level=2] [ref=f212e115]
        - heading "Our Culture is defined by our employees." [level=3] [ref=f212e116]
        - paragraph [ref=f212e117]: We value individuals, who collectively and collaboratively drive the organisation forward.
        - paragraph [ref=f212e118]: Founded by two former journalists, CITIC CLSA was created to provide global asset managers differentiated insights and superior sales service. Our culture at CITIC CLSA is underpinned by the core values of excellence, innovation, integrity, and celebration with clients at the centre of all that we do.
      - generic [ref=f212e120]:
        - heading "Diversity" [level=2] [ref=f212e121]
        - heading "CITIC CLSA employees are global citizens whose diversity of academic, cultural, professional and life experiences enrich our corporate culture." [level=3] [ref=f212e122]
        - paragraph [ref=f212e123]: Conscious efforts to diversify our employee base include recruiting, training, and promoting women, taking interns from diverse economic backgrounds, and providing an inclusive workplace environment.
      - generic [ref=f212e128]:
        - heading "Employee Networks" [level=2] [ref=f212e129]
        - heading "Employees represent their interests across the organisation." [level=3] [ref=f212e130]
        - paragraph [ref=f212e131]: Collaborative employee networks provide opportunities for networking, knowledge sharing and greater collaboration across businesses, functions and cultures at CITIC CLSA. The CITIC CLSA Gender Equality Network and Women in IT network are active platforms for exchange.
      - generic [ref=f212e133]:
        - heading "Areas of Business" [level=2] [ref=f212e134]
        - heading "CITIC CLSA employees work across Global Equities, Corporate Finance & Capital Markets and Asset Management as well as the corporate functions that support these businesses." [level=3] [ref=f212e135]
        - paragraph [ref=f212e136]: The CITIC CLSA global headquarters is in Hong Kong where the majority of our business heads and support function heads are located. Our key offices across Asia, Australia, the Americas and Europe are managed by highly experienced global executives and supported by local and multi-cultural teams.
    - generic [ref=f212e144]:
      - heading "Career Development" [level=1] [ref=f212e145]
      - generic [ref=f212e146]:
        - heading "A career at CITIC CLSA puts you at the forefront of the global capital markets. We value people from diverse backgrounds looking for a career in finance." [level=3] [ref=f212e147]
        - generic [ref=f212e148]:
