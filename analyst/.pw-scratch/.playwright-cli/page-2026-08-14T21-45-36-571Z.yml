          - generic [ref=f659e100]: Set on a twenty-acre wooded parcel overlooking beautiful Whiskeag Pond in Bath, Maine, HillHouse has a reputation for excellent care. The atmosphere at HillHouse is less like a facility and more like a family. We offer your loved one the dignity and safety they deserve.
          - link "Let's schedule a visit." [ref=f659e102] [cursor=pointer]:
