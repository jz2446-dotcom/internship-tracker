          - separator [ref=f659e107]
          - img "Picture" [ref=f659e112]
          - emphasis [ref=f659e114]: This is a truly nurturing community, providing excellent care and creative activities. The staff pay close attention to the residents’ preferences, and endeavor to create programs and menus to match. We appreciate that HillHouse has been more than just a safe place for our mother to live. It is a strong community of warm and compassionate people whose goal is to make residents and their families feel at home. Elaine S.
