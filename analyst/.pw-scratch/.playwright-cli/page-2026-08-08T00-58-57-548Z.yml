          - generic [ref=f63e82]:
            - paragraph [ref=f63e83]:
              - strong [ref=f63e84]: Looking for a Typical Internship? This Isn’t It.
            - paragraph [ref=f63e85]: Forget coffee runs and filing paperwork. At Lee & Associates Boston, our interns are part of the team from day one.
            - paragraph [ref=f63e86]: One minute you might be designing a marketing brochure for a downtown office tower. The next, you’re researching emerging companies, helping launch a marketing campaign, organizing a client event, or figuring out how to make our office run just a little smarter.
            - paragraph [ref=f63e87]: If you love being creative, solving problems, staying organized, and crossing things off a to-do list, you’ll fit right in.
            - paragraph [ref=f63e88]:
              - strong [ref=f63e89]: What You’ll Be Doing
              - text: Marketing
            - list [ref=f63e90]:
              - listitem [ref=f63e91]: Help create eye-catching brochures, presentations, and property marketing materials.
              - listitem [ref=f63e92]: Assist with social media posts and email campaigns.
              - listitem [ref=f63e93]: Research companies, industries, and market trends.
              - listitem [ref=f63e94]: Organize photos, floor plans, and other marketing assets.
            - paragraph [ref=f63e95]: Operations
            - list [ref=f63e96]:
              - listitem [ref=f63e97]: Keep projects moving and help everyone stay on track.
              - listitem [ref=f63e98]: Organize databases, files, and marketing resources.
              - listitem [ref=f63e99]: Assist with improving office processes (if there’s a better way to do something, we want to hear it).
              - listitem [ref=f63e100]: Support special projects that keep the business running efficiently.
              - listitem [ref=f63e101]: Learn how the behind-the-scenes side of commercial real estate really works.
            - paragraph [ref=f63e102]: Bonus Missions
            - paragraph [ref=f63e103]: "No two weeks are the same. You may also:"
            - list [ref=f63e104]:
              - listitem [ref=f63e105]: Brainstorm new marketing ideas.
              - listitem [ref=f63e106]: Build prospect lists.
              - listitem [ref=f63e107]: Create reports and presentations.
              - listitem [ref=f63e108]: Jump into whatever exciting project lands on our desk next.
            - paragraph [ref=f63e109]:
              - strong [ref=f63e110]: Who You Are
            - paragraph [ref=f63e111]: You don’t have to know commercial real estate—we can teach that.
            - paragraph [ref=f63e112]: "We’re looking for someone who:"
            - list [ref=f63e113]:
              - listitem [ref=f63e114]: Loves being organized (color-coded spreadsheets make you oddly happy).
              - listitem [ref=f63e115]: Has a creative eye and enjoys good design.
              - listitem [ref=f63e116]: Notices the little details others miss.
              - listitem [ref=f63e117]: Isn’t afraid to ask questions or share ideas.
              - listitem [ref=f63e118]: Can juggle multiple projects without dropping the ball.
              - listitem [ref=f63e119]: Enjoys learning new software and technology.
              - listitem [ref=f63e120]: Brings positive energy and a sense of humor to work.
            - paragraph [ref=f63e121]:
              - strong [ref=f63e122]: You Might Be a Great Fit If…
            - list [ref=f63e123]:
              - listitem [ref=f63e124]: You’re studying Marketing, Business, Communications, Real Estate, Graphic Design, or something similar.
              - listitem [ref=f63e125]: You know your way around Microsoft Office.
              - listitem [ref=f63e126]: Canva or Adobe Creative Suite doesn’t intimidate you.
              - listitem [ref=f63e127]: You like checking things off your to-do list almost as much as adding them.
            - paragraph [ref=f63e128]:
              - strong [ref=f63e129]: What You’ll Get
            - list [ref=f63e130]:
              - listitem [ref=f63e131]: Real projects—not busy work.
              - listitem [ref=f63e132]: A front-row seat to commercial real estate marketing.
              - listitem [ref=f63e133]: Mentorship from the Director of Operations & Marketing.
              - listitem [ref=f63e134]: Experience you can actually talk about in future interviews.
              - listitem [ref=f63e135]: A chance to build your portfolio with real campaigns and marketing materials.
              - listitem [ref=f63e136]: Plenty of opportunities to learn, contribute, and grow.
            - paragraph [ref=f63e137]:
              - strong [ref=f63e138]: Why Lee & Associates Boston?
            - paragraph [ref=f63e139]: We’re a collaborative team that believes great ideas can come from anyone—including interns. We move quickly, wear a lot of hats, and like people who are curious, dependable, and willing to jump in wherever they’re needed.
            - paragraph [ref=f63e140]:
              - text: If you’re looking for an internship where you’ll leave with real experience, new skills, and probably a few good stories, we’d love to meet you. Interested? Send your resume to
              - link "dvanschagen@lee-associates.com" [ref=f63e141] [cursor=pointer]:
                - /url: mailto:dvanschagen@lee-associates.com
              - text: .
            - paragraph [ref=f63e142]
            - paragraph [ref=f63e143]:
              - text: Learn more about Lee & Associates Boston
              - link "here" [ref=f63e144] [cursor=pointer]:
                - /url: https://www.lee-associates.com/boston
              - text: .
