              - paragraph [ref=f63e71]: Local Expertise. International Reach. World Class.
            - generic [ref=f63e74]:
              - generic [ref=f63e76]:
                - generic [ref=f63e77]: 
                - text: Full-Time, Internship
              - generic [ref=f63e79]:
