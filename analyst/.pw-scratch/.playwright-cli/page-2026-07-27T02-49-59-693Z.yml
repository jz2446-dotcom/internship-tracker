      - generic [ref=f475e41]:
        - paragraph [ref=f475e43]:
          - text: Warburg Pincus LLC is the pioneer of global growth investing. A private partnership since 1966, the firm has the flexibility and experience to focus on helping investors and management teams achieve enduring success across market cycles. Today, the firm has more than $105 billion in assets under management, and more than 225 companies in its active portfolio, diversified across stages, sectors, and geographies. Warburg Pincus has invested in more than 1,100 companies across its private equity, real estate, and capital solutions strategies. The firm is headquartered in New York with more than 15 offices globally. For more information, please visit
          - link "www.warburgpincus.com" [ref=f475e44] [cursor=pointer]:
