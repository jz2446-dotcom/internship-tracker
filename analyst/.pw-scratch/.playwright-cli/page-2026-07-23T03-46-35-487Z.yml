            - generic [ref=f1273e91]:
              - heading "We’re powered by people who really love what they do." [level=1] [ref=f1273e92]
              - paragraph [ref=f1273e93]: As we expand our global footprint and evolve to meet the needs of our clients, our high-integrity partnership culture and the vision of our founders remain as strong as ever. As we grow, we bring our unique operating model and long- term client-centric thinking with us, creating opportunities for talented people to join us and be a part of our story.
              - paragraph [ref=f1273e94]: We can’t wait to meet you.
