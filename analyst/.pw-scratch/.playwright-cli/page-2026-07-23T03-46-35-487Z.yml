              - separator [ref=f1273e107]
              - text: Our vibe, our values
              - paragraph [ref=f1273e108]: We’ve built a culture that prioritizes top-notch expertise alongside absolute collaboration. Think empowered people, from all walks of life, working together for our clients. Our values sum up the things that are true about us. They reflect the way we treat each other and our clients, the way we reward and recognize our people, and the way we make important decisions.
              - generic [ref=f1273e109]:
                - generic [ref=f1273e110]:
                  - img "passionate real estate professionals in a conference room" [ref=f1273e113]
                  - heading "Passionate" [level=3] [ref=f1273e114]
                  - paragraph [ref=f1273e115]: We love what we do. We give it our all and strive for excellence. We respect one another and we share our expertise.
                - generic [ref=f1273e116]:
                  - img "smart brokers disucssing a transaction walking down a hallway" [ref=f1273e119]
                  - heading "Smart" [level=3] [ref=f1273e120]
                  - paragraph [ref=f1273e121]: We are thoughtful, thinking twice and acting once. We value ideas over egos, love innovation and share our success.
                - generic [ref=f1273e122]:
                  - img "connected real estate consultants discussing a project" [ref=f1273e125]
                  - heading "Connected" [level=3] [ref=f1273e126]
                  - paragraph [ref=f1273e127]: We work together to put our clients first. We look to the future, creating lasting impact and making good things happen every day.
                - generic [ref=f1273e128]:
                  - img "invested business owners enjoying a presentation" [ref=f1273e131]
                  - heading "Invested" [level=3] [ref=f1273e132]
                  - paragraph [ref=f1273e133]: We act like owners and do the right thing. We’re accountable, believe in win-win and grow our people and our business with purpose.
              - generic [ref=f1273e136]:
                - generic [ref=f1273e137]: “It's really inspiring to see big ideas turn into reality. Our company culture is unique in so many ways, but what really stands out to me is how much we thrive on action. Delivering ‘best in class’ service to achieve that collective win is at the heart of everything we do.”
                - paragraph [ref=f1273e138]:
                  - link "Sullivan Johnston" [ref=f1273e139] [cursor=pointer]:
                    - /url: https://www.avisonyoung.us/w/sullivan-johnston
                  - text: Senior Vice President Capital Markets Group, Development, Industrial, Land, Multifamily Austin, Texas, United States
              - separator [ref=f1273e142]
              - generic [ref=f1273e143]:
                - img "real estate marketing team discussing strategy" [ref=f1273e146]
                - generic [ref=f1273e147]:
                  - heading "Fresh thinking, from unique perspectives" [level=2] [ref=f1273e148]
                  - paragraph [ref=f1273e149]: We celebrate unique perspectives, creating teams that are as diverse as the clients and communities we represent.
                  - paragraph [ref=f1273e150]: There are 4,500 of us constantly bringing new ideas to the table and thinking differently about the challenges that face our communities. Empowered people, from all walks of life, working together to constantly move our industry forward and deliver for our clients.
              - separator [ref=f1273e151]
              - text: Creating impact, from the inside out
              - paragraph [ref=f1273e152]: Employee Resource Groups (ERGs) are our not-so-secret way to bring our supportive, inclusive, and engaging workplace culture to life. These employee-led communities bring people together around shared experiences, interests, or backgrounds to foster connection and professional growth.
              - paragraph [ref=f1273e153]: And they are so important to us, supporting the happiness of our people, helping every one of us feel seen and heard, and of course, making real change happen.
