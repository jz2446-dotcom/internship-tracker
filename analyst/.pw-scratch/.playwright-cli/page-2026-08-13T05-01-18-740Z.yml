        - generic [ref=f1302e115]:
          - heading "Internships at Deloitte" [level=1] [ref=f1302e118]
          - heading "Launchpad to your future" [level=2] [ref=f1302e121]
          - generic [ref=f1302e123]:
            - generic:
              - paragraph: A Deloitte internship is more than work experience. It can serve as a career launchpad where potential becomes possibility. You’ll have the opportunity to get hands-on experience, gain invaluable skills, and build a network of peers and mentors that can stay with you beyond the internship experience. Your journey to impact starts now.
        - generic [ref=f1302e130]:
          - generic [ref=f1302e132]:
            - heading "The Deloitte internship experience" [level=1] [ref=f1302e135]
            - generic [ref=f1302e138]:
              - paragraph [ref=f1302e139]: Your career launchpad—where potential becomes possibility Deloitte interns don’t sit on the sidelines; they gain real-world experience by tackling challenges and driving meaningful outcomes. Our internship programs offer a blend of learning and development opportunities, mentorship, engagements and networking platforms, and professional growth.
              - paragraph [ref=f1302e140]: If you want to have an opportunity where you can make an impact, dive into real challenges, and expand your capabilities, then start your journey with us.
              - paragraph [ref=f1302e141]:
                - link "View open roles" [ref=f1302e142] [cursor=pointer]:
                  - /url: https://apply.deloitte.com/en_US/careers/SearchJobs?3_149_3=637&3_5_3=478&sort=relevancy
          - generic [ref=f1302e151]:
