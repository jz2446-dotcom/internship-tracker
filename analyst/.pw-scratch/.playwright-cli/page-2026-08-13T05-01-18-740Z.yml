          - generic [ref=f1302e278]:
            - generic:
              - paragraph: Deloitte’s Summer Intern Conferences are where learning, connection, and community come to life at Deloitte University. Interns get the chance to meet students from across the country, build relationships with peers and leaders, and experience Deloitte’s culture in an exciting, immersive way. Through engaging sessions and new experiences, interns can grow their skills, expand their network, and get a feel for what a future at Deloitte could look like. It’s more than a conference—it’s a chance to be inspired, make connections, and see where your career journey can begin.
