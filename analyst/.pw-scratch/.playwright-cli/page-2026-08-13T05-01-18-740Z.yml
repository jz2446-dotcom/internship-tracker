        - generic [ref=f1302e174]:
          - heading "Want to unlock your potential?" [level=3] [ref=f1302e177]
          - paragraph [ref=f1302e181]: More than an internship, Deloitte can provide a springboard for future career growth through a focus on leadership, learning, connection, and impact.
          - generic [ref=f1302e184]:
            - generic [ref=f1302e187]:
              - link "Leadership" [ref=f1302e189] [cursor=pointer]:
                - /url: "#"
              - generic [ref=f1302e195]:
                - heading "Leadership" [level=5] [ref=f1302e198]
                - paragraph [ref=f1302e201]: An internship at Deloitte can be your launchpad to leadership. You’ll be empowered from day one to lead with confidence and to help shape the future. You can take on responsibilities through projects, teams, or initiatives. You’ll have the opportunity to learn from accomplished leaders, receive mentorship, and develop a mindset and skills that can help you thrive. All while preparing for your next role and building a foundation of leadership skills.
            - generic [ref=f1302e204]:
              - link "Learning" [ref=f1302e206] [cursor=pointer]:
                - /url: "#"
              - generic [ref=f1302e212]:
                - heading "Learning" [level=5] [ref=f1302e215]
                - paragraph [ref=f1302e218]: You’ll receive hands-on, practical training throughout your internship, helping you build essential skills for your career. You’ll also experience an opportunity for personal and professional growth through mentorship and leaders invested in your success. Learn by doing as you tackle real-world projects, gaining insights and skills that can last a lifetime.
            - generic [ref=f1302e221]:
              - link "Connection" [ref=f1302e223] [cursor=pointer]:
                - /url: "#"
              - generic [ref=f1302e229]:
                - heading "Connection" [level=5] [ref=f1302e232]
                - paragraph [ref=f1302e235]: Here, connection isn’t just part of the experience—it helps make our work possible. At Deloitte, you can build meaningful connections with peers and mentors to create solutions that help you drive your career. Work with a range of teams, learn from skilled mentors, and contribute to impactful client engagements while growing your network across levels.
            - generic [ref=f1302e238]:
              - link "Impact" [ref=f1302e240] [cursor=pointer]:
                - /url: "#"
              - generic [ref=f1302e246]:
                - heading "Impact" [level=5] [ref=f1302e249]
                - paragraph [ref=f1302e252]: Bring your skills, passions, and interests to be part of something big. Deloitte interns can make meaningful contributions that drive real change. It’s your time to make an impact, and Deloitte is a place where you can do just that.
        - generic [ref=f1302e254]:
          - generic [ref=f1302e257]:
            - generic [ref=f1302e262]:
              - heading "Want to see where you’ll shine at Deloitte?" [level=3] [ref=f1302e265]
              - generic [ref=f1302e267]:
                - generic:
                  - paragraph: Not sure where you belong after college? You’re not alone! With Deloitte’s Explore Your Fit tool, you can uncover a potential professional path through a quick, personalized experience. Get tailored suggestions, discover exciting areas within Deloitte, and connect directly to job opportunities that suit you. Start fueling your future today!
