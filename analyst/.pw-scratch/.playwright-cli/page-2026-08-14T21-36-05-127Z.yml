                    - strong [ref=f827e415]: PGIM.com
                - paragraph [ref=f827e416]: Prudential is a multinational financial services leader with operations in the United States, Asia, Europe, and Latin America. Leveraging its heritage of life insurance and asset management expertise, Prudential is focused on helping individual and institutional customers grow and protect their wealth. The company's well-known Rock symbol is an icon of strength, stability, expertise and innovation that has stood the test of time. Prudential's businesses offer a variety of products and services, including life insurance, annuities, retirement-related services, mutual funds, asset management, and real estate services.
                - paragraph [ref=f827e417]:
                  - text: We recognize that our strength and success are directly linked to the quality and skills of our diverse associates. We are proud to be a place where talented people who want to make a difference can grow as professionals, leaders, and as individuals. Visit
                  - link [ref=f827e418] [cursor=pointer]:
                    - /url: https://www.prudential.com/
                    - strong [ref=f827e420]: www.prudential.com
                  - text: to learn more about our values, our history and our brand.
                - paragraph [ref=f827e421]: Prudential is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, ancestry, sex, sexual orientation, gender identity, national origin, genetics, disability, marital status, age, veteran status, domestic partner status, medical condition or any other characteristic protected by law.
                - paragraph [ref=f827e422]: The Prudential Insurance Company of America, Newark, NJ and its affiliates.
                - paragraph [ref=f827e423]:
                  - text: Note that this posting is intended for individual applicants. Search firms or agencies should email Staffing at
                  - link [ref=f827e424] [cursor=pointer]:
                    - /url: mailto:staffingagencies@prudential.com
                    - strong [ref=f827e426]: staffingagencies@prudential.com
                  - text: for more information about doing business with Prudential.
                - paragraph [ref=f827e427]: "PEOPLE WITH DISABILITIES:"
                - paragraph [ref=f827e428]:
                  - text: If you need an accommodation to complete the application process, which may include an assessment, please email
                  - strong [ref=f827e430]:
