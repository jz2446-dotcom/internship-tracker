      - generic [ref=f1379e39]:
        - paragraph [ref=f1379e40]: The Walker Art Center empowers people to experience the transformative possibilities of the art and ideas of our time and to imagine the world in new ways. In our over 125-year history, we have become one of the most celebrated art museums in the country and we are known for our innovative presentations and acclaimed collections of contemporary art across the spectrum of the visual, performing, and media arts.
        - paragraph [ref=f1379e41]:
          - strong [ref=f1379e42]: The Role
        - paragraph [ref=f1379e43]: The Human Resources Generalist, Employee & Labor Relations serves as a key member of the Human Resources team and is responsible for supporting the full employee lifecycle with a strong emphasis on employee relations and labor relations. This role provides day-to-day HR partnership to managers and staff across the institution, helping to foster a workplace culture that is collaborative, respectful, compliant, and aligned with the institutional values and operational needs.
        - paragraph [ref=f1379e44]: This position plays a central role in administering and managing labor relations for two collective bargaining agreements and serves as a primary point of contact for routine contract administration, grievance management, employee concerns, workplace coaching, investigations, and labor-management communication. In addition, the role supports full-cycle HR generalist work including recruitment, onboarding, performance support, policy interpretation, employee engagement, and day-to-day people operations.
        - paragraph [ref=f1379e45]: The ideal candidate brings strong judgment, sound employee relations experience, an ability to navigate unionized environments with professionalism and consistency, and the interpersonal skills to build trust across a diverse workforce.
        - paragraph [ref=f1379e46]:
          - strong [ref=f1379e47]: Key Responsibilities
        - list [ref=f1379e48]:
          - listitem [ref=f1379e49]:
            - strong [ref=f1379e50]: Employee Relations
            - list [ref=f1379e51]:
              - listitem [ref=f1379e52]: Serve as a primary HR resource to employees and managers on employee relations matters, workplace concerns, policy interpretation, performance issues, conduct concerns, attendance, and conflict resolution.
              - listitem [ref=f1379e53]: Provide coaching and guidance to managers on employee communication, documentation, corrective action, performance management, and issue resolution.
              - listitem [ref=f1379e54]: Conduct prompt, thorough, and fair workplace investigations into employee concerns, complaints, and policy violations.
              - listitem [ref=f1379e55]: Partner with leadership to support a positive employee experience and help ensure consistent application of policies, practices, and expectations.
              - listitem [ref=f1379e56]: Advise on sensitive employee matters with discretion, sound judgment, and a high degree of professionalism.
              - listitem [ref=f1379e57]: Track employee relations trends and recommend proactive solutions, training, or process improvements.
          - listitem [ref=f1379e58]:
            - strong [ref=f1379e59]: Labor Relations
            - list [ref=f1379e60]:
              - listitem [ref=f1379e61]: Manage day-to-day labor relations and contract administration for the Walker’s two bargaining units.
              - listitem [ref=f1379e62]: Interpret collective bargaining agreements and advise managers on contract application, obligations, and compliance.
              - listitem [ref=f1379e63]: Serve as the primary HR lead for routine labor-management matters, including grievances, investigatory meetings, disciplinary processes, and contract questions.
              - listitem [ref=f1379e64]: Prepare grievance responses, maintain grievance documentation, track timelines, and support resolution efforts.
              - listitem [ref=f1379e65]: Build and maintain constructive working relationships with union representatives and stewards.
              - listitem [ref=f1379e66]: Support labor-management meetings, documentation, follow-up, and issue resolution.
              - listitem [ref=f1379e67]: Partner with HR leadership on bargaining preparation, contract implementation, and labor strategy as needed.
              - listitem [ref=f1379e68]: Help ensure that workplace practices, scheduling approaches, and management decisions are aligned with collective bargaining obligations.
          - listitem [ref=f1379e69]:
            - strong [ref=f1379e70]: Recruitment, Hiring, and Onboarding
            - list [ref=f1379e71]:
              - listitem [ref=f1379e72]: Lead full-cycle recruitment for assigned positions, including job postings, candidate screening, interview coordination, manager support, offer preparation, and hiring communications.
              - listitem [ref=f1379e73]: Partner with hiring managers to develop clear and effective job descriptions and hiring plans.
              - listitem [ref=f1379e74]: Support equitable and inclusive hiring practices aligned with institutional values and employment standards.
              - listitem [ref=f1379e75]: Coordinate and facilitate onboarding for new employees, ensuring a strong transition into the organization.
              - listitem [ref=f1379e76]: Partner with managers to support successful orientation, initial training, and early employment integration.
          - listitem [ref=f1379e77]:
            - strong [ref=f1379e78]: HR Operations and Generalist Support
            - list [ref=f1379e79]:
              - listitem [ref=f1379e80]: Respond to day-to-day HR questions from staff and managers regarding policies, procedures, benefits coordination, leave processes, and employment practices.
              - listitem [ref=f1379e81]: Support policy implementation and employee communication related to HR programs and organizational changes.
              - listitem [ref=f1379e82]: Maintain accurate employee records, documentation, and case files in compliance with internal standards and legal requirements.
              - listitem [ref=f1379e83]: Assist with performance review processes, employee development efforts, and manager training initiatives.
              - listitem [ref=f1379e84]: Partner with payroll, benefits, and other HR functions to support employee lifecycle events and ensure smooth HR operations.
              - listitem [ref=f1379e85]: Support offboarding processes including exit meetings, documentation, and transition coordination.
          - listitem [ref=f1379e86]:
            - strong [ref=f1379e87]: Training and Organizational Support
            - list [ref=f1379e88]:
              - listitem [ref=f1379e89]: Help develop and deliver manager training and employee education related to employee relations, performance management, workplace expectations, and labor relations practices.
              - listitem [ref=f1379e90]: Identify opportunities to strengthen consistency, manager capability, and employee understanding of workplace policies and contract provisions.
              - listitem [ref=f1379e91]: Contribute to HR projects and strategic initiatives that improve culture, compliance, employee experience, and organizational effectiveness.
        - paragraph [ref=f1379e92]:
          - strong [ref=f1379e93]: Required Qualifications
        - list [ref=f1379e94]:
          - listitem [ref=f1379e95]: 3–5 years of progressive human resources experience, including substantial employee relations experience.
          - listitem [ref=f1379e96]: Direct experience supporting labor relations in a unionized environment, including contract interpretation, grievance handling, and manager coaching.
          - listitem [ref=f1379e97]: Demonstrated experience managing sensitive employee issues with sound judgment, professionalism, and confidentiality.
          - listitem [ref=f1379e98]: Experience conducting workplace investigations and preparing related documentation.
          - listitem [ref=f1379e99]: Experience with full-cycle recruitment and onboarding.
          - listitem [ref=f1379e100]: Strong knowledge of employment law, HR best practices, and employee relations principles.
          - listitem [ref=f1379e101]: Excellent interpersonal, communication, and conflict resolution skills.
          - listitem [ref=f1379e102]: Strong organizational skills and ability to manage multiple priorities in a dynamic environment.
          - listitem [ref=f1379e103]: Ability to build trust and credibility with employees, managers, union representatives, and leadership.
        - paragraph [ref=f1379e104]:
          - strong [ref=f1379e105]: Preferred Qualifications
        - list [ref=f1379e106]:
          - listitem [ref=f1379e107]: Post-Secondary Education in Human Resources, Labor Relations, Business Administration, Organizational Development, or a related field, or equivalent combination of education and experience.
          - listitem [ref=f1379e108]: Experience in a museum, arts, nonprofit, education, hospitality, or other mission-driven organization with varied employee groups and operational complexity.
          - listitem [ref=f1379e109]: Experience supporting multiple bargaining units.
          - listitem [ref=f1379e110]: Familiarity with Minnesota employment laws and labor practices.
          - listitem [ref=f1379e111]: HRIS experience, preferably ADP Workforce Now or similar systems.
        - paragraph [ref=f1379e112]:
          - strong [ref=f1379e113]: Working Conditions / Physical Requirements
        - list [ref=f1379e114]:
          - listitem [ref=f1379e115]: Work is primarily performed in an office environment, with regular presence throughout the institution for meetings and employee support.
          - listitem [ref=f1379e116]: Ability to work at a desk and use a computer for prolonged periods.
          - listitem [ref=f1379e117]: Ability to frequently walk and move throughout galleries, public spaces, the Minneapolis Sculpture Garden, and administrative offices as needed.
          - listitem [ref=f1379e118]: Must be able to communicate effectively with employees and managers across a range of departments and work settings.
          - listitem [ref=f1379e119]: May occasionally need to respond to employee relations or operational matters outside of standard business hours.
          - listitem [ref=f1379e120]: Ability to lift and carry up to 15 pounds.
        - paragraph [ref=f1379e121]:
          - strong [ref=f1379e122]: JOB SPECIFICATIONS
        - list [ref=f1379e123]:
          - listitem [ref=f1379e124]: This position is considered full-time, exempt. As an exempt position, it is not eligible for overtime pay. The compensation for this role is $80,000 annually.
          - listitem [ref=f1379e125]:
            - strong [ref=f1379e126]:
              - strong [ref=f1379e127]: "Benefits:"
            - text: Medical, dental, and vision insurance; 403(b) retirement plan with employer contribution; paid vacation, sick time, and holidays.
          - listitem [ref=f1379e128]: This is a hybrid role and will require onsite work a minimum of 3 days per week, and onsite requirements may vary from week to week based off the needs of the work.
          - listitem [ref=f1379e129]: This position is not eligible for relocation assistance.
          - listitem [ref=f1379e130]: All applicants must be eligible to work in the United States without the need for employer sponsorship.
        - paragraph [ref=f1379e131]:
          - strong [ref=f1379e132]: Walker’s DEI commitment
          - text: The Walker is committed to being an employer with a staff who, at all job levels, reflects the rich diversity of the communities and audiences we serve. We are dedicated to ensuring inclusion and equity in all our employment practices. We deeply value and welcome all the unique lived experiences in our applicants and encourage anyone meeting the minimum requirements to apply.
        - paragraph [ref=f1379e133]:
          - strong [ref=f1379e134]: E-Verify Participation Notice
          - text: Walker Art Center participates in E-Verify to confirm the identity and employment eligibility of all persons hired to work in the United States.
