        - heading "Letters to our shareholders" [level=2] [ref=f1694e469]
        - generic [ref=f1694e471]:
          - link "When I joined Kroger earlier this year, I got straight to the thing I enjoy the most – walking our stores, distribution centers and manufacturing facilities. I watched how our customers shopped – what they put in their carts and what they left on the shelf. I heard from associates across the company about what is going well and what we need to do better. I found a lot to be proud of… Read more from Greg" [ref=f1694e472] [cursor=pointer]:
            - /url: /shareholders-letter-greg/
            - generic [ref=f1694e475]:
              - generic [ref=f1694e478]:
                - paragraph [ref=f1694e479]: When I joined Kroger earlier this year, I got straight to the thing I enjoy the most – walking our stores, distribution centers and manufacturing facilities.
