          - link "I’ve been part of Kroger’s story for a while now. And I know the company well enough to know Kroger is at its best when we deliver on the basics – taking care of our customers, running great stores and focusing our resources where they provide the most value. 2025 was a strong year – we nearly doubled our identical sales without fuel, grew earnings per share by 9% and delivered a great store experience…. Read more from Ron" [ref=f1694e483] [cursor=pointer]:
