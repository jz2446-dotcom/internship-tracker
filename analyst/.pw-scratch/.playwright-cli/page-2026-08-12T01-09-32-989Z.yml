                  - generic [ref=f295e8]:
                    - generic [ref=f295e9]: Thank you for your interest in becoming a volunteer with the National Archives and Records Administration (NARA). Our volunteers play a vital role in the activities of the Archives. They supplement the staff in important ways with special talents and knowledge.
                    - generic [ref=f295e10]: "Please note that you must meet the following requirements in order to be qualified as a NARA volunteer: you must be 16 years or older and meet one of the following three requirements:(1)you must be a U.S. citizen;(2)you must be a legal resident alien [possessor of a green card]; or(3)you must be a holder of a type A1 or A2 diplomatic visa."
                    - generic [ref=f295e11]: If you do not meet these requirements, we will not be able to accept your volunteer application.The next step in applying to become a volunteer is to complete this application. Your answers to the questions will enable us to see where you might best help our programs and what activities would be most fulfilling to you.
                    - generic [ref=f295e12]: Please note that a background check will be necessary, depending on the type of volunteer service you will provide and the kind of access you are granted to our facility. For further information about this step in the application process, please contact Laura Eggert, the Volunteer & Visitor Services Coordinator at laura.eggert@nara.gov
