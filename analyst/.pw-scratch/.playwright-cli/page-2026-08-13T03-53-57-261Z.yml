      - generic [ref=f138e86]:
        - generic [ref=f138e88]:
          - paragraph [ref=f138e89]: Ackman-Ziff is the industry’s preeminent boutique real estate capital advisory firm. Hiring guidelines are stringent and expectations are high. Ackman-Ziff seeks individuals who are entrepreneurial, creative, driven, and possess a strong desire to overachieve. Candidates must also be able to work in a collaborative environment and have the highest level of integrity.
          - paragraph [ref=f138e90]: "The firm not only prides itself on attracting the industry’s best talent, but retaining talent over the long-term. Ackman-Ziff principals have worked together for 20-plus years and the average tenure of team members is 10-plus years. We are looking to fill the following positions:"
