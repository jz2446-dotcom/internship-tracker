  - main [ref=f138e39]:
    - generic [ref=f138e41]:
      - heading "History" [level=2] [ref=f138e44]
      - generic [ref=f138e46]:
        - generic [ref=f138e47]:
          - heading "1920" [level=3] [ref=f138e48]
          - paragraph [ref=f138e50]: In 1926, Herman and Bert Ackman founded Ackman Brothers. Initially focused on new construction and acquisition projects, the brothers shifted their focus to property refinancing opportunities with the onset of the Great Depression and World War II. During the post-war construction boom, the firm developed a reputation as a highly capable land assembler.
        - generic [ref=f138e51]:
          - heading "1960" [level=3] [ref=f138e52]
          - paragraph [ref=f138e54]: Larry Ackman, Herman’s son, joined the firm during the 1960s, ultimately becoming president in 1968 and CEO in 1977. In response to the instability in interest rates and property values that marked the 1970s and 1980s, the firm engineered various financial vehicles to match market movements, thereby reducing a critical area of interest rate risk in clients’ projects.
        - generic [ref=f138e55]:
          - heading "1980" [level=3] [ref=f138e56]
          - paragraph [ref=f138e58]: The firm embarked on the next stage of its evolution when Simon Ziff joined Ackman Brothers and Singer in 1989 as an analyst. Simon was named president of Ackman-Ziff Real Estate Group in 1995 and Larry Ackman assumed the Chairman role. As president, Simon has overseen the firm’s aggressive growth.
        - generic [ref=f138e59]:
          - heading "2020" [level=3] [ref=f138e60]
          - paragraph [ref=f138e62]: Today, Ackman-Ziff Real Estate Group is the industry’s preeminent boutique real estate capital advisory firm – offering a wide variety of cutting-edge commercial real estate capital markets financing solutions including debt and mezzanine financing, preferred and joint venture equity, sponsor equity, and investment sales. The privately held company is headquartered in New York City with offices in Miami, Los Angeles, and Boston.
    - generic [ref=f138e64]:
      - heading "Culture" [level=2] [ref=f138e67]
      - generic [ref=f138e70]:
        - img "Culture" [ref=f138e73]
        - generic [ref=f138e75]:
          - paragraph [ref=f138e76]: Ackman-Ziff has been a trusted advisor for 100 years. This longevity is not a result of luck or happenstance, but rather leadership’s focus on building a culture, not merely a company. Talented people placed in the right culture can do amazing things together – the company is simply the body while the culture is the soul.
          - paragraph [ref=f138e77]: Ackman-Ziff team members are focused on building long-term relationships with clients, many of which have evolved into long-term friendships. The firm’s key to such relationships – some even multi-generational – is its core ethos of ethics, integrity, honesty, and trust. These qualities begin internally with team member relationships, and naturally extend to the working relationships with clients. Client success is, naturally, of utmost importance.
          - paragraph [ref=f138e78]:
            - text: If you are interested in learning more about Ackman-Ziff and how you may become part of its culture, please email your resume to
            - link "human resources" [ref=f138e79] [cursor=pointer]:
              - /url: "mailto: hr@ackmanziff.com"
            - text: .
