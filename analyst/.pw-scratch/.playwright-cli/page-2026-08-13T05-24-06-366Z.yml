            - generic [ref=f1892e382]:
              - generic [ref=f1892e384]:
                - generic [ref=f1892e385]: Job ID
                - generic [ref=f1892e386]: "122461"
              - generic [ref=f1892e388]:
                - paragraph [ref=f1892e389]:
                  - strong [ref=f1892e390]:
                    - generic [ref=f1892e391]: Ref. - 122461 – Fachkräfte für Lagerlogistik (m/w/d)
                - paragraph [ref=f1892e392]:
                  - strong [ref=f1892e393]: NOTHING RUNS LIKE A DEERE!
                - paragraph [ref=f1892e394]: "An unserem Standort in Bruchsal fungiert das Europäisches Ersatzteilzentrum (E-PDC) als Dreh- und Angelpunkt für die Belieferung aller John Deere Vertriebspartner in Europa, Afrika und im Mittleren Osten sowie der internationalen Ersatzteillager. Rund 700 Mitarbeitende sorgen hier gemeinsam für einen reibungslosen Ablauf. #wirsindbruchsal"
                - paragraph [ref=f1892e395]:
                  - text: Unsere Abteilung
                  - emphasis [ref=f1892e396]: Pick-Pack
                  - text: sucht zum nächstmöglichen Zeitpunkt
                  - strong [ref=f1892e397]: mehrere
                - paragraph [ref=f1892e398]:
                  - strong [ref=f1892e399]: Fachkräfte für Lagerlogistik (m/w/d)
                - paragraph [ref=f1892e400]:
                  - strong [ref=f1892e401]: für die permanente Nachtschicht
                - paragraph [ref=f1892e402]: Als Fachkraft für Lagerlogistik (m/w/d) im Bereich Pick-Pack bist Du für die sorgfältige Zusammenstellung und Verpackung von Kundenbestellungen verantwortlich. Deine Sendungen werden aus dem E-PDC in über 90 Länder weltweit verschickt. Dein Einsatz trägt maßgeblich dazu bei, dass unsere Kunden ihre Waren schnell und in einwandfreiem Zustand erhalten
                - paragraph [ref=f1892e403]:
                  - link [ref=f1892e404] [cursor=pointer]:
                    - /url: https://www.youtube.com/watch?v=P3sp4MjmdLA
                    - strong [ref=f1892e405]: "Starte Deine Karriere bei #JohnDeere im E-PDC in Bruchsal #NothingRunslikeADeere"
                - paragraph [ref=f1892e406]:
                  - heading "Darauf kannst Du Dich freuen:" [level=3] [ref=f1892e407]
                  - strong [ref=f1892e408]
                - list [ref=f1892e409]:
                  - listitem [ref=f1892e410]: Modernes Arbeiten in einer 37h/Woche Vollzeit, Optionen auf Teilzeit uvm.
                  - listitem [ref=f1892e411]: Hervorragende Sozialleistungen, wie eine arbeitgeberfinanzierte Betriebsrente und Optionen steuerbegünstigter privater Altersvorsorge (Entgeltumwandlungspläne, Sonderkonditionen HDI/Allianz, AVWL)
                  - listitem [ref=f1892e412]: Weitere Benefits wie bezuschusstes Deutschlandticket, Company Bike, FamPlus uvm.
                  - listitem [ref=f1892e413]: Ein attraktives Vergütungspaket in Anlehnung an den gültigen Tarifvertrag der IG Metall; darüber hinaus prozentuale Erfolgsbeteiligung und individuelle Leistungszulagen
                - paragraph [ref=f1892e414]:
                  - text: Das Gehalt für diese Position (Vollzeit) basiert auf der Entgeltgruppe 02 des Tarifvertrags der Metall- und Elektroindustrie Baden-Württemberg und setzt sich neben dem monatlichen Bruttoentgelt (inkl. Zulagen) von
                  - generic [ref=f1892e415]:
                    - text: 2.814,50
                    - generic [ref=f1892e416]:
                      - text: € durch verschiedene Sonderzahlungen (Urlaubsgeld, T-Zug, Weihnachtsgeld, Trafobaustein) zusammen.
                      - strong [ref=f1892e417]: So kannst Du in dieser Position ein jährliches Einstiegsgehalt von ca. 38.812 EUR erwarten.
                - paragraph [ref=f1892e418]:
                  - heading "Diese Aufgaben erwarten Dich:" [level=3] [ref=f1892e419]
                - list [ref=f1892e420]:
                  - listitem [ref=f1892e421]: Eigenverantwortliches Arbeiten in 8 verschiedenen Lagerzonen
                  - listitem [ref=f1892e422]: Bedienung von verschiedenen Flurförderzeugen wie Pickwägen, E-Ameisen, Frontstaplern, Regalbediengeräten
                  - listitem [ref=f1892e423]: Kommissionieren nach Arbeitsaufträgen und Vorgaben mit Hilfe von Funkterminals im Prämienlohn oder Zeitlohn
                - paragraph [ref=f1892e424]:
                  - heading "Das bringst Du mit:" [level=3] [ref=f1892e425]
                - list [ref=f1892e426]:
                  - listitem [ref=f1892e427]: Leistungsbereitschaft und Spaß an der Arbeit im Team
                  - listitem [ref=f1892e428]: Körperliche und Mentale Fitness
                  - listitem [ref=f1892e429]: Erfolgreich abgeschlossene Berufsausbildung & Lagererfahrung von Vorteil
                  - listitem [ref=f1892e430]: Flexibilität, Engagement, Zuverlässigkeit und Eigenverantwortung sowie Überzeugungskraft runden Dein Profil ab
                  - listitem [ref=f1892e431]: Bereitschaft zur permanenten Nachtschicht, sowie bei Bedarf Wochenend- und Feiertagsarbeit setzen wir voraus
                - paragraph [ref=f1892e432]: Diese Position ist zum nächstmöglichen Zeitpunkt für 24 Monate befristet in Bruchsal zu besetzen.
                - paragraph [ref=f1892e433]:
                  - generic [ref=f1892e434]:
                    - text: Egal wer Du bist – bei John Deere bist Du herzlich willkommen! Wir sind der festen Überzeugung, dass Vielfalt und Einbeziehung uns noch stärker machen.
                    - strong [ref=f1892e435]: Du findest Dich hier wieder – dann freuen wir uns auf Deine Online-Bewerbung über unser Bewerberportal!
                - paragraph [ref=f1892e436]: Nicht jeder kann von sich behaupten, dass die eigene Arbeit zur Grundversorgung der wachsenden Weltbevölkerung beiträgt. Bei John Deere kannst Du das!
                - paragraph [ref=f1892e437]: "Als führender Landtechnikhersteller fertigen wir moderne Land-, Forst-, und Baumaschinen sowie Maschinen für Rasen- und Grundstückspflege. In den letzten Jahren haben wir das Unternehmen zu einem Technologiekonzern entwickelt. Teile mit uns, unsere Vision einer Farm der Zukunft, basierend auf künstlicher Intelligenz, Automatisierung und Konnektivität, um unsere wachsende Welt nachhaltig zu versorgen. #leapforward"
                - paragraph [ref=f1892e438]:
                  - strong [ref=f1892e439]: John Deere EPDC
                - paragraph [ref=f1892e440]: Personalabteilung
                - paragraph [ref=f1892e441]: Dilara Goekburun
                - paragraph [ref=f1892e442]:
                  - heading "Zusätzliche Informationen:" [level=3] [ref=f1892e443]
                - paragraph [ref=f1892e444]: Zur Bearbeitung eingehender Bewerbungen nutzen wir ausschließlich unser Online-Tool auf der John Deere Karriereseite. Wir bitten um Verständnis, dass wir Bewerbungen per E-Mail oder Post nicht berücksichtigen können und kein Anspruch auf Rücksendung von Bewerbungsunterlagen besteht.
                - paragraph [ref=f1892e445]:
                  - generic [ref=f1892e446]:
                    - text: "Bei Fragen zu Deiner Bewerbung wende Dich gerne an:"
                    - strong
                  - link [ref=f1892e447] [cursor=pointer]:
                    - /url: mailto:RecruitingGermany@JohnDeere.com
                    - strong [ref=f1892e448]: RecruitingGermany@JohnDeere.com
                  - strong [ref=f1892e449]: .
