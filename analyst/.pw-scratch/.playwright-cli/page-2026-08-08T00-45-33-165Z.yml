      - tab "Summer Internship Program" [ref=f4e67] [cursor=pointer]
    - generic [ref=f4e76]:
      - heading "Graduate Program" [level=3] [ref=f4e78]
      - generic [ref=f4e81]:
        - paragraph [ref=f4e82]: Our Graduate Program offers a learning environment designed to build our future leaders. We're looking for the best minds to join us full-time and help us manage, develop, advise, finance or trade.
        - paragraph [ref=f4e83]: Our program is designed with your interests in mind. You'll start with an induction at our headquarters in New York, where you'll meet your grad class, hear from our senior leaders and receive comprehensive technical training.
        - paragraph [ref=f4e84]: We offer a variety of roles across our business groups for which students in their final year of study are invited to apply.
        - paragraph [ref=f4e85]: Our Graduate Program commences from July each year. Applications open in September.
      - link "Apply now" [ref=f4e87] [cursor=pointer]:
        - /url: https://recruitment.macquarie.com/en_US/careers/SearchJobs/program?592=%5B887459%2C887273%2C887512%2C887657%2C887599%5D&592_format=9525&7959=%5B421070%2C421069%5D&7959_format=14495&listFilterMode=1&jobRecordsPerPage=9&
    - generic [ref=f4e94]:
      - heading "Summer Internship Program" [level=3] [ref=f4e96]
      - generic [ref=f4e99]:
        - paragraph [ref=f4e100]: Our Summer Internship Program offers you invaluable practical experience and can set you up for a successful career once you complete your studies.
        - paragraph [ref=f4e101]: You'll get to work on real projects from your first day, build new skills, explore interesting fields and do challenging work.
        - paragraph [ref=f4e102]: Working alongside industry experts, you will receive a structured induction, on-the-job training and networking opportunities with your fellow summer interns.
        - paragraph [ref=f4e103]: Our Summer Internship program runs from June until August of each year for 10 weeks. Applications open in August.
        - paragraph [ref=f4e104]: We offer a variety of roles across our business groups for which students heading into their penultimate year of study are invited to apply.
        - paragraph [ref=f4e105]: Summer Interns are eligible for our full-time Graduate Program.
      - link "Apply now" [ref=f4e107] [cursor=pointer]:
        - /url: https://recruitment.macquarie.com/en_US/careers/SearchJobs/program?592=%5B887459%2C887273%2C887512%2C887657%2C887599%5D&592_format=9525&7959=%5B421070%2C421069%5D&7959_format=14495&listFilterMode=1&jobRecordsPerPage=9&
