    - generic [ref=f4e51]:
      - heading "Start your future at Macquarie" [level=2] [ref=f4e52]
      - paragraph [ref=f4e53]: Our graduate and internship opportunities empower you to excel in your career. From full-time graduate roles to insight and learning experiences, we provide many ways to explore and learn about career opportunities with us.
    - tablist "Links to sections on the page" [ref=f4e62]:
