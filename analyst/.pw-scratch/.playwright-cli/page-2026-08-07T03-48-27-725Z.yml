                - heading "Job Description" [level=2] [ref=f352e63]
                - generic [ref=f352e64]:
                  - paragraph [ref=f352e65]:
                    - strong [ref=f352e66]: Position Summary
                  - paragraph [ref=f352e67]: Nautilus Solar Energy’s (“NSE”) M&A Summer Intern will support the acquisition of community solar and distributed energy assets by identifying and evaluating projects, conducting initial diligence, preparing financial models and input sheets, drafting proposals, and supporting a variety of other acquisition and business development-related activities. The Nautilus Solar Internship Program will offer undergraduate students a paid, 10-week, hands-on experience assisting in developing, acquiring, and operating distributed solar assets while learning more about the solar and renewable energy industries. The position reports to the M&A Manager. The internship will be based out of Nautilus’ Chicago office and candidates will be expected to come into the office three days a week.
                  - paragraph [ref=f352e68]:
                    - strong [ref=f352e69]: "Responsibilities:"
                  - paragraph [ref=f352e70]: · Prospect and evaluate potential solar acquisition opportunities.
                  - paragraph [ref=f352e71]: · Identify new potential development partners and research existing partners.
                  - paragraph [ref=f352e72]: "· Policy and rate research: assist in researching state and local policies, utility tariffs, program rules, and other various assignments. Lead research of wholesale energy and capacity prices, community solar bill credit rates, retail rates, and renewable energy credit fundamentals and forecasting."
                  - paragraph [ref=f352e73]: · Monitor, track, and report market updates through industry periodicals, interconnection queues, and program capacity lists.
                  - paragraph [ref=f352e74]: · Assist with diligence and review of project opportunity information.
                  - paragraph [ref=f352e75]: · Gather and review project information for internal review and pricing.
                  - paragraph [ref=f352e76]: · Organize Partner Development and M&A events, offsites, and trainings.
                  - paragraph [ref=f352e77]: · Provide other assistance to the Partner Development and M&A teams upon request.
                  - paragraph [ref=f352e78]: · Review and manage data rooms for project diligence.
                  - paragraph [ref=f352e79]:
                    - strong [ref=f352e80]: Requirements
                  - paragraph [ref=f352e81]:
                    - strong [ref=f352e82]: "Requirements:"
                  - paragraph [ref=f352e83]: · Enrolled in bachelor’s degree or master’s degree program in finance, economics, or quantitative field. Prior renewable energy internships or coursework are preferred.
                  - paragraph [ref=f352e84]: · Excellent written and verbal communication skills, with the ability to present complex information in a clear and concise manner.
                  - paragraph [ref=f352e85]: · Ability to work both independently and collaboratively in a fast-paced, deadline-driven environment.
                  - paragraph [ref=f352e86]: · Experience with financial modeling including discounted cash flow and sensitivity analysis.
                  - paragraph [ref=f352e87]: · Knowledge of key financing terms such as Net Present Value (NPV), Internal Rate of Return (IRR), and Discounted Cash Flow (DCF) analysis
                  - paragraph [ref=f352e88]: · Comfortable working in a hybrid environment
                  - paragraph [ref=f352e89]:
                    - strong [ref=f352e90]: Benefits
                  - paragraph [ref=f352e91]:
                    - strong [ref=f352e92]: "Compensation:"
                  - paragraph [ref=f352e93]: Compensation for this position will be between $20 per hour depending on experience with an expected 36-40 hours per week.
