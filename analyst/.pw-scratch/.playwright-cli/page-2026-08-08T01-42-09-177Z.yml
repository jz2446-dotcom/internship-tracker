            - paragraph [ref=f563e62]:
              - strong [ref=f563e63]: "Job Description (if URL to posting not available). Include instructions for how to apply.:"
              - text: "DescriptionMuseum of Fine Arts, Houston, Library and Archives Summer InternshipAcademic Level:Undergraduate Level – InternSupervisors:Joel Pelanne – Technical Services LibrarianAnticipated Schedule: June 2 – August 8, 202535 hours per week (Monday–Friday, 9:00 a.m. – 5:00 p.m., with a one-hour lunch)Fellowship Overview:The Library and Archives Summer Intern will work with the Library and Archives team to support inventory processes and library procedures. This position provides meaningful experiences and learning opportunities for an undergraduate student interested in library sciences, archives, or museum operations.Key Responsibilities:Conduct a scanned inventory of materials in curatorial offices to ensure accurate holdings and facilitate book retrieval.Assist in reviewing and updating Policies and Procedures for the circulation of library materials .Support other tasks and projects as needed to assist Library and Archives operations.Education and Eligibility:Currently enrolled undergraduate students.Interest in library sciences, archives, museum studies, or related fields.Strong attention to detail, organizational skills, and ability to work independently.Familiarity with digital inventory tools is a plus but not required.Fellowship Stipend:$15/hour – $5,250 total for the 10-week internship.Application Requirements:To apply, please submit the following materials:Resume or Curriculum Vitae (CV): Highlighting relevant education and experience.Cover Letter: Describe your interest in the position and how it aligns with your academic and professional goals.This position requires on-site attendance and cannot be undertaken remotely."
