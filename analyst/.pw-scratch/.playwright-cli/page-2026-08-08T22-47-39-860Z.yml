                - definition [ref=f700e123]:
                  - paragraph [ref=f700e124]:
                    - strong [ref=f700e125]: ABOUT US
                  - paragraph [ref=f700e126]: Sonoma County Library creates community through discovery, culture and connection.
                  - paragraph [ref=f700e127]:
                    - text: We are known locally for our engaged, creative, and empowered staff. We rely on community input to guide our decisions, and we proudly champion diversity and equity in all aspects of our organization. Libraries are for everyone. Read more about the library’s mission, vision, and values
                    - link "here" [ref=f700e128] [cursor=pointer]:
                      - /url: https://sonomalibrary.org/about/missionvision
                    - text: .
                  - paragraph [ref=f700e129]: This is a tremendous opportunity to be part of a mission-driven public agency, and help transform the literacy and education landscape for all Sonoma County residents. If you would like to join our team of dedicated professionals, we invite you to apply.
                  - paragraph [ref=f700e130]
              - generic [ref=f700e131]:
                - term [ref=f700e132]:
                  - heading "Description" [level=2] [ref=f700e133]
                - definition [ref=f700e134]:
                  - paragraph
                  - paragraph [ref=f700e135]
                  - paragraph [ref=f700e136]:
                    - strong [ref=f700e137]: Sonoma County Library
                  - paragraph [ref=f700e138]:
                    - strong [ref=f700e139]: Announces an Employment Opportunity
                  - paragraph [ref=f700e140]
                  - paragraph [ref=f700e141]:
                    - strong [ref=f700e142]:
                      - text: BRANCH MANAGER
                      - strong [ref=f700e143]: –
                      - text: SONOMA VALLEY REGIONAL LIBRARY
                  - paragraph [ref=f700e144]:
                    - strong [ref=f700e145]: 40 HOURS PER WEEK – FULL TIME
                  - text: We are seeking a collaborative and community-focused Branch Manager to lead the operations of the Sonoma Valley Regional Library. The ideal candidate will be an experienced library professional with strong leadership skills, a passion for public service, and a commitment to fostering inclusive, welcoming library spaces.To be considered for this opportunity, applicants must complete the Supplemental Questions. Candidates who successfully complete the interview process will be added to a pre-qualified list and may be considered for other vacancies that arise in the next twelve months.
                  - paragraph [ref=f700e146]:
                    - strong [ref=f700e147]: "ABOUT THE POSITION:"
                  - paragraph [ref=f700e148]: Under the general supervision of the Public Services Division Manager, the Branch Manager provides excellent customer service, directs the day-to-day operations and activities of a regional branch library; evaluates the effectiveness of programs and services; develops related goals and objectives; supervises and coordinates staff and activities; provides professional library services including reference, readers’ advisory, collection development, and cataloging; and performs related duties as required. Spanish Bilingual skills are desired.
                  - paragraph [ref=f700e149]: Please see the below class specifications for full details about this position.
                  - strong [ref=f700e150]: "SALARY RANGES: $51.54/hour to $64.34/hour"
                  - paragraph [ref=f700e151]
                  - paragraph [ref=f700e152]:
                    - strong [ref=f700e153]: "CLOSING DATE: 11:59 p.m., Monday, August 10, 2026"
                  - paragraph [ref=f700e154]:
                    - strong [ref=f700e155]: "EST: OCTOBER 2015"
                  - paragraph [ref=f700e156]:
                    - strong [ref=f700e157]: "REV: MARCH 2026 FLSA: EXEMPT"
                  - paragraph [ref=f700e158]
                  - paragraph [ref=f700e159]:
                    - strong [ref=f700e160]: BRANCH MANAGER
                  - paragraph [ref=f700e161]: Represented
                  - paragraph [ref=f700e162]
                  - strong [ref=f700e163]: DEFINITION
                  - paragraph [ref=f700e164]: Under general direction, provides excellent customer service, directs the operations and activities of a regional branch library; evaluates the effectiveness of programs and services; develops related goals and objectives; supervises and coordinates staff; provides professional library services including reference, readers’ advisory, and collection development; supports community and library initiatives; and performs related duties as required.
                  - strong [ref=f700e165]:
                    - generic [ref=f700e166]: SUPERVISION RECEIVED AND EXERCISED
                  - paragraph [ref=f700e167]: Receives general direction from the Division Manager, Public Services. Exercises direct and/or general supervision over professional, paraprofessional, and technical staff, and volunteers.
                  - paragraph [ref=f700e168]
                  - strong [ref=f700e169]: CLASS CHARACTERISTICS
                  - paragraph [ref=f700e170]: This is a management level class within the professional Librarian series responsible for overseeing a branch library within the Sonoma County Library system. The role is outward-facing with a high level of community engagement and interaction expected. Incumbents are responsible for supervising subordinate supervisors, professional and/or support staff; and for providing autonomous operational support to the assigned branch. Incumbents perform professional librarian duties and exercise initiative and considerable independent judgment in the application of policies and procedural guidelines. The work requires a broad knowledge of professional methods and techniques to serve communities with differing needs and interests. Positions in this class are responsible for the formulation and administration of procedures, and programs for the branch, as well as system-wide policies and programs through participation on the Public Services Management Team (PSMT). Performance expectations of this class include the identification of objectives, program administration, development of strategies and policies, management of human, financial and often physical resources, while functioning with a high degree of autonomy.
                  - paragraph [ref=f700e171]
                  - paragraph [ref=f700e172]: This class is distinguished from the Central Library Branch Manager in that the latter has oversight of the Central Santa Rosa Library and History and Genealogy Library operations and activities. This class is further distinguished from Division Manager, Public Services, in that the latter is responsible for the oversight and management of the entire Public Services Division, made up of the public-facing library locations.
                  - paragraph [ref=f700e173]
                  - paragraph [ref=f700e174]:
                    - strong [ref=f700e175]: EXAMPLES OF TYPICAL JOB FUNCTIONS
                    - text: (Illustrative Only)
                  - list [ref=f700e176]:
                    - listitem [ref=f700e177]: Manages the day-to-day operations of a branch library including staffing, materials management, program/outreach oversight, and facilities management.
                    - listitem [ref=f700e178]: Collaborates with Division Manager and staff in formulating branch library goals, procedures and strategic planning; makes budget recommendations and monitors the branch library budget.
                    - listitem [ref=f700e179]: Participates on the Public Services Management Team (PSMT) in formulating system-wide public services procedures and developing policy recommendations.
                    - listitem [ref=f700e180]: Supervises directly, and/or through subordinate supervision, the professional and support staff assigned to the branch library; trains, evaluates, schedules assigned staff; recommends staff selection and disciplinary action when appropriate; may participate in the recruitment process of staff.
                    - listitem [ref=f700e181]: Provides branch leadership to sustain a work culture based on the library’s mission, vision and values, including equity, diversity and inclusion.
                    - listitem [ref=f700e182]: Oversees or participates in the recruitment, training, and scheduling of volunteers; trains and recognizes volunteers.
                    - listitem [ref=f700e183]: Serves as a liaison to Friends of the Library and Library Advisory Board groups and supports related activities.
                    - listitem [ref=f700e184]: Develops and maintains ongoing relationships with external groups in order to identify and address community needs, and to enhance public service
                    - listitem [ref=f700e185]: Analyzes diverse and changing community interests and makes recommendations to ensure that library collections and services are relevant, current, and easily accessible to the community.
                    - listitem [ref=f700e186]: Provides assistance to and advises library users in the effective use of library collection, facilities, and services; demonstrates the use of library resources, tools, equipment, and electronic reference sources.
                    - listitem [ref=f700e187]: Answers readers’ advisory and reference questions.
                    - listitem [ref=f700e188]: Oversees the review of new publications and collection materials; oversees selection of materials and resources for acquisition or weeding as appropriate.
                    - listitem [ref=f700e189]: Monitors the condition and security of facilities, grounds, and equipment; determines need for repairs and improvements in cooperation with facilities staff.
                    - listitem [ref=f700e190]: Oversees the consistent and equitable enforcement of library policies for staff and users.
                    - listitem [ref=f700e191]: Participates in promotional and public relations tasks; creates and implements strategies for improving awareness and use of library services.
                    - listitem [ref=f700e192]: Participates in and oversees outreach to the community, organizations, and schools; informs community about library services, programs, events, and collections.
                    - listitem [ref=f700e193]: Answers questions related to library policies and procedures and resolves disputes with library users.
                    - listitem [ref=f700e194]: Oversees the preparation and maintenance of accurate records and files, including deposit records, activity and statistical reports, correspondence, and other written materials.
                    - listitem [ref=f700e195]: Leads or participates in meetings, committees, or projects.
                    - listitem [ref=f700e196]: Responds to suggestions, requests, or concerns from staff, library users, or community members.
                    - listitem [ref=f700e197]: Represents the branch at professional meetings.
                    - listitem [ref=f700e198]: Participates in circulation functions as needed.
                    - listitem [ref=f700e199]: May perform grant writing activities as required.
                    - listitem [ref=f700e200]: Performs other duties as assigned.
                  - paragraph [ref=f700e201]:
                    - strong [ref=f700e202]: COMPETENCIES
                  - paragraph [ref=f700e203]:
                    - strong [ref=f700e204]: "Knowledge of:"
                  - list [ref=f700e205]:
                    - listitem [ref=f700e206]: Principles and practices of library policies, projects, program planning and implementation, systems development, and library operational trends and practices.
                    - listitem [ref=f700e207]: Principles, practices and techniques of public relations, community outreach, and service promotion.
                    - listitem [ref=f700e208]: Principles of supervision and training, including work planning, assignment, performance review, discipline, and the training of staff in work procedures
                    - listitem [ref=f700e209]: Sound budgetary practices and development, monitoring, and implementation of assigned budgets.
                    - listitem [ref=f700e210]: Techniques for providing a high level of customer service by effectively working with library users, vendors, contractors, local municipalities, stakeholders, support groups and library staff.
                    - listitem [ref=f700e211]: Principles, practices, procedures, techniques, and materials of professional library work, including library reference, collection development, and other professional library services.
                    - listitem [ref=f700e212]: De-escalation techniques used in customer service and interpersonal communication.
                    - listitem [ref=f700e213]: Technological, professional, and societal developments, current literature, and sources of information related to library services.
                    - listitem [ref=f700e214]: Applicable Federal, State, and local laws, regulatory codes, ordinances, and procedures relevant to assigned area of responsibility.
                    - listitem [ref=f700e215]: Record keeping principles and procedures.
                    - listitem [ref=f700e216]: Current library technology, computer applications, and modern office practices.
                    - listitem [ref=f700e217]: English usage, grammar, spelling, vocabulary, and punctuation.
                  - paragraph [ref=f700e218]:
                    - strong [ref=f700e219]: "Ability to:"
                  - list [ref=f700e220]:
                    - listitem [ref=f700e221]: Manage the operations of a regional branch library.
                    - listitem [ref=f700e222]: Assist in developing goals, objectives, policies, procedures and work standards and to oversee and coordinate library collection development and management activities.
                    - listitem [ref=f700e223]: Identify the needs of library users and develop, implement, and manage assigned programs, service areas, policies, procedures, and/or material collections.
                    - listitem [ref=f700e224]: Plan and conduct effective management, administrative and operational studies.
                    - listitem [ref=f700e225]: Organize own work and the work of others, set priorities, and meet deadlines.
                    - listitem [ref=f700e226]: Interpret, explain, and apply all relevant library policies and procedures, and applicable Federal and State laws, codes, and regulations.
                    - listitem [ref=f700e227]: Hire, train, supervise, motivate, and evaluate assigned staff.
                    - listitem [ref=f700e228]: Perform professional library tasks as assigned including reference, readers’ advisory, outreach, program and service development, and collection development.
                    - listitem [ref=f700e229]: Explain policies and procedures to library users and staff.
                    - listitem [ref=f700e230]: Prepare clear and concise reports and other written materials.
                    - listitem [ref=f700e231]: Use computer and other technology, including software, hardware, and the Internet sufficiently to assist library users, conduct research, prepare reports, and use email and other communications technologies.
                    - listitem [ref=f700e232]: React tactfully and diplomatically during interactions with staff, library users, community groups and others while appropriately adhering to and enforcing sound library policies, procedures, and practices.
                    - listitem [ref=f700e233]: Make sound, independent decisions within established policy and procedural guidelines.
                    - listitem [ref=f700e234]: Use English effectively to communicate in person, over the telephone, and in writing.
                    - listitem [ref=f700e235]: Use tact, initiative, prudence, and independent judgment within general policy, procedural, and legal guidelines.
                    - listitem [ref=f700e236]: Establish and maintain working relationships with those contacted in the course of work.
                  - strong
                  - strong [ref=f700e237]: QUALIFICATIONS
                  - paragraph [ref=f700e238]:
                    - emphasis [ref=f700e239]: "Any combination of training and experience that would provide the required knowledge, skills, and abilities is qualifying. A typical way to obtain the required qualifications would be:"
                  - paragraph [ref=f700e240]
                  - paragraph [ref=f700e241]:
                    - strong [ref=f700e242]: "Education and Experience:"
                  - paragraph [ref=f700e243]: Master of Library and Information Science (MLIS), Master of Library Science (MLS), or Master of Science in Library Science (MSLS) degree from an accredited college or university and five (5) years of experience as a professional librarian, including two (2) years at a lead, supervisory, or managerial level.
                  - paragraph [ref=f700e244]
                  - paragraph [ref=f700e245]:
                    - strong [ref=f700e246]: "Licenses and Certifications:"
                  - paragraph [ref=f700e247]: None.
                  - paragraph [ref=f700e248]:
                    - strong [ref=f700e249]: PHYSICAL DEMANDS
                  - paragraph [ref=f700e250]: Must possess mobility to work in a standard office and library setting and use standard office equipment, including a computer; vision to read printed materials and a computer screen; hearing and speech to communicate in person, before groups, and over the telephone; and the ability to operate a motor vehicle in order to travel to various branches, meeting sites, educational institutions, and community events. This classification primarily works indoors and requires movement between work areas. Finger dexterity is needed to access, enter, and retrieve materials and data using a computer keyboard or calculator and to operate standard office equipment. Positions in this classification frequently bend, stoop, kneel, and reach to retrieve and shelve materials. Incumbents must possess the ability to lift, carry, push, and pull items, storage containers, and shelving units weighing an average of 20 pounds, and up to 50 pounds of weight, in order to move materials from one place to another, with the aid of lifting/moving equipment.
                  - paragraph [ref=f700e251]:
                    - strong [ref=f700e252]: ENVIRONMENTAL ELEMENTS
                  - paragraph [ref=f700e253]: Employees primarily work in an office/library environment with moderate noise levels, controlled temperature conditions, and no direct exposure to hazardous physical substances. Employees may interact with staff and/or public and private representatives in interpreting and enforcing departmental policies and procedures chiefly in an indoor setting. Employees in assignments providing direct assistance to the public may come into contact with abrasive, disruptive, and/or disorderly people.
                  - paragraph [ref=f700e254]:
                    - strong [ref=f700e255]: WORKING CONDITIONS
                  - paragraph [ref=f700e256]: May be required to work flexible schedules including evenings and weekends.
                  - paragraph
