                    - text: Sonoma County Library will make reasonable accommodations in the recruitment process to accommodate applicants with disabilities. If you are invited to participate in an examination or interview and have a disability for which you require an accommodation, please contact the Human Resources Department at (707) 545-0831 extension 1591 as soon as possible to make arrangements for your accommodation. Please refer to the Library’s
                    - link "Notice Under the Americans with Disabilities Act (ADA) Policy" [ref=f700e271] [cursor=pointer]:
