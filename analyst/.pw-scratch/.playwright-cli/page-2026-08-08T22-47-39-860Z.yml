                    - strong [ref=f700e266]: "Employment Information:"
                  - paragraph [ref=f700e267]: Employment offers will be contingent upon a successful reference check, pre-employment verification, and criminal records clearance. Having a criminal record will not necessarily disqualify an applicant from employment.
