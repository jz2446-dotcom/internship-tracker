          - generic [ref=e169]:
            - heading "About Student Jobs" [level=1] [ref=e170]
            - paragraph [ref=e173]: The UCLA Library system offers jobs to more than 500 part-time student employees. Find out how you can join our team.
            - link "Find Student Jobs" [ref=e174] [cursor=pointer]:
              - /url: https://www.library.ucla.edu/about/student-opportunities
        - generic [ref=e190]:
          - heading "More Information" [level=2] [ref=e191]
          - generic [ref=e193]:
            - heading "Overview" [level=3] [ref=e195]
            - generic [ref=e198]:
              - paragraph [ref=e199]: Ranked among the top ten research libraries in the US, the UCLA Library system is a campus-wide network of libraries that offers jobs to more than 500 part-time student employees. Our libraries depend heavily on student employees for both public service and technical processing work.
              - paragraph [ref=e200]: Read on for more information about applying for jobs at the Library.
          - generic [ref=e202]:
            - heading "How to Apply" [level=3] [ref=e204]
            - generic [ref=e207]:
              - paragraph [ref=e208]:
                - text: To apply for a job at the Library, view
                - link "student opportunities" [ref=e209] [cursor=pointer]:
                  - /url: /about/student-opportunities
                - text: . New jobs are posted on our website every day, and positions will remain listed until they are filled.
              - paragraph [ref=e210]:
                - text: You can apply for a job or internship using our
                - link "student employment portal (opens in a new tab)" [ref=e211] [cursor=pointer]:
                  - /url: https://uclalibrary.atlassian.net/servicedesk/customer/portal/10/group/20/create/89
                  - text: student employment portal
                  - generic [ref=e212]: (opens in a new tab)
                - text: . New users will need to sign up for an account. Although an account is not required to view available opportunities, it is required to apply for a job.
              - paragraph [ref=e213]: Before applying, carefully review the duties, required skills and knowledge of each job to determine if you are qualified. Please make sure to note the job code for the online application. When completing the application, list all the skills and experience you possess that qualify you for the job. It is extremely important to complete the availability portion for the application as the Library is committed to working around your schedule. Attaching a resume is optional, and only Microsoft Word or PDF formats (not a link to your resume) will be accepted.
              - paragraph [ref=e214]: If you wish, you may apply for multiple opportunities.
          - generic [ref=e216]:
            - heading "Student Employment Resources" [level=3] [ref=e218]
            - list [ref=e221]:
              - listitem [ref=e222]:
                - heading [level=3] [ref=e223]:
                  - link "Student Opportunities" [ref=e224] [cursor=pointer]:
                    - /url: /about/student-opportunities/
                - generic [ref=e225]: The UCLA Library employs 360 part-time student employees. Search our student job listings to find one that is the right fit for you!
              - listitem [ref=e231]:
                - heading [level=3] [ref=e232]:
                  - link "Student Employment Portal" [ref=e233] [cursor=pointer]:
                    - /url: https://uclalibrary.atlassian.net/servicedesk/customer/portal/10/group/20/create/89
                - generic [ref=e234]: Submit an application for a UCLA Library Student Job.
          - generic [ref=e242]:
            - heading "After You Apply" [level=3] [ref=e244]
            - generic [ref=e247]:
              - paragraph [ref=e248]:
                - text: To check your application status, log back into the
                - link "student employment portal (opens in a new tab)" [ref=e249] [cursor=pointer]:
                  - /url: https://uclalibrary.atlassian.net/servicedesk/customer/portal/10/group/20/create/89
                  - text: student employment portal
                  - generic [ref=e250]: (opens in a new tab)
                - text: using the username and password you created when you submitted your application. Once you've successfully logged in, click on "Requests" then "My Requests" in the dropdown. If a decision has not been made, your open applications should appear with a status that will display "Application Submitted" or "Application Under Review."
              - paragraph [ref=e251]: If your experience meets the department's criteria, you will be called in for an interview. The length of the hiring process varies depending on the department and the job. If you are called in for an interview, make sure you find out who you are interviewing with, the time and the location. It is optional to bring a resume and letters of recommendation with you.
              - paragraph [ref=e252]: If you can't find the application you wish to check on the portal, it is likely because a decision has already been made. If you wish to check the decision, change the left dropdown filter that reads "Open Requests" to "Any Status." Those not chosen for the job will have a status of "Not Selected," while those selected will display a "Proceed to HR" status on their application. If selected, you will be contacted via email or phone.
              - paragraph [ref=e253]: Due to the high volume of applications we receive, you may not hear back from a specific department. If you don't get a response within two weeks, you may assume you haven't been selected for an interview. At this time, you may apply to other jobs by resubmitting your application.
          - generic [ref=e255]:
            - heading "Eligibility to Work" [level=3] [ref=e257]
            - generic [ref=e260]:
              - list [ref=e261]:
                - listitem [ref=e262]: Library student jobs are available to currently registered UCLA students only.
                - listitem [ref=e263]: Entering undergraduate and graduate students are eligible for Library employment effective the beginning of the quarter (Fall or Winter) for which they are accepted to UCLA.
                - listitem [ref=e264]:
                  - text: UCLA extension students are
                  - strong [ref=e265]: NOT ELIGIBLE
                  - text: for Library employment.
                - listitem [ref=e266]: All employees must have the legal right to work in the United States. Upon hire, you will be required to provide proof of this.
              - paragraph [ref=e267]: To maintain eligibility to work, an employee must remain registered as a UCLA student throughout their employment with the Library.
          - generic [ref=e269]:
            - heading "UC Nondiscrimination & Affirmative Action Policy" [level=3] [ref=e271]
            - generic [ref=e274]:
              - paragraph [ref=e275]:
                - text: The University of California is an Equal Opportunity / Affirmative Action Employer advancing inclusive excellence. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, age, protected veteran status, or other protected categories covered by the
                - link "UC Nondiscrimination & Affirmative Action Policy (opens in a new tab)" [ref=e276] [cursor=pointer]:
                  - /url: http://policy.ucop.edu/doc/4000376/NondiscrimAffirmAct
                  - text: UC Nondiscrimination & Affirmative Action Policy
                  - generic [ref=e277]: (opens in a new tab)
                - text: .
