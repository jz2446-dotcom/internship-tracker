    - main [ref=f53e43]:
      - article [ref=f53e48]:
        - generic [ref=f53e50]:
          - heading "Current Opportunities" [level=2] [ref=f53e54]
          - generic [ref=f53e56]:
            - generic [ref=f53e58]:
              - heading "Executive Coordinator" [level=2] [ref=f53e59]
              - paragraph [ref=f53e60]:
                - strong [ref=f53e61]: "Employment Type:"
                - text: Full-Time (40 hours per week, 9am to 5pm Pacific Time, or 9am to 5pm Eastern Time)
                - strong [ref=f53e62]: "Salary:"
                - text: $70,000 per year
                - strong [ref=f53e63]: "Location:"
                - text: Remote
                - strong [ref=f53e64]: "Benefits:"
                - text: Full
              - heading "Company Description" [level=3] [ref=f53e65]
              - paragraph [ref=f53e66]: Adasina Social Capital is an investment and financial activism firm that believes that community-sourced impact data should set the standards for how publicly traded companies participate in racial, gender, economic, and climate justice. Our diverse team of people from non-traditional backgrounds works closely with the communities we intend to impact – aligning investors with social justice movements. In addition to managing investment portfolios, Adasina mobilizes investors to drive long-term impact through industry campaigns and education.
              - heading "Job Summary" [level=3] [ref=f53e67]
              - paragraph [ref=f53e68]: The Executive Coordinator (EC) reports to the Co-CEO and performs administrative, operational, and governance-support activities on behalf of the Co-Chief Executive Officers (Co-CEOs) and the firm’s governing bodies. Because Adasina operates at the intersection of investment management and social justice movement work, the EC’s ability to organize priorities, execute against them, and steward the systems and communications of the CEO Office directly enables the firm’s impact and the integrity of its governance.
              - paragraph [ref=f53e69]: To fulfill the requirements of their role, the EC must independently organize and prioritize critical information required to facilitate efficient executive decision-making and manage communication between the Co-CEOs and other stakeholders. The ideal candidate must be able to provide advanced administrative support to the Co-CEOs, Board of Directors (BoD), and Trust Stewardship Committee (TSC, the governing body responsible for stewarding Adasina’s purpose and long-term mission integrity) to maximize productivity and efficiency. The EC will work closely with the Co-CEOs and support the execution of Adasina’s strategic vision and CEO Office operational plans.
              - heading "Details of Role" [level=4] [ref=f53e70]
              - heading "Co-CEO SUPPORT (60%)" [level=4] [ref=f53e71]
              - list [ref=f53e72]:
                - listitem [ref=f53e73]:
                  - text: "Perform administrative, operational, and financial functions on behalf of the Co-CEOs. These responsibilities include, but are not limited to, the following activities:"
                  - list [ref=f53e74]:
                    - listitem [ref=f53e75]: Manage high-volume executive email and social media inboxes, prioritizing and triaging incoming communications, identifying matters requiring immediate attention, and proactively responding or escalating based on urgency, sensitivity, and strategic importance.
                    - listitem [ref=f53e76]: Manage the executive calendar in alignment with strategic priorities; coordinate internal and external scheduling needs and resolve scheduling conflicts.
                    - listitem [ref=f53e77]: Develop agenda and meeting materials, capture and organize meeting notes across appropriate systems (e.g., agendas, CRM systems), debrief meetings to follow-up on deliverables, and perform follow-up action items.
                    - listitem [ref=f53e78]: Manage administrative logistics for the Co-CEO Office, including coordinating Co-CEO-related events, arranging domestic and international travel, and preparing and submitting expense reports and reimbursements.
                    - listitem [ref=f53e79]: Maintain thoughtful and consistent organization of CEO Office documentation and operational systems within Google Workspace and the Monday.com client relationship management (CRM) and work management systems.
                    - listitem [ref=f53e80]: Maintain the CRM on behalf of the Co-CEOs by keeping accurate records, documenting client interactions, and capturing meeting notes and follow-up actions.
                    - listitem [ref=f53e81]: Provide limited non-business administrative support when it directly supports the Co-CEOs’ ability to fulfill organizational responsibilities.
                - listitem [ref=f53e82]: Manage and coordinate projects on behalf of the CEO Office by developing project plans, tracking milestones, coordinating cross-functional stakeholders, monitoring progress, identifying risks, and ensuring timely completion of key initiatives.
              - heading "GOVERNANCE SUPPORT (40%)" [level=4] [ref=f53e83]
              - list [ref=f53e84]:
                - listitem [ref=f53e85]: Provide coordination and administrative support of firm governance, including, but not limited to, drafting agendas, capturing meeting notes and action items, and performing and tracking activities to support effective governance processes.
                - listitem [ref=f53e86]: Manage the governance calendar across BoD and TSC cadences, coordinating meeting scheduling, member availability, and preparation timelines against strategic priorities.
                - listitem [ref=f53e87]: Coordinate the full governance materials lifecycle, including pre-read distribution, resolutions tracking, minutes finalization, and records retention in accordance with the firm’s governance and compliance policies.
                - listitem [ref=f53e88]: Support the development, organization, and distribution of materials, reports, and other required deliverables from the firm to the BoD and the TSC.
                - listitem [ref=f53e89]: Facilitate communication and coordination among BoD members, TSC members, and executive leadership to ensure timely information sharing, alignment, and execution of governance activities.
              - heading "Requirements" [level=3] [ref=f53e90]
              - list [ref=f53e91]:
                - listitem [ref=f53e92]: Ability to prioritize competing responsibilities and exercise sound judgment on urgency, sensitivity, and escalation
                - listitem [ref=f53e93]: Genuine alignment with Adasina’s mission, including comfort working in a firm that centers racial, gender, economic, and climate justice
                - listitem [ref=f53e94]: Bachelor’s degree or higher educational achievementProven experience successfully organizing multiple simultaneous projects
                - listitem [ref=f53e95]: 5+ years of relevant work experience in finance or a related industry
                - listitem [ref=f53e96]: 3+ years of experience providing professional and personal support to C-suite executives
                - listitem [ref=f53e97]: Google Workspace experience, with high proficiency in Gmail
                - listitem [ref=f53e98]: Stellar written, verbal, and visual communication skills with high attention to detail and consistent commitment to accuracy
                - listitem [ref=f53e99]: Exceptional project-management and time-management skills
                - listitem [ref=f53e100]: Insightful, empathetic, and resourceful problem-solving abilities
              - heading "Preferred Qualifications" [level=4] [ref=f53e101]
              - list [ref=f53e102]:
                - listitem [ref=f53e103]: Experience with Monday.com or similar project-management operating system
                - listitem [ref=f53e104]: Willingness to learn new skills and systems and collaborate in other areas as needed
                - listitem [ref=f53e105]: Experience managing relationships with diverse groups of people
            - generic [ref=f53e107]:
              - heading "How to Apply" [level=3] [ref=f53e108]
              - paragraph [ref=f53e109]: Adasina is committed to creating and maintaining a diverse workplace that reflects our progressive values and the communities for which we seek justice. Women, BIPOC, and LGBTQ+ candidates are strongly encouraged to apply. Investment management and financial services are a highly regulated industry, therefore all applicants must respect confidentiality, adhere to the firm’s Privacy Policies and Code of Ethics. Pursuant to the California Fair Chance Ordinance, Adasina Social Capital will consider for employment qualified applicants with arrest and conviction records.
              - paragraph [ref=f53e110]:
                - text: To apply, please submit your resume and a cover letter (as separate files) explaining your qualifications and why you are interested in the position to
                - link "apply@adasina.com" [ref=f53e111] [cursor=pointer]:
                  - /url: mailto:apply@adasina.com
                - text: in PDF format. Please ensure the subject line of your email reads “Application for EC_[Your Last Name], [Your First Name].” Applications will be accepted until the position is filled. Interviews will be scheduled on a rolling basis. The anticipated start date for the role is early August 2026.
