                - paragraph [ref=f309e197]: SAFETY IMPACT POSITION Yes
                - paragraph [ref=f309e198]: If yes, this position is subject to random drug testing and if a promotional position, candidate must pass an assignment drug test.
                - paragraph [ref=f309e199]: SALARY INFORMATION
                - paragraph [ref=f309e200]: Factors used in determining the salary offered include the candidate's qualifications as well as the pay rates of other employees in this classification.
                - paragraph [ref=f309e201]:
                  - strong [ref=f309e202]: "Pay Grade:"
                  - text: "14"
