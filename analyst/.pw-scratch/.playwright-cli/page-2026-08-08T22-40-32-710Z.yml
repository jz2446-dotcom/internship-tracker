                - heading "POSITION OVERVIEW" [level=2] [ref=f309e118]
              - definition [ref=f309e119]:
                - paragraph [ref=f309e120]:
                  - img "HEC HEADER 2.png" [ref=f309e121]
                  - strong [ref=f309e122]: "Applications accepted from:"
                  - text: ALL PERSONS INTERESTED
                - paragraph [ref=f309e123]:
                  - strong [ref=f309e124]: "Job Classification:"
                  - text: 9-1-1 Telecommunicator
                - paragraph [ref=f309e125]:
                  - strong [ref=f309e126]: "Section:"
                  - text: 9-1-1 Emergency Network
                - paragraph [ref=f309e127]:
                  - strong [ref=f309e128]: "Reporting Location:"
                  - text: 5320 N. Shephard Drive
                - paragraph [ref=f309e129]:
                  - strong [ref=f309e130]: "Workdays & Hours:"
                  - text: FULL-TIME - Rotating Shifts & Off Days*
                - paragraph [ref=f309e131]: (5:30am – 2:00pm, 1:30pm – 10:00pm, 9:30pm – 6:00am or as Assigned) * Subject to change*
                - paragraph [ref=f309e132]
                - paragraph [ref=f309e133]:
                  - strong [ref=f309e134]: DESCRIPTION OF DUTIES/ESSENTIAL FUNCTIONS
                - paragraph [ref=f309e135]: The Houston Emergency Center assists citizens of Houston with the most efficient, accurate and professional service when processing emergency calls by taking care of each citizen, one call at a time. We are seeking qualified individuals who are interested in a dynamic career and share the same passion and commitment in being the first responder when a citizen calls. The successful candidate responds to citizens' requests for emergency services by determining the type of problem and transferring the 9-1-1 telephone calls to the appropriate agencies.
                - paragraph [ref=f309e136]: "Emergency Communications work can be difficult but rewarding, allowing you to truly make a difference in the lives of fellow citizens. This position will involve the need for great focus and attentiveness during calls because the cost of mistakes can be life threatening. 9-1-1 Telecommunicators help determine the appropriate personnel required at the scene of emergency and nonemergency situations by performing the following duties:"
                - list [ref=f309e137]:
                  - listitem [ref=f309e138]: Answers 9-1-1 emergency telephone calls from citizens or agencies for Police, Fire and Emergency Medical Services in a timely manner.
                  - listitem [ref=f309e139]: Determines the nature and priority of the emergency and assists callers in a professional and efficient manner.
                  - listitem [ref=f309e140]: Multi-tasks between and operates various electronic telephone equipment, i.e., Vesta 9-1-1 and Cisco Telephone Systems. Uses equipment to receive and transfer incoming calls, to replay calls for clarification and to process hearing impaired calls using a TDD device.
                  - listitem [ref=f309e141]: Enters essential call and location information into Window's Operating System and various applications of the Vesta 9-1-1 System to view and retrieve information efficiently.
                  - listitem [ref=f309e142]: Recognizes critical situations and alerts supervisor on complicated and unusual situations.
                  - listitem [ref=f309e143]: Physically locates 9-1-1 telephone calls and identifies vehicles' locations using the geographic display (MapStar).
                  - listitem [ref=f309e144]: Refers calls to City departments other than Police and Fire and outside governmental, social or community agencies.
                  - listitem [ref=f309e145]: May be required to be "on call" or "onsite" during emergency situations.
                - paragraph [ref=f309e146]: "Core Capabilities may include:"
                - list [ref=f309e147]:
                  - listitem [ref=f309e148]: Remains calm, composed, undistracted and in full control of cognitive abilities while functioning appropriately in stressful situations.
                  - listitem [ref=f309e149]: Maintains rational cognitive/decision-making ability and emotional self-control in situations or interactions that are personally offensive (cases of child abuse, child molestation, sexual assault, extreme trauma or death, etc.) or which involve considerable stress or hostility.
                  - listitem [ref=f309e150]: Maintain composure and exercise restraint when verbally provoked in hostile or violent interactions.
                  - listitem [ref=f309e151]: Gathers appropriate information in interactions and documents information accurately as provided.
                  - listitem [ref=f309e152]: Interacts with a variety of people functioning under various emotional states to manage interpersonal conflicts, obtain or give information, give aid or to provide service.
                  - listitem [ref=f309e153]: Sufficient cognitive skills (i.e., intelligence, concentration, and memory) such that the employee is mentally alert, able to discern subtle cues of impending danger, and make rational decisions at a reasonable speed.
                  - listitem [ref=f309e154]: Sufficient clarity of speech, hearing and other communication capabilities, which permits the employee to communicate effectively, including during emergency situations which may involve a high degree of noise.
                  - listitem [ref=f309e155]: Maintains a mental state of fitness and readiness that will enable the employee to handle potentially serious or life-threatening situations.
                  - listitem [ref=f309e156]: Able to respond to and recover from stressful and adverse interactions.
                  - listitem [ref=f309e157]: Able to demonstrate truthfulness and directness.
                  - listitem [ref=f309e158]: Duties include but are not limited to attendance at work on a regularly scheduled basis and, as necessary, be prepared to remain onsite, except for supervisory approved meal/breaks, for the entire scheduled work shift. May require performing other duties.
                - paragraph [ref=f309e159]:
                  - strong [ref=f309e160]: Full-time positions with the Houston Emergency Center are 40 hours per week on a rotating shift schedule including nights, weekends, and holidays. The department is staffed 24 hours a day, 7 days a week. Successful candidates must be able to work all shifts and have the flexibility to alter schedule based on departmental and operational need. Mandatory overtime will be required during critical incidents or to maintain staffing levels. On call time is also mandatory.
                - paragraph [ref=f309e161]: For all 911 Telecommunicators, the job requires a combination of public service commitment and strong technical skills that can be learned during an on-the-job training period.
                - paragraph [ref=f309e162]:
                  - strong [ref=f309e163]: MUST BE AVAILABLE TO WORK ANY SHIFTS FOR THE FIRST TWO YEARS, OR ANY SHIFT CHANGES THAT OCCUR. PICKING A SHIFT WILL NOT BE A PREFERENCE.
                - paragraph [ref=f309e164]:
                  - strong [ref=f309e165]: WORKING CONDITIONS
                - paragraph [ref=f309e166]: The position is physically comfortable most of the time with occasional periods of stooping, bending and/or light lifting of materials up to 10 pounds. There are occasional minor discomforts from exposure to less-than-optimal temperature and air conditions. The position may involve dealing with modestly unpleasant situations, as with occasional exposure to office chemicals and/or extensive use of a video display terminal. Requires the ability to make coordinated gross motor movements in response to changing external stimuli within moderately demanding tolerances; or the ability to make coordinated eye/hand movements on a patterned response space within low tolerance demands with no real speed requirements.
                - paragraph [ref=f309e167]:
                  - strong [ref=f309e168]: All positions in the Houston Emergency Center (HEC) are designated as TIER 1 (First Responder) employees and will require you to work long hours in emergency or disaster situations that may require you to be away from your home and/or family for extended periods of time.
                - paragraph [ref=f309e169]: Must be able to pass a criminal background check, obtain and maintain federally mandated security clearances where required.
                - paragraph [ref=f309e170]: Must maintain compliance with all TCOLE rules and regulations once licensed.
                - paragraph
              - term [ref=f309e171]:
                - heading "MINIMUM REQUIREMENTS" [level=2] [ref=f309e172]
              - definition [ref=f309e173]:
                - paragraph
                - paragraph [ref=f309e174]: EDUCATIONAL REQUIREMENTS
                - paragraph [ref=f309e175]: Requires a high school diploma or a GED. Must pass City administered tests.
                - paragraph [ref=f309e176]: EXPERIENCE REQUIREMENTS
                - paragraph [ref=f309e177]: One (1) year of experience in a high-volume telephone or customer service environment or a high stress environment is required.
                - paragraph [ref=f309e178]:
                  - strong [ref=f309e179]: "Substitutions:"
                  - text: A Certificate of Completion in Public Safety Telecommunicator from Houston Community College, or an equivalent certification from another accredited continuing education program that meets equivalent prerequisites, course hours, and outcomes may substitute for the experience requirement. LICENSE REQUIREMENTSMust provide certification of successful completion of or complete within one year of employment a telecommunicator training program in compliance with the Texas Commission on Law Enforcement (TCOLE) guidelines and must continue to maintain an active TCOLE license throughout employment with the department.
                - paragraph
              - term [ref=f309e180]:
                - heading "PREFERENCES" [level=2] [ref=f309e181]
              - definition [ref=f309e182]:
                - paragraph
                - paragraph [ref=f309e183]: "Preference will be given to those applicants with experience in an environment similar to public safety (e.g., Police, Ambulance or Fire), or with previous Telecommunicator experience. Bilingual skills (Spanish: speak, read, and write) are highly preferred. Due to constant communication with citizens, quality customer service experience is critical."
                - paragraph [ref=f309e184]:
                  - strong [ref=f309e185]: "**Preference shall be given to eligible veteran applicants provided such persons possess the qualifications necessary for competent discharge of the duties involved in the position applied for, such persons are among the most qualified candidates for the position, and all other factors in accordance with Executive Order 1-6.**"
                - paragraph
              - term [ref=f309e186]:
                - heading "GENERAL INFORMATION" [level=2] [ref=f309e187]
              - definition [ref=f309e188]:
                - paragraph
                - paragraph [ref=f309e189]: SELECTION/SKILLS TESTS REQUIRED
                - paragraph [ref=f309e190]: Must be able to pass a City-administered PC keyboard test proficiency of 30 wpm and a CritiCall skills assessment test to move further through the selection process, as well as successfully pass a lengthy Criminal background check. Applicant also must pass hearing test, psychological evaluation, and thorough background / employment / education checks and successful interview.
                - paragraph [ref=f309e191]: "Practice testing for the 911 Telecommunicator position can be found on the following sites:"
                - paragraph [ref=f309e192]:
                  - link "https://www.tsatestprep.com/911-dispatcher-practice-test/" [ref=f309e193] [cursor=pointer]:
                    - /url: https://www.tsatestprep.com/911-dispatcher-practice-test/
