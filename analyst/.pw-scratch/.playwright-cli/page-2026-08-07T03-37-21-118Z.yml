                    - paragraph [ref=f96e136]: Internship Program
                    - paragraph [ref=f96e137]
                    - paragraph [ref=f96e138]: Our 16-week internship gives you the chance to leverage your education to work on meaningful projects that positively impact our teams' success. You can look forward to a mix of on-the-job experience, training, networking and mentoring – everything you’ll need to develop both personally and professionally. This is a unique opportunity to join one of our many dynamic marketing functions including, but not limited to technical and traditional marketing roles within Lending, Acquisition, Member Engagement, Merchant Marketing, Insurance, New Product Development, Project Management and Product Marketing.
                    - paragraph [ref=f96e139]
                    - paragraph [ref=f96e140]: "Programs Offered:"
