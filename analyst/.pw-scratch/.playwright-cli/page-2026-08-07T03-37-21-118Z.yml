    - generic [ref=f96e60]:
      - paragraph [ref=f96e63]: KICKSTART YOUR CAREER WITH TEAM AMEX
      - generic [ref=f96e69]:
        - generic [ref=f96e72]:
          - paragraph [ref=f96e73]: With meaningful mentorship, real responsibilities and hands on learning experiences, joining Team Amex gives you a global network of opportunities that will shape your career journey for years to come. We offer a range of internship programs as well as full-time opportunities for recent graduates that are designed to provide you with a rewarding and unique experience. As a Team Amex intern, you are encouraged to roll up your sleeves and contribute your point of view to help impact and shape a global iconic brand.
          - paragraph [ref=f96e74]
        - link "Explore student opportunities" [ref=f96e78] [cursor=pointer]:
          - /url: https://careers.americanexpress.com/en/sites/CX_1/jobs?keyword=Campus&mode=location&intlink=us-amex-career-en-us-GlobalStudentsPage-Explore-student-opportunities
    - generic [ref=f96e97]:
      - paragraph [ref=f96e98]: GLOBAL PROGRAMS
      - paragraph [ref=f96e99]
      - paragraph [ref=f96e100]: As one of the world's most global companies, we have internships and full-time graduate opportunities in 13 locations focused on different career areas so that you can build a career that is unique to you. The internships also bring you one step closer to landing full-time roles with Team Amex upon graduation. Ready to join us? Take a look at our programs below.
