              - paragraph [ref=f96e356]: “My internship experience played a pivotal role in preparing me for a permanent position at Amex. The guidance, training and development I received provided a solid foundation and a comprehensive understanding of the organization's inner workings. It allowed me to grasp the moving parts within the company.”
            - generic [ref=f96e358]:
