            - generic [ref=f96e266]:
              - paragraph [ref=f96e267]: “
              - paragraph [ref=f96e268]: “I had the good fortune to intern with the Global Services Group (GSG) at American Express. Apart from having a good work culture, this place also gave me an opportunity to hone my skills & provided valuable hands-on experience. It was challenging at times, but under the guidance of bold leaders, I took up the responsibilities to drive automation initiatives. My transition from intern to full-time colleague at Amex was smooth sailing. There is a positive energy at Amex that is striking.”
