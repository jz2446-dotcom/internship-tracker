              - text: Contact Us
              - generic: 
          - generic [ref=f96e764]:
            - paragraph [ref=f96e767]: Individuals featured on this site may include current or former colleagues.
            - paragraph [ref=f96e770]:
              - text: At American Express, you’ll be recognized for your contributions, leadership, and impact—every colleague has the opportunity to share in the company’s success. Together, we’ll win as a team, striving to uphold our
              - link "company values" [ref=f96e771] [cursor=pointer]:
                - /url: https://www.americanexpress.com/en-us/company/who-we-are/
              - text: and powerful backing promise to provide the world’s best customer experience every day. And we’ll do it with the utmost integrity, and in an environment where everyone is seen, heard and feels like they belong.
            - paragraph [ref=f96e774]: American Express is an equal opportunity employer and makes employment decisions without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, veteran status, disability status, age, or any other status protected by law.
            - paragraph [ref=f96e777]:
              - text: US Job Seekers - Click to view the
              - link "Know Your Rights" [ref=f96e778] [cursor=pointer]:
