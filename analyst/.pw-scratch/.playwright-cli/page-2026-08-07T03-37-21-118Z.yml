              - paragraph [ref=f96e311]: “
              - paragraph [ref=f96e312]: "\"My role on the campus graduate program as a Finance Analyst allowed me to explore numerous pathways available to develop my career at American Express and also helped me to expand my skillset to prosper within my role. Having the opportunity to partner with global colleagues on exciting projects has been extremely rewarding.“"
