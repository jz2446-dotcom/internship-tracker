      - paragraph [ref=f96e493]: American Express actively cultivates an inclusive workforce where every voice is heard, teamwork is rewarded, and different points of view are celebrated. Our internships are designed to offer an experience that’s unique and meaningful for each student – one that uses their talents and strengths to make an impact.
      - paragraph [ref=f96e494]
      - paragraph [ref=f96e495]:
        - generic [ref=f96e496]: Students with a broad range of backgrounds and experiences are encouraged to apply for the programs below, which provide the opportunity to learn more about American Express’ culture and business by networking with Amex colleagues prior to interviewing for one of our internships. Learn more about these programs below.
