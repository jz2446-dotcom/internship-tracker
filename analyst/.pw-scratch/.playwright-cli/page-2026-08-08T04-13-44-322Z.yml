      - img "People commuting across London Bridge" [ref=f130e38]
      - paragraph [ref=f130e41]: For almost a century, Nomura has built a tradition of disciplined entrepreneurship, delivering creative solutions to individuals, institutions, corporates and governments to help them achieve their ambitions and shape a better world. We are searching for the next generation of leaders to continue our story. Are you one of them?
      - generic [ref=f130e42]:
        - generic:
          - img "Nomura was ranked fifth in Rate My Placement’s Best 100 Student Employers 2025 to 2026" [ref=f130e43]
          - img "Nomura was ranked fifth in Rate My Placement’s Best 100 Student Employers 2025 to 2026" [ref=f130e44]
      - generic [ref=f130e45]:
        - paragraph [ref=f130e46]: As Asia’s global investment bank, Nomura offers endless opportunities to accelerate your career. Expect structured training, challenging opportunities and supportive mentorship in your first 24 months, preparing you for impactful leadership roles and a long-term career with us.
        - paragraph [ref=f130e47]: Operating in more than 30 countries, our diverse workforce of almost 27,000 people across our Wealth Management, Investment Management and Wholesale (Global Markets, Investment Banking and International Wealth Management) divisions live our values every day.
      - generic [ref=f130e48]:
        - paragraph [ref=f130e50]: We channel our passion for finance into dynamic leadership and innovation to meet the needs of our stakeholders and society.
        - img "Colleagues sat around a meeting table" [ref=f130e52]
      - generic [ref=f130e53]:
        - img "A group of people having a discussion" [ref=f130e55]
        - paragraph [ref=f130e57]: Teamwork is the bedrock of our success, and we work together to promote diversity, and collaborate across divisions and regions to serve our clients.
      - generic [ref=f130e58]:
        - paragraph [ref=f130e60]: We prize integrity, and encourage personal responsibility, fairness and transparency in how we engage with each other and with our clients.
        - img "A women shaking hands with colleagues to introduce herself" [ref=f130e62]
      - generic [ref=f130e63]:
        - paragraph [ref=f130e64]: These principles draw on our proud Japanese heritage. Combined with an agile, open-minded outlook, and a unique focus on connecting markets east and west, they allow us to consistently exceed clients’ expectations.
        - paragraph [ref=f130e65]: Choosing which area of our business you want to go into is an important decision. We encourage you to explore all the available paths and find the one that aligns with your skills and ambitions. Whatever direction you take, you can expect challenging work, supportive colleagues, and the chance to achieve great things.
        - paragraph [ref=f130e66]: If you are keen to be a part of a nimble and diverse workforce where you can grow and build a rewarding career, come and discover more about Nomura.
