            - paragraph [ref=f170e99]:
              - strong [ref=f170e100]: "Role:"
              - text: Intern
            - paragraph [ref=f170e101]:
              - strong [ref=f170e102]: "Location:"
              - text: Shanghai/Singapore
            - paragraph [ref=f170e103]:
              - strong [ref=f170e104]: About Hillhouse Investment and Rava Partners
            - paragraph [ref=f170e105]: Hillhouse is a global alternative investment manager with nearly two decades of experience across a diverse range of investment strategies, including public equities, private equity (buyout, venture capital, and growth), private credit, and real assets.
            - paragraph [ref=f170e106]: Rava Partners is a new infrastructure-focused investment platform, jointly founded in 2020 by Hillhouse and the firm’s senior leadership team. With more than 40 investment professionals across seven key offices in the Asia-Pacific region, Rava Partners brings deep regional expertise in investment and asset management. Since its establishment, the firm has become one of the largest real assets investors in Asia Pacific, with investments in more than 22 portfolio companies whose owned or managed assets have an aggregate value exceeding US$21 billion.
            - paragraph [ref=f170e107]:
              - strong [ref=f170e108]: We Are Currently Looking For
            - paragraph [ref=f170e109]: Students to join our internship program, the Rava Emerging Investors Program (EIP), for 3-6 months with a minimum commitment of 3 days a week in our Shanghai/Singapore office.
            - paragraph [ref=f170e110]:
              - strong [ref=f170e111]: What You Will Experience
            - list [ref=f170e112]:
              - listitem [ref=f170e113]: An internship that mirrors the experience of a full-time investment analyst
              - listitem [ref=f170e114]: Hands-on research experience in live deals, guided by seasoned investment professionals
              - listitem [ref=f170e115]: Opportunities to demonstrate thought leadership and contribute meaningfully to our investment process and financial analysis
              - listitem [ref=f170e116]: In-depth hard skills and soft skills training, interactions with experienced investment professionals, and a customized development plan based on your experience, skillset, and interests
              - listitem [ref=f170e117]: Possibility to extend to a longer-term internship for strong performers
            - paragraph [ref=f170e118]:
              - strong [ref=f170e119]: Requirements
            - list [ref=f170e120]:
              - listitem [ref=f170e121]: Graduate students or undergraduates from top universities globally in their penultimate or final year
              - listitem [ref=f170e122]: Strong passion for investing and research, with a solid command of financial analysis and investment knowledge
              - listitem [ref=f170e123]: Prior internship experience in private equity (particularly real estate or infrastructure), investment banks, consulting firms, public investment institutions, or equity research is preferred
              - listitem [ref=f170e124]: Exceptional communication skills, independent and analytical thinking, and a strong team player
            - paragraph [ref=f170e125]:
              - text: "If you are interested in these internship opportunities, please send your resume to us by email:"
              - link "campus@hillhouseinvestment.com" [ref=f170e126] [cursor=pointer]:
                - /url: mailto:campus@hillhouseinvestment.com
              - text: ; we will review and interview shortlisted candidates on a rolling basis.
