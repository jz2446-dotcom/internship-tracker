                  - generic [ref=f988e142]: As Director of Data Analytics, you will be the first dedicated analytics engineering hire and are expected to help shape and grow the data function over time, responsible for building the foundations that power data-driven decision-making across the company. You will partner with teams across the business to design our data models, define core metrics, and make high-quality data easy to discover and trust. This is a highly collaborative, in-office role, with regular partnership across Finance, Accounting, IT, Leasing, Operations, and executive stakeholders.
