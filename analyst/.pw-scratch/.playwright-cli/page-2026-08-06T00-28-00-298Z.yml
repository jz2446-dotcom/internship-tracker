          - separator [ref=f414e78]
          - paragraph [ref=f414e79]: Three types of internships may be available at Presidential Libraries located across the country. In some Library internships, elements from two or more of the listed internships may be combined.
          - list [ref=f414e80]:
            - listitem [ref=f414e81]:
              - strong [ref=f414e82]: Archival Processing Staff Assistant
              - text: Assist staff in arranging holdings, performing basic preservation measures, and preparing finding aids and indexes.
            - listitem [ref=f414e83]:
              - strong [ref=f414e84]: Museum and/or Public Programs Staff Assistant
              - text: Assist museum and/or public programs staff in a variety of assignments relating to tours, educational programs, and curatorial duties.
            - listitem [ref=f414e85]:
              - strong [ref=f414e86]: Reference Staff Assistant
              - text: Assist staff in providing reference services on textual and audiovisual materials to the public by mail, by telephone, and in person.
