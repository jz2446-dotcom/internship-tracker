            - heading "Job Description" [level=2] [ref=f132e122]
            - paragraph [ref=f132e124]: Wildlife Works is seeking future talent for potential internships in community-driven conservation. As a leader in REDD+ forest conservation, the organization focuses on protecting forests and supporting local communities globally. Joining their Talent Pool offers early visibility into mission-driven work and connects candidates with opportunities aligned with their interests. Note that this is not an active internship opening; candidates will be contacted when opportunities arise.We’re building a community of future talent aligned with community-driven conservationAbout Wildlife WorksWildlife Works is a pioneer in REDD+ forest conservation, delivering premium carbon credits and biodiversity stewardship units through community-led projects around the world. Our portfolio protects over 500,000 ha in Kenya’s Kasigau Corridor and 300,000 ha in the DRC’s Mai Ndombe, driving impact through verified credits and strong local partnerships. We are the global leader in community-driven forest conservation, working across Colombia, Panama, Indonesia and beyond. In Colombia, since 2018 we've helped protect over 800,000 hectares across four REDD+ projects in the Amazon and Pacific ecoregions, partnering closely with Indigenous and Afro‑Colombian communities through full transparency, FPIC processes, and creating sustainable income opportunities like women-run handicraft ventures. In Panama, we maintain a local office and apply the same community‑centered, market-based model to support forest protection and generate carbon credits. In Indonesia, our Gerbang Barito REDD+ project in Central Kalimantan not only conserves biodiverse forest but also builds resilience by delivering emergency aid—medical care, food, and supplies—when floods struck, demonstrating how conservation efforts extend into vital community support. Across all regions, our approach blends avoided deforestation funding with investments in education, health, women’s empowerment, and sustainable livelihoods, ensuring that local peoples are at the heart of long‑term forest stewardship.Wildlife Works’ conservation projects drive direct financing to forest communities to fund their own economic development while preventing millions of tons of carbon dioxide emissions from entering the atmosphere annually.By joining our Talent Pool, you will:• Be considered for future internship opportunities across our global teams• Gain early visibility into meaningful, mission-driven work• Connect with an organization committed to long-term impactImportant to know:This is not an active internship opening. When opportunities arise, we will reach out directly to candidates whose interests and profiles align.Call to Action:If you’re curious, motivated, and driven by purpose, we’d love to hear from you.Join our Talent Pool today!
