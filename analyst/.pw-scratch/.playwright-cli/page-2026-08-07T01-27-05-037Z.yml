            - emphasis [ref=f146e79]: Qualifications
            - list [ref=f146e80]:
              - listitem [ref=f146e81]:
                - emphasis [ref=f146e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f146e83]:
                - emphasis [ref=f146e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f146e85]:
                - emphasis [ref=f146e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f146e87]:
                - emphasis [ref=f146e88]: Must be a team player with a “no job is too big or too small attitude”
              - listitem [ref=f146e89]:
