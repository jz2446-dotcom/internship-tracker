            - heading "Job Description" [level=2] [ref=f388e68]
            - generic [ref=f388e69]:
              - strong [ref=f388e70]: We create the buildings of tomorrow, so our clients and communities thrive today.
              - strong [ref=f388e71]: At our core, we're creators who bring local ingenuity and global vision to everything we build. From our unique ability to transform spaces into places, to our resourcefulness in meeting the diverse needs of businesses and investors, our performance is powered by inventive teams with an entrepreneurial mindset.
              - strong [ref=f388e72]: "When you join TCC, you're joining a dedicated team of people who are committed to upholding our RISE (Respect, Integrity, Service, Excellence) Values. Our RISE values fuel our mission for a diverse, equitable, and inclusive workplace so our people, our business partners and the communities in which we build: thrive. TCC's performance is powered by our most powerful asset-our people. Comprised of teams possessing passion, innovation, and a visible culture of excellence, we are actively seeking talent with diverse backgrounds and experiences across all industries"
              - strong [ref=f388e73]: to apply for open
              - strong [ref=f388e74]: positions.
              - strong [ref=f388e75]: JOB SUMMARY
              - text: At Trammell Crow Company, we have built our business - and reputation - by hiring great people. We believe outstanding, capable and dedicated employees have laid the foundation of our success and are our most valuable asset. Trammell Crow Company cultivates an environment that empowers its employees to be the best. Our Development/Construction Intern position is based in our Philadelphia office and will support the construction team on multiple aspects of commercial property design, municipal approvals and construction.
              - strong [ref=f388e76]: ESSENTIAL DUTIES AND RESPONSIBILITIES
              - list [ref=f388e77]:
                - listitem [ref=f388e78]: Participate with our on-site team to monitor the progress of construction, review status of work completed during the period covered, review that work is generally proceeding in a good and workmanlike manner and in general accordance with the approved drawings and specifications.
                - listitem [ref=f388e79]: Assist with contractor and architect pay applications, review of change orders, review of construction and disbursement schedules, attend construction and design meetings, attend punchlist walks, and participate with pre-construction buy-out process.
                - listitem [ref=f388e80]: Assist with monthly Project Status Reports.
                - listitem [ref=f388e81]: Review contract drawings and specifications and opine for completeness and general compliance with commonly accepted architectural /engineering best practices.
                - listitem [ref=f388e82]: Analyze the Developer's direct and indirect cost budget including cost estimate back-up, spot quantity take-offs and review of supporting documentation submitted by the Developer, contractor and subcontractors.
                - listitem [ref=f388e83]: Review and make relevant comments concerning the terms of the construction agreement, the submitted subcontracts, architectural and engineering design agreements, and review both the Contractor and Architect's qualification statements.
                - listitem [ref=f388e84]: "Review and comment on construction and disbursement schedules as well as other submitted document including but not limited to: zoning approvals, certified surveys, building permits and approvals, utility company approval letters, soil and foundation engineering reports, and designer's certification of code and ADA compliance."
                - listitem [ref=f388e85]: Prepare Construction Risk Assessment Reports.
              - text: Other duties may be assigned.
              - strong [ref=f388e86]: SUPERVISORY RESPONSIBILITIES
              - text: No formal supervisory responsibilities in this position. May provide informal assistance such as technical guidance, and/or training to coworkers.
              - strong [ref=f388e87]: EDUCATION and EXPERIENCE
              - text: Pursuing a Bachelor's degree in Architecture, Engineering, Construction Management, business or equivalent from appropriate 4-year college program.
              - strong [ref=f388e88]: CERTIFICATES and/or LICENSES
              - text: None
              - strong [ref=f388e89]: COMMUNICATION SKILLS
              - text: Excellent written and verbal communication skills. Strong organizational and analytical skills. Ability to provide efficient, timely, reliable and courteous service to customers. Ability to effectively present information and influence audiences and outcomes. Ability to effectively negotiate and problem solve with contractors, designers and municipal officials.
              - strong [ref=f388e90]: FINANCIAL KNOWLEDGE
              - text: Requires knowledge of financial and construction terms and principles.
              - strong [ref=f388e91]: REASONING ABILITY
              - text: Ability to comprehend, analyze, and interpret complex documents, including construction plans and engineering drawings. Ability to solve problems involving several options in situations. Requires advanced analytical and quantitative skills.
              - strong [ref=f388e92]: SCOPE OF RESPONSIBILITY
              - text: "Decisions made with thorough understanding of contracts, procedures, company policies, and business practices to achieve general results and deadlines. #INDSJCBRE carefully considers multiple factors to determine compensation, including a candidate's education, training, and experience. The minimum salary for the position is $27,040 annually and the maximum salary for the position is $54,080 annually. The compensation that is offered to a successful candidate will depend on the candidate's skills, qualifications, and experience. Successful candidates will also be eligible for a discretionary bonus based on CBRE's applicable benefit program. CBRE is an equal opportunity/affirmative action employer with a long-standing commitment to providing equal employment opportunity to all qualified applicants regardless of race, color, religion, national origin, sex, sexual orientation, gender identity, pregnancy, age, citizenship, marital status, disability, veteran status, political belief, or any other basis protected by applicable law. NOTE: Some, but not all, of our positions may have an additional requirement to comply with COVID-19 health and safety protocols, including COVID-19 vaccination proof and/or rigorous testing. If you have questions about the requirement(s) for this position, please inform your Recruiter.Trammell CrowWhen you're a part of Trammell Crow Company, a global commercial real estate development company, you're a part of a team that brings local ingenuity and global vision to everything we build. From Labs in Boston to Logistics in Prague to homes in Houston, we transform spaces into places, changing the way people and places connect. With the spirit of entrepreneurship, innovation, and collaboration at our core, our people are committed to upholding our RISE (Respect, Integrity, Service, Excellence) Values. This drives our mission for a diverse, equitable, and inclusive workplace so business and communities thrive. Trammell Crow Company's performance is fueled by our most powerful asset-our people. Comprised of teams possessing passion, innovation, and a visible culture of excellence, we welcome talent with diverse backgrounds and experiences across industries to apply for open positions. Find out more"
