      - main [ref=f116e60]:
        - article [ref=f116e61]:
          - heading "VC Internship @ DBL Partners in San Francisco, CA" [level=1] [ref=f116e64]
          - generic [ref=f116e66]:
            - paragraph [ref=f116e67]:
              - emphasis [ref=f116e68]:
                - text: "DBL Partners is a double bottom line venture capital firm and pioneer of the impact investing category in venture capital. With over $600M in assets under management, we invest in companies that can deliver both top-tier venture capital returns and enable social, environmental, and economic benefits. DBL has been investing for over a decade and a half with the belief that a company’s financial performance (The First Bottom Line) and positive social impact (The Second Bottom Line) not only complement each other but enhance each other to drive performance and success. To that end, DBL has helped usher in a number of first IPOs in the sustainability category, including the first IPO in the electric vehicle (EV) sector (Tesla), the first IPO in rooftop solar (SolarCity), and the first circular economy IPO (The RealReal). Today, we invest in and work with some of the best entrepreneurs, solving some of the most pressing problems in clean energy, conservation and resource optimization, agriculture and food, the space/earth nexus, transportation and mobility, and the future of work. Our portfolio includes leading companies like Tesla, SolarCity, Revolution Foods, Farmers Business Network, The RealReal, Mapbox, SpaceX, Andela, and others. More information can be found at:"
                - link "http://www.dblpartners.vc" [ref=f116e69] [cursor=pointer]:
                  - /url: http://www.dblpartners.vc/
            - paragraph [ref=f116e70]:
              - emphasis [ref=f116e71]: "ROLE DESCRIPTION:"
            - paragraph [ref=f116e72]:
              - emphasis [ref=f116e73]: "The Summer Associate will work closely with senior investment team members and will gain significant deal evaluation and execution experience. The Summer Associate role is an invaluable opportunity to learn about impact investing and the venture capital business while embedded in a team of experienced investors and seasoned operators. The role is both great exposure – and significant responsibility. Typical responsibilities include:"
            - list [ref=f116e74]:
              - listitem [ref=f116e75]:
                - emphasis [ref=f116e76]: Guiding, performing, and synthesizing detailed due diligence of potential investments, including management, market, product, competition, financial, legal, and technology
              - listitem [ref=f116e77]:
                - emphasis [ref=f116e78]: Helping to manage the firm’s internal new deal review process
              - listitem [ref=f116e79]:
                - emphasis [ref=f116e80]: Assisting with the annual quantitative and qualitative reporting on the portfolio, potentially including the annual LP meeting
              - listitem [ref=f116e81]:
                - emphasis [ref=f116e82]: Writing internal market research reports, deal summaries, and investment memoranda
              - listitem [ref=f116e83]:
                - emphasis [ref=f116e84]:
                  - text: "Collaborating with team members to research, write, and publish a White Paper on a relevant industry issue. Examples of previous reports can be found at:"
                  - link "http://www.dblpartners.vc/resources-reports/" [ref=f116e85] [cursor=pointer]:
                    - /url: http://www.dblpartners.vc/resources-reports/
            - paragraph [ref=f116e86]
            - paragraph [ref=f116e87]:
              - emphasis [ref=f116e88]: "QUALIFICATIONS:"
            - paragraph [ref=f116e89]:
              - emphasis [ref=f116e90]: "The ideal candidate will have:"
            - list [ref=f116e91]:
              - listitem [ref=f116e92]:
                - emphasis [ref=f116e93]: Have a passion for impact investing and sustainability
              - listitem [ref=f116e94]:
                - emphasis [ref=f116e95]: Strong interpersonal skills and an ability to fit into a small but diverse team
              - listitem [ref=f116e96]:
                - emphasis [ref=f116e97]: Service and detail oriented, and enjoy supporting others.
              - listitem [ref=f116e98]:
                - emphasis [ref=f116e99]: Several years of work experience that translates into understanding business models, relevant technologies, or impact investing. Ideally this is in a related field (VC/PE, startup, product management, investment banking, corporate development, strategy consulting, etc.) with an emphasis on sustainability.
              - listitem [ref=f116e100]:
                - emphasis [ref=f116e101]: Strong analytical and writing skills
              - listitem [ref=f116e102]:
                - emphasis [ref=f116e103]: Intellectual curiosity and appetite for rigorous research
              - listitem [ref=f116e104]:
                - emphasis [ref=f116e105]: High level of self-motivation, creativity, and comfort with lack of structure.
              - listitem [ref=f116e106]:
                - emphasis [ref=f116e107]: Bachelor’s or Master’s degree (The summer associate role is targeted at current Master’s degree students)
            - paragraph [ref=f116e108]:
              - emphasis [ref=f116e109]
            - paragraph [ref=f116e110]:
              - emphasis [ref=f116e111]: "ADDITIONAL INFORMATION:"
            - list [ref=f116e112]:
              - listitem [ref=f116e113]:
                - emphasis [ref=f116e114]: "Start Date: Preference shown to candidates able to start in May 2020. The internship lasts 12 weeks."
              - listitem [ref=f116e115]:
                - emphasis [ref=f116e116]: "Compensation: This is a paid internship at market rate."
              - listitem [ref=f116e117]:
                - emphasis [ref=f116e118]: "Location: We have two offices: one in San Francisco and one in Palo Alto. There will be frequent meetings in each location"
            - paragraph [ref=f116e119]:
              - emphasis [ref=f116e120]: "To apply: Please send a cover email (not letter) expressing why you are interested in DBL and the role, along with your resume and LinkedIn to recruiting@dblpartners.vc"
            - paragraph [ref=f116e121]:
              - link [ref=f116e122] [cursor=pointer]:
                - /url: https://www.indeed.com/viewjob?jk=09bffbf50e4a2920&tk=1dh2kp4a0hogi802&from=serp&vjs=3
