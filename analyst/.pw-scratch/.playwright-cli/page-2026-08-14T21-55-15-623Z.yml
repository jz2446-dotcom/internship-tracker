        - generic [ref=f542e42]:
          - generic [ref=f542e43]: Vista Consulting Group
          - heading "Director, Enterprise AI Platform Architect" [level=1] [ref=f542e44]
          - generic [ref=f542e45]:
            - generic [ref=f542e46]:
              - generic [ref=f542e47]: Level
              - generic [ref=f542e48]: Full Time
            - generic [ref=f542e49]:
              - generic [ref=f542e50]: Location
              - generic [ref=f542e51]: Remote, US
            - generic [ref=f542e52]:
              - generic [ref=f542e53]: Function
              - generic [ref=f542e54]: Value Creation
          - link "Apply" [ref=f542e55] [cursor=pointer]:
            - /url: https://careers2-vistaequitypartners.icims.com/jobs/2970/director%2c-enterprise-ai-platform-architect/job
          - separator [ref=f542e60]
          - heading "Summary" [level=2] [ref=f542e61]
          - generic [ref=f542e62]:
            - paragraph [ref=f542e63]: Vista Equity Partners is seeking a hands-on Enterprise AI Platform Architect to drive AI innovation across our 90+ portfolio companies. This role sits at the center of Vista’s Agentic Factory, our methodology for collaborating with portfolio companies to identify high-value agentic use cases and rapidly build production AI agents that deliver measurable business impact.
            - paragraph [ref=f542e64]: The ideal candidate combines deep technical expertise in generative AI, agents, and agentic architectures with the ability to move fast, shipping MVPs in compressed timelines and designing platforms that perform reliably in enterprise environments. You will work directly with portfolio company technology teams to design, implement, and scale AI solutions that enhance product offerings and drive competitive advantage.
            - paragraph [ref=f542e65]: This is a deep technical role regarding hands-on work alongside the portfolio engineering teams.
          - heading "Responsibilities" [level=2] [ref=f542e66]
          - generic [ref=f542e67]:
            - paragraph [ref=f542e68]: Portfolio Company Collaboration & Agentic Delivery
            - list [ref=f542e69]:
              - listitem [ref=f542e70]: Partner with portfolio company technology and product teams to identify and prioritize agentic AI use cases aligned with their product roadmaps and business objectives.
              - listitem [ref=f542e71]: Lead end-to-end delivery of AI agent implementations using Vista’s Agentic Factory methodology, targeting MVP delivery in under a quarter.
              - listitem [ref=f542e72]: Run rapid proof-of-value sprints that demonstrate measurable business impact, then guide portfolio companies from prototype through production deployment.
              - listitem [ref=f542e73]: Lead AI maturity assessments across the portfolio using Vista’s scoring rubrics, identifying gaps and creating tailored improvement roadmaps.
              - listitem [ref=f542e74]: Conduct architectural reviews and provide recommendations for optimizing AI platform performance, scalability, and security.
            - paragraph [ref=f542e75]: AI Platform Architecture & Design
            - list [ref=f542e76]:
              - listitem [ref=f542e77]: Design scalable, resilient, and secure AI platforms leveraging public cloud AI services (AWS, Azure, GCP) while maintaining vendor independence through thoughtful abstraction layers.
              - listitem [ref=f542e78]: Develop and maintain reference architectures for AI applications, including generative AI models, agentic systems, and multi-agent collaboration patterns.
              - listitem [ref=f542e79]: Design appropriate autonomy levels for enterprise agent deployments, incorporating human-in-the-loop checkpoints calibrated to risk, regulatory requirements, and domain complexity.
              - listitem [ref=f542e80]: Define standards for AI model development, deployment, monitoring, and governance, including data privacy, model provenance, and audit trails for agent decision-making.
            - paragraph [ref=f542e81]: AI Innovation & Strategy
            - list [ref=f542e82]:
              - listitem [ref=f542e83]: Serve as a subject matter expert on generative AI, agents, and agentic architectures, providing thought leadership and strategic guidance to portfolio companies and Vista leadership.
              - listitem [ref=f542e84]: Identify and evaluate emerging AI technologies and trends, assessing their potential impact on portfolio company product roadmaps and Vista’s investment thesis.
              - listitem [ref=f542e85]: Develop and evangelize best practices for AI platform design, development, and deployment across the portfolio.
            - paragraph [ref=f542e86]: Due Diligence
            - list [ref=f542e87]:
              - listitem [ref=f542e88]: Assist in the due diligence process for potential portfolio companies, assessing AI technology capabilities, technical debt, and readiness for agentic AI adoption.
              - listitem [ref=f542e89]: Provide technical assessments that inform investment decisions and post-acquisition value creation plans.
            - paragraph [ref=f542e90]: Technical Expertise
            - list [ref=f542e91]:
              - listitem [ref=f542e92]: Generative AI including LLMs, diffusion models, and RAG architectures
              - listitem [ref=f542e93]: Agentic architectures, autonomous agents, and multi-agent systems
              - listitem [ref=f542e94]: Cloud AI platforms across AWS, Azure, and GCP
              - listitem [ref=f542e95]: AI model development, deployment, and lifecycle management
              - listitem [ref=f542e96]: Prompt engineering and model fine-tuning
              - listitem [ref=f542e97]: Machine learning and deep learning fundamentals
              - listitem [ref=f542e98]: Platform abstraction and vendor-independent architecture design
            - paragraph [ref=f542e99]: Operational Expertise
            - list [ref=f542e100]:
              - listitem [ref=f542e101]: Rapid proof-of-value delivery and compressed development timelines
              - listitem [ref=f542e102]: Cross-organizational collaboration and stakeholder management across multiple companies simultaneously
              - listitem [ref=f542e103]: AI maturity assessment and improvement planning
              - listitem [ref=f542e104]: Translating complex technical concepts for executive audiences
              - listitem [ref=f542e105]: Problem-solving and analytical thinking in ambiguous environments
          - heading "Qualifications" [level=2] [ref=f542e106]
          - generic [ref=f542e107]:
            - list [ref=f542e108]:
              - listitem [ref=f542e109]: Bachelor’s or Master’s degree in Computer Science, Artificial Intelligence, or a related field.
              - listitem [ref=f542e110]: 3+ years ofexperience in AI/ML platform architecture and development, with deep recent experience (2+ years) in generative AI and agentic architectures in production applications.
              - listitem [ref=f542e111]: Demonstrated track record of shipping AI applications to production environments, not just prototypes.
              - listitem [ref=f542e112]: Strong understanding of public cloud AI services and the ability to architect vendor-agnostic solutions with appropriate abstraction layers.
              - listitem [ref=f542e113]: Excellent communication, presentation, and interpersonal skills.
              - listitem [ref=f542e114]: Experience within private equity portfolio companies, consulting, or multi-client environments is a strong plus.
            - paragraph [ref=f542e115]: The annualized base pay range for this role is expected to be between $200,000 - $315,000. Actual base pay could vary based on factors including but not limited to experience, subject matter expertise, geographic location where work will be performed and the applicant’s skill set. The base pay is just one component of the total compensation package for employees. Other components may include an annual cash bonus and a comprehensive benefits package.
