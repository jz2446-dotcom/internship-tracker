        - paragraph [ref=f11e391]:
          - generic [ref=f11e392]: Learn about the programs available to all Target team members upon starting, at no cost.
      - generic [ref=f11e393]:
        - generic [ref=f11e398]:
          - heading "Market-leading pay" [level=3] [ref=f11e399]
          - generic [ref=f11e400]: Target puts people first. That’s why Target is a proud pay leader in retail and highly competitive with other large companies, providing equitable and competitive pay for all.
        - generic [ref=f11e405]:
          - heading "Quick pay access" [level=3] [ref=f11e406]
          - generic [ref=f11e407]: Enjoy more control over your pay schedule with DailyPay, a pay advance app that allows eligible team members to choose when to receive earned but unpaid wages and help build savings.
    - generic [ref=f11e410]:
      - generic [ref=f11e415]:
        - heading "Virtual care" [level=3] [ref=f11e416]
        - generic [ref=f11e417]: Virtual care, no cost. CirrusMD is a text-based virtual care platform that gives team members 24/7 access to a real doctor, at their fingertips.
      - generic [ref=f11e422]:
        - heading "Mental health resources" [level=3] [ref=f11e423]
        - generic [ref=f11e424]: Peace of mind starts with mental health. All team members and their families get free and confidential access 24/7 to mental health experts through Spring Health.
