        - generic:
          - generic:
            - img "a group of people in safety vests looking at a computer"
      - article [ref=f11e355]:
        - blockquote [ref=f11e360]:
          - paragraph [ref=f11e362]: Target has supported my growth every step of the way between mentorships, tuition assistance, and hands on learning opportunities. There's always something new to explore. I've been with Target for 5 years and in 3 different roles, which is something I'm very proud of. With every step I take, I feel more ready and confident for the next challenge and that's the kind of culture that truly sets us up for success. What I love the most is that it's not just about the job; it's about discovering who we are and where we want to grow next. Target gives us that chance to explore, try new things, and keep learning until we land where we truly belong.
          - generic [ref=f11e363]:
            - generic [ref=f11e364]: Doris
            - generic [ref=f11e365]: HR Business Partner, Supply Chain
          - link "More about growth" [ref=f11e366] [cursor=pointer]:
            - /url: /careers/growth-and-development
    - article [ref=f11e371]:
      - blockquote [ref=f11e376]:
        - paragraph [ref=f11e378]: The Target Team has been nothing but supportive and encouraging to me since the day I first joined. I feel energized every day by the culture here and the opportunity to work with such smart, creative, and talented folks. At Target, I get to channel my passions into work that is exciting and rewarding.
        - generic [ref=f11e379]:
          - generic [ref=f11e380]: Sabina
          - generic [ref=f11e381]: Sr. Marketing Manager, Corporate
        - link "More about culture" [ref=f11e382] [cursor=pointer]:
          - /url: /careers/culture
