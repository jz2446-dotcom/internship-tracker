                - generic [ref=f110e129]:
                  - generic [ref=f110e130]:
                    - paragraph [ref=f110e131]:
                      - strong [ref=f110e132]: "The Firm:"
                      - link "Congruent Ventures" [ref=f110e133] [cursor=pointer]:
                        - /url: https://www.congruentvc.com/
                      - text: "is a leading early stage venture firm that invests against global macro trends in sustainability and climate tech across four themes:"
                      - link "Mobility and Urbanization" [ref=f110e134] [cursor=pointer]:
                        - /url: https://www.congruentvc.com/portfolio/#mobility-and-urbanization
                      - text: ", the"
                      - link "Energy Transition" [ref=f110e135] [cursor=pointer]:
                        - /url: https://www.congruentvc.com/portfolio/#energy-transition
                      - text: ","
                      - link "Food and Agriculture" [ref=f110e136] [cursor=pointer]:
                        - /url: https://www.congruentvc.com/portfolio/#food-and-agriculture
                      - text: ", and"
                      - link "Sustainable Production and Consumption" [ref=f110e137] [cursor=pointer]:
                        - /url: https://www.congruentvc.com/portfolio/
                      - text: . Founded in 2017, Congruent has invested in nearly 60 companies from pre-to Series A-stage companies. Investing out of its third flagship fund and first continuity growth fund, the firm has ~$1B AUM. Congruent’s team is 12 strong and is based in downtown San Francisco and invests across North America.
                    - paragraph [ref=f110e138]:
                      - strong [ref=f110e139]: "The Candidate:"
                      - text: We are seeking an intellectually curious, versatile, and driven self-starter who is passionate about using innovation and capital to address climate change and sustainability challenges. This position is expected to be on an investment partner track, assuming success. While we operate and invest as a team, we expect the investor to have the capabilities to source and execute investment deals independently and subsequently lead portfolio company development, serving as board member or observer when applicable.
                    - paragraph [ref=f110e140]: The Congruent team is small, nimble, and collaborative. We do not tolerate jerks, nor do we tolerate interpersonal politicking; we value diversity of opinion, background, and experience. We value respectful but knowledge-based discussions and believe the best investment decisions are made when opinions differ, but the facts have been thoughtfully discussed by the investment team and considered without deferring exclusively to position. Everyone has a voice and should not be reticent to use it.
                    - paragraph [ref=f110e141]:
                      - strong [ref=f110e142]: "Qualifications and Skills:"
                  - list "rich text unordered list" [ref=f110e143]:
                    - listitem [ref=f110e144]: 4-7+ years of work experience in operating or investment roles
                    - listitem [ref=f110e145]: Experience directly supporting investment diligence and processes in VC or PE environments and a reputation for working collaboratively with founding teams or regularly interacting with senior executives if in operating roles.
                    - listitem [ref=f110e146]: Passion and intellectual curiosity for climate change, sustainability, and venture capital. Enthusiasm for supporting founders, teams, and internal collaboration with a high confidence, but a low ego personality.
                    - listitem [ref=f110e147]: Strong research, analytical, and due diligence skills.
                    - listitem [ref=f110e148]: Bachelor’s Degree (technical subject preferred), with the intellectual curiosity and academic history to evaluate technical innovation spanning machine vision to mechanical engineering to agriculture to supply chain logistics. MBA or Graduate Degree is a positive but not required.
                    - listitem [ref=f110e149]: Outstanding work ethic. Self-starter with the ability to manage multiple projects.
                    - listitem [ref=f110e150]: Based in the Bay Area with 3 days in-office. Congruent operates with a hybrid, but vibrant in-person culture.
                  - paragraph [ref=f110e152]:
                    - strong [ref=f110e153]: "Job Description:"
                    - text: "Congruent Ventures is looking to bring on an investor to support all aspects of Congruent’s investment work. On average, Congruent invests in eight new companies per year, and will be expanding the team in the coming months as we build our SF-based team. As a member of the investment deal team, you will work closely with our Managing Partners and full deal team across all facets of the investment process. Job responsibilities include:"
                  - list "rich text unordered list" [ref=f110e154]:
                    - listitem [ref=f110e155]: Source new investments, develop new relationships, and participate in networking events representing Congruent
                    - listitem [ref=f110e156]: Drive deal due diligence by conducting market research, competitive analyses, reference calls, and relevant financial modeling and cap table analyses
                    - listitem [ref=f110e157]: Support deal teams, track deal processes, generate deal materials, and support diligence efforts throughout the entire deal lifecycle.
                    - listitem [ref=f110e158]: Work with lead partners on portfolio companies post-investment, providing input to Congruent and startup teams.
                    - listitem [ref=f110e159]: Write investment memos and sector theses
                    - listitem [ref=f110e160]: Identify and explore investment themes and target investment areas
                    - listitem [ref=f110e161]: Contribute to overall business development and help position Congruent as a market thought leader through content creation and event participation
                    - listitem [ref=f110e162]: Selflessly act as a Congruent brand ambassador to the ecosystem while maintaining our company-first mentality.
                  - generic [ref=f110e163]:
                    - paragraph [ref=f110e164]:
                      - strong [ref=f110e165]: "Location:"
                      - text: San Francisco, CA. Congruent maintains an in-person hybrid schedule with ~3 days per week in-office in downtown San Francisco when not traveling.
                    - paragraph [ref=f110e166]:
                      - strong [ref=f110e167]: "Note: We know the venture market is interconnected. All submissions will be treated confidentially."
