    - heading "Valued for Who You Are" [level=3] [ref=f626e163]
    - paragraph [ref=f626e164]: We believe DEI is a key component to delivering on our mission. We are intentional about increasing access and development opportunities for diverse talent in clean energy. Our values and shared commitment to DEI strengthen our workplace, community and business outcomes. We are proud to be Bronze certified through the Solar Energy Industries Association’s (SEIA) Diversity Equity Inclusion and Justice (DEIJ) certification program.
