          - text: or call 832-393-6148. If you need special services or accommodations, call 832-393-6148. (TTY 7-1-1) If you need login assistance or technical support call 855-524-5627. Due to the high volume of applications received, the Hiring Department will contact you directly, should you be selected to advance in our recruitment process. All new and rehires must pass a pre-employment drug test and are subject to a physical examination and verification of information provided.
