          - strong [ref=f573e75]: GENERAL INFORMATION
          - text: Thanks for your interest in the Hire Houston Youth Summer Jobs Program, which will run from June 12 – August 3, 2023. Interns will work 32 hours per week and earn $10 per hour. This program provides an excellent opportunity for you to earn and learn by becoming a member of the team that takes care of the residents of the nation’s 4th largest city.Note - Successful candidates will be required to pass a background check.
          - strong [ref=f573e76]: GENERAL DESCRIPTION
          - text: The Houston Public Library offers a wide variety of intern positions at various locations throughout Houston. Positions include Collection Assistants, Program Assistants, Technology Assistants, and Delivery Assistance. Most involve administrative duties, customer service, assisting with displays or program events, or helping to maintain the collection.
          - strong [ref=f573e77]: Note – Communications related internships with the Library are listed on the Communications Intern posting.
          - strong [ref=f573e78]: INTERNSHIP LOCATIONS
          - text: "**Complete the Supplemental Questionnaire to select a position and work site."
          - strong [ref=f573e79]: You will be given the option to opt into receiving text messages at the time of application. Considered applicants will receive text messages of the next stage of the application and hiring process.
          - strong [ref=f573e80]: WORKING CONDITIONS
          - text: The position is physically comfortable, the individual has discretion about walking, standing, etc. Some positions require working outside in varied weather conditions, and the ability to use certain tools. There are no major sources of discomfort, i.e., essentially normal office environment with acceptable lighting, temperature and air conditions. Some positions are outdoors and require the ability to function in warm/hot weather conditions.
      - term [ref=f573e81]:
        - heading "MINIMUM REQUIREMENTS" [level=2] [ref=f573e82]
      - definition [ref=f573e83]:
        - paragraph [ref=f573e84]:
          - strong [ref=f573e85]: EDUCATIONAL REQUIREMENTS
          - text: "Ability to read, write, add, subtract and follow oral and basic written instructions. May have a basic knowledge of grammar, spelling and punctuation. May require a basic knowledge of a particular subject area. (Individuals may be high school students.) Must be 16 years of age or older. Age Requirement: 16 -24"
          - strong [ref=f573e86]: EXPERIENCE REQUIREMENTS
          - text: No experience required.
          - strong [ref=f573e87]: LICENSE REQUIREMENTS
          - text: None
