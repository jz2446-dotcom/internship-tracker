              - heading "An Equal Opportunity Employer" [level=2] [ref=f703e172]
              - paragraph [ref=f703e173]:
                - text: Fannie Mae is an
                - link "equal opportunity employer" [ref=f703e174] [cursor=pointer]:
                  - /url: /media/document/pdf/eeo-requirementspdf
                - text: and considers qualified applicants for employment without regard to race, color, religion, sex, national origin, disability, age, sexual orientation, gender identity/gender expression, marital or parental status, or any other protected factor. Fannie Mae is committed to providing reasonable accommodations to qualified individuals with disabilities who are employees or applicants for employment, unless to do so would cause undue hardship to the company. If you need assistance using our online system and/or you need a reasonable accommodation related to the hiring/application process, please complete this
                - link "form" [ref=f703e175] [cursor=pointer]:
                  - /url: /form/main-contact-form?recipient=careers_mailbox
                - text: .
              - paragraph [ref=f703e176]:
                - strong [ref=f703e177]: "ARTIFICIAL INTELLIGENCE DISCLOSURE:"
                - text: Fannie Mae uses Workday artificial intelligence (AI) for skills identification and matching and other application management purposes. Fannie Mae does not rely on AI to make or as a substantial factor in making employment decisions. If you do not want Fannie Mae to use this tool with your application, do not complete the “skills” section of the application. For individuals with disabilities who would like to request an accommodation in the application process,
                - link "email" [ref=f703e178] [cursor=pointer]:
                  - /url: /form/main-contact-form?recipient=careers_mailbox
                - text: us.
              - paragraph [ref=f703e179]:
                - strong [ref=f703e180]: "RECRUITMENT FRAUD ALERT:"
                - text: Please be aware of recruitment scams that may involve offering fictious job opportunities, requesting personal information, or demanding payments during the recruitment process. All open positions are located on Fannie Mae’s careers site and are based in the United States. Official Fannie Mae email addresses end with @fanniemae.com. Fannie Mae conducts video interviews, but will not interview using online chats or instant messaging. Fannie Mae will not ask for a financial commitment from candidates during the recruiting interview process. Please contact us via
                - link "e-mail" [ref=f703e181] [cursor=pointer]:
                  - /url: /form/main-contact-form?recipient=careers_mailbox
                - text: if you are concerned you have been offered employment with Fannie Mae that might be a scam or contacted for a job by an individual who does not represent or work at Fannie Mae.
              - paragraph [ref=f703e182]:
                - strong [ref=f703e183]:
                  - text: California residents, under the California Consumer Privacy Act (“CCPA”), Fannie Mae is required to inform any California resident who is our job applicant about the categories of “personal information” we collect about you and the purposes for which we will use this information. To read the full notice,
