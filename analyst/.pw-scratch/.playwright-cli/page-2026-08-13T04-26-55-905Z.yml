                  - listitem [ref=f703e81]: Students give the real deal about our career-shaping internships
              - generic [ref=f703e83]:
                - generic [ref=f703e85]:
                  - heading "Students give the real deal about our career-shaping internships" [level=1] [ref=f703e87]
                  - generic [ref=f703e90]:
                    - generic [ref=f703e91]: April 17, 2025
                    - paragraph [ref=f703e92]: Each summer at Fannie Mae, interns represent colleges and universities across the U.S. and hold positions in technology, modeling and analytics, finance, and business. Check out some of their experiences below.
                    - paragraph [ref=f703e93]:
                      - strong [ref=f703e94]: A day in the life — internships that feel like rewarding jobs
                    - paragraph [ref=f703e95]: Our supportive culture means that managers and colleagues provide ways to build connections with your teammates as well as leaders throughout the enterprise.
                    - paragraph:
                      - img "Isabella" [ref=f703e96]
                    - paragraph [ref=f703e97]: As Isabella, an internal audit IT intern, put it, “What I like about the culture here at Fannie Mae is that I feel like I’m part of something bigger. I feel included in everything. I have meetings with higher-ups in the department, so I feel like they recognize me. And what I’m working on is contributing to something bigger.”
                    - paragraph [ref=f703e98]:
                      - strong [ref=f703e99]: Growth opportunities galore
                    - paragraph [ref=f703e100]: The Summer Program at Fannie Mae offers tons of opportunities to gain new skills and to use what you already know to take on real-world business challenges and projects.
                    - paragraph:
                      - img "Rachel" [ref=f703e101]
                    - paragraph [ref=f703e102]: Rachel, a technology intern, was happy to say, “I’ve been able to incorporate skills I learned at school and bring them into my current position. Also, I’ve learned a lot of technical skills — lots of different technological knowledge within controls testing that I will be able to bring back to school.”
                    - paragraph:
                      - img "Craig" [ref=f703e103]
                    - paragraph [ref=f703e104]: Cybersecurity major and information security intern Craig added, “This internship has helped me learn a lot of the different tools and software that will be used in the future, like JIRA, Confluence, and Trello as well as some programming skills with Python and Java. This experience will help me not only do better in school but also set me up for a great future in cybersecurity.”
                    - paragraph [ref=f703e105]:
                      - strong [ref=f703e106]: Compensation and perks — yes, for interns!
                    - paragraph [ref=f703e107]: Our interns are delighted with some of the unexpected perks. Our exciting leadership speaker series and free access to certificate-level training, including Fannie Mae University courses, LinkedIn training, and skills training help students learn and apply skills beyond the classroom.
                    - paragraph:
                      - img "Aditya" [ref=f703e108]
                    - paragraph [ref=f703e109]: “With the perks that are provided when working here, you can really strike a pleasant and productive work-life balance,” chimed in Aditya, a software engineer intern on the Salesforce Single-Family team. Rachel adds, “Being an intern here at Fannie Mae, I’m very lucky to be very nicely compensated. It is a paid internship. And I’ve also got access to benefits like a 401(k) match.”
                    - paragraph [ref=f703e110]:
                      - strong [ref=f703e111]: A great career start while making a positive impact
                    - paragraph [ref=f703e112]: Our interns rightly leave with a sense of pride and accomplishment because their work, and all we do at Fannie Mae, supports our mission and positively impacts millions of people across the country. It’s probably why so many return after college as full-time employees.
                    - paragraph:
                      - img "Mia" [ref=f703e113]
                    - paragraph [ref=f703e114]: As Mia, an intern on Multifamily’s Data and Reporting team, learned, “The work I do ties back to Fannie Mae’s mission. But on a much deeper level, there are so many layers to Fannie Mae. Overall, the drive for efficiency, fixing problems, and developing new solutions is in pursuit of housing for everybody.”
                    - paragraph [ref=f703e115]:
                      - strong [ref=f703e116]: A “best-decision” kind of experience
                    - paragraph:
                      - img "Amber" [ref=f703e117]
                    - paragraph [ref=f703e118]: “Interning at Fannie Mae has been one of the best decisions I’ve ever made. It’s really changed my career and my path. I feel very lucky to have the opportunity to work here,” concludes Amber, a technology intern in the Multifamily Securitization Department.
                    - paragraph [ref=f703e119]:
                      - strong [ref=f703e120]: Sound like your kind of career-shaping internship?
                      - link [ref=f703e121] [cursor=pointer]:
                        - /url: /careers/campus
                        - strong [ref=f703e122]: Learn more about our 2025 internships and award-winning program
                      - strong [ref=f703e123]: .
