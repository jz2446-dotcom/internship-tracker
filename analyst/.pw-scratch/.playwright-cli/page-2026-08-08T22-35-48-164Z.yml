                - paragraph [ref=f88e66]:
                  - generic [ref=f88e67]: Welcome to the George W. Bush Presidential Center Career Site
                - generic [ref=f88e70]: Thank you for your interest in the George W. Bush Presidential Center. Our staff works to advance the vision President and Mrs. Bush have cast for their continuing public service. The George W. Bush Presidential Center celebrates the goodness of our nation and pursues with optimism the timeless values of freedom, opportunity, accountability, and compassion.
                - generic [ref=f88e74]: Located on the SMU campus in Dallas, Texas, the George W. Bush Presidential Center is a nonpartisan institution advancing the timeless values of freedom, opportunity, accountability, and compassion. The Bush Center comprises the George W. Bush Presidential Museum and the George W. Bush Institute, a solution-oriented policy organization focused on ensuring opportunity for all, strengthening democracy, and advancing free societies through policy solutions and public engagement. The Bush Center also houses the George W. Bush Presidential Library, operated by the National Archives and Records Administration, which provides access to official documents and artifacts from the George W. Bush Administration.
                - generic [ref=f88e76]: The George W. Bush Institute is a solution-oriented nonpartisan policy organization focused on ensuring opportunity for all, strengthening democracy, and advancing free societies. Housed within the George W. Bush Presidential Center, the Bush Institute is rooted in compassionate conservative values and committed to creating positive, meaningful, and lasting change at home and abroad. We utilize our unique platform and convening power to advance solutions to national and global issues of the day.
                - generic [ref=f88e79]:
