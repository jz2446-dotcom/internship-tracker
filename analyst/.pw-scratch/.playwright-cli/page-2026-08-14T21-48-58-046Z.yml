                - generic [ref=f335e231]:
                  - strong [ref=f335e237]: Medical Care and Insurance
                  - generic [ref=f335e238]: We provide a range of medical plans that cover you and your dependents. You can also take advantage of our employee and family life insurance, accidental death and dismemberment coverage.
              - listitem [ref=f335e243]:
                - generic [ref=f335e248]:
                  - strong [ref=f335e253]: Well-Being Programs
                  - generic [ref=f335e254]: State Street's BeWell helps employees proactively manage their well-being. Our Employee Assistance Program (EAP) provides personal and confidential assistance for a broad range of issues.
              - listitem [ref=f335e258]:
                - generic [ref=f335e263]:
                  - strong [ref=f335e268]: Financial Well-Being
                  - generic [ref=f335e269]: Depending on where you work, you will be eligible for regionally specific savings and/or retirement plans. We also provide resources and host local events to educate employees on achieving financial well-being.
              - listitem [ref=f335e274]:
                - generic [ref=f335e279]:
                  - strong [ref=f335e284]: Holidays and Time Off
                  - generic [ref=f335e285]: We provide our employees with a highly competitive holiday and paid vacation allowance, with considerations for local requirements. We also offer our employees two paid days off to volunteer their time to company-driven initiatives or organizations of their choice.
              - listitem [ref=f335e289]:
                - generic [ref=f335e294]:
                  - strong [ref=f335e299]: Supporting Families
                  - generic [ref=f335e300]: We are committed to supporting all employees and the ones they care about. Some of our programs include paid parental leaves, back-to-work support, adoption assistance or flex work arrangements.
              - listitem [ref=f335e304]:
                - generic [ref=f335e309]:
                  - strong [ref=f335e314]: Other Benefits
                  - generic [ref=f335e315]: Among others benefits, you may have access to group savings, discounts at sport clubs and cinemas, and our new employee referral bonus program.
