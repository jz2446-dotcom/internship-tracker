            - generic [ref=f335e119]:
              - heading "Wer wir sind" [level=2] [ref=f335e120]
              - paragraph [ref=f335e121]: Die State Street Corporation, gegründet im Jahr 1792 und an der New Yorker Börse gelistet, ist eine der weltweit führenden Spezialisten im Bereich der Dienstleistungen für institutionelle Investoren. Mit ca. 40.000 Mitarbeitern ist State Street weltweit in über 100 Märkten tätig. Wir bieten Anlegern Finanzdienstleistungen, die das gesamte Anlagespektrum umfassen, einschließlich Investment Servicing, Investment Research und Trading sowie Investment Management. Unsere globale, kompatible front-to-back Plattform verbindet und optimiert den Investment Prozess, um bessere Leistung, Analysemöglichkeiten und Einblicke von der Erstellung eines Portfolios bis hin zur Verwahrung zu bieten.
              - paragraph [ref=f335e122]: Seit der Eröffnung unseres ersten Büros in Deutschland 1970 haben wir uns mit unserer Kenntnis des lokalen Markts und mehreren hundert erfahrenen Mitarbeitern in unseren Standorten in Frankfurt am Main, Leipzig und München fest etabliert. Uns ist es wichtig ein offenes Umfeld zu schaffen, in dem sich alle Mitarbeiter geschätzt und unterstützt fühlen. Kommen Sie zu uns und hinterlassen auch Sie Ihre Spur bei State Street.
              - heading "Wen wir suchen" [level=2] [ref=f335e123]
              - paragraph [ref=f335e124]: "Für unseren Bereich Tax Services – Investment Administration Insourcing Services (IAIS) bei der State Street Bank International GmbH in Frankfurt am Main suchen wir ab sofort Werkstudenten IAIS Tax Fund Services (m/w/d): Fokus Backoffice & Steuern in der Finanzdienstleistung. Im Bereich IAIS Tax Services bieten wir steuerliche Dienstleistungen für große deutsche und internationale Asset Manager auf einem in Deutschland marktführenden Niveau."
              - heading "Wofür Sie verantwortlich sein werden" [level=2] [ref=f335e125]
              - paragraph [ref=f335e126]: "Die Funktion des Werkstudenten IAIS Tax Fund Services (m/w/d) umfasst folgende Tätigkeiten:"
              - list [ref=f335e127]:
                - listitem [ref=f335e128]:
                  - paragraph [ref=f335e129]: bei der Erstellung und Sichtung von Steuerdokumenten unterstützen
                - listitem [ref=f335e130]:
                  - paragraph [ref=f335e131]: steuerliche Dokumente für den Versand an das Finanzamt sowie an die Anleger vorbereiten (z. B. Feststellungserklärung, Steuerliche Hinweise, Einzelsteuerbescheinigung, etc.)
                - listitem [ref=f335e132]:
                  - paragraph [ref=f335e133]: bei der Ausführung von Ausschüttungen bzw. Thesaurierung unterstützen
                - listitem [ref=f335e134]:
