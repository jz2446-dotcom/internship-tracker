              - heading "Über State Street" [level=2] [ref=f335e189]
              - heading "Was wir tun." [level=2] [ref=f335e190]
              - paragraph [ref=f335e191]: State Street ist eine der größten Depotbanken, Asset Manager und Asset Intelligence Firmen der Welt. Von Technologie zu Produktinnovation hinterlassen wir in der Finanzdienstleistungsindustrie unsere Spur. Seit mehr als zweihundert Jahren helfen wir unseren Kunden die Investitionen von Millionen von Menschen abzusichern und zu verwalten. Wir bieten Investment Servicing, Data & Analytics, Investment Research & Trading sowie Investment Management für institutionelle Kunden.
              - heading "Arbeiten, Leben, Wachsen." [level=2] [ref=f335e192]
              - paragraph [ref=f335e193]: Es ist uns sehr wichtig ein angenehmes Arbeitsumfeld zu schaffen. Unsere Zusatzleistungen sind wettbewerbsfähig und umfangreich. Die Details hängen vom jeweiligen Standort ab, aber Sie können Versicherungen, betriebliche Altersversorgung und andere Zusatzleistungen erwarten. Sie können an einem flexiblen Arbeitszeitprogramm teilnehmen, das Ihnen hilft Ihre Bedürfnisse zu erfüllen. Unsere große Auswahl an Trainingsangeboten und Weiterbildungsmöglichkeiten werden Ihnen dabei helfen Ihr volles Potenzial zu entfalten.
              - heading "Inklusion, Vielfalt und soziale Verantwortung." [level=2] [ref=f335e194]
              - paragraph [ref=f335e195]: Wir glauben, dass die unterschiedlichen Hintergründe, Erfahrungen und Perspektiven unserer Mitarbeiter einen enormen Beitrag zu einem inklusiven Umfeld leisten, in dem jeder Erfolg haben kann während er unsere Organisation und unsere Kunden unterstützt.
              - paragraph [ref=f335e196]: Wir heißen Kandidaten jeglicher Herkunft, Begabung, sexueller Orientierung, Geschlechtsidentität, Persönlichkeit sowie jeglichen Alters herzlich willkommen. Ein weiterer grundlegender Wert von State Street ist das aktive Engagement innerhalb unserer Gemeinden auf der ganzen Welt, sowohl als Partner als auch als Initiator. Sie werden die Möglichkeit für eine ausgewogene Work-Life-Balance haben inklusive bezahlter Tage für ehrenamtliche Arbeit, Programme rund um soziale Tätigkeiten und Mitarbeiternetzwerke, je nachdem was Ihnen wichtig ist. State Street ist ein Arbeitgeber, der Chancengleichheit sowie Maßnahmen zur Förderung von Minderheiten unterstützt.
              - paragraph [ref=f335e197]: Informieren Sie sich auf StateStreet.com/careers
              - heading "About State Street" [level=1] [ref=f335e198]
              - paragraph [ref=f335e200]: Across the globe, institutional investors rely on us to help them manage risk, respond to challenges, and drive performance and profitability. We keep our clients at the heart of everything we do, and smart, engaged employees are essential to our continued success.
              - paragraph [ref=f335e201]: We are committed to fostering an environment where every employee feels valued and empowered to reach their full potential. As an essential partner in our shared success, you’ll benefit from inclusive development opportunities, flexible work-life support, paid volunteer days, and vibrant employee networks that keep you connected to what matters most. Join us in shaping the future.
              - paragraph [ref=f335e202]: As an Equal Opportunity Employer, we consider all qualified applicants for all positions without regard to race, creed, color, religion, national origin, ancestry, ethnicity, age, disability, genetic information, sex, sexual orientation, gender identity or expression, citizenship, marital status, domestic partnership or civil union status, familial status, military and veteran status, and other characteristics protected by applicable law.
