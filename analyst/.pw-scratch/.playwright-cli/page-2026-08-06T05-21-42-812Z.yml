      - main [ref=f53e33]:
        - generic [ref=f53e37]:
          - heading "Internships for students in North America" [level=1] [ref=f53e39]
          - paragraph [ref=f53e42]: Our University Operations Internship Program combines leadership development and experiential learning in a summer project, to deliver real-world results for our customers. Over ten weeks, the internship is designed to turn college students into leaders, while giving them the chance to make a real impact.
        - region [ref=f53e43]:
          - heading "You’ll work with a range of teams to support your site and gain first-hand insight into the life of a fulfillment center. Learning is at the heart of these roles. Every day brings new challenges and chances for growth." [level=2] [ref=f53e47]
        - region [ref=f53e49]:
          - heading "What you'll gain" [level=2] [ref=f53e52]
          - list [ref=f53e53]:
            - listitem [ref=f53e54]:
              - heading "Ownership" [level=3] [ref=f53e55]
              - paragraph [ref=f53e56]: You’ll own your project from start to finish, and most projects wrap up toward the end of the internship. In addition, you’ll write an Amazon narrative paper and present to site leadership conveying your project results and learnings.
            - listitem [ref=f53e57]:
              - heading "Training" [level=3] [ref=f53e58]
              - paragraph [ref=f53e59]: Classroom and self-service options cover data analysis, problem solving, writing, and customer service. You can also grow your network by taking part in workshops or joining an affinity group.
            - listitem [ref=f53e60]:
              - heading "Mentorship" [level=3] [ref=f53e61]
              - paragraph [ref=f53e62]: Our interns play a valued role in Amazon’s workforce. You’ll be paired with a manager who will offer guidance on projects, give feedback, and support your career growth.
        - region [ref=f53e63]:
          - heading "Employee stories" [level=2] [ref=f53e66]
          - generic [ref=f53e67]:
