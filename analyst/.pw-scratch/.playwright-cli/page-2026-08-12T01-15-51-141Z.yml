                    - generic [ref=f251e1513]: "Welltower (NYSE: WELL) is a leading real estate investment firm and S&P 500 REIT valued over $100 billion dedicated to acquiring and managing the largest and most advanced portfolios across the United States, Canada, and the United Kingdom. We invest with leading seniors housing operators, post-acute providers, and health systems to fund the real estate and infrastructure needed to scale innovative care delivery models and improve people's wellness and overall health care experience. With 1,500+ communities, we’re driving a new era of wellness, blending healthcare, hospitality, and real estate at scale. Backed by proprietary data systems, a unique operator network, and the Welltower business system, we actively partner with operators to drive performance across our portfolio."
