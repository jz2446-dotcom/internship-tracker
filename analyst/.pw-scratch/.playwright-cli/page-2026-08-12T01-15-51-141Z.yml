                    - generic [ref=f251e1547]: The Assistant Vice President (AVP), Capital Projects is a senior execution leader responsible for driving project delivery, enforcing execution standards, and maintaining pricing discipline across a large geographic capital portfolio. This role leads the advancement of capital projects and redevelopment initiatives across all phases of the project lifecycle. The AVP operates as an owner-minded leader, ensuring projects are executed with rigor, consistency, speed, and value discipline. This is not a passive project management or reporting role. The AVP is accountable for how capital is deployed and how projects perform at both the portfolio and individual job level.
