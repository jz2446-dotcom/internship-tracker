            - heading "Career path" [level=2] [ref=f55e231]
            - paragraph [ref=f55e232]: Our people drive our business forward every day. That's why we're committed to helping you build an extraordinary career at the firm. In addition to supporting your vertical growth along corporate titles, we’ll help you expand your horizons across the firm – with opportunities to collaborate with unexpected colleagues and even take on unique assignments outside of your regular business. We also have curated Tech Career Paths for our technologists, which provide functional tech titles that work in sync with our corporate titles.
