          - heading "Benefits" [level=2] [ref=f55e300]
          - paragraph [ref=f55e301]: We care about your overall well-being and design our benefits package to support you in various aspects of your life.
          - list [ref=f55e302]:
            - listitem [ref=f55e303]:
              - heading "Financial well-being" [level=3] [ref=f55e305]
              - paragraph [ref=f55e306]: We offer resources designed to help you build a sound financial future for you and your family, like retirement savings plans and tuition reimbursement.
            - listitem [ref=f55e307]:
              - heading "Pay for performance" [level=3] [ref=f55e309]
              - paragraph [ref=f55e310]: Our pay-for-performance philosophy includes a base salary and a discretionary annual bonus.
            - listitem [ref=f55e311]:
              - heading "Physical well-being" [level=3] [ref=f55e313]
              - paragraph [ref=f55e314]: Our healthcare plans and resources help you focus on your physical health, so you and your family can feel your best.
            - listitem [ref=f55e315]:
              - heading "Emotional well-being" [level=3] [ref=f55e317]
              - paragraph [ref=f55e318]: We support our people's mental health and emotional well-being by providing access to an Employee Assistance Program and a network of Mental Health Ambassadors.
            - listitem [ref=f55e319]:
              - heading "Life management" [level=3] [ref=f55e321]
              - paragraph [ref=f55e322]: You'll be able to focus on moments that are important to you with benefits designed to support life in and outside of work with Flexible Time Off, parental leave and more.
