      - generic [ref=f55e189]:
        - heading "BlackRock Principles" [level=2] [ref=f55e190]
        - paragraph [ref=f55e191]: "We look to hire people that will embody our BlackRock Principles:"
        - list [ref=f55e204]:
          - listitem [ref=f55e205]:
            - paragraph [ref=f55e207]: We are a fiduciary to our clients.
            - paragraph [ref=f55e208]: This is the bedrock of our identity; it reflects our integrity and the unbiased advice we give our clients.
          - listitem [ref=f55e209]:
            - paragraph [ref=f55e211]: We are One BlackRock.
            - paragraph [ref=f55e212]: We work collaboratively to create the best outcomes for our clients, our firm and the communities where we operate.
          - listitem [ref=f55e213]:
            - paragraph [ref=f55e215]: We are passionate about performance.
            - paragraph [ref=f55e216]: We are relentless in innovating and finding better ways to serve our clients and improve our firm.
          - listitem [ref=f55e217]:
            - paragraph [ref=f55e219]: We take emotional ownership.
            - paragraph [ref=f55e220]: We have a deep sense of responsibility to our clients and to each other.
          - listitem [ref=f55e221]:
            - paragraph [ref=f55e223]: We are committed to a better future.
            - paragraph [ref=f55e224]: We are long-term thinkers, focused on helping people build a better tomorrow.
        - link "Back to nav" [ref=f55e225] [cursor=pointer]:
          - /url: "#nav-anchor-anchor-success-profile"
