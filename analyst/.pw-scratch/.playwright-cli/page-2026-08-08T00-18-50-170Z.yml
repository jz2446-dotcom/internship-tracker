        - heading "Career Opportunities" [level=1] [ref=e28]
        - paragraph [ref=e29]: We recognize the value we create for our clients starts with the quality of our people. We wholeheartedly look for and support ambitious, enthusiastic, diverse and intelligent individuals who can seamlessly join us in the pursuit of excellence.
      - figure [ref=e30]
    - generic [ref=e32]:
      - heading "Working at Advent" [level=3] [ref=e34]
      - paragraph [ref=e35]: Intellectually curious, disciplined and hardworking team players with unparalleled expertise in their fields and an appreciation for the dynamics of a small company are the qualities we look for in all prospective teammates. It is this type of individual who will help maintain the culture that has led to 25 years of industry-leading success.
      - paragraph [ref=e36]: Advent strives to hire from diverse backgrounds as a means of encouraging new ideas and new investment opportunities, as well as combatting groupthink. The firm directly works with a number of colleges, women-owned and diversity-focused organizations like SEO and SG Partners to help attract female and diverse candidates.
      - paragraph [ref=e37]: We believe in taking care of our people. Advent offers a suite of highly competitive benefits to all of its employees, including, among others, comprehensive medical, dental, and vision insurance plans, a competitive 401(k) plan, flexible spending accounts, health savings accounts, pre-tax saving on commuter benefits, parental leave, paid time off, and a variety of snack options onsite in our offices.
