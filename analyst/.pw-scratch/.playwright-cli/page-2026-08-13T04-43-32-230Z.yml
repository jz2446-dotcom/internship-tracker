          - text: The Nature Conservancy is a nonprofit, tax-exempt charitable organization (tax identification number 53-0242652) under Section 501(c)(3) of the U.S. Internal Revenue Code. Donations are tax-deductible as allowed by law. Global sites represent either regional branches of The Nature Conservancy or local affiliates of The Nature Conservancy that are separate entities. This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.The Nature Conservancy is an Equal Opportunity Employer. Our commitment to equal employment opportunity includes the recognition that our conservation mission is best advanced by the leadership and contributions of people of all backgrounds, beliefs and culture. Recruiting and mentoring staff to create an inclusive organization is a priority, and we encourage applicants from all cultures, races, colors, religions, sexes, national or regional origins, ages, disability status, sexual orientation, gender identity, military, protected veteran status or other status protected by law. TNC is committed to offering accommodations for qualified individuals with disabilities and disabled veterans in our job application process. If you need assistance or accommodation due to a disability, please send a note to
