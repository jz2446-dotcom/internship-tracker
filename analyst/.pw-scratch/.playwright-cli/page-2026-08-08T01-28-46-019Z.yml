        - paragraph
        - paragraph [ref=e132]:
          - strong [ref=e133]: How to Apply
        - paragraph [ref=e134]:
          - text: Candidates who meet the qualifications are asked to submit the following items by
          - strong [ref=e135]: 5:00 p.m. on March 5, 2026
          - text: to be considered for this position.
        - list [ref=e137]:
          - listitem [ref=e138]: NEOGOV online application
          - listitem [ref=e139]: A cover letter that describes how your experience and skills align with the stated job responsibilities and qualifications. Please let us know why you are interested in this position.
          - listitem [ref=e140]: Current resume that summarizes relevant education, professional experience, training and skills.
        - paragraph [ref=e141]
        - paragraph [ref=e142]:
          - emphasis [ref=e143]: Applications that do not include a cover letter, resume, and complete online application will not be considered.
          - text: Applicants will be screened for competitiveness, completeness, and written communication skills. Initial screening will be based on a review of application materials. The employment history detailed in your application materials MUST validate/support your responses to the supplemental questions. If your responses cannot be validated, you will not proceed to the next steps of the review/selection process. The most competitive candidates will be invited to participate in a series of one or more interviews.
          - strong [ref=e144]: Benefits and Salary Information
        - paragraph [ref=e145]:
          - text: The full salary range for this position is
          - strong [ref=e146]: $38.96 - $47.24 per hour.
        - paragraph [ref=e147]
        - paragraph [ref=e148]:
          - text: "The City of Seattle offers a comprehensive benefits package including vacation, holiday, and sick leave as well as medical, dental, vision, life, and long-term disability insurance for employees and their dependents. More information about employee benefits is available on the City's website at:"
          - link "https://www.seattle.gov/human-resources/benefits/employees-and-covered-family-members/most-employees-plans" [ref=e149] [cursor=pointer]:
            - /url: https://www.seattle.gov/human-resources/benefits/employees-and-covered-family-members/most-employees-plans
        - paragraph [ref=e150]:
          - text: "Information about retirement plans can be found at:"
          - link "https://www.seattle.gov/retirement" [ref=e151] [cursor=pointer]:
            - /url: https://www.seattle.gov/retirement
          - strong [ref=e152]: Additional Information
        - paragraph [ref=e153]
        - paragraph [ref=e154]:
          - text: If you have questions regarding this bulletin or employment at The Seattle Public Library, please send an email to
          - link "jobapplications@spl.org" [ref=e155] [cursor=pointer]:
            - /url: mailto:jobapplications@spl.org
          - text: . The Library promotes diversity and inclusion in employment. If accommodations are needed during the selection process, please contact us.
        - paragraph [ref=e156]
        - paragraph [ref=e157]: Please keep in mind that job offers are contingent on a review of criminal history as well as verification of information provided by the applicant as part of the application process.
