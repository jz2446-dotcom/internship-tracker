      - definition [ref=e57]:
        - paragraph [ref=e58]:
          - strong [ref=e59]: "Invitation to Compete #11-26: Library Associate IV - Library Equal Access Program"
        - paragraph [ref=e60]
        - strong [ref=e61]: Library Experience & Engagement Division
        - strong [ref=e62]: Central Library
        - text: ", 1000 4"
        - superscript [ref=e63]: th
        - text: Ave, Seattle, WA 98104Regular, FLSA non-exempt; benefitted, part time; 64 hours per pay period
        - paragraph [ref=e64]:
          - strong [ref=e65]: "Salary Range: $38.96 - $47.24 per hour"
        - paragraph [ref=e66]
        - paragraph [ref=e67]: A pay period is two weeks in length that starts on Wednesday and ends on Tuesday. Hours are 9am-6pm on Monday, Wednesday, Thursday and Friday with some evenings and weekends as needed for outreach and programming. The schedule for this position is subject to change based on the Library’s current operational need. This position is part of a bargaining unit represented by AFSCME.
        - paragraph [ref=e68]:
          - strong [ref=e69]: This recruitment is open to the public and to The Seattle Public Library's employees.
          - text: Please submit your online application, cover letter, resume and responses to the supplemental questions in NEOGOV
          - strong [ref=e70]: by 5:00 p.m. on March 5, 2026.
        - text: "Please note: This recruitment may be used for up to 90 days following the closing date of this posting to fill regular and temporary Library Associate IV vacancies."
        - paragraph [ref=e71]
        - paragraph [ref=e72]:
          - strong [ref=e73]: Overview
        - paragraph [ref=e74]: The Seattle Public Library (SPL) is a dynamic urban library system that consists of the Central Library, 26 neighborhood libraries, and Mobile Services. The Community Engagement and Economic Development Department (CEED) department oversees system-wide programming, outreach, and community engagement, and is home to the Library Equal Access Program (LEAP).
        - paragraph [ref=e75]
        - paragraph [ref=e76]: The LEAP LAIV position supports the expansion and continued delivery of library services, programs and resources for patrons with disabilities. This position reports to the LEAP Supervising Librarian and also works closely with the CEED Manager and the Outreach and Mobile Services Assistant Managing Librarian. This 64 hour/pay period position is based in the Central Library and also works at locations throughout Seattle.
        - paragraph [ref=e77]
        - paragraph [ref=e78]: The position provides support to library patrons with disabilities around access to library services, provides basic training and support on the use of assistive technology and coordinates with volunteers or partner agencies to support more in-depth training on assistive technology. The position represents the library at events and on committees and is responsible for maintaining existing community partnerships and working with others in the department to develop new relationships with outside organizations.
        - paragraph
      - term [ref=e79]:
        - heading "Job Responsibilities" [level=2] [ref=e80]
      - definition [ref=e81]:
        - paragraph
        - list [ref=e83]:
          - listitem [ref=e84]: Provide support to patrons during staffed “drop-in” hours for the LEAP assistive technology lab.
          - listitem [ref=e85]: Support planning and implementation of programs and services for LEAP patrons including supporting accessibility of virtual, hybrid and in-person programming and access to assistive technology.
          - listitem [ref=e86]: Facilitate and support the development of outreach activities for youth and adults with disabilities.
          - listitem [ref=e87]: Collaborate with colleagues throughout the system on projects that are relevant to LEAP’s patrons and the goals of LEAP.
          - listitem [ref=e88]: Support engagement with partner organizations including government agencies, nonprofits, and education programs.
          - listitem [ref=e89]: Represent the Library at community events, meetings and other engagement activities with internal and external partners.
          - listitem [ref=e90]: Support programming within LEAP and CEED by staffing events and providing operational support to LEAP programs such as the Low Vision Book Group, and other on and offsite programs.
          - listitem [ref=e91]: Share information about LEAP and supportive services with library staff through maintenance of SharePoint site, presentations in unit meetings, and other platforms.
          - listitem [ref=e92]: Develop expert knowledge of LEAP services, policies, and programs.
          - listitem [ref=e93]: Coordinate digital literacy activities for LEAP. This may include individual and group training, engagement with partner agencies who provide training, and development of curricula in the use of assistive and general computer technology for people with disabilities.
          - listitem [ref=e94]: "Provide operational support to LEAP and CEED. This includes but is not limited to: tracking program and participant data, contributing to periodic descriptive and evaluative reports, purchasing goods and services, and ensuring the effective use of resources by tracking expenditures."
          - listitem [ref=e95]: Act as lead on bookmobile runs, providing reader’s advisory, reference and circulation services.
        - paragraph
      - term [ref=e96]:
        - heading "Qualifications" [level=2] [ref=e97]
      - definition [ref=e98]:
        - paragraph
        - list [ref=e99]:
          - listitem [ref=e100]:
            - strong [ref=e101]: "Experience:"
            - text: Minimum of 2 years of experience working with people with disabilities and knowledge of relevant community services and resources.
          - listitem [ref=e102]:
            - strong [ref=e103]: Communication and interpersonal skills
            - text: ": Excellent written, oral, and cross-cultural communication skills. Minimum of 2 years of experience speaking in front of midsized audiences (for example: delivering presentations, instruction, facilitating groups). Strong interpersonal skills with the ability to resolve conflict, problem-solve creatively, and work effectively in a team setting with both internal and external stakeholders. The ability to exercise tact and diplomacy during difficult conversations and when resolving conflict."
          - listitem [ref=e104]:
            - strong [ref=e105]: Judgment, initiative, leadership
            - text: ": Demonstrated experience independently managing responsibilities with minimal supervision, exercising initiative, and being flexible and resourceful when faced with new challenges or situations. Must be comfortable acting as lead on programming and outreach activities. Ability to recognize problems and assess situations, to gather and evaluate relevant information, and to take appropriate action, including referral and application of Library policy and procedure."
          - listitem [ref=e106]:
            - strong [ref=e107]: "Team membership:"
            - text: Demonstrated ability to work effectively with teams; a track record of making positive contributions that further team goals and cohesion. Ability to recognize and adjust work in order to support the successful operation of the unit.
          - listitem [ref=e108]:
            - strong [ref=e109]: "Organization skills:"
            - text: Demonstrated ability to recognize and set priorities, participate in multiple ongoing projects, and plan, organize and coordinate own work and that of a work team.
          - listitem [ref=e110]:
            - strong [ref=e111]: Technology
            - text: ": Intermediate skill levels in Microsoft Word, e-mail and electronic file maintenance, and Internet searching. Ability to troubleshoot minor computer and office equipment issues and assist patrons in resolving issues related to computers and office equipment. Demonstrated ability to learn, use, and assist library users with technology including accessing digital downloads and using the library catalog and databases."
          - listitem [ref=e112]:
            - strong [ref=e113]: "Library Information Resources:"
            - text: Familiarity with library online catalogs, internet searching and basic print reference resources.
          - listitem [ref=e114]:
            - strong [ref=e115]: "Education:"
            - text: High School Diploma or Graduate Equivalent Degree (GED) is required. Postsecondary education and/or relevant work experience will be considered in determining candidate competitiveness.
          - listitem [ref=e116]:
            - strong [ref=e117]: "Other required skills and abilities:"
            - text: Must be flexible in adjusting work hours and able to work evenings and weekends and able to travel throughout Seattle.
        - paragraph [ref=e118]
        - paragraph [ref=e119]:
          - strong [ref=e120]: Desired Qualifications
        - list [ref=e121]:
          - listitem [ref=e122]: Familiarity with, and an interest in adaptive software and technology devices.
          - listitem [ref=e123]: Familiarity with editing and maintaining sites in the SharePoint content management system.
          - listitem [ref=e124]: Experience providing extensive individualized support to people with disabilities.
          - listitem [ref=e125]: Fluency in American Sign Language, Spanish, Vietnamese, Somali, Amharic, or Chinese.
          - listitem [ref=e126]: Experience teaching computer skills
          - listitem [ref=e127]: Experience working with public libraries or knowledge of SPL services, resources, and programs.
          - listitem [ref=e128]: Bachelor’s degree.
        - paragraph
