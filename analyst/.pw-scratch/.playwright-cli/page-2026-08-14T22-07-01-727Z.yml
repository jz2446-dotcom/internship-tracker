      - generic [ref=f460e39]:
        - generic [ref=f460e40]: Description
        - generic [ref=f460e41]:
          - paragraph [ref=f460e42]
          - paragraph [ref=f460e43]:
            - strong [ref=f460e45]: About Longroad Energy
          - paragraph [ref=f460e46]: Longroad Energy is a Boston, MA headquartered renewable energy developer focused on the development, ownership, and operation/asset management of wind, solar, and battery storage projects throughout North America. Founded in 2016, Longroad has developed more than 7.2 GW and owns 5.4 GW of wind, solar, and energy storage projects across the United States, with more than 34 GW of projects currently in development. Our vision is to create lasting value for our shareholders, communities, and employees by responsibly developing, owning, and operating renewable energy projects. We have assembled a world-class team with a passion for renewable energy innovation and a commitment to advancing the transition to clean energy.
          - paragraph [ref=f460e47]
          - paragraph [ref=f460e48]:
            - strong [ref=f460e50]: Job Purpose
          - paragraph [ref=f460e51]: Reporting to the Director, Commercial Asset Management, the Asset Management Associate
          - paragraph [ref=f460e52]: supports the commercial oversight, financial performance, and operational coordination of Longroad’s renewable energy portfolio, currently exceeding 6 GW of solar, wind, and battery storage assets.
          - paragraph [ref=f460e53]: This role works closely with Asset Managers and cross-functional teams including Operations, Engineering, Accounting, Treasury, and FP&A to ensure assets operate efficiently, remain compliant, and achieve forecasted financial performance. The position offers broad exposure to renewable energy asset management, combining financial analysis, operational insight, and market participation.
          - paragraph [ref=f460e54]: This is an execution-focused role ideal for candidates interested in developing expertise across project economics, performance analytics, and power market dynamics within a collaborative, fast-paced environment.
          - paragraph [ref=f460e55]
          - paragraph [ref=f460e56]:
            - strong [ref=f460e58]: Responsibilities
            - strong [ref=f460e60]: Portfolio Management & Compliance
          - list [ref=f460e61]:
            - listitem [ref=f460e62]: Support Director, Commercial Asset Management on all required portfolio tasks to ensure assets complete all compliance requirements.
            - listitem [ref=f460e63]: Maintain all portfolio files and records in the Longroad file repository.
            - listitem [ref=f460e64]: Complete all EIA and FERC filing requirements under direction of Director, Commercial Asset Management.
            - listitem [ref=f460e65]: Manage REC registrations, ownership updates, and transaction execution.
            - listitem [ref=f460e66]: Manage land-lease payment schedule in coordination with the Real Estate and accounting teams.
          - paragraph [ref=f460e67]
          - paragraph [ref=f460e68]:
            - strong [ref=f460e70]: Financial Performance & Analysis
          - list [ref=f460e71]:
            - listitem [ref=f460e72]: Assist with annual budgeting and ongoing financial forecasting for operating and development-stage projects.
            - listitem [ref=f460e73]: Support the monthly financial performance (EBITDA) review process, including evaluation of budget vs. actual variances and drivers of deviation from forecast.
            - listitem [ref=f460e74]: Perform ad-hoc financial analysis to evaluate project investment opportunities
            - listitem [ref=f460e75]: Maintain files with running accounts of various parameters that are key indicators for the asset management team (e.g. costs, generation, RECs, etc.)
          - paragraph [ref=f460e76]
          - paragraph [ref=f460e77]:
            - strong [ref=f460e79]: Operational & Cross-Functional Coordination
          - list [ref=f460e80]:
            - listitem [ref=f460e81]: Partner with Operations and Engineering teams to monitor site performance and identify trends or risks.
            - listitem [ref=f460e82]: Respond to internal and external data requests, ensuring accuracy and consistency.
            - listitem [ref=f460e83]: Support the asset management and operational onboarding of developed and acquired projects.
            - listitem [ref=f460e84]: Partner with the treasury team to ensure complete and timely debt and vendor payments.
          - paragraph [ref=f460e85]
          - paragraph [ref=f460e86]:
            - strong [ref=f460e88]: Reporting & Market Analysis
          - list [ref=f460e89]:
            - listitem [ref=f460e90]: Lead monthly operational and financial reporting.
            - listitem [ref=f460e91]: Develop data dashboards to monitor site performance, trends, and decision-making.
            - listitem [ref=f460e92]: Research ISO markets, resource adequacy structures, and evolving energy market requirements to inform asset strategy.
          - paragraph [ref=f460e93]
          - paragraph [ref=f460e94]:
            - strong [ref=f460e96]: Minimum Qualifications
          - list [ref=f460e97]:
            - listitem [ref=f460e98]: Bachelor’s degree in finance, engineering, accounting, business, or equivalent.
            - listitem [ref=f460e99]: 1-2 years experience in renewable energy, power generation, finance, accounting, engineering, or performance analytics.[SS1]
            - listitem [ref=f460e100]: Strong time-management skills with the ability to manage multiple priorities and meet deadlines.
            - listitem [ref=f460e101]: Proficiency in MS Office.
            - listitem [ref=f460e102]: Strong analytical, writing, and communication skills, with the ability to present reporting and communicate effectively to both internal and external stakeholders..
            - listitem [ref=f460e103]: Willingness to learn and leverage new tools, including data analytics, and AI-enabled workflows to improve efficiency.
            - listitem [ref=f460e104]: Strong qualitative and quantitative analytical skills, with the ability to manage multiple issues simultaneously and clearly articulate key principles, concerns, and solutions to drive effective resolution.
            - listitem [ref=f460e105]: Ability to travel periodically to project sites and provide schedule flexibility when business needs require.
          - paragraph [ref=f460e106]
          - paragraph [ref=f460e107]:
            - strong [ref=f460e109]: "Preferred Qualifications:"
          - list [ref=f460e110]:
            - listitem [ref=f460e111]: Familiarity with renewable energy operations and general knowledge of how power projects perform technically and financially. Experience reviewing contracts.
          - paragraph [ref=f460e112]
          - paragraph [ref=f460e113]:
            - strong [ref=f460e115]: Characteristics Necessary for Success
          - list [ref=f460e116]:
            - listitem [ref=f460e117]: Collaborative working style and a can-do attitude.
            - listitem [ref=f460e118]: Curious and proactive approach to understanding asset performance drivers.
            - listitem [ref=f460e119]: Strong analytical mindset, with the ability to interpret data and solve problems.
            - listitem [ref=f460e120]: Comfortable with a fast paced and rapidly changing environment.
            - listitem [ref=f460e121]: Ability to garner consensus from diverse internal stakeholder groups to make decisions quickly.
            - listitem [ref=f460e122]: Passionate and enthusiastic about renewable energy.
            - listitem [ref=f460e123]: Highly organized, able to multitask and manage multiple projects efficiently
          - paragraph [ref=f460e124]:
            - strong [ref=f460e126]: Compensation
          - paragraph [ref=f460e127]:
            - text: The expected salary range for this position is
            - strong [ref=f460e128]: $90,000– $110,000.
            - text: depending on experience, qualifications, and location.
          - paragraph [ref=f460e129]: In addition to base salary, this role includes a bonus. The position offers health, vision/dental insurance, flexible spending accounts, 401(k) plan, accrued paid time off, life insurance and disability coverage.
          - paragraph [ref=f460e130]: We encourage candidates to consider total compensation when applying and if you feel you meet the requirements and are excited to learn more, we’d love to share.
          - paragraph [ref=f460e131]:
            - emphasis [ref=f460e132]: "*Note that the"
            - emphasis [ref=f460e133]: pay
            - emphasis [ref=f460e134]: range listed for this position is a good faith and reasonable estimate of the range of possible base compensation at the time of posting.
            - emphasis [ref=f460e135]: Exact compensation may vary based on skills, experience and location.
          - paragraph [ref=f460e136]
          - paragraph [ref=f460e137]:
            - strong [ref=f460e139]: Other
          - paragraph [ref=f460e140]: Applicants must be currently authorized to work in the United States. The Company does not sponsor applicants for work visas.
          - paragraph [ref=f460e141]: This role may also be eligible for incentive plan participation and other performance-based compensation opportunities.
          - paragraph [ref=f460e142]
          - paragraph [ref=f460e143]:
            - strong [ref=f460e145]: Benefits of Working at Longroad Energy
          - paragraph [ref=f460e146]:
            - text: We are dedicated to providing our employees with the support and resources they need to stay healthy, secure their future, and be successful in their careers. Benefits at Longroad include the opportunity for merit-based salary increases, incentive plan participation, 401(k) plan and matching, and comprehensive medical, dental, vision, life, and disability insurance. Our robust time-off policy includes accrual of 18 vacation days in your first year, paid holidays, and paid volunteer time. We offer paid parental leave to help support employees as they transition into parenthood. Learn more about our
            - link "employee benefits." [ref=f460e147] [cursor=pointer]:
              - /url: https://www.longroadenergy.com/about-us/employee-benefits/
          - paragraph [ref=f460e148]
          - paragraph [ref=f460e149]:
            - strong [ref=f460e151]: Diversity, Equity & Inclusion
          - paragraph [ref=f460e152]:
            - text: Diversity, equity, and inclusion matter - at Longroad, in our industry, in our communities, and in society at large. We embrace our responsibility to build and promote a diverse, equitable, and inclusive working experience and drive change where we live and operate. We work to actively promote and celebrate diversity, equity, and inclusion. We foster a supportive space that empowers everyone at Longroad to learn about, discuss and ask questions related to embracing and honoring identity. We collaborate with our community, colleagues, and industry in the ongoing pursuit of evolving and growing an inclusive and diverse environment. Learn more about our
            - link "DEI commitment" [ref=f460e153] [cursor=pointer]:
              - /url: https://www.longroadenergy.com/sustainability/people-community/
            - text: .
          - paragraph [ref=f460e154]
          - paragraph [ref=f460e155]:
            - strong [ref=f460e157]: Longroad Energy Values
          - paragraph [ref=f460e158]:
            - text: At Longroad, we SHINE. We aim to be the most trusted renewable energy company on the long road to a green future. We are an experienced team of problem solvers and promise-keepers who develop sustainable solutions that meet today’s challenges and make a lasting impact on people and our planet. Learn more about our
            - link "SHINE values" [ref=f460e159] [cursor=pointer]:
              - /url: https://www.longroadenergy.com/about-us/about-longroad-energy/
            - text: .
          - paragraph [ref=f460e160]: Longroad Energy is proud to be an Equal Opportunity Employer (“EOE”). Qualified applicants are considered for employment without regard to age, race, color, religion, sex, national origin, disability, veteran status, citizenship, or any other legally protected status. Longroad Energy prohibits discrimination against individuals with disabilities and will reasonably accommodate applicants with a disability, upon request, and will also ensure reasonable accommodations are made for disabled employees. Longroad Energy is firmly committed to ensuring equal employment opportunities in all employment practices and personnel actions, including advertising, recruitment, testing, screening, hiring, selection for training, upgrading, transfer, demotion, layoff, discipline, termination, rates of pay, and other forms of compensation.
          - paragraph [ref=f460e161]
          - paragraph [ref=f460e162]
