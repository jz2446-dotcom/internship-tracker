          - generic [ref=f210e265]:
            - paragraph [ref=f210e266]: Our aspiration is for our workforce to continually reflect the diversity of people and perspectives in today’s evolving society, which we believe is fundamental to our efforts to help our clients and employees get more out of life. Invesco is an Equal Opportunity Employer. We are committed to equal employment opportunity for all job applicants and employees. No job applicant or employee will be discriminated against because of race, religion, color, sex, sexual orientation, gender, sexual/gender identity, age, disability, pregnancy, national origin, military or veteran status, or any other characteristic protected by applicable law.
            - paragraph [ref=f210e267]:
              - text: If you have a disability and you wish to discuss potential accommodations related to applying for employment at Invesco, please contact us at
              - link "application.accommodations@invesco.com" [ref=f210e268] [cursor=pointer]:
                - /url: mailto:application.accommodations@invesco.com
              - text: . Please include the location and title of the job opening.
            - paragraph [ref=f210e269]:
              - text: Invesco is aware of the existence of fraudulent schemes where individuals represent themselves as recruiters and solicit candidates for employment via email or text message. These candidates may be asked to provide copies of personal identification and payment in order to process their application. These communications are fraudulent and do not originate from Invesco. Invesco does not ask for payment at any time during our employment process. We recommend that you do not disclose your personal or financial information to anyone you do not know.
              - link "Learn more about fraudulent recruiting" [ref=f210e270] [cursor=pointer]:
                - /url: https://recruit.smashfly.com/SmashFlyMedia/Docs/17109/17109_5108_Fraudulent%20recruiting%20alert%20article%2007092020.pdf
