                  - paragraph [ref=f413e1102]: In 2016, we acquired Holtwood’s two hydro stations in Pennsylvania with 296 MW of capacity—enough to power more than 100,000 homes annually. Holtwood benefits from synergies with our Safe Harbor facility, as well as from stable revenues, long-term operating licenses, and a market that is facing significant coal retirements.
