            - emphasis [ref=f115e79]: Qualifications
            - list [ref=f115e80]:
              - listitem [ref=f115e81]:
                - emphasis [ref=f115e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f115e83]:
                - emphasis [ref=f115e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f115e85]:
