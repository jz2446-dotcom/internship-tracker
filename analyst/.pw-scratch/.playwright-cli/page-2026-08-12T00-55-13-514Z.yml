            - text: ", and $200 for non-members."
            - strong [ref=f33e255]:
              - link "Start posting for free…join CLIR and DLF today!" [ref=f33e256] [cursor=pointer]:
                - /url: https://www.clir.org/about/become-a-sponsor-or-member/
        - complementary [ref=f33e257]:
          - paragraph [ref=f33e258]: Postings are active for 60 days and include customized promotion on CLIR and DLF accounts.
        - complementary [ref=f33e259]:
          - paragraph [ref=f33e260]:
