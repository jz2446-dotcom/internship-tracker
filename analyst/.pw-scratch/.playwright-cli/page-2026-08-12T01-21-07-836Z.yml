      - generic [ref=f350e74]:
        - paragraph [ref=f350e75]:
          - strong [ref=f350e76]: Why Work at Cayuga Lake National Bank?
        - paragraph [ref=f350e77]: At Cayuga Lake National Bank, you'll enjoy more than just a job - you'll build a rewarding career with an organization that values our employees and the communities we serve.
        - paragraph [ref=f350e78]:
          - strong [ref=f350e79]: "We offer:"
        - list [ref=f350e80]:
          - listitem [ref=f350e81]:
            - strong [ref=f350e82]: Meaningful Work
            - text: "- Help local businesses grow and contribute to the economic strength of the communities we proudly serve."
          - listitem [ref=f350e83]:
            - strong [ref=f350e84]: Supportive Team Environment
            - text: "- Work alongside experienced professionals who value collaboration, respect, and shared success."
          - listitem [ref=f350e85]:
            - strong [ref=f350e86]: Professional Growth
            - text: "- We invest in our employees through training, continuing education, and career development opportunities."
          - listitem [ref=f350e87]:
            - strong [ref=f350e88]: Work-Life Balance
            - text: "- Enjoy a predictable Monday through Friday schedule (some Saturday mornings required), generous paid time off, and a comprehensive benefits package."
          - listitem [ref=f350e89]:
            - strong [ref=f350e90]: Community Commitment
            - text: "- Join a locally focused community bank where decisions are made close to home and relationships matter."
        - paragraph [ref=f350e91]: We are a community minded, supportive and engaging employer.
        - paragraph [ref=f350e92]: Every employee of the bank is held to a high professional standard and committed to the mission of our community bank.
