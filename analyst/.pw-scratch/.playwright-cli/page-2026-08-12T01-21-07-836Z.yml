        - heading [level=3] [ref=f350e438]:
          - emphasis [ref=f350e439]:
            - strong [ref=f350e441]: Consumer Loan Underwriter & Compliance Officer
        - generic [ref=f350e442]:
          - paragraph [ref=f350e443]:
            - strong [ref=f350e444]: Join a Community-Focused Financial Institution Where Your Expertise Makes an Impact
          - paragraph [ref=f350e445]:
            - text: Cayuga Lake National Bank is seeking a detail-oriented and experienced
            - strong [ref=f350e446]: Consumer Loan Underwriter & Compliance Officer
            - text: to join our growing lending team. This is an exciting opportunity for a lending professional who enjoys balancing analytical underwriting with regulatory expertise while contributing to a collaborative, customer-focused environment.
          - paragraph [ref=f350e447]: In this role, you’ll play a key part in evaluating consumer loan applications, supporting secondary market initiatives, and ensuring compliance with federal and state lending regulations. If you thrive in a fast-paced financial environment and value teamwork, integrity, and professional growth, we’d love to hear from you.
          - paragraph [ref=f350e448]:
            - strong [ref=f350e449]: What You’ll Do
          - paragraph [ref=f350e450]:
            - strong [ref=f350e451]: Consumer Loan Underwriting
          - list [ref=f350e452]:
            - listitem [ref=f350e453]: "Analyze and underwrite a variety of consumer loan products including:"
            - listitem [ref=f350e454]: Real estate loans
            - listitem [ref=f350e455]: Personal loans
            - listitem [ref=f350e456]: Auto loans
            - listitem [ref=f350e457]: Credit cards
            - listitem [ref=f350e458]: Secured and unsecured lending products
            - listitem [ref=f350e459]: Evaluate income, assets, credit history, debt-to-income ratios, and collateral documentation
            - listitem [ref=f350e460]: Make timely lending decisions in accordance with established credit policies and risk standards
            - listitem [ref=f350e461]: Ensure loan documentation is accurate, complete, and compliant
          - paragraph [ref=f350e462]:
            - strong [ref=f350e463]: Compliance & Risk Management
          - list [ref=f350e464]:
            - listitem [ref=f350e465]: "Monitor and ensure compliance with consumer lending regulations, including:"
            - listitem [ref=f350e466]: TILA / Regulation Z
            - listitem [ref=f350e467]: ECOA / Regulation B
            - listitem [ref=f350e468]: FCRA
            - listitem [ref=f350e469]: Fair Lending laws
            - listitem [ref=f350e470]: Applicable state regulations
            - listitem [ref=f350e471]: Review loan files and lending processes for compliance accuracy and quality control
            - listitem [ref=f350e472]: Identify and resolve deficiencies or compliance exceptions
            - listitem [ref=f350e473]: Support audits, risk assessments, and internal compliance initiatives
          - paragraph [ref=f350e474]:
            - strong [ref=f350e475]: Secondary Market & Operational Support
          - list [ref=f350e476]:
            - listitem [ref=f350e477]: Prepare and qualify loans for secondary market eligibility
            - listitem [ref=f350e478]: Stay informed on changing regulatory requirements, lending trends, and market conditions
            - listitem [ref=f350e479]: Provide guidance and support to lending staff and management
            - listitem [ref=f350e480]: Assist with policy development, training, and process improvements
            - listitem [ref=f350e481]: Participate in community and branch activities that support the Bank’s local presence
          - paragraph [ref=f350e482]:
            - strong [ref=f350e483]: What We’re Looking For
          - paragraph [ref=f350e484]:
            - strong [ref=f350e485]
            - strong [ref=f350e486]: Qualifications
          - list [ref=f350e487]:
            - listitem [ref=f350e488]: High school diploma or GED required
            - listitem [ref=f350e489]: Associate degree in Business, Finance, or related field preferred
            - listitem [ref=f350e490]: 3–5 years of experience in consumer loan underwriting and/or lending compliance
            - listitem [ref=f350e491]: Strong understanding of consumer lending regulations and underwriting principles
            - listitem [ref=f350e492]: Experience within a bank, credit union, fintech lender, or similar financial institution preferred
          - paragraph [ref=f350e493]:
            - strong [ref=f350e494]: Skills & Abilities
          - list [ref=f350e495]:
            - listitem [ref=f350e496]: Familiarity with loan origination systems such as MeridianLink Mortgage or similar platforms
            - listitem [ref=f350e497]: Strong analytical and problem-solving abilities
            - listitem [ref=f350e498]: Excellent attention to detail and organizational skills
            - listitem [ref=f350e499]: Ability to manage multiple deadlines and priorities effectively
            - listitem [ref=f350e500]: Professional communication and customer service skills
            - listitem [ref=f350e501]: Ability to work both independently and collaboratively in a team environment
          - paragraph [ref=f350e502]:
            - strong [ref=f350e503]: "Compensation:"
            - text: $60,000 - 75,000 annually, commensurate with experience.
          - paragraph [ref=f350e504]:
            - strong [ref=f350e505]: "Benefits:"
          - list [ref=f350e506]:
            - listitem [ref=f350e507]: Paid Time Off (PTO)
            - listitem [ref=f350e508]: Sick Time
            - listitem [ref=f350e509]: Health Insurance
            - listitem [ref=f350e510]: Dental Insurance
            - listitem [ref=f350e511]: Life Insurance
            - listitem [ref=f350e512]: 401(k) & company match
            - listitem [ref=f350e513]: Flexible Spending Account or Health Savings Account
            - listitem [ref=f350e514]: Continuing Education and Tuition Assistance
            - listitem [ref=f350e515]: Paid Federal Holidays
            - listitem [ref=f350e516]: Reduced Rates on Loans
          - paragraph [ref=f350e517]: If you’re ready to bring your lending and compliance expertise to a dynamic and respected financial institution, we encourage you to apply today.
