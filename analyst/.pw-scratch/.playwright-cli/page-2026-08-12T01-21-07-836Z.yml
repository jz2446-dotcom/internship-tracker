            - listitem [ref=f350e135]: Conduct outreach calls and follow-ups with prospects and existing customers
            - listitem [ref=f350e136]: Represent the bank in the community through events and networking opportunities
            - listitem [ref=f350e137]: Consistently meet or exceed individual and team performance goals
