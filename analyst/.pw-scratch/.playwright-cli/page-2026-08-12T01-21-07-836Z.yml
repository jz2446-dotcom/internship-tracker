          - paragraph [ref=f350e215]:
            - generic [ref=f350e216]:
              - text: We are seeking an experienced, analytical, and collaborative
              - strong [ref=f350e217]: Commercial Credit and Portfolio Officer
              - text: to join our Commercial Lending team. This position plays a vital role in maintaining the quality of the Bank's commercial loan portfolio through financial analysis, portfolio management, and credit administration. The successful candidate will also provide leadership and day-to-day supervision of the Credit Analyst and Commercial Loan Processor while fostering teamwork across the Bank. If you're looking for an opportunity where your expertise will make a meaningful impact on local businesses and the communities we serve, we'd love to hear from you.
          - emphasis [ref=f350e218]:
            - paragraph [ref=f350e220]
          - generic [ref=f350e221]:
            - generic [ref=f350e222]:
              - paragraph [ref=f350e223]:
                - strong [ref=f350e224]: What You’ll Do
              - paragraph [ref=f350e225]:
                - strong [ref=f350e227]: Portfolio Management & Credit Analysis
              - list [ref=f350e229]:
                - listitem [ref=f350e230]: Perform financial spreading and underwriting support for commercial loan requests.
                - listitem [ref=f350e231]: Analyze financial statements, tax returns, and other financial information for new and existing commercial loan relationships.
                - listitem [ref=f350e232]:
                  - generic [ref=f350e233]: Complete annual credit reviews for assigned commercial borrowers.
                - listitem [ref=f350e234]:
                  - generic [ref=f350e235]: Monitor credit quality, risk ratings, and the overall health of the commercial loan portfolio.
                - listitem [ref=f350e237]:
                  - generic [ref=f350e238]: Ensure borrower compliance with loan covenants and requirements.
                - listitem [ref=f350e241]:
                  - generic [ref=f350e242]: Obtain updated financial statements and supporting documentation from borrowers.
                - listitem [ref=f350e246]:
                  - generic [ref=f350e247]: Prepare credit presentations and reports for Commercial Loan Officers, Loan Committee, and Board of Directors.
                - listitem [ref=f350e252]:
                  - generic [ref=f350e253]: Assist in monitoring the overall quality and performance of the Bank's commercial loan portfolio.
                - listitem [ref=f350e259]:
                  - generic [ref=f350e260]: Work with internal and external auditors to ensure safety and soundness.
            - generic [ref=f350e267]:
              - paragraph [ref=f350e268]:
                - strong [ref=f350e269]: Credit Administration
              - list [ref=f350e271]:
                - listitem [ref=f350e272]: Review commercial loans to ensure compliance with Bank lending policies and established credit standards.
                - listitem [ref=f350e273]: Conduct systematic reviews of commercial loan documentation for completeness and accuracy.
                - listitem [ref=f350e274]: Perform scheduled reviews of higher-risk loan relationships and recommend appropriate action.
                - listitem [ref=f350e275]:
                  - generic [ref=f350e276]: Analyze collateral and perform occasional collateral inspections to verify value and condition.
                - listitem [ref=f350e277]:
                  - generic [ref=f350e278]: Monitor classified loan relationships and develop action plans, including obtaining updated financial information and documentation from borrowers.
              - paragraph [ref=f350e280]:
                - strong [ref=f350e281]: Leadership
              - list [ref=f350e283]:
                - listitem [ref=f350e284]: Supervise and provide day-to-day guidance, coaching, training, and support to the Credit Analyst and Commercial Loan Processor.
                - listitem [ref=f350e285]: Assist Commercial Loan Processor to enter loans in the system.
                - listitem [ref=f350e286]:
                  - generic [ref=f350e287]: Review work for accuracy, consistency, and compliance while promoting efficient workflow and professional development.
                - listitem [ref=f350e288]:
                  - generic [ref=f350e289]: Foster a collaborative, respectful, and positive work environment within the Commercial Lending team.
                - listitem [ref=f350e291]:
                  - generic [ref=f350e292]: Build and maintain positive working relationships among all members of the Lending team and promote effective communication and teamwork across all Bank departments.
                - listitem [ref=f350e295]:
                  - generic [ref=f350e296]: Partner with Loan Officers, Credit Administration, Operations, Compliance, and other departments to ensure exceptional customer service, operational efficiency, and sound credit administration.
                - listitem [ref=f350e300]:
                  - generic [ref=f350e301]: Lead by example by demonstrating professionalism, accountability, integrity, and a commitment to the Bank's mission and values.
              - generic [ref=f350e307]:
