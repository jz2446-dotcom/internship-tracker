          - list [ref=f350e124]:
            - listitem [ref=f350e125]: Meet with customers to understand their needs and recommend the right loan solutions
            - listitem [ref=f350e126]: Originate a variety of consumer loans (home equity, auto, RV, personal, and more)
            - listitem [ref=f350e127]: Guide customers through the entire loan process—from application to closing
            - listitem [ref=f350e128]: Coordinate with underwriting and processing teams to ensure a smooth experience
            - listitem [ref=f350e129]: Deliver exceptional, personalized service that builds long-term loyalty
          - strong [ref=f350e131]: Business Development & Sales
