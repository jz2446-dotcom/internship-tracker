              - generic [ref=f31e47]:
                - generic [ref=f31e51]:
                  - paragraph [ref=f31e52]: Charlotte Mecklenburg Library is one of America’s leading urban public libraries, serving a community of more than one million citizens in Mecklenburg County, North Carolina. Through 20 locations, targeted outreach and online, the Library delivers exceptional services and programs, with a mission to improve lives and build a stronger community. In short, we strive to be essential to our community.
                  - paragraph [ref=f31e53]:
                    - text: Since our founding in 1903, as an original Carnegie Library, our role as a provider of lifelong education in this community has never been more relevant. As stewards of the community's trust and resources, we work hard every day to provide valuable experiences. Our customers, staff and supporters inspire us each day to be an
                    - emphasis [ref=f31e54]: essential
                    - text: resource for our community.
                  - paragraph [ref=f31e55]:
                    - link "Library by the numbers" [ref=f31e56] [cursor=pointer]:
                      - /url: https://www.cmlibrary.org/library-numbers
                  - heading "Mission:" [level=3] [ref=f31e57]
                  - paragraph [ref=f31e58]: Improve lives and build a stronger community
                  - heading "Vision:" [level=3] [ref=f31e59]
                  - paragraph [ref=f31e60]: The essential connector of a thriving community of readers, leaders and learners
                  - heading "Brand Promise:" [level=3] [ref=f31e61]
                  - paragraph [ref=f31e62]: Accessible and welcoming to all, our public library celebrates and supports the joy of reading and learning, fosters exploration and personal growth, and connects individuals to each other, the community and the world. In short, we help people think, “I can.”
                  - heading "Core Values:" [level=3] [ref=f31e63]
                  - paragraph [ref=f31e64]:
                    - strong [ref=f31e65]: Learning
                    - text: – We connect children, teens and adults with reading and information to expand curiosity, explore interests, and discover passions.
                  - paragraph [ref=f31e66]:
                    - strong [ref=f31e67]: Openness
                    - text: – We provide a friendly, helpful learning environment that supports free access to library resources and the exchange of information.
                  - paragraph [ref=f31e68]:
                    - strong [ref=f31e69]: Respect
                    - text: – We act with integrity, deliver exceptional service, and earn the public’s trust as responsible stewards of its resources.
                  - paragraph [ref=f31e70]:
                    - strong [ref=f31e71]: Inclusion
                    - text: – We celebrate diversity, invite multiple points of view, and recognize the potential of every individual.
                  - paragraph [ref=f31e72]:
                    - strong [ref=f31e73]: Leadership
                    - text: – We embrace the Library’s role as community leader and empower staff to learn, innovate and lead.
