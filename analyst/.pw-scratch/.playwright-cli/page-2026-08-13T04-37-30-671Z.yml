              - heading "You have to eat one — or more — on your first visit to Philadelphia ..." [level=3] [ref=f1222e190]
            - generic [ref=f1222e195]:
              - paragraph [ref=f1222e196]:
                - text: The
                - link "Philly cheesesteak" [ref=f1222e197] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/top-10-spots-for-authentic-philly-cheesesteaks/
                - text: "is inarguably the city’s most famous food. So put your diet on hold for the day, and indulge in a freshly baked roll filled with chopped (or thinly sliced) steak and your choice of cheese and/or fried onions. Those in the know order their cheesesteak with two words only: cheese selection (provolone, American or Whiz) and “wit” or “without” onions."
              - paragraph [ref=f1222e198]:
                - text: The debate about which local spot cooks up the
                - link "best sandwich" [ref=f1222e199] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/top-10-spots-for-authentic-philly-cheesesteaks/
                - text: won’t ever end, but for an iconic Philly experience, visit the intersection of South 9th Street and Passyunk Avenue, where rivals
                - link "Geno’s Steaks" [ref=f1222e200] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/top-10-spots-for-authentic-philly-cheesesteaks/#genos-steaks
                - text: and
                - link "Pat’s King of Steaks" [ref=f1222e201] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/top-10-spots-for-authentic-philly-cheesesteaks/#genos-steaks
                - text: feed the masses daily, and do your very own taste test.
              - paragraph [ref=f1222e202]:
                - text: Looking for vegan options — or other out-of-the-box twists on the Philly classic? Philly’s got you covered with plenty of
                - link "alternative cheesesteak options" [ref=f1222e203] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/alternative-cheesesteaks
                - text: ". (Pro tip: Make time to try all of"
                - link "Philly’s iconic foods" [ref=f1222e204] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/iconic-philadelphia-foods-must-have-philly-eats/
                - text: ", including"
                - link "roast pork sandwiches" [ref=f1222e205] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/the-best-roast-pork-sandwiches-in-philadelphia/
                - text: ","
                - link "hoagies" [ref=f1222e206] [cursor=pointer]:
