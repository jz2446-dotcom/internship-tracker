                  - link "Pose with the Rocky Statue and run up the \"Rocky Steps\"" [ref=f1222e151] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/things-to-do/attractions/the-rocky-statue-and-the-rocky-steps/
                - heading "Two of the most famous attractions in Philadelphia …" [level=3] [ref=f1222e152]
              - figure [ref=f1222e154]:
                - generic [ref=f1222e155]:
                  - img "A close-up of the Rocky Statue with the Philadelphia Museum of Art in the background." [ref=f1222e156]
                  - img "A close-up of the Rocky Statue with the Philadelphia Museum of Art in the background." [ref=f1222e157]
              - generic [ref=f1222e158]: — Photo by Visit Philadelphia
              - generic [ref=f1222e159]:
                - paragraph [ref=f1222e160]: Since Rocky’s first triumphant on-screen run up the steps of the Philadelphia Museum of Art in 1976, the 72 steps have become an international destination — and a Philly rite of passage.
                - paragraph [ref=f1222e161]:
                  - text: Travelers from around the world embark on their own pilgrimage up
                  - link "the stairs" [ref=f1222e162] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/things-to-do/attractions/the-rocky-statue-and-the-rocky-steps/
                  - text: ", pumping their fists in the air as they cherish the spectacular view of the"
                  - link "Benjamin Franklin Parkway" [ref=f1222e163] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/things-to-do/attractions/benjamin-franklin-parkway/
                  - text: and the city skyline. Cheesy? Definitely. Fun? Absolutely!
                - paragraph [ref=f1222e164]:
                  - text: To finish off the experience, head back down to the bottom of the stairs and snap a photo with the
                  - link "bronze statue of Rocky" [ref=f1222e165] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/things-to-do/attractions/the-rocky-statue-and-the-rocky-steps/
                  - text: ", originally created for Rocky III. Then, venture inside"
                  - link "one of the country’s most magnificent art museums" [ref=f1222e166] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/things-to-do/attractions/philadelphia-museum-of-art/
                  - text: . We promise it won’t disappoint.
