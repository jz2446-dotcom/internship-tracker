              - heading "An iconic work of art by Robert Indiana ..." [level=3] [ref=f1222e291]
            - generic [ref=f1222e296]:
              - paragraph [ref=f1222e297]:
                - text: The City of Brotherly Love is filled with love — literally. One of the best-known landmarks is
                - link "LOVE" [ref=f1222e298] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/love-statue/
                - text: itself, the Robert Indiana sculpture in John F. Kennedy Plaza (or
                - link "LOVE Park" [ref=f1222e299] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/love-statue/
                - text: ", as it’s affectionately called by most). It’s a prized photo op for couples, families and friends eager to show the world how they feel about one another."
              - paragraph [ref=f1222e300]:
                - text: The sculpture was restored and repainted in 2018, and the park was entirely redesigned to add more green areas and a high-tech water feature. A small visitor center kiosk was added in 2021. Another LOVE statue sits just west of Center City on the University of Pennsylvania campus
                - link "near 36th and Locust streets " [ref=f1222e301] [cursor=pointer]:
                  - /url: https://maps.app.goo.gl/FcUHkTj9tFypjb6z8
                - text: .
              - paragraph [ref=f1222e302]:
                - text: And because love comes in all languages in Philadelphia, there’s an AMOR sculpture — a Spanish edition of the LOVE sculpture — on display at
                - link "Sister Cities Park" [ref=f1222e303] [cursor=pointer]:
                  - /url: http://www.visitphilly.com/museums-attractions/philadelphia/sister-cities-park/
                - text: ", a six-minute walk from LOVE Park."
