              - heading "Dramatic home of the internationally known symbol of freedom …" [level=3] [ref=f1222e129]
            - generic [ref=f1222e134]:
              - paragraph [ref=f1222e135]:
                - text: It doesn’t make a sound, but the
                - link "Liberty Bell" [ref=f1222e136] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/the-liberty-bell-center/
                - text: "’s message rings loud and clear: “Proclaim liberty throughout all the land unto all the inhabitants thereof.” This inscription on the cracked but mighty Bell is one reason it became a symbol to abolitionists, suffragists and other freedom-seekers throughout history."
              - paragraph [ref=f1222e137]:
                - text: "The Bell draws people from around the world to snag a photo in front of it and its dramatic backdrop:"
                - link "Independence Hall" [ref=f1222e138] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/independence-hall/
                - text: . The Liberty Bell Center is free to visit year-round with no tickets required. Learn more about visiting in
                - link "our guide to the Liberty Bell" [ref=f1222e139] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/the-liberty-bell-center/
                - text: .
