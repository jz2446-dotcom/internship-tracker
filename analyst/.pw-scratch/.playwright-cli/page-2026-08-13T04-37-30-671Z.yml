            - paragraph [ref=f1222e89]: There’s never a shortage of awesome things to do in Philadelphia, but there are some things “youse” just gotta do — especially if you’ve never been to our fair city before.
            - paragraph [ref=f1222e90]: Whether it’s running like Rocky up those magnificent museum steps, refueling with a cheesesteak (absolutely mandatory), bowing down to the history made at Independence Hall or exploring the iconic Reading Terminal Market, these are the experiences that make Philly so gloriously Philly.
            - generic [ref=f1222e91]:
              - text: It’s Philly’s biggest year yet! Make the most of it by booking the
              - link "Visit Philly Overnight Package" [ref=f1222e92] [cursor=pointer]:
                - /url: https://www.visitphilly.com/features/visit-philly-overnight-hotel-package/
              - text: ", which comes with free hotel parking and complimentary tickets to some of the most popular attractions in each of Greater Philadelphia’s five counties including Universal Theme Parks: The Exhibition at The Franklin Institute, the Mercer Museum in Bucks County, Longwood Gardens in Chester County, the Brandywine Museum of Art in Delaware County and Elmwood Park Zoo in Montgomery County."
            - paragraph [ref=f1222e93]:
              - text: Read on for the 10 most essential experiences to be had in the City of Brotherly Love — and find 10 more amazing Philly experiences
              - link "right this way" [ref=f1222e94] [cursor=pointer]:
                - /url: https://www.visitphilly.com/articles/philadelphia/most-essential-things-to-do-in-philadelphia-on-a-return-visit/
              - text: .
