              - heading "Where the Declaration of Independence was signed and the U.S. Constitution was created ..." [level=3] [ref=f1222e266]
            - generic [ref=f1222e271]:
              - paragraph [ref=f1222e272]:
                - text: While
                - link "historical attractions abound" [ref=f1222e273] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/bucket-list-historic-sites-in-philadelphia/
                - text: in Philly,
                - link "Independence Hall" [ref=f1222e274] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/independence-hall/
                - text: is where the nation was founded.
              - paragraph [ref=f1222e275]:
                - text: In 1776, the Founding Fathers signed the Declaration of Independence in the building’s Assembly Room. Just 11 years later, representatives from a dozen states met here to lay the framework for the U.S. Constitution. Today, the goosebumps-inducing UNESCO World Heritage Site is the centerpiece of
                - link "Independence National Historical Park," [ref=f1222e276] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/articles/philadelphia/independence-national-historical-park-inhp-sites-in-philadelphia/
                - text: and guided tours of this bucket-list gem are available year-round.
              - paragraph [ref=f1222e277]:
                - text: Free tours of the Hall are available via timed tickets. Learn more about how to obtain tickets in
                - link "our guide to Independence Hall" [ref=f1222e278] [cursor=pointer]:
                  - /url: https://www.visitphilly.com/things-to-do/attractions/independence-hall/
                - text: .
