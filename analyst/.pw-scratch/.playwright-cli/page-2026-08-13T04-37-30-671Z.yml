              - generic [ref=f1222e216]:
                - generic [ref=f1222e217]: Visit Philly staff says...
                - paragraph [ref=f1222e218]: I’m from Connecticut, but in college, I had friends from Philly who would always talk about how cheesesteaks in Philadelphia were nothing like the ones at chain restaurants or chopped cheeses in New York.
                - paragraph [ref=f1222e219]:
                  - text: When I moved here, my first true Philadelphia cheesesteak was from
                  - link "Joe’s Steaks + Soda Shop" [ref=f1222e220] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/articles/philadelphia/top-10-spots-for-authentic-philly-cheesesteaks/#joes-steaks-soda-shop
                  - text: in
                  - link "Fishtown" [ref=f1222e221] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/areas/philadelphia-neighborhoods/fishtown/
                  - text: ", with whiz and onions — so “"
                  - link "whiz wit" [ref=f1222e222] [cursor=pointer]:
                    - /url: https://www.inquirer.com/philly-tips/how-to-order-philly-cheesesteak-20210609.html
                  - text: .” And it surpassed my expectations. I started getting them every weekend! (It was so bad …)
                - paragraph [ref=f1222e223]: I recently tried Angelo’s and Del Rossi’s, and I like theirs a lot, too. But Joe’s steaks are still my favorite — with Cooper sharp and onions.
            - generic [ref=f1222e224]: Liana Dunnell , Social
