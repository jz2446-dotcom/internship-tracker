                - heading "One of America's oldest farmers market and current food paradise ..." [level=3] [ref=f1222e316]
              - generic [ref=f1222e321]:
                - paragraph [ref=f1222e322]:
                  - text: Set below a former railroad terminal,
                  - link "Center City" [ref=f1222e323] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/areas/philadelphia-neighborhoods/center-city/
                  - text: ’s 133-year-old
                  - link "Reading Terminal Market" [ref=f1222e324] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/things-to-do/food-drink/reading-terminal-market/
                  - text: serves as both a dazzling tourist destination and a trusted source for fresh produce, seafood, meats and cheese for locals.
                - paragraph [ref=f1222e325]: The public space also provides open seating where customers can enjoy a world of cuisines from dozens of restaurants, including Pennsylvania Dutch vendors and sandwich slingers like the acclaimed DiNic’s, serving up hot roast pork sandwiches that rival the city’s much-lauded cheesesteaks. Retail merchants sell housewares, jewelry, linens and more.
                - paragraph [ref=f1222e326]:
                  - text: Let us help you narrow down your choices with our guide to
                  - link "15 of the best things to eat in Reading Terminal Market" [ref=f1222e327] [cursor=pointer]:
                    - /url: https://www.visitphilly.com/articles/philadelphia/best-things-to-eat-at-reading-terminal-market/
                  - text: .
              - generic [ref=f1222e328]:
                - figure
                - generic [ref=f1222e335]:
                  - generic [ref=f1222e336]: Visit Philly staff says...
                  - paragraph [ref=f1222e337]:
                    - text: My Reading Terminal trips usually start with a latte from
                    - link "Old City Coffee" [ref=f1222e338] [cursor=pointer]:
                      - /url: https://oldcitycoffee.com/
                    - text: and a stop at
                    - link "Beiler’s" [ref=f1222e339] [cursor=pointer]:
                      - /url: https://www.beilersdoughnuts.com/
                    - text: for a maple bacon donut. It sounds odd — bacon on a donut — but it’s surprisingly tasty. And hard to get! They’re normally sold out by lunchtime.
                  - paragraph [ref=f1222e340]:
                    - text: I also can’t walk into Reading Terminal and not grab a Reuben from
                    - link "Hershel’s East Side Deli" [ref=f1222e341] [cursor=pointer]:
                      - /url: http://www.hershelseastsidedeli.com/
                    - text: . The first time I saw the sandwich, I was mesmerized by how big it was. It’s hard to finish by myself, but it’s perfect for sharing with a friend.
