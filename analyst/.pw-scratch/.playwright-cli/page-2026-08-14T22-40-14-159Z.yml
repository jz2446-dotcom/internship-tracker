      - paragraph [ref=f1769e640]:
        - link "Diversity and Non-discrimination" [ref=f1769e641] [cursor=pointer]:
          - /url: https://inclusive.princeton.edu/about/our-commitment-equal-opportunity-and-non-discrimination
        - strong [ref=f1769e642]: "Equal Opportunity and Non-discrimination at Princeton University:"
        - text: Princeton University believes that commitment to equal opportunity for all is favorable to the free and open exchange of ideas, and the University seeks to reach out as widely as possible in order to attract the most qualified individuals as students, faculty, and staff. In applying this policy, the University is committed to nondiscrimination on the basis of personal beliefs or characteristics such as political views, religion, national origin, ancestry, race, color, sex, sexual orientation, gender identity or expression, pregnancy and related conditions, age, marital or domestic partnership status, veteran status, disability and/or other characteristics protected by applicable law in any phase of its education or employment programs or activities. In addition, pursuant to Title IX of the Education Amendments of 1972 and supporting regulations, Princeton does not discriminate on the basis of sex in the education programs or activities that it operates; this extends to admission and employment. Inquiries about the application of Title IX and its supporting regulations may be directed to the University’s Sexual Misconduct/Title IX Coordinator or to the Assistant Secretary for Civil Rights, Office for Civil Rights, U.S. Department of Education. See Princeton’s
        - link "full Equal Opportunity Policy and Nondiscrimination Statement" [ref=f1769e643] [cursor=pointer]:
          - /url: https://rrr.princeton.edu/equal-opportunity-policy
        - text: .
