      - heading "Our top tips" [level=2] [ref=f177e178]
      - generic [ref=f177e182]:
        - heading "Refine your CV" [level=2] [ref=f177e183]
        - paragraph [ref=f177e185]: Your CV tells us who you are before we have the chance to meet you. To make the best impression, use a template to keep formatting consistent and organised, with clear headings and bullet points to make the content easier to read. One page is ideal at the start of your career, so keep information succinct and relevant to the role you are applying for. Highlight your main achievements and don't be afraid to explain any gaps up front!
        - generic:
          - list
      - generic [ref=f177e189]:
        - heading "Prepare prepare prepare" [level=2] [ref=f177e190]
        - paragraph [ref=f177e192]: A successful job interview takes preparation. Make sure you've taken the time to find out about our main business areas, core values, recent news and what makes us different from other financial institutions. Be ready to explain why Rothschild & Co appeals to you and why you think you'd be a good addition. Also, ensure that you are preparing a variety of examples of how you’ve used relevant skills in different situations, not just in your academics. Good luck!
        - generic:
          - list
      - generic [ref=f177e196]:
        - heading "Success at interview" [level=2] [ref=f177e197]
        - paragraph [ref=f177e199]: Once you're in front of the interviewer, listen carefully and ask questions if you're unclear what we're asking. Give details of your experiences and specific examples of the skills we're looking for. Try to relax and ask us questions. We invited you in for a reason and can't wait to hear what you have to say.
        - generic:
          - list
