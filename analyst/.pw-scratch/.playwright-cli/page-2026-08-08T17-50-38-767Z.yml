              - /url: /en/five-arrows/
            - text: .
        - paragraph [ref=f177e65]: Each offers the opportunity to develop a broad set of skills, from accounting, valuation and modelling, to working closely with client portfolios alongside our investment and client teams.
    - generic [ref=f177e66]:
      - generic [ref=f177e69]:
        - img "Person seated in an office meeting area, listening and taking notes" [ref=f177e71]
        - generic [ref=f177e72]:
          - heading "Purpose" [level=3] [ref=f177e73]
          - paragraph [ref=f177e75]: Internships offer you the chance to learn more about what we do and get a head-start on applying for a full-time position once you finish your studies. They're also a great way for us to start getting to know the talented people who might one day be our senior leaders. And last but not least, you will get to spend time making new friends and working with like-minded people.
