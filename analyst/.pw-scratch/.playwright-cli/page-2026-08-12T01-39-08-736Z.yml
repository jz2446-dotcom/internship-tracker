                  - strong [ref=f573e309]: "Disclosures of your Information:"
                  - text: In order to administer and manage the job application process, and to otherwise perform the activities set forth in this Notice, your information will be shared with other Hilton personnel, such as personnel responsible for hiring determinations, members of the human resources team, as well as other employees and individuals within Hilton involved in the recruitment and selection process. Hilton will provide franchisee entities with access to your information if you are applying for a job with a franchise property.
                - generic [ref=f573e311]: Your information will be shared with various third party service providers engaged by Hilton to support its recruitment efforts for its corporate offices and owned and managed properties. These third parties include human resources services, performance management and talent management, and back office IT systems suppliers and providers.
                - generic [ref=f573e313]: We will also share information with legal and regulatory authorities and our accountants, auditors, lawyers and other outside professional advisors.
