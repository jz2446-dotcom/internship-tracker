                  - listitem [ref=f573e320]: when we believe in good faith that disclosure is required by law or to protect the safety of our employees, the public or Hilton property.
                - strong [ref=f573e322]: International Data Transfers
                - generic [ref=f573e324]: We reserve the right to transfer your personal information to, or process your personal information in, countries that have not been found to provide adequate protection of data pursuant to a country-specific law. In particular, for the Global Careers Site, we collect and store the personal information you provide via the Careers Site in the United States.
                - generic [ref=f573e326]:
