                        - /url: mailto:DataProtectionOffice@Hilton.com
                      - text: or Hilton Data Protection Office, 7930 Jones Branch Drive, McLean, VA 22102, USA. Please note, however, that certain personal information may be exempt from access, correction or deletion rights pursuant to applicable data protection laws.
