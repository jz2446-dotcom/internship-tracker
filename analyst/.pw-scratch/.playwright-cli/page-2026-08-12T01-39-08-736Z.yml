                  - generic [ref=f573e676]:
                    - text: Hilton Enterprise Management (Shanghai) Co., Ltd. is the data controller with respect to your personal information and can be contacted by email at
                    - link "DataProtectionOffice@Hilton.com" [ref=f573e677] [cursor=pointer]:
                      - /url: mailto:DataProtectionOffice@Hilton.com
                    - text: "or at the following address:"
                  - generic [ref=f573e679]: 32/F, New Bund Center, No. 555 West Haiyang Road, Pudong New Area,Shanghai, 200126, China
                  - strong [ref=f573e682]: Information We Collect
                  - emphasis [ref=f573e685]: Information You Provide
                  - generic [ref=f573e687]: "Hilton may collect personal information in connection with your submitting to apply to, or searching for a position on, the Hilton Careers Sites. Information You Provide: Applicant Name, Gender, Nationality, Email, Mobile, Date of Birth, Education, Work Experience."
                  - text: "We do not require, but you may voluntarily choose to provide, other relevant information as part of your application. Please do not submit the following sensitive information unless we specifically request that you provide such information so that we may comply with our legal obligations and/or internal policies relating to inclusion and anti-discrimination: race, ethnic origin, religion, political and religious beliefs, disability, marital status, creed, national origin, color, veteran status and/or age."
                - text: By voluntarily submitting information about your racial or ethnic origin; physical or mental health or condition; job evaluations or educational records; commission (or alleged commission) of an offence or related proceedings; political opinions or beliefs; religious beliefs; sex life; membership in a trade union or political party, you expressly authorize Hilton to receive and process such information for the purpose of processing your application.
