                - generic [ref=f573e587]: We do not sell or share, as those terms are defined under the CCPA, the above categories of Personal Information.
                - generic [ref=f573e589]: We do not use or disclose your Sensitive Personal Information for purposes that, with limited exceptions, are not necessary for the application or recruitment related purpose for which we collect it or as reasonably expected by an average individual in this context or for other permitted purposes under the CCPA or as authorized by regulation.
                - generic [ref=f573e591]:
                  - strong [ref=f573e592]: Retention.
                  - text: We retain your Personal Information for as long as is necessary for the recruitment process, assess and or process your application for employment, consider you for future positions, etc. and in accordance with the Company’s data retention schedule.
                - generic [ref=f573e594]: We may retain your Personal Information for longer if it is necessary to comply with our legal or reporting obligations (for example, if we are required to retain your data to comply with applicable laws), resolve disputes, enforce our legal agreements and policies, address other legitimate business needs, or as permitted or required by applicable law.
                - generic [ref=f573e596]: We may also retain your Personal Information in a deidentified or aggregated form so that it can no longer be associated with you.
                - generic [ref=f573e598]: To determine the appropriate retention period for your Personal Information, we consider various factors such as the amount, nature, and sensitivity of your information; the potential risk of unauthorized access, use or disclosure; the purposes for which we collect or process your personal information; and applicable legal requirements. Personal information does not include certain categories of information, such as publicly available information from government records, and deidentified or aggregated consumer information.
                - generic [ref=f573e600]:
                  - strong [ref=f573e601]: Individual Rights Requests
                  - text: . Individuals who are residents of the State of California have certain individual rights, which are outlined below.
                - generic [ref=f573e603]:
                  - emphasis [ref=f573e604]: Right To Know About Personal Information Collected or Disclosed.
                  - text: "As a California resident, you have the right to request additional information, beyond that disclosed above, regarding the following, to the extent applicable:"
            - blockquote [ref=f573e606]:
              - generic [ref=f573e607]: • the categories of Personal Information the Company collected about you
              - generic [ref=f573e611]: • the categories of sources from which that Personal Information was collected
              - generic [ref=f573e615]: • the business or commercial purposes for which that information was collected, sold, or shared
              - generic [ref=f573e619]: • the categories of third parties to whom the information was disclosed
              - generic [ref=f573e623]: • the specific pieces of Personal Information collected
            - generic [ref=f573e628]:
              - generic [ref=f573e629]:
                - generic [ref=f573e631]: Upon receipt of a verifiable request to know (see below), and as required by applicable law, we will provide a response to such request.
                - generic [ref=f573e633]:
                  - emphasis [ref=f573e634]: Right To Request Deletion of Your Personal Information.
                  - text: You have the right to request that we delete the Personal Information we collected or maintain about you. Once we receive your request, we will let you know what, if any, Personal Information we can delete from our records, and will direct any service providers and contractors to whom we disclosed your Personal Information to also delete your Personal Information from their records.
                - generic [ref=f573e636]: "There may be circumstances where we cannot delete your Personal Information or direct service providers or contractors to delete your Personal Information from their records. Such instances include, without limitation, when the information at issue is maintained: (a) to enable solely internal uses that are reasonably aligned with your expectations based on your relationship with the Company and compatible with the context in which you provided the information, or (b) to comply with a legal obligation."
                - generic [ref=f573e638]: Upon receipt of a verifiable request to delete (see below), and as required by applicable law, we will provide a response to such requests.
                - generic [ref=f573e640]:
                  - emphasis [ref=f573e641]: Right to Request Correction
                  - text: . You have the right to request that the Company correct any inaccurate Personal Information we maintain about you, taking into account the nature of that information and purpose for processing it. Upon receipt of a verifiable request to correct (see below), and as required by the CCPA, we will provide a response to such requests.
                - generic [ref=f573e643]:
                  - emphasis [ref=f573e644]: Right to Non-Discrimination for the Exercise of Your Privacy Rights
                  - text: . We will not discriminate or retaliate against you for exercising any of the rights described above.
                - generic [ref=f573e646]:
                  - strong [ref=f573e647]: Submitting CCPA Rights Requests.
                  - text: "To submit a California Consumer Rights request, please visit our website at datarights.hilton.com or click the \"Personal Data Requests\" link at the bottom of any Hilton website to submit your request. You also may call our toll-free telephone number: (800) 413-7470, email the Data Protection Office (\"DPO\") at"
                  - link "DataProtectionOffice@hilton.com" [ref=f573e648] [cursor=pointer]:
                    - /url: mailto:DataProtectionOffice@hilton.com
                  - text: . We reserve the right to only respond to verifiable consumer requests to know, delete, or correct.
                - generic [ref=f573e650]:
                  - emphasis [ref=f573e651]: What to submit
                  - text: . If we request, you must provide us with sufficient information to verify your identity and/or authority to act on behalf of a CA resident. In general, we may ask you to provide identifying information that we already maintain about you. In either event, we will try to avoid asking you for sensitive Personal Information to verify your identity. We may not be able to respond to your request or provide you with Personal Information if we cannot verify your identity or authority to make the request and confirm the Personal Information relates to you. However, making a verifiable consumer request does not require you to create an account with us.
                - generic [ref=f573e653]: Additionally, you will need to describe your request with sufficient detail to allow us to review, understand, assess, and respond. We will not use the Personal Information we collect from an individual to determine a verifiable request for any other purpose, except as required or permitted by law.
                - generic [ref=f573e655]:
                  - emphasis [ref=f573e656]: Our response.
                  - text: We reserve the right to charge a fee to process or respond to your request if it is excessive, repetitive, or manifestly unfounded. If we determine that a request warrants a fee, we will attempt to notify you as to why we made that decision and provide a cost estimate before completing your request. We will endeavor to respond to a verifiable consumer request within forty-five (45) calendar days of receipt, but we may require an extension of up to forty-five (45) additional calendar days to respond and we will notify you of the need for the extension.
                - generic [ref=f573e658]:
                  - emphasis [ref=f573e659]: Spouses, Dependents, and Associates
                  - text: . If you have knowledge that the Company collected Personal Information related to your spouse or dependent, please share a copy of this notice with all such individuals.
                - generic [ref=f573e661]:
                  - strong [ref=f573e662]: Changes to this Notice
                  - text: . We reserve the right to amend this Notice.
                - generic [ref=f573e665]:
                  - strong [ref=f573e667]: ADDENDUM
                  - strong [ref=f573e669]: PROVISIONS APPLICABLE TO PROCESSING OF PERSONAL INFORMATION OF APPLICANTS TO THE CHINA CAREERS SITE
                  - generic [ref=f573e671]: If you are an applicant applying via the Hilton China Careers Site, the Notice (including the Appendices) will apply as supplemented by the provisions of this Addendum. To the extent there is any conflict between this Addendum and the Notice, this Addendum will take priority in respect of such conflict.
