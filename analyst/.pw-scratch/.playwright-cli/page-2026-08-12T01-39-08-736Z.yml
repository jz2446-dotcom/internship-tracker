            - strong [ref=f573e59]: Hilton
            - strong [ref=f573e63]: Applicant Privacy Notice
            - generic [ref=f573e65]:
              - strong [ref=f573e66]: "Last Updated:"
              - text: March 2026
            - generic [ref=f573e68]: Hilton Worldwide Holdings Inc. and its direct and indirect subsidiaries ("Hilton", "we", "our" or "us") value the trust of individuals submitting job applications on the Hilton Global Careers Site or the Hilton China Careers Site (together "Careers Sites" and each a "Careers Site") ("you" or "Applicant") and are committed to the responsible management, use and protection of personal information. This Applicant Privacy Notice (this "Notice") applies to all the information collected by Hilton to facilitate your job application and includes your use of our Careers Sites. This Notice explains how Hilton processes the personal information that we collect through the job application process ("personal information") on our Career Sites. Please note that this Notice applies only to (1) Hilton's processing of your personal information on the Careers Sites and (2) Hilton’s processing of your personal information if you are applying for a Hilton corporate position or a position at a property that is managed by Hilton.
            - generic [ref=f573e70]: If you are applying for a position at a franchised property, the franchised property will process your personal information in accordance with its own policies and procedures, which may be provided to you via a separate privacy policy.
            - generic [ref=f573e72]: The Global Careers Site is operated by Hilton, 7930 Jones Branch Drive, McLean, Virginia, USA 22102, in order to support the global recruitment functions of Hilton and Hilton properties. The China Careers Site is operated by Hilton Enterprise Management (Shanghai) Co., Ltd., 32/F, New Bund Center, No. 555 West Haiyang Road, Pudong New Area,Shanghai, 200126, China, in order to support the recruitment functions of Hilton and Hilton properties in China (for the sole purpose of this Notice, including Hong Kong Special Administrative Region, and excluding Macau Special Administrative Region and Taiwan). The Careers Sites are not intended for distribution or use in any jurisdiction or country where such distribution or use would be contrary to local law or regulation.
            - generic [ref=f573e74]:
              - generic [ref=f573e75]: "Where local laws impose greater obligations or restrictions on the use of personal information, or require additional information to be provided to you, this Notice may be supplemented by local policies or procedures that are specific to a particular region, country or entity:"
              - generic [ref=f573e77]:
                - text: •
                - generic [ref=f573e78]:
                  - text: In particular,
                  - strong [ref=f573e79]: Appendix A
                  - text: to this Notice includes additional information applicable to Applicants residing in countries that have enacted privacy laws giving certain additional rights to residents of those countries. These countries include, but are not limited to, those in the European Economic Area, the United Kingdom and Switzerland (collectively, the "EEA"), Argentina, Australia, Brazil, Canada, Israel, Japan, Kenya, Nigeria, and Turkey.
                - text: Where additional consent, consultation or other rights exist under local laws, Hilton's processing of personal information will be subject to the exercise of those rights.
              - generic [ref=f573e81]:
                - text: • For applicants who are residents of California, please see
                - strong [ref=f573e82]: Appendix B
                - text: for additional information regarding how we collect and use your personal information in accordance with the California Consumer Privacy Act.
              - generic [ref=f573e84]:
                - text: • For applicants visiting the China Careers Site, please also consider the
                - strong [ref=f573e85]: Addendum
                - text: to this Notice.
              - generic [ref=f573e87]: In some locations around the world, Hilton manages hotel properties on behalf of a third party owner. At many of those properties, the hotel owner (and not Hilton) is the actual employer, and Hilton performs recruiting and hiring functions on behalf of the owner. You understand and agree that, by applying through our Careers Sites, you may be applying for a position with a company other than Hilton, where Hilton is serving as the recruiter, but will not be your employer of record.
            - generic [ref=f573e88]:
              - generic [ref=f573e90]: If you accept a position with Hilton or the hotel owner, you will be considered a Hilton "Team Member" and a separate notice will govern our use of your personal information.
              - generic [ref=f573e92]: Some positions listed on the Hilton Careers Sites are for positions with a franchised property. For these positions, the franchise management company or property owner (and not Hilton) is the actual employer. By providing access to the Careers Sites, Hilton does not perform or exercise any direction, oversight or control over any recruiting or hiring functions on behalf of franchisees and allows access to its Careers Sites for applicants of these franchise entities as an optional resource only.
              - generic [ref=f573e94]: You understand and agree that, by applying through our Careers Sites, you may be applying for a position with a franchised property (not Hilton) and Hilton will not be your employer of record.
              - strong [ref=f573e97]: Your Acknowledgement
              - generic [ref=f573e99]: Please read this Notice carefully and indicate your acknowledgment and acceptance of our collection, retention, use, transfer and disclosure of personal information as described in this Notice by clicking the "I Accept" button and clicking the relevant boxes (where applicable) at the end of this Notice.
              - generic [ref=f573e101]: Your personal information may be transferred to countries outside your home country, including countries where data protection laws may differ from those of your home country.
              - generic [ref=f573e103]:
                - text: Hilton maintains safeguards designed to protect your personal information. Please see
                - strong [ref=f573e104]: Appendix A
                - text: for additional information.
              - strong [ref=f573e107]: Information We Collect
              - generic [ref=f573e109]:
                - generic [ref=f573e110]: Hilton may collect personal information in connection with your submitting to apply to, or searching for a position on, the Hilton Careers Sites. This includes information you provide as well as passive information collection, where permitted by applicable law.
                - generic [ref=f573e112]: Information You Provide
                - list [ref=f573e114]:
                  - listitem [ref=f573e115]: Log-in and password, for users of the applicable Careers Site;
                  - listitem [ref=f573e116]: Information on how you found out about the job;
                  - listitem [ref=f573e117]: Identifiers and contact information including names and addresses, telephone numbers, mobile telephone numbers, email addresses, dates of birth, Social Security numbers, driver's license or state identification numbers, bank account information, and other similar contact information and identifiers);
                  - listitem [ref=f573e118]:
                    - text: "Professional and employment-related information including:"
                    - list [ref=f573e119]:
                      - listitem [ref=f573e120]: data submitted with employment applications including employment history and experience, employment recommendations or references, employment preferences, willingness to relocate, willingness to travel, desired salary, CV, résumé, cover letter, etc.
                      - listitem [ref=f573e121]: background check and criminal history;
                      - listitem [ref=f573e122]: work authorization;
                      - listitem [ref=f573e123]: fitness for duty data and reports;
                  - listitem [ref=f573e124]: Education information including education history such as education level, school, major, certifications held, etc.
                  - listitem [ref=f573e125]: Protected classification information including characteristics of protected classifications under applicable law by your self-identification (such as Age range, Gender, Religion, Disabled, Ethnic Group).
                  - listitem [ref=f573e126]: Internet or other electronic network activity information including all activity on the Hilton Careers Sites or Hilton information systems, such as search history on the Careers Site.
                  - listitem [ref=f573e127]: Audio, Electronic, Visual, Thermal, Olfactory, or Similar Information. This category includes, for example, information collected from cameras, and similar devices.
                - generic [ref=f573e128]: "Hilton may also collect the following information from applicants in the United Kingdom and Ireland and other EEA jurisdictions, as well as Canada:"
                - list [ref=f573e130]:
                  - listitem [ref=f573e131]: Right to Work Document Type;
                  - listitem [ref=f573e132]: For Visa/Work Permits, the type of such permit;
                  - listitem [ref=f573e133]: "Related to a Right to Work Document or Permit: Document Number, Country of Issue, Place of Issue, Issue Date, Expiration Date."
                - generic [ref=f573e134]: "We do not require, but you may voluntarily choose to provide, other relevant information as part of your application. Please do not submit the following sensitive information unless we specifically request that you provide such information so that we may comply with our legal obligations and/or internal policies relating to inclusion and anti-discrimination: sex, race, ethnic origin, religion, political and religious beliefs, disability, marital status, creed, nationality, national origin, color, veteran status and/or age."
                - generic [ref=f573e136]: By voluntarily submitting information about your racial or ethnic origin; physical or mental health or condition; job evaluations or educational records; commission (or alleged commission) of an offence or related proceedings; political opinions or beliefs; religious beliefs; sex life; membership in a trade union or political party, you expressly authorize Hilton to receive and process such information for the purpose of processing your application.
                - generic [ref=f573e138]: Any information you submit must be true, complete, and not misleading and you must have the lawful right to provide it. If not, this may lead to a rejection of your application during the application process or disciplinary action including immediate dismissal if you have been hired.
                - generic [ref=f573e140]: If you intend to provide us with details of a reference or any other third party as part of your CV/resume, it is your responsibility to obtain consent from that third party prior to providing his/her personal information to us.
                - generic [ref=f573e142]: The provision of personal information, including on the Careers Sites, is voluntary. Please note however that the failure to provide sufficient information may result in you being unable to be considered for employment.
                - emphasis [ref=f573e145]: "Passive Information Collection: Cookies and Similar Technology"
                - generic [ref=f573e147]: We and our service providers may use "cookies" and similar technologies on the Careers Sites. Cookies are data that a web server transfers to an individual's computer for record keeping purposes. We use cookies and other technologies to better serve you with more tailored information and facilitate your ongoing access to and use of our Careers Sites. If you do not want information collected through the use of cookies, there is a simple procedure in most browsers that allows you to automatically decline cookies, or to be given the choice of declining or accepting the transfer of a particular cookie, or cookies from a particular website, to your computer. However, if you decline session management cookies, the Careers Sites may not function properly for you.
                - generic [ref=f573e149]: If you are a resident of certain countries, we are required to obtain your consent before placing certain cookies or similar technology on your computer. We will separately prompt you for this consent before we attempt to place a cookie or similar technology on your computer.
                - strong [ref=f573e152]: Legal Bases, Use, and Disclosure of Personal Information
                - generic [ref=f573e154]: The information that you submit on the Hilton Global Careers Site will be stored in the United States (and in the relevant jurisdiction(s) if the job relates to one of our franchise companies or affiliated entities outside of the United States). As a reminder, you may be applying for a position at a franchised property in which case, the franchised property will process your personal information in accordance with its own policies and procedures, which may be provided to you via a separate privacy policy.
                - generic [ref=f573e156]: "Personal information may be collected, used, transferred and disclosed by employees, consultants and/or service providers of Hilton within the location where you reside or around the world (as applicable) for Hilton's recruitment functions and for related management and planning purposes, including, as permitted by local law, to:"
                - list [ref=f573e158]:
                  - listitem [ref=f573e159]: Maintain personnel records and record retention requirements.
                  - listitem [ref=f573e160]: Prevent unauthorized access to or use of the Hilton's property, including Hilton's information systems, electronic devices, network, and data.
                  - listitem [ref=f573e161]: Investigate complaints, grievances, and suspected violations of Hilton policy.
                  - listitem [ref=f573e162]: Further Hilton’s equal opportunity efforts and inclusion programs. Improve safety of our facilities for employees, customers and the public with regard to use of Hilton property and equipment.
                  - listitem [ref=f573e163]: Confirm eligibility for employment and related checks regarding fitness for duty.
                  - listitem [ref=f573e164]: Conduct background checks if you are offered a job.
                  - listitem [ref=f573e165]: Comply with applicable state and federal health, labor, employment, benefits, workers compensation, disability, equal employment opportunity, workplace safety, and related laws, guidance, or recommendations.
                  - listitem [ref=f573e166]: Send surveys to collect feedback on your recruiting experience.
                  - listitem [ref=f573e167]: Conduct video interviews, including storing the interview.
                - generic [ref=f573e168]: Personal information about you will be added to respective Hilton's international candidate database and may be used for the purposes of considering whether your profile is suitable for other job vacancies at Hilton. If we elect to make you an offer, personal information you submit may be incorporated into our human resources system and used to manage the new-hire process. The processing of your personal information for these purposes is based on your consent. If you become a Team Member, any personal information that you submit may become part of your Team Member file and may be used for other employment/work-related purposes and otherwise in accordance with the Hilton Team Member Privacy Notice.
                - generic [ref=f573e169]:
                  - generic [ref=f573e171]: To the extent any use is inconsistent with or outside of the contemplated uses in this Notice, we will communicate it to you at the time of use.
                  - generic [ref=f573e173]: Personal information about you will be reviewed by Hilton Team Members or agents who have a business need to access such personal information and may include recruiters, human resources personnel, technical services personnel and managers or their designees.
                  - generic [ref=f573e175]: We may share personal information about you with selected service providers or consultants acting on our behalf, such as third parties assisting Hilton with the operation of the Careers Sites (including (a) Oracle (with its primary place of business at 2300 Oracle Way, Austin, TX 78741 USA), which is the Applicant Tracking System and hosts job openings for the Hilton Global Careers Site, (b) Phenom (with its primary place of business at 300 Brookside Ave., Building 18, Suite 200, Ambler, PA 19022), which hosts the Hilton Global Careers Site and talent relationship and content management system and (c) SHL (with its primary place of business at 1 Atwell Place, Thames Ditton, Surrey, KT7 ONE UK), which conducts job- specific candidate assessments for applicants to the Hilton Global Careers Site). For applicants visiting the China Careers Site, we may share personal information about you with selected service providers or consultants (including (a) Beisen (with its primary place of business at 3rd Floor, Building 3, Area A, ICON Dayuan International Center, No. 688, Middle Section, Tianfu Avenue, High-tech Zone, Chengdu, China), which is the Applicant Tracking System and hosts job openings for the Hilton China Careers Site, (b) HRLink (with its primary place of business at Room 501, Building 2, Jin Yu Creative Park, 496 Zhong Hua Xin Road, Shanghai, China), which performs organizational data synchronization services, (c) Shanghai digital certificate Certification Center Co., Ltd (with its primary place of business at Room 1808, 1809 and 1810, No. 1717 Sichuan North Road, Shanghai, China), which provides electronic signing services, and (d) SHL (with its primary place of business at 1 Atwell Place, Thames Ditton, Surrey, KT7 ONE UK), which conducts job-specific candidate assessments for applicants to the China Careers Site). Those third parties are required by contract to use appropriate measures to protect the confidentiality and security of personal information.
                  - generic [ref=f573e177]: "Hilton also may disclose personal information about you in order to:"
                  - list [ref=f573e179]:
                    - listitem [ref=f573e180]: Protect the legal rights, privacy, safety or property of Hilton or its Team Members, agents, contractors, customers or the public;
                    - listitem [ref=f573e181]: Protect the safety and security of visitors to our web sites or other properties;
                    - listitem [ref=f573e182]: Protect against fraud or other illegal activity or for risk management purposes;
                    - listitem [ref=f573e183]: Respond to inquiries or requests from legal authorities;
                    - listitem [ref=f573e184]: Permit Hilton to pursue available remedies or limit the damages that we may sustain;
                    - listitem [ref=f573e185]: Enforce our website Terms of Service;
                    - listitem [ref=f573e186]: Respond to an emergency;
                    - listitem [ref=f573e187]: Comply with the law or legal process;
                    - listitem [ref=f573e188]: Effect a license, sale or transfer of a business or assets (including in connection with any bankruptcy or similar proceedings); or
                    - listitem [ref=f573e189]: Manage acquisitions, mergers and re-organizations.
                  - strong [ref=f573e192]: Data Retention
                  - generic [ref=f573e194]: We are required to retain information relating to candidates applying for jobs via the Hilton Global Careers Site within the United States. We will retain your personal information for three years, or a longer time if required or allowable by applicable law, during which time we or a franchise company or affiliate may contact you regarding open positions. Personal Information of candidates applying for jobs in other parts of the world will be retained in accordance with local law. If there is no activity in relation to the personal information, Hilton may remove it from its database, subject to Hilton's data retention obligations and policies and any applicable legal or regulatory obligations or for the period of time permitted by local laws, for the purpose of considering whether your skills are suitable for other opportunities.
                  - generic [ref=f573e196]: Note that Hilton may delete personal information about you at any time (including your CV/resume), without any reason. Therefore, please retain your own copy of the personal information provided to us.
              - paragraph [ref=f573e197]
            - generic [ref=f573e198]:
              - strong [ref=f573e200]: Access, Correction and Deletion
              - generic [ref=f573e202]: If you choose to register on the Careers Sites, you may access, review, and change some of the personal information collected about you and stored on the Careers Sites by logging into the Careers Sites and choosing to update your account information. The updated profile will be used as the default the next time you apply for a job using your account online. To change personal information that you already have submitted for consideration for a specific position, please resubmit your application to update personal information about you that is associated with that job application. We encourage you to promptly update your personal information if it changes or is inaccurate. Upon your request, we will deactivate or remove your personal information from our active databases, although some information may be retained as permitted or required by law.
              - generic [ref=f573e204]:
                - text: If you have any questions or concerns about how we otherwise process personal information please contact us at
                - link "DataProtectionOffice@hilton.com" [ref=f573e205] [cursor=pointer]:
                  - /url: mailto:DataProtectionOffice@hilton.com
                - text: .
              - generic [ref=f573e207]:
                - text: You may access, modify or object to the use of personal information as permitted by applicable local law. Applicants who would like to review, update, or request that we delete their personal information should go to the
                - link "Data Subject Rights Portal" [ref=f573e208] [cursor=pointer]:
                  - /url: https://www.hilton.com/en/hilton-honors/personal-data-requests/
                - text: or should send a request in writing to
                - link "DataProtectionOffice@Hilton.com" [ref=f573e209] [cursor=pointer]:
                  - /url: mailto:DataProtectionOffice@hilton.com
                - text: or Hilton Data Protection Office, 7930 Jones Branch Drive, McLean, VA 22102, USA. Please note, however, that certain personal information may be exempt from access, correction or deletion rights pursuant to applicable data protection laws.
              - generic [ref=f573e211]:
                - text: If you are a resident of a country that grants you certain rights with respect to your personal information (such as EEA residents), you may have other rights with respect to your personal information, which are explained in
                - strong [ref=f573e212]: Appendix A
                - text: .
              - generic [ref=f573e214]:
                - text: If you are a China resident or applying via the Hilton China Careers Site, you may have other rights with respect to your personal information, which are explained in the
                - strong [ref=f573e215]: Addendum
                - text: .
              - strong [ref=f573e218]: Careers Site Security
              - generic [ref=f573e220]: We take reasonable precautions to safeguard the personal information transmitted between visitors and the Careers Sites and the personal information stored on our servers. Unfortunately, no method of transmitting or storing data can be guaranteed to be 100% secure. Do not send sensitive information via email. It is your sole responsibility to use the appropriate level of care whenever communicating with us.
              - generic [ref=f573e222]:
                - text: If you have reason to believe that your interaction with us is no longer secure (for example, you feel that the security of any account you might have with us has been compromised), you should immediately notify us of the problem by contacting us at
                - generic [ref=f573e223]:
                  - link "ISC@hilton.com" [ref=f573e224] [cursor=pointer]:
                    - /url: mailto:ISC@hilton.com
                  - text: .
              - generic [ref=f573e226]: Hilton hereby disclaims, as far as permitted by law, any liability for itself and its affiliated companies and contractors for any of your information sent to our Careers Sites that is lost, misused, illegally accessed, disclosed, altered or destroyed or not integrally or timely delivered to our Careers Sites.
              - strong [ref=f573e229]: Links to Other Websites
              - generic [ref=f573e231]: The Careers Sites may contain links to other websites. The operators of those other websites may collect information about you, through cookies or other technologies. If you link to another website, you will leave the Careers Sites and this Notice will not apply to your use of and activity on those other sites.
              - generic [ref=f573e233]: If you provide personal information through or on any other site, your transaction will occur on that website (not the Careers Sites) and the personal information you provide will be collected by, and controlled by, the privacy policy of that website operator.
              - generic [ref=f573e235]: Links on the Careers Sites to other websites are provided only as a convenience, and the inclusion of such links does not imply endorsement of the linked site. We encourage you to read the legal notice posted on those sites, including their privacy policies. We have no responsibility or liability for your visits to, or the data collection or use practices of, other sites.
              - strong [ref=f573e238]: Law Applicable to Job Application
              - generic [ref=f573e240]:
                - text: The Hilton Global Careers Site allows you to benefit from Hilton's centralized global recruitment function, while applying for jobs worldwide. The Hilton Global Careers Site is operated from the United States. Accordingly, any personal information you submit to the Hilton Global Careers Site will be collected in the U.S. and will be subject to U.S. laws. However, if we share your personal information with a Hilton entity located in another country in its capacity as a potential employer (or acting as a recruiter for a hotel owner), the Hilton entity will handle your personal information in accordance with this Notice. Franchisee entities may handle your information pursuant to a separate privacy notice they may provide to you. Any hiring or other employment-related decisions will be made by the hiring entity in accordance with the laws of the country where the job will be located. Where applicable, please see
                - strong [ref=f573e241]: Appendix A
                - text: for additional information on International Data Transfers.
              - strong [ref=f573e244]: About Children
              - generic [ref=f573e246]: The Careers Sites are not intended for minors under the age of 15 or the lawful age of employment (whichever is greater) in any country in which we operate.
              - strong [ref=f573e249]: Changes to the Notice
              - generic [ref=f573e251]: We reserve the right to amend this Notice at any time without advance notice in order to address future developments of Hilton, the Careers Sites or changes in industry or legal trends. We will post the revised Notice on the Careers Sites or announce the change on the home page of the Careers Sites. You can determine when the Notice was revised by referring to the "Last Updated" legend on the top of this Notice. Any changes will become effective upon the posting of the revised Notice on the Careers Sites. By continuing to use the Careers Sites following such changes, you will be deemed to have agreed to such changes. If you do not agree with the terms of this Notice, in whole or part, you can choose to not continue to use the Careers Sites.
              - strong [ref=f573e254]: Additional Privacy Provisions for Applicants from Certain Countries
              - generic [ref=f573e256]:
                - strong [ref=f573e257]: Please see Appendix A
                - text: for additional provisions that pertain to you if you are a resident of a country that has enacted a privacy law granting additional rights to residents of that country.
              - generic [ref=f573e259]:
                - strong [ref=f573e261]: APPENDIX A
                - strong [ref=f573e264]: ADDITIONAL PROVISIONS APPLICABLE TO PROCESSING OF PERSONAL
                - strong [ref=f573e266]: INFORMATION OF APPLICANTS FROM COUNTRIES WITH PRIVACY LAWS GRANTING ADDITIONAL RIGHTS TO INDIVIDUALS
                - generic [ref=f573e268]: For applicants from countries that have enacted privacy laws granting additional rights to individuals, this Appendix outlines certain additional information that Hilton is obligated to provide to you, as well as certain rights you have with respect to the processing of your personal information, pursuant to applicable local laws.
                - strong [ref=f573e271]: "Hilton Controller:"
                - generic [ref=f573e273]:
                  - text: Hilton Domestic Operating Company Inc. is the data controller with respect to your personal information and can be contacted by email at
                  - link "DataProtectionOffice@Hilton.com" [ref=f573e274] [cursor=pointer]:
                    - /url: mailto:DataProtectionOffice@Hilton.com
                  - text: "or at the following address:"
                - generic [ref=f573e276]: Hilton Data Protection Officer
                - generic [ref=f573e277]: 7930 Jones Branch Drive
                - generic [ref=f573e278]: McLean, Virginia 22102 USA
                - strong [ref=f573e281]: Purposes and Legal Basis for Processing
                - generic [ref=f573e283]: Hilton processes your personal information for the purpose of either recruiting and evaluating candidates for employment, or to allow franchisee entities to access your personal information if you are applying for a position at a franchised property. Hilton processes your information pursuant to its legitimate business interests and, in some cases, based on your consent.
