              - strong [ref=f573e395]: Purposes Personal Information, Including Sensitive Personal Information, Is Used
              - generic [ref=f573e396]:
                - strong
            - text: • Collecting and processing employment applications, including confirming eligibility for employment, background and related checks, drug tests, references, onboarding, and related recruiting efforts; evaluating an individual’s appropriateness for a particular position. • Retaining your information for consideration with respect to future job vacancies with Hilton. • Providing access to the Careers site. • Maintaining records and satisfying record retention requirements. • Communicating with applicants about a current application, future job opportunities or current and past employment. • Submitting relevant information to prospective employers (e.g., third party hotel owners for whom Hilton manages properties; franchisees, etc.) • Complying with applicable state and federal health, labor, employment, disability, equal employment opportunity, workplace safety, and related laws, guidance, or recommendations. • Preventing unauthorized access to, use, or disclosure of the Company’s property, including information systems and network. • Investigating complaints, grievances, and suspected violations of Company policy. • Further Hilton’s equal employment opportunity efforts and inclusion programs. • Facilitating the efficient and secure use of the Company’s information systems; ensuring compliance with the Company information systems policies and procedures. • Improving safety of applicants, employees, customers and the public with regard to use of Company property and equipment. • Improving efficiency. • Protecting the legal rights, privacy, safety or property of Company or its employees, agents, contractors, customers or the public. • Protecting against fraud or other illegal activity or for risk management purposes. • Investigating, responding to and managing legal claims against the Company and/or its personnel, including civil discovery in litigation. • Facilitating other business administrative functions and strategic activities, such as risk management, information technology and communications, financial management and reporting, workforce and succession planning, merger and acquisition activities, and maintenance of licenses, permits and authorization applicable to Company operations. • Sending surveys to collect feedback on your recruiting experience.
