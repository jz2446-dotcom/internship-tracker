                  - generic [ref=f573e361]: Identifiers and Contact information. This category includes names, addresses, telephone numbers, mobile numbers, email addresses, signatures, account names, dates of birth, bank account information, log-in and password for Careers site, and other similar contact information and identifiers.
                  - generic [ref=f573e363]: Protected Classification Information. This category includes characteristics of protected classifications under California or federal law.
