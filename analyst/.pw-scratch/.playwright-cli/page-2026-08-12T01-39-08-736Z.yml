                  - generic [ref=f573e353]: This Appendix B applies solely to individuals who are residents of the State of California as required under the California Consumer Privacy Act, as amended ("CCPA"). The other provisions of the Applicant Privacy Notice continue to apply, as applicable, except as modified in this Appendix B.
                  - generic [ref=f573e355]: This Notice at Collection ("Notice") describes the categories of Personal Information that Hilton Worldwide Holdings Inc., Hilton Domestic Operating Company Inc., Hilton Worldwide Manage Limited, any other company owned in whole or in part by Hilton Worldwide Holdings Inc., and any Hilton-owned, leased, and/or managed hotel ("Hilton" or "Company") may collect from California residents and the purposes for which such information may be collected and used. It also provides information concerning the Company’s record retention practices and rights you may have under the CCPA. Any terms defined within the CCPA have the same meaning when utilized within this Appendix B.
                - generic [ref=f573e357]:
