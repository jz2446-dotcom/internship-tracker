            - generic [ref=f323e127]:
              - term [ref=f323e128]:
                - heading "Job Summary" [level=2] [ref=f323e129]
              - definition [ref=f323e130]:
                - paragraph [ref=f323e131]:
                  - text: Under general supervision, is responsible for performing basic accounting, bookkeeping, and clerical duties to include, preparing reports, invoices, and statements and performing various accounting calculations and transactions. Working conditions are primarily inside an office environment. Exercises no supervision.
                  - strong [ref=f323e132]: Work Location
                  - text: Public Safety Headquarters - 315 S. Santa Rosa, San Antonio, TX 78205
                  - strong [ref=f323e133]: Work Schedule
                  - text: 7:45 a.m. - 4:30 p.m., Monday-Friday
              - term [ref=f323e134]:
                - heading "Essential Job Functions" [level=2] [ref=f323e135]
              - definition [ref=f323e136]:
                - paragraph
                - list [ref=f323e137]:
                  - listitem [ref=f323e138]: Reviews, processes and compiles various accounting transactions such as disbursements, pay and expense vouchers, paid and due remittances, checks and claims.
                  - listitem [ref=f323e139]: Maintains, audits, corrects, and receives all departmental cash turn-ins and prepares cash turn-in report.
                  - listitem [ref=f323e140]: Compiles and records interest charges.
                  - listitem [ref=f323e141]: Computes, prepares, verifies, and summarizes invoices for daily, weekly, and monthly data entry.
                  - listitem [ref=f323e142]: Balances books and compiles reports to show statistics, such as cash receipts and expenditures, accounts payable and receivable, profit and loss, and other items pertinent to the operation of an activity.
                  - listitem [ref=f323e143]: Maintains division or department petty cash fund.
                  - listitem [ref=f323e144]: Issues permits and collects associated fees.
                  - listitem [ref=f323e145]: Maintains files and records on all transactions.
                  - listitem [ref=f323e146]: Collects, counts, and verifies all incoming monies from City enterprises and prepares distribution reports for all revenue collected.
                  - listitem [ref=f323e147]: Produces various reports and statements.
                  - listitem [ref=f323e148]: Performs related duties and fulfills responsibilities as required
                - paragraph
              - term [ref=f323e149]:
                - heading "Job Requirements" [level=2] [ref=f323e150]
              - definition [ref=f323e151]:
                - paragraph
                - list [ref=f323e152]:
                  - listitem [ref=f323e153]: High school diploma or GED equivalent (recognized by the Texas Education Agency or a regional accrediting agency).
                  - listitem [ref=f323e154]: "One (1) year of bookkeeping, financial record keeping, or accounting clerical experience; Or completion of the SA: Ready to Work: Finance/Insurance or Professional Services/Other training program."
                - strong [ref=f323e155]: Preferred Qualifications
                - list [ref=f323e156]:
                  - listitem [ref=f323e157]: Experience with SAP.
                  - listitem [ref=f323e158]: Experience with Excel.
                  - listitem [ref=f323e159]: Experience with accounting software and systems.
                  - listitem [ref=f323e160]: Experience with accounts payable and/or receivable.
                - paragraph [ref=f323e161]:
                  - strong [ref=f323e162]: Applicant Information
                - list [ref=f323e163]:
                  - listitem [ref=f323e164]: Unless otherwise stated, applicants are permitted to substitute two years of related full-time experience for one year of higher education or one year of related higher education for two years of experience in order to meet the minimum requirements of the job. One year of full-time experience is defined as 30 or more hours worked per week for 12 months. One year of higher education is defined as 30 credit hours completed at an accredited college or university.
                  - listitem [ref=f323e165]: Applicants selected for employment with the City of San Antonio in this position must receive satisfactory results from pre-employment drug testing and background checks. If required for the position, a physical, motor vehicle record evaluation, and additional background checks may be conducted.
                  - listitem [ref=f323e166]: Please be advised that if selected for this position, information regarding employment history as it relates to the qualifications of the position will be needed for employment verification. Applicants claiming military service to meet the experience requirement for this position may attach a DD214 to the application.
                  - listitem [ref=f323e167]: If selected for this position, official transcripts, diplomas, certifications, and licenses must be submitted at the time of processing. Unofficial transcripts and copies of other relevant documents may be attached to the application for consideration in advance.
                - paragraph
              - term [ref=f323e168]:
                - heading "Knowledge, Skills, and Abilities" [level=2] [ref=f323e169]
              - definition [ref=f323e170]:
                - paragraph
                - list [ref=f323e171]:
                  - listitem [ref=f323e172]: Knowledge of bookkeeping and accounting procedures, principles, practices and techniques.
                  - listitem [ref=f323e173]: Knowledge of cash handling procedures and practices.
                  - listitem [ref=f323e174]: Knowledge of automated record keeping systems.
                  - listitem [ref=f323e175]: Skill in operating a ten key adding machine or calculator.
                  - listitem [ref=f323e176]: Skill in operating a personal computer.
                  - listitem [ref=f323e177]: Skill in utilizing an automated coin and currency counting machine.
                  - listitem [ref=f323e178]: Ability to operate a computer keyboard and other basic office equipment.
                  - listitem [ref=f323e179]: Ability to perform basic mathematical calculations.
                  - listitem [ref=f323e180]: Ability to develop clear and concise written and statistical reports.
                  - listitem [ref=f323e181]: Ability to calculate penalty and interest charges.
                  - listitem [ref=f323e182]: Ability to prepare books, ledgers, and files.
                  - listitem [ref=f323e183]: Ability to communicate effectively.
                  - listitem [ref=f323e184]: Ability to establish and maintain effective working relationships with the general public and City staff.
                - paragraph
            - text: "* * * * * * * * * * * * * *"
