        - generic [ref=f355e106]:
          - heading "Health Benefits" [level=3] [ref=f355e112]
          - paragraph [ref=f355e113]: Greystone offers medical, fertility and family building, vision, and dental insurance plan options, including a health savings account, Lyra health, and healthcare and dependent care flexible spending accounts to meet your family’s needs.
          - paragraph [ref=f355e114]: All our plans include telehealth services for remote consultations with doctors or nurses.
          - paragraph [ref=f355e115]:
            - text: The Transparency in Coverage Rule requires health insurers and group health plans to provide cost-sharing data to consumers.
            - link "This link" [ref=f355e116] [cursor=pointer]:
              - /url: https://www.anthem.com/machine-readable-file/search/
            - text: leads to the machine readable files that provide pricing data for covered items and services based on in-network negotiated payment rates and historical out-of-network allowed amounts between health plans and healthcare providers. The machine-readable files are formatted to allow researchers, regulators, and application developers to more easily access and analyze data.
      - generic [ref=f355e117]:
        - heading "Early Career Talent at Greystone" [level=2] [ref=f355e119]
        - generic [ref=f355e120]:
          - generic [ref=f355e122]:
            - heading "Analyst Program" [level=3] [ref=f355e123]
            - generic [ref=f355e124]:
              - paragraph [ref=f355e125]: As an analyst, you will gain exposure to our businesses, develop important relationships, and build career-enhancing skills through hands on learning and formal training classes. The Analyst Program is open to recent graduates and is suited to those with minimal work experience.
              - paragraph [ref=f355e126]: Successful candidates have a strong record of academic achievement and an interest in the financial markets.
              - paragraph [ref=f355e127]: During the program you will receive ongoing skill-based training and run special projects coached by senior professionals, all while having fun networking as a class.
          - generic [ref=f355e129]:
            - heading "Intern Program" [level=3] [ref=f355e130]
            - generic [ref=f355e131]:
              - paragraph [ref=f355e132]: Our summer internship program is for students pursuing an undergraduate degree and geared toward rising seniors. This is a unique opportunity to build the foundation for a strong career in commercial real estate by working side by side with the experts that drive the industry every day. Our interns learn by getting involved in real projects and helping their teams solve client’s problems.
              - paragraph [ref=f355e133]: During the program you will have direct access to senior leadership, develop a strong understanding of Greystone’s platforms, and take part in various networking opportunities as a class.
