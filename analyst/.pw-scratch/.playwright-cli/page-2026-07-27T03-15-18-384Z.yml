          - paragraph [ref=f410e99]: We believe in empowering every member of our team to make TPG a more innovative, creative, and effective organization. TPG is home to six employee affinity groups (EAGs) for veterans, women, LGBTQ+, Black, Hispanic, and Asian professionals that aim to build community through shared identities.
