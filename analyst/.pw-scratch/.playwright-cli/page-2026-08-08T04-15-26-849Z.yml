      - generic [ref=f180e131]:
        - heading "SMBC ANALYST PROGRAM" [level=3] [ref=f180e132]
        - generic [ref=f180e133]:
          - paragraph [ref=f180e134]: The SMBC Analyst Program offers entry level professionals with the opportunity and learning platform to grow their career as future leaders in corporate and investment banking and/ or global markets.
          - heading "Program Structure" [level=4] [ref=f180e135]
          - paragraph [ref=f180e136]: Our 18-month Analyst Program – comprising of two tracks, namely Corporate and Investment Banking; and Global Markets – is designed to equip you with fundamental skills to excel in the respective departments. You will benefit from being part of a dynamic work environment, gain hands-on experience by working alongside our industry experts, and have access to a broad range of financial services and products.
          - paragraph [ref=f180e137]: You will undergo a structured rotation across three business units, with each rotation lasting approximately six months.
          - paragraph [ref=f180e138]: Upon completion of the program, you have the opportunity to take up a permanent placement in a front office department. This will be based on your interest and subject to vacancies available. There will also be a 12-month post-program support with continued developmental opportunities, including an overseas work assignment (up to one month), subject to COVID-19 situation.
