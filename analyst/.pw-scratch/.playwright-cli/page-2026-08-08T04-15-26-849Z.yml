        - heading "Summer Internship" [level=3] [ref=f180e161]
        - generic [ref=f180e162]:
          - paragraph [ref=f180e163]: Want to gain exposure and insights into the banking industry? SMBC's 10-week Internship Program offers you the opportunity to do so.
          - paragraph [ref=f180e164]: The structured program is designed to provide interns with a well-rounded experience of working in a bank. Beyond having the opportunity to meaningfully learn and contribute to your team, you will also be given various exposure opportunities to learn from others, plan and assist in the implementation of bank-wide activities as well as network with leaders and fellow interns.
          - paragraph [ref=f180e165]: All students enrolled in university full-time are welcome to apply.
