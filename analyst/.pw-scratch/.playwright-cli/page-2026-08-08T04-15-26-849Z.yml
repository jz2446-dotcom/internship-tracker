      - generic [ref=f180e102]:
        - heading "Kick Off Your Career Journey Here" [level=2] [ref=f180e103]
        - paragraph [ref=f180e104]: At SMBC, you will be given deep exposure to the world of global banking.
        - paragraph [ref=f180e105]: As we continue to grow our footprint in the Asia Pacific, SMBC is looking for talented individuals who can support the achievement of our business goals and grow with us. We encourage our people to pursue ongoing professional development by offering training and international exchange programs as well as opportunities to participate in cultural, networking, and mentoring initiatives and programs.
        - paragraph [ref=f180e106]: With our keen focus on our people’s growth, we further their success as SMBC continues to service its clients around the world. Our people’s commitment to excellent client service, quality, and teamwork continues to fuel the growth of our institution and that of our clients.
        - paragraph [ref=f180e107]: Our Analyst and internship programs offer opportunities across SMBC’s business units. We hire individuals who have a deep interest in the financial markets, a drive for excellence, and an enthusiasm to be part of a team aligned with our values.
        - paragraph [ref=f180e108]: It all starts here.
