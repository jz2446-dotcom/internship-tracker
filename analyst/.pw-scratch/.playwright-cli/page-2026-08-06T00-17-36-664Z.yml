      - heading "Early Career Opportunities" [level=1] [ref=f99e58]
    - generic [ref=f99e62]:
      - heading "Why Start Here?" [level=4] [ref=f99e63]
      - paragraph [ref=f99e64]: At Liberty Bank, your career can begin with purpose. Whether you’re exploring your first professional experience, building skills through an internship or apprenticeship, or launching a long-term career in financial services, you’ll find more than just a job here. You’ll join a community-focused organization that invests in your growth, values your perspective, and empowers you to make a real impact starting on day one.
      - paragraph [ref=f99e65]: We believe students and early-career professionals bring fresh ideas, energy, and curiosity, and we’re committed to helping you turn that potential into a meaningful experience and lasting opportunity.
      - paragraph [ref=f99e66]
      - heading "What Sets Liberty Bank Apart?" [level=4] [ref=f99e67]
      - heading "Our Mission-Driven Culture" [level=6] [ref=f99e68]
      - list [ref=f99e69]:
        - listitem [ref=f99e70]:  We’re guided by a purpose to improve the lives of our customers, teammates, and communities.
        - listitem [ref=f99e71]:  Every role contributes to something bigger, helping individuals, families, businesses and communities thrive.
      - heading "Inclusive Workplace" [level=6] [ref=f99e72]
      - list [ref=f99e73]:
        - listitem [ref=f99e74]:  We value diverse perspectives and foster a culture where everyone feels welcomed, respected, and supported.
        - listitem [ref=f99e75]:  You’ll be encouraged to bring your authentic self to work while learning alongside teammates who are invested in your success.
      - heading "Opportunities for Long-Term Careers" [level=6] [ref=f99e76]
      - list [ref=f99e77]:
        - listitem [ref=f99e78]:  We support career growth from early exploration through long-term advancement, helping teammates build meaningful and evolving careers.
        - listitem [ref=f99e79]:  Through hands-on experience, mentorship, and structured development programs, we support growth that can extend well beyond your first role.
