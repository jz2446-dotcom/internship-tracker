        - generic [ref=f153e115]:
          - generic [ref=f153e116]:
            - heading "Life at Greystar" [level=2] [ref=f153e117]
            - paragraph [ref=f153e118]: Our focus on people, genuine relationships, and shared values has created a unique and defining culture. Our team members are key to that culture, and they share the story best.
            - generic [ref=f153e119]:
              - generic [ref=f153e123] [cursor=pointer]:
                - button "Play" [ref=f153e125]
                - img "Wistia video thumbnail"
              - generic [ref=f153e126]:
                - blockquote [ref=f153e127]:
                  - paragraph [ref=f153e129]: “Without a doubt, what I am most proud of is our incredible team. Greystar is made up of the most talented, hardworking, and caring people in the world, and I am so proud of our work each and every day.”
                  - generic [ref=f153e130]: Bob Faith, Founder, Chairman, and CEO
                - blockquote [ref=f153e131]:
                  - generic [ref=f153e132]:
                    - paragraph [ref=f153e133]: Project Coordinator, Development
                    - paragraph [ref=f153e134]: “Greystar is a company where doing your best comes naturally because of the positive environment they have established and maintained.”
                  - generic [ref=f153e135]: Whitney John
                - blockquote [ref=f153e136]:
                  - generic [ref=f153e137]:
                    - paragraph [ref=f153e138]: Community Manager, Property Management
                    - paragraph [ref=f153e139]: “You should have to have a passion for what you do, and you should have to have a passion for the company that you work for. I've never worked for a company as wonderful as Greystar. We're not just the largest multifamily company in the US, but in the world. I think that speaks loudly.”
                  - generic [ref=f153e140]: Ennis Sligh
                - blockquote [ref=f153e141]:
                  - generic [ref=f153e142]:
                    - paragraph [ref=f153e143]: Management Coordinator, Enterprise Services
                    - paragraph [ref=f153e144]: “When people ask me if I love what I do or who I work for, I never hesitate with my answer. The people at Greystar and the company as a whole truly care about you and support you to be the best version of yourself.”
                  - generic [ref=f153e145]: Dorothea Dinius
                - blockquote [ref=f153e146]:
                  - generic:
                    - generic:
                      - img "Derek Ramsey"
                    - generic [ref=f153e147]:
                      - paragraph [ref=f153e148]: Chief Financial Officer
                      - paragraph [ref=f153e149]: "\"Culture is the number one thing that we think about as a leadership team at Greystar. We try to build connections and bridges for open communication across business lines, and across geographies, so that everybody really understands what it's like to be a part of the Greystar team.\""
                  - generic [ref=f153e150]: Derek Ramsey
                - blockquote [ref=f153e151]:
                  - generic [ref=f153e152]:
                    - paragraph [ref=f153e153]: Technical Development Manager (UK)
                    - paragraph [ref=f153e154]: "\"The opportunities for personal development at Greystar have been phenomenal along with my long-term vision to get involved more in overseeing construction projects.\""
                  - generic [ref=f153e155]: Mandisa Khabo
          - generic [ref=f153e157]:
            - generic [ref=f153e160]:
              - tabpanel [ref=f153e161]:
                - generic [ref=f153e163]:
                  - heading "Our Culture" [level=3] [ref=f153e164]
                  - paragraph [ref=f153e165]: At Greystar, we are and always have been in the people business. We care about our residents, clients, and partners – and our focus on people defines our culture.
                  - paragraph [ref=f153e166]: Our teams are key to that culture, so we also strive to hire the best people in the business. “Our core values and our people are the heart of everything we do,” says Bob Faith, Greystar Founder, Chairman, and CEO. “Though times and technology change, it’s our people who have made Greystar the global leader in rental housing.”
              - tabpanel [ref=f153e169]:
                - generic [ref=f153e171]:
                  - heading [level=3] [ref=f153e172]: Recent Awards
                  - paragraph [ref=f153e173]: "Greystar is honored to have received numerous local, national, and global awards. Recently we received the 2025 PERE Award for Residential Investor of the Year, Global and the 2025 NMHC Top 50 as the #1 Manager, Owner, and Developer and the #2 Builder. This marks Greystar's 15th consecutive year as Top Manager."
              - tabpanel [ref=f153e174]:
                - generic [ref=f153e176]:
                  - heading [level=3] [ref=f153e177]: Pillars & Values
                  - paragraph [ref=f153e178]: Our Pillars and Values are at the center of everything we do at Greystar. Our Pillars guide "what we do" and our Values guide "how we do what we do."
                  - generic [ref=f153e179]:
                    - heading [level=4] [ref=f153e180]: "Pillars of Excellence:"
                    - paragraph [ref=f153e181]: People, Customer Satisfaction, Operational Excellence, Profitability, Growth, Community
                  - generic [ref=f153e182]:
                    - heading [level=4] [ref=f153e183]: "Core Values:"
                    - paragraph [ref=f153e184]: Integrity, Equality, Professionalism, Accountability, Service, Teamwork
              - tabpanel [ref=f153e185]:
                - generic [ref=f153e187]:
                  - heading [level=3] [ref=f153e188]: Culture & Engagement
                  - paragraph [ref=f153e189]: Our Core Values foster an environment where everyone is respected, supported, and empowered, creating the foundation for how we work with team members, residents, communities, and partners. Our commitment to making Greystar a great place to work for all is strengthened by the fact that these efforts are driven by our team members and championed by leadership. Together, we uphold a culture that reflects collaboration, accountability, and shared responsibility across the organization.
              - tabpanel [ref=f153e190]:
                - generic [ref=f153e192]:
                  - heading [level=3] [ref=f153e193]: Greystar Giving
                  - paragraph [ref=f153e194]: "In addition to giving back to local and global nonprofit organizations, Greystar has established a philanthropic initiative to support each other:"
                  - paragraph [ref=f153e195]: Stars in Need provides financial assistance to team members and their families experiencing significant hardships that lead to severe financial needs such as natural disasters or medical emergencies.
                  - paragraph [ref=f153e196]: Scholars offers financial assistance to dependents of Greystar team members and promotes the ongoing education of our youth who may be unable to attend college due to financial constraints.
              - tabpanel [ref=f153e197]:
                - generic [ref=f153e199]:
                  - heading [level=3] [ref=f153e200]: Sustainability
                  - paragraph [ref=f153e201]: At Greystar, we strive to make a big impact. We believe that energy management, sustainable practices, and the promotion of health and well-being help to preserve the environment for future generations. We are committed to addressing and minimizing sustainability risks and environmental impacts through continuous improvement of ESG (Environmental, Social, Governance) performance, sustainable design, and operation standards.
