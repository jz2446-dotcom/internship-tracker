      - heading "About Us" [level=2] [ref=f33e216]
      - region "Description of Department with its Contact Information" [ref=f33e218]:
        - generic [ref=f33e220]:
          - generic [ref=f33e222]:
            - paragraph [ref=f33e223]: The People and Internal Operations Department ensures efficient County operations and fosters a thriving workforce by integrating internal services and human resources management. The department provides facility, construction, fleet, and risk management, along with ADA compliance, real estate, security, and parking services.
            - paragraph [ref=f33e224]: It supports workforce development through performance management, employee training, diversity programs, and collective bargaining, while addressing workplace policies, payroll, and workforce metrics. Additionally, the department resolves discrimination cases through investigation and mediation. Serving County departments, employees, and the community, it is committed to operational excellence and an equitable workplace.
