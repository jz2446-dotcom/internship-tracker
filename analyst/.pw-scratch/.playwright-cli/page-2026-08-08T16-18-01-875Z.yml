      - generic [ref=f33e107]:
        - generic [ref=f33e111]:
          - text: Miami-Dade County is a workplace like no other. It features two of the largest and busiest ports in the nation – Port Miami and Miami International Airport – as well as Zoo Miami, the only tropical zoo in the continental United States.Its borders also include sunny beaches, the wide open-spaces of the Everglades and an urban metropolis, so it’s no surprise that it takes a diverse set of backgrounds and skillsets to deliver excellent service to our 2 million residents – and 16 million yearly visitors.From skilled trades to professional services, job opportunities at the County include just about every industry and every interest. Explore our offerings and find your fit at Miami-Dade County.Miami-Dade County is an Equal Opportunity Employer. Applicants and employees are protected from discrimination based on certain categories protected by local and federal law.Learn about the amazing
          - link "benefits" [ref=f33e112] [cursor=pointer]:
            - /url: https://www.miamidade.gov/resources/human-resources/documents/summary-of-benefits.pdf
          - text: Miami-Dade County offers. Questions? Check out the
          - link "FAQ" [ref=f33e113] [cursor=pointer]:
            - /url: /global/humanresources/jobs/faq.page
          - text: for some helpful answers.
