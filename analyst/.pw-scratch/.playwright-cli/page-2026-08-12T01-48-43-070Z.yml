                  - generic [ref=f991e220]: Founded at SAIC in 1976, the Video Data Bank (VDB) is a leading resource in the United States for video by and about contemporary artists. As part of a collaborative and dynamic team at SAIC’s Library + Special Collections, the Archive + Collection Manager of the Video Data Bank (VDB) administers the technical services required to support the curatorial, instructional, access, and distribution functions of VDB. Has oversight for the collection preservation, storage, and management of physical and digital collections, and contributes to collection development and processing. Manages digital assets, and maintains and organizes digital collections to ensure accessibility via the website and streaming platforms.
