      - heading "JOB OPPORTUNITIES" [level=2] [ref=e50]
      - separator [ref=e51]
    - generic [ref=e53]:
      - paragraph [ref=e54]: Rock Point is a vibrant and fast-growing church, averaging about 7,000 people each week, located in Queen Creek, Arizona. With approximately 51,800 residents, you can enjoy the benefits of small-town living not far from a metropolitan area with low crime rates, great shopping, and proximity to Downtown Gilbert with great eateries. Our community is rapidly growing, and young families make up the majority of the population. We're so excited to have recently finished construction on campus, which includes a new 1,400+ seat worship center and Rock Point Coffee Co. that is open daily to the community. Rock Point Church exists to point people to Jesus by loving people like Jesus. This means it affects every aspect of our relationship with others. We are committed to being a church where people are completely accepted, regardless of the issues they may be facing.
      - paragraph [ref=e55]: We believe that God has equipped all of us with talents unique to every individual that is important in building the Church. Our goal is to provide an environment where you can grow, develop, and strengthen those talents. We encourage those that attend Rock Point that becoming fully engaged means that we KNOW. GROW. GO. and that same concept applies to us as staff.
      - paragraph [ref=e56]:
        - generic [ref=e57]: Please note that a background check is required for all positions.
  - generic [ref=e62]:
    - heading "VOTED BEST" [level=4] [ref=e63]
    - heading "CHRISTIAN WORKPLACE" [level=2] [ref=e64]
    - separator [ref=e65]
    - paragraph [ref=e66]:
      - text: In 2018, Rock Point was certified by the Best Christian Workplaces Institute (BCWI) as one of the top churches at which to work. Lead Pastor Bill Bush and Executive Pastor Dave Sutherland are quoted in the BCWI Blog dated December 3, 2019,
      - link "The Most Important Question Every Leader Must Ask…" [ref=e68] [cursor=pointer]:
        - /url: https://workplaces.org/articles/certified-org-best-practice-story/most-important-question-leader
      - text: Says Bill, “What has really transformed our culture is who we hire. When you look for people who are going to fit, then culture fits. We’re not training our people thinking, ‘You better be these core values.’ Instead, you find people who are your core values.” “We’re really in the relationship business,” adds Dave. “We need to take care of our team and who they are as people and care for each one as a person in a healthy sustainable role, not stressed out and on the edge.” “And,” says Bill, “we can’t forget that one of our core values is FUN. To further the Body of Christ at Rock Point, we’re trying to do something that sometimes can be brutally hard. In all of this, we need to be able to laugh out loud…we take our jobs seriously, but don’t take ourselves seriously.”
  - generic [ref=e72]:
    - heading "ADDED EMPLOYEE PERKS" [level=2] [ref=e73]
    - separator [ref=e74]
    - list [ref=e75]:
      - listitem [ref=e76]: Employer-paid medical, dental, and vision for full-time employees
      - listitem [ref=e77]: 403(b) retirement plan for full-time and part-time employees (over 20 hours weekly)
      - listitem [ref=e78]: Free childcare offered weekly on Tuesday, Wednesday, and Thursday
      - listitem [ref=e79]: Generous hours offered for paid time off
      - listitem [ref=e80]: Multiple paid holidays including the week after Christmas and two days after Easter
  - generic [ref=e85]:
