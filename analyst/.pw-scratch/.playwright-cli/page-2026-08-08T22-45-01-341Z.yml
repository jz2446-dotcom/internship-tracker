              - paragraph [ref=f535e48]: Welcome to Sacramento Public Library Career Page!
              - paragraph [ref=f535e49]
              - paragraph [ref=f535e50]: The Sacramento Public Library is the fourth largest library system in California, serving more than 1.4 million residents in the City and County of Sacramento, including the incorporated cities of Citrus Heights, Elk Grove, Isleton, and Rancho Cordova. The system is a Joint Powers Authority, governed by a 15 member board comprised of elected officials from each of the member jurisdictions, with representation based on each jurisdiction's population. The Authority operates 28 libraries, including the Central Library in downtown Sacramento and has over 300 staff members, contains a collection of 1.5 million volumes and has an annual budget of $50 million. More than 700 thousand residents have library cards and 8 million items are circulated annually. The Library welcomes more than 4 million visitors annually. This is a great opportunity for qualified applicants.
              - paragraph [ref=f535e51]
              - paragraph [ref=f535e52]: You can now apply online by clicking on the job title you are interested in and clicking on the "Apply" link! After viewing the Job Description, click the 'Apply' tab. If this is the first time you are applying using our online job application, you will need to create an account and select a Username and Password. After your account has been established, you can upload it from a saved document on your computer, or manually enter your personal information. This application will be saved and used to apply for future job openings.
              - paragraph [ref=f535e53]
              - paragraph [ref=f535e54]:
                - strong [ref=f535e55]: Online applications are stored on a secure site. Only authorized employees and hiring authorities have access to the information submitted.
              - paragraph [ref=f535e56]: It is important that your application show all the relevant education and experience you possess. Applications may be rejected if incomplete.
