        - paragraph [ref=f106e299]: "Employees at every level are empowered to take ownership, contribute and make a lasting impact. Talented, highly motivated individuals who value a collaborate and innovative culture have the opportunity to make a meaningful impact for our clients by demonstrating the below qualities:"
        - list [ref=f106e300]:
          - listitem [ref=f106e301]:
            - strong [ref=f106e302]: "Client Relationship Skills:"
            - text: The judgment, poise, and preparedness to thoughtfully engage with clients and internal and external stakeholders.
          - listitem [ref=f106e303]:
            - strong [ref=f106e304]: "Collaboration:"
            - text: The ability to work effectively across teams, building strong relationships and contributing to shared goals with both colleagues and clients.
          - listitem [ref=f106e305]:
            - strong [ref=f106e306]: "Drive to Succeed:"
            - text: Ambition matched by focus, motivation, and commitment to excellence.
          - listitem [ref=f106e307]:
            - strong [ref=f106e308]: "Resilience:"
            - text: Adaptability and determination to excel in a fast-paced environment.
          - listitem [ref=f106e309]:
            - strong [ref=f106e310]: "Intellectual Curiosity:"
            - text: A passion for continued learning, complex problem solving, and innovative solutions that result in long term success for our clients and team.
          - listitem [ref=f106e311]:
            - strong [ref=f106e312]: "Analytical Thinking:"
            - text: Strong problem-solving skills, attention to detail, and the ability to think critically under pressure.
