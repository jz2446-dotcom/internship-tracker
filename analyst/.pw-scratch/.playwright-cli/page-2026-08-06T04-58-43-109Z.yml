          - heading "Opportunities with Google" [level=1] [ref=f21e98]
          - paragraph [ref=f21e99]: There’s no one kind of Googler, so Google is always looking for people who can bring new perspectives and life experiences to their teams. If you’re looking for a place that values your curiosity, passion, and desire to learn, if you’re seeking colleagues who are big thinkers eager to take on fresh challenges as a team, then you’re a future Googler.
