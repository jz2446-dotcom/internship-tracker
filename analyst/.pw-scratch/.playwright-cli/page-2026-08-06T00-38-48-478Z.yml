      - generic [ref=f202e87]:
        - generic [ref=f202e88]:
          - paragraph [ref=f202e89]: GROWING
          - paragraph [ref=f202e90]: SOMETHING
          - paragraph [ref=f202e91]: GREAT
        - generic [ref=f202e92]:
          - paragraph [ref=f202e93]: We grow our people to grow our business. We champion great people who bring ambition, curiosity, and high performance to the table as the guardians of our iconic and nostalgic brands.
          - paragraph [ref=f202e94]: Good isn't good enough. We choose greatness every day by making bold decisions and challenging what's ordinary. All while celebrating our wins — and failures — as we work together to transform the future of food.
      - generic [ref=f202e99]:
        - generic:
          - img "Kraft Heinz team member"
        - generic [ref=f202e100]:
          - generic [ref=f202e101]:
            - heading "OUR PURPOSE" [level=2] [ref=f202e102]:
              - text: OUR
              - generic [ref=f202e103]: PURPOSE
            - generic [ref=f202e104]:
              - img "Let's Make Delicious"
            - paragraph [ref=f202e105]: Our Purpose is an inspiring call to action – our reason to exist. It reminds us, day in and out, why we're here. After all, we are a food and beverage company – one whose products and brands spark joy, bring people together, and create memorable moments for people across the globe. With dedication and passion, we provide consumers and their families with products they know, love and trust. Quite simply, we help feed the world – and we do it deliciously.
          - generic [ref=f202e106]:
            - heading "OUR DREAM" [level=2] [ref=f202e107]:
              - text: OUR
              - generic [ref=f202e108]: DREAM
            - paragraph [ref=f202e109]: At Kraft Heinz, our Company Dream is to be the leader in elevating and creating food that makes you feel good. Our Dream points our way forward. We believe in making food that nurtures your body and warms your soul. Food that’s good for your health, and good for our planet. Food that delivers good value, with quality you feel good about serving to the people you love.
      - generic [ref=f202e112]:
        - generic [ref=f202e113]:
          - paragraph [ref=f202e114]: OUR
          - paragraph [ref=f202e115]: CULTURE
        - paragraph [ref=f202e117]: Our culture is the secret sauce that sets us apart and drives our success. It's the key ingredient that unites us, fosters a sense of belonging, and inspires us to lead the future of food. We are committed to attracting, developing, and retaining world-class talent, choose to welcome everyone at our table and believe our employee population should reflect the communities in which we operate. We believe in ownership and meritocracy, recognizing and rewarding our people for their achievements and impact as they grow their careers with us. Because great people make great companies, and we’re growing something great here at Kraft Heinz.
