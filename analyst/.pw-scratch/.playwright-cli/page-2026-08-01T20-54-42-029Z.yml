      - paragraph [ref=f323e64]: For more than 125 years, Nuveen’s vision of financing the future has expanded across continents, powering municipalities, connecting cities through infrastructure, and securing financial futures for millions worldwide. Today, as the investment manager of TIAA, we combine our comprehensive asset management expertise with TIAA's century-plus legacy of realizing financially secure retirements. This relationship offers you the focused expertise of a global asset manager alongside the stability of one of the world's most respected financial organizations.
