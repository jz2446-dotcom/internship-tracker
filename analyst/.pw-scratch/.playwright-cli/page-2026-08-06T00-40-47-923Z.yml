          - paragraph [ref=f44e113]:
            - generic [ref=f44e114]: I love the dynamic nature of my role as a software development engineer. Amazon maintains a startup-like culture where each team has the autonomy to choose their processes and tech approaches. We get to guide projects from conception to launch, often within months or even weeks. Collaborating with experts from engineers to product managers to UX designers brings new perspectives to our work. It's incredibly satisfying to be part of the entire development cycle and see our ideas come to life so quickly.
