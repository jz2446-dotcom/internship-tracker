        - generic [ref=f37e113]:
          - generic [ref=f37e119]:
            - blockquote [ref=f37e120]: This internship has been a rewarding experience. Spending 8 weeks with leaders who want to share their knowledge to help you grow your career is invaluable. I can confidently say that I have learned something new every day and I know this experience will be something I take with me as I open doors towards my future.
