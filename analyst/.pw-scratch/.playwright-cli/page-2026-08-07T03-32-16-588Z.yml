      - article [ref=f37e56]:
        - heading "The 2027 Pay It Forward Student Internship Program is eight weeks from June 7 to July 30, 2027" [level=3] [ref=f37e61]
      - generic [ref=f37e65]:
        - heading "About The Program" [level=2] [ref=f37e66]
        - paragraph [ref=f37e67]:
          - text: Coca-Cola UNITED’s Pay It Forward Student Internship Program is a paid, 8-week experience designed to immerse students in all aspects of our business. Interns rotate through key departments—including manufacturing, marketing, and distribution—followed by time in their field of study. The program includes mentorship, professional development, job shadowing, and networking with associates. It concludes with a final project and team graduation presentation to executive leadership. Some travel is required. Requirements – Juniors, seniors, or master’s degrees students attending an accredited college or university in good academic standing – Pursuing degree in field relevant to full time work at United – Must have a growth mindset and willingness to collaborate with cross-functional teams – Valid driver’s license required and obligation to maintain compliance with UNITED fleet policy – Reliable transportation – Minimum of 18 years old – Intern must have the ability to report into one of our 3 hub locations for the internship program (Birmingham, New Orleans or South Metro ATL) – Must be able to meet pre-employment guidelines (background check, safe driving record & drug screen)
          - strong [ref=f37e68]: "*Cannot graduate prior to May 2027*"
