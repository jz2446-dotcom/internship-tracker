          - paragraph [ref=f37e76]: At Coca-Cola UNITED, we are more than a beverage company. We are a family of associates who share a common purpose of family, service and community. Interns will have the opportunity to contribute to our Associates First culture and see first-hand how our core values shape our decisions and actions every day.
