      - heading "Your Summer internship induction" [level=3] [ref=f130e56]
      - paragraph [ref=f130e57]: In your week-long induction, we’ll cover technical and professional skills training, workshops, business speaker series, networking and social events, combined to give you a real flavour of life at BNP Paribas.
      - heading "During the programme" [level=3] [ref=f130e58]
      - paragraph [ref=f130e59]: Throughout your Summer internship you will be assessed for a Graduate role, so will undertake group projects and presentations to help with your personal and professional development. You’ll also have the opportunity to shadow colleagues to give you up-close exposure and an understanding of where your skills and strengths are.
