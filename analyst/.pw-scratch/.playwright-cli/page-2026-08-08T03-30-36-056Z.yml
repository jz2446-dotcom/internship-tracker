    - paragraph [ref=f130e28]: You can’t always know what your next career move should be. That’s why our Summer and Long-term internships are a great way to introduce you to the banking world, so you can decide if a career in this industry is right for you. This could be the start of something special.
  - generic [ref=f130e33]:
    - paragraph [ref=f130e34]: For those who have a genuine passion to explore investment banking as a career path, we offer Summer Internships across Global Markets (GM), Global Banking (GB), Technology, and Securities Services.
    - paragraph [ref=f130e35]: Through outstanding training and dedicated support over a nine-week programme, our Summer Internship provides you with every opportunity to prove yourself, getting you involved on live projects with real responsibility from the start. At the end of the programme, and as a penultimate-year student, you’ll have gained enough knowledge and experience to decide if it’s a world you’d like to explore further. We’ll invite those who perform well to join our renowned graduate programme, so this is your time to shine.
