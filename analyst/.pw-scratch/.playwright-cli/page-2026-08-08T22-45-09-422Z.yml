              - term [ref=f542e121]:
                - heading "Description" [level=2] [ref=f542e122]
              - definition [ref=f542e123]:
                - paragraph
                - paragraph [ref=f542e124]: The Sacramento Public Library is hiring for a Human Resources Partner position. This role functions as an HR generalist.
                - paragraph [ref=f542e125]:
                  - generic [ref=f542e126]:
                    - text: The
                    - strong [ref=f542e127]: Human Resources Partner (HR Partner)
                    - text: provides broad HR support across key functional areas, including benefits and leave administration, employee relations, labor relations, training and development, classification and compensation, talent acquisition, and performance management. The HR Partner serves as a strategic partner to leaders and employees, ensuring compliance with policies, regulations, and union agreements while supporting a positive, productive workplace. This role collaborates across departments to implement HR initiatives aligned with the library’s strategic goals and values.
                - paragraph
              - term [ref=f542e128]:
                - heading "Examples of Duties" [level=2] [ref=f542e129]
              - definition [ref=f542e130]:
                - paragraph [ref=f542e131]
                - list [ref=f542e132]:
                  - listitem [ref=f542e133]:
                    - strong [ref=f542e134]: "Benefits and Leave:"
                    - text: Administers benefits and leave programs, advises on enrollment, plan changes, wellness initiatives, and related inquiries, and ensures compliance with FMLA, ADA, workers’ compensation, and other applicable laws and policies.
                  - listitem [ref=f542e135]:
                    - strong [ref=f542e136]: "Classification and Compensation:"
                    - text: Develops and maintains job classifications and supports compensation programs aligned with job responsibilities, market data, organizational needs, and internal equity.
                  - listitem [ref=f542e137]:
                    - strong [ref=f542e138]: "Compliance and Policy:"
                    - text: Ensures compliance with federal, state, and local employment laws, including EEO and affirmative action requirements, and interprets HR policies, regulations, and bargaining agreements for staff and management.
                  - listitem [ref=f542e139]:
                    - strong [ref=f542e140]: "Employee Relations:"
                    - text: Advises on employee relations matters, disciplinary actions, workplace investigations, grievance resolution, and manager consultation to address concerns, interpret policy, and resolve conflict.
                  - listitem [ref=f542e141]:
                    - strong [ref=f542e142]: "Labor Relations and Workforce Administration:"
                    - text: Supports labor relations and related administration, including interpreting union agreements, labor negotiations, seniority lists, labor reports, disciplinary documentation, status changes, and separation processes in compliance with policy and bargaining agreements.
                  - listitem [ref=f542e143]:
                    - strong [ref=f542e144]: "Performance Management and Organizational Support:"
                    - text: Supports performance management, evaluations, and coaching, and partners with leadership to strengthen engagement, retention, and organizational effectiveness.
                  - listitem [ref=f542e145]:
                    - strong [ref=f542e146]: "Program Evaluation and Service Delivery:"
                    - text: Evaluates HR programs and service delivery to improve employee experience, operational effectiveness, cost efficiency, and compliance.
                  - listitem [ref=f542e147]:
                    - strong [ref=f542e148]: "Talent Acquisition:"
                    - text: Leads and supports full-cycle recruitment by partnering with leaders on staffing needs and managing sourcing, interviewing, selection, and onboarding.
                  - listitem [ref=f542e149]:
                    - strong [ref=f542e150]: "Training and Development:"
                    - text: Identifies training needs aligned with business objectives and supports learning and development efforts to reskill, upskill, and grow talent.
                - paragraph
              - term [ref=f542e151]:
                - heading "Qualifications" [level=2] [ref=f542e152]
              - definition [ref=f542e153]:
                - paragraph [ref=f542e154]:
                  - strong [ref=f542e155]: "EXPERIENCE and EDUCATION:"
                  - emphasis [ref=f542e156]: Any combination of equivalent education and experience that could likely provide the required knowledge and abilities is qualifying.
                - list [ref=f542e157]:
                  - listitem [ref=f542e158]: Bachelor’s degree in Human Resources, Business Administration, or related field, or equivalent experience.
                  - listitem [ref=f542e159]:
                    - text: 3 years of increasingly responsible HR experience
                    - generic [ref=f542e160]: in training and development, classification and compensation, employee relations, labor relations, performance management, talent acquisition, benefits and leave administration, or generalist roles
                    - text: .
                  - listitem [ref=f542e161]: Proficiency with HRIS, applicant tracking systems, and Microsoft Office Suite.
                  - listitem [ref=f542e162]: Strong communication and interpersonal skills, with the ability to build effective relationships across departments.
                  - listitem [ref=f542e163]: Strong organizational skills and the ability to manage multiple priorities in a fast-paced environment.
                - paragraph [ref=f542e164]: "Preferred Qualifications:"
                - list [ref=f542e165]:
                  - listitem [ref=f542e166]: HR experience in the public sector or unionized setting.
                  - listitem [ref=f542e167]: Professional certifications such as PHR, SHRM-CP, CCP, or related credentials.
                  - listitem [ref=f542e168]: Familiarity with retention strategies and employee engagement initiatives.
                - paragraph
              - term [ref=f542e169]:
                - heading "Supplemental Information" [level=2] [ref=f542e170]
              - definition [ref=f542e171]:
                - paragraph
                - paragraph [ref=f542e172]: "Knowledge of:"
                - list [ref=f542e173]:
                  - listitem [ref=f542e174]: HR practices, principles, and the ability to interpret them accurately for staff.
                  - listitem [ref=f542e175]: Thorough knowledge of common productivity software, including word processing, spreadsheet, file maintenance, online search, database tools, and relevant HRIS platforms.
                - paragraph [ref=f542e176]: "Skills and Abilities:"
                - list [ref=f542e177]:
                  - listitem [ref=f542e178]: Communicate clearly and effectively, both verbally and in writing.
                  - listitem [ref=f542e179]: Maintain strict confidentiality.
                  - listitem [ref=f542e180]: Organize, track, and maintain personnel records and related documentation accurately and efficiently.
                  - listitem [ref=f542e181]: Research, analyze, and present complex information clearly.
                  - listitem [ref=f542e182]: Build and maintain effective working relationships and collaborate as part of a team.
                  - listitem [ref=f542e183]: Understand customer needs and deliver responsive, service-focused support.
                  - listitem [ref=f542e184]: Take initiative to resolve issues and support a positive customer experience, regardless of assigned responsibility.
                  - listitem [ref=f542e185]: Respond to customer concerns promptly, accurately, and professionally.
                  - listitem [ref=f542e186]: Maintain attention to detail and follow through on assignments effectively.
                  - listitem [ref=f542e187]: Set priorities, manage workload effectively, and complete assignments accurately under pressure.
                  - listitem [ref=f542e188]: Contribute to a positive and productive work environment.
                  - listitem [ref=f542e189]: Keep relevant parties informed of major issues and recommend changes as appropriate.
                - paragraph
