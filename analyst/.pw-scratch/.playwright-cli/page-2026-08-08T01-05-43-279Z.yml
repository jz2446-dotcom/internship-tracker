                        - generic [ref=f11e152]: "Real Estate Expertise: Vast industry experience across multiple disciplines and expertise in providing custom-tailored solutions to our clients"
                      - paragraph [ref=f11e153]
                      - paragraph [ref=f11e154]:
                        - generic [ref=f11e155]: "Real Assets Expertise: Combining deep domain expertise with a thematic approach to identifying best-in-class managers"
                      - paragraph [ref=f11e156]
                      - paragraph [ref=f11e157]:
                        - generic [ref=f11e158]: "Efficient Execution: We seek to provide superior advice to our clients and focus on running well-organized transaction processes"
