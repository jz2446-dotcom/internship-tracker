                      - paragraph [ref=f11e140]: "Hodes Weill is a leading, global capital advisory firm focused on real estate, infrastructure and other real assets. Founded by David Hodes and Doug Weill in 2009, the firm offers specialist advice and capital raising services on a global basis to investment and fund managers, from its offices in New York, Hong Kong, London, Amsterdam, and Tokyo. The company is defined by:"
                      - paragraph [ref=f11e141]
                      - paragraph [ref=f11e142]:
                        - generic [ref=f11e143]: "Veteran Leadership: Five senior partners with an average of 37 years in the institutional market, and extensive advisory and capital raising experience"
                      - paragraph [ref=f11e144]
                      - paragraph [ref=f11e145]:
                        - generic [ref=f11e146]: "Long-Standing Industry Relationships: Trusted advisor to global real estate and real asset managers, operators and investors"
                      - paragraph [ref=f11e147]
                      - paragraph [ref=f11e148]:
                        - generic [ref=f11e149]: "Global Distribution: Team of 32 professionals based in New York, London, Amsterdam, Hong Kong, and Tokyo; maintaining relationships with ~1,700 institutions and consultants"
                      - paragraph [ref=f11e150]
