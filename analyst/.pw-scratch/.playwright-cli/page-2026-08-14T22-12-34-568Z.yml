      - heading "Assistant Director, School, Youth and Family" [level=1] [ref=f1304e7]
    - generic [ref=f1304e8]:
      - generic [ref=f1304e9]: We are Guggenheim, a global constellation of museums unlike any other in the world. Four museums on three continents, united by the power of groundbreaking art to connect us to ourselves and to each other. Since our founding in 1937, the Guggenheim has introduced, celebrated and brought to the public the newest voices and visions in modern and contemporary art. When Solomon R. Guggenheim and Hilla Rebay set out to share the joy they first experienced in discovering experimental art, they initiated the creative risk-taking that is today synonymous with “Guggenheim” throughout the world. Across the globe, each Guggenheim stands not just as a backdrop for visionary art but as masterpieces in and of themselves to experience.
      - strong [ref=f1304e14]:
        - generic [ref=f1304e15]: "SUMMARY OF POSITION:"
      - generic [ref=f1304e17]: The Assistant Director, School, Youth, and Family will work closely with the Director, Learning on the coordination, development, evaluation, and implementation of all programs, resources, and audience engagement strategy for K-12 students and teachers, teens, and families in the Museum’s galleries, school partnerships, and digital platforms.
      - strong [ref=f1304e24]:
        - generic [ref=f1304e25]: "SKILL AND EXPERIENCE REQUIREMENTS:"
      - generic [ref=f1304e29]:
        - generic [ref=f1304e30]: ●
        - generic [ref=f1304e32]: Minimum of 5 years of experience in the field of education, and arts; at least three years in a supervisory role.
      - generic [ref=f1304e36]:
        - generic [ref=f1304e37]: ●
        - generic [ref=f1304e39]: Demonstrated managerial experience
      - generic [ref=f1304e43]:
        - generic [ref=f1304e44]: ●
        - generic [ref=f1304e46]: Knowledge of Diversity, Equity, Access, and Inclusion issues within the field.
      - generic [ref=f1304e50]:
        - generic [ref=f1304e51]: ●
        - generic [ref=f1304e53]: Ability to establish and maintain effective relationships with collaborators at schools and community-based organizations as well as individual program participants.
      - generic [ref=f1304e57]:
        - generic [ref=f1304e58]: ●
        - generic [ref=f1304e60]: Excellent teaching skills with an emphasis on object-based and interactive approaches.
      - generic [ref=f1304e64]:
        - generic [ref=f1304e65]: ●
        - generic [ref=f1304e67]: Knowledge of museum education pedagogy and best practices.
      - generic [ref=f1304e71]:
        - generic [ref=f1304e72]: ●
        - generic [ref=f1304e74]: Excellent organizational and time management skills.
      - generic [ref=f1304e78]:
