    - main [ref=f329e178]:
      - generic [ref=f329e183]:
        - generic [ref=f329e185] [cursor=pointer]:
          - 'button "Share Options for Spotlight: Walmart Internships and Careers" [ref=f329e186]':
            - generic [ref=f329e187]: 
          - text:   
        - generic [ref=f329e188]:
          - figure [ref=f329e189]
          - generic [ref=f329e190]: "Spotlight: Walmart Internships and Careers"
          - paragraph [ref=f329e191]: “Always low prices” and “Save money. Live better.” These past and present Walmart taglines sum up the customer-focused business practices that have for decades kept them at the top of the Fortune 500 list. In fact, “Everyday low prices” has been the guiding pricing ethos around which they created their consistent, cost-effective retail tactics and marketing strategies. It is an approach that created unprecedented success and makes them a top prospect for students seeking internships, and graduating seniors looking for full-time employment.
          - paragraph [ref=f329e192]:
            - link "Tyler Platt" [ref=f329e193] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/tyler-platt-52266a106/
            - text: was one such job seeker in the fall of 2016 when she was preparing to graduate with a marketing degree from the Sam M. Walton College of Business. She now serves as a Pricing Analyst II, after working as a Walmart intern while still a student. “I chose Walmart because I interned there the summer before my senior year and loved the people and the culture,” Platt said. “I met the recruiters at an event hosted by Leadership Walton the day before the fall career fair. The recruiter invited me to come by the Walmart table at the career fair, and there I met a couple of Walmart associates who worked in merchandising. My internship was an absolutely amazing experience!”
          - paragraph [ref=f329e194]: Platt applied for a full-time position. She began in Walmart’s Merchant Talent Program after graduating from Walton College in May 2017. She spent six months in the training program learning merchandising functions and networking with other Walmart employees before beginning her pricing career in apparel. She now supports the hardlines business and enjoys sharpening her decision-making skills there.
          - paragraph [ref=f329e195]: “Honestly, whatever your skillset and what interests you, Walmart probably has a role you would enjoy,” Platt said. She is thankful her leadership places a big emphasis on personal development. The company’s networking events and shadowing opportunities help her improve her own teamwork skills, and she finds the collaborative environment welcoming and encouraging.
          - paragraph [ref=f329e196]:
            - link "Katie Womble" [ref=f329e197] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/katherine-womble12345/
            - text: feels the same way. She is a merchandising operations intern who plans to graduate from the Walton College. “Working at Walmart opens doors and doors of opportunities within the company,” Womble said. “I chose them because I knew I would be able to grow my skills exponentially and be sharpened and encouraged to grow.”
          - paragraph [ref=f329e198]: Womble was only there for a short summer internship, but she says she learned so much. “I have sharpened my business communication skills, analytical skills, and soft skills as well,” Womble said. She appreciates that Walmart entrusts their interns with responsibility, and believes it helps them feel they have an important role at the company. “This will help me tremendously in my ongoing business career to know that I can always make a difference, no matter the role.”
          - paragraph [ref=f329e199]: Walmart first came to life in the 1950’s when Sam Walton opened his five-and-dime on the square in Bentonville, AR. Back then it was known as Walton’s 5&10 and became Walmart in 1962 when they opened the first Walmart store in Rogers. The company went public in 1970. Since that time, Walmart has expanded to 49 states and Puerto Rico, and includes multiple international retail stores. It has made the Fortune 500 list 25 years and has been in the top spot multiple times, seven straight years of which were in the number one spot. It is an enterprise that requires diligence, focused strategies, and a lot of talent.
          - figure [ref=f329e200]:
            - img "walmart booth" [ref=f329e201]
          - paragraph [ref=f329e202]:
            - text: Walmart campus recruiter,
            - link "Zoe Barton" [ref=f329e203] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/zoerosebarton/
            - text: ", knows well the impact that talented interns and young graduates can have on the company. She began supporting the University of Arkansas’ relationship with Walmart in 2017, and has held many roles on her current team. Barton came to Walmart in 2014 and transitioned to her current department, Campus Recruiting, about a year later. This department has a big presence on the University of Arkansas campus, where they hosted 32 events in 2018 and hired about 90 students campus-wide. Barton already has 40 events on the calendar for the fall 2019 semester alone, one of which is the Walton College Fall Career Fair. “During this career fair, we speak with around 200 students and end up hiring close to 40! That combined with our hires from other events means we are hiring close to 70 Walton College students every single year,” Barton said. These students are hired into both internship and full-time roles. Those within the internship program are part of the approximately 300 interns hired nationwide to spend 10 weeks in a robust training program, after which approximately 85% are offered full-time employment."
          - paragraph [ref=f329e204]: New graduates like Tyler Platt in 2017 participate in rotational training programs for their focus areas, such as merchandising, audit, finance, and IT. Once they complete their department’s training program they are placed in permanent roles. From there they are encouraged to shadow other roles in other departments, to network and collaborate, to ask a lot of questions, to learn as much possible, and to enjoy the work-life balance Walmart offers. It should not be hard, as the corporate headquarters is a place that values collaboration.
          - paragraph [ref=f329e205]: They also place a high value on sustainability. Walmart first embraced sustainability as a practice after Hurricane Katrina in 2005. Laura Phillips has been with the company more than 20 years and earned an M.B.A. from the Walton College. She has worked in many positions from buying toys to leading their sustainability strategy as senior vice president of sustainability. She said Walmart challenged itself after Hurricane Katrina to use its assets for maximum environmental impact at scale and to strengthen its business through those efforts.
          - paragraph [ref=f329e206]: “Now, almost 15 years later, we have broadened and deepened the work across our entire company on sustainability,” Phillips said. “We have a sustainability team in each market where we operate globally, and embedded sustainability into all of our roles. For example – if you are a store manager – we want you thinking about the energy you are using and how to minimize food waste. If you are a buyer at Walmart, we want you to work with your suppliers to reduce emissions through our Project Gigaton initiative, and to make sure that all of your packaging is recyclable.”
          - paragraph [ref=f329e207]: Walmart has built sustainability into its values. It is a filter they apply to all of their decisions because they want all associates at Walmart to be part of sustainability, rather than it simply being a program managed by a small team in the corporate office.
