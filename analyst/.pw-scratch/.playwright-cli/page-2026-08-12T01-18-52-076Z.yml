    - main [ref=f337e58]:
      - generic [ref=f337e64]:
        - heading "Career Development and Growth" [level=1] [ref=f337e66]
        - blockquote [ref=f337e67]:
          - paragraph [ref=f337e68]: “My career could be described as less of a ‘ladder’ and more of a ‘lattice’, with horizontal moves where I had opportunities to learn and partner.” - CJ Spates, Head of Enterprise Experience Risk
        - generic [ref=f337e69]: At Citizens, we're committed to the growth and development of our colleagues, personally and professionally. We’re embracing new ways to approach work and evaluate the skills we have, the skills we need, and the skills we must build or acquire to thrive as an organization. It starts with investing in our people through programs and resources, allowing them to upskill and network across the company. In 2025, almost 30% of colleagues accepted new roles, bringing their skills and perspectives to the next step in their career journey.
      - generic [ref=f337e74]:
        - heading [level=2] [ref=f337e75]
        - paragraph [ref=f337e76]: The ever-changing world of skills requires us to be curious and continuous learners. We believe everyone has knowledge to gain and everyone has something to teach. What if you could map your skills out to chart career possibilities for your next 2-3 roles? Imagine taking the guesswork out of finding a mentor who possess the skills you want to build for yourself? Have you ever taken time to reflect on personal values and how they intersect with your work/life aspirations?
        - paragraph [ref=f337e77]:
          - generic [ref=f337e78]: We're committed to providing you with resources and tools to keep you relevant in the dynamic environment. It's our promise to help prepare you, and our company, for the future.
      - generic [ref=f337e80]:
        - paragraph [ref=f337e81]: At its core, Citizens Talent Matters™ is a tool intentionally designed for skill development. Accessible on your Day 1 as a colleague, and part of your ongoing development journey with us, you'll assess your strengths, identify gaps, find mentors, access relevant learning content to advance your development, and visualize steps to unlock future opportunities within Citizens.
        - paragraph [ref=f337e82]:
          - strong [ref=f337e83]: Our
          - text: . Talent. Matters.
          - strong [ref=f337e84]: Your
          - text: . Talent. Matters.
      - blockquote [ref=f337e87]:
        - paragraph [ref=f337e88]: “Skill development is at the forefront of this innovative tool. Enabling our colleagues’ preparation for the rapidly changing nature of roles will ensure that our company remains resilient, that we are growing, innovating and are ready for the future. This tool puts all colleagues in the driver’s seat of architecting their career experiences, enabling them to showcase and share skills while finding pathways to experiences and learnings that enhance their portfolio of skills.” - Susan La Monica, Chief Human Resources Officer
      - generic [ref=f337e90]:
        - paragraph [ref=f337e91]: To advance your development, there are additional programs and experiences available for our colleagues that keep your career growth front-and-center throughout your journey.
        - paragraph [ref=f337e92]:
          - strong [ref=f337e93]: "Academies:"
          - text: Citizens’ Academies prepare colleagues for the future by building in-demand skills to adapt to our rapidly evolving world. Each academy has engaging learning experiences that provide pathways for growth and recognition.
        - paragraph [ref=f337e94]: "Academies offered include: Agile, Business of Banking and Credit, Data and Analytics, Innovation, NeXT Gen Tech, and Leadership."
        - paragraph [ref=f337e95]:
          - strong [ref=f337e96]: 💡 In 2025, more than 9,900 colleagues used our Academies to build skills needed to adapt to our evolving world and propel our performance.
      - generic [ref=f337e99]:
        - heading "BRG Leadership Opportunities" [level=2] [ref=f337e100]
        - paragraph [ref=f337e101]:
          - text: Membership in any of our
          - link "7 Business Resource Groups (BRGs)" [ref=f337e102] [cursor=pointer]:
            - /url: https://jobs.citizensbank.com/diversity-inclusion
          - text: lets colleagues contribute to Citizens' diverse and inclusive culture. Roles for Colleague, Customer, Community, Communications, and Operations committees are open to everyone to gain new skills and experience outside of the day-to-day.
      - generic [ref=f337e103]:
        - generic [ref=f337e109]:
