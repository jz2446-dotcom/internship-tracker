      - generic [ref=f337e144]:
        - paragraph [ref=f337e145]:
          - strong [ref=f337e146]: "Citizens Learning Hub:"
          - text: Colleagues regularly use the Citizens Learning Hub to further develop the skills they have and invest in the skills they’ll need in the future. Self-paced learning experiences are delivered through on-demand virtual courses and content, allowing our colleagues to build necessary practices, skills, and habits.
        - paragraph [ref=f337e147]:
          - strong [ref=f337e148]: 💡 In 2025, over 98% of colleagues completed a total of 470,000+ hours of development and training.
          - strong
        - list
      - paragraph [ref=f337e153]:
        - generic [ref=f337e154]:
          - strong [ref=f337e155]:
            - strong [ref=f337e156]: "Career Advice & Guidance:"
          - text: Our Citizens Talent Acquisition team is committed to helping our own colleagues thrive through
        - text: 1:1 virtual meetings called Office Hours, scheduled at a colleague’s convenience. Our in-house recruiters tailor guidance across topics like resume tips, ways to find new roles at Citizens, how to effectively build your personal brand, and more.
      - generic [ref=f337e159]:
        - generic [ref=f337e160]:
          - strong [ref=f337e161]: "Leadership Development:"
          - text: We believe that everyone should engage in meaningful growth. Monthly company-wide manager meetings, leadership trainings, and guidance on career growth for individuals and their teams is part of our culture.
        - generic [ref=f337e162]:
          - paragraph [ref=f337e163]:
            - strong [ref=f337e164]: "24/7 Development & Career Conversations:"
            - text: Two-way dialogue about learning and growth doesn’t just happen at performance review time. Colleagues have ongoing, meaningful discussions with managers, mentors, and peers. Actionable goals are mapped at the start of each year, with midyear and year-end reviews, along with regular check-ins about opportunities to support growth. Colleagues play a role in their own development by seeking 360 feedback and are encouraged to network with colleagues outside of their direct team or departments.
          - paragraph [ref=f337e165]:
            - strong [ref=f337e166]: "Educational Assistance Program:"
            - text: Get financial support with 100% reimbursement of pre-approved tuition, books and expenses up to annual limits for eligible programs, covering a wide range of undergraduate, graduate, and certification courses.
            - link "Learn more here. (opens in new window)" [ref=f337e167] [cursor=pointer]:
              - /url: https://jobs.citizensbank.com/en/education-assistance
              - text: Learn more here.
              - generic [ref=f337e168]: (opens in new window)
          - paragraph [ref=f337e169]: Like what you hear? Join our Talent Community to stay up to date on the latest news and open roles.
