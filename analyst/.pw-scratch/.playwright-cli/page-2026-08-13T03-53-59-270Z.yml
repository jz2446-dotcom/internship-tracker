        - generic [ref=f437e43]: Description
        - paragraph [ref=f437e45]: The Morgan Library & Museum invites applications for the position of full-time Reading Room Assistant. This position facilitates researcher access to the Morgan’s special and reference collections while maintaining the security and safety of the collections. Among other duties, the Reading Room Assistant is responsible for retrieving, reshelving, and organizing materials for readers and staff, providing handling instructions for rare materials, performing reference desk duties, and data entry. This position reports to the Head of Reader Services and works closely and collaboratively with colleagues across the Morgan.
        - generic [ref=f437e46]: Requirements
        - list [ref=f437e48]:
          - listitem [ref=f437e49]: Bachelor’s degree required; a strong background in the humanities (Art History, History, or Literature) with a focus on rare books and manuscripts desired; ALA-accredited Master’s degree in library, archival, or information studies or equivalent, a plus
          - listitem [ref=f437e50]: 2–3 years previous work experience in a special collections library reading room or other relevant experience desired
          - listitem [ref=f437e51]: Excellent organizational and problem-solving skills and ability to sustain close attention to detail. Strong oral and written communication skills and ability to communicate with diverse library users and staff;
          - listitem [ref=f437e52]: Proficiency in Microsoft Office Suite, Google Suite (Docs, Sheets, Drive)
          - listitem [ref=f437e53]: Familiarity with Integrated Library Systems (i.e., Voyager or FOLIO)
          - listitem [ref=f437e54]: Familiarity with a major Western foreign language desired (i.e., French, German, Italian, or Spanish)
          - listitem [ref=f437e55]: Ability to handle and move heavy books and boxes and wheel carts of books and other collection objects around campus (25–50 lbs.), extensive walking, standing, kneeling, stooping, climbing up stairs and narrow spaces; ability to work for extended periods on a computer, and tolerate moderate levels of dust and odor generated during normal collection management activities, movement of objects, and cleaning
        - generic [ref=f437e56]: Salary Description
        - generic [ref=f437e57]: $56,000–$60,000 annually
