          - heading "Career opportunities at the Library of Congress" [level=2] [ref=f124e70]
          - paragraph [ref=f124e71]: The Library of Congress offers amazing opportunities. Located primarily on Capitol Hill in Washington, D.C., the Library is the home of the U.S. Copyright Office, the Congressional Research Service (CRS), the Law Library of Congress, and the National Library Service for the Blind and Print Disabled. We seek talent from various fields. Explore the possibilities and apply today.
          - paragraph [ref=f124e72]:
            - link "Visit loc.gov/careers " [ref=f124e73] [cursor=pointer]:
              - /url: /careers/
              - text: Visit loc.gov/careers
              - generic [ref=f124e74]: 
          - heading "Working at the Library" [level=2] [ref=f124e75]
          - paragraph [ref=f124e76]: The Library of Congress serves the Congress in fulfilling its duties and preserves and promotes knowledge and creativity for the benefit of the American people. It is the nation’s oldest federal cultural institution and the world’s largest library, with more than 170 million items in its physical collections (including books, manuscripts, prints, photos, film, video, and sound recordings) and millions of items online.
          - heading "Various types of Librarians" [level=2] [ref=f124e77]
          - list [ref=f124e78]:
