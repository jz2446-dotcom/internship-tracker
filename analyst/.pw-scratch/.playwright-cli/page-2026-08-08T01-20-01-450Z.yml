          - heading "Internship and Fellowship Opportunities Portal" [level=2] [ref=f124e119]
          - paragraph [ref=f124e120]: Internship and Fellowship Programs (IFP) promotes a portfolio of 60+ programs throughout the Library of Congress. Search our Opportunities portal to find volunteer and paid opportunities and a wide range of applied learning and career development placements. Whether you’re an undergraduate or graduate student, emerging professional, or established scholar, your career can find a launching pad in the world’s largest library.
          - paragraph [ref=f124e121]:
            - link "Visit loc.gov/ifp " [ref=f124e122] [cursor=pointer]:
              - /url: https://www.loc.gov/ifp
              - text: Visit loc.gov/ifp
              - generic [ref=f124e123]: 
          - heading "Junior Fellows Program" [level=2] [ref=f124e124]
          - paragraph [ref=f124e125]: "The Library of Congress Junior Fellows Program is an annual summer internship program that enables undergraduate and graduate students to experience the integrated analog and digital collections and services of the world’s largest, all-inclusive library. Fellows are exposed to a broad spectrum of library work: copyright; preservation; reference; access; and information. No previous experience is necessary, but fellowships are competitive and special skills or knowledge are usually desired."
          - paragraph [ref=f124e126]:
            - link "Visit loc.gov/item/internships/junior-fellows-program " [ref=f124e127] [cursor=pointer]:
              - /url: /item/internships/junior-fellows-program
              - text: Visit loc.gov/item/internships/junior-fellows-program
              - generic [ref=f124e128]: 
          - heading "Archives, History and Heritage Advanced Internship (AHHA)" [level=2] [ref=f124e129]
          - paragraph [ref=f124e130]: The AHHA program offers undergraduate juniors and seniors, graduate and doctoral students insights into the Library of Congress collections. Interns will work under the supervision and guidance of a senior specialist and learn the standards and techniques to properly arrange and provide online descriptions for archival collection materials. Responsibilities will include analyzing, organizing, and interpreting collections or programs that help share an inclusive story of the American experience.
          - paragraph [ref=f124e131]:
            - link "Visit loc.gov//item/internships/archives-history-and-heritage-advanced-internship-program/ " [ref=f124e132] [cursor=pointer]:
              - /url: /item/internships/archives-history-and-heritage-advanced-internship-program/
              - text: Visit loc.gov//item/internships/archives-history-and-heritage-advanced-internship-program/
              - generic [ref=f124e133]: 
          - text: "-->"
          - heading "Librarians-in-Residence" [level=2] [ref=f124e134]
          - paragraph [ref=f124e135]: "The Librarians-in-Residence program provides early-career librarians the opportunity to gain meaningful work experience in one of seven professional tracks:"
          - list [ref=f124e136]:
            - listitem [ref=f124e137]: Archives and Special Collections;
            - listitem [ref=f124e138]: Cataloging and Metadata;
            - listitem [ref=f124e139]: Collection Preservation;
            - listitem [ref=f124e140]: Community Engagement;
            - listitem [ref=f124e141]: Digital Services;
            - listitem [ref=f124e142]: Reference and Instruction; and
            - listitem [ref=f124e143]: Systems and Standards.
          - paragraph [ref=f124e144]: The program is open to students who have earned or will complete their master’s degree in library and information science from an American Library Association-accredited program within 18 months prior to the start of the residency.
          - paragraph [ref=f124e145]:
            - link "Visit loc.gov/item/internships/librarian-in-residence " [ref=f124e146] [cursor=pointer]:
              - /url: /item/internships/librarian-in-residence
              - text: Visit loc.gov/item/internships/librarian-in-residence
              - generic [ref=f124e147]: 
          - paragraph [ref=f124e148]: Scan the codes below to visit the Library’s listing of jobs and internships, or to sign up for the e-mail list to receive job alerts.
