          - generic [ref=f306e89]:
            - paragraph [ref=f306e90]:
              - strong [ref=f306e91]: About the Opportunity
            - paragraph [ref=f306e92]: Building on a lifetime of public service, President Clinton established the Clinton Foundation on the simple belief that everyone deserves a chance to succeed, everyone has a responsibility to act, and we all do better when we work together. For nearly two decades, those values have energized the work of the Foundation in overcoming complex challenges and improving the lives of people across the United States and around the world.
            - paragraph [ref=f306e93]: As an operating foundation, we work on issues directly or with strategic partners from the business, government, and nonprofit sectors to create economic opportunity, improve public health, and inspire civic engagement and service. Our programs are designed to make a real difference today while serving as proven models for tomorrow. The goal of every effort is to use available resources to get better results faster – at the lowest possible cost.
            - paragraph [ref=f306e94]: Interns are to be knowledgeable about the Clinton Presidential Center, President Clinton, and the work of the Clinton Foundation. The intern will work closely with the Museum and Admissions team.
            - paragraph [ref=f306e95]:
              - strong [ref=f306e96]: This Fall internship is onsite and will start September 9th, 2026, and ends November 13th, 2026.
            - paragraph [ref=f306e97]:
              - strong [ref=f306e98]: Core Responsibilities
            - paragraph [ref=f306e99]: "In this role you will/are:"
            - paragraph [ref=f306e100]: Interns are to provide courteous service to visitors and assist them in finding the product they are shopping for if requested.
            - paragraph [ref=f306e101]: They are to be familiar with the products in the store as well as the Clinton Presidential Center. The intern will need to be knowledgeable about all aspects of running the register, packing the purchase and providing a positive closure to the visitor.
            - paragraph [ref=f306e102]: There will be daily tasks such as learning to open and close the register, stock the store inventory, light cleaning and straightening of merchandise.
            - paragraph [ref=f306e103]: Interns will also conduct research for upcoming exhibit merchandise and potential new inventory.
            - paragraph [ref=f306e104]: Possibly interact with the marketing department to service their requests such as photographing merchandise for the website or advertising.
            - paragraph [ref=f306e105]:
              - strong [ref=f306e106]: Minimum Qualifications
            - paragraph [ref=f306e107]: "What we’re looking for:"
            - list [ref=f306e108]:
              - listitem [ref=f306e109]:
                - strong [ref=f306e110]: You must have a REAL ID or PASSPORT to be considered.
              - listitem [ref=f306e111]: Retail sales experience, marketing, and an outgoing personality.
            - paragraph [ref=f306e112]:
              - strong [ref=f306e113]: About the Clinton Foundation
            - paragraph [ref=f306e114]: Building on a lifetime of public service, President Clinton established the Clinton Foundation on the simple belief that everyone deserves a chance to succeed, everyone has a responsibility to act, and we all do better when we work together. For nearly two decades, that premise has energized the work of the Foundation in overcoming complex challenges and improving the lives of people across the United States and around the world.
            - paragraph [ref=f306e115]: As an operating foundation, we work on issues directly or with strategic partners from the business, government, and nonprofit sectors to create economic opportunity, improve public health, and inspire civic engagement and service. Our programs are designed to make a real difference today while serving as proven models for tomorrow. The goal of every effort is to use available resources to get better results faster – at the lowest possible cost.
            - paragraph [ref=f306e116]: We firmly believe that when diverse groups of people bring resources together in the spirit of true cooperation, transformative ideas will emerge to drive life-changing action.
            - paragraph [ref=f306e117]: The Clinton Foundation is committed to public health and to the safety and wellbeing of our colleagues, visitors, and volunteers. As such, we have adopted a policy requiring all employees whose positions require them to be on site to be vaccinated against COVID-19 or to meet the legal guidelines for an exemption.
            - paragraph [ref=f306e118]: Learn more at http://www.clintonfoundation.org, on Facebook at Facebook.com/ClintonFoundation and on Twitter @ClintonFdn.
            - paragraph [ref=f306e119]:
              - strong [ref=f306e120]: About the Clinton Presidential Center
            - paragraph [ref=f306e121]: The Clinton Presidential Center offers a unique perspective of the work – past, present, and future – of the 42nd President of the United States William Jefferson Clinton. Through year-round educational and cultural opportunities for visitors of all ages, it reflects President Clinton’s lifetime commitment to advancing opportunity for everybody, instilling responsibility throughout our society, and cultivating a sense of community within our great nation.
            - paragraph [ref=f306e122]: The Clinton Center is home to the Clinton Presidential Library and Museum, the Little Rock offices of the Clinton Foundation, the University of Arkansas Clinton School of Public Service, and is a managing partner of the Presidential Leadership Scholars program. The Clinton Center is located in a 29-acre city park along the Arkansas River and is also home to the Clinton Museum store and the award-winning restaurant 42 bar and table.
            - paragraph [ref=f306e123]:
              - text: Learn more at
              - link "www.clintonpresidentialcenter.org" [ref=f306e124] [cursor=pointer]:
