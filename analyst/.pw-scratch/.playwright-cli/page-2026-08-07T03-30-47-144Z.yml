        - img "A photographic portrait of Irmgard Naudin ten Cate" [ref=f132e137]
        - generic [ref=f132e138]:
          - blockquote [ref=f132e139]:
            - generic [ref=f132e140]: “
            - paragraph [ref=f132e141]: At EY, we look for shapers of the future. Join us to develop future-focused skills, innovate with leading edge technology and build an exceptional career collaborating across different cultures.
          - generic [ref=f132e142]: Irmgard Naudin ten Cate
          - generic [ref=f132e143]: EY Global Talent Attraction and Acquisition Leader
      - generic [ref=f132e147]:
        - heading "Why start here at EY?" [level=3] [ref=f132e148]
        - paragraph [ref=f132e149]: You’ll have the tools, flexibility and inclusive culture to help you shape your future with confidence. We’ll nurture your extraordinary talents, so you can take your career wherever you want it to go.
        - paragraph [ref=f132e150]: From internships and graduate programs to apprenticeships and international experiences, we offer a variety of ways to develop future-focused skills and contribute meaningfully.
        - paragraph [ref=f132e151]: "Whether you're starting your career or transitioning into a new one, you’ll collaborate with diverse teams, learn from industry leaders and build lifelong leadership skills, all while working toward our shared purpose: building a better working world."
        - heading "Internships and work experience programs" [level=3] [ref=f132e152]
        - paragraph [ref=f132e153]: Kickstart your career with an EY internship. Work on real projects, tackle meaningful challenges and gain insights into professional life in an inclusive and innovative environment. Our various work experience programs also offer an immersive introduction to professional life. With training and support, you’ll contribute to projects and solutions for clients, gaining valuable skills and insights to help you shape your future with confidence.
        - heading "What our interns have to say:" [level=3] [ref=f132e154]
      - generic [ref=f132e157]:
        - blockquote [ref=f132e158]: “ A willingness to learn at EY means gaining new experiences and creating connections with people who will help you reach your goals. ”
        - generic [ref=f132e159]:
          - paragraph [ref=f132e160]: Jonathan Smith
          - paragraph [ref=f132e161]: Accounting Student, EY Americas Launch Intern
      - generic [ref=f132e164]:
        - blockquote [ref=f132e165]: “ You’ll receive continuous feedback on your work, fostering a safe space for learning. Being integrated into various teams also provides a rich opportunity to improve your teamworking skills. ”
        - generic [ref=f132e166]:
          - paragraph [ref=f132e167]: Nicoline Søholt Christensen and Christoffer Møller Rønfeldt
          - paragraph [ref=f132e168]: EY EMEIA Assistants, Transaction Dilligence, Strategy and Transactions
      - generic [ref=f132e171]:
        - blockquote [ref=f132e172]: “ I love the diversity of the people I work with – we have more than twenty-five languages spoken in our office alone. I also love the insight gained from a broad client portfolio, ranging from the sports sector to the medical industry. ”
        - generic [ref=f132e173]:
          - paragraph [ref=f132e174]: Luke Alligan
          - paragraph [ref=f132e175]: EY EMEIA Assurance Business Apprenticeship Programme
