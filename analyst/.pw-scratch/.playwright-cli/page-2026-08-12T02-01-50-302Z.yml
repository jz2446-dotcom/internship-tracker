        - generic [ref=f860e40]: Description
        - generic [ref=f860e41]:
          - paragraph [ref=f860e42]:
            - strong [ref=f860e43]: "ABOUT REINVESTMENT FUND:"
          - paragraph [ref=f860e44]: At Reinvestment Fund, we are dedicated to making a tangible difference in the lives of underserved individuals and communities. Our mission is to create opportunity for underserved people and places through partnerships. We marshal the capital, analytics, and expertise necessary to build strong, healthy, and more equitable communities.
          - paragraph [ref=f860e45]
          - paragraph [ref=f860e46]: As a federally certified community development financial institution (CDFI), our job is to make finance an agent of positive change and equitable growth. We provide loans, grants and technical assistance to businesses and nonprofits. Our borrowers and grantees educate students, support local economies, and create jobs. They build affordable housing and provide community goods and services that include access to nutritious food, hunger relief, physical and mental health care, and other social services.
          - paragraph [ref=f860e47]
          - paragraph [ref=f860e48]:
            - strong [ref=f860e49]: "ABOUT THE POSITION:"
            - text: Reinvestment Fund seeks a Civic Data Director to serve as departmental lead on production of interactive mapping tools and static graphics for clients.
          - paragraph [ref=f860e50]
          - paragraph [ref=f860e51]:
            - strong [ref=f860e52]: "RESPONSIBILITIES:"
          - list [ref=f860e53]:
            - listitem [ref=f860e54]: Serve as departmental lead on production of interactive mapping tools and static graphics for clients.
            - listitem [ref=f860e55]: Lead quantitative and geographic analysis components for selected external research projects with complex data needs and interactive deliverables.
            - listitem [ref=f860e56]: Develop and advise staff on design guidelines.
            - listitem [ref=f860e57]: Delegate data processing tasks to junior staff and ensure quality and accuracy of results.
            - listitem [ref=f860e58]: Acquire and integrate essential and novel datasets into database.
            - listitem [ref=f860e59]: Monitor data releases and updates.
            - listitem [ref=f860e60]: Lead timely data imports and integrate into existing databases.
            - listitem [ref=f860e61]: Research new and substitute data sources as necessary.
            - listitem [ref=f860e62]: Present new databases and data tools to internal users.
            - listitem [ref=f860e63]: Refine and oversee use of department resources hub that stores a wide range of team’s intellectual properties, including research methodologies, code templates, mapping and graphics standards.
            - listitem [ref=f860e64]: Provide support to guide proper and full utilization of available resources.
            - listitem [ref=f860e65]: Work with managers and project teams to identify gaps based on changing needs.
            - listitem [ref=f860e66]: Design and implement database improvements by continually analyzing infrastructure of civic databases (including geodatabase) and processes.
            - listitem [ref=f860e67]: Plan and oversee improvements to workflow, QA/QC, processing and retrieval speeds, and automation.
            - listitem [ref=f860e68]: Remain up-to-date on best practices and technological solutions most suitable to unique databases needs for the department.
            - listitem [ref=f860e69]: Monitor and respond to emerging department data needs.
            - listitem [ref=f860e70]: Implement transformational projects and manage phasing to ensure operational continuity.
            - listitem [ref=f860e71]: Lead technical training by developing, updating, and overseeing use of technical training materials.
            - listitem [ref=f860e72]: Orient new staff to data environment.
            - listitem [ref=f860e73]: Lead weekly code reviews for analysts to execute collaborative problem-solving, innovative practices, and cross-training.
            - listitem [ref=f860e74]: Solicit targeted team feedback to keep training relevant and practical to day-to-day tasks.
            - listitem [ref=f860e75]: Serve as departmental lead on all collaboration with IT, PolicyMap, Lending/Programs Department Data & Analytics group, and external tech support teams (e.g., ESRI) to address any issues related to database design and management, SQL, and other technology tools.
            - listitem [ref=f860e76]: Represent Policy Solutions as subject matter expert on civic data management and use.
        - generic [ref=f860e77]: Requirements
        - generic [ref=f860e78]:
          - paragraph [ref=f860e79]: To perform this job successfully, an individual must be able to perform each essential duty satisfactorily. The requirements listed below are representative of the knowledge, skill, and/or ability required. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions.
          - list [ref=f860e80]:
            - listitem [ref=f860e81]: U.S. Master’s degree (or foreign degree equivalent) in City and Regional Planning, or related urban planning field.
            - listitem [ref=f860e82]: 3 years of experience in the job offered or related occupation.
            - listitem [ref=f860e83]: Advanced experience designing and executing geographic and statistical analysis within an SQL programming environment.
            - listitem [ref=f860e84]: Experience identifying data infrastructure needs and implementing solutions within an SQL programming environment.
            - listitem [ref=f860e85]: Experience bridging the needs and skills of technical, program, and business operations staff.
            - listitem [ref=f860e86]: Advanced knowledge in applied research across multiple dimensions of community development such as housing markets, early childhood education, food access, and cultural institutions.
          - paragraph [ref=f860e87]:
            - strong [ref=f860e88]: "WORK LOCATION:"
          - paragraph [ref=f860e89]: Philadelphia, PA. May work remotely for 3 days/week but must live within normal commuting distance to the Philadelphia office.
          - paragraph [ref=f860e90]
          - paragraph [ref=f860e91]:
            - strong [ref=f860e92]: "COMPENSATION AND BENEFITS:"
          - paragraph [ref=f860e93]: Reinvestment Fund offers a competitive salary based on experience and skills, as well as an excellent benefits package including employer-paid health, disability, and life insurance, 401(k) savings plan with employer match, flexible spending accounts (medical, dependent care and transportation), tuition reimbursement, paid time off, and EAP program.
          - paragraph [ref=f860e94]
          - paragraph [ref=f860e95]: If hired, employee will be in an “at-will position” and the Company reserves the right to modify base salary (as well as any other discretionary payment or compensation program) at any time, including for reasons related to individual performance, Company or individual department/team performance, and market factors.
          - paragraph [ref=f860e96]
          - paragraph [ref=f860e97]:
            - text: Reinvestment Fund is an
            - strong [ref=f860e98]: Equal
