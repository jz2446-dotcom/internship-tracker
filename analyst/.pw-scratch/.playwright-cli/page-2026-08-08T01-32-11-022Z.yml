            - heading "Description" [level=2] [ref=f161e72]
            - paragraph [ref=f161e73]: "The LACMA Decorative Arts and Design Curatorial Internship is open to upper-division undergraduate and graduate students with a minimum GPA of 3.0 who are majoring in design history, art history, history, visual studies, architecture, curatorial or museum studies, and related fields. As an intern, you will have the opportunity to participate in the development and research of a major exhibition as well as a collection exhibition, to learn about this era of design, and to gain insights into the exhibition and acquisition process. Potential projects include: researching and identifying contextual images and film clips, confirming biographical and artwork details for the exhibition catalogue and labels, and researching potential exhibition-related acquisitions. This internship is offered in Los Angeles, CA."
