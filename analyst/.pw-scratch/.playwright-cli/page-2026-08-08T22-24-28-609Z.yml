            - paragraph [ref=f119e61]:
              - text: ARL maintains a free database of current
              - link "Job/Residency/Internship Listings" [ref=f119e62] [cursor=pointer]:
                - /url: https://www.arl.org/jobs/job-listings/
              - text: submitted by academic and research libraries, archives, and related institutions. If you are interested in submitting a listing,
              - link "use this form to post a job, residency, or internship" [ref=f119e63] [cursor=pointer]:
                - /url: https://www.arl.org/jobs/start/
              - text: . Posting a listing is free for ARL member institutions; for non-ARL libraries, there is a fee of $250 per posting.
            - paragraph [ref=f119e64]:
              - text: The
              - link "Research Libraries Position Description Bank" [ref=f119e65] [cursor=pointer]:
                - /url: https://www.arl.org/jobs/rl-position-description-bank/
              - text: aggregates position descriptions from participating academic and research libraries, making the descriptions browsable and searchable. The ARL Position Description Bank provides a source for current position descriptions and also tracks the evolution of positions—and library functions and services—and the varied ways in which institutions organize and define functions.
