          - paragraph [ref=f1408e60]:
            - strong [ref=f1408e61]: "Application Details & Instructions:"
          - list [ref=f1408e62]:
            - listitem [ref=f1408e63]: Please submit your application and attach your resume/CV, a cover letter, and any other supporting documents
            - listitem [ref=f1408e64]:
              - text: Priority will be given to applications received by
              - strong [ref=f1408e66]: August 17, 2026
          - paragraph [ref=f1408e67]:
            - strong [ref=f1408e68]: Mission
            - text: ": The Dallas Museum of Art is a space of wonder and discovery where art comes alive."
          - paragraph [ref=f1408e69]
          - paragraph [ref=f1408e70]:
            - strong [ref=f1408e71]: "The DMA will:"
          - list [ref=f1408e72]:
            - listitem [ref=f1408e73]: Place art and our diverse communities at the center around which all activities radiate.
            - listitem [ref=f1408e74]: Pursue excellence in collecting and programming, present works of art across cultures and time, and be a driving force in contemporary art.
            - listitem [ref=f1408e75]: Strengthen our position as a prominent, innovative institution, expanding the meaning and possibilities of learning and creativity.
          - paragraph [ref=f1408e76]
          - paragraph [ref=f1408e77]:
            - strong [ref=f1408e78]: "Scope of the Position:"
          - paragraph [ref=f1408e79]: The Texas Instrument Strategic Management Fellow supports the planning, evaluation, and implementation of special projects and strategic initiatives. Working closely with the Senior Director of Development Operations and Institutional Giving, the Fellow will contribute to fundraising strategy, events management, strategic communications, and KPI reporting to advance the Museum’s fundraising success.
          - paragraph [ref=f1408e80]
          - paragraph [ref=f1408e81]:
            - strong [ref=f1408e82]: "Duties & Responsibilities:"
          - list [ref=f1408e83]:
            - listitem [ref=f1408e84]: Support donor engagement strategies by conducting research on current and prospective donors and ensuring accurate CRM records, including logging call reports from senior Museum leadership.
            - listitem [ref=f1408e85]: Conduct research and financial analyses to support the growth, retention, and engagement of Museum members.
            - listitem [ref=f1408e86]: Contribute to institutional fundraising efforts by assisting with grant applications, corporate proposals, and organizational prospect research.
            - listitem [ref=f1408e87]: Create presentation decks and document meeting outcomes for Development Committee meetings composed of Board and community leaders.
            - listitem [ref=f1408e88]: Assist with planning and executing event logistics to support Museum member engagement and experience.
            - listitem [ref=f1408e89]: Support executing the capital campaign by managing prospect pipelines and preparing key materials—such as presentations, proposals, and reports—for staff, Board members, and campaign committees as needed.
            - listitem [ref=f1408e90]: Track monthly KPIs to monitor progress across departmental goals.
            - listitem [ref=f1408e91]: Provide administrative support through coordination of internal meetings and general departmental operations.
        - generic [ref=f1408e92]: Requirements
        - generic [ref=f1408e93]:
          - paragraph [ref=f1408e94]:
            - strong [ref=f1408e95]: "Required Experience, Skills, and Abilities:"
          - list [ref=f1408e96]:
            - listitem [ref=f1408e97]: Graduate student with a flexible course load, or a recent graduate, seeking to pursue a professional career in a museum, nonprofit organization, or related field such as research, data analysis, fundraising, event planning, or program management.
            - listitem [ref=f1408e98]: Advanced degrees in business administration, non-profit management, law, organizational behavior, information technology, marketing, communications, fundraising, data analysis, accounting, finance, or similar fields will receive preference.
          - paragraph [ref=f1408e99]
          - paragraph [ref=f1408e100]:
            - strong [ref=f1408e101]: "Preferred Experience, Skills, and Abilities:"
          - list [ref=f1408e102]:
            - listitem [ref=f1408e103]: Strong project management and organizational skills with the demonstrated ability to drive multiple concurrent projects to completion.
            - listitem [ref=f1408e104]: Good judgement in decision-making and completing job responsibilities.
            - listitem [ref=f1408e105]: Proven ability to prioritize multiple tasks and manage changing priorities.
            - listitem [ref=f1408e106]: Effective diplomatic skills and ability to use discretion.
            - listitem [ref=f1408e107]: Demonstrated strategic thinking and analytical, quantitative, and problem-solving skills.
            - listitem [ref=f1408e108]: Exceptional attention to detail to ensure high quality deliverables.
            - listitem [ref=f1408e109]: Intermediate to advanced proficiency in Microsoft Word, Excel, and PowerPoint.
            - listitem [ref=f1408e110]: Strong interpersonal skills and a collaborative approach to problem solving, with the ability to influence without direct authority, develop effective partnerships, and build consensus.
            - listitem [ref=f1408e111]: Excellent written and verbal communication with a demonstrated ability to prepare executive level written and oral presentations.
          - paragraph [ref=f1408e112]
          - paragraph [ref=f1408e113]:
            - strong [ref=f1408e114]: Our Core Values
          - list [ref=f1408e115]:
            - listitem [ref=f1408e116]:
              - strong [ref=f1408e117]: Act with Integrity
              - text: ": We are honest and ethical."
            - listitem [ref=f1408e118]:
              - strong [ref=f1408e119]: Build Inclusivity
              - text: ": We create spaces where everyone can feel like they belong."
            - listitem [ref=f1408e120]:
              - strong [ref=f1408e121]: Communicate Respectfully
              - text: ": We listen intentionally and advocate for diverse perspectives."
            - listitem [ref=f1408e122]:
              - strong [ref=f1408e123]: Embrace and Drive Change
              - text: ": We are innovative, creative, and solutions driven."
            - listitem [ref=f1408e124]:
              - strong [ref=f1408e125]: Foster Connections
              - text: ": We collaborate around shared goals."
            - listitem [ref=f1408e126]:
              - strong [ref=f1408e127]: Maintain Balance
              - text: ": We encourage ourselves and each other to reflect and recharge."
            - listitem [ref=f1408e128]:
              - strong [ref=f1408e129]: Remain Curious
              - text: ": We pursue personal and professional learning."
          - paragraph [ref=f1408e130]
          - paragraph [ref=f1408e131]:
            - strong [ref=f1408e132]: Equity, Diversity, and Inclusion
          - paragraph [ref=f1408e133]: The Dallas Museum of Art fosters equity, celebrates diversity, and supports inclusion. We acknowledge that diverse backgrounds and voices of visitors, volunteers, trustees, staff, and communities represented in the collection make us stronger and better equipped to make positive impacts locally, nationally, and internationally.
          - paragraph [ref=f1408e134]
          - paragraph [ref=f1408e135]:
            - strong [ref=f1408e136]: Equity
          - paragraph [ref=f1408e137]: Society’s historical legacies and systemic barriers have created disparities in the communities we serve. Knowing this, we strive to expand and enhance arts opportunities for all.
          - paragraph [ref=f1408e138]
          - paragraph [ref=f1408e139]:
            - strong [ref=f1408e140]: Diversity
          - paragraph [ref=f1408e141]: Many factors—including but not limited to race, religion, creed, color, national origin, age, gender, sexual orientation, gender identity, marital status, veteran status, disability, genetics, economic backgrounds, and experiences—make individuals and groups unique. Our goal is to ensure visitors, volunteers, trustees, staff, and collections reflect this diversity.
          - paragraph [ref=f1408e142]
          - paragraph [ref=f1408e143]:
            - strong [ref=f1408e144]: Inclusion
          - paragraph [ref=f1408e145]: We commit to listening to and learning from diverse voices and perspectives. We create a vibrant and accessible social space that encourages dialogue and the exchange of ideas through arts and culture.
          - paragraph [ref=f1408e146]
          - paragraph [ref=f1408e147]:
            - strong [ref=f1408e148]: EOE
          - paragraph [ref=f1408e149]: The Dallas Museum of Art is committed to building a culturally diverse staff and is an Equal Opportunity Employer. The DMA provides equal employment opportunities to all employees and applicants for employment and prohibits discrimination and harassment of any type without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state or local laws.
          - paragraph [ref=f1408e150]
          - paragraph [ref=f1408e151]:
            - strong [ref=f1408e152]: "EMPLOYMENT ELIGIBILITY:"
            - text: In compliance with federal law, all persons hired will be required to verify identity and eligibility to work in the United States and to complete the required employment eligibility verification document form upon hire.
