            - generic [ref=f543e124]:
              - generic [ref=f543e125]: Body
              - paragraph [ref=f543e126]: Internships with the County of Orange offer students and recent graduates an opportunity to partner with one of the premier employers in the region as they explore career options and apply their academic skills and knowledge to the workplace.
              - paragraph [ref=f543e127]: Please click on the internship titles listed below to learn more about the department, requirements, and application instructions. You may apply for more than one internship to enhance your efforts in securing placement. Please note that the following internships are unpaid and do not guarantee placement into a full-time position.
              - list [ref=f543e128]:
                - listitem [ref=f543e129]:
                  - text: • All internship positions require students to include a cover letter, resume, and unofficial transcripts. Information about what to include in a cover letter can be found
                  - link "HERE" [ref=f543e130] [cursor=pointer]:
                    - /url: /internships/internship_opportunities/application
                - listitem [ref=f543e131]:
                  - text: • To sign up for emails notifying you of new internship opportunities please submit an Intern Interest Alert
                  - link [ref=f543e132] [cursor=pointer]:
                    - /url: https://www.governmentjobs.com/careers/oc/jobInterestCards/categories
                    - text: HERE
                    - img "(link is external)" [ref=f543e133]
                  - text: . Be sure to select the "Internship" Category.
              - paragraph [ref=f543e136]
