    - generic [ref=f41e287]:
      - heading "Notice Regarding Unsolicited Offers for Employment" [level=6] [ref=f41e288]
      - paragraph [ref=f41e289]: Fraudulent online recruitment scams have increased in frequency. In these cases, participants in the scheme may create online postings or extend employment offers for fabricated positions to obtain personal information or money from prospective job seekers. Those involved in such improper activity may pose as company employees or authorized recruiters when requesting information.
      - paragraph [ref=f41e290]: Fraudulent job offers often request financial or personal information early in the recruitment process. They may also request that travel be booked through a certain travel agency with the promise to reimburse travel costs. Heitman will never ask for any financial commitment or contribution at any stage of the recruitment process, nor does it solicit personal financial or otherwise sensitive information.
      - paragraph [ref=f41e291]: If you are seeking employment opportunities with Heitman, keep in mind that a legitimate representative may contact you via phone, email, or LinkedIn. Heitman employees’ email addresses always end with @heitman.com. Qualified applicants are encouraged to review and apply to Heitman’s open positions directly, which can be found below.
