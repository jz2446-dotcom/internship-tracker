            - heading "Benefits and Perks" [level=4] [ref=f41e203]
            - generic [ref=f41e204]:
              - paragraph [ref=f41e205]: At Heitman, we are committed to the well-being of our employees and their families. Our comprehensive benefits package is designed to provide financial security and support for health, retirement, and life’s various events.
              - heading "Health & Financial Wellness Programs (certain benefits may vary by country):" [level=6] [ref=f41e206]
              - list [ref=f41e207]:
                - listitem [ref=f41e208]:
                  - strong [ref=f41e209]: "Health Insurance:"
                  - text: Comprehensive coverage including medical, dental, vision, life, voluntary life, accidental injury, short-term, and long-term disability.
                - listitem [ref=f41e210]:
                  - strong [ref=f41e211]: "401k with Company Match:"
                  - text: Secure your future with our competitive 401k plan (US employees) and/or pension programs (Global employees).
                - listitem [ref=f41e212]:
                  - strong [ref=f41e213]: "Paid Parental Leave:"
                  - text: Support for new parents to bond with their little ones.
                - listitem [ref=f41e214]:
                  - strong [ref=f41e215]: "Pet Insurance:"
                  - text: Because furry family members matter too.
                - listitem [ref=f41e216]:
                  - strong [ref=f41e217]: "Employee Assistance Program:"
                  - text: Confidential support for personal and professional challenges.
                - listitem [ref=f41e218]:
                  - strong [ref=f41e219]: "Flexible Spending Accounts:"
                  - text: Tax-advantaged accounts for healthcare and dependent care expenses.
                - listitem [ref=f41e220]:
                  - strong [ref=f41e221]: "Commuter Transit & Parking Discounts:"
                  - text: To ease the stress of commuting.
                - listitem [ref=f41e222]:
                  - strong [ref=f41e223]: "Generous PTO Plan:"
                  - text: Accrue paid time off to recharge and relax.
                - listitem [ref=f41e224]:
                  - strong [ref=f41e225]: "Paid Holidays, Floating Holidays, & Volunteer Day:"
                  - text: Enjoy time off for holidays and giving back to the community.
                - listitem [ref=f41e226]:
