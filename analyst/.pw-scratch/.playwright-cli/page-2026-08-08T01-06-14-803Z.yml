    - generic [ref=f41e153]:
      - list [ref=f41e155]:
        - listitem [ref=f41e156]:
          - heading "The Culture" [level=2] [ref=f41e157]
          - paragraph [ref=f41e158]: We believe our success in consistently building a dedicated talent pool stems from the deliberate steps we’ve taken to create the collaborative, innovative culture needed to reward and retain talented people.
          - paragraph [ref=f41e159]: We work hard but always keep things in perspective. We aspire to be a flexible, entrepreneurial work environment that emphasizes teamwork and balance while providing opportunities for growth, competitive pay, and benefits. No matter their role or tenure, our employees are valued, challenged, and given opportunities to make an impact.
      - list [ref=f41e162]:
        - listitem [ref=f41e163]:
          - article [ref=f41e164]:
            - heading "People First" [level=3] [ref=f41e167]
            - paragraph [ref=f41e170]: We are a people centered company. The people we work with, invest with, and invest on behalf of are at the center of everything we do. We are committed to building trusting relationships and contributing to a more equitable, inclusive and sustainable world.
        - listitem [ref=f41e171]:
          - article [ref=f41e172]:
            - heading "Always Principled" [level=3] [ref=f41e175]
            - paragraph [ref=f41e178]: We act with integrity and transparency. We embrace our responsibilities to our clients, colleagues, and the communities we serve, and we do the right thing.
        - listitem [ref=f41e179]:
          - article [ref=f41e180]:
            - heading "Performance Minded" [level=3] [ref=f41e183]
            - paragraph [ref=f41e186]: We are committed to delivering investment results and solutions that exceed the expectations of our clients and our colleagues. Every day, we work to improve ourselves and build a better company.
        - listitem [ref=f41e187]:
          - article [ref=f41e188]:
            - heading "Forward Thinking" [level=3] [ref=f41e191]
            - paragraph [ref=f41e194]: We think ahead. Our diverse experiences and broad global perspectives empower us to look beyond the present so we can prepare ourselves and our clients for the opportunities and challenges of tomorrow.
    - generic [ref=f41e198]:
      - generic [ref=f41e199]:
