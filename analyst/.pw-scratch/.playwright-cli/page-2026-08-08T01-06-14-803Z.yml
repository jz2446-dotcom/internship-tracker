    - generic [ref=f41e62]:
      - heading "Working at Heitman" [level=5] [ref=f41e63]
      - paragraph [ref=f41e64]: Our culture recognizes the importance of our biggest differentiator — our people. Heitman’s collaborative work environment gives our professionals the opportunity to build something together. Something too appealing to ignore and too rewarding to leave.
      - paragraph [ref=f41e65]: We believe our culture, brand, and strong reputation help us attract and retain some of the most sought-after talent in the industry. As of December 31, 2022, our senior management team averages 29 years of investment advisory experience. The average tenure of Heitman’s nearly 350 professionals on staff is seven years.
      - generic [ref=f41e68]: "**Pensions and Investments (P&I) worked in conjunction with Best Companies Group to conduct a two-part survey process of North American employers and their employees. The Best Places to Work in Money Management Awards (the “award”) are based on several factors, including a review of the information provided in submissions made by participating employers, as well specific responses to the employee surveys. Heitman pays a fee to P&I to subscribe to their publication. A nominal fee has been paid for use of P&I’s Best Places to Work in Money Management logo."
