              - paragraph [ref=f396e396]: The integration of Credit Suisse and UBS creates a unique opportunity for people to contact our clients purporting to be from our organization or selling fake investment schemes from our entities. This could be a means to get information from our clients or to trick clients into sending money to a new account. Please be cautious if you are contacted by an unknown party. UBS and Credit Suisse entities will never contact you by email or telephone with new bank account details. Before transferring money or sharing personal details, please contact UBS (or relevant bank) by telephone. If you are already a client, please contact your UBS or Credit Suisse advisor or contact UBS.
