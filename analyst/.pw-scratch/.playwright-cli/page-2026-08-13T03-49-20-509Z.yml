    - generic [ref=f233e47]:
      - heading "Careers at Boston Trust Walden" [level=2] [ref=f233e48]
      - paragraph [ref=f233e49]: As a financial services organization, we recognize that attracting and retaining talent is a key driver of business success. One of Boston Trust Walden’s strategic priorities is to foster a positive work environment. This includes cultivating a workplace where employees have ownership of their work, contribute to positive client outcomes, are rewarded for their efforts, and have exposure to opportunities that facilitate their continued growth and advancement. We embrace diverse perspectives, backgrounds, and skillsets.
      - link "Career Opportunities" [ref=f233e50] [cursor=pointer]:
        - /url: https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=5ef49952-1f31-4fa0-8ba7-f8e8c5f8cdc5&ccId=19000101_000001&source=CC2&lang=en_US&selectedMenuKey=CurrentOpenings
