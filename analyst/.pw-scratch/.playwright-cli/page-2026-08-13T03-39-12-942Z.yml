                - heading "City Council" [level=1] [ref=f26e66]
                - generic [ref=f26e69]:
                  - generic [ref=f26e73]:
                    - paragraph [ref=f26e74]: The City of Tomball City Council establishes the goals and objectives of the City to provide the highest level of service to all customers, citizens, visitors, and staff with professionalism and efficiency.
                    - paragraph [ref=f26e75]: Serving as a city council member is one of the most demanding and rewarding tasks that a citizen can perform as the city government is the community's voice. As leaders of Tomball, the mayor and city council members are responsible for policy-making decisions that substantially impact the daily lives of Tomball citizens.
                    - paragraph [ref=f26e76]: As the governing body of Tomball, the City Council establishes the City's annual program of service by adopting the budget and exercises regulatory power by adopting rules, regulations, laws and formal policies. The Council identifies the needs of the City and its citizens. It provides direction to the City Manager and City staff to meet those needs while considering and maximizing the available resources.
                    - paragraph [ref=f26e77]: Each Council member is elected 'at large' and represents all Tomball citizens.
