          - heading "Invested in innovation" [level=1] [ref=f129e190]
          - paragraph [ref=f129e191]: "Etho Capital is built on a simple conviction: climate risk is financial risk, and the companies that manage it well are often the better-run companies. We treat carbon efficiency as a signal — a company that wastes less carbon tends to waste less of everything, running leaner, managing risk more carefully, and positioning itself for a lower-carbon economy. That read on operational quality sits at the core of how every Etho index is built."
          - paragraph [ref=f129e192]:
            - text: We don't ask you to take the thesis on faith. The Etho Climate Leadership Index – US has been calculated in real time by an independent administrator since November 2015 — and its live track record, shown above, is that conviction tested in real markets, not a backtest.
            - link "Go in-depth" [ref=f129e193] [cursor=pointer]:
              - /url: https://ethocapital.squarespace.com/go-in-depth
            - text: to learn more about our investing thesis.
