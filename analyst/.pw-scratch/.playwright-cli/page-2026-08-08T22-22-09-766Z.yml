          - strong [ref=f259e199]: "Job Scam Alert:"
          - text: Your privacy and safety are important to us. We're aware of individuals and organizations falsely claiming Kraft Heinz affiliation to extend fake job offers. These scams are becoming increasingly sophisticated, often using AI-generated emails, fake recruiter profiles, and convincing interview scripts. Please be cautious of fraudulent job postings and offers, unauthorized interviews, and suspicious emails that request your personal, confidential, financial, or other sensitive information. If you believe you've been contacted by a fake recruiter or are being scammed, please contact us at
