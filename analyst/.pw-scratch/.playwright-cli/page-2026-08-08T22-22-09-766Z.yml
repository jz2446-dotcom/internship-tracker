                - listitem [ref=f259e83]:
                  - generic [ref=f259e84]: •
                  - generic [ref=f259e85]: Develop foundations of key manufacturing systems
                - listitem [ref=f259e86]:
                  - generic [ref=f259e87]: •
                  - generic [ref=f259e88]: Regular opportunities to build relationships and work closely with leadership
                - listitem [ref=f259e89]:
                  - generic [ref=f259e90]: •
                  - generic [ref=f259e91]: Mentorship from plant leaders who have considered the KHIF plant environment and are ready to take one on for yourself
              - paragraph [ref=f259e92]: Without manufacturing talent, we'll have no products — this program is your opportunity to get right in the heart of our business, with fast-tracked career progression and gradual exposure.
              - link "Explore Opportunities" [ref=f259e94] [cursor=pointer]:
