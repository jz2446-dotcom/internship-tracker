            - heading "RIGHT PROGRAM" [level=3] [ref=f259e49]
            - paragraph [ref=f259e50]: There’s a wide range of ways to grow your career at Kraft Heinz. Whatever your location, language skills or experience so far.
            - generic [ref=f259e51]:
              - heading "INTERN PROGRAMS" [level=3] [ref=f259e52]
              - paragraph [ref=f259e53]: Still studying? You’ll learn by doing on our immersive 10-week placement — no lunch runs for the team or making coffees for your manager here. You’ll get stuck right into real projects from day one. Depending on your location you can choose between a variety of departments.
              - paragraph [ref=f259e54]: Join a class of ambitious interns and be mentored by Kraft Heinz leaders. In your function specific role, you’ll deliver real results for the business — no pressure!
              - paragraph [ref=f259e55]: At the end of your internship, you’ll have the opportunity to present your project and results to your local Leadership Team. Don’t worry, we’ll back you all the way! There’s also the possibility to move into a full-time role with us after you graduate.
              - link "Explore Opportunities" [ref=f259e57] [cursor=pointer]:
                - /url: https://jobs.kraftheinz.com/careers?query=student
          - generic:
            - img "INTERN PROGRAMS"
        - generic [ref=f259e61]:
          - generic [ref=f259e62]:
            - generic [ref=f259e63]:
              - heading "MANAGEMENT TRAINEE PROGRAMS" [level=3] [ref=f259e64]
              - paragraph [ref=f259e65]: Fast growth. Real-world experience. And responsibility in a full-time role from day one. This 12-month program cultivates recent graduates into the Kraft Heinz leaders of tomorrow.
              - paragraph [ref=f259e66]: You’ll spend your time learning from Kraft Heinz leaders, gaining exposure to all of our functions and making a direct impact on our business. From field sales to agile business placements you’ll get to know Kraft Heinz from the ground up. And you’ll be doing it with other ambitious trainees by your side.
              - paragraph [ref=f259e67]: With a thorough onboarding process, intentional development across different business areas, and activities alongside standard professional development and mentoring from senior leaders — you'll be set for future success.
              - link "Explore Opportunities" [ref=f259e69] [cursor=pointer]:
                - /url: https://jobs.kraftheinz.com/careers?query=trainee
            - generic [ref=f259e73]:
              - heading "MANUFACTURING TRAINEE PROGRAMS" [level=3] [ref=f259e74]
              - paragraph [ref=f259e75]: Recently graduated or in your last year of college (or university)? Join the program, growing the leaders of our manufacturing from the inside out. Grow your business mindset, and excel in the plant environment.
              - list [ref=f259e76]:
