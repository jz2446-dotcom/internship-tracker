            - heading "MBA PROGRAMS" [level=3] [ref=f259e101]
            - paragraph [ref=f259e102]: This program is for high-potential individuals who are ready to learn, drive impact for the business, and deliver creative solutions on our journey to become the indispensable food company in North America.
            - paragraph [ref=f259e103]: Over a 10-month or 10-week Summer program, you'll develop as ambitious leaders who are equipped with the skills, business acumen and creativity to excel in your roles as you begin to lead our transformation.
            - paragraph [ref=f259e104]: As an MBA Leadership trainee you'll be placed directly into the business in a management role to drive company initiatives. This could be within the Sales and Marketing team, Finance, Operations or Corporate teams - the world's your oyster.
