      - generic [ref=f1220e19]:
        - heading "Better commerce for everyone — made by you" [level=1] [ref=f1220e20]
        - paragraph [ref=f1220e21]:
          - text: If you have a passion, we have an Engineering & Data Internship to match. The opportunity to shape how entrepreneurs around the world do business is in your hands. Shopify powers millions of businesses worldwide. We’re the all-in-one commerce platform to start, run, and grow a business. At Shopify we’re at the forefront of AI innovation, using technologies including LLM posttraining, reinforcement learning, and model quantization, to redefine what’s possible in e-commerce.
          - strong [ref=f1220e22]: Applications are OPEN
        - list [ref=f1220e23]:
          - listitem [ref=f1220e24]:
            - strong [ref=f1220e25]: Apply to Software Engineering internship
            - link [ref=f1220e26] [cursor=pointer]:
              - /url: https://www.shopify.com/careers/software-engineering-internships-winter-2027_404bb82e-37f3-4a78-b0f3-12923a7c4856?ashby_jid=404bb82e-37f3-4a78-b0f3-12923a7c4856
