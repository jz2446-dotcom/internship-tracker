      - generic [ref=f1220e36]:
        - heading "Shopify’s intern culture" [level=2] [ref=f1220e37]
        - paragraph [ref=f1220e38]: Shopify's Engineering & Data Internships combine both in-person and digital experiences. It allows you to design your life around what matters to you most because we know the importance of community. From supplementary learning sessions to workshops and curated in-person experiences, there’s no lack of opportunities to meet and connect with other interns.
        - paragraph [ref=f1220e39]:
          - text: One week, you might be pairing with your mentor in-person in our pair programming booths, and the next, attend a professional development session on how to give better feedback. Your internship will have the benefit of flexibility in your day, along with the support of your community and relationships to make it about more than just the work.
          - strong [ref=f1220e40]: "Important note:"
          - text: Our internships do require interns to work in-person at one of our Canadian (Montréal, Ottawa, or Toronto) or USA offices (Bellevue and New York City) at least 3 days/week.
      - generic [ref=f1220e45]:
        - paragraph [ref=f1220e46]: "\"My project involved extensive problem-solving and prototyping, allowing me to brainstorm solutions, test approaches, and implement a workflow improvement for future developers. The sense of accomplishment from successfully completing and integrating a feature that will help other developers long-term was incredibly rewarding.\""
        - paragraph [ref=f1220e47]: — Summer 2024 Software Engineer Intern
      - generic [ref=f1220e50]:
        - generic [ref=f1220e52]:
          - heading "Engineering & Data Internship opportunities" [level=2] [ref=f1220e53]
          - paragraph [ref=f1220e54]: Learn more about our Internship offerings!
        - list [ref=f1220e55]:
          - listitem [ref=f1220e56]:
            - generic [ref=f1220e58]:
              - heading "Applied Machine Learning Engineer Intern" [level=2] [ref=f1220e59]
              - paragraph [ref=f1220e60]: Our Applied Machine Learning Engineers use extensive data to build products and create and fine-tune ML models.
          - listitem [ref=f1220e61]:
            - generic [ref=f1220e63]:
              - heading "Data Engineer Intern" [level=2] [ref=f1220e64]
              - paragraph [ref=f1220e65]: Our Data Engineers build and manage the massive data pipelines that power commerce through foundational work on product analysis, machine learning, and everything in between.
          - listitem [ref=f1220e66]:
            - generic [ref=f1220e68]:
              - heading "Infrastructure Engineer Intern" [level=2] [ref=f1220e69]
              - paragraph [ref=f1220e70]: Our Infrastructure Engineers build large distributed systems at scale, automating development processes, or creating internal tools.
          - listitem [ref=f1220e71]:
            - generic [ref=f1220e73]:
              - heading "Product Data Science Intern" [level=2] [ref=f1220e74]
              - paragraph [ref=f1220e75]: Our Product Data Scientists uncover the insights that inform how Shopify decides on what products to build and how to build them.
          - listitem [ref=f1220e76]:
            - generic [ref=f1220e78]:
              - heading "Security Engineer Intern" [level=2] [ref=f1220e79]
              - paragraph [ref=f1220e80]: Our Security Engineering Interns assist in detecting, evaluating, and addressing security threats to Shopify and its merchants.
          - listitem [ref=f1220e81]:
            - generic [ref=f1220e83]:
              - heading "Software Engineer Intern" [level=2] [ref=f1220e84]
              - paragraph [ref=f1220e85]: Our Software Engineering Interns turn product roadmaps into available, scalable, performant, secure, innovative, composable, and cost-effective software for global commerce.
      - generic [ref=f1220e89]:
        - heading "The process" [level=2] [ref=f1220e90]
        - paragraph [ref=f1220e91]: From submit to success
        - generic [ref=f1220e92]:
          - generic [ref=f1220e93]:
            - heading "1. Apply" [level=3] [ref=f1220e94]
            - paragraph [ref=f1220e95]: Submitting a completed application is the first step in the process. In the section below, we have assembled some resources to help you put your best foot forward.
          - generic [ref=f1220e96]:
            - heading "2. Shopify Assessments" [level=3] [ref=f1220e97]
            - paragraph [ref=f1220e98]: Successful applicants will move forward and be emailed a series of mandatory assessments to complete. These will help assess your technical skills and your likelihood of success at Shopify. This is an opportunity for you to demonstrate your programming skills. The assessments should take about an hour, but don’t worry if it takes you shorter or longer. We will contact applicants to let them know if they progress to our Craft Assessment interview!
          - generic [ref=f1220e99]:
            - heading "3. Craft Assessment Interview" [level=3] [ref=f1220e100]
            - paragraph [ref=f1220e101]: Applicants moving beyond the Shopify Assessments will have an interview with a Shopify Engineer. You’ll be informed ahead of time what you need to prepare.
          - generic [ref=f1220e102]:
            - heading "3. Life Story" [level=3] [ref=f1220e103]
            - paragraph [ref=f1220e104]: The Life Story interview is our final interview in the Engineering & Data Internships hiring process. This interview about understanding the themes of your journey so far, what you have learnt, and how you made a difference. It will also give you a chance to better understand how we work at Shopify. Before your interview you will receive more information describing the interview and how to best prepare.
          - generic [ref=f1220e105]:
            - heading "4. Decision" [level=3] [ref=f1220e106]
            - paragraph [ref=f1220e107]: Time to celebrate! Successful applicants are placed on teams based on their interests, skills, and experiences. Each team placement is done individually with significant consideration.
