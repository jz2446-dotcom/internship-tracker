      - definition [ref=f59e59]:
        - paragraph
        - paragraph [ref=f59e60]:
          - generic [ref=f59e61]:
            - text: Broward County, Board of County Commissioners is seeking a qualified candidate for the position of a College Intern - Afterschool at Your Library Program within the Broward County Libraries Division. This position is a Grant Funded Part-time19, with no benefits. T
            - generic [ref=f59e62]: he successful candidate will provide children with homework help, guided reading practice, computer training, life management skills, and track, maintain, report on daily program attendance. Spanish or Creole preferred.
            - text: "The After-School @ Your Library Program is an innovative program offering children the opportunity to hone their basic academic skills in a safe, nurturing environment. This program is offered four days per week, after school, where a team of librarians, teachers, and activity coordinators watch over students, who range in age from six to twelve. The After-School @ Your Library Program is a partnership between Broward County and the Children's Services Council of Broward County. This position may be assigned to any location where the program is offered based on operational needs. The program consists of approximately 30 students per site and is offered at 12 library locations throughout Broward County with: Carver Ranches Branch Library, Jan Moran Collier City Learning Library, Deerfield Beach Percy White Branch Library, Hallandale Beach Branch Library, Hollywood Branch Library, Lauderdale Lakes Branch Library/Educational and Cultural Center, Margate Catharine Young Branch Library, North Lauderdale Saraniero Branch Library, Northwest Branch Library, Pompano Beach Branch Library, Riverland Branch Library, and Sunrise Dan Pearl Branch Library."
            - generic [ref=f59e63]: Additional vacancies may be filled at one or more of the library locations listed above.
          - strong [ref=f59e67]: This announcement will remain active until a sufficient number of applications has been received and may close at any time.
          - text: Currently enrolled in, or graduated from, an accredited four year college or university with major course work in a field appropriate to area of assignment; or any equivalent combination of training and experience. One (1) year experience working with children is required.
          - strong [ref=f59e70]: "SPECIAL NOTE: In January 2016, the classification title of this position will change to Intern."
        - paragraph
      - term [ref=f59e71]:
        - heading "SCOPE OF WORK" [level=2] [ref=f59e72]
      - definition [ref=f59e73]:
        - paragraph
        - paragraph [ref=f59e74]:
          - generic [ref=f59e75]: NATURE OF WORK
        - paragraph [ref=f59e76]: This is administrative work which provides the opportunity for professional training in various offices throughout the County. Assignments serve to offer practical experience and broad exposure to the County's organizational structure.
        - paragraph [ref=f59e77]: Close administrative direction and supervision is received from a superior; emphasis is placed on training interns for continuing employment within the county or local government. Work is reviewed through observation of performance, frequent conferences and reports.
        - paragraph [ref=f59e78]:
          - generic [ref=f59e79]: ILLUSTRATIVE TASKS
        - paragraph [ref=f59e80]: Applies research techniques and analytical methods to the study of administrative systems, organizational structures, policies and procedures.
        - paragraph [ref=f59e81]: Conducts special studies in conjunction with a project; analyzes data and makes recommendations based upon studies.
        - paragraph [ref=f59e82]: Responsible for project assignments, research and analysis.
        - paragraph [ref=f59e83]: Provides information and assistance to the general public and other governmental agencies.
        - paragraph [ref=f59e84]: Prepares project reports and related data.
        - paragraph [ref=f59e85]: Performs related work as required.
        - paragraph
