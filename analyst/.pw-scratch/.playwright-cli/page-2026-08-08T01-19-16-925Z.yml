      - definition [ref=f59e88]:
        - paragraph
        - paragraph [ref=f59e89]: Knowledge of the principles of management, organization, and administration.
        - paragraph [ref=f59e90]: Knowledge of organization and administration of governmental operations.
        - paragraph [ref=f59e91]: Ability to conduct research and make recommendations.
        - paragraph [ref=f59e92]: Ability to prepare technical reports.
        - paragraph [ref=f59e93]: Ability to communicate effectively, both orally and in writing.
        - paragraph [ref=f59e94]: Ability to serve the public and fellow employees with honesty and integrity in full accord with the letter and spirit of Broward County's Ethics and Conflict of Interest policies.
        - paragraph [ref=f59e95]: Ability to establish and maintain effective working relationships with the general public, co-workers, elected and appointed officials and members of diverse cultural and
        - paragraph [ref=f59e96]: linguistic backgrounds regardless of race, religion, age, sex, disability or political affiliation.
