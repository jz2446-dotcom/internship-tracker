  - main [ref=f275e39]:
    - generic [ref=f275e41]:
      - generic [ref=f275e45]:
        - heading "Visitor Services Associate (Full Time)" [level=1] [ref=f275e49]
        - generic [ref=f275e52]:
          - paragraph [ref=f275e53]:
            - strong [ref=f275e54]: "DEPARTMENT:"
            - text: Strategy & Operations
            - strong [ref=f275e55]: "REPORTS TO:"
            - text: Managers, Visitor Services
            - strong [ref=f275e56]: "CLASSIFICATION:"
            - text: Non-Exempt
            - strong [ref=f275e57]: "DATE:"
            - text: May 2025
            - strong [ref=f275e58]: SALARY
            - text: ": $25/hour"
          - paragraph [ref=f275e59]:
            - strong [ref=f275e60]:
              - emphasis [ref=f275e61]: "Note:"
            - text: This position requires a cover letter for consideration. Refer to the “How to Apply” section of the job description for details. Applications without a cover letter will not be considered.
          - paragraph [ref=f275e62]:
            - strong [ref=f275e63]: POSITION OVERVIEW
          - paragraph [ref=f275e64]: The 9/11 Memorial & Museum Visitor Services team is seeking a full time Associate. Associates rotate through public-facing posts where they welcome and orient visitors, process ticketing transactions, and provide accurate information on amenities and museum programs. Associates are expected to maintain proper decorum and create meaningful experiences for visitors as they explore personal stories of loss, recovery, and hope.
          - paragraph [ref=f275e65]: This is an onsite job with an expectation to work holidays, weekends, and peak visitation days, including the week between Christmas and the New Year. This position is likely to have a Thursday - Monday schedule.
          - paragraph [ref=f275e66]:
            - strong [ref=f275e67]: ESSENTIAL FUNCTIONS
          - list [ref=f275e68]:
            - listitem [ref=f275e69]: Proactively greet and welcome visitors to the Memorial and Museum
            - listitem [ref=f275e70]: Orient and greet visitors as they join the line to enter the Museum
            - listitem [ref=f275e71]: Sell tickets, audio guides, and tours at the Box Office
            - listitem [ref=f275e72]: Scan tickets at Museum entry points
            - listitem [ref=f275e73]: Properly hang and tag visitor belongings in the coat check
            - listitem [ref=f275e74]: Provide visitors with accurate and engaging information on amenities and programs
            - listitem [ref=f275e75]: Support wayfinding on the Memorial plaza and in the Museum
            - listitem [ref=f275e76]: Cultivate a strong knowledge of Memorial and Museum content
            - listitem [ref=f275e77]: Interact positively with the public, colleagues, and other Museum staff
            - listitem [ref=f275e78]: Enforce institutional policies and procedures while maintaining outstanding customer service
          - paragraph [ref=f275e79]:
            - strong [ref=f275e80]: "Associates are expected to:"
          - list [ref=f275e81]:
            - listitem [ref=f275e82]: Work five nine-hour shifts per week
            - listitem [ref=f275e83]: Work weekends and holidays
            - listitem [ref=f275e84]: Wear a Museum-issued uniform
            - listitem [ref=f275e85]: Work both outdoors on the Memorial and indoors at the Museum in all weather
            - listitem [ref=f275e86]: Stand for long hours
            - listitem [ref=f275e87]: Take direction from Supervisors and Managers
            - listitem [ref=f275e88]: Demonstrate strong interpersonal and communication skills
            - listitem [ref=f275e89]: Be comfortable working with a diverse international public in a busy environment
          - paragraph [ref=f275e90]:
            - strong [ref=f275e91]: REQUIRED SUPPORT FOR ORGANIZATIONAL EVENTS
          - list [ref=f275e92]:
            - listitem [ref=f275e93]: Participate in the Annual 5K Fundraiser and September 11th Commemoration
            - listitem [ref=f275e94]: Assist with other special projects and events in support of the 9/11 Memorial & Museum mission as assigned
          - paragraph [ref=f275e95]:
            - strong [ref=f275e96]: QUALIFICATIONS/SKILLS REQUIREMENT
          - list [ref=f275e97]:
            - listitem [ref=f275e98]: 1-3 years of customer service experience, preferably within museums or tourism
            - listitem [ref=f275e99]: Cash handling experience required
          - paragraph [ref=f275e100]:
            - strong [ref=f275e101]: HOW TO APPLY
          - list [ref=f275e102]:
            - listitem [ref=f275e103]:
              - text: Please submit a cover letter
              - strong [ref=f275e104]: and
              - text: resume to
              - link "911mmvsjobs@911memorial.org" [ref=f275e105] [cursor=pointer]:
                - /url: mailto:911mmvsjobs@911memorial.org
            - listitem [ref=f275e106]: Please include the job title and your first and last name in the email subject
            - listitem [ref=f275e107]: Applicants must be legally authorized to work in the United States
          - paragraph [ref=f275e108]: __________
          - paragraph [ref=f275e109]: The National September 11 Memorial and Museum (9/11 Memorial & Museum) is an equal opportunity employer. Applicants who meet the qualification requirements of the role will receive consideration without regard to their race, color, religion, sex, sexual orientation, gender identity, national origin, disability, or status as a protected veteran.
          - paragraph [ref=f275e110]: The National September 11 Memorial & Museum (9/11 Memorial & Museum) is committed to an organizational culture that supports and reinforces our values regarding diversity, equity, inclusion, and accessibility (DEIA). We seek to build a collaborative, open, and equitable space where staff want to be, knowing that their contributions, professional expertise, and distinct voices are valued and respected. We encourage and celebrate an inclusive environment where candor and participation, when it comes to sharing ideas and collaborative problem-solving, are welcomed regardless of one’s role at the Museum or background.
          - paragraph [ref=f275e111]: Reasonable accommodations may be made to qualified candidates, during the interview process, to enable individuals with disabilities an opportunity to interview.
