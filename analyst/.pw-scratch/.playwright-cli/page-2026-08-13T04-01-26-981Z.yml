        - heading [level=3] [ref=f317e438]:
          - emphasis [ref=f317e439]:
            - strong [ref=f317e441]: Consumer Loan Underwriter & Compliance Officer
        - generic [ref=f317e442]:
          - paragraph [ref=f317e443]:
            - strong [ref=f317e444]: Join a Community-Focused Financial Institution Where Your Expertise Makes an Impact
          - paragraph [ref=f317e445]:
            - text: Cayuga Lake National Bank is seeking a detail-oriented and experienced
            - strong [ref=f317e446]: Consumer Loan Underwriter & Compliance Officer
            - text: to join our growing lending team. This is an exciting opportunity for a lending professional who enjoys balancing analytical underwriting with regulatory expertise while contributing to a collaborative, customer-focused environment.
          - paragraph [ref=f317e447]: In this role, you’ll play a key part in evaluating consumer loan applications, supporting secondary market initiatives, and ensuring compliance with federal and state lending regulations. If you thrive in a fast-paced financial environment and value teamwork, integrity, and professional growth, we’d love to hear from you.
          - paragraph [ref=f317e448]:
            - strong [ref=f317e449]: What You’ll Do
          - paragraph [ref=f317e450]:
            - strong [ref=f317e451]: Consumer Loan Underwriting
          - list [ref=f317e452]:
            - listitem [ref=f317e453]: "Analyze and underwrite a variety of consumer loan products including:"
            - listitem [ref=f317e454]: Real estate loans
            - listitem [ref=f317e455]: Personal loans
            - listitem [ref=f317e456]: Auto loans
            - listitem [ref=f317e457]: Credit cards
            - listitem [ref=f317e458]: Secured and unsecured lending products
            - listitem [ref=f317e459]: Evaluate income, assets, credit history, debt-to-income ratios, and collateral documentation
            - listitem [ref=f317e460]: Make timely lending decisions in accordance with established credit policies and risk standards
            - listitem [ref=f317e461]: Ensure loan documentation is accurate, complete, and compliant
          - paragraph [ref=f317e462]:
            - strong [ref=f317e463]: Compliance & Risk Management
          - list [ref=f317e464]:
            - listitem [ref=f317e465]: "Monitor and ensure compliance with consumer lending regulations, including:"
            - listitem [ref=f317e466]: TILA / Regulation Z
            - listitem [ref=f317e467]: ECOA / Regulation B
            - listitem [ref=f317e468]: FCRA
            - listitem [ref=f317e469]: Fair Lending laws
            - listitem [ref=f317e470]: Applicable state regulations
            - listitem [ref=f317e471]: Review loan files and lending processes for compliance accuracy and quality control
            - listitem [ref=f317e472]: Identify and resolve deficiencies or compliance exceptions
            - listitem [ref=f317e473]: Support audits, risk assessments, and internal compliance initiatives
          - paragraph [ref=f317e474]:
            - strong [ref=f317e475]: Secondary Market & Operational Support
          - list [ref=f317e476]:
            - listitem [ref=f317e477]: Prepare and qualify loans for secondary market eligibility
            - listitem [ref=f317e478]: Stay informed on changing regulatory requirements, lending trends, and market conditions
            - listitem [ref=f317e479]: Provide guidance and support to lending staff and management
            - listitem [ref=f317e480]: Assist with policy development, training, and process improvements
            - listitem [ref=f317e481]: Participate in community and branch activities that support the Bank’s local presence
          - paragraph [ref=f317e482]:
            - strong [ref=f317e483]: What We’re Looking For
          - paragraph [ref=f317e484]:
            - strong [ref=f317e485]
            - strong [ref=f317e486]: Qualifications
          - list [ref=f317e487]:
            - listitem [ref=f317e488]: High school diploma or GED required
            - listitem [ref=f317e489]: Associate degree in Business, Finance, or related field preferred
            - listitem [ref=f317e490]: 3–5 years of experience in consumer loan underwriting and/or lending compliance
            - listitem [ref=f317e491]: Strong understanding of consumer lending regulations and underwriting principles
            - listitem [ref=f317e492]: Experience within a bank, credit union, fintech lender, or similar financial institution preferred
          - paragraph [ref=f317e493]:
            - strong [ref=f317e494]: Skills & Abilities
          - list [ref=f317e495]:
            - listitem [ref=f317e496]: Familiarity with loan origination systems such as MeridianLink Mortgage or similar platforms
            - listitem [ref=f317e497]: Strong analytical and problem-solving abilities
            - listitem [ref=f317e498]: Excellent attention to detail and organizational skills
            - listitem [ref=f317e499]: Ability to manage multiple deadlines and priorities effectively
            - listitem [ref=f317e500]: Professional communication and customer service skills
            - listitem [ref=f317e501]: Ability to work both independently and collaboratively in a team environment
          - paragraph [ref=f317e502]:
            - strong [ref=f317e503]: "Compensation:"
            - text: $60,000 - 75,000 annually, commensurate with experience.
          - paragraph [ref=f317e504]:
            - strong [ref=f317e505]: "Benefits:"
          - list [ref=f317e506]:
            - listitem [ref=f317e507]: Paid Time Off (PTO)
            - listitem [ref=f317e508]: Sick Time
            - listitem [ref=f317e509]: Health Insurance
            - listitem [ref=f317e510]: Dental Insurance
            - listitem [ref=f317e511]: Life Insurance
            - listitem [ref=f317e512]: 401(k) & company match
            - listitem [ref=f317e513]: Flexible Spending Account or Health Savings Account
            - listitem [ref=f317e514]: Continuing Education and Tuition Assistance
            - listitem [ref=f317e515]: Paid Federal Holidays
            - listitem [ref=f317e516]: Reduced Rates on Loans
          - paragraph [ref=f317e517]: If you’re ready to bring your lending and compliance expertise to a dynamic and respected financial institution, we encourage you to apply today.
