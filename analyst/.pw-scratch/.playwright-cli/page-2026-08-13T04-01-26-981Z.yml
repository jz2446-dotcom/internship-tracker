            - listitem [ref=f317e135]: Conduct outreach calls and follow-ups with prospects and existing customers
            - listitem [ref=f317e136]: Represent the bank in the community through events and networking opportunities
            - listitem [ref=f317e137]: Consistently meet or exceed individual and team performance goals
