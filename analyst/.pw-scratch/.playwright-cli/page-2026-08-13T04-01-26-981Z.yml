              - paragraph [ref=f317e114]
              - paragraph [ref=f317e116]: What You’ll Do
          - paragraph [ref=f317e119]: As a key member of our lending team, you'll be the go-to expert for consumer lending - guiding customers from first conversation through closing, while actively building new relationships in the community.
