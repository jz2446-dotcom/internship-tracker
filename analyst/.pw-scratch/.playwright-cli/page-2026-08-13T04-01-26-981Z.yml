          - list [ref=f317e124]:
            - listitem [ref=f317e125]: Meet with customers to understand their needs and recommend the right loan solutions
            - listitem [ref=f317e126]: Originate a variety of consumer loans (home equity, auto, RV, personal, and more)
            - listitem [ref=f317e127]: Guide customers through the entire loan process—from application to closing
            - listitem [ref=f317e128]: Coordinate with underwriting and processing teams to ensure a smooth experience
            - listitem [ref=f317e129]: Deliver exceptional, personalized service that builds long-term loyalty
          - strong [ref=f317e131]: Business Development & Sales
          - list [ref=f317e132]:
