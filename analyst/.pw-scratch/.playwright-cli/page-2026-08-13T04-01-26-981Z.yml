      - generic [ref=f317e74]:
        - paragraph [ref=f317e75]:
          - strong [ref=f317e76]: Why Work at Cayuga Lake National Bank?
        - paragraph [ref=f317e77]: At Cayuga Lake National Bank, you'll enjoy more than just a job - you'll build a rewarding career with an organization that values our employees and the communities we serve.
        - paragraph [ref=f317e78]:
          - strong [ref=f317e79]: "We offer:"
        - list [ref=f317e80]:
          - listitem [ref=f317e81]:
            - strong [ref=f317e82]: Meaningful Work
            - text: "- Help local businesses grow and contribute to the economic strength of the communities we proudly serve."
          - listitem [ref=f317e83]:
            - strong [ref=f317e84]: Supportive Team Environment
            - text: "- Work alongside experienced professionals who value collaboration, respect, and shared success."
          - listitem [ref=f317e85]:
            - strong [ref=f317e86]: Professional Growth
            - text: "- We invest in our employees through training, continuing education, and career development opportunities."
          - listitem [ref=f317e87]:
            - strong [ref=f317e88]: Work-Life Balance
            - text: "- Enjoy a predictable Monday through Friday schedule (some Saturday mornings required), generous paid time off, and a comprehensive benefits package."
          - listitem [ref=f317e89]:
            - strong [ref=f317e90]: Community Commitment
            - text: "- Join a locally focused community bank where decisions are made close to home and relationships matter."
        - paragraph [ref=f317e91]: We are a community minded, supportive and engaging employer.
        - paragraph [ref=f317e92]: Every employee of the bank is held to a high professional standard and committed to the mission of our community bank.
