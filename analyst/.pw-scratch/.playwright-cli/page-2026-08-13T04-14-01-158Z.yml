          - generic [ref=f686e504]:
            - generic [ref=f686e505]:
              - button "1 What is Queens Game?" [expanded] [ref=f686e506] [cursor=pointer]:
                - generic [ref=f686e507]:
                  - generic [ref=f686e508]: "1"
                  - generic [ref=f686e509]: What is Queens Game?
              - paragraph [ref=f686e514]: Queens Game is a strategic logic puzzle where you place queens on a colored grid. Each row, column, and colored region must contain exactly one queen, and no queens can attack each other - even diagonally. It's the perfect blend of strategy and puzzle-solving.
            - generic [ref=f686e515]:
              - button "2 How do you play Queens Game?" [ref=f686e516] [cursor=pointer]:
                - generic [ref=f686e517]:
                  - generic [ref=f686e518]: "2"
                  - generic [ref=f686e519]: How do you play Queens Game?
              - paragraph [ref=f686e523]: "Playing Queens Game is simple: click on a cell to place a queen. Queens can't share the same row, column, or colored region. They also can't touch each other diagonally. Use markers (X) to help plan your moves, and solve puzzles of increasing difficulty from 7×7 to 12×12 grids."
            - generic [ref=f686e524]:
              - button "3 Is Queens Game free to play?" [ref=f686e525] [cursor=pointer]:
                - generic [ref=f686e526]:
                  - generic [ref=f686e527]: "3"
                  - generic [ref=f686e528]: Is Queens Game free to play?
              - paragraph [ref=f686e532]: Yes! Queens Game is completely free to play online. There are no hidden fees, no downloads required, and no account needed to start playing. Access unlimited puzzles instantly from any device with a web browser.
            - generic [ref=f686e533]:
              - button "4 Which grid size should I start with?" [ref=f686e534] [cursor=pointer]:
                - generic [ref=f686e535]:
                  - generic [ref=f686e536]: "4"
                  - generic [ref=f686e537]: Which grid size should I start with?
              - paragraph [ref=f686e541]: We recommend starting with the 7×7 grid if you're new to Queens Game. It's perfect for learning the basic strategies. Once comfortable, progress to 8×8 (classic size), then challenge yourself with 9×9, 10×10, and larger grids up to 12×12 for increasingly complex puzzles.
            - generic [ref=f686e542]:
              - button "5 Can I play Queens Game on mobile?" [ref=f686e543] [cursor=pointer]:
                - generic [ref=f686e544]:
                  - generic [ref=f686e545]: "5"
                  - generic [ref=f686e546]: Can I play Queens Game on mobile?
              - paragraph [ref=f686e550]: Yes! Queens Game is fully optimized for mobile devices. The touch controls are specially designed for smaller screens, making it easy to place queens and markers. Play on your phone, tablet, or desktop - your progress syncs across all devices.
            - generic [ref=f686e551]:
              - button "6 What type of puzzle is Queens Game?" [ref=f686e552] [cursor=pointer]:
                - generic [ref=f686e553]:
                  - generic [ref=f686e554]: "6"
                  - generic [ref=f686e555]: What type of puzzle is Queens Game?
              - paragraph [ref=f686e559]: Queens Game is a region-based logic puzzle where you place pieces following row, column, and region constraints. Our version offers multiple grid sizes from 7x7 to 12x12, each with unique challenges and increasing difficulty.
            - generic [ref=f686e560]:
              - button "7 How many puzzles are available?" [ref=f686e561] [cursor=pointer]:
                - generic [ref=f686e562]:
                  - generic [ref=f686e563]: "7"
                  - generic [ref=f686e564]: How many puzzles are available?
              - paragraph [ref=f686e568]: "Queens Game offers over 1,500 carefully crafted puzzles across all grid sizes — 250 puzzles for each grid size: 7×7, 8×8, 9×9, 10×10, 11×11, and 12×12. New puzzles are added regularly to keep the challenge fresh."
