            - generic [ref=f985e75]:
              - heading "Get involved at the Field" [level=3] [ref=f985e76]
              - generic [ref=f985e77]:
                - paragraph [ref=f985e78]: The Field Museum isn’t just dinosaurs, collections, or research. It’s a vibrant, diverse community of people who share a love of science and passion for discovery. From graduate fellows and teen volunteers to interns and research scholars, we offer a variety of programs to help you learn, grow, and make an impact.
                - paragraph [ref=f985e79]: Come join us and explore the opportunities awaiting you!
            - generic [ref=f985e81]:
              - heading "We are an equal opportunity employer." [level=3] [ref=f985e82]
              - paragraph [ref=f985e84]: We strive to maintain a work environment and culture that is free from harassment and discrimination—and that values and promotes the human dignity of every one of our staff.
              - link [ref=f985e86] [cursor=pointer]:
                - /url: https://www.fieldmuseum.org/about/careers/equal-employment-opportunity-policy
                - text: Equal Employment Opportunity Policy
            - generic [ref=f985e88]:
              - heading "A workplace culture of inclusion & accessibility" [level=3] [ref=f985e89]
              - generic [ref=f985e90]:
                - paragraph [ref=f985e91]: Fostering a welcoming, inclusive, and diverse environment is a foundational commitment of the Field Museum. We strive to be an institution that reflects and supports the wide range of identities, experiences, and perspectives found within our staff, audiences, and communities.
                - paragraph [ref=f985e92]: Our mission, supported by our Culture & Engagement Advisory Council, is to work collaboratively with colleagues throughout the Museum and in coordination with the Board Committee focused on these efforts. Together, we aim to ensure systems and spaces that invite meaningful participation and elevate a broad spectrum of voices, approaches, and insights to help shape the Museum’s mission, culture, practices, and policies.
                - paragraph [ref=f985e93]: We understand that meaningful progress cannot happen in isolation. That’s why we are committed to cultivating connections across the entire Museum community, encouraging all individuals to play an active role in making our institution more inclusive, open, and reflective of the world around us.
