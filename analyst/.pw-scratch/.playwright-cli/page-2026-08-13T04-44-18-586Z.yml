        - generic [ref=f1325e96]:
          - paragraph [ref=f1325e98]: We look for dynamic, creative individuals with the knowledge and experience to join our staff and enhance our reputation as one of the finest comprehensive art museums in the United States.
          - link "View Current Opportunities" [ref=f1325e100] [cursor=pointer]:
            - /url: https://recruiting.ultipro.com/CLE1004CMA/JobBoard/85cb4420-40e1-440b-9c73-ab703c4fa94d/?q=&o=postedDateDesc
      - generic [ref=f1325e107]:
        - paragraph [ref=f1325e108]: The internship program at the Cleveland Museum of Art provides professional learning opportunities for undergraduate and graduate students from a wide range of academic disciplines. Students placed in an internship role work alongside CMA staff on unique projects designed to complement academic instruction through hands-on experience.
        - paragraph [ref=f1325e109]: Each internship opportunity at the CMA is paid and takes place over the course of six to eight weeks during the summer. Internships are available in departments across the institution and for students from a diversity of academic interests.
        - paragraph [ref=f1325e110]: Summer internship opportunities become available early in the spring term of each academic year. Please return to this page often to view open internship positions and apply.
        - paragraph [ref=f1325e111]:
          - text: International applicants, please email your application materials to
          - link "careers@clevelandart.org" [ref=f1325e112] [cursor=pointer]:
            - /url: mailto:careers@clevelandart.org
          - text: .
        - paragraph [ref=f1325e113]
