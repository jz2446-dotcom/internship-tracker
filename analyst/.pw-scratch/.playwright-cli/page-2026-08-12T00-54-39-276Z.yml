                  - text: . Whether you are naming your first company or rebranding a business or product, search existing trademarks and applicable patents.
                - paragraph [ref=f2e11188]: You may be able to register your trademark without difficulty. However, to protect the value of your business, we recommend finding a good intellectual property attorney to assist you. If you’re filing for a patent, we strongly suggest you hire a patent attorney. Patent filings can be very complex.
