          - paragraph [ref=f788e431]:
            - superscript [ref=f788e432]: "2"
            - text: New money is required to open an account. New money is defined as deposits not previously held by Amalgamated Bank.
          - paragraph [ref=f788e433]:
            - superscript [ref=f788e434]: "3"
            - text: The Federal Deposit Insurance Corporation (FDIC) grants deposit insurance of $250,000 per account title. You may also qualify for more than $250,000 in FDIC coverage at Amalgamated Bank if you have single accounts, joint accounts, Individual Retirement Accounts and trust accounts.
          - paragraph [ref=f788e435]:
            - superscript [ref=f788e436]: "4"
            - text: $0 monthly maintenance fee with a qualified direct deposit or $10 if no direct deposit. A qualifying direct deposit is an electronic deposit of your salary, pension, Social Security, or other recurring monthly income to your account. Transfers from one account to another, or deposits made at a branch location, ATM, or through a mobile device, do not qualify as a direct deposit. The monthly service fee will be waived for the first statement cycle to allow you to receive direct deposit to your account. After the first statement cycle, the monthly service fee will be assessed unless your account received direct deposit.
