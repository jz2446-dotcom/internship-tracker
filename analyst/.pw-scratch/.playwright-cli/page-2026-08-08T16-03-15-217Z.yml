      - article [ref=f35e41]:
        - generic [ref=f35e42]:
          - heading "The Morgan Library & Museum 2025 Summer Internships" [level=1] [ref=f35e44]
          - generic [ref=f35e45]:
            - generic [ref=f35e46]:
              - generic [ref=f35e47]: " Posted on:"
              - link [ref=f35e48] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/2025/03/18/the-morgan-library-museum-2025-summer-internships/
                - time [ref=f35e49]: March 18, 2025
              - text: 
            - generic [ref=f35e50]:
              - generic [ref=f35e51]: " Written by:"
              - link "Charlie Maliha" [ref=f35e52] [cursor=pointer]:
                - /url: https://wp.nyu.edu/gsas-museumstudies_jobs_internships/author/cm6232/
          - generic [ref=f35e53]:
            - paragraph [ref=f35e54]:
              - strong [ref=f35e56]: The Morgan Library & Museum 2025 Summer Internships
              - text: (Part-time, paid)
            - article [ref=f35e58]:
              - generic [ref=f35e61]:
                - paragraph [ref=f35e62]: The Morgan Library & Museum welcomes applications for its 2025 paid summer internship program. The program will provide an introduction to the variety of career opportunities available in museums and special collection libraries. Each intern will be assigned to a department relevant to their interest and work with departmental staff on timely topics in that area. Interns will also have the opportunity to learn about the Morgan, and the museum and special collection fields more generally, through professional development opportunities such as facility tours and meetings with museum leadership.
                - paragraph [ref=f35e63]: Please see detailed application instructions below. The Morgan especially seeks to provide opportunities to candidates with experiences and perspectives that have not been adequately reflected in the museum and special collection libraries fields.
                - paragraph [ref=f35e64]: "For summer 2025, internships are available in the following areas:"
                - paragraph [ref=f35e65]:
                  - strong [ref=f35e66]: Drawings and Prints Internship
                  - text: The department of Drawings and Prints seeks an intern to assist with the sorting and cataloguing of the Janos Scholz archive. A cellist by profession, Scholz (1903–1993) became a major collector of Italian drawings, eventually giving more than 1500 sheets to the Morgan. His archive includes a wealth of information about his collection, and through his correspondence with scholars over more than fifty years also provides a microcosm of the art market, exhibition practice, provenance research, and scholarship on Italian drawings. The intern would work under the supervision of John Marciari, Director of Curatorial Affairs and Head of the Department of Drawings and Prints, and during residency at the Morgan would be exposed to all the activities of the curatorial department. Candidates should have an interest in archives and/or Italian art ca. 1450–1750 and ability to read one or more European languages.
                - paragraph [ref=f35e67]:
                  - strong [ref=f35e68]: Imaging and Rights Internship
                  - text: This internship offers a unique opportunity to gain experience in Imaging and Rights. The successful candidate will assist with an inventory of analogue image assets and paper files, in addition to assisting with Morgan publications and exhibitions, organizing images and spreadsheets, assisting with color proofing and maintaining image and copyright credits. The intern will also update descriptive metadata in image files and will ingest these prepared image files into the Morgan digital asset management system (DAM). This requires accessing databases, embedding metadata into image files, and after DAM ingest, reviewing, revising and correcting data when necessary.
                - paragraph [ref=f35e69]:
                  - strong [ref=f35e70]: Modern and Contemporary Drawings Internship
                  - text: The Department of Modern and Contemporary Drawings at The Morgan Library & Museum seeks an intern to work directly with and be mentored by the curatorial team. The intern’s responsibilities will include identifying collection items that need imaging, adding images to artist files, ongoing collection research in libraries and archives, writing short descriptions and wall labels, as well as conducting upcoming exhibition research. The candidate should have knowledge of and interest in modern and contemporary art and be available a minimum of two days per week.
                - paragraph [ref=f35e71]:
                  - strong [ref=f35e72]: Photography Internship
                  - text: The Department of Photography seeks a summer intern to work with the assistant curator of photography in organizing a collection of materials related to the origins and growth of the art market for photography. The project entails sequencing, filing, cataloguing, and, as required, researching a gift of printed matter that reflects the historical evolution of dedicated institutions (auctions, galleries, museum departments, other specialized institutions) around photography from the 1970s to the recent past. The collection includes invitations, flyers, catalogs and mailers, posters, conference brochures, checklists, price lists, press releases, clippings, and correspondence.
                - paragraph [ref=f35e73]:
                  - strong [ref=f35e74]: Public Programs Internship
                  - text: "The Public Programs intern participates in the Morgan’s exhibition and collections-based programs for adults and college students, including lectures, concerts, film screenings, workshops, virtual programs and gallery talks. The candidate should demonstrate a keen interest in the field of museum education and in arts and humanities, attention to detail, and excellent writing and communication skills. The intern will assist in researching and implementing programs, specifically the development of virtual programs and college tours. The candidate will support all programs during their internship, and will provide administrative support including attendance tracking, data collection and reporting, and survey collection and analysis. Saturdays and some evening hours may be required. Physical requirements include being mobile in public spaces for several hours at a time, and lifting, bending, reaching top shelves, and pushing carts. Proficiency in Microsoft Office required. The Public Programs Intern reports to the Manager of Public Programs. Please note: Preference will be given to candidates who are able to adapt to a schedule that will sometimes include Saturday or evening hours. Candidates should address this in their applications"
                - paragraph [ref=f35e75]:
                  - strong [ref=f35e76]: Sherman Fairchild Reading Room Internship
                  - text: The Sherman Fairchild Reading Room seeks an intern that will be an active member of the Reading Room team. The successful candidate will experience invigilating rare material, conduct preliminary research for readers and retrieve material from our Reference Collection. They will be supervised and mentored by the Head of Reader Services. Intern tasks will include but are not limited to sorting, paging, and reshelving reference books and other secondary source materials, including microfilms and internal files, as well as inputting and updating electronic records. The intern will also work on other library projects and miscellaneous office tasks related to statistical gathering and processing. The intern will work primarily in the Sherman Fairchild Reading Room. Candidates must be committed to working 28 hours per week.
                - paragraph [ref=f35e77]:
                  - strong [ref=f35e78]: School, Youth and Family Programs Education Internship
                  - text: "The School, Youth and Family Programs Intern participates in the Morgan’s summer youth programming, including summer camp tours, teacher professional development workshops, and teen and family programs. The candidate should demonstrate a keen interest in the field of museum education and in the arts and humanities, attention to detail, and excellent writing and communication skills. The intern will support all school and youth programs including researching and implementing programs, helping with set-up and clean-up of workshops, maintenance of program supplies, and administrative support including attendance tracking, data collection and reporting, and survey collection and analysis. Some weekend and evening hours may be required, including Saturday, June 14, Saturday, July 5, and Saturday, August 2. Physical requirements include being mobile in public spaces for several hours at a time, and lifting, bending, reaching top shelves, and pushing carts. Proficiency in Microsoft Office required. The School, Youth and Family Programs Intern reports to the Manager of School, Youth and Family Programs. Please note: Preference will be given to candidates who are able to adapt to a schedule that will sometimes include Saturday or evening hours. Candidates should address this in their applications."
                - paragraph [ref=f35e79]:
                  - strong [ref=f35e80]: "Eligibility:"
                - list [ref=f35e81]:
                  - listitem [ref=f35e82]: Current enrollment as an undergraduate or graduate student.
                  - listitem [ref=f35e83]: Strong interest in a career in the museum or library field.
                  - listitem [ref=f35e84]: Eligibility to work in the United States (international candidates must be eligible to participate in a paid internship program in the United States).
                  - listitem [ref=f35e85]: Strong verbal and written communications skills.
                - paragraph [ref=f35e86]: The Morgan requires all employees, including interns, to have been vaccinated against the COVID-19 virus.
              - generic [ref=f35e87]:
                - strong [ref=f35e90]: "Compensation:"
                - generic [ref=f35e92]:
                  - paragraph [ref=f35e93]: $19 per hour.
                  - paragraph [ref=f35e94]: Summer internships are onsite at the Morgan, with interns generally working up to twenty-eight hours per week for up to twelve weeks, beginning at the end of May and running through mid to late August.
              - generic [ref=f35e95]:
                - generic [ref=f35e96]: "To apply:"
                - generic [ref=f35e98]:
                  - paragraph [ref=f35e99]: Interns will be selected on a competitive basis via an application process. The deadline to apply for an internship is April 14, 2025.
                  - paragraph [ref=f35e100]:
                    - strong [ref=f35e101]: "How To Apply:"
                    - text: To apply, submit the following materials, in English, via email as a
                    - strong [ref=f35e102]: single PDF
                    - text: "to the following address:"
                    - link "internships@themorgan.org" [ref=f35e103] [cursor=pointer]:
                      - /url: mailto:internships@themorgan.org
                    - text: "(In the subject line please include the following format: First and Last Name – Internship you are applying to)"
                  - list [ref=f35e104]:
                    - listitem [ref=f35e105]:
                      - text: "A cover letter containing the following information:"
                      - list [ref=f35e106]:
                        - listitem [ref=f35e107]:
                          - text: "The internship of interest to you. Specify ONE from the following:"
                          - list [ref=f35e108]:
                            - listitem [ref=f35e109]: Drawings and Prints
                            - listitem [ref=f35e110]: Imaging and Rights
                            - listitem [ref=f35e111]: Modern and Contemporary Drawings
                            - listitem [ref=f35e112]: Photography
                            - listitem [ref=f35e113]: Public Programs
                            - listitem [ref=f35e114]: The Reading Room
                            - listitem [ref=f35e115]: School, Youth, and Family Programs Education
                        - listitem [ref=f35e116]: A statement regarding your interest in the museum or library field, and your future aspirations.
                        - listitem [ref=f35e117]: A statement about why diversity and inclusion are important to you within the museum or library field, and how this opportunity will assist your career goals?
                    - listitem [ref=f35e118]: Any other information that you would like to provide regarding your candidacy for a Morgan academic year internship.
                    - listitem [ref=f35e119]: Your resume
                    - listitem [ref=f35e120]: Please indicate the days of the week you would be available to be on-site at the Morgan as an intern and to participate in the professional development programs.
                    - listitem [ref=f35e121]: The names and contact information of two references (please include the person’s name, title, organization, telephone number, and email address)
                  - paragraph [ref=f35e122]:
                    - text: Please note that applications received without all requested information, including a cover letter, will not be considered. Candidates selected for interviews will be contacted before
                    - strong [ref=f35e123]: April 29th
                    - text: ", with notification of decision following soon thereafter. No phone calls, please."
                  - paragraph [ref=f35e124]:
                    - strong [ref=f35e125]: About the Morgan Library & Museum
                    - text: A museum and independent research library located in the heart of New York City, the Morgan Library & Museum began as the personal library of financier, collector, and cultural benefactor J. Pierpont Morgan (1837–1913). The Morgan offers the public close encounters with great works of human accomplishment in a setting treasured for its intimate scale and historic significance. Its collections of manuscripts, rare books, music, drawings, and other works of art comprise a unique record of civilization, as well as an incomparable repository of ideas and the creative process.
                  - paragraph [ref=f35e126]: Support for the Morgan Library & Museum summer Internship Program is provided by the Themis Brown Endowment Fund.
              - list [ref=f35e128]:
                - listitem [ref=f35e129]:
                  - link [ref=f35e130] [cursor=pointer]:
                    - /url: https://www.themorgan.org/print/1381491
                    - img "Printer-friendly version" [ref=f35e131]
                    - text: Printer-friendly version
            - generic [ref=f35e132]:
              - text: The Morgan Library & Museum receives many applications and inquiries for employment. Unfortunately, we are not able to respond to all of them. Due to the high volume of applicants, we can contact only those candidates whose skills and background best fit our needs.
              - paragraph
              - paragraph [ref=f35e133]:
                - strong [ref=f35e134]: "Important to note:"
              - paragraph [ref=f35e135]:
                - strong [ref=f35e136]: Vaccination Requirement
                - text: To ensure the overall health and safety of the Morgan Library & Museum campus, all staff of the Morgan are required to be vaccinated against the virus that causes COVID-19, absent qualifying exemptions for medical, religious, or other reasons in accordance with applicable laws.
              - paragraph [ref=f35e137]:
                - strong [ref=f35e138]: EEO Statement
                - text: The Morgan is an Equal Opportunity Employer and is committed to complying with all federal, state, and local equal employment opportunity laws. The Morgan provides equal employment opportunities to all employees and applicants for employment without regard to race or color, religion or creed, alienage or citizenship status, sex (including pregnancy), national origin, age, sexual orientation, gender identity or expression, sexual and reproductive health decisions or decision making (of covered persons or their dependents), disability, height, weight, marital status, familial status, domestic partnership status, caregiver status, genetic information or predisposing genetic characteristics, military status, domestic violence, sexual violence, or stalking victim status, pre-employment arrest record, or any other characteristic protected by law.
              - paragraph [ref=f35e139]: The statements herein are intended to describe the general nature and level of work being performed by employees and are not to be construed as an exhaustive list of responsibilities, duties, and skills required of personnel so classified. Furthermore, they do not establish a contract for employment and are subject to change at the discretion of the employer.
              - paragraph [ref=f35e140]: This job was sourced via Handshake.
