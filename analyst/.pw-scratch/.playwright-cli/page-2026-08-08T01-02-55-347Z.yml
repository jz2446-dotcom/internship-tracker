        - strong [ref=f457e453]: "Prioritizing Your Security:"
        - text: Freddie Mac has been made aware of email and text correspondence that falsely state that they are from Freddie Mac and/or its senior leaders. These scams, which may seek to obtain money and/or, in many cases, personal details from the recipients on the pretense of securing a job at Freddie Mac, are fraudulent. Freddie Mac does not charge any fee and does not request information about any person’s bank account during the recruitment process. Freddie Mac strongly recommends that the recipients of these solicitations exercise extreme caution. Financial loss and identity theft could result from the transfer of money or personal information to those issuing this correspondence. To report such scams, contact our Compliance Helpline at 1-877-301-2633.
        - strong [ref=f457e454]: "Notice to External Search Firms:"
        - text: Freddie Mac partners with BountyJobs for contingency search business through outside firms. Resumes received outside the BountyJobs system will be considered unsolicited and Freddie Mac will not be obligated to pay a placement fee. If interested in learning more, please visit
        - link "www.BountyJobs.com" [ref=f457e455] [cursor=pointer]:
