                  - generic [ref=f923e394]:
                    - paragraph [ref=f923e395]
                    - paragraph [ref=f923e396]: Our purpose – Opening up a world of opportunity – explains why we exist. Here at HSBC we use our unique expertise, capabilities, breadth and perspectives to open up new kinds of opportunity for our more than 40 million customers. We’re bringing together the people, ideas and capital that nurture progress and growth, helping to create a better world – for our customers, our people, our investors, our communities and the planet we all share.
                    - paragraph [ref=f923e397]
                    - paragraph [ref=f923e398]: In compliance with applicable laws, HSBC is committed to employing only those who are authorized to work in the US. Applicants must be legally authorized to work in the U.S. as HSBC will not engage in immigration sponsorship for this position.
                    - paragraph [ref=f923e399]
                    - paragraph [ref=f923e400]: "Our purpose – Opening up a world of opportunity – explains why we exist. Here at HSBC we use our unique expertise, capabilities, breadth and perspectives to open up new kinds of opportunity for our more than 40 million customers. We’re bringing together the people, ideas and capital that nurture progress and growth, helping to create a better world – for our customers, our people, our investors, our communities and the planet we all share.The purpose of the role is to provide Business Insights and control oversight to Markets Security Services (MSS), Chief Financial Officer (CFO) and Global Markets and Security Services (MSS) business. The Jobholder supports the Business Finance MI team which includes Americas remit covering 5 Latin America countries, Canada and US.As our Business Finance Associate you will:"
                    - paragraph [ref=f923e401]
                    - list [ref=f923e402]:
                      - listitem [ref=f923e403]: Work with business and global team to manage budgeting and monthly forecast planning process for Americas which includes Revenue, Cost, Balance Sheet (GAAP-Generally Accepted Accounting Principles / IFRS- International Financial Reporting Standards) and Risk-Weighted Assets (RWAs)
                      - listitem [ref=f923e404]: Support decision making by providing stakeholders with timely, detailed and meaningful insights and visibility on business performance
                      - listitem [ref=f923e405]: Analyze actuals against budget / forecast and prior year results
                      - listitem [ref=f923e406]: Work with product control as well as MSS business line heads to review revenue drivers
                      - listitem [ref=f923e407]: Review and understanding cost drivers for each business line and working with business / global teams to identify possible savings.
                      - listitem [ref=f923e408]: Provide support to Analysis & Insight team to be able to articulate performance drivers as well as risks to senior stake holders.
                      - listitem [ref=f923e409]: Provide support to transformation team on strategic initiatives in MSS.
                      - listitem [ref=f923e410]: Perform adhoc analysis where required to assist in management decision making
                      - listitem [ref=f923e411]: Create and deliver presentations of analysis, trends, metrics and results. Support presentations with supporting analysis, assumptions, calculations and conclusions.
                      - listitem [ref=f923e412]: Partner with other Business Finance colleagues across GPB, other lines of business, functions and HOST on all relevant matters
                      - listitem [ref=f923e413]: Promote an environment that supports diversity and reflects the HSBC brand.
                    - paragraph [ref=f923e414]: The final fixed pay offer will depend on the candidate and a number of variables, including but not limited to, role responsibilities, skill set, depth of experience and education, licensing/certification requirements, internal relativity, and specific work location.At HSBC, our overall goal is to provide a competitive Total Reward Package, with an appropriate mix of fixed pay, and variable pay, as part of an employee’s overall total compensation and benefits. Variable pay generally takes the form of discretionary, annual awards (sometimes referred to as a “bonus”). Additionally, HSBC offers a wide range of competitive and flexible benefits designed to help you improve your health and well-being, finances, and lifestyle.
                    - paragraph [ref=f923e415]
                    - paragraph [ref=f923e416]: "You´ll likely have the following qualifications to succeed in this role:"
                    - list [ref=f923e417]:
                      - listitem [ref=f923e418]: Proven experience in financial analysis, budgeting and forecasting
                      - listitem [ref=f923e419]: Strong stakeholder management and business partnering skills
                      - listitem [ref=f923e420]: Excellent communication and presentation skills, able to translate data into clear insights
                      - listitem [ref=f923e421]: Ability to produce high-quality management information and concise performance packs (trends, metrics, assumptions, conclusions)
                      - listitem [ref=f923e422]: Python desirable
                      - listitem [ref=f923e423]: Financial Markets knowledge preferred (not essential)
                    - paragraph [ref=f923e424]: In compliance with applicable laws, HSBC is committed to employing only those who are authorized to work in the U.S. Applicants must be legally authorized to work in the U.S. as HSBC will not engage in immigration sponsorship for this position.
                    - paragraph [ref=f923e425]
                    - paragraph [ref=f923e426]:
                      - generic [ref=f923e427]: As an HSBC employee, you will have access to tailored professional development opportunities to ensure you have the right skills for today and tomorrow. We offer a competitive pay and benefits package including a robust Wellness Hub, all in a welcoming and inclusive work environment. You will be empowered to drive HSBC’s engagement with the communities we serve through an industry-leading volunteerism policy, a generous matching gift program, and a comprehensive program of immersive Sustainability and Climate Change Initiatives. You’ll want to join our Employee Resource Groups as they play a central part in life at HSBC, including the development of our employees and networking inside and outside of HSBC. We value difference. We succeed together. We take responsibility. We get it done. And we want you to help us build the bank of the future!
                    - paragraph [ref=f923e428]
                    - paragraph [ref=f923e429]:
                      - generic [ref=f923e430]: The final fixed pay offer will depend on the candidate and a number of variables, including but not limited to, role responsibilities, skill set, depth of experience and education, licensing/certification requirements, internal relativity, and specific work location.
