                    - paragraph [ref=f923e721]: "We offer free, confidential 24/7 access to counselling, manager mental health training, and mindfulness apps to help you manage stress. That’s why three out of four colleagues feel comfortable talking to their managers about their mental health – and we ranked #1 global employer in the CCLA Global 100 Mental Health Benchmark."
