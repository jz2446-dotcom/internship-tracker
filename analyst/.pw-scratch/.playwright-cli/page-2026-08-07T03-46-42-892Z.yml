          - generic [ref=f42e179]:
            - tabpanel [ref=f42e180]:
              - generic [ref=f42e181]:
                - generic [ref=f42e182]: Human Resources Leaderhip Program
                - emphasis [ref=f42e184]: "\"My Human Resources Internship experience was a career game changer for me. The accelerated nature meant I was immersed in different parts of the business quickly while building relationships. There was extensive learning and development embedded in the program, and I really felt the investment in me. I wouldn't be where I am now without my internship experience.\""
                - generic [ref=f42e185]: Lesley, Previous Intern, Program Participant ⚋
            - tabpanel [ref=f42e186]:
              - generic [ref=f42e187]:
                - generic [ref=f42e188]: Supply Chain Leadership Program
                - emphasis [ref=f42e190]: "\"Our internship programs at GE Aerospace are unlike any other internship experiences, we welcome interns and give them assignments with real responsibility. They experience value add opportunities that give them an insight of what it will be like to work at GE after they graduate. So we're not sending anyone in to do busy work.\""
                - generic [ref=f42e191]: April, Leader ⚋
            - tabpanel [ref=f42e192]:
              - generic [ref=f42e193]:
                - generic [ref=f42e194]: Internships and Co-Ops
                - emphasis [ref=f42e198]: "\"Students get to experience a lot in a short amount of time in their internship or co-op. It gives them a really good foundation to learn a little bit about what they want to do either for their next internship or co-op rotation with us, or even what they're wanting to do full time.\""
                - generic [ref=f42e199]: Maeve, Internship & Co-Op Experience Leader ⚋
            - tabpanel [ref=f42e200]:
              - generic [ref=f42e201]:
                - generic [ref=f42e202]: Supply Chain Manufacturing
                - emphasis [ref=f42e204]: "\"Being part of the program has allowed me to try variety of roles, whether that's engineering, shop operations, or delivery and sourcing. Being exposed to variety of roles has allowed me to see different aspects of the business, which will set me up for future success in my career.\""
                - generic [ref=f42e205]: Brian, Intern ⚋
            - tabpanel [ref=f42e206]:
