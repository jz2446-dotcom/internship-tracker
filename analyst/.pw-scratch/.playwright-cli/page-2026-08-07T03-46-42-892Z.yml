      - heading "Internships, Co-Ops, & Apprenticeships in the United States" [level=1] [ref=f42e76]
      - generic [ref=f42e80]:
        - text: "Internships at GE Aerospace are an opportunity to learn while doing, grow your skills and expereinces, and work alongside the brightest minds and leaders in the industry. Our interns work together to solve real-world challenges, sometimes spurring innovations that change the way we do business. An internship at GE Aerospace allows you to explore a brilliant future, while doing work that makes an immediate impact. Our Internships:"
        - list [ref=f42e81]:
          - listitem [ref=f42e82]: Are paid positions
          - listitem [ref=f42e83]: Give you the opportunity to gain hands-on experience in your area of study
          - listitem [ref=f42e84]: Allow you to network with other interns, employees, and leaders around the world
          - listitem [ref=f42e85]: May provide relocation and stipends
