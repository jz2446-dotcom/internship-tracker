              - heading "Belonging" [level=2] [ref=f92e199]
              - paragraph [ref=f92e200]: At Amalgamated Bank, we believe that maintaining a diverse and inclusive workplace where everyone feels valued and respected is essential for us to grow as a company. We are dedicated to building a more equitable world in our everyday practices by embracing the values of our employees and customers.
            - generic [ref=f92e203]:
              - generic [ref=f92e204]:
                - heading "5" [level=2] [ref=f92e205]
