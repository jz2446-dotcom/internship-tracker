            - generic [ref=f92e211]:
              - heading "Benefits" [level=2] [ref=f92e212]
              - paragraph [ref=f92e213]: At Amalgamated Bank, our employees are our greatest asset and investing in their well-being is essential. We are committed to investing in our employees through a comprehensive compensation and benefits package that includes health insurance, life and disability, retirement benefits and programs to help you with work/life balance.
            - generic [ref=f92e216]:
              - generic [ref=f92e218]:
                - img "healthcare icon" [ref=f92e220]
                - generic [ref=f92e221]:
                  - heading "Health Care Benefits" [level=4] [ref=f92e222]
                  - paragraph [ref=f92e224]: Our health care benefits include medical, dental and vision care plans. We also provide mental health support and resources to ensure the needs of any employee is met.
              - generic [ref=f92e226]:
                - img "airplane and globe icon" [ref=f92e228]
                - generic [ref=f92e229]:
                  - heading "Paid Vacation, Holiday, and Personal Days" [level=4] [ref=f92e230]
                  - paragraph [ref=f92e232]: We encourage our employees to take time off throughout the year to enjoy time away from the office with family and friends. We also offer one paid volunteer day per year.
              - generic [ref=f92e234]:
