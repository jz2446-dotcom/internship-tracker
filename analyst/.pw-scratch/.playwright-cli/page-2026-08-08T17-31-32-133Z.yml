          - generic [ref=f92e345]:
            - generic [ref=f92e346]: What's it like to work here?
            - generic [ref=f92e350]:
              - generic [ref=f92e351]:
                - paragraph [ref=f92e354]: I came to Amalgamated after a decade in the nonprofit sector, having experienced the Bank as both an individual and organizational client. My role at Amalgamated allows me to support resource mobilization for racial justice in new ways, and I enjoy partnering with clients to align their operations with their values.
                - generic [ref=f92e355]: Caitlin Duffy
                - generic [ref=f92e356]: First Vice President, Commercial Banking - Washington D.C.
              - generic [ref=f92e357]:
                - paragraph [ref=f92e360]: Amalgamated’s socially responsible principles are embedded throughout our work, internal policies, and how we show up for clients, which makes working with my collaborative colleagues and excellent support team deeply fulfilling. As a social impact banker, I get to work with nonprofits, campaigns, foundations, and social enterprises that are making the world a better place by helping them align their money with their values.
                - generic [ref=f92e361]: Dara Kagan
                - generic [ref=f92e362]: First Vice President, Commercial Banking - New York
