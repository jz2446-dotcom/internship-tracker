  - main [ref=f72e48]:
    - generic [ref=f72e57]:
      - heading "Internship and work placement programmes" [level=1] [ref=f72e58]
      - paragraph [ref=f72e60]: On an internship or work placement, you’ll develop the skills you need to thrive and explore the opportunities that come with working for one of the world’s great international banks.
      - link "Apply now on our Internships" [ref=f72e61] [cursor=pointer]:
        - /url: /careers/students-and-graduates/find-a-programme?programme-type=internship-programme
        - text: Apply now
    - generic [ref=f72e70]:
      - heading "Who you are" [level=2] [ref=f72e71]
      - paragraph [ref=f72e72]: These programmes are suitable for you if you’re in your penultimate year of study or recently graduated. They’ll give you a real-life insight into a future career. Like what you see and perform well, and you’ll be offered the opportunity to join us on a graduate programme.
      - paragraph [ref=f72e73]: We use skill-based hiring to look beyond your CV because we know you’re so much more than what you studied. We assess for the qualities that we know will mean you’ll thrive at HSBC – if you can demonstrate those and have a willingness to never stop learning, we’ll teach you the technical stuff.
