          - text: Scottish form of
          - link "Ragnvaldr" [ref=f644e95] [cursor=pointer]:
            - /url: /name/ragnvaldr
          - text: ", a name introduced to Britain by Scandinavian settlers and invaders . It became popular outside Scotland during the 20th century. A famous bearer was the American actor and president Ronald Reagan (1911-2004). It is also associated with Ronald McDonald, the clown mascot for the McDonald's chain of restaurants, first appearing in 1963."
