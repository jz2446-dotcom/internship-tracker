    - generic [ref=f204e288]:
      - heading "Got PrEP questions?" [level=2] [ref=f204e291]
      - paragraph [ref=f204e293]: Our team has the answers
      - generic [ref=f204e294]:
        - generic [ref=f204e296]:
          - generic [ref=f204e297] [cursor=pointer]: What is PrEP?
          - list [ref=f204e301]:
            - listitem [ref=f204e302]: PrEP (pre-exposure prophylaxis) is a medication strategy for helping to prevent HIV.
            - listitem [ref=f204e303]: Most people take PrEP as one pill once a day. When taken as prescribed, it can effectively reduce the risk of getting HIV through sex.
            - listitem [ref=f204e304]: There are a few different types of PrEP, which mostly vary in cost and in their side effect profiles.
        - generic [ref=f204e307]:
          - generic [ref=f204e308] [cursor=pointer]: What are the possible side effects of PrEP?
          - list [ref=f204e312]:
            - listitem [ref=f204e313]: A small number of people may have some nausea or upset stomach when they start PrEP, but this usually clears up in a few weeks.
            - listitem [ref=f204e314]: In the longer term, some types of PrEP have a low risk of reducing your kidney function or bone density. This is usually reversed by stopping PrEP or switching to a different form of PrEP.
            - listitem [ref=f204e315]: There are a few different types of PrEP, which mostly vary in cost and in their side effect profiles.
        - generic [ref=f204e318]:
          - generic [ref=f204e319] [cursor=pointer]: Can women and trans people take PrEP?
          - list [ref=f204e323]:
            - listitem [ref=f204e324]: PrEP isn’t just for cisgender men. Anyone of any gender can take PrEP to help prevent HIV.
            - listitem [ref=f204e325]: If your sex partners were born with a penis and any of their other partners were born with a penis, then you could be a good fit for PrEP.
            - listitem [ref=f204e326]: You might also benefit if you inject drugs or belong to a community with high HIV rates.
        - generic [ref=f204e329]:
          - generic [ref=f204e330] [cursor=pointer]: I’ve heard PrEP medications are expensive. What will I pay for PrEP?
          - list [ref=f204e334]:
            - listitem [ref=f204e335]:
              - text: PrEP
              - emphasis [ref=f204e336]: can
              - text: be expensive —
              - strong [ref=f204e337]: but over 90% of Freddie patients pay $0 for PrEP.
            - listitem [ref=f204e338]:
              - text: Most people have coverage through their
              - strong [ref=f204e339]: private health insurance plan
              - text: . If you have an amount to pay after this is applied, our financial assistance program will usually cover the rest. For the small number of people who aren’t completely covered, the amount they pay is reduced. No matter your situation, we’ll work with you to find the best way to get you protected against HIV.
        - generic [ref=f204e342]:
          - generic [ref=f204e343] [cursor=pointer]: If PrEP is free for most patients, how does Freddie make money?
          - list [ref=f204e347]:
            - listitem [ref=f204e348]: When you get free medication of any kind, it still costs money — your insurance provider just pays for it instead of you.
            - listitem [ref=f204e349]: In each state, Freddie and our community-based partners both make money when your private insurance pays for your PrEP at one of our partner pharmacies.
            - listitem [ref=f204e350]: Freddie uses this money to pay for all of our services, and our local community partners make money so they can serve even more people.
        - generic [ref=f204e353]:
          - generic [ref=f204e354] [cursor=pointer]: What are the reasons to use Freddie instead of my primary care physician?
          - list [ref=f204e358]:
            - listitem [ref=f204e359]: Some people might find it awkward talking about sex with their doctor. At Freddie, we’re experts in PrEP and sexual health. We offer an affirming space to help you decide what’s best for your sex life.
            - listitem [ref=f204e360]: Because Freddie is virtual, it’s also discreet. You take your appointments at home and your PrEP can be delivered to your door. We'll even deliver your testing to you!
            - listitem [ref=f204e361]: With Freddie, you choose when and how to take your appointments — by video call, phone or message.
        - generic [ref=f204e364]:
          - generic [ref=f204e365] [cursor=pointer]: I already get PrEP from somewhere else. Can I still use Freddie?
          - list [ref=f204e369]:
            - listitem [ref=f204e370]: Yes! If you’re already on PrEP, you can switch to Freddie for an even easier way to get it.
            - listitem [ref=f204e371]: When taking our free online questionnaire, be sure to mention that you’re already taking PrEP.
        - generic [ref=f204e374]:
          - generic [ref=f204e375] [cursor=pointer]: Does Freddie offer DoxyPEP?
          - list [ref=f204e379]:
            - listitem [ref=f204e380]: DoxyPEP is short for doxycycline post-exposure prophylaxis. It’s where you take an antibiotic after condomless sex to help prevent bacterial STIs. It doesn’t eliminate your risk, but it can help lower it.
            - listitem [ref=f204e381]: Freddie only offers PEP to PrEP or HIV Care patients to ensure quality care. If you’re a good fit for one, you’re probably a good fit for the other. And we can monitor your health more effectively if both your medications are coming from one place.
            - listitem [ref=f204e382]: PEP does not help prevent HIV and is NOT a replacement for PrEP.
        - generic [ref=f204e385]:
          - generic [ref=f204e386] [cursor=pointer]: Where is Freddie available?
          - paragraph [ref=f204e390]:
            - text: Freddie is available in
            - strong [ref=f204e391]: all 50 US states.
