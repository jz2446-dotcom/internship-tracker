            - generic [ref=f204e227]:
              - generic [ref=f204e228]: ★★★★★
              - generic [ref=f204e229]: The best customer service that I have ever received, anywhere, in my life! The staff go above and beyond for the wellbeing of their patients. They are always punctual, friendly, informative and helpful. Setting up appointments is so easy and everything else is taken care of flawlessly. If you're thinking of signing up for Freddie, you absolutely should.
              - generic [ref=f204e230]:
                - strong [ref=f204e232]: Benjamin S
                - generic [ref=f204e233]: Verified
          - group "2 of 5" [ref=f204e235]:
            - generic [ref=f204e237]:
              - generic [ref=f204e238]: ★★★★★
              - generic [ref=f204e239]: Freddie has been taking care of me for a couple of years. They monitor me and my health closely and make recommendations that are beneficial to my health and wellbeing. It’s been so easy to do, and it’s helped me feel a lot more safe and less anxious. They are great!!
              - generic [ref=f204e240]:
                - strong [ref=f204e242]: Denis L
                - generic [ref=f204e243]: Verified
          - group "3 of 5" [ref=f204e245]:
            - generic [ref=f204e247]:
              - generic [ref=f204e248]: ★★★★★
              - generic [ref=f204e249]: The team is so inclusive, and easy to work with. Everything from the over the phone consult, blood work and then delivery of PrEP to my front door was easy. I have recommended so many friends to use Freddie and I would tell anyone to at least have a conversation with a clinician and see if PrEP can work for you and your lifestyle.
              - generic [ref=f204e250]:
                - strong [ref=f204e252]: Erik M
                - generic [ref=f204e253]: Verified
          - group [ref=f204e255]:
            - generic [ref=f204e257]:
              - generic [ref=f204e258]: ★★★★★
              - generic [ref=f204e259]: Better than my family doctor, they follow up every 6 months, and they also give you info how to get PrEP fully covered when you only have 70% coverage in health benefits! They also tell you every bit of info on the medication, seriously I wish every health network was like this.
