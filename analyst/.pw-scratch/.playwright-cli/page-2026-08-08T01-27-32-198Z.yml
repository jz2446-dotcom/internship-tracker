    - heading "Miami-Dade Public Library System and CareerSource South Florida open hiring and training center at the Main Library" [level=1] [ref=f284e62]
    - generic [ref=f284e63]:
      - strong [ref=f284e64]: MIAMI-DADE ( February 12, 2026 )–
      - paragraph [ref=f284e65]:
        - text: On Tuesday, February 17, at noon, Miami-Dade County Mayor Daniella Levine Cava, the
        - link "Miami-Dade Public Library System" [ref=f284e66] [cursor=pointer]:
          - /url: http://www.mdpls.org/
        - text: (Library) and
        - link "CareerSource South Florida" [ref=f284e67] [cursor=pointer]:
          - /url: https://www.careersourcesfl.com/
        - text: (CSSF) will host a ribbon-cutting ceremony to celebrate the official grand opening of a new CareerSource South Florida hiring and training center at the Main Library in downtown Miami. The center expands community access to workforce development, career training and digital equity services.
      - paragraph [ref=f284e68]: “This new CareerSource South Florida Center reflects our commitment to expanding access to job training and employment opportunities for all residents,” said Miami-Dade County Mayor Daniella Levine Cava. “Through our No Wrong Door approach, this partnership meets people where they are and connects them to career services, digital literacy and reliable internet access. As part of our Broadband and Digital Equity Plan, it’s a wise investment in strengthening our workforce and creating pathways to long-term economic success.”
      - paragraph [ref=f284e69]: Through this collaborative initiative, job seekers and employers can access CareerSource South Florida’s comprehensive hiring and training services at the Main Library – a trusted, welcoming community anchor in a central location. Services include employment assistance and job-readiness support, such as résumé writing and interview preparation, connections to employers, access to technology and workspaces to apply for jobs and more.
      - paragraph [ref=f284e70]: The new center is funded by a $1,247,397 digital equity grant from the FloridaCommerce Office of Broadband, awarded to CSSF in partnership with the Library. The funding is part of the Office of Broadband’s first round of subgrants to renovate and construct multi-purpose community spaces that expand access to workforce development, education and health monitoring services.
      - paragraph [ref=f284e71]: Miami-Dade County has received more than $13.5 million through the first round of digital equity funding to support Countywide projects that enhance access to digital resources and reliable internet services, advancing the County’s Broadband and Digital Equity Plan and Mayor Levine Cava’s commitment to closing the digital divide. The funding was secured through the Miami-Dade County Communications, Information and Technology Department’s Local Technology Planning Team in collaboration with The Miami Foundation and Miami Connected.
      - paragraph [ref=f284e72]: The CareerSource South Florida Center at the Main Library is managed by workforce development provider Arbor E&T, LLC, and is open Monday through Friday from 9:30 a.m. to 6 p.m.
      - paragraph [ref=f284e73]:
        - text: For more information, visit
        - link "www.careersourcesfl.com/career-center" [ref=f284e74] [cursor=pointer]:
          - /url: http://www.careersourcesfl.com/career-center
        - text: or call 786-582-3013.
