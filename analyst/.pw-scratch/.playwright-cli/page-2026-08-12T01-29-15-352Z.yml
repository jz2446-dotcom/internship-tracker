      - paragraph [ref=f519e86]:
        - strong [ref=f519e87]: Job Recruitment
      - paragraph [ref=f519e88]: Thank you for your interest in employment with Hartford Public Library. Please note the Library only accepts applications for current vacancies. An online employment application is a mandatory requirement. Click on a job title below to begin your online application.
      - paragraph [ref=f519e89]
      - paragraph [ref=f519e90]:
        - strong [ref=f519e92]: "COVID-19 Vaccination Requirements:"
      - paragraph [ref=f519e93]: Job openings are updated based on when a position becomes available. Hartford Public Library is now accepting applications.
      - paragraph [ref=f519e94]: In light of the ongoing presence of the COVID-19 virus, the Hartford Public Library recommends covid vaccinations. Vaccinations have proven to be an effective measure in preventing the spread of the virus and protects individuals from severe illness. We continue to be committed to the safety of our staff and patrons. Vaccinations for the covid virus are recommended, and not required. We continue to be committed to the safety of our staff and customers. Vaccinations for the covid virus are recommended, and not required.
      - paragraph [ref=f519e95]
      - heading [level=2] [ref=f519e96]:
        - link "CLICK HERE TO VIEW ALL JOB OPENINGS" [ref=f519e97] [cursor=pointer]:
          - /url: /about/job-openings/job-openings
      - paragraph [ref=f519e98]
      - paragraph [ref=f519e99]: "Hartford Public Library requires that all finalists for a position undergo the following:"
      - list [ref=f519e100]:
        - listitem [ref=f519e101]: Criminal Background Check
        - listitem [ref=f519e102]: Pre-employment Drug Testing on applicants
      - paragraph [ref=f519e103]: Hartford Public Library requires a Criminal Background Check and Pre-employment Drug Testing on applicants who are selected as a finalist for the position. Applicants will be provided a copy of any positive drug test results. A criminal record does not necessarily eliminate you from employment with Hartford Public Library. Each conviction will be reviewed with respect to the offense, circumstances, seriousness and the position for which you apply.
      - paragraph [ref=f519e104]: Hartford Public Library is an Equal Opportunity Employer and strongly encourages the applications of women, minorities and persons with disabilities.
