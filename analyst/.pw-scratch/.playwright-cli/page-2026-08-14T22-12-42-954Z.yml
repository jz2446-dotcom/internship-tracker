      - heading "Job Applicant Privacy Policy" [level=1] [ref=f574e76]
      - generic [ref=f574e79]:
        - paragraph [ref=f574e80]:
          - text: "Last Updated:"
          - strong [ref=f574e81]: 12/14/2022
          - strong
        - paragraph [ref=f574e82]:
          - strong [ref=f574e83]: Beneficial State Bank
          - text: and its subsidiaries and affiliated companies (“Company”) takes your privacy seriously. We want you to know how we collect, use, and disclose, your personal information.
        - heading "Equal Employment Opportunity" [level=2] [ref=f574e84]
        - paragraph [ref=f574e85]: Company is an equal employment opportunity employer. Company’s policy is not to unlawfully discriminate against any applicant or employee on the basis of race, color, sex, religion, national origin, age, disability, or any other consideration made unlawful by applicable federal, state, or local laws. Company also prohibits harassment of applicants and employees based on any protected category, characteristic, or status. It is also Company’s policy to comply with all applicable state, federal, and local laws respecting consideration of unemployment status in making hiring decisions.
        - paragraph [ref=f574e86]: Company complies with the ADA, the ADAAA, and applicable state law and considers reasonable accommodation measures that may be necessary for qualified applicants/employees to perform the essential functions of the job. Hire may be contingent upon a post-offer medical examination, and to skill and agility tests, as appropriate for the position.
        - heading "Assistance For The Disabled" [level=2] [ref=f574e87]
        - paragraph [ref=f574e88]:
          - text: Alternative formats of this Privacy Policy are available to individuals with a disability. Please contact
          - strong [ref=f574e89]: humancapital@beneficialstate.com
          - text: for assistance.
        - heading "This Privacy Policy explains:" [level=2] [ref=f574e90]
        - list [ref=f574e91]:
          - listitem [ref=f574e92]: The categories of personal information we collect about you
          - listitem [ref=f574e93]: The categories of sources from which we collect your personal information
          - listitem [ref=f574e94]: The purposes for which we use your personal information
          - listitem [ref=f574e95]: How we may disclose your personal information
          - listitem [ref=f574e96]: How long we keep your personal information
          - listitem [ref=f574e97]: Privacy rights for applicants who are California residents
          - listitem [ref=f574e98]: Changes to this Privacy Policy
        - heading "Scope:" [level=2] [ref=f574e99]
        - paragraph [ref=f574e100]:
          - text: This Privacy Policy applies to the personal information of individuals in their role as job applicants to Company (
          - strong [ref=f574e101]: “Applicants”
          - text: ).
        - paragraph [ref=f574e102]:
          - strong [ref=f574e103]: “Personal information”
          - text: means information that identifies, relates to, describes, is reasonably capable of being associated with, or could reasonably be linked, directly or indirectly, with a particular Applicant.
        - heading "THE CATEGORIES OF PERSONAL INFORMATION WE COLLECT ABOUT YOU" [level=3] [ref=f574e104]
        - list [ref=f574e105]:
          - listitem [ref=f574e106]:
            - strong [ref=f574e107]: Identifiers
            - text: ", for example: real name, nickname, telephone number, postal address, e-mail address, and signature."
          - listitem [ref=f574e108]:
            - strong [ref=f574e109]: Professional or Employment-Related Information
            - text: ", for example: educational institutions attended, degrees and certifications, licenses, work experience and previous employers, and professional memberships and affiliations."
          - listitem [ref=f574e110]:
            - strong [ref=f574e111]: Non-public educational information
            - text: ", for example: academic transcripts."
          - listitem [ref=f574e112]:
            - strong [ref=f574e113]: Internet Activity Information
            - text: ", for example: interactions with Company’s Internet web site, job application, or job advertisement, and publicly available social media activity."
          - listitem [ref=f574e114]:
            - strong [ref=f574e115]: Sensory or Surveillance Data
            - text: ", for example: voicemails and footage from video surveillance cameras."
          - listitem [ref=f574e116]:
            - strong [ref=f574e117]: Physical description
            - text: ", for example: photograph for a security badge or if submitted as part of application materials."
          - listitem [ref=f574e118]:
            - strong [ref=f574e119]: Other details
            - text: ", for example, hobbies and leisure activities or membership in voluntary/charitable/public organizations, for example, as stated on the Applicant’s resume."
          - listitem [ref=f574e120]:
            - strong [ref=f574e121]: Inferences
            - text: ", for example, Company might infer characteristics from a personality assessment completed by the Applicant."
            - strong [ref=f574e122]: "[Please carefully review “Drafting Note” below on “inferring characteristics”.]"
          - listitem [ref=f574e123]:
            - strong [ref=f574e124]: Characteristics of Protected Classifications Under State or Federal Law for Applicants
            - text: ", collected on a purely voluntary basis, except where collection is required by law, and used only in compliance with applicable laws and regulations, for diversity and inclusion reporting and related purposes."
          - listitem [ref=f574e125]:
            - strong [ref=f574e126]: Geolocation data
            - text: ", for example: through a radio frequency identification (RFID) chip in a security badge to determine an applicant’s physical location."
        - heading "THE CATEGORIES OF SOURCES FROM WHICH WE COLLECT YOUR PERSONAL INFORMATION" [level=3] [ref=f574e127]
        - list [ref=f574e128]:
          - listitem [ref=f574e129]:
            - strong [ref=f574e130]: You
            - text: ", for example, in your job application, forms you fill out for us, assessments you complete, surveys you complete, and any information you provide us during your application and interview process."
          - listitem [ref=f574e131]:
            - strong [ref=f574e132]: Vendors and service providers
            - text: ", for example, recruiters."
          - listitem [ref=f574e133]:
            - strong [ref=f574e134]: Third parties
            - text: ", for example, job references, affiliated companies, professional employer organizations or staffing agencies."
          - listitem [ref=f574e135]:
            - strong [ref=f574e136]: Public internet sources
            - text: ", for example, social media, job boards, public profiles, and other public online sources"
          - listitem [ref=f574e137]:
            - strong [ref=f574e138]: Public records
            - text: ", for example, court records, and credentialing and licensing organizations."
          - listitem [ref=f574e139]:
            - strong [ref=f574e140]: Automated technologies
            - text: on Company’s electronic resources, for example, to track logins and activity on Company’s careers page.
          - listitem [ref=f574e141]:
            - strong [ref=f574e142]: Surveillance/recording technologies installed by Company
            - text: ", for example, video surveillance in common areas of Company facilities, voicemail technologies, webcams, and audio/video recording technologies with consent to the extent required by law"
          - listitem [ref=f574e143]:
            - strong [ref=f574e144]: Government or administrative agencies
            - text: ", for example, law enforcement or public health authorities."
          - listitem [ref=f574e145]:
            - strong [ref=f574e146]: Acquired company
            - text: ", if Company acquired your employer, Company might collect personal information from that employer."
        - paragraph [ref=f574e147]:
          - strong [ref=f574e148]: "Note:"
          - text: This Privacy Policy does not cover background screening conducted by third-party background check vendors subject to the federal Fair Credit Reporting Act. Company provides a separate disclosure for such screening.
        - heading "THE PURPOSES FOR WHICH WE USE YOUR PERSONAL INFORMATION" [level=3] [ref=f574e149]
        - list
        - paragraph [ref=f574e150]:
          - strong [ref=f574e151]: A. Generally Applicable Purposes
        - paragraph [ref=f574e152]: "Unless stated otherwise in section 3.B, below, we may use Applicants’ personal information for the following purposes:"
        - paragraph [ref=f574e153]:
          - strong [ref=f574e154]: "Recruiting, including:"
        - list [ref=f574e155]:
          - listitem [ref=f574e156]: To evaluate Applicants’ qualifications or suitability for employment with Company
          - listitem [ref=f574e157]: To communicate with Applicants
          - listitem [ref=f574e158]: To conduct a pre-employment or criminal history background check
          - listitem [ref=f574e159]: For identification purposes
          - listitem [ref=f574e160]: For diversity and inclusion purposes
          - listitem [ref=f574e161]: To arrange and manage Company-sponsored events
          - listitem [ref=f574e162]: To create a talent pool for future job openings
          - listitem [ref=f574e163]: For recordkeeping purposes
          - listitem [ref=f574e164]:
            - text: To demonstrate Applicants’ agreement to, or acceptance of, documents presented to them,
            - emphasis [ref=f574e165]: e.g.
            - text: acknowledgment of employment application, offer letter
          - listitem [ref=f574e166]: To evaluate and improve the recruiting process
          - listitem [ref=f574e167]: To promote Company as a place to work
        - paragraph [ref=f574e168]:
          - strong [ref=f574e169]: "Monitoring, Security, and Compliance, including:"
        - list [ref=f574e170]:
          - listitem [ref=f574e171]: To monitor use of Company facilities and information systems
          - listitem [ref=f574e172]: To conduct internal audits and investigations
          - listitem [ref=f574e173]: To protect the safety and security of Company’s facilities
          - listitem [ref=f574e174]: To report suspected criminal conduct to law enforcement and cooperate in investigations
          - listitem [ref=f574e175]: To exercise Company’s rights under applicable law and to support any claim, defense, or declaration in a case or before a jurisdictional and/or administrative authority, arbitration, or mediation panel
        - paragraph [ref=f574e176]:
          - strong [ref=f574e177]: "Conducting Our Business, including:"
        - list [ref=f574e178]:
          - listitem [ref=f574e179]: For training purposes or quality assurance with respect to Company employees conducting the interviews or otherwise assisting with the recruiting and hiring process
          - listitem [ref=f574e180]: For travel and event planning
          - listitem [ref=f574e181]: To engage in crisis management
          - listitem [ref=f574e182]: To manage travel reimbursements
        - paragraph [ref=f574e183]:
          - strong [ref=f574e184]: "Miscellaneous Other Purposes:"
        - list [ref=f574e185]:
          - listitem [ref=f574e186]: To manage and operate information technology and communications systems, risk management and insurance functions, budgeting, financial management and reporting, strategic planning;
          - listitem [ref=f574e187]: To manage litigation involving Company, and other legal disputes and inquiries and to meet legal and regulatory requirements;
          - listitem [ref=f574e188]: In connection with a corporate transaction, sale, or assignment of assets, merger, divestiture, or other changes of control or financial status of Company or any of its subsidiaries or affiliates; and
          - listitem [ref=f574e189]: To protect the rights, property, or safety of Company, HR Individuals, customers, or others.
        - paragraph [ref=f574e190]:
          - strong [ref=f574e191]: B.
          - strong [ref=f574e192]: Purposes Specific To Certain Categories Of Personal Information
        - paragraph [ref=f574e193]: "We may use the categories of Applicants’ personal information listed in this Section 3.B for the purposes stated below:"
        - paragraph [ref=f574e194]:
          - strong [ref=f574e195]: Purposes For Using Applicants’ Applicants’ Geolocation Data
        - list [ref=f574e196]:
          - listitem [ref=f574e197]: Upon entry to Company’s facilities, Company may issue Applicants an RFID-enabled security badge. Company will use this information to protect the safety and security of its facilities and the people in its facilities, including the Applicant.
        - paragraph [ref=f574e198]:
          - strong [ref=f574e199]: "Purposes For Using Applicants’ Health Information:"
        - list [ref=f574e200]:
          - listitem [ref=f574e201]: To the extent necessary to comply with Company’s legal obligations, such as to accommodate disabilities
          - listitem [ref=f574e202]: To protect the health and safety of Company’s employees and facilities, for example, to take the Applicant’s temperature
          - listitem [ref=f574e203]: For occupational health and safety compliance and record-keeping
          - listitem [ref=f574e204]: To respond to an Applicant’s medical emergency
        - paragraph [ref=f574e205]:
          - strong [ref=f574e206]: "Note:"
          - text: This Privacy Policy does not cover health information governed by the Health Insurance Portability and Accountability Act (HIPAA), the Health Information Technology for Economic and Clinical Health Act (HITECH Act), or California’s Confidentiality of Medical Information Act (CMIA) because these laws have their own disclosure requirements.
        - paragraph [ref=f574e207]:
          - strong [ref=f574e208]: "Purposes For Using Applicants’ Protected Categories Of Information:"
        - paragraph [ref=f574e209]: Company collects information about race, age, national origin, disability, sex, and veteran status as necessary to comply with legal obligations, including the reporting requirements of the federal Equal Employment Opportunity Act, the federal Office of Contracting Compliance Programs (applicable to government contractors), and state laws, and for purposes of diversity analytics.
        - paragraph [ref=f574e210]: "Company also uses this personal information for purposes including: (a) with respect to disability and/or medical condition, as necessary, to comply with federal and state law related to accommodation; and (b) with respect to age, incidentally to the use of birth date for identity verification."
        - heading "HOW WE MAY DISCLOSE YOUR PERSONAL INFORMATION" [level=3] [ref=f574e211]
        - list
        - paragraph [ref=f574e212]: Company generally maintains information related to Applicants as confidential. However, from time to time, Company may have a legitimate business need to disclose Applicants’ personal information for one of the purposes listed in Section 2, above, to one or more of the categories of external recipients listed below. In that event, Company discloses your personal information only to the minimum extent necessary to achieve the purpose of the disclosure and only if the disclosure is permitted by the CPRA and other applicable laws.
        - list [ref=f574e213]:
          - listitem [ref=f574e214]:
            - strong [ref=f574e215]: "Your direction:"
            - text: We may disclose your personal information to third parties at your direction.
          - listitem [ref=f574e216]:
            - strong [ref=f574e217]: Service providers and contractors
            - text: ": Company discloses your personal information to service providers and contractors for the purposes above to assist us in our recruiting efforts and in meeting our business needs and legal obligations."
            - list [ref=f574e218]:
              - listitem [ref=f574e219]: Company only discloses your personal information to service providers and contractors subject to written contracts as required by applicable law.
              - listitem [ref=f574e220]: Service providers and contractors include recruiters, law firms, travel agencies, and any other entity providing services to Company.
          - listitem [ref=f574e221]:
            - strong [ref=f574e222]: Affiliated companies
            - text: ": Other companies within the Beneficial State Bank family of companies."
          - listitem [ref=f574e223]:
            - strong [ref=f574e224]: "Government or administrative agencies:"
            - text: "These may include, for example:"
            - list [ref=f574e225]:
              - listitem [ref=f574e226]: Equal Employment Opportunity Commission as required for reporting.
              - listitem [ref=f574e227]: State equal employment agencies as required to respond to employment claims and charges.
              - listitem [ref=f574e228]: Law enforcement in the event of criminal investigations.
          - listitem [ref=f574e229]:
            - strong [ref=f574e230]: "Required Disclosures:"
            - text: We may be required to disclose personal information in a court proceeding, in response to a court order, subpoena, civil discovery request, other legal process, or as otherwise required by law.
          - listitem [ref=f574e231]:
            - strong [ref=f574e232]: "Legal Compliance and Protections:"
            - text: We may disclose personal information when we believe disclosure is necessary to comply with the law or to protect the rights, property, or safety of Company, our users, or others.
        - heading "HOW LONG WE KEEP YOUR PERSONAL INFORMATION" [level=3] [ref=f574e233]
        - paragraph [ref=f574e234]: If Company hires you, the information collected about you during the job application process may become part of your personnel file and may be used to administer the employment relationship and for related reporting and recordkeeping purposes. Company will retain application information for the entire duration of your employment relationship with Company and for as long thereafter as permitted or required by applicable law. Company makes its document retention schedule available to employees for review.
        - paragraph [ref=f574e235]: Company will retain information of applicants who are not hired for at least one year and longer if required by applicable law, such as for four years for California residents. These records will be retained for our internal recordkeeping and reporting purposes. During this retention period, we may use your information to consider you for positions in addition to the position(s) for which you initially applied.
        - heading "PRIVACY RIGHTS FOR APPLICANTS WHO ARE CALIFORNIA RESIDENTS" [level=3] [ref=f574e236]
        - list
        - paragraph [ref=f574e237]: This Section 6 applies only to Applicants who are residents of the state of California.
        - paragraph [ref=f574e238]:
          - strong [ref=f574e239]: a. Your California Privacy Rights
        - paragraph [ref=f574e240]: "Subject to applicable law, Applicants have the following rights:"
        - list [ref=f574e241]:
          - listitem [ref=f574e242]:
            - strong [ref=f574e243]: "Right to Know:"
            - text: You have the right to submit a verifiable request for copies of specific pieces of your personal information obtained from you and for information about Company’s collection, use, and disclosure of your personal information. Please note that the CPRA’s right to obtain copies does not grant a right to the whole of any document that contains personal information, but only to “specific pieces” of personal information. Moreover, HR Individuals have a right to know categories of sources of personal information and categories of third parties to which personal information is disclosed, but not the individual sources or third parties. Company does not always track individualized sources or third parties.
        - list [ref=f574e244]:
          - listitem [ref=f574e245]:
            - strong [ref=f574e246]: "Right to Delete:"
            - text: You have the right to submit a verifiable request for the deletion of personal information that you have provided to Company.
          - listitem [ref=f574e247]:
            - strong [ref=f574e248]: "Right to Correct:"
            - text: You have the right to submit a verifiable request for the correction of inaccurate personal information maintained by Company, taking into account the nature of the personal information and the purposes of processing the personal information.
        - paragraph [ref=f574e249]:
          - strong [ref=f574e250]: "Inferring characteristics:"
          - text: Company does not collect or process sensitive personal information or characteristics of protected classifications for the purpose of inferring characteristics about California residents.
        - paragraph [ref=f574e251]:
          - strong [ref=f574e252]: "No sales and no “sharing”, i.e., disclosure for cross-context behavioral advertising:"
        - paragraph [ref=f574e253]: Company does not sell the personal information of any Applicants nor share their personal information for cross-context behavioral advertising.
        - paragraph [ref=f574e254]:
          - strong [ref=f574e255]: Note on Deidentified Information
        - paragraph [ref=f574e256]: At times, Company converts personal information into deidentified information using reasonable measures to ensure that the deidentified information cannot be associated with the individual (“Deidentified Information”). Company maintains Deidentified Information in a deidentified form and does not attempt to reidentify it, except that Company may attempt to reidentify the information solely for the purpose of determining whether its deidentification processes ensure that the information cannot be associated with the individual. Company prohibits vendors, by contract, from attempting to reidentify Company’s Deidentified Information.
        - paragraph [ref=f574e257]:
          - strong [ref=f574e258]: b. How to Exercise Your Rights
        - paragraph [ref=f574e259]: "Company will respond to requests know, delete, and correct in accordance with applicable law if it can verify the identity of the individual submitting the request. You can exercise these rights in the following ways:"
        - list [ref=f574e260]:
          - listitem [ref=f574e261]:
            - text: Call
            - strong [ref=f574e262]: 888-326-2265
          - listitem [ref=f574e263]:
            - text: Email
            - strong [ref=f574e264]: humancapital@beneficialstate.com
        - paragraph [ref=f574e265]:
          - strong [ref=f574e266]: "c. How We Will Verify Your Request:"
        - paragraph [ref=f574e267]: The processes that we follow to verify your identity when you make a request to know, correct, or delete are described below. The relevant process depends on how and why the request is submitted.
        - paragraph [ref=f574e268]: "If you submit a request by any means other than through a password-protected account that you created before the date of your request, the verification process that we follow will depend on the nature of your request as described below:"
        - list [ref=f574e269]:
          - listitem [ref=f574e270]:
            - strong [ref=f574e271]: "Requests To Know Categories or Purposes:"
            - text: If you request to know how we collect and handle your personal information, we will match at least two data points that you provide with your request, or in response to your verification request, against information about you that we already have in our records and that we have determined to be reliable for purposes of verifying your identity. Examples of relevant data points include your mobile phone number, your zip code, and the month and year you submitted a job application to us.
          - listitem [ref=f574e272]:
            - strong [ref=f574e273]: "Requests To Know Specific Pieces of Personal Information:"
            - text: We will match at least three data points that you provide with your request to know, or in response to our request for verification information, against information that we already have about you in our records and that we have determined to be reliable for purposes of verifying your identity. In addition, we may require you to sign a declaration under penalty of perjury that you are the individual whose personal information is the subject of the request.
          - listitem [ref=f574e274]:
            - strong [ref=f574e275]: "Requests To Correct or Delete Personal Information:"
            - text: Our process for verifying your identity will depend on the risk level (as determined by Company) associated with the personal information that you ask us to correct or delete. For low-risk personal information, we will require a match of two data points as described in Point No. 1, above. For higher risk personal information, we will require a match of three data points and a signed declaration as described in Point No. 2, above.
        - paragraph [ref=f574e276]: "We have implemented the following additional procedures when verifying the identity of requestors:"
        - list [ref=f574e277]:
          - listitem [ref=f574e278]: If we cannot verify your identity based on the processes described above, we may ask you for additional verification information. If we do so, we will not use that information for any purpose other than verification.
          - listitem [ref=f574e279]: If we cannot verify your identity to a sufficient level of certainty to respond to your request, we will let you know promptly and explain why we cannot verify your identity.
        - paragraph [ref=f574e280]:
          - strong [ref=f574e281]: d. Authorized Agents
        - paragraph [ref=f574e282]:
          - text: If an authorized agent submits a request to know, correct, or delete on your behalf, the authorized agent must submit with the request a document signed by you that authorizes the authorized agent to submit the request on your behalf. In addition, we may ask you or your authorized agent to follow the applicable process described above for verifying your identity. You can obtain our “Authorized Agent Designation” form by contacting us at
          - strong [ref=f574e283]: humancapital@beneficialstate.com
          - text: .
        - paragraph [ref=f574e284]:
          - strong [ref=f574e285]: e. Company’s Non-Discrimination and Non-Retaliation Policy
        - paragraph [ref=f574e286]: Company will not unlawfully discriminate or retaliate against you for exercising your privacy rights under the California Privacy Rights Act.
        - heading "CHANGES TO THIS PRIVACY POLICY" [level=3] [ref=f574e287]
        - list
        - paragraph [ref=f574e288]: If we change this Privacy Policy, we will post those changes on this page and update the Privacy Policy modification date above. If we materially change this Privacy Policy in a way that affects how we use or disclose your personal information, we will provide a prominent notice of such changes and the effective date of the changes before making them.
        - heading "For More Information" [level=2] [ref=f574e289]
        - paragraph [ref=f574e290]:
          - text: For questions or concerns about Company’s privacy policies and practices, please contact us at
          - strong [ref=f574e291]: humancapital@beneficialstate.com
