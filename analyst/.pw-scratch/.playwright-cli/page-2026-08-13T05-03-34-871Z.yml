    - generic [ref=f1078e122]:
      - heading "What role will you play?" [level=2] [ref=f1078e124]
      - paragraph [ref=f1078e128]: No matter what you studied, there’s a place for you at Macquarie. We consider applications from all degree backgrounds for each of our divisions. You’ll have countless opportunities to grow your network and your impact.
      - generic [ref=f1078e130]:
        - generic [ref=f1078e131]:
          - button [ref=f1078e133] [cursor=pointer]:
            - generic [ref=f1078e134]:
              - paragraph [ref=f1078e135]: Commodities and Global Markets
              - paragraph [ref=f1078e136]
              - paragraph [ref=f1078e137]: As commodities continue to underpin the building of our cities, global energy needs grow, and technology continues to change the world, our Commodities and Global Markets Group serve a diverse client base across numerous markets.
          - text: 
        - generic [ref=f1078e138]:
          - button [ref=f1078e140] [cursor=pointer]:
            - generic [ref=f1078e141]:
              - paragraph [ref=f1078e142]: Financial Management, People and Engagement
              - paragraph [ref=f1078e143]
              - paragraph [ref=f1078e144]: Financial Management, People and Engagement (FPE) provides a single interface for Macquarie’s businesses across key areas of people, strategy, communications and financial management. Comprising two pillars – Financial Management, and People and Engagement – it is responsible for managing the Group’s financial, tax and treasury activities and strategic priorities, fostering our culture through people and community engagement strategies, and engaging with stakeholders to protect and promote Macquarie’s reputation globally.
          - text: 
        - generic [ref=f1078e145]:
          - button [ref=f1078e147] [cursor=pointer]:
            - generic [ref=f1078e148]:
              - paragraph [ref=f1078e149]: Macquarie Capital
              - paragraph [ref=f1078e150]
              - paragraph [ref=f1078e151]: As part of Macquarie Capital, you will play a pivotal role in helping our clients and partners make opportunity reality through the innovative advice and flexible capital solutions we provide. From Mergers and Acquisition (M&A) and Capital Markets to Principal Finance and Equities Research, our platform provides diversity in the problems we solve for our clients, the sectors we work in and the people we work with. And where there is passion to pursue a new idea or business opportunity, we empower our people to forge new paths across geographies, sectors, and teams.
          - text: 
        - generic [ref=f1078e152]:
          - button [ref=f1078e154] [cursor=pointer]:
            - generic [ref=f1078e155]:
              - paragraph [ref=f1078e156]: Macquarie Asset Management
              - paragraph [ref=f1078e157]
              - paragraph [ref=f1078e158]: Macquarie Asset Management is a leading global asset manager, trusted by institutions, individuals and communities to responsibly manage $US477 billion in assets. MAM provides clients with a diverse range of investment solutions that seek to deliver superior risk-adjusted returns.
          - text: 
        - generic [ref=f1078e159]:
          - button [ref=f1078e161] [cursor=pointer]:
            - generic [ref=f1078e162]:
              - paragraph [ref=f1078e163]: Risk Management Group
              - paragraph [ref=f1078e164]
              - paragraph [ref=f1078e165]: Joining our Risk Management Group you will be part of an independent and centralised function responsible for objective review, challenge, oversight, monitoring and reporting of material risks. You will help contribute to our long-term success by working on strategies to manage and prevent risk, while empowering us to stay innovative and pursue new ideas.
          - text: 
        - generic [ref=f1078e166]:
          - button [ref=f1078e168] [cursor=pointer]:
            - generic [ref=f1078e169]:
              - paragraph [ref=f1078e170]: Technology
              - paragraph [ref=f1078e171]
              - paragraph [ref=f1078e172]: Technology and data enable every aspect of Macquarie, from our employees, to our customers, and communities. Join our ever-growing global team that is connecting people and data, building platforms and applications, and designing tomorrow’s technology solutions.
          - text: 
