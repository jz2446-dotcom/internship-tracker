      - generic [ref=f1078e57]:
        - paragraph [ref=f1078e58]: More is possible for your future as part of Macquarie’s Graduate and Internship Programs. That’s because we are invested in you. In developing your skills, connecting you to a team with diverse perspectives, and empowering you to see your ideas become a reality.
        - paragraph [ref=f1078e59]: You’ll play an active role in work that’s building a better future – including investing in essential infrastructure, managing critical commodities, bringing investors and ideas together, or driving technological change.
        - paragraph [ref=f1078e60]: With access to more opportunities, you can make a unique contribution and uncover what’s possible for your career.
