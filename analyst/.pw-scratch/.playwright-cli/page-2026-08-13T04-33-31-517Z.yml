      - generic [ref=f619e38]:
        - generic [ref=f619e39]: Description
        - generic [ref=f619e40]:
          - paragraph [ref=f619e41]:
            - strong [ref=f619e43]: About Longroad Energy
          - paragraph [ref=f619e44]: Longroad Energy is a Boston, MA headquartered renewable energy developer focused on the development, ownership, and operation/asset management of wind and solar energy projects throughout North America. Founded in 2016, Longroad owns 4.5 GW of wind and solar projects across the United States in addition to operating and managing a total of 6.2 GW of wind and solar projects on behalf of Longroad and third parties. Our vision is to create lasting value for our shareholders, communities, and employees by responsibly developing, owning, and operating renewable energy projects. We have assembled a world-class team with a passion for renewable energy innovation and a commitment to developing renewable projects throughout the US.
          - paragraph [ref=f619e45]
          - paragraph [ref=f619e46]
          - paragraph [ref=f619e47]:
            - strong [ref=f619e49]: Job Purpose
          - paragraph [ref=f619e50]: Reporting to the Vice President of Transmission, the Power Systems Engineer will work with a team of developers, Transmission Team members, and project engineering experts, to identify sites for new projects, prepare interconnection application materials, study project impacts to the utility grid and develop solutions to issues arising throughout the interconnection process. The Power Systems Engineer will also coordinate with EPC, NERC Compliance, and Asset Management to ensure plant models are transitioned through the development and construction phases and into commercial operations.
          - paragraph [ref=f619e51]
          - paragraph [ref=f619e52]:
            - text: The Power Systems Engineer will perform studies to estimate reliable injection limits, review and validate utility interconnection studies, and coordinate with the Transmission Team to mitigate any issues arising in the interconnection study process. The Power System Engineer will prepare generator interconnection request packages, including dynamic models of the proposed project, and will maintain dynamic models of the project through the interconnection process, coordinate with the EPC team during construction, and hand over the final plant model to Asset Management at Commercial Operations.
            - strong [ref=f619e53]: This role is remote but can be hybrid for candidates local to Boston, MA or San Francisco, CA.
          - paragraph [ref=f619e54]
          - paragraph [ref=f619e55]
          - paragraph [ref=f619e56]:
            - strong [ref=f619e58]: Responsibilities
          - list [ref=f619e59]:
            - listitem [ref=f619e60]: Provide power systems technical support for wind, solar and battery storage projects in Longroad’s development pipeline.
            - listitem [ref=f619e61]: Determine injection and/or charging capacity for proposed projects in coordination with the development team’s prospecting efforts
            - listitem [ref=f619e62]: Conduct transmission system analyses to identify optimal interconnection points and hosting capacity for new renewable energy projects across the U.S. grid, accounting for interconnection costs, reliability, and congestion.
            - listitem [ref=f619e63]: Prepare interconnection application packages for new projects and provide technical support throughout the interconnection process including reviewing and validating interconnection study results, advising the project developer of risks arising from the generator interconnection process, supporting LGIA, PPA, and financing efforts, and coordinating with the EPC team throughout each project’s construction.
            - listitem [ref=f619e64]: Track new developments in transmission planning processes in key markets and advise the development team of risks and opportunities that might arise
            - listitem [ref=f619e65]: Maintain a database of projects’ dynamic models throughout the development and construction phases and coordinate with asset management and NERC compliance teams as each project enters commercial operation.
          - paragraph [ref=f619e66]:
            - strong [ref=f619e68]: Minimum Qualifications
          - list [ref=f619e69]:
            - listitem [ref=f619e70]: BSEE in power systems from an accredited university.
            - listitem [ref=f619e71]: 4 years of experience in electrical power systems engineering, transmission planning and/or transmission system operations.
            - listitem [ref=f619e72]: Experience performing static and dynamic transmission system studies to support substation and transmission line planning and/or operation.
            - listitem [ref=f619e73]: Experience performing static and dynamic transmission system studies with power system analysis applications such as PSS/E, PSLF, and/or TARA.
            - listitem [ref=f619e74]: Knowledge of power plant design including main power transformers, collector systems, power plant controllers, and inverter based generating equipment
            - listitem [ref=f619e75]: Familiarity with NERC reliability standards and FERC open access policies.
            - listitem [ref=f619e76]: Candidates may be required to travel up to 10% of the time.
          - paragraph [ref=f619e77]:
            - strong [ref=f619e79]: Desired/Preferred Qualifications
          - list [ref=f619e80]:
            - listitem [ref=f619e81]: Professional Engineer (PE) license or ability to obtain.
            - listitem [ref=f619e82]: MSEE in power systems from an accredited university.
            - listitem [ref=f619e83]: Direct experience in wind, solar or battery storage project system design, construction and operation.
            - listitem [ref=f619e84]: Experience with interconnection agreements, power purchase contracts, electric power system regulatory compliance and energy market structures.
            - listitem [ref=f619e85]: Experience in performing or familiarity with LMP-based market simulations using industry-standard production cost modeling tools (e.g., PROBE, PROMOD, PLEXOS).
            - listitem [ref=f619e86]: Experience or familiarity with high resolution models such as PSCAD
            - listitem [ref=f619e87]: Utility scale generation interconnection experience including process, requirements and implementation.
          - paragraph [ref=f619e88]:
            - strong [ref=f619e90]: Characteristics Necessary for Success
          - list [ref=f619e91]:
            - listitem [ref=f619e92]: Personal accountability and integrity.
            - listitem [ref=f619e93]: Ability to make informed decisions in a quick and nimble fashion.
            - listitem [ref=f619e94]: Comfortable with a work environment that is fast paced and changes quickly.
            - listitem [ref=f619e95]: Ability to work within a team with a positive attitude.
            - listitem [ref=f619e96]: Enthusiastic about the renewable energy industry.
          - paragraph [ref=f619e97]
          - paragraph [ref=f619e98]:
            - strong [ref=f619e100]: Other
          - paragraph [ref=f619e101]: Applicants must be currently authorized to work in the United States. The Company does not sponsor applicants for work visas.
          - paragraph [ref=f619e102]
          - paragraph [ref=f619e103]:
            - strong [ref=f619e105]: Benefits of Working at Longroad Energy
            - text: We are dedicated to providing our employees with the support and resources they need to stay healthy, secure their future, and be successful in their careers. Benefits at Longroad include the opportunity for merit-based salary increases, incentive plan participation, eligibility for our 401 (k) plan and matching, and comprehensive medical, dental, vision, life, and disability insurance. Our robust time-off policy includes accrual of 18 vacation days in your first year, paid holidays, and paid volunteer time. We offer paid parental leave to help support employees as they transition into parenthood. Learn more about our
            - link "employee benefits" [ref=f619e106] [cursor=pointer]:
              - /url: https://www.longroadenergy.com/about-us/employee-benefits/
            - text: .
          - paragraph [ref=f619e107]
          - paragraph [ref=f619e108]:
            - strong [ref=f619e110]: Diversity, Equity & Inclusion
            - text: Diversity, equity, and inclusion matter - at Longroad, in our industry, in our communities, and in society at large. We embrace our responsibility to build and promote a diverse, equitable, and inclusive working experience and drive change where we live and operate. We work to actively promote and celebrate diversity, equity, and inclusion. We foster a supportive space that empowers everyone at Longroad to learn about, discuss and ask questions related to embracing and honoring identity. We collaborate with our community, colleagues, and industry in the ongoing pursuit of evolving and growing an inclusive and diverse environment. Learn more about our
            - link "DEI commitment" [ref=f619e111] [cursor=pointer]:
              - /url: https://www.longroadenergy.com/esg/diversity-equity-inclusion/
            - text: .
          - paragraph [ref=f619e112]
          - paragraph [ref=f619e113]:
            - strong [ref=f619e115]: Longroad Energy Values
            - text: At Longroad, we SHINE. We aim to be the most trusted renewable energy company on the long road to a green future. We are an experienced team of problem solvers and promise-keepers who develop sustainable solutions that meet today’s challenges and make a lasting impact on people and our planet. Learn more about our
            - link "SHINE values." [ref=f619e116] [cursor=pointer]:
              - /url: https://www.longroadenergy.com/about-us/values/
          - paragraph [ref=f619e117]: Longroad Energy is proud to be an Equal Opportunity Employer (“EOE”). Qualified applicants are considered for employment without regard to age, race, color, religion, sex, national origin, disability, veteran status, citizenship, or any other legally protected status. Longroad Energy prohibits discrimination against individuals with disabilities and will reasonably accommodate applicants with a disability, upon request, and will also ensure reasonable accommodations are made for disabled employees. Longroad Energy is firmly committed to ensuring equal employment opportunities in all employment practices and personnel actions, including advertising, recruitment, testing, screening, hiring, selection for training, upgrading, transfer, demotion, layoff, discipline, termination, rates of pay, and other forms of compensation.
