            - paragraph [ref=f940e82]: The predicted salary is between 43200 - 72000 $ per year.
          - generic [ref=f940e83]: "Kansas City, Kansas Public Library (KCKPL) serves Wyandotte County, a community in Northeastern Kansas with a population of around 170,000, with five library branches and three mobile libraries. KCKPL was formed in 1893 and came under the authority of the Kansas City, Kansas Public School District Board of Education in 1899, where it remains today. The mission of Kansas City, Kansas Public Library is to connect members of a dynamic community with information, tools, resources, and welcoming spaces to enrich lives in Wyandotte County. Job Goal The Assistant Director of Public Services is a member of the administrative team and oversees the operations and services of five branches and the mobile libraries. Reporting to the Director of Public Libraries, the Assistant Director of Public Services is a strategic thinker who supports and advocates for their area of the organization while also considering the needs of the library system to deliver excellence in public service. Essential Functions Oversees management and operations of library branches and mobile services to ensure excellent customer service through effective staffing, facility and vehicle maintenance and improvements, financial management, and workplace safety and security. Leads managers and supervisors in the development of new services, programs, and outreach that meet the diverse needs of the community. Assists the Director of Public Libraries and the Assistant Director of Systemwide Services with planning, preparing, and implementing the annual library budget. Monitors expenditures and costs throughout the year. Creates a positive climate that supports teams with effective coaching, professional development, and performance evaluations. Assists with recruiting, interviewing, and hiring staff. Works with Staff Development and Training Specialist to help onboard and train new public service employees. Plans and coordinates library’s management team meetings with Assistant Director of Systemwide Services. Collaborates with Kansas City, Kansas Public School District staff to align public service procedures with KCKPS policies. Helps resolve difficult situations with customers. Regularly reads and responds to library and customer communication in a timely manner. Represents the library in professional and community organizations and activities. Assumes the duties of the Assistant Director of Systemwide Services or Director of Libraries in their absence. Other duties as assigned. Qualifications Master of Library Science (MLS) from an ALA accredited college or university. At least five years of management, administration, or supervisory experience, including progressive work as a librarian in a public library setting or library support service. Knowledge of personnel management and public library budgetary practices and responsibilities. Experience working a service desk in a public library preferred. Ability to learn and efficiently operate library computer systems and programs. Proven leadership and management skills that foster teamwork, effective communication, innovation and an engaged staff. Ability to plan, implement and evaluate effective library services, strategies and facilities. Ability to evaluate, hold accountable and develop staff. Excellent organizational, problem-solving, process management and facilitation skills. Ability to appropriately handle confidential and sensitive information. Excellent interpersonal skills and public service manner for modeling customer service expectations. Excellent communication skills, oral and written, and public-speaking/presentation skills. Excellent computer and internet skills. Ability to provide own transportation to and from library locations and within the metropolitan area as required. Satisfactory criminal background check. Physical Demands: The physical demands described here are representative of those that must be met by an employee to successfully perform the essential functions of this job. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions. Regularly required to stand, kneel, walk, stoop, and lift up to 35 pounds. Work Environment: The work environment characteristics described here are representative of those an employee encounters while performing the essential functions of this job. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions. The noise level in the work environment is usually low and is a standard acceptable level for this environment. The environment may contain dust, mildew, and fluorescent lighting. Benefits Vacation, disability, and personal days granted annually pursuant to KCKPS Board Policies, GARH – Absences, leave and vacation. Salary based on library classification and salary schedule. Placement on the schedule based on qualifications and experience. A willingness to work evenings, weekends and extra duty as needed is a condition of employment. FLSA Status: Exempt #J-18808-Ljbffr"
          - generic [ref=f940e84]:
            - 'heading "Assistant Director of Public Services Kansas City, Kansas Public Library Leading the way in rea[...] employer: MALA Mid-America Library Alliance" [level=3] [ref=f940e85]'
            - paragraph [ref=f940e86]: The Kansas City, Kansas Public Library is an exceptional employer that fosters a collaborative and innovative work culture, dedicated to enriching the lives of the Wyandotte County community. With a strong commitment to professional development, employees have ample opportunities for growth and advancement while enjoying a supportive environment that values teamwork and effective communication. Located in a vibrant area, KCKPL offers competitive benefits, including vacation and personal days, making it an ideal place for those seeking meaningful and rewarding employment in public service.
