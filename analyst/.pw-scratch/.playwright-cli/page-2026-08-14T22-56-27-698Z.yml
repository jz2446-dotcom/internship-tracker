    - paragraph [ref=f1732e1104]:
      - text: "Fraud Alert: Scammers are impersonating companies and their representatives to target job seekers with fictitious job opportunities. Please know that American Express will never ask for money, contact you from free email accounts (like Gmail, Yahoo, Hotmail), or ask you to share personal information over email. To be sure you are engaging directly with American Express about job opportunities, always confirm or apply for any open roles directly on the official"
      - link "American Express Career Site." [ref=f1732e1105] [cursor=pointer]:
        - /url: https://www.americanexpress.com/en-us/careers/?intlink=us-amex-career-en-us-fraud-alert-section
      - text: If you are contacted by a suspicious profile or if something feels off, don’t engage —
      - link "email us" [ref=f1732e1106] [cursor=pointer]:
        - /url: mailto:recruitmentoperationsservicing@aexp.com
      - text: to verify.
      - link "Learn more." [ref=f1732e1107] [cursor=pointer]:
        - /url: https://www.americanexpress.com/en-us/careers/recruitment-fraud/?intlink=us-amex-career-en-us-recruitment-fraud
