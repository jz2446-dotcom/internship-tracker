            - paragraph [ref=f1732e1185]: Individuals featured on this site may include current or former colleagues.
            - paragraph [ref=f1732e1188]:
              - text: At American Express, you’ll be recognized for your contributions, leadership, and impact—every colleague has the opportunity to share in the company’s success. Together, we’ll win as a team, striving to uphold our
              - link "company values" [ref=f1732e1189] [cursor=pointer]:
                - /url: https://www.americanexpress.com/en-us/company/who-we-are/
              - text: and powerful backing promise to provide the world’s best customer experience every day. And we’ll do it with the utmost integrity, and in an environment where everyone is seen, heard and feels like they belong.
            - paragraph [ref=f1732e1192]: American Express is an equal opportunity employer and makes employment decisions without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, veteran status, disability status, age, or any other status protected by law.
            - paragraph [ref=f1732e1195]:
              - text: US Job Seekers - Click to view the
              - link "Know Your Rights" [ref=f1732e1196] [cursor=pointer]:
                - /url: https://www.eeoc.gov/poster
              - text: "poster. If the link does not work, you may access the poster by copying and pasting the following URL in a new browser window:"
              - link "https://www.eeoc.gov/poster" [ref=f1732e1197] [cursor=pointer]:
                - /url: https://www.eeoc.gov/poster
            - paragraph [ref=f1732e1200]:
              - text: If you have a disability or a special need that requires a reasonable accommodation throughout the recruitment process, you can email
              - link "Mail to recruitment operations servicing" [ref=f1732e1201] [cursor=pointer]:
                - /url: mailto:recruitmentoperationsservicing@aexp.com?subject=Accommodation%20Request
                - text: recruitmentoperationsservicing@aexp.com
              - text: or inform your recruiter. Please indicate if you prefer a response via email or phone.
