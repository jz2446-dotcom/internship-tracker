                  - paragraph [ref=f121e324]: when i left for vacation, signed into netflix there during my time logged out and came back home, i would open netflix and it say im not apart of the household.. idk what bots or operating system they use but if my settings on my ipad and phone say that i allow networks connections and they see where i log in and WHSTS HOMEBASE, THERE SHOULDNT BE AN ISSUE SIGNING IN AT MY HOME. it would also be lovely if they stopped taking things im interested in and didn’t get to watch off netflix. it should be more personalized where i can choose what i dont watch/not interested in watching and what i want to remove (“leaving soon”). there’s a BUNCH of shows and movies on there id never watch like horror and that demonic content that i wish were leaving and something NETFLIX chooses to remove is actually good. but besides those 2 issues, actually one more the only being able to watch on 2 screens in a house with a lot of people and having to pay more is greedy and again the whole sharing update is greedy as well. i feel like it be nice to have at least 1 exception outside of your home without having to upgrade your plan, and like since that 1 access to the account without having an account of their own, it can be like that for year and if others wanted to join the account that way, they can’t because it lasts for a year and only one person at a time outside of the subscribers home can use it. hope this makes sense, run me my checkkk for the ideasss, please. xoxo
