                - generic [ref=f121e346]:
                  - paragraph [ref=f121e347]: I don’t get why you had to make JJ die. I really really loved JJ and I can’t believe you guys would do that. My voice started to crack when I saw that he was dying and I’m crying while writing this review. I really don’t get how y’all did it. I really don’t. and I mean it I really really mean it doesn’t make sense to me. I don’t. I just don’t get it. Why why did you have to make him die? Why why why why why did you have to make him die now? He won’t be in season five because he’s dead. He’s deceased. He’s gone because of you Netflix and the directors. Why do you have to make him die? I hate Outer Banks now and I always will because JJ is gone and I loved JJ. JJ was my best friend, but he wasn’t really my best friend. because we didn’t really know each other but if we did, I bet you me and him would be the closest friends ever. I just might make this review to start, but I won’t do that because I love Netflix and the shows. I’ve only watched two shows on Netflix and movies only watched Outer Banks and Young Sheldon Young Sheldon can stay out of this because they actually do great things on that show. I think it should stay that way. It’s really don’t get it how y’all are not crying. it means so much these people including me I do not rely on Netflix all the time but if Outer Banks wasn’t just on Netflix just might’ve stayed with you but now I really don’t have any choice pay for it and I don’t want to cancel. I’m not watching Netflix anymore. Goodbye. Have peace.
