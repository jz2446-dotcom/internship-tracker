                    - generic [ref=f121e366]: Goofyrussell40
                - generic [ref=f121e369]:
                  - paragraph [ref=f121e370]: They’re greediness is disgusting and they’re “No password sharing” is nonsense. I’ve tried so many ways to contact Netflix to issue complaints. Upon doing so, I’ve noticed they’ve taken away all their means of communication and contact on their website, so I tried to contact them through Twitter which only lead to them somehow locking me out of my own Twitter account. Under the premium plan we’re supposed to be able to add 2 extra members that don’t live in the household under the same account. What a lie that is because now it’s $7.99 ON TOP of the premium plan payment. My family bit the bullet and tried to sign up for the extra members plan because we all live in separate cities and are unable to live within the same household. They had the “extra members” create new accounts first, and then said we could transfer our old profiles over to the new accounts so we could continue watching without skipping a beat. Now they’re saying we can’t transfer any profiles over because “new accounts have already been created” which is what they told us to do in the first place. We’ve tried to contact them by phone to help resolve the issue but everything just keeps going in circles and they are flat out refusing to help. My family and I have had enough. We’re cancelling our subscription until they can hopefully get back to their old business practices. Netflix is 100% not worth the money and stress they’ve caused under their new policies. If you’ve read this far, thank you, and please don’t put your own family through the same stress that mine has suffered.
