              - generic [ref=f32e50]: Location
              - generic [ref=f32e51]: Remote, US
            - generic [ref=f32e52]:
              - generic [ref=f32e53]: Function
              - generic [ref=f32e54]: Value Creation
          - link "Apply" [ref=f32e55] [cursor=pointer]:
            - /url: https://careers2-vistaequitypartners.icims.com/jobs/3031/director%2c-customer-success-%26-service/job
          - separator [ref=f32e60]
          - heading "Summary" [level=2] [ref=f32e61]
          - generic [ref=f32e62]:
            - paragraph [ref=f32e63]: Vista is looking for an Associate Director / Director to join the Go-To-Market Group, specializing in Support & Services. This role sits within Vista’s Value Creation Team (VCT), the operating arm of Vista Equity Partners, and works directly with portfolio company executives to diagnose opportunities and deploy improvements spanning AI adoption, process automation, and organizational design. The role also partners with Vista’s investment professionals on new investment evaluations and builds scalable playbooks and cross-portfolio programs that bring Vista’s best practices to companies at scale.
            - paragraph [ref=f32e64]
            - paragraph [ref=f32e65]: This role is remote-based within the United States and is for an immediate start.
          - heading "Responsibilities" [level=2] [ref=f32e66]
          - list [ref=f32e68]:
            - listitem [ref=f32e69]: Embeds within portfolio companies to diagnose areas of opportunity, define strategic priorities, and deploy targeted improvements spanning AI adoption, process automation, workflow and knowledge optimization, organizational design, and cross-departmental workflows
            - listitem [ref=f32e70]: Serves as a trusted advisor to portfolio company executives, including CEOs, COOs, CCOs, CTOs, and other functional heads, in developing and implementing initiatives that advance targeted performance goals
            - listitem [ref=f32e71]: Builds and codifies best practices into products and playbooks that serve as blueprints and accelerate adoption across portfolio companies
            - listitem [ref=f32e72]: Designs and leads cross-portfolio programs that bring together portfolio companies facing similar challenges, driving adoption of best practices to deliver outsized impact at scale
            - listitem [ref=f32e73]: Drives strategy for the adoption of emerging technologies and operational innovation, identifying high-priority use cases, recommending technology partners, and architecting scalable technology solutions
            - listitem [ref=f32e74]: Partners with investment professionals on investment thesis development, investment modeling, and value creation planning when evaluating new investments
            - listitem [ref=f32e75]: Identifies and cultivates relationships with best-in-class vendors and technology partners, overseeing solution implementation to ensure seamless integration and delivery of measurable outcomes across portfolio companies
          - heading "Qualifications" [level=2] [ref=f32e76]
          - generic [ref=f32e77]:
            - list [ref=f32e78]:
              - listitem [ref=f32e79]: Genuine curiosity about how AI is reshaping support and/or services delivery, with a strong passion for building the next generation of support and services organizations
              - listitem [ref=f32e80]: 10+ years of experience working for technology companies, with progressive responsibilities, including leading a team
              - listitem [ref=f32e81]: 3+ years of operations experience at a high-growth enterprise SaaS company with at least $300 million in annual revenue; experience within Services, Onboarding, or Customer Support preferred
              - listitem [ref=f32e82]: 2+ years of experience at a leading consulting firm, investment bank, venture capital firm, or private equity firm; enterprise SaaS focus preferred
              - listitem [ref=f32e83]: Experience leading transformational projects spanning AI adoption, organizational design, and workflow automation or optimization, with significant and quantifiable business impact
              - listitem [ref=f32e84]: Demonstrated experience building with AI tools, such as LLM APIs, agents, or AI-native workflows, rather than only using them as a productivity shortcut
              - listitem [ref=f32e85]: Experience working closely with C-level executives, establishing immediate credibility and rapport
              - listitem [ref=f32e86]: Strong ability to analyze data at scale
              - listitem [ref=f32e87]: Strong organizational skills with the ability to manage multiple projects and priorities simultaneously with focus and attention to detail
              - listitem [ref=f32e88]: Ability to manage ambiguity and achieve superior results in a fast-paced and demanding environment
              - listitem [ref=f32e89]: Ability to influence multiple stakeholders across varying levels of seniority
            - paragraph [ref=f32e90]: The annualized base pay range for this role is expected to be between $200,000 - $280,000. Actual base pay could vary based on factors including but not limited to experience, subject matter expertise, geographic location where work will be performed and the applicant’s skill set. The base pay is just one component of the total compensation package for employees. Other components may include an annual cash bonus and a comprehensive benefits package.
