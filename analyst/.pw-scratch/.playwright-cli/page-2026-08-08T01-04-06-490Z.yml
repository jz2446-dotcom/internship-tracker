          - paragraph [ref=e53]:
            - text: "If you’re interested in career opportunities with CLA Meridian Capital, please email your cover letter and resume to:"
            - link "careers@meridianib.com" [ref=e54] [cursor=pointer]:
              - /url: mailto:careers@meridianib.com
            - text: .
          - generic [ref=e55]:
            - generic [ref=e56]:
              - heading "Senior Banker Hires" [level=3] [ref=e57]
              - separator [ref=e58]
              - paragraph [ref=e59]: CLA Meridian Capital is always seeking to meet successful and self-motivated mid-level and senior investment bankers who can help strengthen our firm by bringing significant transaction experience and high-quality relationships relevant to our business. Our advisory platform is a powerful foundation for experienced investment bankers to fully achieve their potential.
            - generic [ref=e60]:
              - heading "Associates" [level=3] [ref=e61]
              - separator [ref=e62]
              - paragraph [ref=e63]: Associates at CLA Meridian Capital play a critical role in all aspects of M&A transactions. This individual will be responsible for collaborating with senior bankers to ensure that deals progress smoothly in addition to being a leader to junior employees. We provide our employees the opportunity to take ownership of their projects and internal initiatives.
            - generic [ref=e64]:
              - heading "Analysts" [level=3] [ref=e65]
              - separator [ref=e66]
              - paragraph [ref=e67]: An analyst at CLA Meridian Capital will gain exposure to the investment banking industry and have an opportunity to develop important analytical and communication skills. This individual will have responsibility for a variety of sell-side, buy-side, and research assignments. Our lean deal team structure gives an analyst the opportunity to work closely with senior bankers.
          - generic [ref=e68]:
            - generic [ref=e69]:
              - heading "Supportive Hires" [level=3] [ref=e70]
              - separator [ref=e71]
              - paragraph [ref=e72]: CLA Meridian Capital is continually looking for high-quality professionals who want to further their careers in a collaborative, rewarding environment. Among our staff are professionals in human resources, marketing, IT, finance and accounting, and other executive support positions, all of whom help develop and influence the success of our growing firm. As the firm continues to grow, the opportunities for career advancement in these areas expand as well.
            - generic [ref=e73]:
              - heading "Students and Graduates" [level=3] [ref=e74]
              - separator [ref=e75]
              - paragraph [ref=e76]: CLA Meridian Capital offers summer internships and full-time opportunities to the top students in finance and accounting.
            - generic [ref=e77]:
              - heading [level=3]
          - generic [ref=e78]:
            - figure [ref=e80]
            - generic [ref=e81]:
              - heading "Puget Sound Business Journal Best Workplaces of 2024" [level=3] [ref=e82]
              - paragraph [ref=e83]:
                - text: For the fifth time since 2017, CLA Meridian Capital has been recognized as a
                - link "Best Workplace by the Puget Sound Business Journal" [ref=e84] [cursor=pointer]:
                  - /url: https://www.bizjournals.com/seattle/news/2024/06/10/washingtons-best-workplaces-2024-reveal.html
                - text: (“PSBJ”). For the 2024 award, we were one of 100 firms selected. Businesses were judged based on its employees’ responses to survey questions. It goes beyond the perks and scores how employees feel about the culture, mission and values at their workplace. The Business Journals’ national research partner Quantum Workplaces issues surveys that are sent to employees at participating companies, then tabulates the results.
