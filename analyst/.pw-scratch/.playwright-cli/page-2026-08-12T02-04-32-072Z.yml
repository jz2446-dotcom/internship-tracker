                    - text: Qualifications
                    - paragraph [ref=f817e384]:
                      - strong [ref=f817e385]: Required Qualifications
                    - list [ref=f817e386]:
                      - listitem [ref=f817e387]:
                        - text: Bachelor's Degree in Business, Operations, Finance, or related field AND 4+ years experience in program management, process management, or process improvement
                        - list [ref=f817e388]:
                          - listitem [ref=f817e389]: OR equivalent experience.
                    - paragraph [ref=f817e390]:
                      - strong [ref=f817e391]: Other Requirements
                    - paragraph [ref=f817e392]: "Security Clearance Requirements: Candidates must be able to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings:"
                    - list [ref=f817e393]:
                      - listitem [ref=f817e394]: The successful candidate must have an active U.S. Government Top Secret Security Clearance. Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. Failure to maintain or obtain the appropriate clearance and/or customer screening requirements may result in employment action up to and including termination.
                      - listitem [ref=f817e395]: "Clearance Verification: This position requires successful verification of the stated security clearance to meet federal government customer requirements. You will be asked to provide clearance verification information prior to an offer of employment."
                      - listitem [ref=f817e396]: "Microsoft Cloud Background Check: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter."
                    - paragraph [ref=f817e397]:
                      - heading "Preferred Qualifications:" [level=3] [ref=f817e398]
                    - list [ref=f817e399]:
                      - listitem [ref=f817e400]: Software/Cloud Services industry consulting and support contract management experience with United States Federal Government preferred.
                      - listitem [ref=f817e401]: Managing Customer contract and agreement while applying sound business judgment and contracting principles.
                      - listitem [ref=f817e402]: Proven complex negotiation skills.
                      - listitem [ref=f817e403]: Demonstrated decision-making and problem-solving skills in a cross-functional environment.
                      - listitem [ref=f817e404]: Effective interpersonal, verbal, oral and written communication ability, adaptable to engagements with all levels of an organization.
                      - listitem [ref=f817e405]: Highly attentive to workflows and deadlines.
                      - listitem [ref=f817e406]: Thoughtful risk-taking, with a demonstrated growth mindset and curiosity to learn independently.
                      - listitem [ref=f817e407]: Experience in sales and negotiation strategies ensuring adherence to established guidelines, policies, and legal standards.
                      - listitem [ref=f817e408]: Comfortable dealing with ambiguity, managing stakeholder relationships, demonstrating decision-making and critical thinking skills in a cross-functional environment, and adaptable to engagements with all levels of an organization.
                      - listitem [ref=f817e409]: Demonstrated Ability to embrace AI for efficiencies.
                    - paragraph [ref=f817e410]: Business Program Management IC4 - The typical base pay range for this role across the U.S. is USD $97,600 - $188,400 per year. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $125,000 - $206,400 per year.
