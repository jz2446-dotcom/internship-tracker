                    - text: Overview
                    - paragraph [ref=f817e365]:
                      - text: Microsoft's Deal Desk is a strategic partner to Sales, helping shape and execute complex deals with Microsoft’s largest and most strategic customers. We are actively seeking a
                      - strong [ref=f817e366]: Federal Services Contract Manager
                      - text: to join our team in
                      - strong [ref=f817e367]: Reston, Virginia
                      - text: where you will balance customer needs, commercial judgment, and policy compliance to structure clear, executable agreements that drive long‑term success.
                    - generic [ref=f817e368]: Join a team that values diverse perspectives, authentic inclusion, and continuous growth where leaders invest in your development, empower innovative thinking, and support you in building a successful career as a Federal Services Contract Manager.
                    - paragraph [ref=f817e369]: Collaborating closely in a diverse and inclusive environment with customers of all sizes, the Federal Services Contract Manager is empowered to design and execute customized services deals with customers to help them achieve more with Microsoft services. As a Federal Services Contract Manager on our team, you will work in partnership with Microsoft’s sales teams and business groups to develop strategies for increasing Services revenue and accelerating customer satisfaction. We are looking for self-motivated people who love building relationships, analyzing business deals, simplifying complex scenarios, and creating deal terms which represent a mutual win for customers and for Microsoft.
                    - paragraph [ref=f817e370]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.
                    - text: Responsibilities
                    - list [ref=f817e371]:
                      - listitem [ref=f817e372]: Make empowered decisions on customer agreements, exercising sound business judgment.
                      - listitem [ref=f817e373]: Negotiate services contract terms and conditions to close deals.
                      - listitem [ref=f817e374]: Collaborate with sales, legal, finance, and other business groups to design winning offers and deal constructs.
                      - listitem [ref=f817e375]: Own the review, negotiation and approval of non-standard contract terms and non-standard contract documents.
                      - listitem [ref=f817e376]: Drive business adherence to Services guidelines and policies.
                      - listitem [ref=f817e377]: Ensure negotiation strategies for services adhere to established principles and standards and help adapt those principles to the evolving technology marketplace.
                      - listitem [ref=f817e378]: Share best practices and coach sales teams to improve Microsoft’s deal-making capabilities and accelerate deal timelines.
                      - listitem [ref=f817e379]:
                        - text: Other
                        - list [ref=f817e380]:
