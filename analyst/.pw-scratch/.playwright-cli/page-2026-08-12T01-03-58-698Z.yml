          - generic [ref=f14e155]:
            - heading "Early careers at Nuveen" [level=2] [ref=f14e156]
            - paragraph [ref=f14e157]: Along with our parent company, TIAA, Nuveen offers unique, global opportunities to gain early experience in the asset management industry through its summer internship and rotational associate programs.
            - list [ref=f14e158]:
              - listitem [ref=f14e159]:
                - strong [ref=f14e160]: Summer Internships (undergraduate students)
                - text: Nuveen’s summer internship program offers a world-class, 10-week experience for current undergraduates, with possibilities to springboard into our rotational program after graduation. The internship provides opportunities to connect with senior leaders from across Nuveen, participate in speaker series, and work with fellow interns cross-functionally during the iNUVation challenge.
              - listitem [ref=f14e161]:
                - strong [ref=f14e162]: Post-graduation Rotational Program
                - text: Our two-year post-graduation rotational program delivers challenging assignments, rigorous training, targeted professional development, and mentorship to catapult your early career and expose you to areas across the business.
