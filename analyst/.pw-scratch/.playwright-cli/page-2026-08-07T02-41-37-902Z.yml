                - emphasis [ref=f323e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f323e83]:
                - emphasis [ref=f323e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f323e85]:
