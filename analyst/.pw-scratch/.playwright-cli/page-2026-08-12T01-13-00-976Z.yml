            - heading "Business Operations & Talent" [level=2] [ref=f110e103]
            - paragraph [ref=f110e105]: Investment banking is one of many careers at Harris Williams. Opportunities include compliance, finance, IT, marketing, operations, and talent management – all critical to helping make our firm a success.
            - link "Learn More" [ref=f110e107] [cursor=pointer]:
              - /url: /careers/business-operations-and-talent
          - img "Careers | Operations & Talent" [ref=f110e111]
