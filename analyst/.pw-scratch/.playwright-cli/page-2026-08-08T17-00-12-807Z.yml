    - generic [ref=f739e62]:
      - generic [ref=f739e63]:
        - heading "The Mint Museum’s Internship Program" [level=2] [ref=f739e64]
        - paragraph [ref=f739e65]: Offers undergraduate and graduate students hands-on experience in the daily operations of a museum. Interns are exposed to a range of departments and career paths while applying their academic skills in a professional setting. The program helps students develop technical skills, build professional networks, and gain a realistic understanding of the rewards and challenges of museum and arts careers.
      - link "Apply for an internship" [ref=f739e66] [cursor=pointer]:
