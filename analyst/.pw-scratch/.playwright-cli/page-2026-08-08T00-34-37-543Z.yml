          - figure [ref=e17]
          - heading "Interns & Apprentices" [level=4] [ref=e18]
          - paragraph [ref=e19]:
            - text: We offer
            - strong [ref=e20]: Internships
            - text: (ages 13–17) for those just beginning their agricultural path, and
            - strong [ref=e21]: Apprenticeships
            - text: (generally ages 18+) for individuals pursuing farming as a more serious endeavor. Both positions are paid (weekly stipend plus farm share).
          - paragraph [ref=e22]: "We offer the opportunity to:"
          - list [ref=e23]:
            - listitem [ref=e24]: Connect to local food producers and learn about agriculture, particularly vegetable farming, in northern New Mexico
            - listitem [ref=e25]: Gain insight into small farm business operations and engage with our community
            - listitem [ref=e26]: Practice organic farming techniques
            - listitem [ref=e27]: Work with the support of mentors and farm educators to build knowledge and skills
            - listitem [ref=e28]:
              - text: Experience an established business model and intensive mentorship at
              - link "Cerro Vista Farm" [ref=e29] [cursor=pointer]:
                - /url: https://cerrovistafarm.com/
            - listitem [ref=e30]:
              - text: Work in teams to plant, weed, harvest, and
              - emphasis [ref=e31]: wash & pack
              - text: for retail and wholesale clients
            - listitem [ref=e32]:
              - text: Sell produce at
              - link "Questa Farmers Market" [ref=e33] [cursor=pointer]:
                - /url: https://questafarmersmarket.org/
              - text: and Tuesday Farm Stand
            - listitem [ref=e34]: Deliver produce to wholesale customers, including Sangre de Cristo Valley Market
            - listitem [ref=e35]: Create friendships, connect with the land, and grow food
          - paragraph [ref=e36]:
            - mark [ref=e37]: Our Internship positions are closed for the 2026 season.
            - mark [ref=e38]: We are a nonprofit program facing limited funding this season. You may
            - mark [ref=e39]:
