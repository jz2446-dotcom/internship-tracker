  - generic [ref=f2099e132]:
    - generic [ref=f2099e134]:
      - heading "Turning climate risk into climate action" [level=2] [ref=f2099e135]
      - generic [ref=f2099e136]:
        - paragraph [ref=f2099e137]: It all started with a simple idea that evolved into a robust platform. We believed carbon disclosure should be as easy, transparent, and manageable as financial disclosure.
        - paragraph [ref=f2099e138]: Merging technical expertise with seasoned climate industry experience, we built Persefoni as a simple yet powerful platform. We know global decarbonization won’t happen overnight, but with technology purpose-built to solve the most complex carbon management problems, we’ll help shorten the journey for everyone.
    - img "A black and white photo of the Fearless Girl statue on Wall Street in NY" [ref=f2099e140]
  - generic [ref=f2099e150]:
    - heading "Our Operating Principles" [level=2] [ref=f2099e152]
    - generic [ref=f2099e153]:
      - generic [ref=f2099e154]:
        - generic [ref=f2099e155]: "01"
        - heading "Deliver Customer Results" [level=3] [ref=f2099e156]
        - generic [ref=f2099e157]: We start with the customer and work backwards. We work vigorously to earn and keep customer trust. We deliver results for our customer on a frequent and impactful scale. We build solutions that they need right now and ones they may not even know they need yet.
      - generic [ref=f2099e158]:
        - generic [ref=f2099e159]: "02"
        - heading "Give and Receive Open, Honest & Direct Feedback Constantly" [level=3] [ref=f2099e160]
        - generic [ref=f2099e161]: Feedback applies no just to behavior but most importantly to deliverables and product. Our teammates are obligated to respectfully challenge decisions when they disagree, especially when doing so is uncomfortable. They have conviction and are tenacious. Have backbone and voice concerns or disagree, but in the end commit to the team's course of action
      - generic [ref=f2099e162]:
        - generic [ref=f2099e163]: "03"
        - heading "Have Bias for Action" [level=3] [ref=f2099e164]
        - generic [ref=f2099e165]: Speed matters in business. Many decisions and actions are reversible and do not need extensive study. We value calculated risk taking. As a result we fail regularly but productively when we inevitably fail we spend no time dwelling on it but learn from failure and do better next time. If we're not failing we're not learning and if we're not learning we're not winning.
      - generic [ref=f2099e166]:
        - generic [ref=f2099e167]: "04"
        - heading "Act & Invest Like an Owner" [level=3] [ref=f2099e168]
        - generic [ref=f2099e169]: You are a part-owner of this company. We act on behalf of the entire company, not just their own team and themselves. We think long term and don't sacrifice long-term value for short-term results. That means we invest responsibly into the future of our company. We are always willing to invest into the right tools, people and opportunities. That means we are both willing to invest aggressively and are frugal in equal measures.
