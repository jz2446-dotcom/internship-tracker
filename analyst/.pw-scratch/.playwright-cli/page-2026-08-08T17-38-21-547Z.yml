          - heading "Why we need both carbon reduction and carbon removal" [level=1] [ref=f458e583]
        - generic [ref=f458e663]:
          - paragraph [ref=f458e672]: Since 1750, we have caused global warming by adding 1.6T tonnes of CO2 to the air and oceans. We emit another 40B tonnes annually.
          - paragraph [ref=f458e680]: We can only prevent the worst impacts of climate change if we limit global warming to 1.5°C above pre-industrial era levels.
          - paragraph [ref=f458e688]: But because of these historic and ongoing emissions, we are on a track to exceed 1.5°C of warming by 2050.
          - paragraph [ref=f458e696]: To address global warming, we need to both reduce annual emissions and remove historic emissions.
