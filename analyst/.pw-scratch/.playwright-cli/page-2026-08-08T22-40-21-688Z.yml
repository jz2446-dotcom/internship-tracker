              - term [ref=f288e129]:
                - heading "Job Announcement" [level=2] [ref=f288e130]
              - definition [ref=f288e131]:
                - paragraph [ref=f288e132]: "Since 1977, the Fairfax County Department of Transportation (FCDOT) has enhanced mobility, safety, and quality of life by planning, funding, implementing, and sustaining a multimodal transportation system that serves residents, businesses, and visitors throughout Fairfax County.The Active Transportation Team is seeking an enthusiastic and collaborative transportation professional to help advance the county’s Active Transportation and Trails Plan and promote safe, accessible, and connected walking, biking, and rolling as viable modes of transportation.This position performs active transportation planning, program development, implementation, and evaluation to support mode shift and expand participation in active transportation. Manages countywide education, encouragement, and engagement programs while collecting and analyzing program data, field observations, and community input to identify transportation needs, evaluate program outcomes, and improve active transportation programs and strategies.In this role, you’ll manage several countywide active transportation initiatives, including the Trail Ranger Program, Community Discount Program, Ambassador Program, and Adopt-a-Trail Program. You’ll collaborate with the Education and Encouragement Program Manager, transportation staff, community organizations, volunteers, schools, businesses, advocacy groups, and other partners to strengthen these programs and advance county active transportation priorities.Offers the opportunity to work directly with the community while applying transportation planning principles to programs that encourage more people to walk, bike, and roll. You’ll help evaluate program effectiveness, identify barriers to active transportation, analyze trends and transportation needs, develop recommendations, and shape programs that support mode shift throughout Fairfax County.Responsibilities include:"
                - list [ref=f288e133]:
                  - listitem [ref=f288e134]: Planning, implementing, and evaluating countywide active transportation education, encouragement, and engagement programs that promote safe walking, biking, and rolling and support the county’s Active Transportation and Trails Plan.
                  - listitem [ref=f288e135]: Managing assigned active transportation initiatives, including the Trail Ranger, Ambassador, Community Discount, and Adopt-a-Trail programs.
                  - listitem [ref=f288e136]: Applying active transportation planning principles to develop program objectives, implementation strategies, work plans, and performance measures.
                  - listitem [ref=f288e137]: Collecting and analyzing program data, field observations, and community input to evaluate program effectiveness, identify transportation needs and barriers, analyze trends, and develop recommendations.
                  - listitem [ref=f288e138]: Planning and facilitating community events, educational workshops, volunteer activities, outreach campaigns, and stakeholder engagement as components of active transportation planning and program implementation.
                  - listitem [ref=f288e139]: Developing educational materials, presentations, outreach strategies, and communications that increase awareness and participation in walking, biking, and rolling; coordinating volunteers and managing volunteer programs.
                  - listitem [ref=f288e140]: Building and maintaining partnerships with community organizations, advocacy groups, schools, businesses, volunteers, regional partners, and other stakeholders to advance active transportation goals.
                  - listitem [ref=f288e141]: Communicating active transportation plans, projects, programs, and planning information to the public and conveying
                  - listitem [ref=f288e142]: Preparing planning materials, data summaries, presentations, and findings to support program evaluation and active transportation planning and implementation.
                  - listitem [ref=f288e143]: Coordinating with transportation planners, engineers, county staff, and partner agencies to advance active transportation initiatives and independently manage small active transportation planning and implementation projects.
                  - listitem [ref=f288e144]: Attending evening and weekend meetings, community events, workshops, site visits, and outreach activities, as needed, typically several times per month.
                - text: For more information on the Fairfax County Department of Transportation, please click
                - link "here." [ref=f288e145] [cursor=pointer]:
                  - /url: https://www.fairfaxcounty.gov/transportation/
                - paragraph
              - term [ref=f288e146]:
                - heading "Employment Standards" [level=2] [ref=f288e147]
              - definition [ref=f288e148]:
                - paragraph [ref=f288e149]:
                  - strong [ref=f288e150]: "MINIMUM QUALIFICATIONS:"
                  - link "Any combination of education, experience, and training equivalent to the following:" [ref=f288e151] [cursor=pointer]:
                    - /url: https://www.fairfaxcounty.gov/hr/equivalencies-education-and-experience
                  - emphasis [ref=f288e152]: (Click on the aforementioned link to learn how Fairfax County interprets equivalencies for "Any combination, experience, and training equivalent to")
                  - text: Graduation from an accredited four-year college or university with a bachelor's degree in civil engineering, urban, regional or transportation planning, or a closely related field; plus two years of professional experience in civil engineering, urban, regional or transportation planning, or a closely related field.
                  - strong [ref=f288e153]: "CERTIFICATES AND LICENSES REQUIRED:"
                  - text: Valid driver’s license
                  - strong [ref=f288e154]: "NECESSARY SPECIAL REQUIREMENTS:"
                  - text: The appointee to this position will be required to complete a driving record check to the satisfaction of the employer.
                  - strong [ref=f288e155]: "PREFERRED QUALIFICATIONS:"
                - list [ref=f288e156]:
                  - listitem [ref=f288e157]: Experience with active transportation including bicycle and pedestrian planning.
                  - listitem [ref=f288e158]: Experience planning, implementing, and evaluating education, encouragement, public engagement, volunteer, or community-based active transportation programs.
                  - listitem [ref=f288e159]: Experience collecting, analyzing, and interpreting qualitative or quantitative data to evaluate program performance, identify transportation needs and trends, and develop recommendations.
                  - listitem [ref=f288e160]: Experience planning and facilitating community events, workshops, public meetings, or stakeholder engagement activities.
                  - listitem [ref=f288e161]: Experience building partnerships with community organizations, schools, businesses, nonprofit organizations, advocacy groups, volunteers, or other stakeholders.
                  - listitem [ref=f288e162]: Knowledge of active transportation planning principles, strategies, and best practices.
                  - listitem [ref=f288e163]: Strong interpersonal, communication, presentation, analytical, and relationship-building skills.
                  - listitem [ref=f288e164]: Experience using GIS/ArcGIS, Microsoft Office Suite, Adobe Creative Cloud, online survey tools, event registration or volunteer management software, or other planning, data analysis, communications, or outreach tools.
                  - listitem [ref=f288e165]: Ability to work collaboratively in a fast-paced, team-oriented environment.
                - strong [ref=f288e166]: "PHYSICAL REQUIREMENTS:"
                - text: Ability to input, access, and retrieve information from a computer. Ability to lift up to 25 lbs. Ability to stand, stoop, bend, stretch, walk, climb, sit, kneel, crouch, reach, crawl, lift and handle materials with manual dexterity. Visual acuity to review detailed drawings, plans and documents. Ability to operate a motor vehicle and bicycle. All duties performed with or without reasonable accommodations.
                - strong [ref=f288e167]: "SELECTION PROCEDURE:"
                - text: Panel interview and may include exercise.Fairfax County is home to a highly diverse population, with a significant number of residents speaking languages other than English at home
                - link "(including Spanish, Asian/Pacific Islander, Indo-European, and many others.) - open in a new tab" [ref=f288e168] [cursor=pointer]:
                  - /url: https://www.fairfaxcounty.gov/demographics/fairfax-county-general-overview
                  - text: (including Spanish, Asian/Pacific Islander, Indo-European, and many others.)
                - text: We encourage candidates who are bilingual in English and another language to apply for this opportunity.
