      - generic [ref=f967e40]:
        - generic [ref=f967e41]:
          - generic [ref=f967e42]: Job Type
          - generic [ref=f967e43]: Full-time
        - generic [ref=f967e44]: Description
        - generic [ref=f967e45]:
          - paragraph [ref=f967e46]: "Under the general supervision of the Assistant Director of Youth & Family Engagement and in cooperation with the Branch Manager or location’s person in charge, provides Spanish and English language services to the community. Services include: creating and conducting fun learning programming activities for children; promoting services to children, teachers, families and caring adults; conducting outreach services to youth in the community; partnering with youth serving organizations; and supporting system-wide efforts to provide quality service for children and youth in Kansas City."
          - paragraph [ref=f967e47]
          - paragraph [ref=f967e48]:
            - text: This is a full-time, exempt position with a starting salary of
            - strong [ref=f967e49]: $51,036
            - text: ", plus excellent"
            - link "benefits." [ref=f967e50] [cursor=pointer]:
              - /url: https://kclibrary.org/jobs/employee-benefits
          - paragraph [ref=f967e51]
          - paragraph [ref=f967e52]:
            - strong [ref=f967e53]: Schedule
          - paragraph [ref=f967e54]: "Monday, Tuesday, Wednesday, & Friday: 8:30 am - 5 pm"
          - paragraph [ref=f967e55]: "Thursday: 11:30 am - 8 pm"
          - paragraph [ref=f967e56]:
            - emphasis [ref=f967e57]:
              - strong [ref=f967e58]: "Note:"
            - text: One Saturday a month is required.
          - paragraph [ref=f967e59]:
            - strong [ref=f967e60]: "Note:"
            - text: Occasional flexibility is needed to cover special library and outreach events.
          - paragraph [ref=f967e61]
          - paragraph [ref=f967e62]:
            - strong [ref=f967e63]: Location
          - paragraph [ref=f967e64]:
            - 'link "North-East Branch: 6000 Wilson Avenue, KCMO, 64123." [ref=f967e65] [cursor=pointer]':
              - /url: https://kclibrary.org/locations/north-east
          - paragraph [ref=f967e66]
          - paragraph [ref=f967e67]:
            - strong [ref=f967e68]: Job Duties (Essential Functions)
          - list [ref=f967e69]:
            - listitem [ref=f967e70]: Provides and promotes programming and services to meet the needs of children and the important adults in their lives with a focus on those in the Branch area of service. These include coordinating children’s events at the Branch, maintaining a child-friendly and interactive space, as well as conducting school visits and representing the Library at Outreach events.
            - listitem [ref=f967e71]: Works as a team with youth services associates at the Branch and serves as the leader in charge when the branch leadership are not available to help ensure the operations of the branch.
            - listitem [ref=f967e72]: Meets regularly with the Assistant Director of Youth and Family Engagement to communicate concerns, share ideas and information, and solicit input or help as needed.
            - listitem [ref=f967e73]: Works collaboratively with the assistant branch manager to assist with collection maintenance needs as required. Seeks ways to market collection to branch patrons.
            - listitem [ref=f967e74]: Ensures a welcoming and functional environment for all patrons which may involve straightening displays, cleaning small messes, and notifying appropriate staff of building or technology issues that may need to be addressed.
            - listitem [ref=f967e75]: Participates in the planning and implementation of system-wide programming for children and their families. Communicates effectively with staff in the branch regarding branch specific and system-wide children’s programming. Assists other youth librarians as needed.
            - listitem [ref=f967e76]: Attends all Youth & Family Engagement and branch staff meetings. Relays information from YFE staff meetings to branch staff and represents branch concerns at YFE meeting.
            - listitem [ref=f967e77]: Continuously maintains Microsoft Outlook calendar that is shared with YFE and branch staff.
            - listitem [ref=f967e78]: Connects with schools, childcare providers, and community organizations to provide and promote library services to children.
            - listitem [ref=f967e79]: Maintains accurate statistics for programming and services. Prepares and shares reports regularly that feature stories of engagement and impact with children, their families, and their learning environments (schools, child development centers, etc.). Utilizes data to refine and develop services.
            - listitem [ref=f967e80]: Other responsibilities include supervising temporary employees and volunteers and may include assisting other branches with providing coverage.
            - listitem [ref=f967e81]: Performs other related work and undertakes special projects as assigned.
        - generic [ref=f967e82]: Requirements
        - generic [ref=f967e83]:
          - list [ref=f967e84]:
            - listitem [ref=f967e85]: Demonstrated ability to create a welcoming environment for children and their families in the branch and to provide engaging and effective library services for this audience.
            - listitem [ref=f967e86]: Outstanding customer service and engagement skills with strong understanding of trauma-informed service.
            - listitem [ref=f967e87]: Ability to discover and share children’s literature and online resources.
            - listitem [ref=f967e88]: An understanding of children's and adolescent developmental stages.
            - listitem [ref=f967e89]: Demonstrated excellence in story time planning and presentation, incorporating Every Child Ready to Read into these learning experiences.
            - listitem [ref=f967e90]: Ability to assess the needs of the community and to reach out to organizations in the service area that serve children and create partnering opportunities.
            - listitem [ref=f967e91]: Ability to work independently and as part of a team and to handle multiple projects simultaneously.
            - listitem [ref=f967e92]: Demonstrated capacity for responding to changing circumstances and expectations.
            - listitem [ref=f967e93]: Demonstrated desire to gain knowledge and stay current with trends and developments in library youth services.
            - listitem [ref=f967e94]: Excellent oral and written communication skills. Demonstrated ability to follow oral and written instructions.
            - listitem [ref=f967e95]: Advanced computer skills, including technology skills used in libraries.
            - listitem [ref=f967e96]: Must have reliable transportation to access locations throughout the Library District.
            - listitem [ref=f967e97]: Ability to work with diverse populations (i.e. age, gender, class, sexual orientation, ethnicity, etc.)
            - listitem [ref=f967e98]: Ability to lift 30 lbs.
            - listitem [ref=f967e99]: Ability to effectively communicate in and understand English and Spanish is required. Additional consideration may be given to individuals that are proficient in any non-English languages utilized in the Kansas City area including American Sign Language, Vietnamese, French, Arabic, and Swahili.
          - paragraph [ref=f967e100]:
            - strong [ref=f967e101]: Required Education & Experience
          - list [ref=f967e102]:
            - listitem [ref=f967e103]: Master’s Degree in Library Science or the equivalent combination of other Master's or Bachelor's degree and applicable work experience.
            - listitem [ref=f967e104]: Spanish Language Proficiency of Advanced Low (AL) per the ACTFL proficiency guidelines verified by third party organization (currently LTI).
            - listitem [ref=f967e105]: Significant experience working with youth and the important adults in their lives.
            - listitem [ref=f967e106]: Understanding of child and adolescent development and a passion for excellent library services for and with youth.
            - listitem [ref=f967e107]: Knowledge of children's literature preferred.
            - listitem [ref=f967e108]: Experience planning activities for children preferred.
          - paragraph [ref=f967e109]:
            - strong [ref=f967e110]: Work Environment
          - paragraph [ref=f967e111]: Primary workspace is shared with co-workers. Work will be performed in a public space amongst staff and patrons from a diverse socio-economic community. Travel to community partners and with other Library staff will occur. May be assigned to work at other Library locations depending on need.
          - paragraph [ref=f967e112]
          - paragraph [ref=f967e113]:
            - strong [ref=f967e114]: Other Duties
          - paragraph [ref=f967e115]: Please note this job description is not designed to cover or contain a comprehensive listing of activities, duties or responsibilities that are required of the employee for this job. Duties, responsibilities, and activities may change at any time with or without notice.
          - paragraph [ref=f967e116]
          - paragraph [ref=f967e117]:
            - emphasis [ref=f967e118]: The employee must be able to perform the essential functions and job requirements of the position satisfactorily. If requested, reasonable accommodations may be made to enable employees with disabilities to perform the essential functions of the job, absent undue hardship.
          - paragraph [ref=f967e119]
          - paragraph [ref=f967e120]:
            - strong [ref=f967e121]: How to Apply
          - paragraph [ref=f967e122]:
            - text: Please apply for this position through our web application system. We only accept applications for specific currently open positions made through our online system. Access the online application from the job listing on the
            - link "Job Opportunities page" [ref=f967e123] [cursor=pointer]:
              - /url: https://recruiting.paylocity.com/Recruiting/Jobs/All/a45c252a-e08e-4f47-8138-cd684ec9a0dd
            - text: . The
          - paragraph [ref=f967e124]: application system allows you to attach a document (such as a cover letter or a resume) to your application (10MB limit per document). When you submit your application, an acknowledgement will be sent to the email address you provided. You are welcome to apply for as many positions as you wish. However, to minimize problems, close and restart your browser between each application.
          - paragraph [ref=f967e125]
          - paragraph [ref=f967e126]: All online Application for Employment forms must be completely filled out. For technical assistance, call 816.701.3712.
          - paragraph [ref=f967e127]
          - paragraph [ref=f967e128]: Kansas City Public Library is an equal opportunity employer and is committed to creating an inclusive environment for all employees.
