    - generic [ref=f311e194]:
      - heading "We welcome applications from all candidates, but there are restrictions to certain roles that you should be aware of. Please see more information below." [level=2] [ref=f311e195]
      - generic [ref=f311e196]:
        - paragraph [ref=f311e197]
        - paragraph [ref=f311e198]: Right to work in the UK and employment offerAny employment offer made is contingent on you obtaining and maintaining the right to work and reside legally in the UK. We welcome applications from candidates who have their own right to work within the UK, where you can maintain and demonstrate your right to work throughout the duration of your employment. You will be asked to provide evidence of your right to work during the recruitment process.Savills are unable to sponsor any candidates for the following roles as the Home Office's eligibility criteria will not be satisfied:Full-Time School Leaver Apprenticeships, Internships, Summer Scheme, Sandwich Placements and Insight Week programmes.We can offer sponsorship for some of our graduate roles in particular locations, during the second year of the programme and this is indicated in the job description for each role, so please review ahead of making an application. Immigration rules are subject to change by the Home Office and if any new regulations subsequently affect your application/offer with Savills, we would need to reassess to ensure we remain compliant in line with the updated guidance as well as the mandatory requirement of valid right to work in the UK.The above information is correct as of 01/01/2025.
