    - generic [ref=f311e164]:
      - heading "Our offer" [level=2] [ref=f311e165]
      - list [ref=f311e166]:
        - listitem [ref=f311e167]:
          - heading "Holiday" [level=3] [ref=f311e168]
          - paragraph [ref=f311e170]: We understand the importance of a work life balance and offer you a generous holiday entitlement, which increases throughout your career as you progress through our job levels or reach service milestones.
        - listitem [ref=f311e171]:
          - heading "Health" [level=3] [ref=f311e172]
          - paragraph [ref=f311e174]: Your wellbeing and that of your family is as important to us as it is to you. We offer Virtual Gp, Digital Health, Private Medical Scheme and mental health support amongst other benefits.
        - listitem [ref=f311e175]:
          - heading "Lifestyle" [level=3] [ref=f311e176]
          - paragraph [ref=f311e178]: We promote a healthy work life balance, supported by our approach to flexible working and our wide variety of health, wellbeing and social programmes.
        - listitem [ref=f311e179]:
          - heading "Our Offer" [level=3] [ref=f311e180]
          - paragraph [ref=f311e182]: Read more about our benefits and culture in our offer overview below
