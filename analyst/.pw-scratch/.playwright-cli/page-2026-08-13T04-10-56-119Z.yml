    - generic [ref=f311e130]:
      - heading "Values" [level=2] [ref=f311e131]
      - generic [ref=f311e132]:
        - paragraph [ref=f311e133]
        - paragraph [ref=f311e134]: "No matter the role you’re in, we all share one purpose: to help people thrive through places and spaces. This is built into our DNA, shaping the way we behave to deliver the best results. We define it by four key values:"
        - paragraph [ref=f311e135]
        - paragraph [ref=f311e136]:
          - strong [ref=f311e137]: "We listen:"
          - text: Tell us your goals and aspirations and we’ll provide the support you need to achieve them. We appreciate the individual value of every team member and create an environment where you can reach your full potential.
        - paragraph [ref=f311e138]
        - paragraph [ref=f311e139]:
          - strong [ref=f311e140]: "We empower:"
          - text: Here, there’s no limit to what you can achieve. We give you opportunities to have a real, positive impact in the community through the work you do, backed by access to our market-leading research and insights.
        - paragraph [ref=f311e141]
        - paragraph [ref=f311e142]:
          - strong [ref=f311e143]: "We challenge:"
          - text: The best results happen when we question the status quo. We create an environment where you can safely challenge our thinking, bringing fresh ideas to the table to innovate as a team.
        - paragraph [ref=f311e144]
        - paragraph [ref=f311e145]:
          - strong [ref=f311e146]: "We collaborate:"
          - text: When you join Savills, you become part of a 40,000-strong network of driven individuals, all sharing their knowledge and experience to push the real estate industry forward.
        - paragraph [ref=f311e147]
        - paragraph [ref=f311e148]: At the heart of it all, we deliver best-in-class insights and advice to help people make better property decisions. We're looking for colleagues who will help us on this mission. When you join Savills, our ask for you is simple – to be extraordinary, together.
        - paragraph [ref=f311e149]
        - paragraph [ref=f311e150]:
          - link "Watch films about our people and culture" [ref=f311e151] [cursor=pointer]:
            - /url: https://www.savills.co.uk/contact-us/careers/savills-stories.aspx
        - paragraph [ref=f311e152]:
          - link "Savills Proud Voices" [ref=f311e153] [cursor=pointer]:
            - /url: https://www.youtube.com/watch?v=cjK0VZ0l4FQ
