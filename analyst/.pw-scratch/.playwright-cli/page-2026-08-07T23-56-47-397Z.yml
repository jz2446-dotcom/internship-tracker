      - generic [ref=f288e41]:
        - generic [ref=f288e42]:
          - heading "Dev Degree Program" [level=3] [ref=f288e43]
          - paragraph [ref=f288e44]: A 3-4-year program that allows people to earn a computer science degree while working. It’s designed for those looking to break into computer science or transition into the tech field.
          - link "Learn more about our Dev Degree Program" [ref=f288e47] [cursor=pointer]:
            - /url: https://devdegree.ca/
        - generic [ref=f288e48]:
          - heading "Internship Program" [level=3] [ref=f288e49]
          - paragraph [ref=f288e50]: Shopify offers 4-month paid Engineering internships that are open to students, recent graduates, and those early in their careers.
          - link "Learn more about our Internship Program" [ref=f288e53] [cursor=pointer]:
            - /url: https://internships.shopify.com/
        - generic [ref=f288e54]:
          - heading "APM Program" [level=3] [ref=f288e55]
          - paragraph [ref=f288e56]: Shopify’s 12-month Apprentice Product Manager program is designed to help you gain the skills needed to start a product management career.
          - link "Learn more about our APM Program" [ref=f288e59] [cursor=pointer]:
            - /url: https://apm.shopify.com
        - generic [ref=f288e60]:
          - heading "Design Apprentice Program" [level=3] [ref=f288e61]
          - paragraph [ref=f288e62]: Shopify's 6-month Design Apprentice Program pairs early-career designers with senior mentors through two rotations. Built for new graduates, career switchers, and those early in their design careers.
          - link "Learn more about our Design Apprentice Program" [ref=f288e65] [cursor=pointer]:
            - /url: https://shopify.design/dap
