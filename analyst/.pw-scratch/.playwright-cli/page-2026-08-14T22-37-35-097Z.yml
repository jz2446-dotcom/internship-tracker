          - paragraph [ref=f1765e27]: Shopify offers 4-month paid Engineering internships that are open to students, recent graduates, and those early in their careers.
          - link "Learn more about our Internship Program" [ref=f1765e30] [cursor=pointer]:
            - /url: https://internships.shopify.com/
        - generic [ref=f1765e31]:
          - heading "APM Program" [level=3] [ref=f1765e32]
          - paragraph [ref=f1765e33]: Shopify’s 12-month Apprentice Product Manager program is designed to help you gain the skills needed to start a product management career.
          - link "Learn more about our APM Program" [ref=f1765e36] [cursor=pointer]:
            - /url: https://apm.shopify.com
        - generic [ref=f1765e37]:
