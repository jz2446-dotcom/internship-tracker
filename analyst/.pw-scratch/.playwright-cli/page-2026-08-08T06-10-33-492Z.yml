            - heading "Campus Tours" [level=2] [ref=f166e1192]
            - heading "TYPES OF TRANSPORTATION AVAILABLE TO CAMPUS" [level=3] [ref=f166e1193]
            - article [ref=f166e1194]:
              - paragraph [ref=f166e1195]: "Burbank Airport is 10 miles from campus. Super Shuttle and taxi service is available from the airport to campus. Los Angeles International Airport is farther from campus, but close enough that buses run from the airport to hotels in the Pasadena area not too far from campus. Amtrak trains and Greyhound/Trailways buses serve Los Angeles. Rapid Transit District bus service (public transportation) to campus is available from downtown L.A.: take either line 83 (on York Blvd.) or line 84 (on Eagle Rock Blvd.). Call 213-626-4455 for bus information and schedules."
            - heading "DRIVING INSTRUCTIONS TO CAMPUS" [level=3] [ref=f166e1196]
            - article [ref=f166e1197]:
              - paragraph [ref=f166e1198]: From downtown L.A., take I-110 N. (Harbor Freeway). Follow signs for Pasadena. Take I-5 N. (Golden State Freeway) toward Bakersfield. Then take Rte. 2 (Glendale Freeway) going toward Glendale. Exit at Verdugo Rd.; turn left at the end of the off ramp onto Eagle Rock Blvd. Continue on Eagle Rock Blvd. for 5 traffic lights to Westdale Ave. Turn right onto Westdale and follow it until it ends at Campus Rd. From the Ventura Freeway (Rte. 134) heading east, go through Glendale to the Harvey Dr. exit. Turn right at the end of the off ramp and then left at the light onto Broadway. When Broadway merges with Colorado Blvd., continue on Colorado Blvd. to Eagle Rock Blvd. Turn right and continue for 4 traffic lights to Westdale Ave. Turn left onto Westdale and follow it to Campus Rd. From the Ventura Freeway (Rte. 134) heading west, exit at Colorado Blvd. Take Colorado Blvd. to Eagle Rock Blvd. (approximately one mile). Turn left onto Eagle Rock Blvd. and continue 4 traffic lights to Westdale Ave. Turn left onto Westdale and proceed to Campus Rd.
            - heading "LOCAL ACCOMMODATIONS" [level=3] [ref=f166e1199]
            - article [ref=f166e1200]:
              - paragraph [ref=f166e1201]: "In the moderate range, about 15 minutes away, is Sheraton Pasadena (303 East Cordova Street, 626-449-4000). Ask for Occidental College's special rate). This property has a pool and exercise room. Also available, Westin Hotel (191 North Los Robles, Pasadena, 626-792-2727). This hotel has a full health club, exercise room, pool and jacuzzi. The least expensive place we suggest is also the closest to campus: Welcome Inn (1840 West Colorado Blvd., 323-256-1673)."
          - generic [ref=f166e1202]:
            - heading [level=2] [ref=f166e1203]:
              - text: 11. Career Services & Jobs
              - link [ref=f166e1204] [cursor=pointer]:
                - /url: "#"
                - text: Scroll to Top
                - img "Scroll To Top Arrow" [ref=f166e1205]
            - heading "What students say:" [level=3] [ref=f166e1206]
            - article [ref=f166e1207]:
              - paragraph [ref=f166e1208]: Overall, “Occidental does a great job of providing its students with excellent resources and opportunities,” and this certainly extends to career services. Indeed, as one junior succinctly states, the “career development support is fantastic.” Undergrads really appreciate that Oxy runs a robust internship program, one in which they can earn course credit. Students also have the opportunity for “transformational summer experiences with employers throughout the Los Angeles area” through Oxy’s flagship InternLA program, which awards them a stipend and places them in real-world work situations at nonprofits. Not only can students earn academic credit for many of the internships arranged through the career services office, but it also provides them with invaluable insight into potential career tracks. Lastly, according to PayScale.com, the median starting salary for recent Oxy graduates is $66,900, and 56 percent of students report taking away a great deal of meaning from their job.
