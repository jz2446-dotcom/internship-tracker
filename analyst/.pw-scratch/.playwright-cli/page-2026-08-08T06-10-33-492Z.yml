            - heading "What students say:" [level=3] [ref=f166e729]
            - article [ref=f166e730]:
              - paragraph [ref=f166e731]: As you stroll around the campus, it's not hard to see that students are "excited to be at Occidental" and "people are really passionate about their extracurricular activities and internships." Undergrads can join a wide range of groups, including a sketch comedy troupe, a fiber arts club, and a food justice organization. Sports are also a popular social outlet. In fact, 45% of the student body is involved in athletics, be it a varsity, club, or intramural team. Additionally, school-sponsored events are typically well attended. Students often flock to hear "guest speakers [or participate in] dialogues and workshops." They also love going to the "dances, trivia nights, movie screenings, fashion shows, concerts, and food tastings" that Oxy organizes. And of course, off-campus "house parties are a huge source of fun on the weekends." And speaking of off-campus, undergrads appreciate that they have "Los Angeles as [their] backyard," especially since the school is "not isolated from the surrounding community like many other college campuses." It's common to see students hitting up "music shows, bars, and clubs" or heading out to "go to the beach, go shopping in L.A., go out to eat in Eagle Rock, and go hiking."
