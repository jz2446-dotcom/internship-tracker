            - heading [level=2] [ref=f166e364]:
              - text: 02. Students
              - link [ref=f166e365] [cursor=pointer]:
                - /url: "#"
                - text: Scroll to Top
                - img "Scroll To Top Arrow" [ref=f166e366]
            - heading "What students say:" [level=3] [ref=f166e367]
            - article [ref=f166e368]:
              - paragraph [ref=f166e369]: One of the many reasons students love Occidental is because it's really easy to find "a good niche of close friends at Oxy." As one undergrad notes, "If you're involved on campus, expect your friend group to continually grow." This welcoming and supportive nature even extends into the classroom, where "there is a communal desire to help each other succeed." Undergrads assert that their peers are "socially and politically conscious" and care deeply about issues affecting the world at large. Although some do acknowledge that it can feel as though the school maintains an "overwhelmingly left-wing atmosphere," they also insist that "every student at Oxy treats all persons equally, regardless of sexual orientation, gender identity, or religious views," and most are readily "accepting of different opinions." Indeed, there's an emphasis on inclusion and visibility that is evident from groups like the First Gen Coalition and Chinese Culture Club, as well as themed housing like Women in Wellness and The Latinx Culture Collective. These all make it easy for students to foster a strong sense of community at Occidental.
