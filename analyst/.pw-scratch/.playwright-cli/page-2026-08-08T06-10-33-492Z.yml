          - generic [ref=f166e127]:
            - heading "01. What the School is Known For" [level=2] [ref=f166e128]
            - heading "What students say:" [level=3] [ref=f166e129]
            - article [ref=f166e130]:
              - paragraph [ref=f166e131]: Occidental College, in northeast Los Angeles, offers undergrads an "intellectually stimulating" environment, one that "really encourages [them] to take a proactive role in their education" and "experiment with a wide range of courses." As this student shares, "I love the interdisciplinary aspect of academics. I can really tailor my coursework to what I am interested in." Undergrads also appreciate that Oxy emphasizes a global perspective. Beyond traditional study abroad programs, students can enroll in courses that include an international field trip. For example, they might travel with faculty to study marine biology in Costa Rica or music history in Austria. Students can also apply to spend a semester at the U.N., completing internships with country missions or various NGOs. Back at home, undergrads have classes with professors who "encourage critical analysis, ask interesting questions, and allow students to create informed opinions about the subject." They also do a great job of "finding ways to connect [their] lectures to the real world." Perhaps more importantly, Oxy professors are "very willing to have students help them with their research." And while they work hard to ensure their "courses are challenging," it's clear the faculty "want to see you succeed." Undergrads report that instructors often "go the extra mile to make themselves available" and that "there are plenty of opportunities to get extra help on the tough material." Best of all, it's evident that professors "are invested in cultivating real relationships with students."
