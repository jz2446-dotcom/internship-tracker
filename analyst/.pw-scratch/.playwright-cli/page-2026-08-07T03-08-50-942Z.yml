                      - text: and
                      - link "Mike Granowski" [ref=f405e282] [cursor=pointer]:
                        - /url: https://www.rolandberger.com/en/Persons/Mike.Granowski.html
                      - text: will discuss the outlook for SMRs in Europe and Belgium, the latest technology and market developments, emerging business cases across industries, and the key factors for successful SMR deployment. Further information can be found
                      - link "here" [ref=f405e283] [cursor=pointer]:
