      - generic [ref=f392e48]:
        - heading "Welcome to Stifel." [level=1] [ref=f392e49]
        - heading "Where innovation, collaboration, and dedication drive success." [level=1] [ref=f392e50]
        - paragraph [ref=f392e51]: Stifel is more than 135 years old and still thinking like a startup. The entrepreneurial spirit that launched our firm in 1890 is as abundant as ever. And it’s a key quality we seek in the people who want to join our growing firm.
        - paragraph [ref=f392e52]: We are looking for professionals who are ready to empower our clients to achieve their goals. It’s that simple.
        - paragraph [ref=f392e53]: Stifel is a place where you can build a rewarding career with one of the industry’s most collaborative and creative teams in financial services, client support, and technology. New ideas are welcome and fresh thinking is encouraged.
        - generic [ref=f392e54]:
          - heading "If you’re ready for us, we’re ready for you." [level=1] [ref=f392e55]
          - link "Apply Now" [ref=f392e56] [cursor=pointer]:
