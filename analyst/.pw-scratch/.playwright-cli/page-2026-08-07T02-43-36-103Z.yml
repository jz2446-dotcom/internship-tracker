        - heading "Where Success Meets Success" [level=1] [ref=f392e65]
        - paragraph [ref=f392e66]: At Stifel, we build advice-focused, collaborative relationships and a commitment to earning long-term trust. Our experience and agility uniquely position us to help clients navigate complexity and seize opportunity.
        - paragraph [ref=f392e67]:
          - text: Within our Global Wealth Management segment, our
          - strong [ref=f392e68]: Financial Advisors
          - text: serve a diverse client base of individuals and institutions from 400 branches across the U.S. Supporting these Financial Advisors is a deep bench of talented and knowledgeable professionals who are dedicated to helping them deliver the full range of Stifel’s capabilities.
        - paragraph [ref=f392e69]:
          - text: And in our
          - strong [ref=f392e70]: Institutional Group
          - text: "segment, Stifel’s full-service investment bank is a global middle-market corporate advisory leader—fueled by the power of our people and the breadth of our platform. We offer a dynamic environment where professionals can thrive across a wide range of fields, including:"
