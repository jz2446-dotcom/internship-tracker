            - generic [ref=f319e119]:
              - paragraph [ref=f319e120]: Who we are looking for
              - paragraph [ref=f319e121]: We are looking for a Working Student to join the Chief Administration Office (CAO) of State Street Bank International GmbH (SSBI). Reporting to the Executive Business Manager for SSBI CAO, Executive Management Board Member, you will gain exposure to senior leadership, governance processes, regulatory initiatives, and strategic projects within one of leading financial institutions.
              - paragraph
              - paragraph [ref=f319e122]: Why this role is important to us
              - paragraph [ref=f319e123]: The Chief Administration Office plays a key role in driving governance, compliance, privacy, business resiliency, cyber security, and strategic execution across SSBI. The role offers an excellent opportunity to gain insight into the operation of an Executive Management Board environment and a highly regulated financial institution.
              - paragraph
              - paragraph [ref=f319e124]: What you will be responsible for
              - paragraph [ref=f319e125]: "As a Working Student, you will:"
              - list [ref=f319e126]:
                - listitem [ref=f319e127]: Assist with coordinating key activities
                - listitem [ref=f319e128]: Contribute to the key regulatory CAO projects, tactical initiatives and issues
                - listitem [ref=f319e129]: Support the preparation of management presentations, committee materials, meeting packs, and executive communications
                - listitem [ref=f319e130]: Assist with the coordination and tracking of regulatory, audit, and remediation activities
                - listitem [ref=f319e131]: Help maintain project plans, action trackers, and governance documentation
                - listitem [ref=f319e132]: Assist with data analysis, reporting, and preparation of management dashboards
                - listitem [ref=f319e133]: Conduct research on regulatory developments, industry topics, and strategic initiatives
                - listitem [ref=f319e134]: Coordinate administrative and organizational tasks for ongoing projects and key deliverables
              - paragraph
              - paragraph [ref=f319e135]: What we value
              - list [ref=f319e136]:
                - listitem [ref=f319e137]: Strong organizational skills and attention to detail
                - listitem [ref=f319e138]: Excellent written and verbal communication skills
                - listitem [ref=f319e139]: Strong analytical and problem-solving capabilities
                - listitem [ref=f319e140]: Professional attitude, curiosity, and willingness to learn in a fast-paced environment.
              - paragraph
              - paragraph [ref=f319e141]: Education & Preferred Qualifications
              - list [ref=f319e142]:
                - listitem [ref=f319e143]: Currently pursuing a Bachelor's or Master's degree in Business Administration, Economics, Finance, Law, or a related field.
                - listitem [ref=f319e144]: Strong interest in banking, financial services, governance, risk, or regulatory topics.
                - listitem [ref=f319e145]: Great knowledge of Microsoft Office, particularly PowerPoint, Excel, Word, and Teams.
                - listitem [ref=f319e146]: Fluency in German and English
              - paragraph
              - paragraph [ref=f319e147]: Additional requirements
              - list [ref=f319e148]:
                - listitem [ref=f319e149]: Interest in working in an international and highly regulated environment.
                - listitem [ref=f319e150]: The position requires strong organizational skills, attention to detail, discretion, and the ability to manage multiple priorities in a dynamic environment.
              - paragraph
              - paragraph [ref=f319e151]: Work Requirement
              - list [ref=f319e152]:
                - listitem [ref=f319e153]: Hybrid working model in line with State Street policies.
                - listitem [ref=f319e154]: Based in Munich or Frankfurt.
                - listitem [ref=f319e155]: Flexible working hours that can be coordinated with university commitments.
              - heading [level=1]
              - paragraph
              - heading "About State Street" [level=1] [ref=f319e156]
              - paragraph
              - paragraph [ref=f319e158]: Across the globe, institutional investors rely on us to help them manage risk, respond to challenges, and drive performance and profitability. We keep our clients at the heart of everything we do, and smart, engaged employees are essential to our continued success.
              - paragraph
              - paragraph [ref=f319e159]: We are committed to fostering an environment where every employee feels valued and empowered to reach their full potential. As an essential partner in our shared success, you’ll benefit from inclusive development opportunities, flexible work-life support, paid volunteer days, and vibrant employee networks that keep you connected to what matters most. Join us in shaping the future.
              - paragraph
              - paragraph [ref=f319e160]: As an Equal Opportunity Employer, we consider all qualified applicants for all positions without regard to race, creed, color, religion, national origin, ancestry, ethnicity, age, disability, genetic information, sex, sexual orientation, gender identity or expression, citizenship, marital status, domestic partnership or civil union status, familial status, military and veteran status, and other characteristics protected by applicable law.
              - paragraph
