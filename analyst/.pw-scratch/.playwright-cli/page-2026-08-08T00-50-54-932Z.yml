            - list [ref=f319e184]:
              - listitem [ref=f319e185]:
                - generic [ref=f319e189]:
                  - strong [ref=f319e195]: Medical Care and Insurance
                  - generic [ref=f319e196]: We provide a range of medical plans that cover you and your dependents. You can also take advantage of our employee and family life insurance, accidental death and dismemberment coverage.
              - listitem [ref=f319e201]:
                - generic [ref=f319e206]:
                  - strong [ref=f319e211]: Well-Being Programs
                  - generic [ref=f319e212]: State Street's BeWell helps employees proactively manage their well-being. Our Employee Assistance Program (EAP) provides personal and confidential assistance for a broad range of issues.
              - listitem [ref=f319e216]:
                - generic [ref=f319e221]:
                  - strong [ref=f319e226]: Financial Well-Being
                  - generic [ref=f319e227]: Depending on where you work, you will be eligible for regionally specific savings and/or retirement plans. We also provide resources and host local events to educate employees on achieving financial well-being.
              - listitem [ref=f319e232]:
                - generic [ref=f319e237]:
                  - strong [ref=f319e242]: Holidays and Time Off
                  - generic [ref=f319e243]: We provide our employees with a highly competitive holiday and paid vacation allowance, with considerations for local requirements. We also offer our employees two paid days off to volunteer their time to company-driven initiatives or organizations of their choice.
              - listitem [ref=f319e247]:
                - generic [ref=f319e252]:
                  - strong [ref=f319e257]: Supporting Families
                  - generic [ref=f319e258]: We are committed to supporting all employees and the ones they care about. Some of our programs include paid parental leaves, back-to-work support, adoption assistance or flex work arrangements.
              - listitem [ref=f319e262]:
                - generic [ref=f319e267]:
                  - strong [ref=f319e272]: Other Benefits
                  - generic [ref=f319e273]: Among others benefits, you may have access to group savings, discounts at sport clubs and cinemas, and our new employee referral bonus program.
