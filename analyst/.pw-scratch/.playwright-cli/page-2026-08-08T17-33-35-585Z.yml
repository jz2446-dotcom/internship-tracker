        - generic [ref=f210e399]:
          - generic [ref=f210e400]:
            - heading "About Reinvestment Fund" [level=6] [ref=f210e401]
            - generic [ref=f210e402]:
              - paragraph [ref=f210e403]: "Reinvestment Fund is a mission-driven financial institution committed to making communities work for all people. We bring financial and analytical tools to partnerships that work to ensure that everyone has access to essential opportunities: affordable places to live, access to nutritious food and health care, schools where their children can flourish, and strong, local businesses that support jobs. We use data to understand markets, communities, and impediments to opportunity—and how investment and policy decisions can have the most powerful impact. Since our inception in 1985, Reinvestment Fund has provided over $3.2 billion in financing to strengthen neighborhoods, scale social enterprises, and build resilient communities."
              - paragraph [ref=f210e404]: Reinvestment Fund is an equal opportunity provider.
