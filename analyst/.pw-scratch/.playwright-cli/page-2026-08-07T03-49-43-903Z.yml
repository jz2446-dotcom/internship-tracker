          - heading "Summer internships" [level=2] [ref=f50e81]
          - generic [ref=f50e83]:
            - paragraph [ref=f50e84]: We offer a range of paid internships to introduce students to environmental careers, but our summer internship program is the most popular.
            - paragraph [ref=f50e85]: Close to 100 interns participate in a range of programming that includes a weekly speaker series, professional development workshops, lunch with EDF's president and fun social events.
            - paragraph [ref=f50e86]: All interns are matched with Intern Ambassadors, EDF experts who serve as mentors and can help you navigate our large, global organization.
