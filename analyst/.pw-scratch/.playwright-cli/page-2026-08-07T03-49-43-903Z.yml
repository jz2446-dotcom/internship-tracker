          - heading "University and community partnerships" [level=2] [ref=f50e108]
          - paragraph [ref=f50e110]: EDF has established relationships with numerous colleges, universities and community organizations that sponsor EDF interns on projects at the intersection of science, policy, community and business.
        - generic [ref=f50e111]:
          - generic [ref=f50e114]:
            - heading "Internship FAQ" [level=2] [ref=f50e115]
            - generic [ref=f50e116]:
              - paragraph [ref=f50e117]:
                - strong [ref=f50e118]: What can I expect at EDF?
              - paragraph [ref=f50e119]: EDF offers a range of paid internships designed to introduce students to environmental careers and, in many cases, provide hands-on experience with leading experts in the field. Intern supervisors are not just managers — they are also mentors. Interns contribute directly to EDF’s mission work and leave the organization knowing that they made an impact.
              - paragraph [ref=f50e120]:
                - strong [ref=f50e121]: What is your hiring timeline?
              - paragraph [ref=f50e122]: Interns follow fall, spring and summer cycles. Fall positions are posted in early August. Spring positions are posted in November. Summer positions are posted in mid-February.
              - paragraph [ref=f50e123]:
                - strong [ref=f50e124]: What is special about EDF’s Summer Internship Program?
              - paragraph [ref=f50e125]: EDF hosts the greatest number of interns in the summer season, ranging from 80-100 interns, who work full time from June through August (a 10-12 week term). Summer interns participate in a range of professional development and social activities with EDF staff members.
              - paragraph [ref=f50e126]:
                - strong [ref=f50e127]: I’m interested in the Climate Corps program. How do I apply?
              - paragraph [ref=f50e128]:
                - text: Apply directly on the
                - link "Climate Corps site" [ref=f50e129] [cursor=pointer]:
                  - /url: https://business.edf.org/categories/climate-corps/
                - text: .
