    - heading "Careers" [level=1] [ref=f280e206]
    - generic [ref=f280e208]:
      - generic [ref=f280e211]:
        - generic [ref=f280e213]:
          - paragraph [ref=f280e214]: PJT Partners is a destination for top talent. Our collaborative, high-performance culture is designed to attract and develop exceptional people who thrive in an environment where rigorous thinking is the norm and colleagues understand the value of being surrounded by a strong team.
          - paragraph [ref=f280e215]:
            - link "2025 Corporate Sustainability Report" [ref=f280e216] [cursor=pointer]:
              - /url: https://d1io3yog0oux5.cloudfront.net/_1f878a5febe99d54e8e3671384eda2d6/pjtpartners/files/pages/pjtpartners/db/2415/description/2025_PJT_Partners_Corporate_Sustainability_Report.pdf
        - generic [ref=f280e218]:
          - paragraph [ref=f280e219]: From early-career professionals to seasoned, best-in-class bankers, we offer a platform for growth and long-term success – where careers are defined by impact, collaboration and the opportunity to shape the future of our firm.
          - link [ref=f280e220] [cursor=pointer]:
            - /url: https://pjtpartners.wd1.myworkdayjobs.com/Careers
      - generic [ref=f280e232]:
        - generic [ref=f280e235]:
          - heading "Our Culture Drives Our Success" [level=3] [ref=f280e238]
          - paragraph [ref=f280e241]: PJT Partners was founded on the principle that the right culture enables success. We've created an environment that empowers people to deliver exceptional outcomes for our clients. Our team is built on the values of integrity, expertise and collaboration, and these core principles consistently guide our work and interactions.
        - figure [ref=f280e248]
      - generic [ref=f280e251]:
        - heading "Top Talent" [level=3] [ref=f280e257]
        - generic [ref=f280e260]:
          - figure [ref=f280e265]:
            - img "Image 6 column with caption" [ref=f280e266]
          - generic [ref=f280e268]:
            - paragraph [ref=f280e269]: At PJT Partners, everything is built around delivering best-in-class advice to our clients.
            - paragraph [ref=f280e270]: We offer opportunities for those who know how to solve the toughest problems. Those who are life-long learners and life-long teachers. Those who form lasting relationships with clients and with peers. And those who creatively collaborate with colleagues to solve the most complex issues facing our clients.
            - paragraph [ref=f280e271]: If you're up for a challenge, consider exploring a career at PJT Partners.
      - generic [ref=f280e277]:
        - link [ref=f280e279] [cursor=pointer]:
          - /url: /careers/experienced-professionals
          - generic [ref=f280e281]:
            - figure [ref=f280e282]:
              - img "Experienced Professionals" [ref=f280e283]
            - heading "Experienced Professionals" [level=4] [ref=f280e285]
            - generic [ref=f280e286]:
              - paragraph [ref=f280e288]: PJT Partners is different. To maintain that difference, we seek professionals who place a premium on curiosity, collaboration and integrity. Here you’ll find the energy of a start-up with the power, expertise and resources of a much larger firm. You’ll grow, and you’ll help others grow.
              - generic "Link" [ref=f280e289]
