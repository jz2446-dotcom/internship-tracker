            - heading "Collaboration" [level=6] [ref=f280e338]
            - paragraph [ref=f280e341]: We believe we can provide the best solutions for our clients by learning from each other and leveraging capabilities from across the firm.
          - generic [ref=f280e343]:
            - heading "Client Relationships" [level=6] [ref=f280e344]
            - paragraph [ref=f280e347]: Our reputation across the market is driven by how we partner with and gain the trust of our clients.
      - generic [ref=f280e350]:
        - heading "Growth and Development" [level=3] [ref=f280e356]
        - generic [ref=f280e359]:
          - figure [ref=f280e364]:
            - img "Growth and Development image" [ref=f280e365]
          - generic [ref=f280e367]:
            - paragraph [ref=f280e368]: At PJT Partners, your growth matters. Our talent development approach is multi-faceted - combining formal training and hands-on experience to help you build technical, communication and client management skills. You’ll benefit from real-time feedback, structured reviews and a culture that prioritizes your development at every stage. These initiatives ensure you have the tools, support and opportunities to thrive and lead as part of our next generation of professionals.
            - link [ref=f280e369] [cursor=pointer]:
              - /url: /expertise
      - generic [ref=f280e381]:
        - generic [ref=f280e384]:
