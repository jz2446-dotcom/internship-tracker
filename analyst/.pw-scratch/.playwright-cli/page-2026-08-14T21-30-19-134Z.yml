          - generic [ref=f280e389]:
            - paragraph [ref=f280e390]: From the initial application through interviews and evaluations, we focus on getting to know you as a whole person - your skills, aspirations and potential to contribute to our team.
            - paragraph [ref=f280e391]: This is critical for maintaining our differentiated culture as we grow.
        - generic [ref=f280e394]:
          - generic [ref=f280e397]:
            - heading "Purposeful Structure" [level=6] [ref=f280e398]
            - paragraph [ref=f280e402]: Our hiring process is designed to identify exceptional talent. We assess candidates on their strengths, aptitude, experiences, and - critically - their alignment with our culture. This ensures we bring in individuals who not only excel professionally but also thrive in our environment.
          - generic [ref=f280e405]:
            - heading "Interviewing for Cultural Alignment" [level=6] [ref=f280e406]
            - paragraph [ref=f280e410]: Beyond evaluating skills and potential, we look for individuals who are energized by our culture - one rooted in a deep commitment to client service and a relentless pursuit of excellence. Our interviews consider both the professional demands and the values that define success here. This helps candidates envision their path and increases the likelihood of a strong, lasting fit.
          - generic [ref=f280e413]:
            - heading "Building an Inclusive Culture Through Talent" [level=6] [ref=f280e414]
            - paragraph [ref=f280e418]: Our firm’s success is built on talent - on finding great people, developing them, and helping them soar. We believe the best advice comes from teams that reflect a broad range of backgrounds, experiences, and perspectives. By fostering an inclusive culture, we strengthen our ability to serve clients.
