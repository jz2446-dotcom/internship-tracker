        - generic [ref=f4e183]:
          - img "pexels-ron-lach-9870153" [ref=f4e185]
          - generic [ref=f4e187]:
            - heading "Entry level & EARLY CAREER" [level=2] [ref=f4e188]
            - generic [ref=f4e189]: Are you early in your career and eager to grow in the world of consulting? Whether you're a recent graduate, transitioning from industry, or already building your path in consulting, we’re looking for curious, driven individuals ready to make an impact in areas like supply chain, operational strategy, innovation, and new product development. Be part of a team where you’ll work directly with clients, contribute to real, lasting impact across industries, benefit from direct Partner mentorship, and deepen your expertise as you grow.
            - link "SEE OPEN POSITIONS" [ref=f4e191] [cursor=pointer]:
              - /url: /careers/entry-level
        - generic [ref=f4e195]:
          - img "About Alt" [ref=f4e197]
          - generic [ref=f4e199]:
            - heading "summer intern" [level=2] [ref=f4e200]
            - generic [ref=f4e201]:
              - text: Explore our Summer Internship Program, where you’ll gain direct exposure to consulting engagements across innovation, new product development, operations, manufacturing strategy, and supply chain optimization. You’ll work alongside our team on client projects and firm development activities, gaining tangible skills in problem-solving, analysis, and communication – all with hands-on mentorship from experienced consultants.
              - generic [ref=f4e202]: Summer 2026 internship positions are now filled. Please check back for future opportunities.
