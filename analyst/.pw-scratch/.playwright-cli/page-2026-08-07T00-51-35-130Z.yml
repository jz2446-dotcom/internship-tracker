      - generic [ref=f4e51]:
        - heading "Join Us!" [level=3] [ref=f4e54]
        - generic [ref=f4e56]:
          - paragraph [ref=f4e57]: Are you interested in working with an experienced team of management consultants who have a track record of successfully driving bottom-line results for Fortune 1000 clients?
          - paragraph [ref=f4e58]
          - paragraph [ref=f4e59]: Accel Management Group specializes in assessing client needs, generating strategic recommendations, and implementing high-value solutions. At Accel, you will work in small teams on client engagements with close Partner mentorship. This means that you will have the opportunity to grow your career by gaining first-hand experience working alongside well-established individuals who have decades of experience in management consulting.
          - paragraph [ref=f4e60]
          - paragraph [ref=f4e61]: We look forward to working with you. See below to explore our career opportunities, or reach out to careers@accelmg.com to learn more.
