            - generic [ref=f4e169]:
              - heading "Experienced HIRE" [level=2] [ref=f4e170]
              - generic [ref=f4e171]: Join Accel Management Group's growing Operations and Innovation practices and play a key role in shaping the future of top organizations. Whether you're leading complex supply chain transformations, driving operational excellence, or building innovation capabilities as a trusted advisor, you'll partner with Fortune 1000 companies to deliver transformative solutions that redefine how businesses operate, innovate, and grow in today’s competitive landscape.
              - link "see open positions - OPERATIONS" [ref=f4e173] [cursor=pointer]:
