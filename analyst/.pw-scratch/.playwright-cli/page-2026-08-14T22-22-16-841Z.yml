      - heading "Internships" [level=2] [ref=f1513e88]
      - figure [ref=f1513e91]:
        - img "Interns look at new art acquisitions in the artist studio" [ref=f1513e92]
      - paragraph [ref=f1513e93]: Launch your career in the arts — or explore a new field — through hands-on internship experiences. Although internships are offered across a variety of areas in the museum, roles are commonly found in education, photography and videography, design, branding, and curatorial affairs.
      - paragraph [ref=f1513e94]:
        - emphasis [ref=f1513e95]: If an internship is not posted above, there are currently no internships available.
      - heading "Comprehensive Employee Benefits*" [level=2] [ref=f1513e96]
      - paragraph [ref=f1513e97]: "Our benefits support your health, well-being, and future:"
      - list [ref=f1513e98]:
        - listitem [ref=f1513e99]: Health, Dental & Vision Coverage
        - listitem [ref=f1513e100]: Wellness & Life Insurance Programs
        - listitem [ref=f1513e101]: Flexible Spending Accounts (FSA)
        - listitem [ref=f1513e102]: Retirement Savings & Paid Time Off
        - listitem [ref=f1513e103]: Employee Perks & Museum Discounts
      - paragraph [ref=f1513e104]: "*Part-time benefits may vary."
      - heading "Values and culture" [level=2] [ref=f1513e105]
      - paragraph [ref=f1513e106]: "We’re guided by a mission that make the Nelson-Atkins a great place to work and thrive:"
      - list [ref=f1513e107]:
        - listitem [ref=f1513e108]:
          - strong [ref=f1513e109]: Respect
          - text: ": Every voice is valued."
      - list [ref=f1513e110]:
        - listitem [ref=f1513e111]:
          - strong [ref=f1513e112]: Collaboration
          - text: ": Creativity thrives across teams."
      - list [ref=f1513e113]:
        - listitem [ref=f1513e114]:
          - strong [ref=f1513e115]: Stewardship
          - text: ": We care for our guests and the art collections."
      - list [ref=f1513e116]:
        - listitem [ref=f1513e117]:
          - strong [ref=f1513e118]: Growth
          - text: ": We offer opportunities for professional and personal development."
      - paragraph
      - paragraph [ref=f1513e119]:
        - text: We’re proud to share that the Nelson-Atkins is WELL certified. That means our buildings meet a global standard that supports human health and well-being — through clean air and water, comfortable spaces, and thoughtful design that enhances the employee experience.
        - link "Read more about the museum’s WELL Certification." [ref=f1513e120] [cursor=pointer]:
          - /url: https://nelson-atkins.org/the-nelson-atkins-museum-of-art-awarded-prestigious-well-certification/
