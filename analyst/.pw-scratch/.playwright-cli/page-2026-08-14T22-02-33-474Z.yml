      - generic [ref=f948e79]:
        - paragraph [ref=f948e80]: Want to make a difference in the lives of 2.7 million people? Join the County and become part of a team that contributes to every facet of our community. Every year, County employees care for more than 20,000 homeless pets, dock more than 2,000 ships, recycle more than 5,000 tons of waste, treat hundreds of millions of gallons of water, operate more than 400,000 flights and so much more. From the roads we count on to the parks we enjoy, County employees make it all possible.
        - paragraph [ref=f948e81]: "As one of the state's largest employers, Miami-Dade County draws on a wide range of skills to build an inclusive and rewarding culture. But, of course, there’s more to working at the County than the satisfaction of public service. As a Miami-Dade County employee, you can expect:"
