        - article [ref=f417e99]:
          - generic [ref=f417e103]:
            - paragraph [ref=f417e104]:
              - text: The George W. Bush Presidential Library is part of the Presidential Libraries system, administered by the
              - link "National Archives and Records Administration" [ref=f417e105] [cursor=pointer]:
                - /url: https://www.archives.gov/
              - text: (NARA), a U.S. Federal agency. All Federal Government jobs are posted at
              - link "USAJOBS" [ref=f417e106] [cursor=pointer]:
                - /url: http://www.usajobs.gov/
              - text: .
            - figure "New archivists from the George W. Bush, William J. Clinton, George H.W. Bush, and Ronald Reagan Presidential Libraries attend a workshop about the Presidential Records Act." [ref=f417e107]:
              - article [ref=f417e108]
            - heading "Apply" [level=4] [ref=f417e111]
            - paragraph [ref=f417e112]:
              - text: All Federal Government jobs are posted at
              - link "USAJOBS" [ref=f417e113] [cursor=pointer]:
                - /url: http://www.usajobs.gov
              - text: . The Federal Government offers unique hiring paths to help hire individuals that represent our society.
            - heading "Federal Application Process" [level=4] [ref=f417e114]
            - paragraph [ref=f417e115]:
              - text: First, you need to create an account and complete your profile to apply to any job on
              - link "USAJOBS" [ref=f417e116] [cursor=pointer]:
                - /url: https://www.usajobs.gov/
              - text: . With a USAJOBS account and profile, you can save jobs, save and automate job searches, and manage everything you need to complete your application, including resumes and required documents.
            - heading "Veterans" [level=4] [ref=f417e117]
            - paragraph [ref=f417e118]:
              - text: The U.S. Federal Government has a long and outstanding record of employing veterans. Veterans have technical skills in areas of critical importance, and many also already have the security clearances required for some Federal positions.
              - link "Feds Hire Vets" [ref=f417e119] [cursor=pointer]:
                - /url: https://www.fedshirevets.gov/
              - text: is your single site for Federal employment information for Veterans, transitioning military service members, their families, and Federal hiring officials.
