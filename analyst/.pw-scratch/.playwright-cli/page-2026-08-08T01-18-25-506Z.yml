            - generic [ref=f78e78]:
              - heading "Find and Apply for City Jobs" [level=2] [ref=f78e79]
              - generic [ref=f78e80]:
                - heading "Join us!" [level=3] [ref=f78e81]
                - paragraph [ref=f78e82]
                - paragraph [ref=f78e83]: The City of Austin is committed to building a high-performing workforce and creating a work environment that is welcoming, respectful, safe, and productive—for our employees, their families, our departments, and the community we serve.
                - paragraph [ref=f78e84]:
                  - text: Learn more about the City of Austin’s
                  - link "guiding principles " [ref=f78e85] [cursor=pointer]:
                    - /url: https://drive.google.com/file/d/1IZz9u9jVXt1TYQoX-dkJfChzG4Ub_9AG/view?usp=drive_link
                  - text: and
                  - link "core competencies " [ref=f78e86] [cursor=pointer]:
                    - /url: https://docs.google.com/document/d/1wpwpXULniKf2U988HX-9nFsAfB78XzM4/edit?usp=sharing&ouid=100495855727423618447&rtpof=true&sd=true
                  - text: .
                - paragraph [ref=f78e87]: We are currently hiring for executive, management, professional, technical, skilled trades, administrative, public safety, and entry-level roles across full-time, part-time, temporary, seasonal, and internship opportunities.
                - paragraph [ref=f78e88]: You can filter your search by jobs, keywords, location, full/part-time, job category, and more. You may also use the “Introduce Yourself” link to provide your contact information, upload a resume, and select skills to be added to the City of Austin’s Talent Community.
                - heading "External applicants" [level=3] [ref=f78e89]
                - paragraph [ref=f78e90]: If you do not currently work for the City of Austin, search and apply for jobs using the link below. Further down this page, you’ll find several helpful resources, including an Application Guide designed to support a successful and well-informed application experience.
                - heading "EXTERNAL APPLICANTS ONLY:" [level=4] [ref=f78e91]
                - paragraph [ref=f78e92]:
                  - link "Search and apply for City jobs " [ref=f78e93] [cursor=pointer]:
                    - /url: https://austintexas.wd5.myworkdayjobs.com/COA_Careers
                - separator [ref=f78e94]
                - heading "Already work for the City?" [level=3] [ref=f78e95]
                - paragraph [ref=f78e96]: Current City of Austin employees are required to apply through the internal Workday Jobs Hub. Further down this page, you’ll find several helpful resources, including an Application Guide designed to support a successful and well-informed application experience.
                - heading "CURRENT EMPLOYEES ONLY:" [level=4] [ref=f78e97]
                - paragraph [ref=f78e98]:
                  - link "Search and apply for City jobs " [ref=f78e99] [cursor=pointer]:
                    - /url: https://wd5.myworkday.com/austintexas/d/inst/13102!CK5mGhEKBggDEMenAhIHCgUI1A0QPQ~~*__dVyMp4__o~/cacheable-task/2998$46522.htmld
                - heading "EXECUTIVE RECRUITMENTS:" [level=4] [ref=f78e100]
                - paragraph [ref=f78e101]:
                  - link "Executive Recruitments by 3rd Party" [ref=f78e102] [cursor=pointer]:
                    - /url: https://www.austintexas.gov/human-resources/programs/executive-level-recruitments
                - separator [ref=f78e103]
                - heading "Learn about City jobs, pay, and departments" [level=3] [ref=f78e104]
                - paragraph [ref=f78e105]: The City of Austin is committed to fair and transparent pay. Every position is carefully evaluated and classified based on its duties, responsibilities, and required qualifications. Our compensation system is designed to support equity, internal alignment, and career growth across a wide range of job families.
                - paragraph [ref=f78e106]:
                  - text: Want to learn more about where you might work? The City is made up of
                  - link "diverse departments" [ref=f78e107] [cursor=pointer]:
                    - /url: /departments
                  - text: that deliver essential services to our community—from public safety and parks to technology and transportation.
                - paragraph [ref=f78e108]:
                  - link "View job descriptions and pay scales" [ref=f78e109] [cursor=pointer]:
                    - /url: https://services.austintexas.gov/hr/jobdesc/job_title_pay.cfm
                - separator [ref=f78e110]
                - heading "Employee benefits" [level=3] [ref=f78e111]
                - paragraph [ref=f78e112]: The City of Austin offers a comprehensive benefits package designed to support the health, well-being, and financial security of our employees and their families. From medical and dental coverage to retirement plans, paid leave, and wellness programs, our benefits reflect our commitment to being an employer of choice.
                - paragraph [ref=f78e113]:
                  - link "Learn more about employee benefits" [ref=f78e114] [cursor=pointer]:
                    - /url: https://www.austintexas.gov/department/active-employee-benefits
