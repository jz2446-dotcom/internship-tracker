            - generic [ref=f78e194]:
              - generic [ref=f78e197]:
                - heading "Living in Austin" [level=2] [ref=f78e198]
                - paragraph [ref=f78e200]: There's a reason people love living in Austin! Learn more about what makes our City a great place to live and work.
              - list [ref=f78e202]:
                - listitem [ref=f78e203]:
                  - generic [ref=f78e204]:
                    - generic [ref=f78e205]: 
                    - generic [ref=f78e206]: Lifestyle and Attractions
                    - paragraph [ref=f78e208]: People in Austin enjoy the wide variety of what the city offers, including restaurants, museums, and nature trails, attending world-class arts, culture, and sporting events. As the "live music capital of the world," Austin serenades the community with live music on downtown streets at hundreds of venues.
                - listitem [ref=f78e209]:
                  - generic [ref=f78e210]:
                    - generic [ref=f78e211]: 
                    - generic [ref=f78e212]: Recreation and Outdoor Living
                    - paragraph [ref=f78e214]: Located at the edge of the Texas Hill Country – rolling terrain of limestone bluffs, springs, rivers, and lakes – Austin’s climate is ideal for year-round jogging, cycling, hiking on the city’s many trails, or swimming at Barton Springs Pool or one of the area’s many other swimming holes. Austin has something for everyone.
                - listitem [ref=f78e215]:
                  - generic [ref=f78e216]:
                    - generic [ref=f78e217]: 
                    - generic [ref=f78e218]: Growth and Economy
                    - paragraph [ref=f78e220]: Austin is thriving and is fueled by an influx of people and businesses, making Greater Austin one of the country's fastest-growing regions. Austin is currently the 13th largest city in the U.S. and is projected to be the 3rd largest metro in the U.S. by 2100. The city is home to many notable employers – including the City of Austin!
                - listitem [ref=f78e221]:
                  - generic [ref=f78e222]:
                    - generic [ref=f78e223]: 
                    - generic [ref=f78e224]: Recognition and Rankings
                    - paragraph [ref=f78e226]: "The City of Austin was recognized on the Forbes list of America’s Best Large Employers 2025, ranking fourth among local government employers and is the only government entity in Texas to make the list. Austin is ranked #9 in the U.S. and #1 in Texas for 2025–2026 on the U.S. News & World Report 150 Best Places to Live list. Austin is also ranked #9 for best place to find a job!"
                - listitem [ref=f78e227]:
                  - generic [ref=f78e228]:
                    - generic [ref=f78e229]: 
                    - generic [ref=f78e230]: Diversity and Inclusion
                    - paragraph [ref=f78e232]: Austin’s support of LGBTQ people who live and work in Austin led to the City scoring 100 points out of 100 on the 2024 Municipal Equality Index from the Human Rights Campaign.
                - listitem [ref=f78e233]:
                  - generic [ref=f78e234]:
                    - generic [ref=f78e235]: 
                    - generic [ref=f78e236]: Cultural Events and Global Presence
                    - paragraph [ref=f78e238]: Emerging as a player on the international scene, Austin is well known for its diverse events such as the Austin Food and Wine Festival, Rodeo Austin, South by Southwest, Austin City Limits, Urban Cultural Fest, Reggae Fest, Blues on the Green, Austin Pride Festival, Austin Trail of Lights, NASCAR, and Formula 1.
