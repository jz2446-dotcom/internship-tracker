            - heading "Apply for a City job" [level=1] [ref=f78e49]
            - paragraph [ref=f78e52]: Welcome! This is your starting point to find and apply to jobs with the City of Austin. Search current openings and discover why working for the City—today or in the future—could be right for you or someone you know. This page also provides helpful information about the City as an employer, insights into working for the City of Austin, and details on job fairs and related hiring events.
