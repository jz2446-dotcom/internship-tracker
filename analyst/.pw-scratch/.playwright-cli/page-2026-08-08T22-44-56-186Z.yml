                - definition [ref=f521e123]:
                  - paragraph [ref=f521e124]:
                    - text: Our diverse and inclusive workforce of more than 7,000 employees play a key role in the success of San José, the heart of the Silicon Valley. All City of San José employees work together as one team to make San José a vibrant, innovative, and desirable place to live and work. Visit
                    - strong [ref=f521e125]:
                      - link "here" [ref=f521e126] [cursor=pointer]:
                        - /url: https://www.sanjoseca.gov/your-government/departments-offices/office-of-the-city-manager/one-team
                    - text: to learn more about our One Team Leadership Values and Expectations, including quality and excellent customer service and
                    - strong [ref=f521e127]:
                      - link "here" [ref=f521e128] [cursor=pointer]:
                        - /url: https://www.sjeconomy.com/why-san-jose
                    - text: to learn more about San José.
                  - paragraph [ref=f521e129]:
                    - text: The City of San José is an equal opportunity employer. Applicants for all job openings will be considered without regard to age, race, color, religion, sex, national origin, sexual orientation, disability, veteran status or any other consideration made unlawful under any federal, state or local laws. The City of San José is committed to offering reasonable accommodations to job applicants with disabilities. If you need assistance or an accommodation due to a disability, please contact us at 408-535-1285, 711 (TTY), or via email at
                    - link "CityCareers@sanjoseca.gov" [ref=f521e132] [cursor=pointer]:
                      - /url: mailto:CityCareers@sanjoseca.gov
                    - text: .
              - generic [ref=f521e133]:
                - term [ref=f521e134]:
                  - heading "About the Department" [level=2] [ref=f521e135]
                - definition [ref=f521e136]:
                  - paragraph
                  - paragraph [ref=f521e137]: The City of San José innovates to provide exceptional civic services using advanced technologies to help our community thrive.
                  - paragraph [ref=f521e138]: As one of the largest cities in the nation, the City manages a large set of services and assets and operates on a budget of $5.5 billion, with approximately 7,000 employees, serving about 1 million residents and 80,000 businesses in the heart of Silicon Valley.
                  - paragraph [ref=f521e139]: The Information Technology Department’s (ITD) mission is to enrich the quality of life in San José through innovation, collaboration, and engagement. ITD enables that mission through business and infrastructure systems, cybersecurity, data management and analysis, responsible use of Artificial Intelligence (AI), productivity and collaboration tools, the San José 311 resident experience platform, data equity and privacy programs, and strategic planning. San José is powered by truly great people, a robust technology environment, and a strong sense of purpose.
                  - paragraph [ref=f521e140]: The IT department is a leader in innovation, embracing cutting-edge technologies and pioneering solutions to enhance efficiency and quality of life in San José. As part of this effort, the City leads a national initiative for AI through the GovAI Coalition, which was established to give local governments a voice in shaping the future of AI, ensuring it is developed responsibly for the public good.
                  - paragraph [ref=f521e141]: Promoting the City’s commitment to equity and inclusion, we believe that all members of the community, regardless of background, have access to the tools and resources needed to thrive in the digital age. San José is in the heart of Silicon Valley, which boasts a rich history in technology, education, and agriculture. Over half of San José residents speak a language other than English at home, highlighting the importance of language accessibility in all City services. By fostering inclusivity, promoting digital literacy, and building accessible platforms, we are advancing technology while creating a more equitable future for everyone.
                  - paragraph [ref=f521e142]:
                    - text: At the City of San José, we promote work-life alignment and a focus on growth to bring out the best in our people. Come join us in making San José the most vibrant, equitable, sustainable, and innovative city in the nation! Visit the
                    - link "Information Technology Department’s website" [ref=f521e143] [cursor=pointer]:
                      - /url: https://www.sanjoseca.gov/your-government/departments-offices/information-technology
                    - text: to learn about our culture, vision, leadership, and innovative initiatives.
                  - paragraph
                - term [ref=f521e144]:
                  - heading "Position Duties" [level=2] [ref=f521e145]
                - definition [ref=f521e146]:
                  - paragraph [ref=f521e147]:
                    - text: "The City of San José is seeking a Senior Front-End Mobile Application Developer to lead the design, development, and delivery of modern web and mobile applications for the San José 311 platform. This role will provide technical leadership for front-end architecture and mobile development, expand the City's internal application development capabilities, and deliver scalable, secure, and user-friendly digital services that improve access for all residents, particularly underserved communities. Key duties include, but are not limited to:"
                    - strong [ref=f521e148]: "Technical Leadership and Development:"
                    - text: •Lead the architecture, design, and development of the San José 311 web and mobile applications. •Establish and enforce front-end architecture, coding standards, and development best practices to ensure scalable, maintainable solutions. •Evaluate and adopt emerging technologies, frameworks, and tools to improve application performance, security, and development efficiency.•Participate in the full software development lifecycle, including solution design, development, testing, implementation, maintenance, and continuous enhancements.
                    - strong [ref=f521e149]: "Maintenance and Operation:"
                    - text: •Troubleshoot and resolve front-end application issues through root cause analysis, performance optimization, and secure coding practices. •Maintain React applications by managing framework upgrades, security patches, deployments, and adherence to coding and quality standards. •Optimize application performance and reliability through monitoring, secure API integrations, resilient error handling, and comprehensive testing.
                    - strong [ref=f521e150]: "Platform Management and Innovation:"
                    - text: •Collaborate with architects to align with enterprise standards and evaluate emerging technologies, including AI-driven capabilities, to promote innovation and continuous improvement.
                    - strong [ref=f521e151]: "Quality Assurance and Documentation:"
                    - text: •Define and enforce front-end testing strategies, including unit, integration, and end-to-end testing, to ensure high-quality, reliable applications. •Establish code quality standards through code reviews, test coverage, and collaboration with QA to identify and resolve defects. •Create and maintain technical documentation, including application architecture, API integrations, and development standards, to support knowledge sharing, maintainability, and compliance.
                    - strong [ref=f521e152]: "Stakeholder Coordination:"
                    - text: "•Build and maintain strategic partnerships with vendors and City departments to support reliable digital services and technology initiatives. •Collaborate with business and technical stakeholders to improve service delivery, operational efficiency, and customer experience. •Foster strong cross-functional relationships to drive continuous improvement, innovation, and successful technology outcomes.Please note that the Senior Mobile Front-End Developer (Enterprise Supervising Technology Analyst) position is currently eligible for a hybrid telework schedule (32 hours on site, 8 hours remote). The schedule for working remotely and onsite is subject to change.Salary Information: The final candidate’s qualifications and experience shall determine the actual salary. In addition to the starting salary, employees in the Enterprise Supervising Technology Analyst (ESTA) classification shall also receive an approximate five percent (5%) ongoing non-pensionable compensation pay.•Salary Range (including the 5% NPWI): $148,118.88 – $180,463.92"
                  - paragraph [ref=f521e153]:
                    - text: The
                    - link "ESTA classification" [ref=f521e154] [cursor=pointer]:
                      - /url: https://www.governmentjobs.com/careers/sanjoseca/classspecs/1553746
                    - text: is represented by the
                    - link "City Association of Management Personnel (CAMP)" [ref=f521e155] [cursor=pointer]:
                      - /url: https://www.sanjoseca.gov/your-government/departments-offices/office-of-the-city-manager/employee-relations/labor-relations-information/bargaining-units-labor-contract-info/camp
                    - text: bargaining unit.
                  - paragraph
                - term [ref=f521e156]:
                  - heading "Minimum Qualifications" [level=2] [ref=f521e157]
                - definition [ref=f521e158]:
                  - paragraph
                  - paragraph [ref=f521e159]:
                    - strong [ref=f521e160]: "Education and Experience:"
                    - text: A Bachelor’s Degree from an accredited college or university in a relevant field, AND four (4) years of progressively responsible professional/journey level experience, of which at least two (2) years of experience include technical work in development, implementation and maintenance of electronic business systems/solutions, or application development and/or support.
                  - paragraph [ref=f521e161]:
                    - strong [ref=f521e162]: "Acceptable Substitution:"
                  - list [ref=f521e163]:
                    - listitem [ref=f521e164]: Additional years of increasingly responsible, directly related work experience may be substituted for education on a year-for-year basis up to two (2) years.
                    - listitem [ref=f521e165]: Completion of a Master's Degree in a relevant field from an accredited college or university may be substituted for one (1) year of the required two (2) years of experience, which includes lead technical work in development, implementation, and maintenance of electronic business systems/solutions or application development and/or support.
                  - paragraph [ref=f521e166]:
                    - strong [ref=f521e167]: "Required Licensing (such as driver’s license, certifications, etc.):"
                  - list [ref=f521e168]:
                    - listitem [ref=f521e169]: Possession of a valid State of California driver’s license may be required.
                  - paragraph
                - term [ref=f521e170]:
                  - heading "Other Qualifications" [level=2] [ref=f521e171]
                - definition [ref=f521e172]:
                  - paragraph
                  - paragraph [ref=f521e173]: "The ideal candidates will possess the following competencies, as demonstrated in past and current employment history. Desirable competencies for this position include:"
                  - paragraph [ref=f521e174]:
                    - strong [ref=f521e175]: Job Expertise
                    - text: "– Demonstrates knowledge of and experience with applicable professional/technical principles and practices, Citywide and departmental procedures/policies and federal and state rules and regulations. The ideal candidate will also possess a combination of the following knowledge and experience:"
                  - list [ref=f521e176]:
                    - listitem [ref=f521e177]: Define and enforce front-end testing and code quality standards through automated testing, code reviews, and QA collaboration.
                    - listitem [ref=f521e178]: Create and maintain technical documentation, including application architecture and API integrations, to support maintainability, knowledge sharing, and compliance.
                    - listitem [ref=f521e179]: Experience developing responsive web and mobile applications using React frameworks, integrating RESTful and event-driven APIs, and implementing secure, scalable front-end architectures (OAuth2, JWT, CORS).
                  - paragraph [ref=f521e180]:
                    - strong [ref=f521e181]: Leadership
                    - text: – Leads by example; demonstrates high ethical standards; remains visible and approachable and interacts with others on a regular basis; promotes a cooperative work environment, allowing others to learn from mistakes; provides motivational supports and direction.
                  - paragraph [ref=f521e182]:
                    - strong [ref=f521e183]: Project Management
                    - text: – Ensures support for projects and implements agency goals and strategic objectives.
                  - paragraph [ref=f521e184]:
                    - strong [ref=f521e185]: Planning
                    - text: – Acts to align own unit's goals with the strategic direction of the organization; Defines tasks and milestones to achieve objectives, while ensuring the optimal use of resources to meet those objectives.
                  - paragraph [ref=f521e186]:
                    - strong [ref=f521e187]: Problem Solving
                    - text: – Approaches a situation or problem by defining the problem or issue; determines the significance of problem; collects information; uses logic and intuition to arrive at decisions or solutions to problems that achieve the desired outcome.
                  - paragraph [ref=f521e188]:
                    - strong [ref=f521e189]: Analytical Thinking
                    - text: – Approaching a problem or situation by using a logical, systematic, sequential approach.
                  - paragraph [ref=f521e190]:
                    - strong [ref=f521e191]: Teamwork and Interpersonal
                    - text: Skills – Develops effective relationships with co-workers and supervisors by helping others accomplish tasks and using collaboration and conflict resolution skills.
                  - paragraph [ref=f521e192]:
                    - strong [ref=f521e193]: Communication Skills
                    - text: – Effectively conveys information and expresses thoughts and facts clearly, orally and in writing; demonstrates effective use of listening skills; displays openness to other people’s ideas and thoughts.
                  - paragraph [ref=f521e194]:
                    - strong [ref=f521e195]: "Selection Process:"
                  - paragraph [ref=f521e196]: The selection process will consist of an evaluation of the applicant's training and experience based on the application and responses to all the job specific questions. You must answer all questions to be considered, or your application may be deemed incomplete and withheld from further consideration. Only those candidates whose backgrounds best match the position will be invited to proceed in the selection process. Additional phases of the selection process will consist of one or more interviews.
                  - paragraph [ref=f521e197]: If you have questions about the duties of these positions, the selection or hiring processes, please contact Felipa Perez at felipa.perez@sanjoseca.gov.
                  - paragraph
              - generic [ref=f521e198]:
                - term
                - definition [ref=f521e199]:
                  - paragraph [ref=f521e200]:
                    - strong [ref=f521e201]: "Additional Information:"
                  - paragraph [ref=f521e202]:
                    - strong [ref=f521e203]: "Employment Eligibility:"
                    - text: Federal law requires all employees to provide verification of their eligibility to work in this country. Please be informed that the City of San Jose will NOT sponsor, represent or sign any documents related to visa applications/transfers for H1-B or any other type of visa which requires an employer application.
                  - paragraph [ref=f521e204]: You must answer all job-specific questions to be considered for this vacancy or your application will be deemed incomplete and withheld from further consideration. Applicants are expected to write their own essays/responses.
                  - paragraph [ref=f521e205]:
                    - text: Please note that applications are currently
                    - strong [ref=f521e206]:
                      - emphasis [ref=f521e207]: not
                    - text: accepted through CalOpps or any other third party job board application system.
                  - paragraph [ref=f521e208]: This recruitment may be used to fill multiple positions in this, or other divisions or departments. If you are interested in employment in this classification, you should apply to ensure you are considered for additional opportunities that may utilize the applicants from this recruitment.
                  - paragraph [ref=f521e209]:
                    - text: Please allow adequate time to complete the application and submit before the deadline or the system may not save your application. If your online application was successfully submitted, you will receive an automatic confirmation email to the email address you provided. IF YOU DO NOT RECEIVE THE CONFIRMATION, please email
                    - link "CityCareers@sanjoseca.gov" [ref=f521e210] [cursor=pointer]:
                      - /url: mailto:CityCareers@sanjoseca.gov
                    - text: and we will research the status of your application.
                  - paragraph [ref=f521e211]:
                    - strong [ref=f521e212]: AI and the Hiring Process
                  - paragraph [ref=f521e213]:
                    - text: We recognize that Artificial Intelligence (AI) is becoming part of daily life and can be a valuable tool for learning, research, and professional growth. We encourage candidates to use AI responsibly as a support in preparing application materials, live assessments, and interviews. However,
                    - strong [ref=f521e214]: we value authenticity, accuracy and truthfulness.
                    - text: Application responses and interview answers must reflect your own knowledge, skills, and experiences. While AI can supplement preparation, it cannot replace the originality and judgment we look for in our employees. This ensures
                    - strong [ref=f521e215]: fairness, transparency, and equity
                    - text: for all applicants in the hiring process.
