                    - strong [ref=f479e247]: "VACANCY INFORMATION:"
                  - paragraph [ref=f479e248]: The current vacancies are to be filled within Office of Diversion and Reentry.
                  - paragraph [ref=f479e249]:
                    - strong [ref=f479e250]
                  - paragraph [ref=f479e251]:
                    - strong [ref=f479e252]: "AVAILABLE SHIFT:"
                  - paragraph [ref=f479e253]:
                    - text: Appointees may be required to work any shift, including evenings, nights, weekends, and holidays
                    - strong [ref=f479e254]: .
                  - paragraph [ref=f479e255]:
                    - strong [ref=f479e256]
                  - paragraph [ref=f479e257]:
                    - strong [ref=f479e258]: "APPLICATION & FILING INFORMATION:"
                  - paragraph [ref=f479e259]: Applications must be filed online only and will be reviewed for interview consideration on an ongoing basis. If you have not been contacted within 30 days and the recruitment remains open or reopens for filing, we encourage you to submit a new application. This will allow you to reaffirm your interest and update any relevant information.
                  - paragraph [ref=f479e260]: Many important notifications will be sent electronically to the email address provided on the application, so it is important that you provide a valid email address. Please add the following email addresses to the list of approved senders to prevent email notifications from being filtered as spam/junk/clutter mail.
                  - paragraph [ref=f479e261]:
                    - link "send an email to gmargosian@dhs.lacounyt.gov" [ref=f479e262] [cursor=pointer]:
                      - /url: mailto:gmargosian@dhs.lacounyt.gov
                      - strong [ref=f479e263]: cbobadilla2@dhs.lacounty.gov
                  - paragraph [ref=f479e264]:
                    - link [ref=f479e265] [cursor=pointer]:
                      - /url: mailto:noreply@governmentjobs.com
                      - strong [ref=f479e266]: noreply@governmentjobs.com
                    - strong [ref=f479e267]
                  - paragraph [ref=f479e268]:
                    - link [ref=f479e269] [cursor=pointer]:
                      - /url: mailto:info@governmentjobs.com
                      - strong [ref=f479e270]: info@governmentjobs.com
                  - paragraph [ref=f479e271]:
                    - strong [ref=f479e272]
                  - paragraph [ref=f479e273]: You may opt out of emails from LA County. If you unsubscribe, you will not receive email notifications for any examination you apply with Los Angeles County.
                  - paragraph [ref=f479e274]: Regardless of whether you choose to unsubscribe, you can always check for notifications by logging into governmentjobs.com and viewing your profile inbox, which saves a copy of all emailed notices.
                  - paragraph [ref=f479e275]:
                    - text: Plan to submit your online application in a timely manner, as you may be required to verify your email address. This only needs to be done once per email address, and if you already have a job seeker account on
                    - link "http://www.governmentjobs.com/careers/lacounty ," [ref=f479e276] [cursor=pointer]:
                      - /url: http://www.governmentjobs.com/careers/lacounty%20,
                    - text: you can verify at any time by logging in and following the prompts. This will enhance the security of your online application and ensure you do not enter an incorrect email address.
                  - paragraph [ref=f479e277]:
                    - strong [ref=f479e278]: "SOCIAL SECURITY NUMBER:"
                  - paragraph [ref=f479e279]: Please include your Social Security Number for record control purposes. Federal law requires that all employed persons have a Social Security Number.
                  - paragraph [ref=f479e280]:
                    - strong [ref=f479e281]: "COMPUTER AND INTERNET ACCESS AT PUBLIC LIBRARIES:"
                  - paragraph [ref=f479e282]: For candidates who may not have regular access to a computer or the internet, applications can be completed on computers at public libraries throughout Los Angeles County.
                  - paragraph [ref=f479e283]:
                    - strong [ref=f479e284]: "NO SHARING USER ID AND PASSWORD:"
                  - paragraph [ref=f479e285]: All applicants must file their applications online using their own user ID and password. Using a family member or friend's user ID and password may erase a candidate's original application record.
                  - paragraph [ref=f479e286]:
                    - strong [ref=f479e287]: "ANTI-RACISM, DIVERSITY, AND INCLUSION (ARDI):"
                  - paragraph [ref=f479e288]: The County of Los Angeles recognizes and affirms that all people are created equal and are entitled to all rights afforded by the Constitution of the United States. The Department of Human Resources is committed to promoting Anti-racism, Diversity, and Inclusion efforts to address the inequalities and disparities amongst races. We support the ARDI Strategic Plan and its goals by improving equality, diversity, and inclusion in recruitment, selection, and employment practices.
