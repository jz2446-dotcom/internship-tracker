                    - strong [ref=f479e305]: Employment Information
                  - paragraph [ref=f479e306]:
                    - strong [ref=f479e308]: Any language contained in the job posting supersedes any language contained below.
                  - paragraph [ref=f479e309]:
                    - text: This document is intended to provide general information about the recruitment process of the County of Los Angeles. Applicants with questions about a specific job posting should contact the exam analyst listed on the posting.
                    - strong [ref=f479e310]: "Equal Employment Opportunity/Non-Discrimination Statement:"
                    - text: "The County of Los Angeles is an Equal Employment Opportunity Employer and is committed to non-discrimination in the County workforce, regardless of age (40 and over); ancestry; color; ethnicity; religious creed; protected family or medical leave status; disability; marital status; medical condition; genetic information; military and veteran status; national origin; race ; sex; gender; sexual orientation; or any other characteristic protected by State or federal law. For more information, please visit:"
                    - link "https://employee.hr.lacounty.gov/eeo-programs/" [ref=f479e311] [cursor=pointer]:
                      - /url: https://employee.hr.lacounty.gov/eeo-programs/
                    - text: .
                  - paragraph [ref=f479e312]:
                    - strong [ref=f479e313]: "Testing Accommodations for Applicants:"
                    - text: "The County of Los Angeles complies with all federal and state disability laws and makes reasonable accommodations for qualified applicants and employees with disabilities. If a reasonable accommodation is needed to participate in the job application process, please contact the testing accommodation coordinator listed on the job posting. Hearing impaired applicants with telephone teletype equipment may leave messages by calling the teletype phone number on the job posting. For more information on accommodations, please visit:"
                    - link "https://hr.lacounty.gov/accessibility/" [ref=f479e314] [cursor=pointer]:
                      - /url: https://hr.lacounty.gov/accessibility/
                    - text: .
                  - paragraph [ref=f479e315]:
                    - strong [ref=f479e316]: "Fair Chance:"
                    - text: The County of Los Angeles is a Fair Chance employer. Except as otherwise permissible under applicable laws, you will not be asked to provide information about conviction history unless you receive a conditional offer of employment. The County will make an individualized assessment of whether your conviction history has a direct and adverse relationship with the specific duties of the job, and will also consider potential mitigating factors, which may include, but is not limited to, evidence and extent of rehabilitation, recency of the offense(s), and age at the time of the offense(s). If asked to provide information about conviction history, any convictions or court records which are exempted by a valid court order do not have to be disclosed. Qualified applicants with arrest or conviction records will be considered for employment in accordance with County Fair Chance Policies and the Fair Chance Act (Gov. Code Section 12952).
                  - paragraph [ref=f479e317]:
                    - strong [ref=f479e318]: "Employment Eligibility:"
                    - text: Final appointment is contingent upon verification of U.S. citizenship or the right to work in the United States.
                  - paragraph [ref=f479e319]:
                    - strong [ref=f479e320]: "Career PathFinder:"
                    - text: Resources to help current and prospective employees plan a career with Los Angeles County are available. To explore career paths to and from nearly all job titles, please visit our interactive Career PathFinder application at
                    - link "http://career-pathfinder.hr.lacounty.gov" [ref=f479e321] [cursor=pointer]:
                      - /url: http://career-pathfinder.hr.lacounty.gov
                    - text: .
                  - paragraph [ref=f479e322]
                  - paragraph [ref=f479e323]:
                    - strong [ref=f479e324]: "Veteran’s Credit:"
                    - text: "Pursuant to the County Charter and County policy, in all open competitive examinations (i.e., examinations open to everyone), the County of Los Angeles will add a credit of 10 percent of the total credits specified for such examination to the final passing score of an honorably discharged veteran, as well as the spouse of a deceased or disabled veteran, who served in the Armed Forces of the United States under specific conditions. For more information on veteran’s credit, please visit:"
                    - link "https://file.lacounty.gov/SDSInter/dhr/205102_PPG_115.pdf" [ref=f479e325] [cursor=pointer]:
                      - /url: https://file.lacounty.gov/SDSInter/dhr/205102_PPG_115.pdf
