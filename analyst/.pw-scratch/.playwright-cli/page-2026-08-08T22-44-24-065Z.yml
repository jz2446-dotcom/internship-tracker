                    - strong [ref=f479e227]: We do not accept password-protected documents
                    - text: . Ensure documents are unlocked before attaching to your application or sending to the exam analyst.
                  - generic [ref=f479e228]: "**Experience at the level of Los Angeles County's class of Accountant II is defined as performing a full range of professional accounting and auditing work in the preparation, analysis, review, maintenance, reconciliation and control of financial records and fiscal revenue and expenditures forecasting."
                  - generic [ref=f479e230]: "*** Experience at the level of Los Angeles County's class of Accountant-Auditor is defined as assisting in conducting management, performance, financial, and compliance audits and other studies of County departments and contract providers."
