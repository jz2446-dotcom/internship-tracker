                  - paragraph [ref=f479e126]:
                    - text: OPEN COMPETITIVE JOB OPPORTUNITY -
                    - strong [ref=f479e127]: EMERGENCY
                  - paragraph [ref=f479e128]: This opportunity is open to everyone. Applicants from all backgrounds and organizations are welcome to apply. Were looking for the best talent to join our team.
                  - generic [ref=f479e130]:
                    - strong [ref=f479e132]: EXAM
                    - strong [ref=f479e134]: NUMBER
                  - paragraph [ref=f479e135]: Y0648A-EA
                  - paragraph [ref=f479e136]
                  - strong [ref=f479e138]: APPLICATION FILING DATE
                  - paragraph [ref=f479e139]: February 05, 2026, AT 12:00 PM, (PT)
                  - paragraph [ref=f479e140]:
                    - strong [ref=f479e141]: APPLICATION DEADLINE
                  - paragraph [ref=f479e142]: We will continue accepting applications until we determine it is no longer necessary. We may close the application filing window without prior notice.
                  - paragraph [ref=f479e143]:
                    - strong [ref=f479e144]:
                      - generic [ref=f479e145]: NO OUT-OF-CLASS EXPERIENCE OR WITHHOLDS ARE ALLOWED FOR THIS EXAMINATION.
                  - generic [ref=f479e146]:
                    - text: The LA County Board of Supervisors recently
                    - link "declared a local state of emergency for homelessness" [ref=f479e147] [cursor=pointer]:
                      - /url: https://file.lacounty.gov/SDSInter/bos/supdocs/176661.pdf
                    - link "(Download PDF reader)" [ref=f479e148] [cursor=pointer]:
                      - /url: https://get.adobe.com/reader/
                    - text: ", and the County is working to revise and expand our response to help all who are affected. We are looking for qualified and passionate individuals to help us in the mission of addressing issues like housing, mental health, and substance use. If you are looking for a new career that will directly benefit the population of LA County, this may be the opportunity for you."
                  - generic [ref=f479e149]: Department of Health Services Office of Diversion and Reentry seeks qualified candidates to fill emergency Accountant III vacancies related to the homelessness crisis.
                  - paragraph [ref=f479e151]: Under the emergency order, applicants who meet the requirements may be hired for an initial period of up to 90 days, with an opportunity for permanent County employment.
                  - paragraph [ref=f479e152]: During your initial work period, you will be assessed on your work performance. This assessment will be weighted 100%.
                  - paragraph [ref=f479e153]: Those who successfully pass the assessment will be considered for permanent appointment to Accountant III in Health Services Office of Diversion and Reentry.
                  - paragraph [ref=f479e154]:
                    - strong [ref=f479e155]: Why
                    - strong [ref=f479e156]: Join
                    - strong [ref=f479e157]: the
                    - strong [ref=f479e158]: LA
                    - strong [ref=f479e159]: County
                    - strong [ref=f479e160]: Department
                    - strong [ref=f479e161]: of
                    - strong [ref=f479e162]: Health
                    - strong [ref=f479e163]: Services?
                  - paragraph [ref=f479e164]: The Los Angeles County Department of Health Services (DHS) is the second-largest municipal health system in the nation. Through its integrated system of 25 health centers, four acute hospitals, and an expanded network of community partner clinics – DHS annually provides direct care for 500,000 unique patients, employs over 23,000 staff, and has an annual budget of over $8.4 billion.
                  - paragraph [ref=f479e165]: Through academic affiliations with the University of California, Los Angeles (UCLA), the University of Southern California (USC), and the Charles R. Drew University of Medicine and Science (CDU), DHS hospitals are training sites for physicians completing their Graduate Medical Education in nearly every medical specialty and subspecialty. In addition to its direct clinical services, DHS also runs the Emergency Medical Services (EMS) Agency and the County's 911 emergency response system, as well as the Office of Diversion and Re-entry, each with a critical role in connecting vulnerable populations, including those released from correctional and institutional settings to supportive housing.
                  - text: For additional information regarding DHS please visit
                  - link "https://www.dhs.lacounty.gov" [ref=f479e166] [cursor=pointer]:
                    - /url: https://www.dhs.lacounty.gov
                  - text: .
                  - strong [ref=f479e167]: "OUR MISSION:"
                  - paragraph [ref=f479e168]:
                    - text: To advance the health of our patients and our communities by providing extraordinary care
                    - strong [ref=f479e169]: .
                  - paragraph [ref=f479e170]
                  - paragraph [ref=f479e171]:
                    - strong [ref=f479e172]: "DEFINITION:"
                  - paragraph [ref=f479e173]: Performs a full range of professional accounting and auditing work in the preparation, analysis, review, maintenance, reconciliation and control of financial records and fiscal revenue and expenditures forecasting.
                  - paragraph [ref=f479e174]
                  - paragraph [ref=f479e175]:
                    - strong [ref=f479e176]: "CLASSIFICATION STANDARDS:"
                  - paragraph [ref=f479e177]: Positions allocable to this class work under the direction of a higher-level accounting or administrative supervisor or manager. Employees in this class supervise accounting staff and/or perform highly complex responsible professional work in general accounting and related fiscal management areas in accordance with Generally Accepted Accounting Principles (GAAP) and the Governmental Accounting Standards Board (GASB). Employees in this class must have a professional, comprehensive knowledge of the theories, practices, methods, and techniques of accounting and auditing; and organizational program practices, policies, and functions sufficient to analyze accounting systems, or to modify and adapt conventional accounting and analytical techniques to solve a variety of accounting or auditing problems.
                  - paragraph
                - term [ref=f479e178]:
                  - heading "Essential Job Functions" [level=2] [ref=f479e179]
                - definition [ref=f479e180]:
                  - paragraph
                  - paragraph [ref=f479e181]:
                    - strong [ref=f479e182]: What You'll Be Doing
                  - list [ref=f479e184]:
                    - listitem [ref=f479e185]: Supervises a section or unit of professional lower-level accountants and other technical and clerical accounting staff engaged in the full range of accounting activities.
                    - listitem [ref=f479e186]: Reviews and performs a variety of the more difficult staff, systems, cost, revenue, and expenditure accounting assignments.
                    - listitem [ref=f479e187]: Advises and consults with management concerning the accounting and financial implications of existing and projected department activities.
                    - listitem [ref=f479e188]: Compiles and evaluates complex operating statements, final accountings of construction or other projects, and claims for reimbursement from other government agencies or private contractors.
                    - listitem [ref=f479e189]: Reviews and prepares complex balance sheets, statements of income, fund balance statements, cost accounting reports, revenue and expenditure estimates, and other specialized financial reports.
                    - listitem [ref=f479e190]: Compiles revenue and expenditure reports and prepares periodic financial statements of Federal and State grants for review.
                    - listitem [ref=f479e191]: Participates in the formulation or modification of audit plans of grant operated agencies, business firms, charitable and nonprofit organizations or other government agencies.
                    - listitem [ref=f479e192]: Conducts and oversees complex audits and writes summaries of findings and recommendations. Discusses audit findings with management and implements approved audit recommendations.
                    - listitem [ref=f479e193]: Supervises and monitors the development of improvements in internal controls or accounting practices. May serve as the department Internal Control Certification Program (ICCP) coordinator.
                    - listitem [ref=f479e194]: Serves as staff consultant to County departments and other government agencies in coordinating accounting procedures to ensure County accounting controls.
                    - listitem [ref=f479e195]: Supervises or performs complex cost surveys, revenue and expenditure analysis, and accounting systems and procedural studies. Recommends and monitors implementation of complex systems and procedures.
                    - listitem [ref=f479e196]: Analyzes and provides accounting procedural and technical recommendations on legislation affecting County and department accounting activities and recommends methods for implementing changes mandated by new legislation.
                  - paragraph
                - term [ref=f479e197]:
                  - heading "Requirements" [level=2] [ref=f479e198]
                - definition [ref=f479e199]:
                  - paragraph
                  - paragraph [ref=f479e200]:
                    - strong [ref=f479e201]: "We are looking for dedicated individuals who possess:"
                  - paragraph [ref=f479e202]:
                    - strong [ref=f479e203]
                    - text: 21 semester or 32 quarter units of accounting from an accredited college or university including at least two courses in advanced accounting subjects* such as auditing, cost accounting, or governmental accounting.
                  - paragraph [ref=f479e204]:
                    - strong [ref=f479e205]: "-AND-"
                  - paragraph [ref=f479e206]: Two years of technical accounting experience at the level of Los Angeles County's class of Accountant II**, Accountant-Auditor***, or higher.
                  - generic [ref=f479e207]:
                    - text: You
                    - strong [ref=f479e208]: MUST
                    - text: meet the above requirement(s) in order to be appointed to fill any vacancies related to this recruitment.
                  - paragraph [ref=f479e209]:
                    - strong [ref=f479e210]: "LICENSE:"
                  - paragraph [ref=f479e211]: A valid California Class C Driver's License or the ability to utilize an alternative method of transportation when needed to carry out job-related essential functions.
                  - paragraph [ref=f479e212]:
                    - strong [ref=f479e213]:
                      - generic [ref=f479e214]: "PHYSICAL CLASS II - Light:"
                  - paragraph [ref=f479e215]: This class includes administrative and clerical positions requiring light physical effort, which may include occasional light lifting to a 10-pound limit and some bending, stooping, or squatting. Considerable ambulation may be involved.
                  - strong [ref=f479e218]: SPECIAL
