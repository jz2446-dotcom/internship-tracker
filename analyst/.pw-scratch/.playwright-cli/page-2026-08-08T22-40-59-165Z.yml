                  - strong [ref=f337e70]: at least the past ten (10) years of work history
                  - text: on your application. If you do not have ten (10) years of work history, list all prior work experience.
                - listitem [ref=f337e71]: Be sure to thoroughly answer all supplemental questions in order to receive appropriate credit. Applications may not be processed if incomplete.
              - paragraph [ref=f337e72]
              - paragraph [ref=f337e73]:
