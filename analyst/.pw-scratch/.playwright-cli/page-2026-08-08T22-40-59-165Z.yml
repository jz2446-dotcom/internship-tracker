              - paragraph [ref=f337e61]
              - paragraph [ref=f337e62]: "To submit an application for a position:"
              - paragraph [ref=f337e63]
              - list [ref=f337e64]:
                - listitem [ref=f337e65]: Find the job you’re interested in and click on the “Job Title” link to view the Job Description!
                - listitem [ref=f337e66]: After viewing the Job Description, select the "Apply" tab.
                - listitem [ref=f337e67]: "If this is the first time you are applying using the NeoGov application process you will need to create an account and select a Username and Password. Please Note: If you have already created a NeoGov account you do not have to create a new account. Your existing user name and password, as well as your saved profile, can be used to access our new system"
                - listitem [ref=f337e68]: After your account has been established, you can import your resume from LinkedIn, upload it from a word file, or manually enter your personal information.
                - listitem [ref=f337e69]:
