                  - strong [ref=f221e104]: CBRE -
                  - strong [ref=f221e105]: Internship Programs
                - paragraph [ref=f221e106]:
                  - strong [ref=f221e107]: "CBRE Intership Programs:"
                - list [ref=f221e108]:
                  - listitem [ref=f221e109]: 8-10 week full-time paid
                  - listitem [ref=f221e110]: internship experience.
                  - listitem [ref=f221e111]: Connect with CBRE leaders
                  - listitem [ref=f221e112]: Learn from the industry’s best through a series of executive webinars
                  - listitem [ref=f221e113]: Gain insight from our high performing teams
                  - listitem [ref=f221e114]: Present a capstone project at the end of the summer to demonstrate your capabilities Social and networking events
                  - listitem [ref=f221e115]: Prospective full-time job offer
                - paragraph [ref=f221e116]:
                  - strong [ref=f221e117]: "What you need to be considered:"
                - list [ref=f221e118]:
                  - listitem [ref=f221e119]: Pursuing a degree in Finance, Real Estate, Economics, Business, Accounting, Computer Science or similar (depending on program)
                  - listitem [ref=f221e120]: Strong interest in real estate, numbers, and/or analysis
                - paragraph [ref=f221e121]:
                  - strong [ref=f221e122]: National Sales Internship Program
                - paragraph [ref=f221e123]:
                  - strong [ref=f221e124]: HIRING
                - paragraph [ref=f221e125]: "Candidates selected via rigorous three-step process:"
                - paragraph [ref=f221e126]: 1. Resume screen2. Video screening interview3. In-person/virtual final interview
                - paragraph [ref=f221e127]:
                  - strong [ref=f221e128]: TRAINING & DEVELOPMENT
                - list [ref=f221e129]:
                  - listitem [ref=f221e130]: Learn & improve
                  - listitem [ref=f221e131]: upon professional skills
                  - listitem [ref=f221e132]: Meet CBRE and other industry professionals
                  - listitem [ref=f221e133]: Blend self-paced online learning & in-person training
                  - listitem [ref=f221e134]: Performance evaluations
                  - listitem [ref=f221e135]: Final project/presentations
                - paragraph [ref=f221e136]:
                  - strong [ref=f221e137]: MENTORING & CONNECTIVITY
                - list [ref=f221e138]:
                  - listitem [ref=f221e139]: Support network of supervisors, mentors, buddies
                  - listitem [ref=f221e140]: Networking opportunities at intern-specific events
                  - listitem [ref=f221e141]: Executive Leadership speaker series (weekly!)
                  - listitem [ref=f221e142]: Annual Intern Volunteer Day
                - paragraph [ref=f221e143]:
                  - strong [ref=f221e144]: How It Works
                - paragraph [ref=f221e145]:
                  - strong [ref=f221e146]: "Duration:"
                - list [ref=f221e147]:
                  - listitem [ref=f221e148]: 8 weeks, early June – early August
                - paragraph [ref=f221e149]:
                  - strong [ref=f221e150]: "Location:"
                - list [ref=f221e151]:
                  - listitem [ref=f221e152]: Dallas, Houston, Los Angeles, Atlanta, Chicago, Phoenix, DC, San Diego, etc.
                - paragraph [ref=f221e153]:
                  - strong [ref=f221e154]: "Eligibility:"
                - paragraph [ref=f221e155]: Juniors & seniors + advanced degree candidates also eligible
                - paragraph [ref=f221e156]:
                  - strong [ref=f221e157]: "Majors:"
                - paragraph [ref=f221e158]: Business, Econ, Urban Planning, Finance, Real Estate
                - paragraph [ref=f221e159]:
                  - strong [ref=f221e160]: CBRE - Summer Internship Program Timeline
                - list [ref=f221e161]:
                  - listitem [ref=f221e162]:
                    - strong [ref=f221e163]: Sept-Oct
                    - list [ref=f221e164]:
                      - listitem [ref=f221e165]: Applications open late Sept/early Oct
                      - listitem [ref=f221e166]: CBRE visits universities
                  - listitem [ref=f221e167]:
