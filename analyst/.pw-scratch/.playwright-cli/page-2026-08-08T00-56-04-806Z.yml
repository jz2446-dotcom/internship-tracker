                - paragraph [ref=f221e186]:
                  - strong [ref=f221e187]: CBRE’s - Available Internship Programs
                - paragraph [ref=f221e188]: https://www.cbre.com/careers/st udents-and-graduates
                - paragraph [ref=f221e189]:
                  - strong [ref=f221e190]: Capital Markets
                - paragraph [ref=f221e191]: The Capital Markets Academy is an educational program designed to provide a comprehensive understanding of the interconnectivity of the various components of the real estate capital markets.
                - paragraph [ref=f221e192]:
                  - strong [ref=f221e193]: Digital & Technology
                - paragraph [ref=f221e194]: "D&T interns work in- person each summer at our state-of-the-art facility in Richardson, Texas. Interns are placed with a team that aligns with their career goals and interest, in one of five areas of focus: Software Engineering, Cybersecurity, UX Design & Research, Product Management, or Data Science/Data Analytics."
                - paragraph [ref=f221e195]:
                  - strong [ref=f221e196]: GWS MBA Summer Associate Program
                - paragraph [ref=f221e197]: We are the perfect place for MBAs with an interest in real estate, consulting, and business analytics to grow and excel. The MBA Summer Associate Program is a full-time, paid program that provides MBA and MS in Real Estate students with an in-depth introduction to CBRE’s Real Estate Outsourcing Services business and the diverse range of global career opportunities available therein.
                - paragraph [ref=f221e198]:
                  - strong [ref=f221e199]: Finance
                - paragraph [ref=f221e200]: Our Finance Internship accelerates your learning and development by providing you with a strong foundation upon which to build your finance career in the commercial real estate industry. This 9-week summer intern program will introduce you to our company, our fast-paced industry and our world-class professionals
                - paragraph [ref=f221e201]:
                  - strong [ref=f221e202]: NEXT STEPS
                - list [ref=f221e203]:
                  - listitem [ref=f221e204]: Join our Talent Community now to submit your resume early. Will give you a head start in the interview process.
                  - listitem [ref=f221e205]: Start building a network within CBRE. Reach out to folks on LinkedIn and ask for 15 – 30 minutes of their time.
                - paragraph [ref=f221e206]:
                  - strong [ref=f221e207]: "Let’s Stay in Touch:"
                - list [ref=f221e208]:
                  - listitem [ref=f221e209]: Internship Program Application deadline will be mid-end November.
