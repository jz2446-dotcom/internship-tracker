      - heading "Notes" [level=3] [ref=f1242e225]
      - list [ref=f1242e226]:
        - listitem [ref=f1242e227]: "Five of the letters in the English Alphabet are vowels: A, E, I, O, U."
        - listitem [ref=f1242e228]: "The remaining 21 letters are consonants: B, C, D, F, G, H, J, K, L, M, N, P, Q, R, S, T, V, X, Z, and usually W and Y. Written English includes the digraphs: ch ci ck gh ng ph qu rh sc sh th ti wh wr zh. These are not considered separate letters of the alphabet."
        - listitem [ref=f1242e229]: Two letters, “A” and “I,” also constitute words.
        - listitem [ref=f1242e230]: Until fairly recently (until 1835), the 27th letter of the alphabet (right after "z") was the ampersand (&).
        - listitem [ref=f1242e231]: The English Alphabet is based on the Latin script, which is the basic set of letters common to the various alphabets originating from the classical Latin alphabet.
      - heading "Old English" [level=3] [ref=f1242e232]
      - list [ref=f1242e233]:
        - listitem [ref=f1242e234]: "The Old English alphabet letters were 29: A B C D E F G H I K L M N O P Q R S T V X Y Z & ⁊ Ƿ Þ Ð Æ"
        - listitem [ref=f1242e235]: "The Old English alphabet was recorded in the year 1011 by a monk named Byrhtferð and included the 24 letters of the Latin alphabet (including ampersand) and 5 additional English letters: Long S (ſ), Eth (Ð and ð), Thorn (þ), Wynn (ƿ) and Ash (ᚫ; later Æ and æ)."
        - listitem [ref=f1242e236]: With respect to Modern English, Old English did not include J, U, and W.
