              - paragraph [ref=f717e226]: It's one thing to attract top talent, but it’s another to retain them. We know that highly-valued talent seeks a sense of autonomy and belonging, as well as feeling rewarded for the results they achieve. Professional growth is embedded in Realty Income’s culture. That’s why we are dedicated to providing our colleagues with purpose, connection, and opportunity–and why we see an average tenure of approximately five years at the company.
