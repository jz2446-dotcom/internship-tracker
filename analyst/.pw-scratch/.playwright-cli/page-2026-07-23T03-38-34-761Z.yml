              - paragraph [ref=f717e209]: At Realty Income, how we act matters as much as what we achieve. Guided by our One Team values, we foster an inclusive culture, act with integrity, and give more than we take. Our commitment to social responsibility extends beyond the workplace—supporting community partnerships, encouraging employee engagement, and promoting a culture of respect, empowerment, and shared purpose in everything we do.
