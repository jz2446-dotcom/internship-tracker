            - generic [ref=f91e112]:
              - figure [ref=f91e115]:
                - img "Staff member pushing a book truck" [ref=f91e120]
              - heading "Current Openings" [level=2] [ref=f91e123]
              - paragraph [ref=f91e127]:
                - strong [ref=f91e129]: Programs & Partnerships Administrator (Library Adult Services Manager)
              - paragraph [ref=f91e130]:
                - generic [ref=f91e131]: Dallas Public Library is seeking an experienced library manager to join its senior leadership team and help shape the future of one of the nation’s largest public library systems.
              - paragraph [ref=f91e132]
              - paragraph [ref=f91e134]:
                - generic [ref=f91e135]: The Programs & Partnerships Administrator will lead systemwide efforts in public programming, community partnerships, outreach, volunteer services and budget management. This position plays a key role in advancing the library's strategic priorities while ensuring programs and partnerships reflect the evolving interests and needs of Dallas residents.
              - paragraph [ref=f91e136]
              - paragraph [ref=f91e138]:
                - generic [ref=f91e139]: Leading a team of seven, the administrator will oversee the development and evaluation of public programs across the library system, reviewing proposals, recommending improvements and managing program funding. The role also provides strategic direction for volunteer services and community engagement initiatives.
              - paragraph [ref=f91e140]
              - paragraph [ref=f91e142]:
                - generic [ref=f91e143]: "Current priorities for this position include:"
              - list [ref=f91e144]:
                - listitem [level=1] [ref=f91e145]:
                  - paragraph [ref=f91e146]:
                    - generic [ref=f91e147]: Developing programming standards for Flagship Branches.
                - listitem [level=1] [ref=f91e148]:
                  - paragraph [ref=f91e149]:
                    - generic [ref=f91e150]: Activating the downtown Central Library through strategic programming.
                - listitem [level=1] [ref=f91e151]:
                  - paragraph [ref=f91e152]:
                    - generic [ref=f91e153]: Establishing best practices for outreach and community engagement across the system.
              - paragraph [ref=f91e154]:
                - generic [ref=f91e155]: As a member of the library's administrative team, the Programs & Partnerships Administrator will help shape organizational strategy by participating in policy development, planning and organizational evaluation. The individual will also represent the library at citywide meetings and community events.
              - paragraph [ref=f91e156]
              - paragraph [ref=f91e158]:
                - strong [ref=f91e160]: This position will also serve as a rotating Administrator-on-Call.
              - paragraph [ref=f91e161]:
                - strong [ref=f91e163]
              - paragraph [ref=f91e164]:
                - generic [ref=f91e165]:
                  - strong [ref=f91e166]:
                    - emphasis [ref=f91e167]: Please note
                  - emphasis [ref=f91e168]: that the official City of Dallas job title for this position is Library Adult Service Manager. The working title is Programs & Partnerships Administrator. The official job description is accurately reflected.
              - paragraph [ref=f91e171]:
                - generic [ref=f91e172]: "To apply, visit:"
