  - generic [ref=f214e46]:
    - heading [level=4] [ref=f214e47]:
      - strong [ref=f214e48]: Careers
    - paragraph [ref=f214e49]: Centerview Partners prides itself on being an environment perfectly suited to develop and nourish talent
  - generic [ref=f214e52]:
    - generic [ref=f214e54]:
      - button "Apply Now" [ref=f214e55] [cursor=pointer]
      - paragraph
      - paragraph [ref=f214e56]: Centerview Partners is committed to the success of the companies it works with, and believes this commitment provides meaningful rewards to the people of Centerview. By creating opportunities to advance rapidly while always preserving our reputation in the marketplace and in our community, Centerview Partners has established itself as a leader even among the most prestigious global financial advisory firms.
      - paragraph [ref=f214e57]
      - paragraph [ref=f214e58]: "Centerview is consistently ranked the top investment bank to work for in Vault.com’s annual survey, having been voted #1 for an unprecedented six years in a row."
      - paragraph [ref=f214e59]
      - paragraph [ref=f214e60]: Selection Process
      - paragraph [ref=f214e61]
      - paragraph [ref=f214e62]: We believe in bringing on the most talented people and offering them the opportunity for a long-term career at Centerview. We offer a summer internship to college juniors, and hire full-time analysts who start after college graduation. We recruit formally on a number of undergraduate campuses, as well as informally from a broad range of schools, for both our summer analyst class and for full-time analysts, and also recruit through the marketplace for full-time analysts. Additionally, we formally recruit summer and full-time associates (and more senior hires) from graduate business programs. We are open to candidates from all schools and academic disciplines, from throughout the marketplace, and with various work experiences.
      - paragraph [ref=f214e63]
      - paragraph [ref=f214e64]: Our approach to talent selection is focused on offering high-caliber people the opportunity for long-term career development at Centerview. We appreciate that many of the most talented professionals in our industry started with limited, if any, skillsets and financial analysis tools and had limited or no exposure to the finance and advisory profession. This knowledge can be taught to anyone starting with only passion and drive. While many other firms in investment banking believe that the inverse is true, and look to recruit professionals who come to them “fully formed,” Centerview has had great success developing colleagues from many backgrounds.
      - paragraph [ref=f214e65]
      - paragraph [ref=f214e66]: Just as our approach to client relationships takes a long-term perspective, so too does our approach to developing our bankers over the course of their career. We like to say, “Bankers at Centerview Partners are made, not born.”
      - paragraph [ref=f214e67]
      - paragraph [ref=f214e68]: Career Progression
      - paragraph [ref=f214e69]
      - paragraph [ref=f214e70]:
        - generic [ref=f214e71]: Unlike many other investment banking firms, our hope is that our analysts will choose to stay with us beyond their analyst years, and, as a result, we commit additional resources to provide an analyst experience that is head-and-shoulders above traditional two-year programs. Similarly, with associate hires, we strive to provide a long-term career path.Once analysts and associates have joined the firm, we provide initial training that is focused on taking individuals with high levels of intellectual curiosity and diligence, providing them with a solid foundation in practical finance, and then bringing them onto our teams to begin learning the skills they will need to be among the top-tier of business professionals as their careers progress. We offer continuing educational programs as well to supplement skills learned on the job, and movement within our firm as well.
      - paragraph [ref=f214e72]
      - paragraph [ref=f214e73]: At Centerview Partners, we believe that diversity is critical in helping us provide the best advice to our clients. As such, we work actively to foster an environment that is supportive and inclusive of a wide range of backgrounds and experiences.
      - paragraph [ref=f214e74]
      - paragraph [ref=f214e75]: Additionally, we provide a number of resources that are open to all colleagues, including our Women’s Leadership Program, Veterans group, First Generation group and many others. We offer programming through these groups to enrich our entire firm, as well as to expand Centerview’s opportunities in various communities. We also regularly host firmwide events with leading figures to discuss topics ranging from geopolitics to healthcare to art, in furtherance of developing balanced, worldly professionals.
      - paragraph [ref=f214e76]
      - paragraph [ref=f214e77]: Next Steps
      - paragraph [ref=f214e78]
      - paragraph [ref=f214e79]: "We are always excited to hear from qualified applicants, and invite you to submit your resumé using the button above. Should your resumé meet our current needs, we will be in touch with you. Otherwise, we will keep it on file and reach out should our needs change. Please note: Applications for multiple offices will not be reviewed. Additionally, we kindly ask that you please not send unsolicited emails to multiple people at the firm."
      - paragraph [ref=f214e80]
      - paragraph
      - paragraph [ref=f214e81]
