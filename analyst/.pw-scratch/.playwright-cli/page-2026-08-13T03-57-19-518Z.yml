        - heading "Safer communities. Lower costs. Protecting kids." [level=1] [ref=f287e21]
        - paragraph [ref=f287e22]:
          - text: I’m
          - strong [ref=f287e24]: Dennis Hannon
          - text: ". I’m running for NY-26 because the issues we face stopped being theoretical for me and became personal. I grew up blue-collar, working in my dad’s construction business, and I learned early that nobody is coming to save you. You work, you provide, you take care of your family. Then I became a parent, and I watched powerful institutions try to push my child toward irreversible medical decisions without real transparency, without real safeguards, and with life-altering consequences. I had to fight for my own kid the way any parent would and I realized if it can happen to my family, it can happen to yours. So I’m stepping up - not because I’ve always wanted a title, but because I can’t stay on the sidelines. I’m running to put working families first again: safer streets, lower costs you can feel, and common-sense protections that keep kids safe and let parents be heard. I believe in problem solving, not self-serving political pandering or rhetoric."
