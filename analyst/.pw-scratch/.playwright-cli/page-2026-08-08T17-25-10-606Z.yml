        - heading "Job Description" [level=3] [ref=f51e30]
        - text: Financial Analyst, FP&A - TERP (Summer Intern)
        - paragraph
        - text: "Location: New York, NY"
        - paragraph
        - text: As a portfolio company of Brookfield Renewable U.S., TerraForm Power ("TERP") is an owner and operator of over 4,100 MW renewable power portfolio including solar and wind assets in North America and Western Europe. These premier assets are underpinned by long-term contracts that produce stable cash flow.
        - paragraph
        - text: TERP attracts high-performing individuals who are driven to make an impact in a fast-paced and collaborative environment. We encourage collaboration across all levels of experience to promote learning, generate best ideas, and deliver quality results, with the aim for growth and career development. We offer unparalleled opportunity to lead and manage one of the largest renewable energy businesses with decades of history, while contributing to the global need for sustainable energy.
        - paragraph
        - text: Reporting to the Senior Manager, Financial Planning and Analysis, the incumbent will be responsible for providing analysis and insights into the business results for management reporting purposes. This position presents a challenging opportunity to participate in a growth-oriented organization and to gain exposure and understanding of the energy industry.
        - paragraph
        - text: Responsibilities
        - paragraph
        - list [ref=f51e31]:
          - listitem [ref=f51e32]: Actively participate in the annual budgeting process, including coordination with various stakeholders across the organization, the consolidation and analysis of budgets and the preparation of management reports and presentations;
          - listitem [ref=f51e33]: Actively participate in the monthly forecasting process, including coordination with various stakeholders across the organization, the consolidation and analysis of forecasts and the preparation of management reports and presentations comparing to the budget, prior year and prior forecast;
          - listitem [ref=f51e34]: Prepare various types of financial analyses using key performance indicators specific to the renewable energy industry;
          - listitem [ref=f51e35]: Assist with the integration of newly acquired or developed assets into the reporting framework;
          - listitem [ref=f51e36]: Develop and manage analytical tools and processes to improve the quality and transparency of financial performance reporting and to facilitate ad hoc reporting;
          - listitem [ref=f51e37]: Participate in process improvement initiatives, ensuring process changes are appropriately implemented, documented and communicated;
          - listitem [ref=f51e38]: Provide support to the Senior Manager, FP&A in various related activities and projects.
        - paragraph
        - text: Requirements
        - paragraph
        - list [ref=f51e39]:
          - listitem [ref=f51e40]: Demonstrated ability to draw insights from information and convey complex information in a straightforward manner;
          - listitem [ref=f51e41]: Strong written and oral communication skills to convey technical accounting and financial performance in a clear and concise manner;
          - listitem [ref=f51e42]: Excellent interpersonal and teamwork skills; ability to work with and build relationships with a diverse group at all levels of the organization;
          - listitem [ref=f51e43]: Strong time management skills and an ability to multi-task;
          - listitem [ref=f51e44]: Strong attention to detail; working in a conscientious, consistent and thorough manner;
          - listitem [ref=f51e45]: Enthusiastic and proactive approach to problem solving.
        - paragraph
        - text: Qualifications
        - paragraph
        - list [ref=f51e46]:
          - listitem [ref=f51e47]: Working toward a degree in finance or other related discipline; working towards a professional designation (CPA or CFA) is considered an asset;
          - listitem [ref=f51e48]: Self-motivated with demonstrated initiative;
          - listitem [ref=f51e49]: Knowledge of IFRS and US GAAP is considered an asset;
          - listitem [ref=f51e50]: Knowledge or exposure to Sarbanes-Oxley (SOX) or internal controls is an asset;
          - listitem [ref=f51e51]: Proficiency in MS Office Suite, particularly in Excel (including XLOOKUP's, SUM and IF formulas, pivot tables, etc.) and PowerPoint
          - listitem [ref=f51e52]: Ability to work in a dynamic, complex and fast-paced environment, to adapt quickly and to manage changing priorities;
          - listitem [ref=f51e53]: Knowledge of the energy business is considered an asset.
        - paragraph
        - text: $25 per hour
        - heading "Job Tags" [level=3] [ref=f51e54]
        - text: Hourly pay,
