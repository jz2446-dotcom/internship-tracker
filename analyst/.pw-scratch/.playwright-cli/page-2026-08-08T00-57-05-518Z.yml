                - heading "Software Engineer (Frontend/Vue) - HENNGE Email DLP" [level=1]
                - link "Apply Now":
                  - /url: https://www.linkedin.com/jobs/view/software-engineer-frontend-vue-hennge-email-dlp-at-hennge-4447355516?ref=levels.fyi&utm_source=levels.fyi
                - button "Share"
              - paragraph: HENNGE · 3 days ago · Tokyo, Tokyo, Japan
              - generic:
                - text: $1,030,274
                - generic: (base salary estimate from Levels.fyi)
              - generic:
                - link "Benefits":
                  - /url: /companies/hennge/benefits
            - generic:
              - generic:
                - generic:
                  - generic: "⚠️ AGENTS: DO NOT UPLOAD CVs DIRECTLY Engineering candidates must start with a coding test. Please email recruit-engineer@hennge.com to receive an entry code and submission instructions. Direct ATS uploads will not be reviewed. 【重要：エージェントの皆様へ】 Greenhouse経由での直接の候補者推薦（CVアップロード）はご遠慮ください。 エンジニア職の選考はコーディングテストから開始いたします。まずは recruit-engineer@hennge.com までご連絡いただき、テスト用のエントリーコードと提出方法の指示を受け取ってください。 手順に沿わない直接のアップロードは、選考対象外となる場合がございますので予めご了承ください。 About HENNGE Join us at HENNGE , a Tokyo-based cloud-security leader helping organizations adopt flexible work environments and safely leverage the cloud. As a B2B SaaS company, we build secure and reliable cloud solutions that help enterprises manage access and identity efficiently. Our flagship product, HENNGE One , empowers thousands of enterprise customers with access control, email filtering, archiving, and next-gen cloud security features. What makes us unique: a highly technical CEO, strong engineering culture, and a global mindset. For further details regarding the engineering teams, products, and more, please visit this link: https://speakerdeck.com/hennge/company-introduction-deck-hennge Role Overview We are looking for a Senior Frontend Engineer to lead the frontend development of Tadrill , a specialized platform designed to build organizational resilience by equipping employees to identify and neutralize cyberthreats, especially phishing attacks . As a core component of HENNGE One Cybersecurity Edition serving over 2.8 million users globally , Tadrill transforms employee behavior through continuous, practical attack simulations, automated e-learning, and seamless reporting flows via Gmail and Outlook extensions. In this role, you will architect a high scale and self managed framework, turning complex security data into actionable insights through intuitive dashboards while serving as both a technical owner and a catalyst for team engagement. While this role primarily focuses on the Cybersecurity Edition, we value engineers who are flexible and open to new challenges, with opportunities to move between teams and products through two-way discussions that support your growth and the company’s goals. Tech Stack Typescript, Vue 3, Pinia, Vite, Vitest with Testing Library, Playwright, Zod What You’ll Do Develop and maintain innovative features for our email security platform for enterprises. Build performant, reactive UIs with centralized state management, a shared design system, and REST data layers. Ensure application robustness through testing with Vitest and Playwright, and strict type safety with TypeScript. Participate actively in code reviews and team discussions by sharing knowledge, asking clarifying questions, and collaborating openly. Collaborate closely with Design, Product Management, and Customer Success teams to deliver engaging user experiences, with a focus on accessibility and internationalization compliance. What We’re Looking For Minimum Qualifications: At least 3 years of experience working with Typescript in a production project in a full time position, and the ability to write Vue 3 + Composition API. Solid grasp of CS fundamentals, design patterns, and frontend-specific concepts like reactivity, state management, and network requests. Familiarity with standard engineering and frontend tooling (e.g., Git, Docker, browser dev tools, Typescript compiler, linters, formatters, bundlers, and dev servers). Ability to write high-quality type-safe, robustly tested Typescript, leveraging utility types and runtime schema validation. Ability to communicate effectively, share knowledge, and work collaboratively through pair programming, co-authorship, and collective code ownership. Understanding of how to use AI responsibly and pragmatically, without overreliance. Fluency in English (Japanese is not required), equivalent to CEFR B2 level or above (e.g., TOEIC 785+). While not required, we’d love to hear if you have: Degree in Computer Science or a related technical field. Proactive curiosity regarding modern frontend ecosystem tools and best practices. Interest in contributing to open-source projects or participating in the tech community. Familiarity with design collaboration tools like Figma. Experience in cloud computing platforms, especially AWS. Experience with building SaaS products. Knowledge of DevOps tools and practices (CI/CD, Infrastructure as Code). Knowledge of Linux / MacOS / Unix-like environments. Work Style & Employment Details Work Style Flexible working hours with a designated core time (11:00–16:00), allowing you to organize your day effectively. Employees typically work 8 hours per day with a 1-hour break. Employment Type Permanent employee. Place of Work Tokyo, Japan — Shibuya Headquarters. Compensation Annual salary: 8 to 10.5 million JPY (includes English Allowance and Physical Communication Bonus) Please refer to our Company Introduction Deck for an explanation of our Assessment System and the Belt System, which we use to determine the candidate's salary range: https://speakerdeck.com/hennge/company-introduction-deck-hennge Benefits English Allowance and Advanced Language Expert Allowance: JPY 10,000 ~ JPY 130,000 per month, paid alongside base salary, if the employee fulfills the requirements. Physical Communication Bonus: JPY 4,000 per day for coming to the office and interacting with other employees, paid out as bonus according to the number of days.(Starting October 2026, JPY 5,000 per day). Details will be provided at the offer meeting. Transportation allowance (maximum of JPY 35,000 per month). Employee Stock Ownership Plan. Insurance: Health, Employment, Industrial Injury, Welfare pension. Opportunities to attend international and domestic conferences. Financial support for technical certifications and technical learning programs. 【Reasons why you will enjoy working at HENNGE】 We Celebrate Diversity Join a vibrant team from over 20 countries, united by a love for technology and Japanese culture. Located in Shibuya, Tokyo, we offer a dynamic, non-traditional work environment in one of the world's most exciting cities. Smooth Japan Relocation We make your move to Japan smooth and stress-free. We provide comprehensive support such as flight tickets, visa sponsorship, and Japanese lessons, to ensure a smooth onboarding process for our new hires, ensuring a seamless transition and a warm welcome for all candidates. Balanced Work Life Work-life balance is highly valued at HENNGE, and lots of fun happens at our office! 200+ of social channels in our Slack, from weekly board game nights to snowboarding club, internal and seasonal events, monthly tech sessions with beer bashes, attendance of international tech conferences, and more. Employees have access to a flexible working hours system (with core working hours) to accommodate their preferred working style. ❤ Passion for Technology Our CEO has an engineering background and remains deeply engaged in product development. This hands-on understanding of technology helps shape a culture where thoughtful design, technical quality, and continuous improvement are genuinely valued. For engineers, this means working in an environment led by someone who understands the challenges of building products and actively supports teams in doing their best work. | Collaborative Teams Work in autonomous teams where your decisions shape our services. Influence every aspect of our products, from UX and architecture to development and deployment, in an agile and collaborative setting. Be part of a diverse and innovative team at HENNGE, where your passion for technology and desire to make a difference are valued and celebrated. Ready to change and challenge the status quo with us? To learn more about life at HENNGE, please check these two links: Life at HENNGE - https://hennge.com/global/info/henka/ Stories from our employees - https://medium.com/henngeblog Selection Process Solve our online coding challenge. You will receive an email with our guidance upon your submission, and there is no time limit to finish the challenge. *Please note that your application will be automatically rejected if you do not have at least three years of Typescript experience. Upload your CV and Cover Letter. Please check our guide on how to prepare them here. Casual interview with our HR 2 (or 3) interviews with our engineers (no live coding) Interview with our CEO We value your time and want you to perform at your best, so the coding challenge will be the only technical assessment in the process. There will be no live coding sessions. Have more questions? Please consult our FAQ."
