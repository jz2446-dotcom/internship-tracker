          - heading "Impactful Projects" [level=3] [ref=f80e160]
          - paragraph [ref=f80e161]: Interns work on real projects – that have real impact. Projects are relevant to the intern’s academic and career goals – and are absolutely resume worthy.
        - generic [ref=f80e162]:
