          - text: ", Vista Equity Partners"
      - generic [ref=f308e191]:
        - heading "\"We know our strength in the market depends on the strength of our people. We apply an engineering mindset to the full process from recruiting, training, mentoring and coaching to unlock our collective potential.\"" [level=3] [ref=f308e192]
        - paragraph [ref=f308e193]: Rachel Arnold, Senior Managing Director, Vista Equity Partners
      - generic [ref=f308e195]:
        - heading "\"Vista has a “who’s up next?” approach, rather than a “wait your turn” mentality. We actively seek out opportunities for our more junior team members to get involved, take on new challenges and grow professionally.\"" [level=3] [ref=f308e196]
        - paragraph [ref=f308e197]: Brooke Nakatsukasa, Vice President, Vista Equity Partners
      - generic [ref=f308e199]:
        - heading "\"We hold ourselves to an uncompromising standard of excellence and provide continuous coaching and professional development opportunities that empower individuals to become their best selves.\"" [level=3] [ref=f308e200]
