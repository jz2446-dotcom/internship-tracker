      - paragraph [ref=f440e28]:
        - text: The American Antiquarian Society (AAS) is a national research library of American history and culture before 1900 which has been sharing American stories for more than two hundred years. Founded in 1812 by Revolutionary War patriot and printer
        - link "Isaiah Thomas" [ref=f440e29] [cursor=pointer]:
          - /url: https://www.americanantiquarian.org/isaiah-thomas
        - text: ", the American Antiquarian Society is both a learned society and a major independent research library located in Worcester, Massachusetts. The AAS library today houses the largest and most accessible collection of"
        - link "books, pamphlets" [ref=f440e30] [cursor=pointer]:
          - /url: https://www.americanantiquarian.org/books-and-pamphlets
        - text: ", broadsides,"
        - link "newspapers, periodicals" [ref=f440e31] [cursor=pointer]:
