        - text: ", music, and"
        - link "graphic arts" [ref=f440e33] [cursor=pointer]:
          - /url: https://www.americanantiquarian.org/graphic-arts
        - text: material printed before 1900 in what is now the United States, as well as
        - link "manuscripts" [ref=f440e34] [cursor=pointer]:
          - /url: https://www.americanantiquarian.org/manuscripts
        - text: and a substantial collection of secondary texts, bibliographies, and digital resources and reference works related to all aspects of American history and culture before the twentieth century.
