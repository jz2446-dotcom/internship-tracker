        - paragraph [ref=f530e173]: "one.com is a humanistic and value-driven company. We bring our full selves to work, so we can be who we are, and contribute our uniqueness towards company culture and business.Building inclusion and belonging means for us to respect each other’s differences – visible and invisible, such as opinions and ways of being – whilst appreciating them. With an ambition to capitalise on the benefits of working with a team formed by diverse backgrounds and perspectives serving a diverse customer pool, we believe we need to integrate I&B work in three dimensions: Employees; Customers and Society."
