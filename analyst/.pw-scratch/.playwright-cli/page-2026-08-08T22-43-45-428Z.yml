                  - strong [ref=f473e189]: for application best practices and tips
                - generic [ref=f473e190]:
                  - text: Invitations to interview will be based upon an assessment of education and experience. Final candidates may be required to complete a drug test that may include testing for cannabis and/or a criminal background check.
