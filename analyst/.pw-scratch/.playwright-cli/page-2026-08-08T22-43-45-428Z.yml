              - definition [ref=f473e124]:
                - paragraph [ref=f473e125]:
                  - text: The Hennepin County Sheriff’s Office (HCSO) is looking to hire an Adult Education Instructor. This position will deliver educational services to Public Safety Facility (PSF) residents who do not have their General Education Development (GED) or high school diploma.
                  - generic [ref=f473e126]:
                    - emphasis [ref=f473e127]:
                      - text: Current Hennepin County employees who refer a candidate hired into an open competitive position may be eligible for a
                      - strong [ref=f473e128]: $500
                    - text: referral bonus. For more information visit
                  - link [ref=f473e130] [cursor=pointer]:
                    - /url: https://www.hennepin.us/jobs/employee-referral-program
                    - emphasis [ref=f473e131]: employee referral program
                  - generic [ref=f473e132]:
                    - text: .
                    - emphasis [ref=f473e133]
                    - text: Find us
                  - strong [ref=f473e135]:
                    - link "here" [ref=f473e136] [cursor=pointer]:
                      - /url: https://hennepin.attract.neogov.com/hennepin-county-careers-hT/p/hennepincountycareerfairs
                  - generic [ref=f473e137]:
                    - strong [ref=f473e138]
                    - text: at upcoming career fairs.
                  - strong [ref=f473e139]: "Location and hours:"
                - generic [ref=f473e140]: This position is located at the Hennepin County PSF, at 401 South 4th Avenue, Minneapolis, MN 55415. Work hours are Monday through Friday from 7:30 a.m. to 4 p.m. The Hennepin County PSF is a pre-trial detention facility located in downtown Minneapolis. New Employee Orientation (NEO) for all new benefit-earning employees is in-person in downtown Minneapolis. Details about NEO will be provided upon hire.
                - strong [ref=f473e142]: "About this position type:"
                - generic [ref=f473e143]: This is a limited duration (temporary), full-time, benefit earning position expected to last up to two years.
                - text: This position is internally classified as an Adult Education Instructor.Click
                - link "here" [ref=f473e144] [cursor=pointer]:
                  - /url: https://www.governmentjobs.com/careers/hennepin/classspecs/48591?keywords=adult%20education&pagetype=classSpecifications
                - text: to view the job classification specification.
                - strong [ref=f473e146]: "In this position, you will:"
                - list [ref=f473e147]:
                  - listitem [ref=f473e148]: Prepare, develop, and provide Adult Basic Education coursework in a one-room schoolhouse environment to adult correctional residents based on individual student needs.
                  - listitem [ref=f473e149]: Provide small group and 1:1 instruction; individualized reading, writing, math, science, and social studies instruction aligned with GED and College and Career Readiness Standards.
                  - listitem [ref=f473e150]: Analyze residents' education needs, assist in developing educational goals, and provide individual educational plans by means of a variety of assessment techniques, evaluations, and interpretations.
                  - listitem [ref=f473e151]: Assist residents in planning for continuing education for after their release.
                  - listitem [ref=f473e152]: Administer pre and post testing according to schedule.
                  - listitem [ref=f473e153]: Maintain a safe and secure learning environment.
                  - listitem [ref=f473e154]: Understand and respect cultural differences in a classroom setting including providing culturally appropriate services.
                - strong [ref=f473e155]: "Need to have:"
                - list [ref=f473e156]:
                  - listitem [ref=f473e157]:
                    - text: Bachelor's degree or higher in education or related field
                    - strong [ref=f473e158]: and
                    - text: two or more years teaching or training adults.
                  - listitem [ref=f473e159]:
                    - text: Licensed as a teacher in the State of Minnesota.
                    - strong
                - strong [ref=f473e160]: "Nice to have:"
                - list [ref=f473e161]:
                  - listitem [ref=f473e162]:
                    - text: "Experience:"
                    - list [ref=f473e163]:
                      - listitem [ref=f473e164]: Teaching adults who are in the process of obtaining their GED, while applying College and Career Readiness (CCR) Standards and Minnesota Adult Education policy in your instruction.
                      - listitem [ref=f473e165]: Administering standardized assessments such as TABE and CASAS and entering data into and generating reports from Minnesota SiD database.
                      - listitem [ref=f473e166]: Preparing lesson plans and implementing individual and small group instruction.
                      - listitem [ref=f473e167]: Developing Adult Education curriculum, differentiating instruction to meet diverse learner needs as well as modifying instruction for students with disabilities.
                      - listitem [ref=f473e168]: "Teaching in these content areas: science, math, social studies, language arts and/or computer literacy."
                      - listitem [ref=f473e169]: Teaching students preparing for a High School Equivalency test (like the GED test).
                      - listitem [ref=f473e170]: Working with clients from culturally diverse backgrounds and/or working with students in a correctional setting.
                  - listitem [ref=f473e171]: Current Tier 3 or Tier 4 Teaching License licensure to be a teacher in the State of Minnesota.
                  - listitem [ref=f473e172]: Knowledge of College and Career Readiness (CCR) Standards and Minnesota Adult Education policy.
                  - listitem [ref=f473e173]: Advanced Proficiency in computer applications including Microsoft Word, Excel, and Outlook or another comparable program.
                  - listitem [ref=f473e174]:
                    - generic [ref=f473e175]: Demonstrates exceptional organizational skills.
                  - listitem [ref=f473e176]: Ability to work independently and communicate effectively both verbally and in writing.
                - generic [ref=f473e177]:
                  - strong [ref=f473e178]: About the department
                  - text: ":"
                - generic [ref=f473e179]: "The Hennepin County Sheriff's Office serves the county's 1.2 million residents. State law mandates most of the sheriff's office duties, including managing the county jail, providing security to the district court, and patrolling the waterways in the county.The Sheriff's Office also runs specialized initiatives like Criminal Information Sharing and Analysis (CISA), Violent Offender Task Force (VOTF), Crime Scene Investigation, Criminal Investigation, Community Outreach and Employee Wellness. The mission of the Hennepin County Sheriff's Office is: Providing quality professional services while building meaningful relationships that are sustainable within our communities, and with our partners, to ensure justice and safety for all."
                - strong [ref=f473e181]: "About Hennepin County:"
                - generic [ref=f473e182]:
                  - text: Hennepin is the largest county government organization in Minnesota. Our employees work every day to improve the health, safety and quality of life for our residents and communities. All of our jobs align with our mission to serve residents through transformative services that eliminate disparities, eliminate inequities, and create opportunity for all and our vision of a community where all people are healthy, all people are valued, and all people thrive. Our employees receive a combination of competitive benefits and positive workplace culture not found at other organizations. This includes meaningful work that impacts our community, competitive pay, work-life balance, a variety of benefits and opportunities to grow. Learn more at
                  - link "The Bridge" [ref=f473e183] [cursor=pointer]:
                    - /url: https://bridge.hennepin.us/
                  - text: (login as Guest).Hennepin County envisions an organization where our commitment to diversity and the elimination of disparities is fundamental in providing excellent service to our community.Your future. Made here.This posting may be used to fill current and future vacancies.
                  - strong [ref=f473e185]: Watch this
