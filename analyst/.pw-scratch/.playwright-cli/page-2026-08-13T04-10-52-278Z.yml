      - generic [ref=f944e192]:
        - generic [ref=f944e194] [cursor=pointer]:
          - link "logo 金諭餐飲 金諭餐飲·餐飲業 金諭餐飲集團 和記海鮮小館 （老舖新開） 招聘啟事 📢 老舖新開·高新急聘！和記海鮮小館重磅回歸，誠邀各路精英加入，共創佳績！ 本館為老字號海鮮餐廳，憑藉新鮮食材、地道口味深耕本地多年，現老店升級重新開業，業務擴張急需補充團隊，待遇從優、福利齊全，誠摯歡迎有熱情、有經驗的你前來應聘！ 一、急聘崗位及要求 1. 服務員（多名） • 男女不限，形象端正、熱情有禮，有餐飲服務經驗者優先； • 服從管理，認真負責，能熟練使用普通話、粵語者優先； • 有團隊合作精神，能適應餐飲行業工作節奏。 2. 廚師（多名，含海鮮專崗） • 有2年以上餐廚工作經驗，熟悉海鮮處理、粵式小炒者優先； • 講究衛生，服從廚房管理，能高效完成菜品製作，保證口味穩定； • 能承受廚房工作強度，有責任心，無不良嗜好。 3. 收銀員（2名） • 男女不限，形象端莊，熟練操作收銀系統； • 細心謹慎，有良好的溝通能力和服務意識，有收銀經驗者優先； • 熟悉基本電腦操作，責任心強，無財務違規記錄。 4. 雜工/洗碗工（多名） • 能吃苦耐勞，服從工作安排； • 負責餐廳衛生、餐具清洗、食材整理等工作，講究衛生； • 為人踏實誠懇，能長期穩定工作者優先。 二、薪酬福利（高新優待） • 薪資待遇：服務員18000-22000元/月，廚師20000-40000元/月（根據經驗定薪），收銀員20000-25000元/月，雜工/洗碗工25000-35000元/月； • 福利保障：每月休息4天、法定節假日加班加薪、節日福利、員工餐、工服免費提供； • 晉升空間：老舖新開，團隊擴張，提供清晰晉升通道，表現優異者可晉升為店長、廚師長； • 額外獎勵：每月業績獎、優秀員工獎，節假日紅包。 以上所有崗位亦可時薪：70-200/小時 🔥 老舖新機遇，高新不等人！和記海鮮小館期待與你攜手，共築美味事業，誠邀你的加入！" [ref=f944e195]:
