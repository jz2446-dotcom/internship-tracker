                - text: At least 1 letter of recommendation sent from the recommender directly to
                - strong [ref=e189]: internships@moma.org
              - listitem [ref=e190]:
                - text: "2 Essays submitted as an attachment to the online application. Each essay should be no longer than 500 words. The two prompts are as follows:"
                - list [ref=e191]:
                  - listitem [ref=e192]: Why are you interested in participating in an internship at The Museum of Modern Art?
                  - listitem [ref=e193]: Discuss one of the following:a) What is the role of museums, and how do you envision their potential for evolution?b) Describe an individual or an experience that has influenced your perception of the arts.
