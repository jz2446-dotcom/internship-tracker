            - paragraph [ref=e129]
            - heading "About the Summer Internship Program" [level=3] [ref=e130]
            - paragraph [ref=e131]: The Summer Internship Program provides undergraduate and graduate students and beginning professionals with practical experience in a specific area of museum work at The Museum of Modern Art. Interns participate in weekly professional development activities designed to increase understanding of the Museum’s various collections, exhibitions, and departments. The Museum hosts approximately 25 interns in various departments across our institution. Participants may arrange for academic credit through their school, but it is not a requirement.
            - paragraph [ref=e132]
            - heading "How to Apply" [level=3] [ref=e133]
            - paragraph [ref=e134]:
              - strong [ref=e135]: "For detailed information and instruction how to apply please visit:"
            - paragraph [ref=e136]:
              - link [ref=e137] [cursor=pointer]:
                - /url: https://www.moma.org/about/careers/internships/
                - strong [ref=e139]: internships page
              - text: and
              - link "our job board" [ref=e141] [cursor=pointer]:
                - /url: https://recruiting.ultipro.com/MUS1002MOMA/JobBoard/9dbfa465-a36a-46c3-b31e-4929830ab266/?q=&o=postedDateDesc&f5=UZ1ohl_aRESJgcSlIQiU4w
            - paragraph [ref=e142]
            - paragraph [ref=e143]
            - separator [ref=e144]
            - heading "12-Month internship opportunity" [level=3] [ref=e145]
            - paragraph [ref=e146]: "MoMA offers full-time, 12-month internships with stipends for recent college graduates interested in pursuing a career in the arts and museum-related fields. Focused departmental training is integrated with monthly activities and a lecture series designed for interns to receive greater exposure to the museum as a whole. The program is complemented with financial provisions for interns to create a research trip related to their fields of interest. The Museum is accepting applications for the following programs:"
            - list [ref=e147]:
              - listitem [ref=e148]:
                - strong [ref=e149]: Painting & Sculpture Internship
              - listitem [ref=e150]:
                - strong [ref=e151]: Photography Internship
              - listitem [ref=e152]:
                - strong [ref=e153]: Louise Bourgeois, Drawings and Prints Internship
              - listitem [ref=e154]:
                - strong [ref=e155]: Architecture & Design Internship
              - listitem [ref=e156]:
                - strong [ref=e157]: Family Programs Internship
              - listitem [ref=e158]:
                - strong [ref=e159]: Black Arts Council, Media & Performance Internship
            - paragraph [ref=e160]
            - paragraph [ref=e161]:
              - strong [ref=e162]: Eligibility
              - text: Recent graduates of bachelor’s or master’s degree programs. The Museum encourages candidates from diverse backgrounds and academic disciplines to apply. International candidates are eligible to apply.
            - paragraph [ref=e163]
            - paragraph [ref=e164]:
              - strong [ref=e165]: Placement
              - text: Each Intern will be placed into a different department based on areas of interest and experience. Applicants will be asked to list a preference during the application process but candidates may be considered for departments other than their first preference. Below are some of the participating departments. Additional departments may be added.
            - list [ref=e166]:
              - listitem [ref=e167]: Photography
              - listitem [ref=e168]: Drawings & Prints
              - listitem [ref=e169]: Department of Learning and Engagement
              - listitem [ref=e170]: Office of the Director
              - listitem [ref=e171]: Architecture & Design
