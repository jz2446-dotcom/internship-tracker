            - paragraph [ref=e181]: "The following items are required as part of your application:"
            - list [ref=e182]:
              - listitem [ref=e183]:
                - list [ref=e184]:
                  - listitem [ref=e185]: Completed online application through MoMA’s Recruiting Portal
            - list [ref=e186]:
