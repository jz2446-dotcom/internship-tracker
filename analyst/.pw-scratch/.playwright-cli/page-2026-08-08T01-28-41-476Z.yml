            - paragraph [ref=e207]:
              - strong [ref=e208]: "Equal Employment Opportunity Policy Statement:"
              - text: Equal Employment Opportunity has been, and will continue to be, a fundamental principle at the Museum, where employment is based upon personal capabilities and qualifications without discrimination because of race, color, religion, sex, age, national origin, disability, pregnancy, genetic information, military or veteran status, sexual orientation, gender, gender identity or expression, marital and civil partnership/union status, alienage or citizenship status, creed, genetic predisposition or carrier status, unemployment status, familial status, domestic violence, sexual violence or stalking victim status, caregiver status, arrest or conviction record to the extent required by applicable law, credit history, or any other protected category as established by applicable law, including the New York City Human Rights Law (“NYCHRL”).
