            - paragraph [ref=e202]
            - heading "MoMA PS1 Internship Program" [level=2] [ref=e203]
            - paragraph [ref=e204]: MoMA PS1 offers blended internships with onsite and remote opportunities for undergraduate and graduate students and beginning professionals with practical experience in a specific area of museum work. Our internship program provides the opportunity to learn about the operations of a non-profit art institution and work alongside some of the world’s most exciting contemporary artists and curators. In addition to departmental work interns participate in weekly professional development activities designed to increase understanding of the Museum’s various programs, exhibitions, and departments.
