              - blockquote [ref=f107e159]: One of the key things that I find most attractive about Evercore is the training program and the apprenticeship model. Senior bankers really take the time to guide and mentor junior bankers. It’s on-hand experience, you are always pushed to succeed, and I think it really strives to create talented investment bankers.
              - generic [ref=f107e160]:
