            - row [ref=f78e102]:
              - cell "HTTP request header" [ref=f78e103]
              - cell "Our portal provider, Avature, collects the type of browser you are using, the operating system of your device, and the pages you visit from HTTP request headers and associates this data to the IP address of your device to analyze use of the portal." [ref=f78e104]
      - article [ref=f78e105]:
        - heading "Marketing" [level=4] [ref=f78e108]
        - table [ref=f78e110]:
          - rowgroup [ref=f78e111]:
            - row [ref=f78e112]:
              - columnheader "Name" [ref=f78e113]
              - columnheader "Description" [ref=f78e114]
          - rowgroup [ref=f78e115]:
            - row [ref=f78e116]:
              - cell "Appcast pixel appcast_session appcast_visitor appcast_job_ad" [ref=f78e117]
              - cell "Conversion pixel and third-party cookies from Appcast. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on a website or app that participates in Appcast’s ad network. The cookies are stored on your device for thirty (30) days, except for the session cookie, which is deleted when you close your browser. We also use the Appcast pixel to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e118]
            - row [ref=f78e119]:
              - cell "Google pixel _gcl_au" [ref=f78e120]
              - cell "Conversion pixel and third-party cookie from Google. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on a Google property or a website or app that participates in Google’s ad network. The cookie is stored on your device for thirty (30) days. We also use the Google pixel to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e121]
            - row [ref=f78e122]:
              - cell "LinkedIn pixel li_c_user li_cs" [ref=f78e123]
              - cell "Conversion pixel and third-party cookies from LinkedIn. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on LinkedIn. The cookies are stored on your device for twelve (12) months. We also use the LinkedIn pixel to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e124]
            - row [ref=f78e125]:
              - cell "Meta pixel _fbp _tr" [ref=f78e126]
              - cell "Conversion pixel and third-party cookies from Meta. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on Meta. The cookies are stored on your device for thirty (30) days. We also use the Meta pixel to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e127]
            - row [ref=f78e128]:
              - cell "Snapchat pixel sc_hit sc_gpt" [ref=f78e129]
              - cell "Conversion pixel and third-party cookies from Snapchat. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on Snapchat. The cookies are stored on your device for twelve (12) months. We also use the Snapchat pixel to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e130]
            - row [ref=f78e131]:
              - cell "Simpli.fi pixel simpli.fi_id simpli.fi_visit" [ref=f78e132]
              - cell "Conversion pixel and third-party cookies from Simpli.fi. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on a website or app that participates in Simpli.fi’s ad network. The cookies are stored on your device for thirty (30) days. We also use the Simpli.fi pixel to serve you additional Delta Careers ads and to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e133]
            - row [ref=f78e134]:
              - cell "TikTok pixel tiktok_pixel tiktok_ads_id" [ref=f78e135]
              - cell "Conversion pixel and third-party cookies from TikTok. Delta uses these to measure the performance of Delta Careers ads by recording if you view and apply for a job through an ad on TikTok. The cookies are stored on your device for thirteen (13) months. We also use the TikTok pixel to serve Delta Careers ads to other candidates who are similar to you." [ref=f78e136]
