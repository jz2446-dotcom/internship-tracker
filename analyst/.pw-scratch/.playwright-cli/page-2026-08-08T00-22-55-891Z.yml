          - generic [ref=f167e66]:
            - emphasis [ref=f167e68]: Andreessen Horowitz is a Silicon Valley-based venture capital firm with $10 billion under management. Focused on investing in software eating the world, the firm partners with entrepreneurs in their company building at all stages – from seed to late-stage – in the biology, consumer, crypto, and enterprise industries.
            - emphasis [ref=f167e70]: Summer Intern
            - emphasis [ref=f167e72]: "Under the supervision of our departmental teams; the intern responsibilities include:"
            - list [ref=f167e73]:
              - listitem [ref=f167e74]:
                - emphasis [ref=f167e75]: Handling a variety of special ad-hoc projects and research
              - listitem [ref=f167e76]:
                - emphasis [ref=f167e77]: Researching and compiling data on various Venture related topics
            - emphasis [ref=f167e79]: Qualifications
            - list [ref=f167e80]:
              - listitem [ref=f167e81]:
                - emphasis [ref=f167e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f167e83]:
                - emphasis [ref=f167e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f167e85]:
                - emphasis [ref=f167e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f167e87]:
                - emphasis [ref=f167e88]: Must be a team player with a “no job is too big or too small attitude”
              - listitem [ref=f167e89]:
                - emphasis [ref=f167e90]: Strong organizational and time management skills are critical, as multi-tasking is essential to monitor and engage in the overall responsibilities
              - listitem [ref=f167e91]:
                - emphasis [ref=f167e92]: Excellent verbal, written, and interpersonal communication skills
