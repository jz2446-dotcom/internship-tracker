          - heading "A Leading Alternative Asset Management Firm" [level=1] [ref=f732e39]
          - paragraph [ref=f732e41]: Founded in 2011, Boyu Capital is a leading alternative investment firm with Chinese roots and a global mandate. With over 200 portfolio companies and offices in Hong Kong, Beijing, Shanghai and Singapore, Boyu’s uniquely integrated and synergistic platform spans private equity, public equity, infrastructure and venture investing. By providing catalytic capital and strategic support to exceptional leaders and visionary entrepreneurs, Boyu drives long-term value creation from its close partnerships with the most innovative and impactful businesses in consumer, technology, healthcare and sustainable energy globally.
