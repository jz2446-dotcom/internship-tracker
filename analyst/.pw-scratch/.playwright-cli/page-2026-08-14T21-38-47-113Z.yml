            - generic [ref=f732e90]:
              - heading "Public Equities" [level=3] [ref=f732e92]
              - paragraph [ref=f732e94]: Our investment philosophy is deeply rooted in identifying and capturing long-term growth opportunities, with a strong emphasis on intrinsic value and margin of safety. We integrate our expertise in public markets and insights from the private market to offer an informed and differentiated view.
              - link "Learn More" [ref=f732e96] [cursor=pointer]:
                - /url: /public-equity/
            - generic [ref=f732e100]:
              - heading "Real Asset & Infrastructure" [level=3] [ref=f732e102]
              - paragraph [ref=f732e104]: With deep Asia insights and global perspectives, we strive to deliver attractive long-term returns for our investors, by leveraging our domain expertise and the synergy of Boyu platform.
