      - heading "Fraudulent Employment Offers" [level=3] [ref=f13e1584]
      - paragraph [ref=f13e1585]: Equinix would like to inform you about ongoing scams involving fraudulent job listings that are being posted on third-party websites. These scams typically involve individuals impersonating Equinix employees and communicating with applicants primarily through email and chat applications such as WhatsApp, Telegram, or social media platforms like LinkedIn. In these scams, applicants may receive a counterfeit offer letter in exchange for personal identification information, which is falsely presented as part of a new-hire screening process. We want to emphasize that these communications and offers are entirely illegitimate and fraudulent. Please note the following key points to help you identify legitimate Equinix communications- All official correspondence from Equinix employees will originate from an “@equinix.com” email address. Our hiring process includes a comprehensive interview procedure, which consists of in-person meetings and phone interviews. Equinix will never request your Social Security or National ID number during the interview process, nor will we ask you to pay any fees or purchase. If you receive any suspicious messages claiming to be from Equinix, please do not engage with them and report the incident to us at careers@equinix.com.
