                - paragraph [ref=f353e167]: The Broward County Aviation Department, which manages the Fort Lauderdale/Hollywood International Airport and North Perry Airport (a general aviation facility), seeks an experienced Accounting Manager to oversee Capital Projects who manages the budget, accounting/reporting and financial activities for the Aviation Department's Capital projects and capital assets. They will also be responsible for the analytical function of the Aviation Department to support optimal business decision making. This job includes budget compilation responsibility, financial and business analysis, long-term strategic planning, and the preparation of expense and cash forecasts. This job requires a strategic thinker who performs to a high degree of accuracy and is very organized and self-motivated. Strong analytical and problem-solving skills and advanced knowledge and understanding of financial accounting, internal controls and financial management, with a high level of proficiency with Microsoft Excel, are essential. Experience of airport finance, accounting and rate setting practices is highly desirable.
                - paragraph [ref=f353e168]:
                  - strong [ref=f353e169]: General Description
                - generic [ref=f353e170]:
                  - paragraph [ref=f353e171]: Supervises the activities of professional and clerical staff in the management of the accounting and financial reporting sections in the Finance Division.
                  - paragraph [ref=f353e172]: Works under administrative supervision, developing and implementing programs within organizational policies and reports major activities to executive level administrators through conferences and reports.
                - paragraph [ref=f353e173]:
                  - strong [ref=f353e174]: Minimum Education and Experience Requirements
                - generic [ref=f353e175]:
                  - paragraph [ref=f353e176]: Requires a Bachelor's degree from an accredited college or university in accounting, business, finance, or related degree; or a Bachelor's degree and coursework that qualifies for CPA Examination.
                  - paragraph [ref=f353e177]: Requires four (4) years experience in governmental accounting, auditing or closely related experience; including 4 years supervising subordinates and working collaboratively with a team and customers on solution-focused outcomes.
                - paragraph [ref=f353e178]:
                  - strong [ref=f353e179]: Special Certifications and Licenses
                - generic [ref=f353e180]:
                  - paragraph [ref=f353e181]: None.
                  - strong [ref=f353e182]
                - paragraph [ref=f353e183]:
                  - strong [ref=f353e184]: Preferences
                - text: Master's Degree in accounting, business, finance, or related fieldCertified Public Accountant (CPA)Accredited Airport Executive Certification (AAE) or Airport Certified Employee (ACE)Certified Management Accountant (CMA)Certified Fraud Examiner (CFE)Budgeting and Forecasting ExperienceCapital Asset Management ExperienceAirport Improvement Program Grant ExperiencePassenger Facility Charge (PFC) Experience1+ Years PeopleSoft Financials Experience
                - paragraph [ref=f353e185]:
                  - strong [ref=f353e186]: Additional Information
                - paragraph [ref=f353e187]: All candidates must complete an extensive ten (10) year work history verification and criminal background check, including fingerprinting and all other information as required by the Federal Aviation Administration. Ability to maintain authorization to drive a County vehicle.
                - paragraph [ref=f353e188]
                - paragraph [ref=f353e189]: The Aviation Department operates under a Drug-Free Workplace Policy in compliance with the provisions of the Federal Drug-Free Workplace Act of 1988. All Aviation Department employees must possess the ability to interact courteously with the public, Airport vendors, contractors and fellow employees to maintain a professional work atmosphere by acting and communicating in a manner that promotes a positive work environment.
                - paragraph [ref=f353e190]
                - paragraph [ref=f353e191]: Ability to obtain/maintain Security Identification Display Area (SIDA) access with Customs and Border Protection Seal.
                - paragraph [ref=f353e192]: Ability to obtain / maintain Airfield driving privileges.
                - paragraph [ref=f353e193]: Must possess a valid Florida driver's license during employment and maintain authority to drive on County business.
                - paragraph [ref=f353e194]
                - paragraph [ref=f353e195]: Per the Code of Federal Regulations, Title 49, Part 1542, all airport employees must undergo a Criminal History Records Check (CHRC) and a Security Threat Assessment (STA) to obtain a Security Identification Display Area (SIDA) Badge, as required by the Transportation Security Administration (TSA).
                - paragraph
              - term [ref=f353e196]:
                - heading "SCOPE OF WORK" [level=2] [ref=f353e197]
              - definition [ref=f353e198]:
                - paragraph
                - generic [ref=f353e199]:
                  - strong [ref=f353e200]: Duties and Responsibilities
                  - paragraph [ref=f353e201]: The functions listed below are those that represent the majority of the time spent working in this class. Management may assign additional functions related to the type of work of the job as necessary.
                  - paragraph [ref=f353e202]: Plans, coordinates and directs the preparation of quarterly and annual financial statements; manages assigned staff to ensure compliance with accounting and reporting standards, department deadlines, and goals.
                  - paragraph [ref=f353e203]: Supervises the maintenance of the general ledger for all funds, including monthly general ledger accounts reconciliations, reviewing and monitoring of various general ledger account activities and balances; supervises the monthly financial closing process in the financial system, including the timely and accurate recording of adjusting journal entries and accruals.
                  - paragraph [ref=f353e204]: Manages various accounting functions such as the recording of capital assets, accounts payable, payroll review, cash receipts deposits, grant billings, filing of sales tax and water tax returns, and promotional reports.
                  - paragraph [ref=f353e205]: Coordinates audits performed by public accounting firms and serves as the primary contact with auditors in matters related to financial audits; manages the daily activities of the revenue accounting section, including month-end revenue closing and revenue reporting activities, to ensure compliance with applicable policies and county, state, and federal regulations.
                  - paragraph [ref=f353e206]: Directs staff in analyzing data and providing financial and statistical information to support contract negotiations, contract comparisons and other management decisions.
                  - paragraph [ref=f353e207]: Acts as a liaison with customers and other County agencies; assists customers with understanding the published tariffs, explains the application of the terms of their revenue contracts, processes requests and credits.
                  - paragraph [ref=f353e208]: Develops and maintains unique and highly complex rate configuration in the computerized accounting systems used to implement and update tariff and process billing, and records revenue for financial reporting, and internal accounting control.
                  - paragraph [ref=f353e209]: Manages the activities of staff to ensure that all county accounting is performed in accordance with the prescribed accounting and administrative standards and regulations including processing all invoices; manages and directs revenue collection activities, including scheduling collection letters, follow-up procedures, accounting for bad debt and securing approval for penalty waivers; monitors revenue contracts for compliance with the terms and conditions such as customer reporting, minimum guaranteed amounts, and security deposit provisions, and initiates processing of charges and penalties for non-compliance.
                  - paragraph [ref=f353e210]: Ensures the accuracy of financial and accounting information by performing analytical reviews to confirm that financial information is reasonable, in compliance with accounting and reporting standards and procedures; coordinates and assists in the preparation and review of the annual operating and capital budget, and the presentation of the budget to appropriate authorities.
                  - paragraph [ref=f353e211]: Represents the Finance Director and/or Assistant Director in various interdepartmental contacts, confers with departmental administrators and officials on fiscal issues, to ensure accurate interpretation of financial accounting standards and procedures.
                  - paragraph [ref=f353e212]: Assists in developing and implementing the County's financial accounting systems to ensure the accuracy of financial transactions and compliance with County policies, rules, regulations, and procedures.
                  - text: Oversight, coordination, preparation and submission of the Aviation Departments Annual Capital Budget and five-year Plan.Identifying and obtaining multiple funding sources such as grants, passenger facility charges (PFC’s), bonds, and cash to fund the capital projects. This requires important decisions regarding the optimum use of available funding sources and the flexibility to adjust project financing as additional funding sources become available.The financial oversight of approximately 300 active capital projects that total to a $3.2 billion among three Aviation Capital Funds. This includes analysis of all project expenditures to ensure compliance with generally accepted accounting principles (GAAP) and with Federal, State, Local government, and Airport Improvement Program accounting policies and internal controls relating to capital assets and projects. Administration of Federal and State grants including applications, execution of agreements, reimbursement drawdowns, periodic financial and progress reports, close-outs, Single Audit, and compliance management. Managing approximately 40 grants annually with a total value of over $400 million dollars. This requires comprehensive knowledge of Airport Improvement Program, project eligibility, and Grant Assurances.Applying for, managing, and the reporting of Passenger Facility Charges (PFC) revenues and expenses. Requires specific knowledge of the PFC program, PFC Assurances, and PFC statute and regulation are essential for managing PFC funded projects. Primary financial contact for the Federal Aviation Administration (FAA), Florida Department of Transportation (FDOT), and the Transportation Security Administration (TSA) local Airports District Offices. Ensuring adequate project cash flows and providing information to the Financial Administrative Services Department for investment purposes.External and internal reporting regarding the capital projects’ budgets, actual expenses and funding sources to the FAA, FDOT and senior Aviation staff in addition to the preparation of a separate annual audited PFC Report and the asset related notes in BCAD’s audited financial statements and the County’s Consolidated Annual Financial Report (CAFR).
                  - paragraph [ref=f353e213]: Performs related work as assigned.
                - generic [ref=f353e214]:
                  - strong [ref=f353e215]: Competencies
                  - list [ref=f353e216]:
                    - listitem [ref=f353e217]:
                      - strong [ref=f353e218]: Business Insight
                      - text: ":"
                      - generic [ref=f353e219]: Applies knowledge of business and the marketplace to advance the organization's goals. Ensures that the team understands and discusses relevant industry changes. Gives strong messages about how people's efforts make a difference to the broader organization.
                    - listitem [ref=f353e220]:
                      - strong [ref=f353e221]: Financial Acumen
                      - text: ":"
                      - generic [ref=f353e222]: Interprets and applies key financial indicators to make better business decisions. Fosters accountability for making good financial decisions; provides guidance to help the team make astute decisions. Summarizes financial performance data and explains implications for the organization.
                    - listitem [ref=f353e223]:
                      - strong [ref=f353e224]: Manages Complexity
                      - text: ":"
                      - generic [ref=f353e225]: Makes sense of complex, high quantity, and sometimes contradictory information to effectively solve problems. Asks questions to encourage others to think differently and enrich their analyses of complex situations. Accurately defines the key elements of complex, ambiguous situations.
                    - listitem [ref=f353e226]:
                      - strong [ref=f353e227]: Directs Work
                      - text: ":"
                      - generic [ref=f353e228]: Provides direction, delegating, and removing obstacles to get work done. Delegates tasks, providing generally clear expectations to staff. Coordinates and integrates the team's work, reducing duplication. Measures team progress using the right indicators; recognizes when problems or shortfalls occur.
                    - listitem [ref=f353e229]:
                      - strong [ref=f353e230]: Optimizes Work Processes
                      - text: ":"
                      - generic [ref=f353e231]: Knows the most effective and efficient processes to get things done, with a focus on continuous improvement. Pays close attention to a variety of metrics and benchmarks; determines both major and subtle ways to optimize processes. Swiftly resolves process breakdowns; takes steps to ensure that problems do not recur.
                    - listitem [ref=f353e232]:
                      - strong [ref=f353e233]: Ensures Accountability
                      - text: ":"
                      - generic [ref=f353e234]: Holds self and others accountable to meet commitments. Measures and tracks team's and own performance, and helps the team learn from success, failure, and feedback. Adheres to, and enforces, goals, policies, and procedures.
                    - listitem [ref=f353e235]:
                      - strong [ref=f353e236]: Builds Effective Teams
                      - text: ":"
                      - generic [ref=f353e237]: Builds strong-identity teams that apply their diverse skills and perspectives to achieve common goals. Connects with others on team projects and leverages their strengths and knowledge to deliver the best possible results. Champions the decisions of the team and operates in a way that builds team spirit.
                    - listitem [ref=f353e238]:
                      - strong [ref=f353e239]: Communicates Effectively
                      - text: ":"
                      - generic [ref=f353e240]: Develops and delivers multi-mode communications that convey a clear understanding of the unique needs of different audiences. Tailors communication content and style to the needs of others. Pays attention to others' input and perspectives, asks questions, and summarizes to confirm understanding.
