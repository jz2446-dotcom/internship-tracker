                  - strong [ref=f353e268]: County-wide Emergency Responsibilities
                  - paragraph [ref=f353e269]:
                    - strong [ref=f353e270]: "Note:"
                    - text: During emergency conditions, all County employees are automatically considered emergency service workers. County employees are subject to being called to work in the event of a disaster, such as a hurricane, or other emergency situation and are expected to perform emergency service duties, as assigned.
                  - strong [ref=f353e271]: County-wide Employee Responsibilities
                  - paragraph [ref=f353e272]: All Broward County employees must serve the public and fellow employees with honesty and integrity in full accord with the letter and spirit of Broward County's Employee Code of Ethics, gift, and conflict of interest policies.
                  - paragraph [ref=f353e273]: All Broward County employees must establish and maintain effective working relationships with the general public, co-workers, elected and appointed officials and members of diverse cultural and linguistic backgrounds, regardless of race, color, religion, sex, national origin, age, disability, marital status, political affiliation, familial status, sexual orientation, pregnancy, or gender identity and expression.
