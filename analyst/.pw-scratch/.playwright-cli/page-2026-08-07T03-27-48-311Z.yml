            - paragraph [ref=f64e522]:
              - text: Compensation figures reflect
              - strong [ref=f64e523]: 2025 market rates
              - text: and vary by geographic location (tier-1 cities command higher salaries) and educational background. Glassdoor data from 450+ Monitor Deloitte intern reviews indicates median satisfaction scores of 4.2/5.0 for compensation fairness. Full-time CDP participants report slightly lower work-life balance scores (3.6/5.0) due to increased client responsibility and travel expectations.
            - paragraph [ref=f64e524]:
              - text: Acceptance rates have remained highly selective as consulting demand stabilized. For context, Monitor Deloitte and Strategy & Analytics divisions received approximately
              - strong [ref=f64e525]: 16,000 applications
              - text: for roughly 450-500 Summer Internship positions globally in recent cycles
              - link [ref=f64e526] [cursor=pointer]:
                - /url: "#ref-21"
                - superscript [ref=f64e527]: "[21]"
              - text: ", yielding an overall acceptance rate near 3%. Target school candidates experience marginally higher success rates (5-8%) due to concentrated recruiting efforts and relationship-building through campus events."
            - heading "Career Growth & Long-Term Opportunities" [level=3] [ref=f64e528]
            - paragraph [ref=f64e529]:
              - text: Monitor Deloitte structures post-program career progression along a defined consulting track with clear promotion milestones. Interns receiving full-time return offers typically enter as
              - strong [ref=f64e530]: Analysts
              - text: (undergraduate hires) or
              - strong [ref=f64e531]: Consultants
              - text: (MBA/advanced degree hires), with CDP graduates advancing directly to Consultant roles upon program completion.
            - paragraph [ref=f64e532]:
              - strong [ref=f64e533]: "Typical Career Trajectory:"
            - list [ref=f64e534]:
              - listitem [ref=f64e535]:
                - generic [ref=f64e536]: "1"
                - generic [ref=f64e537]:
                  - strong [ref=f64e538]: "Analyst (Years 0-2):"
