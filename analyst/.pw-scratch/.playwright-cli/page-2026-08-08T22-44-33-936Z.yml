            - generic [ref=f493e49]:
              - paragraph [ref=f493e50]:
                - strong [ref=f493e51]: Welcome to the City of San Diego Job Opportunities Pages
              - paragraph [ref=f493e52]
              - paragraph [ref=f493e53]:
                - strong [ref=f493e54]: With its great weather, miles of sandy beaches, and major attractions, San Diego draws people from all over the world and is home to more than 1.4 million residents. The City is truly a world-class city for all and it continues to grow and prosper through the diverse knowledge and experiences of its community members. The City maintains a competitive merit system for hiring and promotions that provides equal employment opportunity for all applicants and employees. The City strives to have its workforce reflect the vibrancy and diversity of the community it serves. If you would like to be part of an inclusive team of public servants, bring your talents to the City of San Diego.
              - paragraph [ref=f493e55]
              - paragraph [ref=f493e56]: The City of San Diego only accepts online applications.
              - paragraph [ref=f493e57]
              - paragraph [ref=f493e58]: Notifications to applicants are sent electronically to the email address you provide.
              - paragraph [ref=f493e59]
              - paragraph [ref=f493e60]: To get started, click on the job you are interested in applying for. If this is the first time you are applying using our online job application and you have not created an account yet, you will be instructed to do so at that point.
              - paragraph [ref=f493e61]
              - paragraph [ref=f493e62]: Anyone can apply for open jobs.
              - paragraph [ref=f493e63]
              - paragraph [ref=f493e64]: When applying for jobs, do not share your user account with anyone else. This will jeopardize the status of any jobs you are applying for. Also, save your online application at least every hour, even if you are actively entering information. Failure to save your application could cause the process to time out and you will lose information not previously saved. Lastly, keep all the information in your account, including your name, address, email and phone number, accurate to ensure notifications and employment opportunities are not missed.
              - paragraph [ref=f493e65]
              - paragraph [ref=f493e66]: Your application can be saved and used to apply for more than one job opening.
              - paragraph [ref=f493e67]
              - paragraph [ref=f493e68]: Online applications are stored on a secure site and only authorized employees and hiring authorities have access to the information submitted.
              - paragraph [ref=f493e69]
              - paragraph [ref=f493e70]: Make sure your application is complete and thorough by including all requested education, experience, attachments and other information. Resumes and other supporting documents can be provided at the time of application. However, resumes will not be accepted in lieu of an application. Incomplete applications are subject to rejection.
              - paragraph [ref=f493e71]
              - paragraph [ref=f493e72]:
                - emphasis [ref=f493e73]:
                  - text: "Note: City employees are paid on a biweekly basis; therefore, the annual salary listed is an approximation."
                  - emphasis [ref=f493e74]: For detailed job salary information, click on the job you are interested in applying for and hover over the icon next to ‘Salary’. This will display hourly, bi-weekly, and/or annual salary information for the job, if applicable.
