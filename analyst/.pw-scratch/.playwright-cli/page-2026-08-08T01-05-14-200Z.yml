          - heading "Careers" [level=1] [ref=e136]
          - generic [ref=e137]: Creating a new point of view and fresh approach to real estate finance requires building a world-class team of innovative, collaborative and committed professionals. Join us as we reimagine real estate finance and build a better way of doing business.
        - group [ref=e139]:
          - img "group of people talking" [ref=e141]
      - generic [ref=e143]:
        - region [ref=e144]:
          - heading "Our Culture" [level=2] [ref=e146]
          - paragraph [ref=e151]: Our dynamic, collegial culture is the result of bringing together the best in the business to build what’s next for the industry. With diverse backgrounds and a shared commitment to excellence, we are creating new opportunities for our clients. Through collaboration, our teams work together to transform the way business is done and position NewPoint at the forefront of industry innovation.
        - region [ref=e155]:
          - heading "Perks + Benefits" [level=2] [ref=e157]
          - generic [ref=e161]:
            - paragraph [ref=e162]: NewPoint employees enjoy a strong benefits package that includes generous vacation and sick leave, paid maternity and parental leave, a hybrid work schedule, 401k matching, a variety of insurance options across medical, dental, vision and life, and more. In addition, NewPoint recognizes the exceptional work our team puts into growing the organization and offers 401(k) matching and a profit-sharing plan that shares in the company’s success.
            - paragraph [ref=e163]: Our goal at NewPoint is to foster a caring and supportive workplace that maintains work-life balance and contributes to our employees’ overall well-being.
        - region [ref=e164]:
          - heading "Make Your Mark" [level=2] [ref=e166]
          - generic [ref=e168]:
            - paragraph [ref=e171]: We are looking for up-and-coming professionals and seasoned leaders who are ready to innovate to meet the demands of a changing world. NewPoint is poised for ongoing expansion over the coming years, which creates significant advancement opportunities for our team.
