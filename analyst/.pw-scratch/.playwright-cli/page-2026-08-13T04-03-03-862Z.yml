              - heading "Who we are" [level=1] [ref=f226e110]
              - generic [ref=f226e111]:
                - paragraph [ref=f226e112]:
                  - generic [ref=f226e114]:
                    - text: Digital Realty's purpose is
                    - strong [ref=f226e115]: “To bring companies and data together, in bold new ways, to power the innovation determining our future.”
                    - text: "We believe that the most important currency exchanged between enterprises and their customers is digital trust. As the surge of information accelerates, so too does the need for secure data exchange—globally. Digital Realty is built on a foundation of digital trust, underscored by our core values:"
                    - strong [ref=f226e116]: customer focus, teamwork
                    - text: ", and"
                    - strong [ref=f226e117]: results-driven
                    - text: .
                - paragraph [ref=f226e118]:
                  - generic [ref=f226e119]: Digital Realty supports the data center, colocation, and interconnection strategies of customers from London to Dallas to Singapore to Nairobi and beyond, ranging from cloud and information technology services, communications, and social networking to financial services, manufacturing, energy, healthcare, and consumer products. We are truly global, operating 300+ data centers and facilities across six continents, and more than 25 countries, and 50+ metro areas. We are committed to our customers' success, and take the same approach with talented team members. We inspire and invigorate them with our vision of what can be–and help them get there.
                - paragraph [ref=f226e120]:
                  - generic [ref=f226e121]: Digital Realty's people consistently demonstrate a passion for their jobs and take the time to celebrate our successes as well as those of their colleagues. All of this helps build an engaged and motivated culture that helps all of us excel at what we do best.
              - iframe [ref=f226e127]:
                
            - generic [ref=f226e129]:
              - generic [ref=f226e133]:
