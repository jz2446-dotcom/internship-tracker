                - generic [ref=f226e140]:
                  - paragraph [ref=f226e141]: Together, We Are Digital Realty
                  - paragraph [ref=f226e142]:
                    - generic [ref=f226e143]: Our core values of customer focus, teamwork, and results-driven guide our decisions and actions each and every day - above all else.
                - heading "Our core values" [level=1] [ref=f226e146]
