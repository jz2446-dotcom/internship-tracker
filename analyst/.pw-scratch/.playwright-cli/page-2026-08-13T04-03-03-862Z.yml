            - generic [ref=f226e180]:
              - heading "Employee stories" [level=1] [ref=f226e186]
              - generic [ref=f226e192]:
                - generic [ref=f226e193]:
                  - generic [ref=f226e195]:
                    - paragraph [ref=f226e197]: I take care of the infrastructure in the data centers, the cooling, backup power and ventilation. I like the job because it’s very interesting and I learn about new equipment and how to control technical devices. I’ve found myself in a position where my hobby is also my job, and I always enjoy going to work.
                    - paragraph [ref=f226e198]: It’s a great place to work for people who want to keep developing in their area. We have a very good induction program for new employees, which states that we should always continue learning.
                    - paragraph [ref=f226e199]
                    - paragraph [ref=f226e200]:
                      - strong [ref=f226e201]: Daniel P.
                      - text: Service Operations Engineer Digital Realty Sweden
                  - generic [ref=f226e203]:
                    - paragraph [ref=f226e205]: I joined in 2017 as an individual contributor. The company has been very supportive of my development and gave me the opportunity to manage a team and drive the APAC expansion into Greater China.
                    - paragraph [ref=f226e206]: My favorite things about working here are the people, the location and the flexible working arrangement. The office culture is open and transparent. It’s a friendly and supportive environment, and we work as a team.
                    - paragraph [ref=f226e207]
                    - paragraph [ref=f226e208]:
                      - strong [ref=f226e209]: Jady X.
                      - text: Head of Sales Digital Realty Greater China
                  - generic [ref=f226e211]:
                    - paragraph [ref=f226e213]: I feel happy coming to work, as it’s a very positive environment. We collaborate well together, as well as having fun. I like Digital Realty’s customer focus, as I enjoy interacting with our customers and giving them technical advice.
                    - paragraph [ref=f226e214]: The combination of the company, the people and my work satisfaction give me passion for what I do. Working at Digital Realty is filled with challenges like any other workplace, but it’s satisfying to work as a team to achieve our shared goals.
                    - paragraph [ref=f226e215]
                    - paragraph [ref=f226e216]:
                      - strong [ref=f226e217]: Tomioka H.
                      - text: Senior Data Center Manager Digital Realty Japan
                  - generic [ref=f226e219]:
                    - paragraph [ref=f226e221]: The culture in IT is amazing. We are a fast-moving organization and get to experience a lot of the newest and best technology, but we also have a very realistic view of work-life balance. The management team says, “family first” and really follows through on that.
                    - paragraph [ref=f226e222]: Because IT is an ever-changing landscape, there’s a constant need to learn new things and develop the processes and procedures to sustain them. Combining that with the culture here and the great people I work with creates an environment where I enjoy coming to work each day to support the team and their growth.
                    - paragraph [ref=f226e223]
                    - paragraph [ref=f226e224]:
                      - strong [ref=f226e225]: Isaac S.
                      - text: Manager, IT Corporate Services Digital Realty Dallas, TX
                  - generic [ref=f226e227]:
                    - paragraph [ref=f226e229]: My team is amazing and working with them makes every day memorable. In my role, I particularly like that I am able to interact with our customers.
                    - paragraph [ref=f226e230]: I appreciate Digital Realty’s efforts in bringing diversity and inclusion to the workplace. I feel that my voice matters and will be heard, and all of the different groups and trainings that I’ve participated in have been very beneficial to me and my role here.
                    - paragraph [ref=f226e231]
                    - paragraph [ref=f226e232]:
                      - strong [ref=f226e233]: Crystalyn R.
                      - text: Real Estate Manager Digital Realty Dallas, TX
                  - generic [ref=f226e235]:
                    - paragraph [ref=f226e237]: I like the fact that I have a lot of freedom and flexibility as a working mum. I also like the people, we have a really nice team that backs each other up. I start and end the day with a smile which is very important for me.
                    - paragraph [ref=f226e238]: The international aspect is a big plus for me.
                    - paragraph [ref=f226e239]
                    - paragraph [ref=f226e240]:
                      - strong [ref=f226e241]: Andra H.
                      - text: Paralegal Digital Realty HQNL
                - generic [ref=f226e242] [cursor=pointer]: ❮
                - generic [ref=f226e244] [cursor=pointer]: ❯
