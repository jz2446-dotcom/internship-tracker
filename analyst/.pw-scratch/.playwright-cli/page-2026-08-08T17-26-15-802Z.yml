          - generic [ref=f60e71]:
            - generic [ref=f60e72]: The Role
            - generic [ref=f60e73]:
              - generic [ref=f60e74]:
                - paragraph [ref=f60e75]: Do you want to join a global leader in renewable energy infrastructure investments? If so, Copenhagen Infrastructure Partners (CIP) is the perfect place for you! We are currently looking for an ambitious Intern to join our Growth Markets Funds Investment Team in Amsterdam from July 2026 for 6 month.
                - paragraph [ref=f60e76]: Team
                - paragraph [ref=f60e77]: The Growth Market Funds (GMF) invest in renewable energy infrastructure in high-growth middle-income markets with strong fundamentals for renewable development and significant impact potential. The funds target markets across South-East Asia, India, Latin America and EMEA with strong fundamentals for renewable energy infrastructure investments with a combination of high economic and demographic growth including an expanding middle class leading to an accelerating electricity demand. GMF I was a USD 1bn fund which has been fully invested. The team is currently investing from its second fund, GMF II, which has a target size of USD 3bn. Our new intern will join the team that focuses on investment opportunities in the Indian market.
                - paragraph [ref=f60e78]: Role
                - paragraph [ref=f60e79]: As an Intern in GMF Investment Team you will contribute to transaction processes, prepare for investment decisions, and have various other investment team tasks. You will work closely together with our highly experienced investment team in an international and dynamic environment. We will constantly seek to inspire and challenge you, while focusing on your learning and personal development. Working with our skilled team members, the right candidate will build a strong commercial and contractual understanding of renewable energy infrastructure projects and how they are financed.
                - paragraph [ref=f60e80]: "Responsibilities will consist of but are not limited to:"
                - list [ref=f60e81]:
                  - listitem [ref=f60e82]: Preparation of Investment Committee materials
                  - listitem [ref=f60e83]: Visualization and presentation of technical and financial data to stakeholders
                  - listitem [ref=f60e84]: Financial modelling of large complex infrastructure assets including project finance
                  - listitem [ref=f60e85]: Working together with industrial partners and advisors
                  - listitem [ref=f60e86]: Ad-hoc analyses in close cooperation with other investment team members
                - paragraph [ref=f60e87]: This is a full-time, paid internship based in our Amsterdam office, starting in July 2026 and lasting 6 months. Please only apply if you can commit to the full period.
                - paragraph [ref=f60e88]: You
                - paragraph [ref=f60e89]: CIP is looking for 3rd year BSc or MSc students in Economics, Business, Finance or any other relevant field. Please note that this opportunity is only open to candidates currently enrolled in universities.
                - paragraph [ref=f60e90]: "We are looking for the following candidate:"
                - list [ref=f60e91]:
                  - listitem [ref=f60e92]: Excellent academic achievements
                  - listitem [ref=f60e93]: Advanced communication skills with fluency in written and spoken English
                  - listitem [ref=f60e94]: Understanding of Indian business culture and fluency in Hindi/one of Indian dialects is highly beneficial
                  - listitem [ref=f60e95]: Interest in corporate finance, strategy, and renewable energy
                  - listitem [ref=f60e96]: Advanced Excel and PowerPoint skills
                  - listitem [ref=f60e97]: Strong analytical aptitude and structured and project-oriented approach to work
                  - listitem [ref=f60e98]: Ability to deliver high quality output under pressure and tight timelines
                  - listitem [ref=f60e99]: Eagerness to learn, entrepreneurial mindset and spirit of inquiry
                  - listitem [ref=f60e100]: Ability to work independently while still being a team player
                  - listitem [ref=f60e101]: Experience in energy and infrastructure is an advantage, but not a requirement
                - paragraph [ref=f60e102]: The process
                - paragraph [ref=f60e103]: Please apply online as soon as possible as applications will be processed on an ongoing basis. For questions related to the role, please reach out to our Talent Acquisition team at recruitment@cipfs.com. We do not include CV's and Cover Letters sent by email.
                - paragraph [ref=f60e104]: As we continue to improve our candidate experience, diversity and avoid unconscious bias, please avoid having a photo in your CV. We commit to an inclusive recruitment process and equality for all applicants.
                - paragraph [ref=f60e105]: Please be aware that we will not accept speculative CV submissions for any of our roles from recruitment agencies, and any unsolicited candidate submissions will be exempt from any payment expectations and ownership.
                - paragraph [ref=f60e106]:
                  - text: "---"
                  - generic [ref=f60e107]:
                    - generic [ref=f60e108]: Building value that matters
                    - generic [ref=f60e109]: Founded in 2012, Copenhagen Infrastructure Partners P/S (CIP) today is the world’s largest dedicated fund manager within greenfield renewable energy investments and a global leader in offshore wind. To date, CIP has developed and constructed more than +50 greenfield renewable projects around the world. CIP is developing a greenfield project portfolio of ~160GW total, and ~16 GW is in operation or under construction. CIP manages 13 funds and has to date raised approximately EUR ~35 billion for investments in energy and associated infrastructure from more than ~200 international institutional investors. CIP has a multinational team of ~500 full-time employees with extensive experience and knowledge within the fields of renewable energy project development and regulated infrastructure. In addition, CIP has a broad range of competencies within corporate finance, mergers & acquisitions, engineering, construction, project development, and project management.
                - paragraph [ref=f60e110]
                - paragraph [ref=f60e113]:
                  - generic [ref=f60e114]: CIP has built a prominent investment team capable of originating proprietary investment opportunities and executing projects and investments based on the team’s industrial background, large industrial network, and extensive experience in structuring, executing, and managing investments within energy infrastructure. Headquartered in Copenhagen, CIP also operates from key locations across the globe, including offices in Hamburg, Munich, London, Utrecht, New York, Tokyo, Melbourne, Luxembourg, Kuala Lumpur, Seoul and Singapore. In addition, CIP has 17 local project offices globally. For more information, visit
                  - generic [ref=f60e116]: www.cip.com
                  - text: .
