            - text: Key Points
            - listitem [ref=f777e78]: The internet is a global network of servers that moves and stores data using hardware, software, and protocols.
            - listitem [ref=f777e79]: Wi-Fi is a local wireless network that distributes the internet signal to devices in your home, while the internet is the global connection itself.
            - listitem [ref=f777e80]: Common types of internet connections in the U.S. include fiber, cable, DSL, 5G, and satellite.
          - paragraph [ref=f777e81]: The internet is the backbone of modern life, but most people only have a vague idea of how it actually works. At its core, the internet is a global network that moves and stores data using hardware, software and protocols that make online activity possible.
          - paragraph [ref=f777e82]:
            - text: "This article explains the basics: how the internet began, how data travels, and what role servers, routers and Wi-Fi play. You’ll also learn how the cloud fits in, the main types of internet connections in the United States, and why understanding these fundamentals can help you choose the"
            - link "best home internet service" [ref=f777e83] [cursor=pointer]:
