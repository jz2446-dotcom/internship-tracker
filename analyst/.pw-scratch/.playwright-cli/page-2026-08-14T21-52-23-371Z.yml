            - text: .
          - complementary "Internet Featured Cards widget" [ref=f777e84]
          - heading "What is the internet?" [level=2] [ref=f777e85]
          - paragraph [ref=f777e86]: The internet is a global system that stores and moves data through a vast network of connected servers. At its core, it relies on binary code — ones and zeros — to turn complex information into a format that can be transmitted between devices. Encryption and decryption keep that information secure as it travels.
          - paragraph [ref=f777e87]: "The internet is built on three main parts:"
          - complementary [ref=f777e88]:
            - text: "USA TODAY Shopping:"
            - link "Shop sales in tech, home, fashion, beauty & more curated by our editors." [ref=f777e89] [cursor=pointer]:
              - /url: https://www.usatoday.com/shopping/
          - list [ref=f777e90]:
            - listitem [ref=f777e91]:
              - strong [ref=f777e92]: Servers
              - text: that host and deliver information
            - listitem [ref=f777e93]:
              - strong [ref=f777e94]: Hardware and software
              - text: that connect devices and manage data
            - listitem [ref=f777e95]:
              - strong [ref=f777e96]: Networks and infrastructure
              - text: that transport and store information
          - paragraph [ref=f777e97]: Together, these elements allow the internet to function and connect people worldwide.
          - heading "Where did the internet come from?" [level=2] [ref=f777e98]
          - paragraph [ref=f777e99]: The idea for the internet began in the 1960s, when researchers looked for ways to connect computers over long distances. Early experiments sent data through the existing telephone system, laying the foundation for a worldwide network.
          - paragraph [ref=f777e100]: In 1993, the launch of the World Wide Web made the internet accessible to the public. This breakthrough sparked the rise of home computers, new software and internet service providers. Today, the internet has grown into a global infrastructure connecting billions of people, devices, and organizations.
          - heading "How does the internet work?" [level=2] [ref=f777e101]
          - paragraph [ref=f777e102]: The internet operates as a global network that transfers information between servers, devices and data centers. To move efficiently, information is broken into small bundles called packets, each containing the sender’s and receiver’s IP address plus the data itself.
          - paragraph [ref=f777e103]: Transmission Control Protocol/Internet Protocol (TCP/IP) ensures these packets arrive in the right order and reach their destination. This system makes it possible to browse websites, stream movies, send emails and use apps every day. Understanding how data travels can help you better manage your connection, strengthen security and choose the right internet service.
          - heading "How does internet hardware and software work?" [level=2] [ref=f777e104]
          - paragraph [ref=f777e105]: The internet relies on both hardware and software to function. Hardware refers to the physical tools that move signals and connect devices, while software covers the programs and rules that keep data organized and secure. Together, they make all online activity possible.
          - heading "What hardware does the internet use?" [level=3] [ref=f777e106]
          - paragraph [ref=f777e107]: "Internet hardware generally falls into three main groups:"
          - list [ref=f777e108]:
            - listitem [ref=f777e109]:
              - strong [ref=f777e110]: In your home
              - text: ": Modems, Wi-Fi routers, Wi-Fi extenders and Optical Network Terminals (used for fiber). These devices bring the internet signal into your house and distribute it to your devices."
            - listitem [ref=f777e111]:
              - strong [ref=f777e112]: Outside your home
              - text: ": Servers and data centers that store, process and back up vast amounts of information."
            - listitem [ref=f777e113]:
              - strong [ref=f777e114]: Physical infrastructure
              - text: ": Cables, fiber-optic lines and satellites built and maintained by internet service providers. Cables usually run underground, while satellites and fixed wireless equipment are mounted on poles or rooftops."
          - heading "What software does the internet use?" [level=3] [ref=f777e115]
          - paragraph [ref=f777e116]: "Internet software includes the systems and applications that manage how data moves and is accessed:"
          - list [ref=f777e117]:
            - listitem [ref=f777e118]:
              - strong [ref=f777e119]: Protocols
              - text: ": Rules like TCP/IP that control how data travels between devices and websites."
            - listitem [ref=f777e120]:
              - strong [ref=f777e121]: Domain Name System (DNS)
              - text: ": Converts easy-to-remember web addresses into numerical IP addresses that computers understand."
            - listitem [ref=f777e122]:
              - link [ref=f777e123] [cursor=pointer]:
                - /url: /story/tech/internet/compare-home-internet-providers/84166850007/
                - strong [ref=f777e124]: Internet service provider (ISP) software
              - text: ": Manages traffic, data delivery, and network security."
          - paragraph [ref=f777e125]: These elements work together so you can load web pages, stream video, send emails, and securely connect online.
          - heading "What is the cloud, and what are the benefits?" [level=2] [ref=f777e126]
          - paragraph [ref=f777e127]: The cloud is a network of connected servers that store and deliver data online. Most people use the term to mean cloud computing, where files and programs are saved on remote servers instead of a local device.
          - paragraph [ref=f777e128]: Cloud computing frees up space on your phone or computer, lets you access files from anywhere with an internet connection, and helps prevent data loss if your device is lost or damaged.
          - heading "How safe is cloud computing?" [level=3] [ref=f777e129]
          - paragraph [ref=f777e130]: Cloud services protect your data using encryption, which makes information unreadable to unauthorized users. They also rely on continuous monitoring and backups to reduce risks. While no system is flawless, cloud storage is generally secure and safer than keeping everything on a single device.
          - heading "What’s the difference between internet and Wi-Fi?" [level=2] [ref=f777e131]
          - paragraph [ref=f777e132]: The internet and Wi-Fi are connected but not the same. The internet is a global network that delivers data around the world, while Wi-Fi is a local wireless network inside your home or building.
          - paragraph [ref=f777e133]: Your internet service provider (ISP) brings the internet into your home through a modem. A router then converts that signal into Wi-Fi, allowing phones, laptops, TVs and other devices to connect without cables. In short, the internet provides the connection, and Wi-Fi makes it accessible to your devices wirelessly.
          - heading "What are the main types of internet connections?" [level=2] [ref=f777e134]
          - paragraph [ref=f777e135]: "There are several ways to connect to the internet. Each uses a different method to send the signal. The most common types in the United States are:"
          - heading "Fiber internet" [level=3] [ref=f777e136]
          - list [ref=f777e137]:
