          - generic [ref=f390e82]:
            - paragraph [ref=f390e83]:
              - strong [ref=f390e84]: Looking for a Typical Internship? This Isn’t It.
            - paragraph [ref=f390e85]: Forget coffee runs and filing paperwork. At Lee & Associates Boston, our interns are part of the team from day one.
            - paragraph [ref=f390e86]: One minute you might be designing a marketing brochure for a downtown office tower. The next, you’re researching emerging companies, helping launch a marketing campaign, organizing a client event, or figuring out how to make our office run just a little smarter.
            - paragraph [ref=f390e87]: If you love being creative, solving problems, staying organized, and crossing things off a to-do list, you’ll fit right in.
            - paragraph [ref=f390e88]:
              - strong [ref=f390e89]: What You’ll Be Doing
              - text: Marketing
            - list [ref=f390e90]:
              - listitem [ref=f390e91]: Help create eye-catching brochures, presentations, and property marketing materials.
              - listitem [ref=f390e92]: Assist with social media posts and email campaigns.
              - listitem [ref=f390e93]: Research companies, industries, and market trends.
              - listitem [ref=f390e94]: Organize photos, floor plans, and other marketing assets.
            - paragraph [ref=f390e95]: Operations
            - list [ref=f390e96]:
              - listitem [ref=f390e97]: Keep projects moving and help everyone stay on track.
              - listitem [ref=f390e98]: Organize databases, files, and marketing resources.
              - listitem [ref=f390e99]: Assist with improving office processes (if there’s a better way to do something, we want to hear it).
              - listitem [ref=f390e100]: Support special projects that keep the business running efficiently.
              - listitem [ref=f390e101]: Learn how the behind-the-scenes side of commercial real estate really works.
            - paragraph [ref=f390e102]: Bonus Missions
            - paragraph [ref=f390e103]: "No two weeks are the same. You may also:"
            - list [ref=f390e104]:
              - listitem [ref=f390e105]: Brainstorm new marketing ideas.
              - listitem [ref=f390e106]: Build prospect lists.
              - listitem [ref=f390e107]: Create reports and presentations.
              - listitem [ref=f390e108]: Jump into whatever exciting project lands on our desk next.
            - paragraph [ref=f390e109]:
              - strong [ref=f390e110]: Who You Are
            - paragraph [ref=f390e111]: You don’t have to know commercial real estate—we can teach that.
            - paragraph [ref=f390e112]: "We’re looking for someone who:"
            - list [ref=f390e113]:
              - listitem [ref=f390e114]: Loves being organized (color-coded spreadsheets make you oddly happy).
              - listitem [ref=f390e115]: Has a creative eye and enjoys good design.
              - listitem [ref=f390e116]: Notices the little details others miss.
              - listitem [ref=f390e117]: Isn’t afraid to ask questions or share ideas.
              - listitem [ref=f390e118]: Can juggle multiple projects without dropping the ball.
              - listitem [ref=f390e119]: Enjoys learning new software and technology.
              - listitem [ref=f390e120]: Brings positive energy and a sense of humor to work.
            - paragraph [ref=f390e121]:
              - strong [ref=f390e122]: You Might Be a Great Fit If…
            - list [ref=f390e123]:
              - listitem [ref=f390e124]: You’re studying Marketing, Business, Communications, Real Estate, Graphic Design, or something similar.
              - listitem [ref=f390e125]: You know your way around Microsoft Office.
              - listitem [ref=f390e126]: Canva or Adobe Creative Suite doesn’t intimidate you.
              - listitem [ref=f390e127]: You like checking things off your to-do list almost as much as adding them.
            - paragraph [ref=f390e128]:
              - strong [ref=f390e129]: What You’ll Get
            - list [ref=f390e130]:
              - listitem [ref=f390e131]: Real projects—not busy work.
              - listitem [ref=f390e132]: A front-row seat to commercial real estate marketing.
              - listitem [ref=f390e133]: Mentorship from the Director of Operations & Marketing.
              - listitem [ref=f390e134]: Experience you can actually talk about in future interviews.
              - listitem [ref=f390e135]: A chance to build your portfolio with real campaigns and marketing materials.
              - listitem [ref=f390e136]: Plenty of opportunities to learn, contribute, and grow.
            - paragraph [ref=f390e137]:
              - strong [ref=f390e138]: Why Lee & Associates Boston?
            - paragraph [ref=f390e139]: We’re a collaborative team that believes great ideas can come from anyone—including interns. We move quickly, wear a lot of hats, and like people who are curious, dependable, and willing to jump in wherever they’re needed.
            - paragraph [ref=f390e140]:
              - text: If you’re looking for an internship where you’ll leave with real experience, new skills, and probably a few good stories, we’d love to meet you. Interested? Send your resume to
              - link "dvanschagen@lee-associates.com" [ref=f390e141] [cursor=pointer]:
                - /url: mailto:dvanschagen@lee-associates.com
              - text: .
            - paragraph [ref=f390e142]
            - paragraph [ref=f390e143]:
              - text: Learn more about Lee & Associates Boston
              - link "here" [ref=f390e144] [cursor=pointer]:
                - /url: https://www.lee-associates.com/boston
              - text: .
