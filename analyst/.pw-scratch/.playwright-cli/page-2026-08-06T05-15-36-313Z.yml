          - generic [ref=f312e72]:
            - heading "Gain Valuable Experience" [level=2] [ref=f312e74]
            - paragraph [ref=f312e76]: Getting a job while at college can provide you the extra money you need to meet college expenses while providing you new real-world, professional skills. Use the links below to learn more about student employment opportunities at Cornell and how to land a job that meets your needs.
          - generic [ref=f312e78]:
            - heading " Working on Campus?" [level=2] [ref=f312e79]:
              - text: 
              - generic [ref=f312e80]: Working on Campus?
            - paragraph [ref=f312e83]:
              - text: Bring your original, unexpired identity and employment authorization document(s) with you to campus so that you can complete your Form I-9. Your hiring department is your primary point of contact for the I-9 process. However, because the start of the semester often brings a high volume of new hires, Cornell will offer Student I-9 Processing HUBs in Day Hall, Suite 150 and Statler Hall, Suite 135, during the weeks of August 24th and August 31st. Visit
              - link "Student I-9 Processing Hubs for Fall 2026" [ref=f312e84] [cursor=pointer]:
                - /url: https://hr.cornell.edu/news/student-i-9-processing-hubs-fall-2026
              - text: for more information. Questions? contact
              - link "hrpolicy@cornell.edu" [ref=f312e85] [cursor=pointer]:
                - /url: mailto:hrpolicy@cornell.edu
              - text: .
        - generic [ref=f312e91]:
          - generic [ref=f312e94]:
            - img "A view of west campus in fall, with Mennen Hall." [ref=f312e99]
            - generic [ref=f312e100]:
              - heading "Learn About Jobs and Wages" [level=3] [ref=f312e101]
              - paragraph [ref=f312e103]: With numerous positions available at Cornell, the Student Wage and Classification Scale is categorized into four levels. These levels are based on job responsibilities, required skills and experience, level of supervision, and degree of decision-making required.
            - link "Wages & Classifications" [ref=f312e105] [cursor=pointer]:
              - /url: /cornell-student-wages-and-job-classifications
          - generic [ref=f312e108]:
            - img "The new Martin Y. Tang Hall." [ref=f312e113]
            - generic [ref=f312e114]:
              - heading "Learn About Work-Study" [level=3] [ref=f312e115]
              - paragraph [ref=f312e117]: Work-study is a need-based, “self-help” financial aid that allows students to work to meet a portion of their education costs. Eligible students are offered work-study in their financial aid package each year. Students can then earn this funding by working in an hourly student employment position paid from university payroll. Work Study does not mean that students are paid to study but rather work in jobs to earn money.
            - link "Work-Study" [ref=f312e119] [cursor=pointer]:
              - /url: /work-study
