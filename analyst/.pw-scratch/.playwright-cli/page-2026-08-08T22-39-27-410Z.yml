            - definition [ref=f230e123]:
              - paragraph
              - generic [ref=f230e124]: Erie County is an Equal Opportunity Employer and committed to workplace diversity.
              - strong [ref=f230e126]: EXAM POSTING
              - paragraph [ref=f230e127]: All correspondence regarding online applications will be via email.
              - generic [ref=f230e128]: Paper applications containing an email address will also receive email correspondence.
              - generic [ref=f230e129]: If no email is provided, paper notification will arrive via USPS.
              - paragraph [ref=f230e130]:
                - strong [ref=f230e131]: "Examination Date:"
                - text: October 17, 2026
              - paragraph [ref=f230e132]:
                - strong [ref=f230e133]: "Applications Must Be Submitted, Postmarked or Hand Delivered By:"
                - generic [ref=f230e134]: September
                - generic [ref=f230e135]: 2, 2026
              - generic [ref=f230e137]:
                - emphasis [ref=f230e138]: Admission notices are emailed approximately one week prior to the exam. P
                - emphasis [ref=f230e140]: lease call (716)858-8484 if
                - emphasis [ref=f230e141]: you have not received your notice three days before your exam date.
              - strong [ref=f230e142]:
                - text: THERE ARE NO RESIDENCY REQUIREMENTS FOR PARTICIPATION IN THIS EXAMINATION BUT RESIDENCY PREFERENCE SHALL BE CONSIDERED
                - strong [ref=f230e143]: FOR
                - strong [ref=f230e144]:
                  - text: APPOINTMENT AS
                  - strong [ref=f230e145]:
                    - emphasis [ref=f230e146]: Deputy Sheriff - Criminal (Spanish Speaking)
                - text: .
              - text: "Please note: PREFERENCE IN CERTIFICATION SHALL BE GIVEN FOR CANDIDATES WHO HAVE BEEN LEGAL ERIE COUNTY RESIDENTS FOR ONE MONTH BEFORE TIME OF APPOINTMENT according to Section 23.4 (a) of the NYS Civil Service Law and Rule VII of the Erie County Rules for the Classified Service. The eligible list resulting from this examination will be used to fill a future vacancy in the Erie County Sheriff's Department."
              - strong [ref=f230e147]
              - text: The eligible list resulting from this examination will supersede any existing list. The maximum duration of the eligible list is four years.
              - strong [ref=f230e148]:
                - strong [ref=f230e149]: PROSPECTIVE EMPLOYEES FOR THE ERIE COUNTY SHERIFF'S DEPARTMENT WILL BE REQUIRED TO PAY A FEE FOR FINGERPRINTING
              - paragraph
            - term [ref=f230e150]:
              - heading "Examples of Duties" [level=2] [ref=f230e151]
            - definition [ref=f230e152]:
              - paragraph [ref=f230e153]:
                - generic [ref=f230e154]:
                  - text: Patrols an assigned area on foot or in a vehicle;Apprehends crime suspects;Enforces laws and ordinances, investigates complaints of suspicious or unusual activities, issues summonses, makes arrests;Controls traffic and investigates vehicle accidents;Obtains information regarding an incident by interviewing witnesses and/or victims;Operates and maintains patrol vehicle;
                  - generic [ref=f230e155]: Interacts with incarcerated individuals, provides security, safety and transportation of prisoners;
                  - text: Protects property; safeguards and receipts found, seized or recovered property;Prepares forms and reports;Prepares evidence for court testimony; appears as a witness in court cases;Photographs, fingerprints and makes case history files on suspects/arrestees;Dispatches patrol units via radio; supplies legal/technical knowledge to patrol units;Works with other governmental agencies in the preparation of statistical data or other matters concerning public safety;Receives complaints concerning suspicious or illegal activities and relays same to the proper authority by teletype, radio or telephone for proper action;Operates an alpha-numerical keyboard (computer terminal) for the retrieval or transmission of electronic information;Answers questions and provides information to the public;Interacts with the community by attending business, civic or school meetings to make a presentation or represent the Sheriff’s Office, and to maintain an awareness of community problems and concerns;Records in appropriate ledgers or dockets, executions and other civil processes which are received from attorneys’, litigants’ and the public;Reviews legal documents to verify correctness of form and content and adherence to required legal regulations;Checks fees and other monies collected for accuracy and posts fees to proper account;Maintains records of garnishee and attachment payments;Prepares check for payment of funds to authorized person or agency;Records daily bank deposits and checks monthly bank statements;Assists in taking monthly trial balances of accounts;Records results of property sales;Executes civil orders of arrest and attachments by locating defendants and collecting fines or placing them under arrest;Serves Orders of Possession and Writs of Assistance and arranges for and supervises the eviction of defendants;Seizes and inventories real and personal property under Warrants or Writs and arranges for and supervises its appraisal and storage;Locates and auctions property of defendants failing to pay assessments under Writs of Execution and receives and accounts for money received;Operates an alpha-numerical keyboard (computer terminal) for the retrieval or transmission of electronic information.
            - term [ref=f230e156]:
              - heading "Minimum Qualifications" [level=2] [ref=f230e157]
            - definition [ref=f230e158]:
              - paragraph
              - paragraph [ref=f230e159]: "Graduation from high school or possession of a high school equivalency diploma and in addition, EITHER:"
              - paragraph [ref=f230e160]: "A.) Completion of a minimum of sixty semester credit hours from a regionally accredited or New York State registered college or university at time of appointment; or:"
              - paragraph [ref=f230e161]: "B.) Completion of a minimum of thirty semester credit hours from a regionally accredited or New York State registered college or university and completion of one year of active duty military service* (see Notes 2, 3 and 5) at time of appointment; or:"
              - paragraph [ref=f230e162]: C.) An equivalent combination of training and experience as defined by the limits of (A) and (B).
              - paragraph [ref=f230e163]:
                - strong [ref=f230e164]: "SPECIAL REQUIREMENTS:"
              - paragraph [ref=f230e165]: Eligibility for appointment begins when candidates reach their 21st birthday.
              - paragraph [ref=f230e166]: "Candidates who reach their 43rd birthday before the date of the written examination are NOT eligible except as follows*: Candidates may have a period of military duty or terminal leave up to seven years, as defined in Section 243 (10-a) of the Military Law, deducted from their age for the purpose of meeting the age requirement. *Section 58.1(a) requires that applicants not be \"more than forty-three years of age as of the date when the applicant takes the written examination...\" Candidates who may be impacted by the maximum age requirement and who are requesting an alternate test date (for active military duty, Sabbath observance or for an alternate test date situation which meets the conditions of Erie County's alternate test date policy) are advised to contact Erie County to discuss the request."
              - paragraph [ref=f230e167]:
                - text: "CITIZENSHIP: United States citizenship is required at time of appointment and maintenance throughout"
                - emphasis [ref=f230e168]
                - text: period of employment.
              - paragraph [ref=f230e169]:
                - text: "DRIVER'S LICENSE: Candidates must possess a valid New York State Driver's License at time of appointment and maintenance throughout"
                - emphasis [ref=f230e170]
                - text: period of employment.
              - text: LANGUAGE
              - strong [ref=f230e171]: ":"
              - text: Must be able to converse fluently both in English and in Spanish.
              - paragraph [ref=f230e172]:
                - strong [ref=f230e173]: "Notes:"
              - paragraph [ref=f230e174]:
                - strong [ref=f230e175]: "1."
                - text: ALL candidates must be not less than
                - strong [ref=f230e176]: 19 years of age
                - text: on or before
                - strong [ref=f230e177]: October 17, 2026.
              - paragraph [ref=f230e178]:
                - strong [ref=f230e179]: "2."
                - text: "*Active duty military service does"
                - strong [ref=f230e180]: NOT
                - text: include active duty for training.
              - paragraph [ref=f230e181]:
                - strong [ref=f230e182]: "3."
                - text: Up to one year of active duty military service may be substituted for education on the basis of one month of active duty equals 2.5 college semester credit hours.
              - paragraph [ref=f230e183]:
                - strong [ref=f230e184]: "4."
                - text: Candidates must have a high school diploma or possess a high school equivalency diploma issued by an education department of any State of the United States or hold a comparable diploma issued by any commonwealth, territory, or possession of the United States or by the Canal Zone or hold a report from the United States armed forces certifying successful completion of the tests of general education development, high school level.
              - paragraph [ref=f230e185]:
                - strong [ref=f230e186]: "5."
                - strong [ref=f230e187]: "***"
                - strong [ref=f230e188]: ALL APPOINTEES MUST HAVE COMPLETED AT LEAST 30 COLLEGE CREDIT HOURS.
                - text: Your degree/credit hours must have been awarded by a college or university accredited by a regional, national, or specialized agency recognized as an accrediting agency by the U.S. Department of Education/U.S. Secretary of Education. If your degree was awarded by an educational institution outside the United States and its territories, you must provide independent verification of equivalency. A list of acceptable companies who provide this service can be found at http://www.cs.ny.gov/jobseeker/degrees.cfm. You must pay the required evaluation fee.
                - strong [ref=f230e189]
              - text: Permanent appointment shall be contingent upon satisfactory completion of an approved municipal basic training program pursuant to Section 209q of the General Municipal Law.
              - strong [ref=f230e190]: "PHYSICAL AND MEDICAL EVALUATION:"
              - text: Candidates must have visual acuity of no worse than 20/100 in each eye uncorrected and must otherwise satisfy the medical and physical fitness standards prescribed by the New York Municipal Police Training Council. These physical and medical requirements are posted in the Erie County Personnel Department at 95 Franklin Street, Buffalo, New York, Room 604.
              - generic [ref=f230e191]:
                - strong [ref=f230e192]: "BACKGROUND INVESTIGATION/PSYCHOLOGICAL EVALUATION:"
                - text: Applicants will be subject to an extensive pre-employment background investigation and psychological evaluation. CONVICTION OF A FELONY
                - strong [ref=f230e193]: WILL BAR
                - text: AND CONVICTION OF A MISDEMEANOR OR OTHER OFFENSE
                - strong [ref=f230e194]: MAY BAR
                - text: PARTICIPATION IN EXAMINATION AND APPOINTMENT. Criminal convictions or other offense are subject to evaluation and may result in disqualification pursuant to Section 50 of the New York State Civil Service Law. The psychological evaluation will consist of a combination of psychological tests and interviews. Candidates must pass the psychological evaluation. In addition, a negative report or failing psychological evaluation may result in disqualification pursuant to Section 50 of New York State Civil Service Law. Candidates must be a United States Citizen, an Erie County Resident, and where applicable a resident of the Town or Village where he or she is appointed per Public Officers Law at time of appointment. (See Erie County Policies and Procedures.)
              - paragraph [ref=f230e195]:
                - strong [ref=f230e196]: PHYSICAL AGILITY AND MEDICAL EXAMINATION
                - text: ": CANDIDATES WHO PASS THE WRITTEN TEST WILL BE REQUIRED TO PASS A QUALIFYING PHYSICAL AGILITY AND MEDICAL TEST. FAILURE ON EITHER QUALIFYING TEST WILL BAR CANDIDATES FROM APPOINTMENT."
              - paragraph [ref=f230e197]:
                - generic [ref=f230e198]:
                  - text: Based on the ranking on the written test, only a sufficient number of candidates needed to fill the present vacancies will be called to take part in an assessment of their physical agility. The
                  - strong [ref=f230e199]: agility test
                  - text: consists of bent-leg sit-ups, push-ups, and a 1.5 mile run and measures muscular endurance, muscular endurance of the upper body and cardiovascular activity. The Municipal Police Training Council adopted the physical fitness screening test based on the model formulated by the Cooper Institute of Aerobics Research. The minimum passing scores, depending on age and sex, represent the fortieth (40th) percentile of physical fitness as established by the Cooper Institute. In addition, the standards are available for review at the Erie County Department of Personnel. Agility testing will be performed before candidates are certified to appointing authorities and is expected to begin in spring of 2027.
                  - strong [ref=f230e200]: For instructions on how to prepare for your agility test, please visit https://youtu.be/2YI3NXswVSM.
              - paragraph [ref=f230e201]: Candidates who pass the written test and the agility test and receive an offer of employment will receive more detailed information about the medical and physical fitness standards prescribed by the NYS Municipal Police Training Council. Candidates should also be aware that an offer of employment as a Police Officer/Deputy Sheriff-Criminal is contingent upon passing an appropriate medical examination. Both the medical exam and agility test are given on a pass/fail basis. Re-tests will be permitted only in accordance with the guidelines prescribed by the Commissioner of Personnel.
              - strong [ref=f230e203]: "SPANISH LANGUAGE ORAL TEST:"
              - generic [ref=f230e204]:
                - text: Designed to evaluate the candidate's proficiency in the Spanish language, at the level appropriate for the position(s) being filled. A
                - strong [ref=f230e205]: Level 2
                - text: proficiency in the above language is required to pass this qualifying oral test. This is equivalent to having a working oral language proficiency with understandable, smooth expression at a conversational level of communication. Only a sufficient number of candidates needed to fill the present vacancy will be called to take part in this qualifying language oral proficiency test. As additional vacancies occur, other candidates who were successful on the written portion of the examination will be invited to take the qualifying language oral proficiency test. Candidates must pass both the written test and the qualifying foreign language oral proficiency test in order to be eligible for appointment.
              - paragraph
            - term [ref=f230e206]:
              - heading "Supplemental Information" [level=2] [ref=f230e207]
            - definition [ref=f230e208]:
              - paragraph
              - paragraph [ref=f230e209]:
                - strong [ref=f230e210]: "Scopes / Subjects of examination:"
                - text: A test designed to evaluate knowledge, skills and /or abilities in the following areas.
              - paragraph [ref=f230e211]:
                - strong [ref=f230e212]: Situational Judgment
              - paragraph [ref=f230e213]: These questions test for the ability to identify appropriate and effective responses to work-related challenges. You will be presented with scenarios that reflect the types of challenges one could encounter in a work environment. Each scenario will be followed by several responses to the scenario. You must rate the effectiveness of each response.
              - paragraph [ref=f230e214]:
                - strong [ref=f230e215]: Language Fluency
              - paragraph [ref=f230e216]: These questions test for the ability to read, understand, and present a clear and accurate summary of information. For some questions, you will be given a brief reading passage followed by four statements, each summarizing the information. You must then choose the best version. For other questions, you will be given several sentences, one of which contains a spelling, grammatical, or punctuation error. You must then select the line that contains the error.
              - paragraph [ref=f230e217]:
                - strong [ref=f230e218]: Information Ordering and Language Sequencing
              - paragraph [ref=f230e219]: These questions test for the ability to properly identify the sequence or order of events, or to organize information to fit a timeline. You will be given a brief reading passage followed by one or more questions. You must identify the proper sequence of events in order to answer one or more questions.
              - paragraph [ref=f230e220]:
                - strong [ref=f230e221]: Problem Sensitivity and Reasoning
              - paragraph [ref=f230e222]: These questions test for the ability to apply information and to identify a problem or potential problem. For some questions, you will be given information in the form of policies, rules, regulations, or laws, which will be followed by a situation. You must then identify the problem and apply the information to select the best course of action to take. For other questions, you will be given a scenario and mock witness statements. You must use this information to answer one or more questions about the scenario.
              - paragraph [ref=f230e223]:
                - strong [ref=f230e224]: Selective Attention
              - paragraph [ref=f230e225]: These questions test for the ability to focus on completing a task and to pay attention to important details while performing repetitive and monotonous tasks. You will be presented with a series of letters, symbols, and/or numbers. You must select the choice that contains the series of letters, symbols, and/or number that matches exactly.
              - paragraph [ref=f230e226]:
                - strong [ref=f230e227]: Visualization
              - paragraph [ref=f230e228]:
                - text: These questions test for the ability to imagine how something will look when it is moved around or when its parts are changed, moved, or rearranged. You will be presented with an image of a face followed by four images of faces. Each face is disguised or altered in some way. Three of the images have a difference in facial structure or facial features. You must select the choice that contains the image with the identical facial structure and facial features.
                - strong [ref=f230e229]
              - paragraph [ref=f230e230]:
                - strong [ref=f230e231]: Spatial Orientation
              - paragraph [ref=f230e232]: These questions test for the ability to understand how to navigate within spaces or how to get from one point to another. You will be provided with a map followed by one or more questions. You must imagine yourself at a certain location and orient yourself to the direction in which you would move to get to another location by the shortest (least distance) route.
              - text: "Test guide:"
              - paragraph [ref=f230e233]:
                - text: A Guide for the Written Test for
                - strong [ref=f230e234]: Entry-Level Law Enforcement
                - text: "is available at the New York State website:"
                - link "https://www.cs.ny.gov/testing/testguides.cfm" [ref=f230e235] [cursor=pointer]:
                  - /url: https://www.cs.ny.gov/testing/testguides.cfm
                - text: . Candidates not having access to a computer or the internet may request copy of the test guide from the municipal civil service office conducting this examination using the contact information found elsewhere on this announcement.
              - strong [ref=f230e237]: Use of calculators is
              - strong [ref=f230e238]: prohibited
              - text: for this examination. Devices with typewriter keyboards, "Spell Checkers", "Personal Digital Assistants", "Address Books", "Language Translators", "Dictionaries", or any similar devices are prohibited. Cell phones are prohibited. You may not bring books or other reference materials.P. E. R. C. Statement The final rating key for this examination will be established by the State Civil Service Commission prior to the testing date, upon recommendation of a committee of police experts who will review all the questions for appropriateness and accuracy. There will be no review of the questions by candidates. The committee was selected with the assistance and endorsement of the Police Conference of New York, Inc., the New York State Association of PBAs, Inc., and the New York State Association of Chiefs of Police, Inc.
              - emphasis [ref=f230e241]: After taking the exam, you will receive your score in approximately six months, via email. If your name appears on the resulting eligible list, canvass letters from many of our hiring agencies are now sent via email instead of USPS. Please be diligent about checking your email, including your spam folder, along with your physical mailbox, as some agencies are still using USPS. Response deadlines to canvass letters are strictly enforced and exceptions cannot be made for those that fail to check their emails in a timely manner. Candidates are responsible for ensuring that emails from appointing agencies can be received. This includes taking appropriate steps to prevent such emails from being blocked or filtered as spam, such as adding agency email addresses or domains to approved or “safe sender” lists.
              - paragraph [ref=f230e242]:
                - text: "HOW TO APPLY: Either online by clicking \"Apply\" on the top right of the online exam announcement or by printing a paper application from erie.gov,"
                - link "Erie County Application for Examination or Appointment" [ref=f230e243] [cursor=pointer]:
                  - /url: https://www3.erie.gov/employment/sites/www3.erie.gov.employment/files/2022-09/po_30x_2022.pdf
                - link "(Download PDF reader)" [ref=f230e244] [cursor=pointer]:
                  - /url: https://get.adobe.com/reader/
                - link "(Download PDF reader)" [ref=f230e245] [cursor=pointer]:
                  - /url: https://get.adobe.com/reader/
                - text: or if you do not have internet access you may pick up an application form at the Erie County Personnel Department, 95 Franklin Street, Room 604, Buffalo, New York 14202. Forms are also available at Buffalo and Erie County Public Libraries and at Town, Village and School District administrative offices.
              - text: Completed forms should then be returned to the Erie County Personnel Department. In addition, candidates must request their colleges to send transcripts to the Erie County Personnel Department or attach transcripts to your application. No applications will be evaluated until all the above information, including transcripts, is received.
              - paragraph [ref=f230e246]: "MILITARY STATUS: Active duty military personnel may file an application for this exam. A special military make-up examination will be conducted for any member of the armed forces of the United States who has duly filed a timely application but who was deprived of the opportunity to compete in the scheduled exam due to active military duty. Special conditions apply to these requests and may be reviewed at the Erie County Department of Personnel."
              - paragraph [ref=f230e247]:
                - generic [ref=f230e248]:
                  - text: "VETERANS: Disabled and non-disabled veterans as defined in Section 85, New York State Civil Service Law, will have 10 and 5 points, respectively added to their earned scores if successful on the OPEN examination. You must claim these credits when you file application but you have an option to waive them any time prior to appointment."
                  - strong [ref=f230e249]: If you have already used these credits for a permanent position in NYS, you may not claim them again.
              - paragraph [ref=f230e250]: In conformance with section 85-a of the Civil Service Law, CHILDREN and SIBLINGS OF FIREFIGHTERS AND POLICE OFFICERS KILLED IN THE LINE OF DUTY shall be entitled to receive an additional ten points in a competitive examination for original appointment in the same municipality in which his or her parent has served. If you are qualified to participate in this examination and are a child of a firefighter or police officer killed in the line of duty in this municipality, please inform this office of this matter when you submit your application for examination. A candidate claiming such credit has a minimum of two months from the application deadline to provide the necessary documentation to verify additional credit eligibility. However, no credit may be added after the eligible list has been established.
              - paragraph [ref=f230e251]: "SPECIAL ARRANGEMENTS: Applicants whose religious beliefs prevent their taking examinations before sundown on Saturday and physically handicapped candidates who require special examination facilities should so inform the Erie County Department of Personnel, by a separately mailed letter at the earliest possible date before the test."
              - paragraph [ref=f230e252]:
                - text: "MORE THAN ONE EXAM ON THE SAME DAY: If you have applied for more than one exam on the same day you MUST make arrangements to take ALL of the examinations at ONE examination test site. If you have applied for both STATE and LOCAL government examinations taking place on the same day, you must take all of your examinations at the STATE examination center. If you have applied for both COUNTY and CITY government examinations taking place on the same day, you must take all of your examinations at the COUNTY examination center. You are responsible to notify EACH Civil Service Agency no later than TWO WEEKS before the examination date on which you are taking multiple examinations by submitting a Cross-Filer form; EACH Civil Service Agency has their own Cross-Filer form. The"
                - link "Erie County Cross-Filer form" [ref=f230e253] [cursor=pointer]:
                  - /url: https://www3.erie.gov/employment/sites/www3.erie.gov.employment/files/2021-09/ec_personnel_form_exams_cross-filer.pdf
                - link "(Download PDF reader)" [ref=f230e254] [cursor=pointer]:
                  - /url: https://get.adobe.com/reader/
                - generic [ref=f230e255]:
                  - text: can be found at
                  - link "https://www3.erie.gov/employment/applications" [ref=f230e256] [cursor=pointer]:
                    - /url: https://www3.erie.gov/employment/applications
                  - text: .
                - strong [ref=f230e258]: If you are taking multiple exams on the same date for Erie County only, you do NOT have to file a Cross-Filer form.
              - paragraph [ref=f230e259]: "Candidates taking more than one exam in DIFFERENT exam series will be allowed the specified length of time for each exam, up to a maximum of eight hours. Example: If you are taking one exam which allows six hours and another exam in a different series which allows four hours, you must complete both tests in eight hours, but no more time can be spent on each exam than the time allotted for that exam. Candidates taking more than one exam in the SAME exam series will be allowed up to the specified length of time for each exam. Example: If you are taking two exams in the same series with a maximum time of five hours for each exam, you can spend no more than five hours to complete both exams."
              - paragraph [ref=f230e260]: "ADMISSION TO EXAMINATION: Notice to appear for the test will be conditional as review of application for minimum requirements may not be made until after the written test. Call or email this Department if you have not received your notice three days before the date of the test. You may not be admitted to the examination room without official notice."
              - paragraph [ref=f230e261]: "RATINGS REQUIRED: Tests are rated on a scale of 100 with a passing mark at 70. Unless the announcement states otherwise, you must pass the written test and the oral test, if any. Test instructions may further divide the tests into parts and set minimum standards for each part."
              - paragraph [ref=f230e262]: "MEDICAL EXAMINATION: You may be required to take a medical examination to determine if you are medically and physically capable of performing the duties of the position. In accordance with State Law, Governor’s Executive Order 6, and Section 504 of the Federal Rehabilitation Act of 1973, as amended the County of Erie does not discriminate against handicapped persons in access to employment, during employment, or in any of its programs and activities."
              - paragraph [ref=f230e263]: "VERIFICATION OF QUALIFICATIONS: Candidates may be investigated or called for an interview to verify information contained on the application. Verifiable part-time and/or volunteer experience may be pro-rated toward meeting full-time experience requirements."
              - paragraph [ref=f230e264]: "ELIGIBLE LIST: The eligible list resulting from an examination may also be used for appointment to the same title or to any other title deemed to be similar and appropriate. Eligible lists are active for a minimum of one year and a maximum of four years from the date established."
              - paragraph [ref=f230e265]: "BACKGROUND INVESTIGATION (*including psychological evaluation when required by position): Candidates may be subject to a thorough background investigation or psychological evaluation when required to determine eligibility for appointment. Applicants may be required to authorize access to educational, employment, criminal history and other records check as part of such investigation or participate in related tests or interviews. Criminal convictions or other offense are subject to evaluation and may result in disqualification pursuant to Section 50 of the New York State Civil Service Law. Applicant will be required to submit the necessary fees for the fingerprint processing, where required. (*If a psychological evaluation is required, it shall be specified in the minimum qualifications or special requirements for the position.)"
              - paragraph [ref=f230e266]: "**IMPORTANT APPLICATION FEE - READ CAREFULLY**"
              - paragraph [ref=f230e267]: A $30.00 filing fee is required for this exam. The required fee must accompany your application. Send or bring check or money order made payable to Erie County Personnel Department and write the examination number(s) on your check or money order. Do not send or bring cash, as the County cannot be responsible for cash payment. As no refund will be made, you are urged to compare your qualifications carefully with the requirements for admission and file only for those examinations for which you are clearly qualified.
              - paragraph [ref=f230e268]: "APPLICATION FEE WAIVER: A waiver of application fee will be allowed if you are unemployed and primarily responsible for the support of a household. In addition, a waiver of application fee will be allowed if you are determined eligible for Medicaid, or receiving Supplemental Security Income payments, or Public Assistance (Temporary Assistance for Needy Families/Family Assistance or Safety Net Assistance) or are certified Job Training Partnership Act/Workforce Investment Act eligible through a State or local social service agency."
              - paragraph [ref=f230e269]:
                - text: "All claims for application fee waiver are subject to verification. If you can verify eligibility for application fee waiver, complete a “Request for Application Fee Waiver and Certification: form and submit it with your application by the close of business on the Application Deadline as listed on the Examination Announcement. The form is available at the Erie County Personnel Department, 95 Franklin Street, Buffalo, NY (Room 604) or can be found on the County’s website at"
                - link "www.erie.gov" [ref=f230e270] [cursor=pointer]:
                  - /url: http://www.erie.gov/
                - text: ", “Civil Service Exams”, then “How to Apply”."
              - paragraph [ref=f230e271]: This examination is prepared and rated by the New York State Department of Civil Service, and held in compliance with the New York State Civil Service Law and the rules and regulations of the New York State Department of Civil Service.
