                - heading "Description" [level=3] [ref=f557e101]
                - paragraph [ref=f557e103]:
                  - paragraph [ref=f557e104]:
                    - text: The American Library Association (ALA) is seeking an experienced, organized
                    - strong [ref=f557e105]: Program Manager
                    - text: to support strategic initiatives for its Public Library Association (PLA) division. Working with the Deputy Director and with staff, external partners, and consultants, this grant-funded position will manage a range of programs for PLA’s expanding program/partnership portfolio. Programs address ongoing and emerging public library service areas, helping public libraries become more responsive to and reflective of community needs.
                  - paragraph [ref=f557e106]: At ALA, you will play a key role in delivering impactful programs that support public libraries and communities nationwide. This position offers the opportunity to grow your strategic and organizational expertise, while contributing to a mission-driven organization.
                  - paragraph [ref=f557e107]:
                    - strong [ref=f557e108]: "Responsibilities include:"
                  - list [ref=f557e109]:
                    - listitem [ref=f557e110]: Creating processes, procedures, and workplans for existing and emerging PLA programs, grants, and initiatives as assigned
                    - listitem [ref=f557e111]: Developing content for special projects, presentations, and initiatives in coordination with members, staff, external partners, and consultants
                    - listitem [ref=f557e112]: Effectively communicating the value of engagement with PLA and public libraries to advance shared goals with diverse stakeholders
                    - listitem [ref=f557e113]: Managing complex contracts, RFPs, workflows, and relationships
                    - listitem [ref=f557e114]: Developing, managing, and tracking budgets
                    - listitem [ref=f557e115]: Grant writing and reporting
                    - listitem [ref=f557e116]: Developing and executing evaluation and impact assessment strategies
                    - listitem [ref=f557e117]: Overseeing the work of internal and external stakeholders to meet deadlines
                    - listitem [ref=f557e118]: Researching, identifying, and reaching out to potential new partners to grow programs, resources, and membership
                    - listitem [ref=f557e119]: Serving as liaison to stakeholder groups as assigned, including volunteer management and funder engagement
                  - paragraph [ref=f557e120]: This is a regular full-time position based in our Chicago office.
                  - paragraph [ref=f557e121]: ALA staff are currently working on a hybrid schedule. Please note that although we have a generous telecommuting policy for our employees, we do not have fully remote positions outside of our workplace sites.
                  - paragraph [ref=f557e122]: All offers of employment are contingent upon satisfactory completion of a background check and proof of eligibility to work in the United States.
                  - paragraph [ref=f557e123]:
                    - strong [ref=f557e124]: Salary & Benefits
                  - paragraph [ref=f557e125]:
                    - text: Starting salary range is negotiable from
                    - strong [ref=f557e126]: $75k
                    - text: based on relevant experience. ALA offers an excellent benefits package that includes flexible work schedules, medical and dental coverage, generous paid time off, a retirement annuity, and a 35-hour work week. You may also qualify for the Public Service Loan Forgiveness Program (PSLF).
                  - paragraph [ref=f557e127]:
                    - strong [ref=f557e128]: For Consideration
                  - paragraph [ref=f557e129]:
                    - generic [ref=f557e130]:
                      - text: Apply online including a cover letter and resume at
                      - link "https://www.ala.org/aboutala/contactus/workatala" [ref=f557e131] [cursor=pointer]:
                        - /url: https://www.ala.org/aboutala/contactus/workatala
                  - paragraph [ref=f557e132]:
                    - strong [ref=f557e133]: Requirements
                  - list [ref=f557e134]:
                    - listitem [ref=f557e135]: Demonstrated project management experience with on-time and on-budget results
                    - listitem [ref=f557e136]: Outstanding written and verbal communication skills
                    - listitem [ref=f557e137]: Expertise in relationship building and collaboration
                    - listitem [ref=f557e138]: Strong organizational abilities and attention to detail
                    - listitem [ref=f557e139]: Excellent judgment, strategic thinking, and problem-solving skills that demonstrate a proactive and curious approach to workplace challenges
                    - listitem [ref=f557e140]: Demonstrated grant writing and grant management experience
                    - listitem [ref=f557e141]: Excellent budget development and management skills
                    - listitem [ref=f557e142]: Nonprofit or association management experience, or experience working with volunteer membership organizations
                    - listitem [ref=f557e143]: Ability to work independently and within a team; familiarity with matrixed workplace structure
                    - listitem [ref=f557e144]: Experience with a variety of project management and productivity tools, including proficiency in Microsoft Office 365
                    - listitem [ref=f557e145]: Up to 5% travel may be required for this position
                  - paragraph [ref=f557e146]:
                    - strong [ref=f557e147]: Preferred but not Required
                  - list [ref=f557e148]:
                    - listitem [ref=f557e149]: Supervisory experience
                    - listitem [ref=f557e150]: Public speaking experience
                    - listitem [ref=f557e151]: Experience with donor engagement/funder management tools such as Foundant
                    - listitem [ref=f557e152]: Knowledge and understanding of public librarianship and education trends
                  - paragraph [ref=f557e153]:
                    - strong [ref=f557e154]: Additional Information
                  - list [ref=f557e155]:
                    - listitem [ref=f557e156]: This position is funded through a grant that enables the Association to expand and enhance its programs and services. We are seeking a candidate who is passionate about our mission and excited to contribute to the long-term success of this initiative. Employment is contingent upon the continued availability of grant funding.
