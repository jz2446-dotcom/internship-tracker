      - generic [ref=f1512e39]:
        - paragraph [ref=f1512e40]: The Walker Art Center empowers people to experience the transformative possibilities of the art and ideas of our time and to imagine the world in new ways. In our over 125-year history, we have become one of the most celebrated art museums in the country and we are known for our innovative presentations and acclaimed collections of contemporary art across the spectrum of the visual, performing, and media arts.
        - paragraph [ref=f1512e41]: The Annual Giving Officer plays an essential role in strengthening and expanding the community of annual donors who support the Walker Art Center. Reporting to the Director of Annual Giving and Operations, this position works closely with the Development and Membership team, Board Philanthropy Committee, and trustees to deepen engagement with donors and grow the Walker’s Contributing Member ($250+) and Circle ($2,500+) giving programs. The role emphasizes donor acquisition, renewal retention and upgrade strategy, stewardship, and event-based cultivation
        - paragraph [ref=f1512e42]:
          - strong [ref=f1512e43]: WHAT YOU GET TO DO
        - paragraph [ref=f1512e44]: I. Annual Giving Program Strategy and Execution
        - list [ref=f1512e45]:
          - listitem [ref=f1512e46]: Own a portfolio of mid-level members and prospects, managing solicitation, renewal, stewardship, follow-up, and Tessitura activity tracking, while qualifying prospects for acquisition, increased giving, major gift potential, or planned giving opportunities in coordination with Major Giving Officers.
          - listitem [ref=f1512e47]: Steward Contributing and Circle Members through thoughtful written communications, prospecting meetings, event follow-up, and ongoing donor engagement that deepens their connection to the Walker.
          - listitem [ref=f1512e48]: Support the Director of Annual Giving and Operations in developing annual giving strategies and execute related work in partnership with the Membership.
          - listitem [ref=f1512e49]: Partner with the Board Philanthropy Committee, trustees, Membership team, Prospect Research, and Development colleagues to identify prospects for acquisition, upgrade solicitations, major giving potential, and planned giving portfolios.
          - listitem [ref=f1512e50]: Track, analyze, and report on appeal performance, stewardship, and retention efforts, using results to refine strategies and identify new opportunities.
        - paragraph [ref=f1512e51]: II. Event Activation and Prospect Engagement
        - list [ref=f1512e52]:
          - listitem [ref=f1512e53]: Partner with the Events and Stewardship Associate on our Curators Council event strategy and execution, including invitation tactics, prospecting opportunities, donor engagement, and post-event follow-up.
          - listitem [ref=f1512e54]: Partner with the Events and Stewardship Associate to execute our cultivation events, including Director Office Cultivation events, Art Storage tours, and other cultivation and stewardship opportunities.
          - listitem [ref=f1512e55]: Attend and support Development and membership events to build donor relationships, support prospect engagement, and strengthen connections between donors and the Walker’s programs.
          - listitem [ref=f1512e56]: Support Board and trustee participation in event-based prospecting, cultivation, and follow-up as part of annual giving acquisition and advancement strategies.
          - listitem [ref=f1512e57]: Join other Walker colleagues in supporting the Director of Benefit Events in the planning and execution of Avant Garden, the Walker’s annual benefit.
        - paragraph [ref=f1512e58]: III. Reporting and Analysis
        - list [ref=f1512e59]:
          - listitem [ref=f1512e60]: Review annual giving renewal, stewardship, and solicitation schedules, tracking, and reporting systems.
          - listitem [ref=f1512e61]: Partner with Prospect Research and other relevant colleagues to pull, reconcile, and summarize reports related to annual giving, membership, and donor pipeline activity.
          - listitem [ref=f1512e62]: Pull reports and summarize data for annual Institutional Development reports, and Board activity reports related to annual giving.
        - paragraph [ref=f1512e63]: IV. Other Duties
        - list [ref=f1512e64]:
          - listitem [ref=f1512e65]: Stay informed of best practices in annual giving, membership, and donor engagement.
          - listitem [ref=f1512e66]: Assist with budget and income forecasting for annual giving and membership revenue.
          - listitem [ref=f1512e67]: Participate in cross-departmental meetings and projects as assigned.
          - listitem [ref=f1512e68]: Assist with other departmental duties as needed.
        - paragraph [ref=f1512e69]:
          - strong [ref=f1512e70]: WHAT WE NEED IN YOU
        - paragraph [ref=f1512e71]:
          - strong [ref=f1512e72]: Minimum Requirements
        - list [ref=f1512e73]:
          - listitem [ref=f1512e74]: 3+ years of experience working in fundraising, membership, or philanthropy.
          - listitem [ref=f1512e75]: Strong interpersonal and relationship management skills.
          - listitem [ref=f1512e76]: Excellent written and oral communication skills.
          - listitem [ref=f1512e77]: Strong project management, organization, time management, and attention-to-detail skills.
          - listitem [ref=f1512e78]: High degree of initiative, discretion, and ability to maintain confidentiality.
          - listitem [ref=f1512e79]: Experience using a CRM database for donor tracking, reporting, and analysis.
          - listitem [ref=f1512e80]: Proficiency with Microsoft Office applications, including Word, Excel, PowerPoint, Outlook, and Adobe.
          - listitem [ref=f1512e81]: Ability to work evenings and weekends as needed to participate in and support events.
          - listitem [ref=f1512e82]: Valid, unrestricted driver's license required. Must be able to provide reliable transportation to travel between work locations as needed.
        - paragraph [ref=f1512e83]:
          - strong [ref=f1512e84]: Preferred Skills
        - list [ref=f1512e85]:
          - listitem [ref=f1512e86]: Experience working in a museum, arts, or nonprofit setting.
          - listitem [ref=f1512e87]: Experience supporting donor cultivation events, stewardship events, or event-based prospecting.
          - listitem [ref=f1512e88]: Bachelor’s degree or equivalent combination of education and experience.
        - paragraph [ref=f1512e89]:
          - strong [ref=f1512e90]: PHYSICAL DEMANDS
        - list [ref=f1512e91]:
          - listitem [ref=f1512e92]: Ability to lift and/or move print and event materials, approximately 15 pounds.
          - listitem [ref=f1512e93]: Ability to work at a desk and use a computer for prolonged periods.
        - paragraph [ref=f1512e94]:
          - strong [ref=f1512e95]: JOB SPECIFICATIONS
          - text: This position is considered full-time, exempt. As an exempt position, it is not eligible for overtime pay.
        - paragraph [ref=f1512e96]:
          - strong [ref=f1512e97]: BENEFITS
          - text: ": Medical, dental, and vision insurance; 403(b) retirement plan with employer contribution; paid vacation, sick time, and holidays."
        - paragraph [ref=f1512e98]: This position is not eligible for relocation assistance.
        - paragraph [ref=f1512e99]: All applicants must be eligible to work in the United States without the need for employer sponsorship.
        - paragraph [ref=f1512e100]:
          - strong [ref=f1512e101]: Walker’s DEI commitment
          - text: The Walker is committed to being an employer with a staff who, at all job levels, reflects the rich diversity of the communities and audiences we serve. We are dedicated to ensuring inclusion and equity in all our employment practices. We deeply value and welcome all the unique lived experiences in our applicants and encourage anyone meeting the minimum requirements to apply.
        - paragraph [ref=f1512e102]:
          - strong [ref=f1512e103]: Recruitment Timeline
          - text: All positions are open until filled.
        - paragraph [ref=f1512e104]:
          - strong [ref=f1512e105]: E-Verify Participation Notice
