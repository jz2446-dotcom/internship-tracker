  - main [ref=f366e99]:
    - generic [ref=f366e100]:
      - heading "Careers" [level=1] [ref=f366e109]
      - generic [ref=f366e114]:
        - heading "Programming Professional" [level=2] [ref=f366e116]
        - generic [ref=f366e117]:
          - paragraph [ref=f366e118]: The James V. Brown Library is seeking an imaginative and passionate Programming Professional to join our team. The candidate should possess a desire to plan and facilitate programming for all ages. This position requires an individual to work independently and as part of a team.
          - paragraph [ref=f366e119]: This is a half-time position (20-30 hrs/week) with the expectation of working some nights and Saturdays when scheduled programs occur. Experience in working with the public is preferred. Salary range is $18.00 – $23.00 per hour, depending on qualifications. A job description and application can be found at www.jvbrown.edu. Please respond by August 14 with a letter of interest, resume, and application to kconfer@jvbrown.edu.
          - paragraph [ref=f366e120]: The James V. Brown Library is an equal-opportunity employer.
        - generic [ref=f366e121]:
          - link "Application" [ref=f366e123] [cursor=pointer]:
            - /url: /wp-content/uploads/2025/12/Application-for-Employment.pdf
          - link "Job Description" [ref=f366e127] [cursor=pointer]:
            - /url: https://jvbrown.edu/wp-content/uploads/2026/07/Programming-Professional-Part-Time-Job-Description.docx.pdf
        - heading "Development, Marketing, and Public Relations Director" [level=2] [ref=f366e131]
        - generic [ref=f366e132]:
          - paragraph [ref=f366e133]: "The James V. Brown Library is seeking a full-time (37.5 hours per week), Development, Marketing, and Public Relations Director to perform various tasks including but not limited to: maintaining and securing donor relationships, direct mail campaigns, special event planning and coordination, securing sponsorships, and seeking grants. This full-time position includes, health, vision, dental, life and long-term benefits, paid time off and participation in the 403(b)-retirement plan."
          - paragraph [ref=f366e134]: The ideal candidate for this position will have excellent communication skills and accuracy in their work, a customer service attitude, and must be able to maintain confidentiality in donations and gifts to the Library. They should be proficient with G-Suite and have familiarity with the use of social media in marketing. Experience with donation software preferred. The salary range is $60,000-$72,000 annually and has a typical schedule of 9AM – 5 PM, M – F with evenings and weekends for event purposes.
          - paragraph [ref=f366e135]:
            - text: Cover letters and resumes should be submitted to
            - strong [ref=f366e136]: Karen Confer at kconfer@jvbrown.edu
            - text: First consideration of applications received by August 14th with final review on August 31st.
          - paragraph [ref=f366e137]: The James V. Brown Library is EEO employer.
        - generic [ref=f366e138]:
          - link "Application" [ref=f366e140] [cursor=pointer]:
            - /url: /wp-content/uploads/2025/12/Application-for-Employment.pdf
          - link "Job Description" [ref=f366e144] [cursor=pointer]:
            - /url: https://jvbrown.edu/wp-content/uploads/2026/07/Development-Marketing-and-Public-Relations-Director-2026-final.pdf
        - paragraph [ref=f366e148]:
