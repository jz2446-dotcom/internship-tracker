    - article [ref=e58]:
      - generic [ref=e59]:
        - heading "About Watershed" [level=2] [ref=e60]
        - paragraph [ref=e61]:
          - link "Watershed" [ref=e62] [cursor=pointer]:
            - /url: https://watershed.com/
          - text: is the enterprise sustainability platform. Companies like Airbnb, Carlyle Group, FedEx, Visa, and Dr. Martens use Watershed to manage climate and ESG data, produce audit-ready metrics for voluntary and regulatory reporting including CSRD, and drive real decarbonization. We are looking for team members who love product-building, want to work hard at a mission-oriented startup, and will collaborate with us in shaping the culture of a growing team.
        - paragraph
        - paragraph [ref=e63]: We have offices in San Francisco, New York, Denver, London, Paris, Berlin, Sydney, Mexico City, and remote team members across the US and Europe. We hope that you'll be interested in joining us!
        - paragraph
        - heading "The role" [level=2] [ref=e64]
        - paragraph [ref=e65]:
          - text: We are seeking a
          - strong [ref=e66]: Corporate strategic finance manager
          - text: to own our corporate financial model and serve as the primary finance partner to our Product, Business Foundation and Executive teams. This role reports to our Head of Strategic Finance.
        - paragraph
        - paragraph [ref=e67]: You will not just be reporting the news; you will be making it. You will play a critical role in our Annual strategic and financial planning processes, owning our financial operating plans, tracking core metrics, and ensuring our capital allocation supports our aggressive growth targets.
        - paragraph
        - paragraph [ref=e68]:
          - strong [ref=e69]: "What you'll do:"
        - list [ref=e70]:
          - listitem [ref=e71]:
            - paragraph [ref=e72]:
              - strong [ref=e73]: Corporate planning
              - text: ": own the integrated 3-statement financial model, rolling forecasts, and both the short and long-range financial planning processes"
          - listitem [ref=e74]:
            - paragraph [ref=e75]:
              - strong [ref=e76]: Product partnership
              - text: ": assist the Engineering, Product, Design and Science orgs in executing on strategy while driving operating efficiencies within our R&D organization"
          - listitem [ref=e77]:
            - paragraph [ref=e78]:
              - strong [ref=e79]: Customer partnership
              - text: ": partner closely with the customer org to drive optimal resource allocation vs product demand to drive improvements to gross margins"
          - listitem [ref=e80]:
            - paragraph [ref=e81]:
              - strong [ref=e82]: Cash forecasting
              - text: ": partner directly with RevOps and Accounting to build and own the cash model for capital allocation"
          - listitem [ref=e83]:
            - paragraph [ref=e84]:
              - strong [ref=e85]: Headcount, opex & gross margin % management
              - text: ": collaborate with department heads to manage hiring, roadmaps and optimal resource allocation. Gross Margin % will be a key metric that you own and you will work closely with our Customer and Infrastructure teams"
          - listitem [ref=e86]:
            - paragraph [ref=e87]:
              - strong [ref=e88]: Corporate & board reporting
              - text: ": partner with Accounting on month-end close and Exec reporting. Responsible for owning the calculation and a key contributor in driving improvements in core SaaS metrics (Gross Margin %, Magic Number, Cash burn multiple, Rule of 40)"
          - listitem [ref=e89]:
            - paragraph [ref=e90]:
              - strong [ref=e91]: Strategic projects
              - text: ": provide analytical support for pricing and packaging, potential M&A or new market or product expansion scenarios"
        - paragraph [ref=e92]:
          - strong [ref=e93]: "You might be a fit if you have:"
        - list [ref=e94]:
          - listitem [ref=e95]:
            - paragraph [ref=e96]:
              - strong [ref=e97]: Experience
              - text: ": 6-8+ years of experience in FP&A, Strategic Finance, or Investment Banking/Private Equity, with at least 2+ years operating inside a high-growth B2B SaaS company (Series B/C/D stage preferred)."
          - listitem [ref=e98]:
            - paragraph [ref=e99]:
              - strong [ref=e100]: Experience with
              - text: ": financial modeling, consolidations, P&L Management, forecasting, Budget vs Actuals, annual and long-range planning."
          - listitem [ref=e101]:
            - paragraph [ref=e102]:
              - strong [ref=e103]: SaaS DNA
              - text: ": deep understanding of enterprise software metrics and the mechanics of recurring revenue business models."
          - listitem [ref=e104]:
            - paragraph [ref=e105]:
              - strong [ref=e106]: Business partnering
              - text: ": proven ability to communicate complex financial concepts to non-financial leaders and push back strategically when necessary."
          - listitem [ref=e107]:
            - paragraph [ref=e108]:
              - strong [ref=e109]: Systems knowledge
              - text: ": experience extracting and analyzing data from CRMs (Salesforce), ERPs (NetSuite), and HRIS systems (Rippling)."
        - paragraph
        - paragraph
        - paragraph
        - paragraph
        - paragraph [ref=e110]:
          - strong [ref=e111]: Must be willing to work from an office 4 days per week (except for remote roles)
        - paragraph [ref=e112]: Watershed has hub offices in San Francisco, New York, London, and Mexico City and satellite offices in Denver, Sydney, Paris, and Berlin. Where we have offices, employees are expected to be in office for 4 days per week. Certain jobs are open to being remote and will be specifically noted on the jobs page and in the job description if so.
        - paragraph
        - paragraph [ref=e113]:
          - strong [ref=e114]: What’s the interview process like?
        - paragraph [ref=e115]: "It starts the same for every candidate: getting to know the team members through 1 to 2 conversations about Watershed, your experience, and your interests. Next steps can vary by role, but usual next steps are a skill or experience interview (e.g. a coding interview for an engineer, a portfolio review for a designer, deeper experience call for other roles) which leads to a virtual or in person interview panel. We prioritize transparency and lack of surprise throughout the process."
        - paragraph
        - paragraph [ref=e116]:
          - strong [ref=e117]: What if I need accommodations for my interview?
        - paragraph [ref=e118]: At Watershed, we are dedicated to ensuring an inclusive recruitment process. We provide reasonable accommodations for candidates with disabilities, long-term conditions, mental health needs, religious observances, neurodivergence, or pregnancy-related support requirements. If you need assistance during your process, please contact your recruiter.
        - paragraph
