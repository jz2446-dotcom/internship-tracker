            - generic [ref=f316e49]:
              - paragraph [ref=f316e50]:
                - text: Do you value Teamwork, Integrity, Innovation, and Professionalism? If so, then the City of San Antonio would love for you to join our diverse team of more than 11,000 hardworking, dedicated, and talented employees who work every day to make San Antonio a great place to live, work, and play for its more than 1.4 million residents. As a team member, you will have the opportunity to grow and develop professionally. Full Time team members will also be supported by our
                - link [ref=f316e51] [cursor=pointer]:
                  - /url: http://www.sanantonio.gov/HR/EmployeeBenefits.aspx
                  - text: comprehensive benefits package
                - text: ", which includes a competitive salary, subsidized health care benefits, paid leave, retirement benefits, an award-winning Employee Wellness Program, training, and a tuition reimbursement program."
              - paragraph [ref=f316e52]
              - paragraph [ref=f316e53]:
                - text: Take the first step to join our team by applying for one of the available career opportunities listed below.
                - strong [ref=f316e54]: INSTRUCTIONS
              - list [ref=f316e55]:
                - listitem [ref=f316e56]: Use the Search, Sort, and Filter functions below to find jobs that interest you.
                - listitem [ref=f316e57]: Apply online by clicking on the job title you are interested in below and then clicking on the "Apply" link.
                - listitem [ref=f316e58]: If this is the first time you are applying using our online job application process, you will need to create an account and select a User Name and Password.
                - listitem [ref=f316e59]: After your account has been established, you can upload your resume and follow the steps to create and submit an application. This application can be saved and used to apply for more than one job opening.
                - listitem [ref=f316e60]: It is important that your application show all the relevant education and experience you possess. Applications may be rejected if they are incomplete when submitted.
                - listitem [ref=f316e61]: If you do not see a current opening below that you are interested in, please fill out a Job Alert Card from the Menu to receive future notifications of open positions within selected categories.
              - paragraph [ref=f316e62]:
                - emphasis [ref=f316e63]: Online applications are stored on a secure site. Only authorized City of San Antonio Human Resources employees and hiring managers have access to the information submitted.
              - paragraph [ref=f316e64]:
                - strong [ref=f316e65]: GETTING HELP
                - text: Get more information and
                - link [ref=f316e66] [cursor=pointer]:
                  - /url: http://www.sanantonio.gov/hr/CareerCenter/HowToApply.aspx
                  - strong [ref=f316e67]: instructions on how to apply for a job
                - text: .
                - strong [ref=f316e68]: CUSTOMER SUPPORT - HELP DESK
                - text: For questions regarding problems experienced with the online application, please contact the Customer Support Help Desk Toll-free 855-524-5627 or 310-469-0515 (8:00 a.m. - 8:00 p.m., CST, Monday-Friday).
              - paragraph [ref=f316e69]
              - paragraph [ref=f316e70]:
                - strong [ref=f316e71]: NON-DISCRIMINATION INFORMATION
              - paragraph [ref=f316e72]: The City of San Antonio is an Equal Opportunity/Reasonable Accommodation Employer. The City has and will continue to provide equal employment opportunities to all qualified persons and reaffirms its commitment that there shall be no discrimination against or harassment of applicants or employees because of race, color, sex, religion, national origin, age, disability, veteran status, gender, identity, sexual orientation, or any other protected status. All individuals are encouraged to apply and compete for jobs with the City of San Antonio.
              - paragraph [ref=f316e73]:
                - text: Any candidate who has a need for a reasonable accommodation to participate in the recruitment and interview process can contact the Human Resources Department at
                - link [ref=f316e74] [cursor=pointer]:
                  - /url: mailto:AskHR@sanantonio.gov
                  - text: AskHR@sanantonio.gov
                - text: or 210-207-8705. If a candidate needs an accommodation to perform the position they are selected for, they can contact the Human Resources Department after an offer has been extended.
