              - generic [ref=e128]:
                - generic [ref=e137]:
                  - heading "Engineering & IT" [level=3] [ref=e140]
                  - paragraph [ref=e142]: Our Engineering and IT internships offer hands-on experience in cutting-edge technology development and enterprise solutions. Take on roles in software development, system architecture, electrical design, or cybersecurity. Ideal for students majoring in Computer Science, Electrical Engineering, or related fields, this program empowers you to build skills through real-world projects, such as innovating in cloud applications, designing automation tools, or enhancing IT infrastructure.
                - generic [ref=e152]:
                  - heading "Supply Chain" [level=3] [ref=e155]
                  - paragraph [ref=e157]: With Dell Technologies' Supply Chain internships, you’ll work on optimizing one of the most advanced operations networks in the industry. Interns gain exposure to inventory management, demand forecasting, and logistics planning. Open to students from majors like Supply Chain Management, Industrial Engineering, or Operations Management, this program prepares you to make a meaningful impact in sourcing and supply-chain efficiencies.
                - generic [ref=e167]:
                  - heading "Sales" [level=3] [ref=e170]
                  - paragraph [ref=e172]: Our Sales internships are designed for communicators who love the blend of technology and relationship building. Learn from seasoned mentors, develop client-driven solutions, and become an expert in sales strategies. This program is well suited for students studying Marketing, Business Administration, or related fields, offering real-world experience in delivering value-driven technology to customers worldwide.
                - generic [ref=e182]:
                  - heading "Finance" [level=3] [ref=e185]
                  - paragraph [ref=e187]: Our Finance internships allow you to explore the financial backbone of a global technology leader. Collaborate on strategic projects in areas like financial planning, treasury, and business analysis, while developing a strong foundation in corporate finance. Ideal for Finance, Accounting, or Economics majors, this program provides real-world scenarios to apply classroom learning.
                - generic [ref=e197]:
                  - heading "Human Resources" [level=3] [ref=e200]
                  - paragraph [ref=e202]: Join our HR internships to shape and support Dell Technologies' vibrant workplace culture. Learn through real-world projects in talent acquisition, organizational development, or compensation planning. Students majoring in Human Resources, Psychology, or Business Management will thrive as they contribute to initiatives that make our global workforce stronger.
                - generic [ref=e212]:
                  - heading "Marketing" [level=3] [ref=e215]
                  - paragraph [ref=e217]: Push boundaries with our Marketing internships, where creativity meets data to drive impactful campaigns. Work on digital marketing strategies, social media management, global events, or content creation. This program is great for students in Marketing, Advertising, Communications, or a related field who want hands-on experience shaping a global technology brand’s story.
                - generic [ref=e227]:
                  - heading "Cybersecurity" [level=3] [ref=e230]
                  - paragraph [ref=e232]: Support our mission to keep data secure in our Security & Resiliency Organization (SRO) internships. Tackle challenges in cybersecurity, governance, risk management, and compliance. These programs provide great experience to those majoring in Computer Science, Information Systems, or related fields. This program enables you to defend against real-world threats and sharpen your expertise with a technology leader.
              - generic [ref=e234]:
                - heading "Are you ready to take the next step?" [level=2] [ref=e240]
