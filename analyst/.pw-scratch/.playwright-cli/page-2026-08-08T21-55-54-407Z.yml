                - paragraph [ref=e70]: EARLY IN CAREER
                - heading "Internships" [level=1] [ref=e72]
                - paragraph [ref=e74]: At Dell Technologies, we have the boldest and most visionary minds. We are always looking for the next generation of innovative thinkers to drive humanity forward.
              - generic [ref=e80]:
                - heading "Launch your career with us" [level=2] [ref=e82]
                - paragraph [ref=e84]: Through apprenticeships, internships, or co-ops, you'll gain critical experience, build core skills, work on impactful projects, and create strong networks to position you for career success.
                - link "View Internship Opportunities" [ref=e87] [cursor=pointer]:
