              - generic [ref=e93]:
                - heading "“Experiential learning is an educational approach that emphasizes learning through direct experience and active engagement with the subject matter. It promotes active engagement, real-world application, retention, critical thinking, motivation, collaboration, and adaptability.”" [level=5] [ref=e95]
