      - generic [ref=f17e66]:
        - heading "About Us" [level=2] [ref=f17e67]
        - generic [ref=f17e68]:
          - paragraph [ref=f17e69]: Evercore is the world's leading independent investment banking advisory firm, consistently ranked as the top M&A advisor globally by deal count. Founded in 1995 and headquartered in New York City, Evercore provides strategic advisory, restructuring, capital markets, and equities services to corporations, financial sponsors, and institutional investors across the Americas, Europe, and Asia. The firm employs over 2,000 professionals and is publicly traded on the NYSE.
          - paragraph
          - paragraph [ref=f17e70]: For candidates who want to work on the most complex, high-profile M&A and restructuring transactions in the world, with direct access to senior bankers and a culture built around advisory excellence rather than balance sheet lending, Evercore is widely regarded as one of the best places to start and build an investment banking career.
          - paragraph
          - heading "About Evercore" [level=3] [ref=f17e71]
          - paragraph
          - paragraph [ref=f17e72]: Evercore was founded by Roger Altman, a former Deputy Secretary of the US Treasury, with the explicit goal of building a conflict-free advisory firm unencumbered by the lending relationships and proprietary activities that influence advice at large universal banks. That independence is the firm's defining characteristic and primary selling point to clients.
          - paragraph
          - paragraph [ref=f17e73]: Evercore has advised on some of the largest and most complex transactions in recent decades, including major technology M&A deals, cross-border transactions, contested situations, and landmark restructurings. The firm is particularly recognized for its Restructuring and Liability Management practice, its Shareholder Defense and Activism advisory capability -- widely considered the leading franchise of its kind globally -- and its Private Capital Advisory business.
          - paragraph
          - heading "Types of Roles at Evercore" [level=3] [ref=f17e74]
          - paragraph
          - paragraph [ref=f17e75]:
            - strong [ref=f17e76]: Investment Banking Analyst and Associate
            - text: The core entry track. Analysts and associates work on M&A advisory, liability management, capital markets advisory, and private capital fundraising across industry coverage groups including technology, healthcare, financial sponsors, consumer, industrials, and real estate. Evercore runs lean deal teams, which means analysts and associates get significant deal responsibility and client exposure early. The firm pairs each summer intern with both a peer mentor and a senior banker. Browse open
            - link "investment banking jobs" [ref=f17e77] [cursor=pointer]:
              - /url: /jobs/investment-bank
            - text: on Wall Street Careers.
          - paragraph
          - paragraph [ref=f17e78]:
            - strong [ref=f17e79]: Restructuring and Liability Management
            - text: Evercore's Restructuring (RX) group is one of the most prestigious in the industry, advising companies, creditors, and sponsors on in-court and out-of-court restructurings, liability management transactions, and distressed situations. RX is considered the hardest interview track at Evercore and requires deep knowledge of credit, capital structure, and bankruptcy concepts. Candidates from leveraged finance or credit backgrounds are strongly preferred. See open
            - link "credit and restructuring jobs" [ref=f17e80] [cursor=pointer]:
              - /url: /jobs/credit-analyst
            - text: .
          - paragraph
          - paragraph [ref=f17e81]:
            - strong [ref=f17e82]: Strategic Defense and Shareholder Advisory
            - text: Evercore's Strategic Defense team is the leading activist defense and M&A advisory practice globally, advising boards on hostile takeover defense, corporate governance, and shareholder engagement. This is a highly specialized and prestigious group within the firm.
          - paragraph
          - paragraph [ref=f17e83]:
            - strong [ref=f17e84]: Equities Research, Sales and Trading
            - text: Evercore's Equities business provides institutional investors with equity research, sales coverage, and trading execution. Research analysts cover sectors including technology, healthcare, consumer, and financials, producing differentiated research free of underwriting conflicts. See open
            - link "equity research jobs" [ref=f17e85] [cursor=pointer]:
              - /url: /jobs/equity-research
            - text: .
          - paragraph
          - paragraph [ref=f17e86]:
            - strong [ref=f17e87]: Wealth Management
            - text: Evercore Wealth Management serves ultra-high-net-worth individuals and families with investment management, financial planning, and estate planning services. This is a separate business from the investment banking division. See open
            - link "wealth management jobs" [ref=f17e88] [cursor=pointer]:
              - /url: /jobs/asset-management
            - text: .
          - paragraph
          - heading "Evercore Salaries and Compensation (2026)" [level=3] [ref=f17e89]
          - paragraph
          - paragraph [ref=f17e90]: Evercore pays at the very top of the investment banking market. The firm matches or exceeds bulge bracket compensation at every level, and analysts rate compensation satisfaction at 5 out of 5 on Glassdoor -- one of the highest scores of any investment bank. This reflects both base salaries and bonuses that consistently rank at the top of the street.
          - paragraph
          - paragraph [ref=f17e91]:
            - strong [ref=f17e92]: "1st Year Investment Banking Analyst:"
            - text: $110,000 base; total compensation approximately $170,000 to $215,000
            - strong [ref=f17e93]: "2nd Year Analyst:"
            - text: $115,000 to $125,000 base; total compensation approximately $230,000 to $270,000
            - strong [ref=f17e94]: "3rd Year Analyst:"
            - text: total compensation approximately $280,000 to $330,000
            - strong [ref=f17e95]: "1st Year Associate (Post-MBA):"
            - text: $175,000 base; total compensation approximately $250,000 to $350,000+
            - strong [ref=f17e96]: "Vice President:"
            - text: total compensation $350,000 to $500,000+
            - strong [ref=f17e97]: "Senior Managing Director:"
            - text: $500,000 to $1,500,000+ total compensation
            - strong [ref=f17e98]: "Summer Analyst:"
            - text: approximately $9,200 per month
          - paragraph
          - paragraph [ref=f17e99]:
            - text: For context on investment banking compensation across the industry, see the
            - link "Investment Banking Analyst Salary Guide 2026" [ref=f17e100] [cursor=pointer]:
              - /url: /blog/investment-banking-analyst-salaries-2026
            - text: .
          - paragraph
          - heading "Evercore Interview Process" [level=3] [ref=f17e101]
          - paragraph
          - paragraph [ref=f17e102]: Evercore's interview process is considered among the most technically demanding of any elite boutique. The firm recruits 1.5 years in advance for summer analyst roles, meaning applications for summer 2027 open in early 2026. Missing early deadlines significantly reduces chances of getting an offer.
          - paragraph
          - paragraph [ref=f17e103]:
            - strong [ref=f17e104]: Step 1 -- Application and screening.
            - text: "Apply through the Evercore careers portal. Campus recruiting targets a focused set of universities including Wharton, Harvard, Princeton, Yale, and Michigan Ross. The firm also runs diversity programs with earlier deadlines (typically January to February) and earlier Superdays (March to April). Note: Evercore limits candidates to two applications per year across different positions or locations."
          - paragraph
          - paragraph [ref=f17e105]:
            - strong [ref=f17e106]: Step 2 -- First round interviews.
            - text: Typically one or two 30-minute interviews with an analyst and associate. The overwhelming majority of the time is spent on technicals, with minimal behavioral questions beyond "tell me about yourself" and "why Evercore." Evercore's technicals are substantially harder than standard investment banking prep -- expect complex merger math, accretion/dilution questions with curveballs (PIK interest, unusual tax structures), LBO mechanics, and capital structure questions. For RX roles, expect deep questions on distressed debt, restructuring mechanics, and specific recent deals.
          - paragraph
          - paragraph [ref=f17e107]:
            - strong [ref=f17e108]: Step 3 -- Superday.
            - text: An in-person final round in New York with four to six 30-minute interviews, including MDs. Mix of behavioral and technical, still leaning heavily toward technicals. Some groups include a two-hour LBO modeling or case exercise. Offers are typically extended within one day of the Superday. The process takes an average of 16 days from first round to offer for analyst roles.
          - paragraph
          - paragraph [ref=f17e109]:
            - strong [ref=f17e110]: "Key preparation advice:"
            - text: Know recent Evercore deals in detail, particularly in the group you are interviewing with. Be able to discuss a specific restructuring transaction in depth for RX. The "why boutique" and "why lean deal team" questions need specific, well-developed answers -- generic answers are noticed and penalized.
          - paragraph
          - heading "Evercore Office Locations" [level=3] [ref=f17e111]
          - paragraph
          - paragraph [ref=f17e112]:
            - strong [ref=f17e113]: New York, NY
            - text: "-- Global headquarters and primary banking hub. The vast majority of investment banking recruiting is for New York roles."
            - strong [ref=f17e114]: San Francisco / Menlo Park, CA
            - text: "-- Technology banking coverage."
            - strong [ref=f17e115]: Houston, TX
            - text: "-- Energy banking."
            - strong [ref=f17e116]: London, UK
            - text: "-- European M&A and capital markets."
            - strong [ref=f17e117]: Frankfurt, Munich, Paris, Madrid, Milan
            - text: "-- European coverage offices."
            - strong [ref=f17e118]: Hong Kong, Tokyo
            - text: "-- Asia-Pacific advisory."
          - paragraph
          - heading "Frequently Asked Questions" [level=3] [ref=f17e119]
          - paragraph
          - paragraph [ref=f17e120]:
            - strong [ref=f17e121]: Is Evercore an elite boutique?
            - text: Yes. Evercore is widely considered one of the top two or three elite boutique investment banks globally, alongside Lazard and PJT Partners. Elite boutiques are pure advisory firms with no lending or trading businesses, which means their advice to clients is free of the conflicts that can influence recommendations at universal banks. Evercore consistently ranks first or second globally in M&A advisory by deal count.
          - paragraph
          - paragraph [ref=f17e122]:
            - strong [ref=f17e123]: How does Evercore compare to Goldman Sachs or Morgan Stanley?
            - text: "Evercore pays as well or better than Goldman and Morgan Stanley at the analyst and associate level, and the deal quality is comparable on advisory mandates. The key differences: Evercore has no sales and trading, no lending, and no asset management, meaning career paths are narrower but the focus is sharper. Analysts at Evercore work on fewer, more complex deals rather than a higher volume of smaller transactions. Exit opportunities to top PE funds and hedge funds are comparable or better than bulge bracket peers."
          - paragraph
          - paragraph [ref=f17e124]:
            - strong [ref=f17e125]: What are typical exit opportunities from Evercore?
            - text: Evercore analysts place exceptionally well into private equity, with strong representation at KKR, Blackstone, Apollo, Carlyle, and other top funds. The restructuring group places into distressed credit funds and special situations PE. Harvard Business School and Wharton are the most common destinations for those pursuing an MBA. The lean team culture and deal complexity means Evercore analysts are highly sought after by buyside recruiters.
          - paragraph
          - paragraph [ref=f17e126]:
            - strong [ref=f17e127]: What is the Evercore Summer Apprenticeship Program?
            - text: The 10-week Summer Apprenticeship Program places summer analysts and associates directly into industry coverage and product groups working on live transactions. Each intern is paired with a peer mentor and a senior banker. The program is structured to provide real deal experience rather than busywork. Conversion rates from summer to full-time are high for strong performers.
          - paragraph
          - paragraph [ref=f17e128]:
            - strong [ref=f17e129]: Does Evercore recruit internationally?
            - text: Yes, with caveats. Evercore files H-1B sponsorship petitions for international candidates but the lottery-based US visa process introduces uncertainty. The London and EMEA offices are more accessible for international candidates without US work authorization. Evercore's website notes that international candidates are encouraged to apply and that H-1B sponsorship is considered on a case-by-case basis.
