        - heading "Volunteer Opportunities" [level=2] [ref=f645e106]
        - paragraph [ref=f645e107]:
          - text: There are many interesting and rewarding ways to volunteer your time and services at the FDR Presidential Library. Read about the following volunteer roles and then contact Cliff Laube, Public Programs Specialist by telephone at (845) 486-7745 or by email at
          - link "clifford.laube@nara.gov" [ref=f645e108] [cursor=pointer]:
            - /url: mailto:clifford.laube@nara.gov
          - text: to get involved.
        - paragraph [ref=f645e109]:
          - text: Please see
          - link "Donate" [ref=f645e110] [cursor=pointer]:
            - /url: /donate
          - text: for more information about providing financial or material support for the Library.
        - paragraph [ref=f645e111]:
          - strong [ref=f645e112]: "Museum Docent:"
          - text: Guide our visitors through our special temporary exhibitions.
        - paragraph [ref=f645e113]:
          - strong [ref=f645e114]: "Museum Greeter:"
          - text: Welcome museum visitors and provide general information about the exhibition galleries.
        - separator [ref=f645e115]
        - heading "Membership" [level=2] [ref=f645e116]
        - paragraph [ref=f645e117]: The FDR Library & Museum is administered by the National Archives and Records Administration with the support of its nonprofit partner, the Roosevelt Institute.
