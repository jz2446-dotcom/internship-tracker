              - paragraph [ref=f217e122]: Interested in working at the Library this summer? We are accepting applicants for our summer internship.
              - paragraph
              - paragraph [ref=f217e123]:
                - text: "Our internship is in conjunction with Youth Opportunities Unlimited. You can apply here:"
                - link "https://www.youthopportunities.org/syep" [ref=f217e124] [cursor=pointer]:
                  - /url: "%20https://www.youthopportunities.org/syep"
                - text: .
              - paragraph [ref=f217e125]:
                - text: "The eligibility requirements are here:"
                - link "https://www.youthopportunities.org/faqs-eligibility" [ref=f217e126] [cursor=pointer]:
                  - /url: https://www.youthopportunities.org/faqs-eligibility
                - text: .
              - paragraph [ref=f217e127]: You must be at least 14 years old (or turning 14 by June 1st).
              - paragraph [ref=f217e128]: You must apply through Youth Opportunities Unlimited for consideration.
              - paragraph
              - paragraph [ref=f217e129]:
                - emphasis [ref=f217e131]: After
                - text: completing your application, please email
                - link "bforsberg@cuyahogalibrary.org" [ref=f217e133] [cursor=pointer]:
                  - /url: mailto:bforsberg@cuyahogalibrary.org
                - text: with
              - list [ref=f217e134]:
                - listitem [ref=f217e135]: i. Youth first name
                - listitem [ref=f217e136]: ii. Youth last name
                - listitem [ref=f217e137]: iii. Email address that was used to apply at youthopportunities.org
                - listitem [ref=f217e138]: iv. Date of birth
              - paragraph [ref=f217e139]: Please submit your email no later than March 9, 2022, for your best chance at being matched with the Parma Snow library branch internship.
              - paragraph
