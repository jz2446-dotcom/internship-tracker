          - generic [ref=f1078e62]:
            - paragraph [ref=f1078e63]
            - paragraph [ref=f1078e64]:
              - strong [ref=f1078e65]: "POSITION:"
              - text: Senior Commercial Real Estate Broker
            - paragraph [ref=f1078e66]:
              - strong [ref=f1078e67]: "COMPANY:"
              - text: Lee & Associates – Houston
            - paragraph [ref=f1078e68]: Lee & Associates—Houston was founded in 2015 and has consistently been named one of the Houston Business Journal’s Top Brokerage Firms. We are a fully integrated commercial real estate company ready to creatively respond to our clients’ needs. In addition to brokerage services, the Houston office has expanded to include a property management portfolio, a medical office business line, a retail division, and a capital markets team.
            - paragraph [ref=f1078e69]:
              - text: We are seeking a
              - strong [ref=f1078e70]: Senior Commercial Real Estate Broker
              - text: to join us in a dynamic, entrepreneurial environment. We seek individuals passionate about commercial real estate who aim to build a successful, long-term career. At Lee & Associates—Houston, you will be involved in tenant and landlord representation, site acquisition, disposition, brokerage, leasing, and contributing to our mission of exceeding client expectations.
            - paragraph [ref=f1078e71]: "Ideal Candidate Characteristics:"
            - list [ref=f1078e72]:
              - listitem [ref=f1078e73]:
                - strong [ref=f1078e74]: 5+ Years of Experience as a commercial brokerage sales representative
              - listitem [ref=f1078e75]: Existing Houston-area relationships
              - listitem [ref=f1078e76]: Join one of the largest privately-held, full-service commercial real estate firms in the Greater Houston Area.
              - listitem [ref=f1078e77]: Working within an experienced production team
              - listitem [ref=f1078e78]: Professional image and persuasive communication skills
              - listitem [ref=f1078e79]: Willing to put in the hours and dedication to create long-term success
              - listitem [ref=f1078e80]: Strong work ethic and high integrity
            - paragraph [ref=f1078e81]
            - paragraph [ref=f1078e82]:
              - strong [ref=f1078e83]: POSITION RESPONSIBILITIES
              - text: (including, but not limited to, the following activities)
            - list [ref=f1078e84]:
              - listitem [ref=f1078e85]: Accompanies prospective clients to property sites to discuss property features, leasing rates, and terms.
              - listitem [ref=f1078e86]: Develops business and negotiates the selling, leasing, and marketing of commercial real estate properties for clients.
              - listitem [ref=f1078e87]: Compiles property data for clients, such as tenant surveys, summary reports, maps, status updates, and presentations for listing or tenant representative assignments.
              - listitem [ref=f1078e88]: Prepares Request for Proposals (RFP) and reviews RFP responses.
              - listitem [ref=f1078e89]: Secures new and expanded business opportunities through prospecting, networking, relationship building, and selling additional services to the client base
              - listitem [ref=f1078e90]: Analyzes data and prepares real estate reports on average asking rents, tenants in the market, historical data, and market comparisons.
              - listitem [ref=f1078e91]: Gathers and coordinates materials necessary for transactions such as listing agreements, commission agreements, leases, and sales agreements.
              - listitem [ref=f1078e92]: Prepares offers, term sheets, and lease amendments. Participates in contract negotiations and due diligence.
              - listitem [ref=f1078e93]: Maintains current knowledge of market conditions, property values, and legislation that may affect the real estate industry.
              - listitem [ref=f1078e94]: Drafts correspondence to existing and prospective clients. Gathers, prepares, and distributes marketing materials.
              - listitem [ref=f1078e95]: Canvass prospective clients and leads
              - listitem [ref=f1078e96]: Assists in financial analysis and underwriting property values
              - listitem [ref=f1078e97]: Maintains accurate and up-to-date information in company databases.
              - listitem [ref=f1078e98]: Create detailed property surveys, coordinate property tours, organize proposal and LOI negotiations, and manage closings and contract execution process for corporate clients.
            - paragraph [ref=f1078e99]
            - paragraph [ref=f1078e100]:
              - strong [ref=f1078e101]: EDUCATION AND EXPERIENCE
            - list [ref=f1078e102]:
              - listitem [ref=f1078e103]: Bachelor’s Degree (BA/BS) from a four-year college or university required
              - listitem [ref=f1078e104]: Must have a TREC real estate license with 5+ years of CRE Industry Experience
              - listitem [ref=f1078e105]: Must have a keen understanding of the commercial real estate industry
              - listitem [ref=f1078e106]: Strong organizational and analytical skills
              - listitem [ref=f1078e107]: Have excellent interpersonal communication skills, both oral & written
              - listitem [ref=f1078e108]: Ability to interface with clients and work in a fast-paced environment
              - listitem [ref=f1078e109]: Ability to provide efficient, timely, reliable, and courteous service to customers
              - listitem [ref=f1078e110]: Ability to effectively present information
              - listitem [ref=f1078e111]: Requires knowledge of financial terms and principles
              - listitem [ref=f1078e112]: Ability to calculate intermediate figures such as percentages, discounts, and commissions
              - listitem [ref=f1078e113]: Conducts basic financial analysis
              - listitem [ref=f1078e114]: Ability to comprehend, analyze, and interpret documents
              - listitem [ref=f1078e115]: Requires intermediate analytical and quantitative skills
              - listitem [ref=f1078e116]: Intermediate to advanced skills with Microsoft Office Suite
            - paragraph [ref=f1078e117]
            - paragraph [ref=f1078e118]:
              - strong [ref=f1078e119]: QUALIFICATIONS
            - list [ref=f1078e120]:
              - listitem [ref=f1078e121]: Proficiency in computer skills and knowledge of office software packages (Microsoft Office Suite)
              - listitem [ref=f1078e122]: The successful candidate will be detail-oriented, organized, and able to handle multiple projects.
              - listitem [ref=f1078e123]: Also, be high-energy, self-disciplined, driven, and communicate effectively, verbally and in writing, and communicate professionally and courteously with co-workers and clients.
            - paragraph [ref=f1078e124]
            - paragraph [ref=f1078e125]:
              - strong [ref=f1078e126]: OUR EMPLOYEE ADVANTAGE
              - text: ":"
            - paragraph [ref=f1078e127]:
              - strong [ref=f1078e128]: OUR VALUES
            - paragraph [ref=f1078e129]: Since our inception, we have provided our clients with solid insight and professional counsel, all delivered with honesty, integrity, and respect. We are committed to keeping the client first, managing sound operations, embracing community involvement, differentiating our business, and sustaining the firm’s longevity.
            - paragraph [ref=f1078e130]:
              - strong [ref=f1078e131]: OUR TEAM
            - paragraph [ref=f1078e132]: We believe the best deals are achieved through top-minded working together. Our team comprises 35 broker associates, in-house property management professionals, research and marketing professionals, and administrative/accounting professionals. We embraced a unique strategy for client interaction and customized a direct compensation schedule that allows exceptional long-term customer service.
            - paragraph [ref=f1078e133]:
              - strong [ref=f1078e134]: OUR PLATFORM
            - paragraph [ref=f1078e135]:
              - text: We possess unparalleled market knowledge to provide the insight, leadership, and unique expertise our diverse clients demand. Learn more about us by clicking
              - link "here" [ref=f1078e136] [cursor=pointer]:
                - /url: https://www.lee-associates.com/houston
              - text: .
            - paragraph [ref=f1078e137]
