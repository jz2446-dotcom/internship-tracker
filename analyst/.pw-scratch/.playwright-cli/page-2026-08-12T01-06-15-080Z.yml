              - generic [ref=f194e264]:
                - paragraph [ref=f194e265]: At Netflix, our mission is to entertain the world. Together, we are writing the next episode - pushing the boundaries of storytelling, global fandom and making the unimaginable a reality. We are a dream team obsessed with the uncomfortable excitement of discovering what happens when you merge creativity, intuition and cutting-edge technology. Come be a part of what’s next.
                - paragraph [ref=f194e266]:
                  - link "We launched a new ad-supported tier" [ref=f194e267] [cursor=pointer]:
                    - /url: https://deadline.com/2022/11/netflix-ads-launch-what-to-know-1235162223/
                  - text: in November 2022 to offer our members more choice in how they consume their content. Our new tier allows us to attract new members at a lower price point, while also creating a compelling path for advertisers to reach audiences that are deeply engaged.
                - paragraph
                - heading "Our Team" [level=2] [ref=f194e268]
                - paragraph [ref=f194e269]: The Ads Platform Engineering teams build advertising systems and integrations that powers the delivery of ads using our world class content delivery ecosystem. We use a number of Netflix investments and innovations to power our ads - unique mix of client and server side ad insertions, state of the art content delivery system, ad encoding recipes, content understanding and metadata etc. We deliver ads in a manner that’s thoughtful of our member’s viewing experience and drive great outcomes for advertisers. We also ensure that advertiser brand safety is ensured during serving, members only see the most appropriate ads for them.
                - paragraph
                - heading "About the Role" [level=2] [ref=f194e270]
                - paragraph [ref=f194e272]: We're looking for a Staff AI Engineer to join us as the first dedicated AI engineer. Your core mission is to build the AI infrastructure and agentic workflows that transform how our team develops and operates software.
                - paragraph
                - paragraph [ref=f194e273]: This is a greenfield opportunity. You won't be maintaining existing AI systems — you'll be designing and building them from scratch. Our team has active AI champions and early tooling already in production, but we need someone with deep hands-on experience to architect the foundational layer and accelerate our path to AI-native engineering. Our code footprint is reasonable today but expanding at an extraordinary pace; a core part of this role is striking the right balance between AI-driven speed and quality — shipping faster without accumulating slop, regressions, or accountability gaps.
                - paragraph
                - paragraph [ref=f194e274]: This role focuses on applied AI — building production systems with existing models and tools, not training LLMs. You'll leverage large language models, agentic frameworks, and retrieval-augmented generation to solve real infrastructure and product problems, with a direct impact on how quickly and confidently the team can deliver in a competitive market.
                - paragraph
                - heading "What You’ll Do" [level=2] [ref=f194e275]
                - paragraph [ref=f194e277]: AI Infrastructure & Agentic Workflows
                - list [ref=f194e278]:
                  - listitem [ref=f194e279]:
                    - paragraph [ref=f194e280]: Architect and build a centralized context layer that gives AI agents grounded, team-specific knowledge
                  - listitem [ref=f194e281]:
                    - paragraph [ref=f194e282]: "Design and implement agentic workflows for the full development lifecycle: AI-assisted code generation, automated test creation, PR pre-review, and deployment validation"
                  - listitem [ref=f194e283]:
                    - paragraph [ref=f194e284]: Build AI-powered operational workflows — automated incident triage, log and metric correlation, root cause analysis, and guided resolution
                  - listitem [ref=f194e285]:
                    - paragraph [ref=f194e286]: Develop multi-agent orchestration where parallel agents handle implementation, testing, and documentation as coordinated workflows
                  - listitem [ref=f194e287]:
                    - paragraph [ref=f194e288]: Set up standardized AI development environments so every engineer can work in an AI-first workflow from day one
                  - listitem [ref=f194e289]:
                    - paragraph [ref=f194e290]: Drive team-wide AI adoption through hands-on enablement — pairing sessions, architecture reviews, workflow demonstrations, and continuous feedback loops
                - paragraph
                - heading "Skills & experience we’re seeking:" [level=2] [ref=f194e291]
                - list [ref=f194e293]:
                  - listitem [ref=f194e294]:
                    - paragraph [ref=f194e295]: 3+ years of significant focus on applied AI systems
                  - listitem [ref=f194e296]:
                    - paragraph [ref=f194e297]: Proven experience building and deploying agentic AI systems in production — agent architectures, tool integration, orchestration, and evaluation frameworks
                  - listitem [ref=f194e298]:
                    - paragraph [ref=f194e299]: Hands-on experience setting up AI infrastructure for end-to-end software development workflows (AI coding assistants, context engineering, automated testing)
                  - listitem [ref=f194e300]:
                    - paragraph [ref=f194e301]: Strong software engineering fundamentals — you build production-grade systems, not just prototypes
                  - listitem [ref=f194e302]:
                    - paragraph [ref=f194e303]: Deep experience with retrieval-augmented generation — document indexing, embedding strategies, retrieval pipelines, and grounding techniques
                  - listitem [ref=f194e304]:
                    - paragraph [ref=f194e305]: Proficiency in Python and/or JVM languages
                  - listitem [ref=f194e306]:
                    - paragraph [ref=f194e307]: Demonstrated ability to drive technical adoption across a team — you can demonstrate value, build trust through pairing and architecture reviews, and bring engineers along on new workflows
                - paragraph
                - heading "Nice to haves:" [level=2] [ref=f194e308]
                - list [ref=f194e310]:
                  - listitem [ref=f194e311]:
                    - paragraph [ref=f194e312]: Prior experience as the first or early AI engineer on a team — standing up AI capabilities where none previously existed, with the ownership and initiative of an early-stage environment
                  - listitem [ref=f194e313]:
                    - paragraph [ref=f194e314]: "Familiarity with LLM application patterns: context engineering, tool use / function calling, structured outputs, multi-agent coordination, and evaluation / hill-climbing methodologies"
                  - listitem [ref=f194e315]:
                    - paragraph [ref=f194e316]: Experience integrating AI into CI/CD pipelines (automated PR review, test generation, deployment validation)
                  - listitem [ref=f194e317]:
                    - paragraph [ref=f194e318]: Background in building operational tooling — incident response automation, log analysis, diagnostic workflows
                - paragraph
                - paragraph [ref=f194e319]
                - text: Generally, our compensation structure consists solely of an annual salary; we do not have bonuses. You choose each year how much of your compensation you want in salary versus stock options. To determine your personal top of market compensation, we rely on market indicators and consider your specific job family, background, skills, and experience to determine your compensation in the market range. The range for this role is $600,000.00 - $1,066,000.00. This compensation range will vary based on location.
                - paragraph
                - paragraph [ref=f194e320]:
                  - text: Netflix provides comprehensive benefits including Health Plans, Mental Health support, a 401(k) Retirement Plan with employer match, Stock Option Program, Disability Programs, Health Savings and Flexible Spending Accounts, Family-forming benefits, and Life and Serious Injury Benefits. We also offer paid leave of absence programs. Full-time hourly employees accrue 35 days annually for paid time off to be used for vacation, holidays, and sick paid time off. Full-time salaried employees are immediately entitled to flexible time off. See more details about our Benefits
