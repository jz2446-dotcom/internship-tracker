                    - generic [ref=f1481e1548]: "The Williamsburg Inn: The Inn was built in 1937 by John D. Rockefeller, Jr., who envisioned an exquisite lodging and dining experience for visitors to his extensive restoration of Virginia's colonial capital. A member of Preferred Hotels and Resorts Worldwide and a National Trust for Historic Preservation Historic Hotel of America, the Four Star, Four Diamond Williamsburg Inn is listed on the National Register of Historic Places. The Inn has been listed among Travel and Leisure Magazine's Top 100 Hotels in the World and Conde Nast Traveler Magazine's Top 100 Hotels in the world and is a member of Preferred Hotels and Resorts Worldwide, The Banquet Server sets up, serves, and cleans up for banquet breakfast, lunch, dinner, or for receptions."
