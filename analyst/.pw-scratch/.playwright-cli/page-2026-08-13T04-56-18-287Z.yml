                    - generic [ref=f1481e1482]: "The Director, Contracts provides leadership and direction and is responsible for the operational, short and long term strategic direction, management and continued process improvement of contract lifecycle management (CLM) for The Colonial Williamsburg Foundation, including the Foundation’s wholly owned subsidiary, the Colonial Williamsburg Company. CLM focuses on the management of contracts to maximize business performance and minimize risk throughout the contract lifecycle. As such the Director is responsible for the management of the following aspects of a contract: compliance for funding, drafting, negotiation, approval of final contract, execution, compliance to the contract, amendment (if needed) and finally contract closeout."
