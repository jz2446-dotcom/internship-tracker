                    - generic [ref=f1481e1680]: American Indian Initiative interpreters invite visitors to explore the often‑overlooked stories of Indigenous peoples in 18th‑century Williamsburg. Through engaging conversations, hands‑on demonstrations, tours, and other programming, interpreters share American Indian cultures, knowledge, and experiences which helped shape the colonial capital and early America. Working throughout the Historic Area and at the American Indian encampment, interpreters connect past and present by presenting research‑based history while highlighting the vitality and continuity of Native nations today, broadening how guests experience Williamsburg’s story.
