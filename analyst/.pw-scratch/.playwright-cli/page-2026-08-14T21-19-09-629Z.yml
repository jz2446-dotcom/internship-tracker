    - main [ref=f214e14]:
      - generic [ref=f214e16]:
        - heading "Summer Intern, Yale University Archives, (New Haven, CT)" [level=1] [ref=f214e17]
        - paragraph [ref=f214e18]: Posted February 2, 2026
        - paragraph [ref=f214e19]: The Yale University Archives is pleased to host a full-time intern for the summer of 2026. Founded in 1939, the Yale University Archives span over 50,000 linear feet and consist of the historical records of Yale University dated from 1701 to the present. This internship is designed to give a student currently enrolled in a Master of Library and Information Science program or a recent graduate the opportunity to engage in a variety of professional archival work, content management systems, and the opportunity to collaborate within other library departments, gaining practical experience and insight into contemporary archival practice.
        - paragraph [ref=f214e20]: Under the supervision of the Associate University Archivist, duties include assisting in the appraisal, selection, accessioning, and arranging and describing newly acquired and legacy analog and digital archival records, which includes creating and managing records in ArchivesSpace. Additional duties include responding to reference inquiries and donor outreach. The intern will be introduced to other work within other special collections repositories, and related departments including digital accessioning, digital preservation, and reference services to provide a broad overview of the work being done across the Yale Library system.
        - paragraph [ref=f214e21]: The internship will run twelve weeks from June to September 2026 (precise dates will be determined with the selected candidate). The intern will work on-site at the Yale University Archives located within Sterling Memorial Library on the main Yale campus in New Haven, Connecticut. Hours are from 8:30am to 5:00pm Monday through Friday (37.5 hours per week). Pay is $30.00/hour.
        - heading "How to Apply:" [level=2] [ref=f214e22]
        - paragraph [ref=f214e23]:
          - text: Interested applicants should prepare a resume and a one-page letter of interest and send them to
          - link "archives@yale.edu" [ref=f214e24] [cursor=pointer]:
            - /url: mailto:archives@yale.edu
          - text: "with the subject line: Summer Archives Internship."
        - paragraph [ref=f214e25]:
          - text: Application materials will be accepted through Friday, March 6, 2026. Selected applicants must complete a background check. For more information, please email
          - link "archives@yale.edu" [ref=f214e26] [cursor=pointer]:
            - /url: mailto:archives@yale.edu
          - text: .
