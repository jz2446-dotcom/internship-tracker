      - generic [ref=f682e42]:
        - paragraph [ref=f682e43]: "Ready for your next career step? Consider joining the talented, diverse, and passionate staff of New York’s most iconic music institution: Carnegie Hall."
        - paragraph [ref=f682e44]: As a 501(c)(3) nonprofit organization, Carnegie Hall’s mission is to present extraordinary music and musicians on the three stages of this legendary hall, to bring the transformative power of music to the widest possible audience, to provide visionary education programs, and to foster the future of music through the cultivation of new works, artists, and audiences.
        - paragraph [ref=f682e45]: We depend on a wide range of skill sets, experiences, and personalities to fulfill this mission. If you think you would be a good fit for one of our open positions, we want to hear from you! New opportunities are posted frequently, so please check back often.
        - paragraph [ref=f682e46]:
          - emphasis [ref=f682e47]: Carnegie Hall is proud to be an equal opportunity employer.
