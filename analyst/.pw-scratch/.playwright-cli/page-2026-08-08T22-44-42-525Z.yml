            - generic [ref=f500e117]:
              - term [ref=f500e118]:
                - heading "JOB INFORMATION" [level=2] [ref=f500e119]
              - definition [ref=f500e120]:
                - paragraph
                - paragraph [ref=f500e121]:
                  - strong [ref=f500e122]: See NOTES below for future wage increases and/or additional compensation opportunities.
                  - strong [ref=f500e124]
                - paragraph [ref=f500e125]: Account Clerk positions perform accounting clerical work using standard accounting principles and procedures within a financial accounting system and related subsidiary systems; post, reconcile and balance financial transactions of the accounting system; sort, verify, batch and file financial documents; locate and trace coding and posting errors; answer inquiries from the public and other operating departments; and perform other duties as assigned.
                - paragraph [ref=f500e126]: "NOTES:"
                - list [ref=f500e127]:
                  - listitem [ref=f500e128]:
                    - text: "Employees in job classifications represented by Municipal Employees Association (MEA) are scheduled to receive the following general wage increase:"
                    - list [ref=f500e129]:
                      - listitem [ref=f500e130]: 3.5% effective 7/1/27
                      - listitem [ref=f500e131]: 2% effective 7/2/28
                      - listitem [ref=f500e132]: 2% effective 1/1/29
                - list [ref=f500e134]:
                  - listitem [ref=f500e135]: Eligible benefitted employees originally hired on or after July 10, 2021, will be automatically enrolled in the San Diego City Employees Retirement System (SDCERS).
                - paragraph
              - term [ref=f500e136]:
                - heading "MINIMUM REQUIREMENTS" [level=2] [ref=f500e137]
              - definition [ref=f500e138]:
                - paragraph
                - paragraph [ref=f500e139]: You must meet the following requirements on the date you apply, unless otherwise indicated.
                - paragraph [ref=f500e140]
                - paragraph [ref=f500e141]:
                  - generic [ref=f500e142]: "EDUCATION/EXPERIENCE: You must meet ONE of the following options:"
                - list [ref=f500e143]:
                  - listitem [ref=f500e144]: Successful completion of six (6) semester units or nine (9) quarter units of college-level accounting or bookkeeping course work.
                  - listitem [ref=f500e145]: Successful completion of an Accounting or Bookkeeping curriculum at a recognized business college.
                  - listitem [ref=f500e146]: One year of full-time experience recording financial or payroll transaction in a financial accounting system.
                - paragraph [ref=f500e147]
                - paragraph [ref=f500e148]: "NOTE:"
                - list [ref=f500e150]:
                  - listitem [ref=f500e151]: City of San Diego employees using Out-of-Class Assignment (OCA) experience to qualify must submit written documentation signed by their appointing authority or payroll specialist, detailing the work performed, dates, and total number of qualifying OCA hours. OCA experience without the required documentation will NOT be considered.
                - paragraph [ref=f500e152]:
                  - generic [ref=f500e153]: "REQUIRED DOCUMENTS (MUST SUBMIT WITH APPLICATION):"
                - list [ref=f500e154]:
                  - listitem [ref=f500e155]: Proof of transcripts, if utilized to meet the minimum requirements.
                  - listitem [ref=f500e156]: Proof of an Accounting or Bookkeeping curriculum completion, if utilized to meet the minimum requirements.
                  - listitem [ref=f500e157]: For City of San Diego employees, proof of Out-of-Class Assignment (OCA), if utilized to meet the minimum requirements.
                - paragraph [ref=f500e158]
                - paragraph [ref=f500e159]: "Required documents should be attached electronically to your application. If you are unable to attach at the time of application submittal, you must submit them as soon as possible via fax: (619) 533-3337; or to the Employment Information Center: City of San Diego Personnel Department, 1200 Third Avenue - Suite 300, San Diego, CA 92101. Include your name and the title of the position for which you are applying."
                - paragraph
              - term [ref=f500e160]:
                - heading "SCREENING PROCESS" [level=2] [ref=f500e161]
              - definition [ref=f500e162]:
                - paragraph
                - paragraph [ref=f500e163]: Please ensure all information is complete and accurate as the responses you provide on the supplemental questions will be reviewed using an automated evaluation system. If you are successful in this initial screening process, your application will be reviewed for applicable education, experience, and/or training to ensure all minimum requirements have been met. Successful candidates will be placed on a list which will be used to fill position vacancies during the next six months (180 days). For each vacancy, only those candidates with the most appropriate qualifications will be contacted by the hiring department for an interview.
                - paragraph
              - term [ref=f500e164]:
                - heading "SUPPLEMENTAL INFORMATION" [level=2] [ref=f500e165]
              - definition [ref=f500e166]:
                - paragraph
                - paragraph [ref=f500e167]:
                  - generic [ref=f500e168]: "PRE-EMPLOYMENT REQUIREMENTS: Employment offers are conditional pending the results of all screening processes applicable to this position, which may include the following: confirmation of citizenship or legal right to work in the United States; completion of a pre-employment medical review and exam (which may include drug and alcohol testing); reference checks; and fingerprinting. Fingerprints will be submitted to the Federal Bureau of Investigation and the California Department of Justice for a conviction record report. Certain positions may require additional screening processes, including a polygraph examination and/or background investigation. All screening processes must be successfully completed before employment begins. A positive test result for alcohol, cannabis/marijuana, illegal drugs, or inadequately explained prescription drugs, or misrepresentation, falsification, or omission of pertinent facts in any step of the screening or selection process, may constitute cause for disqualification or termination of employment. Nothing in this job posting constitutes an express or implied contract for employment with the City of San Diego. Candidates must notify the Personnel Department of any change in their name, mailing address, email address, or phone number, otherwise they may miss employment opportunities."
                - paragraph [ref=f500e169]: Rev. 4 – August 7, 2026 (New Recruitment Date)
                - paragraph
