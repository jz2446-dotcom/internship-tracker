          - generic [ref=f482e66]:
            - emphasis [ref=f482e68]: Andreessen Horowitz is a Silicon Valley-based venture capital firm with $10 billion under management. Focused on investing in software eating the world, the firm partners with entrepreneurs in their company building at all stages – from seed to late-stage – in the biology, consumer, crypto, and enterprise industries.
            - emphasis [ref=f482e70]: Summer Intern
            - emphasis [ref=f482e72]: "Under the supervision of our departmental teams; the intern responsibilities include:"
            - list [ref=f482e73]:
              - listitem [ref=f482e74]:
                - emphasis [ref=f482e75]: Handling a variety of special ad-hoc projects and research
              - listitem [ref=f482e76]:
