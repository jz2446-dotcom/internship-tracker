            - emphasis [ref=f482e79]: Qualifications
            - list [ref=f482e80]:
              - listitem [ref=f482e81]:
                - emphasis [ref=f482e82]: Pursuing a Bachelor’s degree in finance, economics, or related field with minimum GPA of 3.5
              - listitem [ref=f482e83]:
                - emphasis [ref=f482e84]: Prior experience or interest in venture capital, financial services, and valuation is preferred
              - listitem [ref=f482e85]:
                - emphasis [ref=f482e86]: Exhibit intellectual curiosity and a desire to improve results and efficiencies
              - listitem [ref=f482e87]:
