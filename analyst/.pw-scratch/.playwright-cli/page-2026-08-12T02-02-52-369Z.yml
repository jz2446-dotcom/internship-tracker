        - strong [ref=f892e32]: OUR VALUES
      - paragraph [ref=f892e33]: We proudly enjoy and share a culture that encompasses passion, integrity, teamwork, respect, courage and optimism.
      - paragraph [ref=f892e34]:
        - generic [ref=f892e35]:
          - strong [ref=f892e36]: Passion
          - text: ": Inspired by people and by nature, we are urgently compelled to drive change for a sustainable future."
        - generic [ref=f892e37]:
          - strong [ref=f892e38]: Integrity
          - text: ": We are honest, transparent, and accountable for our actions."
        - generic [ref=f892e39]:
          - strong [ref=f892e40]: Teamwork
          - text: ": We work together as one CI, recognizing that inclusion, collaboration, and cooperation are fundamental to achieving a healthy and prosperous world for all."
        - generic [ref=f892e41]:
          - strong [ref=f892e42]: Respect
          - text: ": We respect each other and work to earn trust, valuing our diversity of cultures, talents, and experiences."
        - generic [ref=f892e43]:
          - strong [ref=f892e44]: Courage
          - text: ": We pursue our vision, taking bold action, persevering, and overcoming challenges."
        - generic [ref=f892e45]:
