          - text: ": We are optimistic about the capacity of people to be caring, generous, and brilliant, and believe that with partners, we can inspire humanity to create a better future."
      - paragraph [ref=f892e47]: Conservation International is an Equal Opportunity Employer. CI offers reasonable accommodation in the employment process for individuals with disabilities. If you need assistance in the application or hiring process to accommodate a disability, you may request an accommodation at any time. If you require an application accommodation due to a disability, please e-mail your request to applyhelp@conservation.org and include "accommodation" in the subject line.
