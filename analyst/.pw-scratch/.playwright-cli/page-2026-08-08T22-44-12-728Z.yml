            - generic [ref=f494e115]:
              - term [ref=f494e116]:
                - heading "DUTIES" [level=2] [ref=f494e117]
              - definition [ref=f494e118]:
                - paragraph
                - paragraph [ref=f494e119]:
                  - strong [ref=f494e121]:
                    - strong [ref=f494e122]: ANNUAL SALARY
                - paragraph [ref=f494e123]: $74,792 to $109,327
                - paragraph [ref=f494e124]:
                  - strong [ref=f494e126]:
                    - strong [ref=f494e127]: NOTES
                    - strong [ref=f494e128]: ":"
                - text: Annual salary is at the start of the pay range. The current salary range is subject to change. Please confirm the starting salary with the hiring department before accepting a job offer.
                - paragraph [ref=f494e129]: Performs professional accounting work in the research, preparation, maintenance, control, and reconciliation of financial records and reports in accordance with the principles of governmental and public accounting.
                - paragraph
              - term [ref=f494e130]:
                - heading "REQUIREMENT(S)/MINIMUM QUALIFICATION(S)" [level=2] [ref=f494e131]
              - definition [ref=f494e132]:
                - paragraph
                - paragraph [ref=f494e133]: Graduation from an accredited four-year college or university and at least 24 semester or 36 quarter units in accounting.
                - paragraph [ref=f494e134]:
                  - strong [ref=f494e136]:
                    - strong [ref=f494e137]: PROCESS NOTES
                - list [ref=f494e138]:
                  - listitem [ref=f494e139]:
                    - paragraph [ref=f494e140]: Applicants who are currently enrolled in their final semester or quarter before graduation from an accredited college or university may apply. However, they cannot be appointed until they have received their degree, and completed all the required coursework, including 24 semester or 36 quarter units in accounting.
                  - listitem [ref=f494e141]:
                    - paragraph [ref=f494e142]: Course titles, number of units and completion dates for each course must be listed in the City application, if you did not receive a degree in Accounting.
                  - listitem [ref=f494e143]:
                    - paragraph [ref=f494e144]: The positions of Accountant in the Los Angeles World Airports (LAWA), the Department of Aging, the Department of Building and Safety, the Department of Cultural Affairs, the Library Department, and the Department of Recreation and Parks require a valid Class C driver’s license issued by the California Department of Motor Vehicles (DMV) at the time of appointment. Candidates will not be eligible for appointment to these positions if their DMV record within the last 36 months reflects three or more moving violations and/or at-fault accidents, or a conviction of a major moving violation (such as DUI).
                  - listitem [ref=f494e145]:
                    - paragraph [ref=f494e146]:
                      - text: Please note that qualifying education must be from a college or university accredited by a City of Los Angeles recognized agency. A list of approved accrediting agencies can be found at
                      - link "http://per.lacity.org/Accredited Institutions 08-21-08.pdf" [ref=f494e147] [cursor=pointer]:
                        - /url: http://per.lacity.org/Accredited%20Institutions%2008-21-08.pdf
                      - link "(Download PDF reader)" [ref=f494e148] [cursor=pointer]:
                        - /url: https://get.adobe.com/reader/
                      - text: .
                  - listitem [ref=f494e149]:
                    - paragraph [ref=f494e150]: Candidates completing the examination process will be contacted by the Personnel Department to provide required proof of qualifying degree and/or coursework. Applicants who wish to expedite this process may attach a copy of their transcripts (annotated with accounting courses, credit earned, and grade received) or qualifying degree to their on-line application at the time of filing in the Attachments section.
                - paragraph
              - term [ref=f494e151]:
                - heading "WHERE TO APPLY & APPLICATION DEADLINE" [level=2] [ref=f494e152]
              - definition [ref=f494e153]:
                - paragraph
                - paragraph [ref=f494e154]:
                  - generic [ref=f494e155]:
                    - text: Applications will only be accepted on-line.
                    - strong [ref=f494e156]: When you are viewing the on-line job bulletin of your choice, simply scroll to the top of the page and select the “Apply” icon.
                    - text: On-line job bulletins are also available at
                  - link "https://www.governmentjobs.com/careers/lacity" [ref=f494e157] [cursor=pointer]:
                    - /url: https://www.governmentjobs.com/careers/lacity
                - paragraph [ref=f494e158]:
                  - generic [ref=f494e159]:
                    - strong [ref=f494e161]: NOTE
                    - strong [ref=f494e163]: ":"
                - paragraph [ref=f494e165]:
                  - generic [ref=f494e166]: Applicants are urged to apply early to ensure you have time to resolve any technical issues you may encounter.
                - strong [ref=f494e170]: APPLICATION DEADLINE
                - paragraph [ref=f494e171]:
                  - strong [ref=f494e174]: "Applications will only be accepted on-line on the following dates listed below:"
                - paragraph [ref=f494e176]:
                  - strong [ref=f494e177]: APPLICATIONS ARE NOT CURRENTLY BEING ACCEPTED. FUTURE FILING PERIODS MAY BE ADDED BASED ON THE CITY'S HIRING NEEDS.
                - text: The examination may close without prior notice at any time after a sufficient number of applications have been received. Filing periods may change without prior notice or additional dates may be added, as needed, at a later date. For administrative purposes, filing will close periodically and reopen on the dates noted in the “Application Deadline” section of this bulletin.
                - paragraph [ref=f494e178]: "In accordance with Civil Service Rule 4.2, all applicants who apply may not be tested in this examination. To meet anticipated hiring needs, only a limited number of qualified applicants will be invited to participate in the selection process in the following order: 1) Applicants currently employed by the City of Los Angeles who meet the minimum requirements, or are on a reserve list; 2) Remaining applicants who meet the minimum requirements in sufficient numbers to meet hiring needs based on a random sampling of those qualified candidates. Applicants not selected to be tested may re-apply in a subsequent filing period in order to be considered for that period's selection process."
                - paragraph
              - term [ref=f494e179]:
                - heading "SELECTION PROCESS" [level=2] [ref=f494e180]
              - definition [ref=f494e181]:
                - paragraph
                - paragraph [ref=f494e182]:
                  - strong [ref=f494e184]: "Examination Weight:"
                - paragraph [ref=f494e185]:
                  - strong [ref=f494e187]: Interview ...............................................................................................100%
                - paragraph [ref=f494e188]: "The examination will consist entirely of an evaluation of professional and personal qualifications by interview. In the interview, the following competencies may be evaluated: Analytical Ability; Learning Ability; Self Management; Technology Application; Responsiveness and Follow-Up; Tact; Oral Communication; Job Knowledge, including knowledge of: generally accepted accounting principles including governmental, cost, and commercial accounting; electronic data processing principles as they apply to accounting and other financial work; Generally Accepted Accounting Principles (GAAP), Generally Accepted Auditing Standards (GAAS), and the Financial Accounting Standards Board (FASB); accounting systems and procedures related to analysis, development, and implementation; office practices and procedures such as record retention and filing; preparing, analyzing and interpreting complex electronically produced and written financial data and reports; written material such as contracts, legal documents and procedural manuals; and other necessary skills, knowledge and abilities."
                - paragraph [ref=f494e189]:
                  - text: Additional job analysis information can be obtained by going to
                  - link "http://per.lacity.org/index.cfm?content=jobanalyses" [ref=f494e190] [cursor=pointer]:
                    - /url: http://per.lacity.org/index.cfm?content=jobanalyses
                  - text: and clicking on Competencies under Accountant.
                - paragraph [ref=f494e191]: Candidates will be notified by e-mail of the date, time, and location of the interviews, which may be held in Los Angeles or on-line.
                - paragraph [ref=f494e192]:
                  - text: It is anticipated that interviews will begin during the period of
                  - strong [ref=f494e194]: OCTOBER 20, 2025 to OCTOBER 31, 2025.
                - paragraph [ref=f494e195]:
                  - strong [ref=f494e197]: "NOTES:"
                - list [ref=f494e198]:
                  - listitem [ref=f494e199]:
                    - paragraph [ref=f494e200]: This examination is based on a validation study.
                  - listitem [ref=f494e201]:
                    - paragraph [ref=f494e202]: Candidates may take the test only once every 365 days during the administration of the examination. Names may be removed from the open competitive eligible list after six months.
                  - listitem [ref=f494e203]:
                    - paragraph [ref=f494e204]:
                      - text: As a covered entity under the Fair Employment and Housing Act and Title II of the Americans with Disabilities Act, the City of Los Angeles does not discriminate on the basis of disability and upon request, will provide reasonable accommodations to ensure equal access to its programs, services, and activities. To request a disability accommodation, please complete the Disability Accommodation Form within 14 calendar days of the submittal of the City application. The Disability Accommodation Form can be obtained at
                      - link "http://per.lacity.org/exams/verify_disability.pdf" [ref=f494e205] [cursor=pointer]:
                        - /url: http://per.lacity.org/exams/verify_disability.pdf
                      - link "(Download PDF reader)" [ref=f494e206] [cursor=pointer]:
                        - /url: https://get.adobe.com/reader/
                      - text: .
                  - listitem [ref=f494e207]:
                    - paragraph [ref=f494e208]: Applications are accepted subject to review to ensure that minimum qualifications are met. Candidates may be disqualified at any time if it is determined that they do not possess the minimum qualifications stated on this bulletin.
                  - listitem [ref=f494e209]:
                    - paragraph [ref=f494e210]: A final average score of 70% is required to be placed on the eligible list.
                  - listitem [ref=f494e211]:
                    - paragraph [ref=f494e212]: In accordance with Civil Service Rule 4.24, review periods may be combined. Candidates in the examination process may file protests as provided in Sec. 4.20, 4.22, and 4.23 as applicable and within the required time frame; however, the Personnel Department may respond to and resolve protests prior to the establishment of the eligible list.
                - paragraph [ref=f494e213]:
                  - generic [ref=f494e214]:
                    - emphasis [ref=f494e215]: Notice
                    - emphasis [ref=f494e216]: ":"
                - paragraph [ref=f494e217]:
                  - generic [ref=f494e218]:
                    - emphasis [ref=f494e219]: If you receive and accept an offer of employment to a regular position with the City of Los Angeles, your employee benefit coverage (including health and dental coverage as well as life insurance) will commence approximately six weeks after your original regular appointment. Not all positions in the City receive benefit coverage; you should inquire regarding the availability of employee benefits prior to accepting a position.
                    - emphasis [ref=f494e220]
                    - emphasis [ref=f494e221]: All City employees are required to be Disaster Service Workers.
                - strong [ref=f494e224]: THIS EXAMINATION IS TO BE GIVEN ONLY ON AN OPEN COMPETITIVE BASIS
                - paragraph [ref=f494e225]: The City of Los Angeles does not discriminate on the basis of race, religion, national origin, sex, age, marital status, sexual orientation, gender identity, gender expression, disability, creed, color, ancestry, medical condition (cancer), or Acquired Immune Deficiency Syndrome.
                - paragraph [ref=f494e226]:
                  - strong [ref=f494e228]: AN EQUAL EMPLOYMENT OPPORTUNITY EMPLOYER
                - generic [ref=f494e230]:
                  - text: "For additional information and FAQs regarding the City's hiring process, please go to:"
                  - link "https://per.lacity.org/faqs/employment-testing-process.html" [ref=f494e232] [cursor=pointer]:
                    - /url: https://per.lacity.org/faqs/employment-testing-process.html
                - paragraph
