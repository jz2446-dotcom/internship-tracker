                  - generic:
                    - paragraph [ref=f75e604]:
                      - generic [ref=f75e605]: "Nia Impact Capital is a proud member of CFA Society for the period covering July 1, 2026 and ending June 30, 2027. The firm pays an annual membership fee to the organization. Nia Impact Capital is also a member of Invest Ahead formerly Thirty Percent Coalition and paid a membership fee for the period beginning October 2025 to October 2026. We are also proud to be BCorp, 1% for the Planet, and Gender Equity Now certified, for which Nia paid initial fees for the due diligence process. We obtained our BCorp Certification in September 2017 and remain a current participant. We obtained our 1% for the Planet Certification on December 31, 2022, and remain a current participant. We obtained our Gender Equity Certification in August 2018 and remain a current participant. Nia Impact capital is also a founding participant of the Racial Justice Investing group, which is a volunteer group and has no associated membership fees. Nia Impact Capital is also a signatory of the Finance for Biodiversity pledge, which has no associated fees. Nia Impact Capital pays an annual membership fee to US SIF: The Forum for Sustainable and Responsible Investment. US SIF membership does not constitute an endorsement, review, or recommendation of Nia Impact Capital or its services. Nia Impact Capital is not aware of any conflicts of interest associated with its membership in or certification by Gender Equity Now, B Corporation, 1% for the Planet, Invest Ahead, the Finance for Biodiversity Pledge, CFA Society San Francisco, the Racial Justice Investing group, or US SIF."
