                              - paragraph [ref=f75e348]:
                                - generic [ref=f75e349]: Nia is the Swahili word for intention and purpose. Our innovative and dedicated asset management firm seeking to bring positive impact investing to carefully designed public market portfolios. We assist individuals, organizations and institutions in investing with their values. Our financial first portfolios are built to promote social justice values for a sustainable and inclusive economy. We are an activist firm and use our investor voice to help improve our portfolio companies and to foster systems change.
