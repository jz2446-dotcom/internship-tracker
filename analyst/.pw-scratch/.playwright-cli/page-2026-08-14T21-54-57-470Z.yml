    - generic [ref=f830e124]:
      - heading "Welcome to The Queen's Medical Center" [level=1] [ref=f830e127]
      - paragraph [ref=f830e130]: Founded in 1859 by Queen Emma and King Kamehameha IV, The Queen’s Medical Center, originally named and still commonly referred to as Queen’s Hospital, is located in downtown Honolulu. With 575 acute care beds, it’s the largest private, nonprofit hospital in the city.
      - link "Parking and Directions" [ref=f830e134] [cursor=pointer]:
        - /url: https://www.queens.org/locations/hospitals/qmc/patients-visitors/parking-and-directions/
        - generic [ref=f830e135]:
          - generic [ref=f830e136]: 
          - generic [ref=f830e138]: Parking and Directions
    - generic [ref=f830e148]:
      - heading "Explore Our History" [level=2] [ref=f830e151]
      - paragraph [ref=f830e158]: For more than 160 years, Queen’s has been on the cutting edge of advancements in health care. That’s one reason why the people of Hawai‘i and the Pacific Basin have entrusted us with their care. We have a legacy that is deeply woven into the culture of our communities – one of compassion, aloha, respect and excellence.
    - generic [ref=f830e164]:
      - generic [ref=f830e166]:
        - heading "Why Choose The Queen's Medical Center?" [level=2] [ref=f830e169]: Why ChooseThe Queen's Medical Center?
        - generic [ref=f830e175]:
          - paragraph [ref=f830e176]: As one of our four hospitals, The Queen’s Medical Center serves as the major referral center for cancer, heart disease, neuroscience, orthopedics, surgery, emergency medicine and behavioral health. The Queen’s Medical Center has the only organ transplant program in the state of Hawai‘i and is the state’s first and only level one trauma center.
          - paragraph [ref=f830e177]: As part of The Queen’s Health Systems, Queen’s Medical Center has access to some of the best health care resources in the state. We are honored by our recognitions and share them with you, our ‘ohana.
        - list [ref=f830e180]:
          - listitem [ref=f830e181]:
            - generic [ref=f830e182]: 
            - generic [ref=f830e184]: In 2017-2018, U.S. News & World Report voted Queen’s Medical Center “Best Hospital in Honolulu”
          - listitem [ref=f830e185]:
            - generic [ref=f830e186]: 
            - generic [ref=f830e188]: A major teaching hospital for the University of Hawaii John A. Burns School of Medicine serving as one of the largest clinical sites for medical students
