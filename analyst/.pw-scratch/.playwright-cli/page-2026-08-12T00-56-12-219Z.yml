                      - link "https://careers.microsoft.com/us/en/us-corporate-pay" [ref=f51e407] [cursor=pointer]:
                        - /url: https://careers.microsoft.com/us/en/us-corporate-pay
                    - paragraph [ref=f51e408]: This position will be open for a minimum of 5 days, with applications accepted on an ongoing basis until the position is filled.
