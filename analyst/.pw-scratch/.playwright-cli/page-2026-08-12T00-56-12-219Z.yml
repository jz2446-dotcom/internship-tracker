                  - generic [ref=f51e364]:
                    - text: Overview
                    - paragraph [ref=f51e365]: The Cloud & AI organization accelerates Microsoft’s mission and bold ambitions to ensure that our company and industry is securing digital technology platforms, devices, and clouds in our customers’ heterogeneous environments, as well as ensuring the security of our own internal estate. Our culture is centered on embracing a growth mindset, a theme of inspiring excellence, and encouraging teams and leaders to bring their best each day. In doing so, we create life-changing innovations that impact billions of lives around the world. Microsoft is one of the largest enterprise service companies in the world.
                    - paragraph [ref=f51e366]:
                      - text: Are you a experienced
                      - strong [ref=f51e367]: Executive Business Administrator
                      - text: who is passionate about supporting a dynamic leader? Do you get excited about the opportunity to manage a senior leader in Microsoft Security, CISO Organization? Do you like the challenge of complex calendaring and working to coordinate customer meetings, events and team meetings? Do you want to influence modern day security attitudes and behaviors of employees across an entire org and Microsoft? We are looking for someone like you! This position requires someone who has excellent communication skills, possesses the ability to set priorities, handle multiple critical tasks simultaneously and function as part of the administrative team in a positive efficient manner. This role requires complex calendaring skills, operational excellence, and professionalism. Beyond calendar, travel, and team support, the ideal candidate for this role will need to be able to navigate and change directions quickly within our fast-paced environment; have stellar interpersonal skills and initiative; demonstrate good judgment; proven ability to accommodate diverse work styles; be both fair and unbiased; and the ability to maintain high levels of confidentiality. You will also be skilled at setting priorities and handling multiple tasks simultaneously. Being detail-oriented and having consistent and timely follow-through will be essential to your success. A successful candidate can effectively manage a high workload under time constraints with a calm, confident and positive attitude, ability to work independently, deal with ambiguity and have a passion for making managers and organizations great. Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.
                    - paragraph [ref=f51e368]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond. In alignment with our Microsoft values, we are committed to cultivating an inclusive work environment for all employees to positively impact our culture every day.
                    - text: Responsibilities
                    - list [ref=f51e369]:
                      - listitem [ref=f51e370]: Proactively manage complex calendaring for the CVP of Security Engineering.
                      - listitem [ref=f51e371]: Provide end-to-end complex domestic and international travel planning.
                      - listitem [ref=f51e372]: Develop & maintain strategic working relationships with key business stakeholders/leaders across the organizations.
                      - listitem [ref=f51e373]: Develop an understanding of critical business needs, enabling appropriate decisions which impact a manager’s time.
                      - listitem [ref=f51e374]: Schedule and manage staff meetings, events and off-sites, conferences, including agenda management, meeting logistics, note-taking, material preparation and work with the global teams.
                      - listitem [ref=f51e375]: Partner with the Chief of Staff, Lead EA, Peer EAs and Business Operations team to effectively run the organization.
                      - listitem [ref=f51e376]: Helping to manage the Rhythm of the Business and people processes, including the team’s budget management, quarterly and mid-year budget reviews, leadership meetings, business reviews, Connects, Rewards discussions, All-Hands meetings, and other key discussions.
                      - listitem [ref=f51e377]: Coordinate team morale events and/or broader team-wide events.
                      - listitem [ref=f51e378]: Participate in various admin-built SME teams in collaboration with the admin and business operations community.
                      - listitem [ref=f51e379]: Judgment in dealing with confidential information and ensuring accurate and timely distribution of information.
                      - listitem [ref=f51e380]: Professional presence always, as a representative of the team and Microsoft to internal and external business partners.
                      - listitem [ref=f51e381]: Manage headcount information and be a proficient user of all internal people, budget, and space management tools to generate relevant, timely, and accurate reports.
                      - listitem [ref=f51e382]: Execute effective space management tactics, office moves as required and coordinate with the CISO team space planner.
                      - listitem [ref=f51e383]: Provide mentorship and leadership to administrators as part of a team.
                      - listitem [ref=f51e384]: Embody our Culture and Values.
                    - text: Qualifications
                    - paragraph [ref=f51e385]:
                      - strong [ref=f51e386]: Required Qualifications
                    - list [ref=f51e387]:
                      - listitem [ref=f51e388]: 5+ years Administrative, Business Support, or customer service experience in an environment with an emphasis on scheduling meetings/events, travel management, calendar management, or administration work for executive/upper-level management.
                    - paragraph [ref=f51e389]:
                      - strong [ref=f51e390]: Preferred Qualifications
                    - list [ref=f51e391]:
                      - listitem [ref=f51e392]: Bachelor's Degree in relevant field (e.g., Business Administration, Human Resources [HR], Marketing, Communications, Psychology, Sociology) OR equivalent experience.
                      - listitem [ref=f51e393]: 5+ years of proficiency using Microsoft productivity tools including Outlook, Word, Excel, and PowerPoint and experience using OneNote, SharePoint Teams or similar collaboration tools.
                      - listitem [ref=f51e394]: 3+ years experience reviewing and managing administrative budgets (e.g., for events, morale, travel, training).
                      - listitem [ref=f51e395]: Experience serving as mentor, manager or lead EA role
                      - listitem [ref=f51e396]: Knowledge of internal Microsoft tools such as Employee Central/HeadTrax, MS Expense Tool, MS Travel, iCIMS, MyOrder a plus.
                      - listitem [ref=f51e397]: Interpersonal, organizational, planning and time management skills.
                      - listitem [ref=f51e398]: Ability to work independently, deal with ambiguity, and to solve routine problems proactively and effectively. The aptitude for rolling with changing circumstances (direction and strategy) while continuing to have professional and positive interactions.
                      - listitem [ref=f51e399]: Ability to work well in a changing environment, under pressure, on short-notice, and take appropriate action.
                      - listitem [ref=f51e400]: Exercise sound judgment, tact, diplomacy, integrity and professionalism in all transactions.
                      - listitem [ref=f51e401]: Adaptable and work in a team environment, building and maintaining effective working relationships with a diverse group of contributors internally and externally.
                      - listitem [ref=f51e402]: Ability to maintain confidentiality of highly sensitive material and information with discretion and professionalism.
                      - listitem [ref=f51e403]: Experience supporting an executive in a face-paced, corporate environment.
                      - listitem [ref=f51e404]: Organizational, analytical, anticipatory, and written communication skills.
                    - paragraph [ref=f51e405]: Business Support ATR-D - The typical base pay range for this role across the U.S. is USD $31.49 - $51.97 per hour. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $42.93 - $59.33 per hour.
