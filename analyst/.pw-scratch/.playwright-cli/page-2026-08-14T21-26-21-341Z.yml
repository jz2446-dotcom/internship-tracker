    - generic [ref=f340e26]:
      - generic [ref=f340e31]:
        - heading "Office of Human Resources" [level=3] [ref=f340e32]
        - generic [ref=f340e33]:
          - generic [ref=f340e34]: The Office of Human Resources (OHR) leads and supports the Smithsonian’s museums, research, and education centers in hiring, developing, and retaining a talented, dedicated, and diverse workforce. OHR plays an essential role in enabling the Smithsonian’s mission to increase and diffuse knowledge as we provide organizational support services and expertise, conduct efficient and transparent processes and encourage, recognize, and reward best practices and excellence.
          - generic [ref=f340e35]: "Today's Smithsonian extends two traditions that have defined the Institution throughout its history: a tradition of public engagement, public service and public outreach, and a tradition of scientific and scholarly research and innovation. As the Smithsonian seeks to expand its connections with the American people, it continues to build and challenge a workforce with an amazing diversity of skills. The Smithsonian’s mission is to provide the tens of millions of people who visit its museums, participate in public programs, read its magazines, or engage it through the internet with an experience they will remember for a lifetime. You can help create the memories."
      - generic [ref=f340e42]:
        - heading "The Smithsonian Team" [level=3] [ref=f340e43]
        - generic [ref=f340e44]:
          - generic [ref=f340e45]: The Smithsonian workforce includes dedicated men and women located in the Washington, D.C., area; New York City; Cambridge, Mass.; several other U.S. states; and the country of Panama. Positions range from astrophysicist to security officer, from art historian to zebra keeper, and from science educator to software developer. The Smithsonian seeks to attract and maintain a creative workforce that is representative of America’s diversity. We are consistently ranked among mid-size agencies as one of the “Best Places to Work.”
          - generic [ref=f340e46]:
            - text: Apart from these individual opportunities, the Smithsonian is eager to partner with other institutions on projects of mutual interest and concern. In the U.S., the Smithsonian has created a vibrant community of
            - link "Affiliate museums" [ref=f340e47] [cursor=pointer]:
              - /url: https://affiliations.si.edu/
            - text: . Our researchers and other expert staff are
            - link "active around the globe" [ref=f340e48] [cursor=pointer]:
              - /url: https://global.si.edu/
            - text: and collaborate with a myriad of other research, educational, and cultural institutions.
    - generic [ref=f340e53]:
      - heading "What are Trust Positions?" [level=2] [ref=f340e54]
      - generic [ref=f340e55]: Trust Fund positions are unique to the Smithsonian. They are paid from a variety of sources, including the Smithsonian endowment, revenue from our business activities, donations, and grants and contracts. Trust employees are not part of the civil service, nor does trust fund employment lead to Federal status. The salary ranges for trust positions are generally the same as for federal positions and in many cases trust and federal employees work side by side. Trust employees have their own benefit program which is similar to the federal benefit program. On job announcements, trust jobs are designated with the pay plans IS, HG, IL or AE.
    - generic [ref=f340e62]:
      - heading "About the Smithsonian" [level=2] [ref=f340e63]
      - generic [ref=f340e64]:
        - generic [ref=f340e65]: The Smithsonian Institution is the world’s largest museum, education, and research complex, with 21 museums and the National Zoo—shaping the future by preserving heritage, discovering new knowledge, and sharing our resources with the world.
        - generic [ref=f340e66]: The Institution was founded in 1846 with funds from the Englishman James Smithson (1765–1829) according to his wishes “under the name of the Smithsonian Institution, an establishment for the increase and diffusion of knowledge.” We continue to honor this mission and invite you to join us in our quest.
