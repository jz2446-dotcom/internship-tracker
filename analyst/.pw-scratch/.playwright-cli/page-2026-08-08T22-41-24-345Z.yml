              - paragraph [ref=f362e61]
              - paragraph [ref=f362e62]:
                - strong [ref=f362e63]: Welcome to the City of Memphis application process!
              - paragraph [ref=f362e64]
              - paragraph [ref=f362e65]:
                - strong [ref=f362e66]: "Special Note:"
                - text: To view “Open” vacancies please scroll down the listing below. Please note there may be multiple pages of listings.
              - paragraph [ref=f362e67]:
                - strong [ref=f362e68]: "Attention City Employees:"
                - text: To view “Promotional” vacancies, click on the Menu button at the top left-hand corner of this page and select “Promotional Jobs-Open to Internal Applicants Only”.
              - paragraph [ref=f362e69]
              - paragraph [ref=f362e70]: All employees hired after January 1, 2005 are required to live and maintain legal residence within the boundaries of Shelby County, TN within (6) months after the date of employment.
              - paragraph [ref=f362e71]
              - paragraph [ref=f362e72]: The Recruitment and Selection Service Center / Human Resources Division is responsible for the hiring process for City of Memphis Government. The Recruitment and Selection Service Center accepts applications posted through partnership with NEOGOV, a comprehensive and integrated on-line recruitment, selection and applicant tracking system for job applicants. Applications are completed on-line and stored, eliminating the need to fill out a new application each time you apply for another position. Computer access is available at the Recruitment and Selection Service Center and at free public-use computers at Public Library locations through-out the City of Memphis.
              - paragraph [ref=f362e73]
              - paragraph [ref=f362e74]: Applications are only accepted through the new online system. If this is your first time to apply using "governmentjobs.com", you will be prompted to create your unique job application profile. Once your profile has been established, you can submit your application by selecting the position in which you are interested and clicking on "Apply". Your account will be saved and used to apply for future job openings. Online applications are stored on a secure site. Only authorized employees and hiring authorities have access to the information submitted.
              - paragraph [ref=f362e75]
              - paragraph [ref=f362e76]: Your "governmentjobs.com" profile is based on a unique e-mail address. Communication with applicants will be conducted through this e-mail address. Check your e-mail frequently for notifications regarding your application.
              - paragraph [ref=f362e77]
              - paragraph [ref=f362e78]:
                - strong [ref=f362e79]: "SPECIAL NOTE TO CITY OF MEMPHIS EMPLOYEES:"
                - text: Do not allow anyone to apply using your profile. Any changes made to your profile will modify your information and records in the system.
              - paragraph [ref=f362e80]
              - paragraph [ref=f362e81]: An incomplete application, missing documents, or false responses to questions may result in disqualification. It is important that your application include all relevant education and experience, including that with the City of Memphis. Before applying, please update your profile (address, education, work history, etc.) to ensure that the most current information is considered.
              - paragraph [ref=f362e82]
              - paragraph [ref=f362e83]: Applications are accepted until 11:59 P.M. of the closing date listed on the Job Posting.
              - paragraph [ref=f362e84]
              - paragraph [ref=f362e85]: In compliance with Tennessee law, all public information provided is subject to open records disclosure.
              - paragraph [ref=f362e86]
              - paragraph [ref=f362e87]:
                - strong [ref=f362e88]: Equal Opportunity Employer
              - paragraph [ref=f362e89]
