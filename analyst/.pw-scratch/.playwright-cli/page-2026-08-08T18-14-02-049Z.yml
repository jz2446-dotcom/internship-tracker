  - generic [ref=f336e67]:
    - generic [ref=f336e68]: 2025 Bank of China Summer Internship Program
    - heading "2025-03-03" [level=5] [ref=f336e71]
    - generic [ref=f336e75]:
      - paragraph [ref=f336e76]: Established in February 1912, Bank of China Limited (hereinafter referred to as the “Bank” or “BOC”) is the longest continuously operating, as well as the most globalized and diversified bank in China. The Bank has institutions in 64 countries and regions outside the Chinese mainland and provides a full suite of financial services to its customers.
      - paragraph [ref=f336e77]: "To meet its need for business development and talent reserves, the Bank now launches its 2025 Summer Intern Program. Relevant details are as follows:"
      - paragraph [ref=f336e78]:
        - strong [ref=f336e79]: I. Institutions with Internship Opportunities
      - paragraph [ref=f336e80]: The recruitment process will be a unified one. internship opportunities are available in the Head Office, Head Office-level institutions, domestic branches in the Chinese mainland and non-banking subsidiaries.
      - paragraph [ref=f336e81]:
        - strong [ref=f336e82]: II. Job Openings
      - paragraph [ref=f336e83]:
        - strong [ref=f336e84]: i. The Head Office
      - paragraph [ref=f336e85]: 1. Head Office departments
      - paragraph [ref=f336e86]: "Intern (IT): Application is open to graduates of 2026 majoring in information technology related fields from domestic and foreign universities. Successful applicants will be assigned to the Information Technology Department and major business departments. Place of work: Beijing."
      - paragraph [ref=f336e87]:
        - strong [ref=f336e88]: ii. Head Office-level institutions
      - paragraph [ref=f336e89]: "1. IT Operation Center Intern (IT): Application is open to graduates of 2026 majoring in information technology related fields from universities both at home and abroad. The IT Operation Center is mainly responsible for production and operation management of information systems across the Bank, Group cybersecurity and Group cloud-platform building, and digitalization in IT operation. Place of work: Beijing."
      - paragraph [ref=f336e90]: "2. Software Center Intern (IT): Application is open to graduates of 2026 majoring in information technology related fields from universities both at home and abroad. The Software Center is mainly responsible for the development, testing, and maintenance of information systems across the Bank. Place of work: Shanghai, Wuhan or Chengdu."
      - paragraph [ref=f336e91]:
        - strong [ref=f336e92]: iii. Domestic branches in the Chinese mainland
      - paragraph [ref=f336e93]: "1. Intern (Comprehensive services): Application is open to graduates of 2026 from universities both at home and abroad. Successful applicants will be assigned to back offices or outlets at various levels."
      - paragraph [ref=f336e94]: "2. Intern (IT): Application is open to graduates of 2026 majoring in information technology related fields from universities both at home and abroad. Successful applicants will be placed with IT teams at different levels of branches."
      - paragraph [ref=f336e95]: "3. Intern (Marketing Services): Application is open to graduates of 2026 from universities both at home and abroad. Successful applicants will be assigned to outlets."
      - paragraph [ref=f336e96]:
        - strong [ref=f336e97]: iv. Non-banking subsidiaries
      - paragraph [ref=f336e98]: Application is open to graduates of 2026 from universities both at home and abroad.
      - paragraph [ref=f336e99]: For specific positions and requirements, please go to the Spring Campus Recruitment and Intern Recruitment page on the website of the Bank.
      - paragraph [ref=f336e100]:
        - strong [ref=f336e101]: III. How to Apply
      - paragraph [ref=f336e102]: Starting from today, applicants can visit the Spring Campus Recruitment and Intern Program page on the website of the Bank for more information and sign up for an account. Once profiles have been completed, applicants may create and submit their applications to openings listed. (For the intern program, each applicant can apply for only one position within the same tier-1 institution and no more than four positions in total; and applicants may NOT apply to both the Spring Campus Recruitment positions and the Internship Program at the same time. In the case of multiple applications, each will be assessed individually and has no precedence over one another).
      - paragraph [ref=f336e103]: "URL: https://campus.chinahr.com/pages/boc-2025-Spring"
      - paragraph [ref=f336e104]:
        - text: The application deadline is 24:00 on March 18
        - superscript [ref=f336e105]: th
        - text: ", 2025 Beijing Time."
      - paragraph [ref=f336e106]:
        - strong [ref=f336e107]: IV. Assessment, Internship, and Retention Arrangements
      - paragraph [ref=f336e108]: i. The intern recruitment process is consistent with the overall arrangement of BOC’s spring campus recruitment, with the Head Office organizing and implementing written tests, and each institution organizing interviews and evaluations separately.
      - paragraph [ref=f336e109]: ii. Successful applicants to the intern program will sign internship agreements with the institutions they are assigned to and complete their internship as arranged by the institution. For those who perform well, pass background checks and physical examinations, the institution is authorized to retain and sign labor contracts with them after completing certain procedures.
      - paragraph [ref=f336e110]: V. Miscellaneous
      - paragraph [ref=f336e111]: i. Applicants should accurately and completely fill in their resumes and relevant information, ensuring the authenticity of all information, otherwise, the Bank reserves the right to disqualify the applications.
      - paragraph [ref=f336e112]: ii. As positions and job requirements vary across institutions and some institutions have specific requirements, applicants should make sure that their skills, knowledge and experience match the positions that they apply to avoid invalid application.
      - paragraph [ref=f336e113]: iii. Written examinations will be organized by the BOC. Details will be sent to applicants via email or a SMS message from 95566.
      - paragraph [ref=f336e114]: iv. Throughout the recruitment process, the Bank will contact applicants using the information (including cellphone number and email address) that they provide in their application. Please make sure the contact information is correct and up to date.
      - paragraph [ref=f336e115]: v. The Bank does not have any test center, exam-setting center or any similar institutions established by itself or by others at its request. The Bank has never compiled or published any reference materials for the recruitment examination or provided examination-related materials or information to any institution. During recruitment, the Bank will not collect any fee from applicants. Please stay vigilant and beware of fraud.
      - paragraph [ref=f336e116]: vi. The Bank reserves the right to adjust, cancel or terminate the recruitment of certain positions as circumstances may warrant, including changes in hiring needs and the quantity of applications received. The final interpretation of the recruitment is at the sole discretion of the Bank.
      - paragraph [ref=f336e117]: vii. The official website of BOC, the official WeChat account “Bank of China Talent Recruitment” (中国银行人才招聘) and “Bank of China Spring Campus Recruitment and Intern Recruitment” (中国银行春季招聘和实习生招聘) website are the official channels for publishing campus recruitment announcements and related information. Other channels are not authorized or permitted.
      - paragraph [ref=f336e118]: "Appendix:"
      - list [ref=f336e119]:
        - listitem [ref=f336e120]:
          - link "Qualifications Required for 2025 Bank of China Summer Internship Program.pdf" [ref=f336e121] [cursor=pointer]:
            - /url: https://pic.bankofchina.com/bocappd/appform/202503/P020250303581656616884.pdf
