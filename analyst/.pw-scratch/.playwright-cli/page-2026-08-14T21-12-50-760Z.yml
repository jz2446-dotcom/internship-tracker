          - 'heading "Action Alert: Support the GROWTH Act" [level=3] [ref=f11e108]'
          - paragraph [ref=f11e109]: Please join us in supporting the GROWTH Act so that mutual fund investors like you can save for the long term without facing annual tax bills. Under current tax rules, mutual fund shareholders outside of tax-preferred accounts are taxed annually on capital gain distributions, even if you don’t receive a single dollar in cash. The bipartisan GROWTH Act would change that, allowing you to defer taxes on reinvested gains until you sell your shares.
          - link "Find out more and take action" [ref=f11e112] [cursor=pointer]:
            - /url: https://domini.com/growth-act/
