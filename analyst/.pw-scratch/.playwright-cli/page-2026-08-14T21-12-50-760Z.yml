          - paragraph [ref=f11e102]: We’re proud to share the results of our 2025 PRI assessment, an annual reporting project designed to measure how effective PRI signatories are at implementing responsible investment practices. This year, we received 5 stars in all applicable reporting modules, scoring well above the PRI median in each. As a founding PRI signatory, we remain fully committed to growing and advancing the field of sustainable, responsible and impact investing.
          - link "Read more" [ref=f11e105] [cursor=pointer]:
