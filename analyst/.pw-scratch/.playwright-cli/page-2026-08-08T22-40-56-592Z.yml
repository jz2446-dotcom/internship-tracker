                    - text: ", and"
                    - strong [ref=f386e176]: presentation design
                    - text: .
                  - listitem [ref=f386e177]:
                    - text: Familiarity with
                    - strong [ref=f386e178]: virtual meeting platforms
                    - text: (Microsoft Teams, Zoom).
                  - listitem [ref=f386e179]:
                    - text: Experience with
                    - strong [ref=f386e180]: project management tools
                    - text: (Planner, Asana, Trello, Monday.com).
                  - listitem [ref=f386e181]: Ability to learn new software quickly and adapt to evolving technology needs.
                  - listitem [ref=f386e182]: Comfort with basic data organization, spreadsheets, and tracking systems.
                - paragraph [ref=f386e183]:
                  - strong [ref=f386e184]: Qualifications
                - list [ref=f386e185]:
                  - listitem [ref=f386e186]: 5+ years of administrative, coordination, or office support experience.
                  - listitem [ref=f386e187]: Strong organizational skills with the ability to manage multiple priorities.
                  - listitem [ref=f386e188]: Excellent written and verbal communication skills.
                  - listitem [ref=f386e189]: High attention to detail, accuracy, and follow-through.
                  - listitem [ref=f386e190]: Ability to work collaboratively and maintain positive working relationships.
                  - listitem [ref=f386e191]: Demonstrated discretion, judgment, and professionalism.
                  - listitem [ref=f386e192]: Experience supporting senior leadership is required.
                - paragraph [ref=f386e193]:
                  - strong [ref=f386e194]: Key Competencies
                - list [ref=f386e195]:
                  - listitem [ref=f386e196]:
                    - strong [ref=f386e197]: Organization & Prioritization
                    - text: — Efficiently manages multiple tasks and deadlines.
                  - listitem [ref=f386e198]:
                    - strong [ref=f386e199]: Communication Excellence
                    - text: — Produces clear, professional written and verbal communication.
                  - listitem [ref=f386e200]:
                    - strong [ref=f386e201]: Technical Proficiency
                    - text: — Uses digital tools confidently and improves tech-driven workflows.
                  - listitem [ref=f386e202]:
                    - strong [ref=f386e203]: Collaboration & Support
                    - text: — Works effectively with internal teams.
                  - listitem [ref=f386e204]:
                    - strong [ref=f386e205]: Initiative & Problem-Solving
                    - text: — Anticipates needs and proactively resolves issues.
                  - listitem [ref=f386e206]:
                    - strong [ref=f386e207]: Adaptability
                    - text: — Adjusts quickly to shifting priorities and unexpected changes.
                  - listitem [ref=f386e208]:
                    - strong [ref=f386e209]: Professionalism & Confidentiality
                    - text: — Maintains discretion and represents leadership well.
                - separator [ref=f386e210]
                - paragraph [ref=f386e211]:
                  - strong [ref=f386e212]: "Additional Considerations:"
                - list [ref=f386e213]:
                  - listitem [ref=f386e214]:
                    - strong [ref=f386e215]: Requires an extensive background check
                  - listitem [ref=f386e216]:
                    - strong [ref=f386e217]: May involve working non-standard hours, as required
                - paragraph [ref=f386e218]:
                  - strong [ref=f386e219]: "NOTE: This position requires a thorough background investigation to include a life-long, national criminal history check and drug screening."
                - paragraph [ref=f386e220]:
                  - strong [ref=f386e221]: We do not hire candidates who do not pass the background investigation process.
                - paragraph [ref=f386e222]
                - paragraph [ref=f386e223]:
                  - strong [ref=f386e224]: "Minimum Qualifications:"
                - paragraph [ref=f386e225]:
                  - generic [ref=f386e226]: Five (5) years of high-level administrative support, preferably in a municipal environment.
                  - text: Associate's degree in Business Administration or Public Administration is highly preferred; or any equivalent combination of education, training, and experience which provides the requisite knowledge, skills, and abilities for this job.
                - paragraph [ref=f386e227]:
                  - strong [ref=f386e228]: "Specific License or Certification Required:"
                  - text: May require possession and maintenance of valid State of Georgia Notary Public certification.
                - paragraph [ref=f386e229]:
                  - generic [ref=f386e230]:
                    - strong [ref=f386e231]: Specific Knowledge, Skills, or Abilities
                    - text: ":"
                  - text: Must be able to demonstrate proficiency in performance of the essential functions and learn, comprehend, and apply all county or departmental policies, practices, and procedures necessary to function effectively in the position.
                - paragraph
              - term:
                - heading [level=2]
              - definition [ref=f386e232]:
                - paragraph
                - paragraph [ref=f386e233]:
                  - strong [ref=f386e234]: "Purpose of Classification:"
                  - text: The purpose of this classification is to serve as administrative support for a large division or department. While the essential functions are similar to those of an Administrative Specialist, Administrative Coordinators are broadly responsible for all administrative support functions in a division or department, whereas Administrative Specialists typically focus more narrowly on one or more aspects of the work. Work requires a broader knowledge and comprehension of techniques, information, methods, and organizational procedures, wherein a moderate latitude for judgment relative to understanding and interpretation is required.
                  - strong [ref=f386e235]: "Essential Functions:"
                  - emphasis [ref=f386e236]: The following duties are normal for this position. The omission of specific statements of the duties does not exclude them from
                  - emphasis [ref=f386e237]: the classification if the work is similar, related, or a logical assignment for this classification. Other duties may be required
                  - emphasis [ref=f386e238]: and assigned.
                  - text: Serves as liaison between the assigned department and other departments/divisions, staff members, County officials, the public, community leaders, outside agencies, or other individuals or organizations for the distribution and receipt of routine information; interacts with various officials and dignitaries involving sensitive client relations; conveys information among division/department personnel; circulates documentation to appropriate departments.
                - paragraph [ref=f386e239]: Serves as departmental human resources liaison; prepares new employee paperwork; processes documentation pertaining to personnel/payroll functions; reviews timesheets for accuracy and researches discrepancies; tracks accrued and used sick leave and vacation time; enters payroll data into computer for payment; prepares personnel change forms; maintains attendance records, confidential personnel/payroll files, employee rosters, certifications, background checks, and related records.
                - paragraph [ref=f386e240]:
                  - text: "Provides administrative/secretarial support for management and/or staff of assigned department/division: relieves management staff of routine administrative tasks; screens telephone calls, mail, e-mail, and other communications and initiates appropriate action/response; records and transcribes dictation; types, composes, edits, or proofreads various documentation; maintains calendars and schedules meetings, appointments, interviews, or other activities; coordinates travel arrangements, accommodations, conference registrations, or related plans for department staff.Processes documentation pertaining to budget or general financial management; reviews invoices for accuracy, matches with purchase orders; enters budget data into computer; assists with budget preparation; provides budgetary input and assists in forecasting revenues/expenditures; enters daily revenue into computer and generates revenue reports; reviews monthly budget analysis reports; monitors expenditures to ensure compliance with approved budget; processes budget transfers as needed; reconciles payable records with Finance Department records prepares bank deposits; coordinates internal accounting activities; maintains current balances for accounts; and maintains departmental petty cash fundsProcesses purchasing documentation: reviews purchase requisitions and verifies availability of budgeted funds; prepares purchase orders and forwards data to appropriate departments; obtains competitive price quotes; orders materials under blanket purchase orders.; reviews invoices, purchase orders, or other documents for accuracy; researches discrepancies, assigns proper accounting/budgetary codes, obtains proper signatures, and forwards for payment; maintains files and records.Receives and sorts incoming documentation and materials: sends/receives documentation; distributes/delivers incoming faxes, subpoenas, mail, or other documentation to appropriate personnel; sorts, organizes, opens, and/or distributes incoming mail; signs for incoming packages and delivers to appropriate personnel; processes outgoing mail; copies and distributes forms, reports, correspondence, schedules, agendas, or other documentation.Performs customer service functions in person, by telephone, and by mail: provides information/assistance regarding department/division services, procedures, fees, or other issues; responds to routine questions or complaints; researches problems/complaints and initiates problem resolution; receives payments for various fees, fines, or services: records transactions, posts payments, and issues receipts; balances cash drawers; prepares revenues for deposit and forwards as appropriate.Provides administrative support for boards, committees, or other meetings: prepares meeting agendas, packets, and related documentation; coordinates meeting rooms/facilities, equipment, and refreshments; notifies participants of scheduled meetings; submits public notices to newspapers, property owners, or others as required; prepares and distributes agendas, meeting notices, meeting packets, and related documentation; records and transcribes meeting minutes; distributes meeting minutes to appropriate individuals; maintains official records.Maintains department webpage, social media, and online enrollment; uploads pictures, schedules, brochures and other events and information; adds upcoming events to calendar; posts news and announcements; enters and maintains information regarding classes and fees; processes registrations, memberships and rentals; runs reports and prints class lists; assists customers with creating user accounts and site navigation as needed. Coordinates arrangements for various meetings; notifies participants of scheduled meetings; prepares meeting notices, agendas, and meeting packets; coordinates room reservations, setup, refreshments, and equipment required for meetings; attends meetings; records and/or transcribes meeting minutes; distributes documentation; maintains records.Processes a variety of documentation associated with department operations within designated imeframes and per established procedures; receives, reviews, records, types, and/or distributes documentation; enters data into computer systems; logs, tracks, or maintains records regarding department activities; compiles data for further processing or for use in preparation of department reports; files, maintains, and stores hardcopy records.Maintains file system of various files/records for the department, prepares files, organizes documentation, and files documents in designated order; retrieves/replaces files; scans records into computer; shreds/destroys confidential or obsolete documents; conducts records maintenance activities in compliance with guidelines governing record retention.Maintains current maps, telephone lists, directories, operating manuals, procedures, and other reference materials.Conducts research of department files, database records, hardcopy materials, Internet sites, or other sources as needed.Monitors inventory of department supplies and forms: ensures availability of adequate materials to conduct work activities; initiates requests/orders for new or replacement supplies.Operates a personal computer, scanner, telephone, postage machine, dictation equipment, shredder, general office equipment, two-way radio, or other equipment as necessary to complete essential functions, to include the use of word processing, spreadsheet, database, presentation, graphics, desktop publishing, e-mail, Internet, or other computer programs; provides training and/or technical support for other system users; troubleshoots computer problems and performs basic maintenance of Computer system and general office equipment, such as backing up data or replacing paper, ink, or toner.Communicates with supervisor, employees, volunteers, other departments, County officials, other municipalities, government agencies, attorneys, engineers, contractors, vendors, sales representatives, customers, the public, community organizations, outside agencies, and other individuals as needed to coordinate work activities, review status of work, exchange information, or resolve problems."
                  - strong [ref=f386e241]: "Additional Functions:"
                  - text: Performs other related duties as required.
                - paragraph
              - term:
                - heading [level=2]
              - definition [ref=f386e242]:
                - paragraph
                - paragraph [ref=f386e243]:
                  - strong [ref=f386e244]: SPECIAL REQUIREMENTS:*All applicants must agree to and successfully pass a background investigation, drug screening and polygraph to be considered for employment with the Fulton County Sheriff's Office.*
                  - strong [ref=f386e245]: "EXAMINATION:"
                  - text: The examination will consist of an evaluation of education and experience, accomplished by analysis of the application. Application must document that the applicant possesses the minimum knowledge, skills, education and experience as listed to be rated as qualified. If selected, an official, accredited college transcript is required, at time of employment, for all degrees/course work used to qualify for this position.
                  - strong [ref=f386e246]: All applications must be completed in full before they are submitted. Please review all applications for accuracy and make all corrections before submittal because errors can result in not meeting the minimum qualifications. Additional information will not be accepted after applications are received by the Department of Human Resources Management.
                - paragraph [ref=f386e247]:
                  - strong [ref=f386e249]: "Performance Aptitudes:"
                  - strong [ref=f386e251]: Data Utilization
                  - text: ": Requires the ability to review, classify, categorize, prioritize, and/or analyze data. Includes exercising discretion in determining data classification, and in referencing such analysis to established standards for the purpose of recognizing actual or probable interactive effects and relationships."
                  - strong [ref=f386e253]: Human Interaction
                  - text: ": Requires the ability to apply principles of persuasion and/or influence over others in coordinating activities of a project, program, or designated area of responsibility."
                  - generic [ref=f386e254]:
                    - strong [ref=f386e255]: Equipment, Machinery, Tools, and Materials Utilization
                    - text: ":"
                  - text: Requires the ability to operate, maneuver and/or control the actions of equipment, machinery, tools, and/or materials used in performing essential functions.
                  - strong [ref=f386e257]: Verbal Aptitude
                  - text: ": Requires the ability to utilize a wide variety of reference, descriptive, and/or advisory data and information."
                  - strong [ref=f386e259]: Mathematical Aptitude
                  - text: ": Requires the ability to perform addition, subtraction, multiplication, and division; the ability to calculate decimals and percentages; the ability to utilize principles of fractions; and the ability to interpret graphs."
                  - generic [ref=f386e260]:
                    - strong [ref=f386e261]: Functional Reasoning
                    - text: ":"
                  - text: Requires the ability to apply principles of influence systems, such as motivation, incentive, and leadership, and to exercise independent judgment to apply facts and principles for developing approaches and techniques to resolve problems.
                  - strong [ref=f386e263]: Situational Reasoning
                  - text: ": Requires the ability to exercise judgment, decisiveness and creativity in situations involving the evaluation of information against sensory, judgmental, or subjective criteria, as opposed to that which is clearly measurable or verifiable."
                - paragraph
              - term:
                - heading [level=2]
              - definition [ref=f386e264]:
                - paragraph [ref=f386e265]:
                  - emphasis [ref=f386e266]:
                    - strong [ref=f386e267]: It is the policy of Fulton County that there will be equal opportunity for every citizen, employee and applicant, based upon merit without regard to race, color, religion, national origin, gender, age, genetics, disability or sexual orientation.
