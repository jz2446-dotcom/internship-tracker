                - paragraph [ref=f386e118]
                - img "UNCLASSIFIED POSITION IN THE FULTON COUNTY SHERIFF'S OFFICE" [ref=f386e120]
                - strong [ref=f386e122]:
                  - text: UNCLASSIFIED POSITION IN THE FULTON COUNTY SHERIFF'S OFFICE
                  - generic [ref=f386e123]: MUST BE FLEXIBLE TO WORK AS NEEDED, INCLUDING AFTER HOURS, HOLIDAYS AND WEEKENDS
                - strong [ref=f386e125]
                - paragraph [ref=f386e126]:
                  - strong [ref=f386e127]: ADMINISTRATIVE COORDINATOR
                - paragraph [ref=f386e128]: Fulton County Sheriff's Office is seeking a highly skilled administrative professional to provide comprehensive high-level administrative, operational, and organizational support, ensuring efficient administrative operations and contributing to the smooth functioning and support of daily activities across the Agency. This role ensures the executive office functions efficiently by managing daily workflows, coordinating communication, supporting meetings and projects, and maintaining accurate documentation. The Administrative Coordinator is a key partner, streamlining processes, and enhancing the overall effectiveness of the office. Responsible for preparation of reports, spreadsheets, correspondence, presentations, and other documents, and requires proficiency in Microsoft Office and various administrative tasks, excellent communication skills, strong organizational skills, attention to detail, the ability to handle multiple tasks simultaneously, the ability to work effectively in a fast-paced environment, and professional decorum and a consistently pleasant demeanor.
                - paragraph [ref=f386e129]
                - paragraph [ref=f386e130]:
                  - strong [ref=f386e131]: ESSENTIAL DUTIES & RESPONSIBILITIES
                - paragraph [ref=f386e132]:
                  - strong [ref=f386e133]: Executive Office Administration
                - list [ref=f386e134]:
                  - listitem [ref=f386e135]: Manage daily administrative operations, including scheduling, calendar coordination, and deadline tracking.
                  - listitem [ref=f386e136]: Prepare, edit, and format documents, presentations, and reports.
                  - listitem [ref=f386e137]: Maintain organized digital and physical filing systems, ensuring information is accessible and up to date.
                  - listitem [ref=f386e138]: Perform support functions for executive-level tasks, providing reliable backup coverage when needed.
                - paragraph [ref=f386e139]:
                  - strong [ref=f386e140]: Communication & Correspondence
                - list [ref=f386e141]:
                  - listitem [ref=f386e142]: Draft, proofread, and distribute professional correspondence, announcements, and internal communications.
                  - listitem [ref=f386e143]: Triage incoming emails and inquiries, routing items appropriately and ensuring timely responses.
                  - listitem [ref=f386e144]: Serve as a liaison with internal divisions, external partners, and stakeholders.
                - paragraph [ref=f386e145]:
                  - strong [ref=f386e146]: Meeting & Event Coordination
                - list [ref=f386e147]:
                  - listitem [ref=f386e148]: Schedule meetings, reserve rooms, and manage logistics for internal and external engagements.
                  - listitem [ref=f386e149]: Prepare agendas, briefing packets, presentations, and supporting materials.
                  - listitem [ref=f386e150]: Attend meetings as needed to take minutes, document action items, and track follow-up tasks.
                  - listitem [ref=f386e151]: Assist with planning and coordination of special events, leadership meetings, and Agency activities.
                - paragraph [ref=f386e152]:
                  - strong [ref=f386e153]: Project & Workflow Support
                - list [ref=f386e154]:
                  - listitem [ref=f386e155]: Assist with research, data collection, and administrative components of Agency projects.
                  - listitem [ref=f386e156]: Track progress on initiatives, deadlines, and deliverables, ensuring alignment with executive priorities.
                  - listitem [ref=f386e157]: Identify opportunities to streamline workflows and improve administrative processes.
                - paragraph [ref=f386e158]:
                  - strong [ref=f386e159]: Confidentiality & Professionalism
                - list [ref=f386e160]:
                  - listitem [ref=f386e161]: Handle sensitive information with discretion and maintain strict confidentiality.
                  - listitem [ref=f386e162]: Represent the office with professionalism, courtesy, and a high level of customer service.
                - paragraph [ref=f386e163]:
                  - strong [ref=f386e164]: Required Computer & Technical Skills
                - list [ref=f386e165]:
                  - listitem [ref=f386e166]:
                    - text: Strong proficiency in
                    - strong [ref=f386e167]: Microsoft Office Suite
                    - text: (Outlook, Word, Excel, PowerPoint).
                  - listitem [ref=f386e168]:
                    - text: Experience with
                    - strong [ref=f386e169]: digital scheduling tools
                    - text: and shared calendars.
                  - listitem [ref=f386e170]:
                    - text: Ability to manage
                    - strong [ref=f386e171]: cloud-based file systems
                    - text: (OneDrive, SharePoint, Google Drive).
                  - listitem [ref=f386e172]:
                    - text: Skilled in
