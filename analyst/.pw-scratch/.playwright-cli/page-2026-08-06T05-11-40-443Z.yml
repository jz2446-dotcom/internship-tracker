              - paragraph [ref=f57e134]: The Folger Shakespeare Library offers a variety of paid internship opportunities for high school, undergraduate, and graduate students to gain hands-on experience. We pride ourselves on creating immersive experiences for our interns to learn about the daily operations of an independent research library with a vigorous set of cultural and educational programs.
