          - paragraph [ref=f57e71]: The Folger Shakespeare Library knows that an exceptional staff is the backbone of any great organization. We hire exceptionally qualified individuals who are committed to the mission, vision, and values of our organization. Our recruitment process strives to be interactive, accessible, and responsive.
