      - generic [ref=f970e53]:
        - heading "Opening Hours Of American Museum Of Natural History" [level=2] [ref=f970e55]
        - generic [ref=f970e59]:
          - generic [ref=f970e62]:
            - paragraph [ref=f970e63]: The American Museum of Natural History is one of those New York visits that rewards a little planning. The good news is that the core schedule is simple and consistent, so you can fit it into almost any itinerary without guesswork. The Museum is open daily from 10.00 to 17.30. There are only 2 days that are big exceptions and it is closed on Thanksgiving Day and Christmas Day. It is the basic line you will use if you are planning your day in Manhattan, and deciding whether you go first or last to Central Park.
            - paragraph [ref=f970e64]: If you’re using Tiqets as a booking reference, the hours on the ticket page, like on the daily, are the same, allowing you to keep your plans in one place. Tiqets also interprets the visit as general access to the permanent halls, such as the Rose Center for Earth and Space and the Gilder Center, and so the actual “decision on timing” is not made on the basis of the seasons, but on the basis of the amount of an individual wants to see all at once. The Museum is vast, the hours are plentiful, but they can still slip away so quickly when you are flying between dinosaurs, minerals and ocean life.
            - paragraph [ref=f970e65]: "One way to consider the day is to divide it into three comfort zones. The first hour after opening is usually quieter, particularly for the most popular halls, and it’s good if you’re looking for a smoother start and cleaner photos. School trips and family groups often build up in the middle of the day and this can make some corridors feel slower. The final 60-90 minutes are good, but only if you are able to arrive early enough to feel comfortable. The Museum doesn’t have a universal “last entry” time on the hours page, so the smartest visitor rule is: don’t try to arrive close to closing time. If you arrive around 16.30, you have some time to get in, orient yourself and at least one of the major halls without the pressure of watching the clock."
            - paragraph [ref=f970e66]: Please also note that parts of the Museum are occasionally closed for maintenance and events and the Museum has a rolling list of temporary hall closures. That doesn’t alter the hours, but it may impact the way you plan your route on the day, particularly if you have one particular hall that you are most interested in.
          - button "SHOW MORE" [ref=f970e67] [cursor=pointer]
