    - generic [ref=f1117e20]:
      - heading "About the role" [level=2] [ref=f1117e21]
      - generic [ref=f1117e23]:
        - paragraph [ref=f1117e24]:
          - text: Read through our
          - link "Internships FAQ" [ref=f1117e25] [cursor=pointer]:
            - /url: https://internships.shopify.com/a/faq/
          - text: to help answer any questions you may have about internships at Shopify.
        - paragraph [ref=f1117e26]:
          - strong [ref=f1117e27]: "Being a Shopify Intern:"
        - paragraph [ref=f1117e28]: Our hiring process is unique. We hire interns and place them on teams we think they’d be successful on. We match interns with teams based on their experience, interest, and what works best for Shopify.
        - paragraph [ref=f1117e29]: "We are looking primarily for interns to fill a large number of internship roles in Software Engineering:"
        - list [ref=f1117e30]:
          - listitem [ref=f1117e31]:
            - paragraph [ref=f1117e32]:
              - emphasis [ref=f1117e33]: "Software Engineering:"
              - text: crafting the code that powers commerce, creating the extendable products that scale the entire commerce stack.
        - paragraph [ref=f1117e34]: "Candidates with relevant experience may also be considered for internships within these areas:"
        - list [ref=f1117e35]:
          - listitem [ref=f1117e36]:
            - paragraph [ref=f1117e37]:
              - emphasis [ref=f1117e38]: "Infrastructure Engineering:"
              - text: building and developing the blocks that move
              - emphasis [ref=f1117e39]: all
              - text: of Shopify forward.
          - listitem [ref=f1117e40]:
            - paragraph [ref=f1117e41]:
              - emphasis [ref=f1117e42]: "Security Engineering:"
              - text: detecting, evaluating, and addressing security threats to Shopify and its merchants.
        - paragraph [ref=f1117e43]: Shopify is a big part of the Ruby and Rails communities, and we’re constantly improving our codebase to make it even better. You do not need prior Rails experience to apply to this internship!
        - paragraph [ref=f1117e44]:
          - strong [ref=f1117e45]: "Working at Shopify:"
        - list [ref=f1117e46]:
          - listitem [ref=f1117e47]:
            - paragraph [ref=f1117e48]:
              - text: You must be legally entitled to work in the location you are applying to for the entire duration of the winter internship term (January 11 - April 30 2027).
              - emphasis [ref=f1117e49]:
                - strong [ref=f1117e50]: Shopify does not provide immigration support to intern candidates.
          - listitem [ref=f1117e51]:
            - paragraph [ref=f1117e52]: This internship is a 4-month long, full-time, paid experience - interns are expected not to be enrolled in school full-time while working at Shopify.
        - paragraph [ref=f1117e53]: "As an Intern you must be able to work from one of our offices:"
        - paragraph [ref=f1117e54]:
          - strong [ref=f1117e55]: Canada
        - list [ref=f1117e56]:
          - listitem [ref=f1117e57]:
            - paragraph [ref=f1117e58]: Montréal, Québec (490 Rue De la Gauchetière O)
          - listitem [ref=f1117e59]:
            - paragraph [ref=f1117e60]: Ottawa, Ontario (151 O’Connor Street)
          - listitem [ref=f1117e61]:
            - paragraph [ref=f1117e62]: Toronto, Ontario (620 King West)
        - paragraph [ref=f1117e63]:
          - strong [ref=f1117e64]: USA
        - list [ref=f1117e65]:
          - listitem [ref=f1117e66]:
            - paragraph [ref=f1117e67]: Bellevue (1100 112th Ave NE, Bellevue, WA 98004)
          - listitem [ref=f1117e68]:
            - paragraph [ref=f1117e69]: New York (85 10th Ave, New York City, New York 10011)
        - paragraph [ref=f1117e70]:
          - emphasis [ref=f1117e71]:
            - strong [ref=f1117e72]: "Please note:"
          - text: if you don’t currently live in one of the above cities, you must be willing and able to relocate for in-office experiences at one of these offices. If successful in your application, we will match you to a team when you start at Shopify. We’re unable to accommodate requests for particular teams and location changes once an offer is signed.
        - paragraph [ref=f1117e73]:
          - strong [ref=f1117e74]: "Onboarding:"
        - list [ref=f1117e75]:
          - listitem [ref=f1117e76]:
            - paragraph [ref=f1117e77]: Interns must be located in their office city by the first day of onboarding and be ready to work 9:00am - 5:00pm. Interns cannot work from outside of the country they are hired in during their internship.
        - paragraph [ref=f1117e78]:
          - strong [ref=f1117e79]: "Qualifications:"
        - list [ref=f1117e80]:
          - listitem [ref=f1117e81]:
            - paragraph [ref=f1117e82]: You love challenging yourself with projects or hacking just for fun
          - listitem [ref=f1117e83]:
            - paragraph [ref=f1117e84]: You are a constant learner
          - listitem [ref=f1117e85]:
            - paragraph [ref=f1117e86]: You have a passion for solving tough problems with code
          - listitem [ref=f1117e87]:
            - paragraph [ref=f1117e88]: You take ownership of the projects you work on
          - listitem [ref=f1117e89]:
            - paragraph [ref=f1117e90]: You enjoy research and figuring out how pieces of an entire project work
          - listitem [ref=f1117e91]:
            - paragraph [ref=f1117e92]: You take pride in creating simple solutions to complex problems
          - listitem [ref=f1117e93]:
            - paragraph [ref=f1117e94]: You have a strong commitment to quality
        - paragraph [ref=f1117e95]:
          - strong [ref=f1117e96]: "Compensation:"
          - text: This role currently has a base pay range of USD $85,000 to $93,700 for US locations and CAD $76,800 to $84,700 for Canada per annum, based on a candidate's experience and qualifications. Interns also receive a monthly allowance of USD $1,000 (US) / CAD $1000 (Canada) to use however best supports them during their internship.
        - paragraph [ref=f1117e97]:
          - strong [ref=f1117e98]: Additional Information
        - paragraph [ref=f1117e99]:
          - strong [ref=f1117e100]: "In your application:"
        - list [ref=f1117e101]:
          - listitem [ref=f1117e102]:
            - paragraph [ref=f1117e103]: Include your resume
          - listitem [ref=f1117e104]:
            - paragraph [ref=f1117e105]: Answer all of the application questions
          - listitem [ref=f1117e106]:
            - paragraph [ref=f1117e107]: Once you submit your application, and if you move forward in our process, you’ll then be emailed a series of mandatory assessments to complete. These will help assess your technical skills and your likelihood of success at Shopify.
        - paragraph [ref=f1117e108]: We know that applying for internships can be time-consuming, and we truly appreciate your effort. The Early Talent Programs Team are actual real live people (👋🏻) and we’re looking forward to learning more about you through your application.
        - paragraph [ref=f1117e109]:
          - strong [ref=f1117e110]: Applications will close on August 14th at 11:59pm EDT.
        - paragraph
        - paragraph [ref=f1117e111]:
          - strong [ref=f1117e112]: –
        - paragraph
        - heading [level=2] [ref=f1117e113]:
          - strong [ref=f1117e114]: Description du poste
        - paragraph [ref=f1117e115]:
          - text: Consultez notre
          - link "FAQ (questions fréquentes) sur les stages" [ref=f1117e116] [cursor=pointer]:
            - /url: https://internships.shopify.com/a/faq/
          - text: pour répondre à toutes vos questions sur le programme de stages chez Shopify.
        - paragraph [ref=f1117e117]:
          - strong [ref=f1117e118]: "Être stagiaire chez Shopify :"
        - paragraph [ref=f1117e119]: Notre processus de recrutement est unique. Nous embauchons des stagiaires, puis les intégrons aux équipes où ils sont le plus susceptibles de réussir, en fonction de leur expérience, de leurs intérêts et des besoins de Shopify.
        - paragraph [ref=f1117e120]: "Nous recherchons principalement des stagiaires pour plusieurs postes en ingénierie logicielle :"
        - list [ref=f1117e121]:
          - listitem [ref=f1117e122]:
            - paragraph [ref=f1117e123]:
              - emphasis [ref=f1117e124]: "Ingénierie logicielle :"
              - text: concevoir le code qui propulse le commerce et créer des produits évolutifs capables d’accompagner la croissance de l’ensemble de notre écosystème commercial.
        - paragraph [ref=f1117e125]: "Les personnes possédant une expérience pertinente peuvent également être considérées pour des stages dans les domaines suivants :"
        - list [ref=f1117e126]:
          - listitem [ref=f1117e127]:
            - paragraph [ref=f1117e128]:
              - emphasis [ref=f1117e129]: "Ingénierie des infrastructures :"
              - text: concevoir, bâtir et faire évoluer les fondations technologiques qui soutiennent Shopify.
          - listitem [ref=f1117e130]:
            - paragraph [ref=f1117e131]:
              - emphasis [ref=f1117e132]: "Ingénierie de la sécurité :"
              - text: détecter, évaluer et contrer les menaces qui pèsent sur la sécurité de Shopify et de ses marchands.
        - paragraph [ref=f1117e133]: Shopify joue un rôle important au sein des communautés Ruby on Rails, et nous améliorons continuellement notre base de code afin de la rendre plus performante. Aucune expérience préalable avec Rails n’est requise pour postuler à ce stage !
        - paragraph [ref=f1117e134]:
          - strong [ref=f1117e135]: "Travailler chez Shopify :"
        - list [ref=f1117e136]:
          - listitem [ref=f1117e137]:
            - paragraph [ref=f1117e138]:
              - text: Vous devez être légalement autorisé à travailler au Canada pendant toute la durée du stage d'hiver 2027 (du 11 janvier au 30 avril 2027).
              - emphasis [ref=f1117e139]: Shopify ne propose pas de soutien en matière d’immigration pour les stagiaires.
          - listitem [ref=f1117e140]:
            - paragraph [ref=f1117e141]: Ce stage est une expérience rémunérée à temps plein d’une durée de quatre mois. Les stagiaires doivent être disponibles à temps plein et ne pas être inscrits à des études à temps plein pendant leur stage chez Shopify.
        - paragraph [ref=f1117e142]: "En tant que stagiaire, vous devez être en mesure de travailler depuis l'un de nos bureaux:"
        - paragraph [ref=f1117e143]:
          - strong [ref=f1117e144]: Canada
        - list [ref=f1117e145]:
          - listitem [ref=f1117e146]:
            - paragraph [ref=f1117e147]: Montréal, Québec (490 Rue De la Gauchetière O)
          - listitem [ref=f1117e148]:
            - paragraph [ref=f1117e149]: Ottawa, Ontario (151, rue O'Connor)
          - listitem [ref=f1117e150]:
            - paragraph [ref=f1117e151]: Toronto, Ontario (620 King Ouest)
        - paragraph [ref=f1117e152]:
          - strong [ref=f1117e153]: États-Unis
        - list [ref=f1117e154]:
          - listitem [ref=f1117e155]:
            - paragraph [ref=f1117e156]: Bellevue (1100 112th Ave NE, Bellevue, WA 98004)
          - listitem [ref=f1117e157]:
            - paragraph [ref=f1117e158]: New York (85 10th Ave, New York City, New York 10011)
        - paragraph [ref=f1117e159]:
          - emphasis [ref=f1117e160]: "Veuillez noter :"
          - text: si vous ne résidez pas actuellement dans l'une des villes mentionnées ci-dessus, vous devez être disposé et en mesure de vous relocaliser pour des expériences en présentiel dans l'un de ces bureaux. Si votre candidature est retenue, nous vous assignerons à une équipe au moment de votre arrivée chez Shopify. Nous ne sommes pas en mesure d’accepter les demandes de placement dans une équipe précise ni les changements de lieu une fois l’offre signée.
        - paragraph [ref=f1117e161]:
          - strong [ref=f1117e162]: "Intégration :"
        - list [ref=f1117e163]:
          - listitem [ref=f1117e164]:
            - paragraph [ref=f1117e165]: Les stagiaires doivent être présents dans leur ville de travail dès le premier jour de leur intégration (le 11 janvier 2027) et être prêts à travailler de 9 h à 17 h. Vous ne pouvez pas travailler en dehors du pays prévu durant votre stage.
        - paragraph [ref=f1117e166]:
          - strong [ref=f1117e167]: "Profil recherché :"
        - list [ref=f1117e168]:
          - listitem [ref=f1117e169]:
            - paragraph [ref=f1117e170]: Vous souhaitez vous lancer des défis, que ce soit à travers des projets ou du hacking pour le plaisir.
          - listitem [ref=f1117e171]:
            - paragraph [ref=f1117e172]: Vous avez toujours soif d’apprendre.
          - listitem [ref=f1117e173]:
            - paragraph [ref=f1117e174]: Vous aimez résoudre des problèmes complexes avec du code.
          - listitem [ref=f1117e175]:
            - paragraph [ref=f1117e176]: Vous travaillez de manière autonome et prenez pleinement en charge les projets qui vous sont confiés.
          - listitem [ref=f1117e177]:
            - paragraph [ref=f1117e178]: Vous aimez la recherche et comprendre comment les différentes parties d’un projet s’articulent.
          - listitem [ref=f1117e179]:
            - paragraph [ref=f1117e180]: Vous savez trouver des solutions simples aux problèmes complexes.
          - listitem [ref=f1117e181]:
            - paragraph [ref=f1117e182]: La qualité est au cœur de votre travail.
        - paragraph [ref=f1117e183]:
          - strong [ref=f1117e184]: "Rémunération:"
        - paragraph [ref=f1117e185]: Ce poste offre actuellement une échelle salariale de base de 85 000 $ à y 93 700 $ USD pour les emplacements aux États-Unis et de 76 800 $ à 84 700 $ CAD pour le Canada par année, selon l'expérience et les qualifications du candidat. Les stagiaires reçoivent également une allocation mensuelle de 1 000 $ USD (États-Unis) ou 1 000 $ CAD (Canada) à utiliser comme bon leur semble pour les soutenir pendant leur stage.
        - paragraph [ref=f1117e186]:
          - strong [ref=f1117e187]: Informations supplémentaires
        - paragraph [ref=f1117e188]:
          - strong [ref=f1117e189]: "Dans votre candidature :"
        - list [ref=f1117e190]:
          - listitem [ref=f1117e191]:
            - paragraph [ref=f1117e192]: Ajoutez votre CV
          - listitem [ref=f1117e193]:
            - paragraph [ref=f1117e194]: Répondez à toutes les questions indiquées
          - listitem [ref=f1117e195]:
            - paragraph [ref=f1117e196]: Une fois votre candidature soumise, si vous êtes retenu pour la suite du processus, nous vous enverrons par e-mail une liste d’évaluations obligatoires à compléter. Celles-ci permettront d’évaluer vos compétences techniques et vos chances de succès chez Shopify.
        - paragraph [ref=f1117e197]: Nous savons que la recherche d’un stage peut être longue et pénible, et nous vous remercions sincèrement pour votre investissement. Notre équipe du programme de stages est composée de vraies personnes (👋🏻) et nous avons hâte d’en apprendre davantage sur vous à travers votre candidature.
        - paragraph [ref=f1117e198]:
          - strong [ref=f1117e199]: Les candidatures seront acceptées jusqu’au 14 août à 23 h 59 (heure de l'Est).
    - generic [ref=f1117e202]:
      - heading "About Shopify" [level=2] [ref=f1117e203]
      - generic [ref=f1117e205]:
        - paragraph [ref=f1117e206]: Opportunity is not evenly distributed. Shopify puts independence within reach for anyone with a dream to start a business. We propel entrepreneurs and enterprises to scale the heights of their potential. Since 2006, we’ve grown to over 8,300 employees and generated over $1 trillion in sales for millions of merchants in 175 countries.
        - paragraph [ref=f1117e207]: This is life-defining work that directly impacts people’s lives as much as it transforms your own. This is putting the power of the few in the hands of the many, is a future with more voices rather than fewer, and is creating more choices instead of an elite option.
    - generic [ref=f1117e210]:
      - heading "About you" [level=2] [ref=f1117e211]
      - generic [ref=f1117e212]:
        - paragraph [ref=f1117e214]: Moving at our pace brings a lot of change, complexity, and ambiguity—and a little bit of chaos. Shopifolk thrive on that and are comfortable being uncomfortable. That means Shopify is not the right place for everyone.
        - text: "Before you apply, consider if you can:"
        - list [ref=f1117e215]:
          - listitem [ref=f1117e216]: Care deeply about what you do and about making commerce better for everyone
          - listitem [ref=f1117e217]: Excel by seeking professional and personal hypergrowth
          - listitem [ref=f1117e218]: Keep up with an unrelenting pace (the week, not the quarter)
          - listitem [ref=f1117e219]: Be resilient and resourceful in face of ambiguity and thrive on (rather than endure) change
          - listitem [ref=f1117e220]: Bring critical thought and opinion
          - listitem [ref=f1117e221]: Put AI agents and tools to work on the tasks they're built for, and focus on the work only humans can do
          - listitem [ref=f1117e222]: Embrace differences and disagreement to get shit done and move forward
          - listitem [ref=f1117e223]: Work digital-first for your daily work
        - generic [ref=f1117e224]: We may use AI-enabled tools to screen, select, and assess applications. All AI outputs are reviewed and validated by our recruitment team.
    - generic [ref=f1117e225]:
      - generic [ref=f1117e226]:
        - heading "We hire people, not resumes. If you think you’re right for the role, apply now." [level=1] [ref=f1117e227]
