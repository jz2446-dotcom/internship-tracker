            - paragraph [ref=f22e185]: Online Application
            - paragraph [ref=f22e186]: "& Pre-Interview"
            - paragraph [ref=f22e187]: Assessment
          - paragraph [ref=f22e189]:
            - strong [ref=f22e190]: Enter basic details and upload your resume/CV. You'll receive a link to complete a pre-interview assessment where you record answers to questions based on the program you applied to. For those applying to Software Engineering and Analytics & Modeling functions, this includes a coding challenge. Applications will not be considered if the pre-interview assessment is not completed.
        - generic [ref=f22e191]:
