      - heading "Our programmes" [level=2] [ref=f22e80]
      - generic [ref=f22e82]:
        - generic [ref=f22e86]:
          - heading "Apprenticeship Programme" [level=2] [ref=f22e87]
          - paragraph [ref=f22e88]: Our Apprenticeship Programme is your chance to kick-start a career at BlackRock. Designed for school leavers, this 18-month training contract in Edinburgh or London offers hands-on experience in one of our business areas. From day one, you’ll be part of a team, learning how we work and contributing to meaningful projects. Throughout the programme, you’ll receive ongoing training and professional development to help you grow. Complete the programme successfully, and you could secure a full-time role with us – opening the door to an exciting future at BlackRock.
        - generic [ref=f22e92]:
          - heading "Full-Time Analyst Programme" [level=2] [ref=f22e93]
          - paragraph [ref=f22e94]: Join our two-year Analyst Programme and do work that matters. You’ll learn by doing, collaborate globally and help millions achieve financial well-being – all with the support of mentors who invest in your growth.
          - paragraph [ref=f22e95]:
            - strong [ref=f22e96]: "Eligibility:"
            - text: Undergraduate or master’s students graduating between June 2026 and July 2027, with fluency in English and the local language – except for Budapest and Investment roles in Zurich
          - paragraph [ref=f22e97]:
            - link "Learn more and apply" [ref=f22e98] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-full-time-analyst-program-emea/45831/97150826656
        - generic [ref=f22e102]:
          - heading "Client & Product Graduate Rotational Programme" [level=2] [ref=f22e103]
          - paragraph [ref=f22e104]: Our 2.5-year graduate programme offers rotations across Global Product Solutions and Client Business – the core engines of BlackRock’s client and product strategy. You’ll gain hands-on experience across the full client and product lifecycle, supported by structured learning, mentorship and meaningful projects, all designed to give you a comprehensive understanding of how we deliver investment solutions to meet clients’ evolving needs worldwide.
          - paragraph [ref=f22e105]:
            - strong [ref=f22e106]: "Eligibility:"
            - text: Undergraduate or master’s students graduating by July 2027, fluency in English and the local language
          - paragraph [ref=f22e107]:
            - link "Learn more and apply" [ref=f22e108] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-client-and-product-graduate-rotational-program-emea/45831/97150826688
      - generic [ref=f22e110]:
        - generic [ref=f22e112]:
          - heading "Summer Internship Programme" [level=2] [ref=f22e113]
          - paragraph [ref=f22e114]: Our eight-week Summer Internship (from June to August) gives you a real taste of life at BlackRock. You’ll work with a team, join conversations with leaders and connect with mentors – all while building skills that shape your future.
          - paragraph [ref=f22e115]:
            - strong [ref=f22e116]: "Eligibility:"
            - text: Undergraduate or master’s students graduating in 2028, with fluency in English and the local language – except for Budapest and Investment roles in Zurich
          - paragraph [ref=f22e117]:
            - link "Learn more and apply" [ref=f22e118] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-summer-internship-program-emea/45831/97150826672
        - generic [ref=f22e120]:
          - heading "Client & Product Summer Internship Programme" [level=2] [ref=f22e121]
          - paragraph [ref=f22e122]: Our Client & Product Summer Internship Programme is an eight-week experience that gives you a real insight into life as a BlackRock Analyst. You’ll work with Global Product Solutions and Global Client Business, join thought-provoking sessions with senior leaders, connect with mentors and take part in events that help you build relationships across the firm and with fellow interns.
          - paragraph [ref=f22e123]:
            - strong [ref=f22e124]: "Eligibility:"
            - text: Undergraduate or master’s students graduating in 2028
          - paragraph [ref=f22e125]:
            - link "Learn more and apply" [ref=f22e126] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-client-and-product-summer-internship-program-emea/45831/97150826736
        - generic [ref=f22e128]:
          - heading "Quantitative Master’s Internship Programme" [level=2] [ref=f22e129]
          - paragraph [ref=f22e130]: Our Quantitative Master’s Internship Programme is an immersive eight‑week experience in the UK that offers a clear window into life as a BlackRock Associate. Designed for specialised master’s students in quantitative fields, the programme gives you hands‑on exposure to our work, our people and the impact you can make.
          - paragraph [ref=f22e131]:
            - strong [ref=f22e132]: "Eligibility:"
            - text: Students enrolled in analytics, computer science, engineering, mathematics or another quantitative‑focused master’s programme and graduating between August 2027 and July 2028, with at least one year of relevant work experience
      - generic [ref=f22e134]:
        - generic [ref=f22e136]:
          - heading "Off-Cycle Internship Programme" [level=2] [ref=f22e137]
          - paragraph [ref=f22e138]: Our six‑month Off‑Cycle Internship Programme gives you a close look at life as a BlackRock Analyst. You’ll work side by side with one of our teams, gaining hands‑on experience as you explore how our work shapes markets, clients and communities. Along the way, you’ll build skills that matter, develop industry insight and form connections that can guide your next move – all while making a meaningful impact from day one.
          - paragraph [ref=f22e139]:
            - strong [ref=f22e140]: "Eligibility:"
            - text: Undergraduate or master’s students graduating between July 2027 and 2028, with fluency in English and the local language – except for Budapest and Investment roles in Zurich
          - paragraph [ref=f22e141]:
            - link "Learn more and apply" [ref=f22e142] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-off-cycle-internship-program-emea/45831/97104654800
        - generic [ref=f22e144]:
          - heading "Client & Product Off-Cycle Internship Programme" [level=2] [ref=f22e145]
          - paragraph [ref=f22e146]: Our six‑month Client & Product Off‑Cycle Internship gives you hands‑on experience across Global Product Solutions and Global Client Business, helping you understand how we design and deliver solutions for clients worldwide. You’ll build commercial skills, learn from teams who think differently and form connections that support your growth while making an impact from day one.
          - paragraph [ref=f22e147]:
            - strong [ref=f22e148]: "Eligibility:"
            - text: Undergraduate or master’s students graduating between July 2027 and 2028, with fluency in English and the local language
        - generic [ref=f22e150]:
          - heading "Placement Programme" [level=2] [ref=f22e151]
          - paragraph [ref=f22e152]: Our 12‑Month Placement Programme gives you the chance to experience life at BlackRock while taking on real responsibility from day one. You’ll contribute to work that helps us meet the evolving needs of our clients, all while developing new skills and building a strong foundation for your future career.
          - paragraph [ref=f22e153]:
            - strong [ref=f22e154]: "Eligibility:"
            - text: Undergraduate students whose degree requires a long‑term internship and who are graduating in 2029
          - paragraph [ref=f22e155]:
            - link "Learn more and apply" [ref=f22e156] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-placement-program-emea/45831/97150826704
      - generic [ref=f22e159]:
        - heading "Events" [level=2] [ref=f22e161]
        - generic [ref=f22e162]:
          - heading "Spring Insight Event" [level=2] [ref=f22e163]
          - paragraph [ref=f22e164]:
            - text: Join our week-long Spring Insight Event taking place in our London and Edinburgh offices to gain an in-depth look at our business. You will participate in work shadowing, a group project, networking, and social events. You will be able to apply to experience up to two functions as we believe it is important to have an open mind about where you begin your career.
            - strong
          - paragraph [ref=f22e165]: "Eligibility: Undergraduate or master's students graduating in 2029"
          - paragraph [ref=f22e166]: April 2027
          - paragraph [ref=f22e167]:
            - link "Learn more and apply" [ref=f22e168] [cursor=pointer]:
              - /url: https://careers.blackrock.com/job/london/2027-spring-insight-event-emea/45831/97150826752
        - generic [ref=f22e169]:
          - heading "Client & Product Spring Insight Event" [level=2] [ref=f22e170]
          - paragraph [ref=f22e171]: Join our week-long Client & Product Spring Insight Event taking place in our London office. This is an immersive experience where you will participate in work shadowing, a group project, networking, and social events within our Client & Product business areas. By the end of the week, you’ll be well on your way to being a true student of the markets.
          - paragraph [ref=f22e172]: "Eligibility: Undergraduate or master's students graduating in 2029"
          - paragraph [ref=f22e173]: April 2027
