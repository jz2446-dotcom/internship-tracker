          - generic: Patricia Bath
          - generic: Class of 1968
          - generic: “My love of humanity and passion for helping others inspired me to become a physician.”
          - paragraph
          - paragraph: "Dr. Patricia Bath was an ophthalmologist, inventor, researcher, and humanitarian. Born in 1942 to parents who encouraged her interest in science, Dr. Bath’s research began at the young age of 16, when she won a merit award for her discoveries at a cancer research workshop. She received her medical degree at Howard University, graduating with honors in 1968. Dr. Bath’s career was full of “firsts”: In 1974, she was the first woman ophthalmologist appointed to the faculty of the University of California; in 1983, she became the first woman chair to an ophthalmology residency program in the United States. Dr. Bath was dedicated to bringing ophthalmic health services to underserved communities. She conducted epistemological research and found that blindness occurred in black patients at twice the rate of white patients."
          - paragraph: "In response to this discovery, Dr. Bath created community ophthalmology, a new discipline that brought volunteer ophthalmic health services to thousands of people who otherwise would not have been able to afford treatment. She didn’t stop there: In 1976, Dr. Bath and three of her colleagues founded the American Institute for the Prevention of Blindness, an organization that operates on the principle that eyesight is a basic human right. She also invented the Laserphaco Probe, a surgical tool that uses lasers to treat cataracts with less pain and more precision than previous treatments. She patented the device in 1988, becoming the first African American female doctor to patent a medical technology."
  - generic:
    - generic:
      - generic:
        - generic:
          - generic: Beth Brown
          - generic: Class of 1991
          - generic: “If you didn’t get a good physics background in high school, it isn’t too late to study physics.”
          - paragraph: Beth Brown, Ph.D., was an astrophysicist and educator who studied elliptical galaxies and worked on multiple outreach projects. Born in Virginia in 1969, Brown cultivated a fascination in science from an early age, starting with her interest in science fiction. She studied astrophysics at Howard University, undertaking two internships at NASA during her undergraduate years. She went on to graduate school at the University of Michigan, where she became the first black woman to get a doctorate in astronomy from the institution. An astronomy course she developed during her graduate education is still taught and remains popular at the University of Michigan. Having attained her doctorate, Brown was then hired as an astrophysicist at NASA, where she collected data on elliptical galaxies. Brown’s wonder at the night sky translated into a desire to share that wonder with others. She represented NASA on television interviews, combining her warm presence with her astronomical expertise to present information on astronomy to the general public in an accessible manner. She was passionate about helping minorities to succeed in physics. Her greatest achievement, in her own words, was “…convincing a young woman not to give up on her dreams of becoming a scientist.”
  - generic:
    - generic:
      - generic:
        - generic:
          - generic: Elijah Cummings
          - generic: Class of 1973
          - generic: “I will fight until death to make sure every citizen…has that right to vote.”
          - paragraph: "Rep. Elijah E. Cummings was a lawyer, orator and advocate who worked throughout his lifetime to preserve American democracy. Born to former sharecroppers in Baltimore, Maryland in 1951, Cummings was no stranger to adversity. With the encouragement of his mother, who had only a fourth-grade education herself, Cummings went on to become the first African American in Maryland history to be named Speaker Pro Tempore, a senior member of the majority party chosen for skill in presiding. Elijah Cummings graduated from Howard University in 1973 with a bachelor’s degree in political science. He then went to law school at the University of Maryland. He maintained a close relationship with Howard University throughout his lifetime. Cummings practiced law and served in the Maryland House of Delegates for 14 years. In 1996, he was elected to the Federal House of Representatives, where he advocated for the working class in his Black-majority district. He became a powerful voice against voter suppression, launching investigations in Georgia, Texas, and Kansas, as well as monitoring organizations accused of targeting voters of color. The issue of voter suppression was personal to Cummings, who, during a speech in February 2019, recalled his mother’s dying words: “Do not let them take our votes away from us.” In that same speech, Cummings vowed to fight until death to defend the right to vote—and fight he did, until his passing in October of 2019. Rep. Elijah E. Cummings’s legacy as an advocate who fought tirelessly for the rights of all Americans lives on, both at Howard and in the countless lives he touched."
