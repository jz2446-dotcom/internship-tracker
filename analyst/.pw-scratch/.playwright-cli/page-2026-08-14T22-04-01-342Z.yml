          - generic: Taraji P. Henson
          - generic: Class of 1995
          - paragraph: Taraji P. Henson is an Academy Award-nominated actress, producer, and mental health advocate. She was born in Washington, D.C., and raised in an apartment that she described as “one step up from the projects”. Henson’s path to an acting career was not always clear-cut. After graduating high school, she pursued a degree in electrical engineering at North Carolina University, but dropped out after failing a math class. Henson transferred to Howard University, where she studied theater while working two jobs to support herself and her newborn son.
          - paragraph:
            - text: After graduating from Howard in 1995, Henson moved to Los Angeles, where she took on an office job and landed small roles in various television series. Her breakthrough role came in 2001, when she starred in the film, “Baby Boy
            - emphasis: .”
            - text: From there, her repertoire of film roles grew, and in 2008, she was nominated for an Academy Award for her role as the titular character’s mother in “The Curious Case of Benjamin Button
            - emphasis: .
            - text: ” She focused primarily on film until 2015, when she returned to television in “Empire” as Cookie Lyon, a role for which she received an Emmy nomination and a Golden Globe award. Her 2016 role as Katherine Johnson in the critically acclaimed film “Hidden Figures” cemented Henson’s popularity and iconic status. In 2018, Henson founded The Boris Lawrence Henson Foundation, a nonprofit committed to challenging the perception of mental illness in the African American community.
