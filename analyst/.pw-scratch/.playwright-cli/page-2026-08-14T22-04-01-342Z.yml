          - generic: Zora Neale Hurston
          - generic: Class of 1920
          - generic: “Research is formalized curiosity. It is poking and prying with a purpose.”
          - text: Zora Neale Hurston is considered one of the foremost female writers of the 20th century. She was born in Notasulga, Alabama on January 15, 1891. At a young age, her family relocated to Eatonville, Florida where they flourished. Her father became one of the town’s first mayors. In 1917, Hurston enrolled at Morgan College, where she completed her high school studies. She then attended Howard University and earned an associate’s degree. Hurston was an active student and participated in student government. She also co-founded the school’s renowned newspaper, The Hilltop. In 1925, Hurston received a scholarship to Barnard College and graduated with a BA in anthropology.During her time in New York City, Hurston befriended other writers such as Langston Hughes and Countee Cullen. Together, they joined the black cultural renaissance taking place in Harlem. Hurston dedicated herself to promoting and studying Black culture. She traveled to Haiti and Jamaica to study the religions of the African diaspora. Her findings were included in several newspapers throughout the United States. Hurston often incorporated her research into her fictional writing. As an author, Hurston started publishing short stories as early as 1920. Unfortunately, her work was ignored by the mainstream literary audience for years. One of her most popular works was “Their Eyes were Watching God.” Hurston broke literary norms by focusing her work on the experience of a Black woman.
