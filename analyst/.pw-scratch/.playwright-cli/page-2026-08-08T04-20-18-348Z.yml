      - generic [ref=f318e38]:
        - paragraph [ref=f318e39]: As an international institution undergoing rapid growth and possessing a large overseas portfolio, CIC recruits experienced professionals with international investment management experience and a good knowledge of Chinese culture and perspectives.
        - paragraph [ref=f318e40]: CIC operates a fair, rigorous, and transparent global recruitment process. All candidates must apply through its online recruitment system. After initial screening, candidates are invited to take an online test. Those who pass the online test are shortlisted for interviews. To enhance the rigor and fairness of the selection process, CIC applies a multidimensional assessment methodology and asks external human resource experts to participate in the interviews. Candidates applying for positions of managing director or above are interviewed by relevant senior executives.
        - paragraph [ref=f318e41]: CIC has a talent database to keep potential candidates in reserve for mid-level and senior executive positions. This allows CIC to respond quickly to demands for more targeted and professional recruitment. CIC also uses external human resource agents to search for the talent it needs.
        - paragraph [ref=f318e42]: Since 2024, guided by its strategic goals and business needs, CIC has broadened its recruitment channels and expanded its pool of experienced professionals. The company has actively recruited specialized professionals with international perspectives, while targeting urgently needed, high caliber, and cutting-edge talent, further strengthening the expertise of its teams. CIC has also scaled up campus recruitment efforts to attract outstanding graduates from top universities in China and abroad, injecting fresh vitality into its talent pipeline and enhancing internal capacity for talent development.
        - paragraph [ref=f318e43]: Our postdoctoral program, established in early 2021, attracts top talent, promotes industry-academia collaboration, and serves as a recruitment pipeline. Since its inception, we’ve successfully integrated multiple high-performing postdocs into permanent roles at CIC.
