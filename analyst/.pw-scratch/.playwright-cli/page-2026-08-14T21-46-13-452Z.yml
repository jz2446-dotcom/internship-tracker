      - heading "Three MD60 Dreadnoughts. Sitka spruce tops. Three very different back and side woods. So what actually changes?" [level=1] [ref=f410e324]
      - paragraph [ref=f410e325]
      - paragraph [ref=f410e326]: Chris and Dee put Walnut, Mahogany, and Ovangkol head to head to find out how the wood behind the top shapes the voice of a guitar. These are the middleweights of the tonewood world, all sitting between 1,200 and 1,400 pounds per force on the Janka hardness scale, but the differences in tone, volume, and character surprised even us.
