              - definition [ref=f465e149]:
                - paragraph
                - paragraph [ref=f465e150]:
                  - text: Bachelor's degree in accounting, business administration, public administration, or a related field to include 24 quarter credits or equivalent semester credits in accounting courses and five years of experience in accounting, at least two years of which must have been as an
                  - link "Accountant II - open in a new tab" [ref=f465e151] [cursor=pointer]:
