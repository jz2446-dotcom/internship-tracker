              - definition [ref=f465e154]:
                - paragraph
                - list [ref=f465e155]:
                  - listitem [ref=f465e156]: Submit a City of Saint Paul online application by the closing date.
                  - listitem [ref=f465e157]:
                    - text: Upload or submit the following
                    - strong [ref=f465e158]: required documents
