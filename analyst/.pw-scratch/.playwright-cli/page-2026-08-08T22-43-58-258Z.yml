                - strong [ref=f465e181]: "Equal Employment Opportunity Statement:"
                - text: The City of Saint Paul is an equal opportunity/affirmative action employer. Veterans, women, persons of color, members of the LGBTQIA+ community, and individuals with disabilities are strongly encouraged to apply.
