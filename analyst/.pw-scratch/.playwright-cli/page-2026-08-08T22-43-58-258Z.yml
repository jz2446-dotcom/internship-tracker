              - definition [ref=f465e120]:
                - paragraph
                - paragraph [ref=f465e121]:
                  - img "The City of Saint Paul Regional Water Services is seeking a skilled and experienced Accountant III to join our Finance team. This position plays a key leadership role in overseeing core accounting operations, including Accounts Payable and Payroll functions, while ensuring accurate financial reporting, compliance with governmental accounting standards, and effective stewardship of public resources." [ref=f465e122]
                  - text: The City of Saint Paul Regional Water Services is seeking a skilled and experienced Accountant III to join our Finance team. This position plays a key leadership role in overseeing core accounting operations, including Accounts Payable and Payroll functions, while ensuring accurate financial reporting, compliance with governmental accounting standards, and effective stewardship of public resources.
                - strong [ref=f465e123]: "Here's what you can expect to do:"
                - list [ref=f465e124]:
                  - listitem [ref=f465e125]: Provide leadership to Accounts Payable support staff, including workflow oversight, training, and performance guidance.
                  - listitem [ref=f465e126]: Oversee the Accounts Payable function to ensure timely, accurate processing of invoices, vendor payments, and compliance with internal controls and policies.
                  - listitem [ref=f465e127]: Support Payroll staff and payroll operations, ensuring accurate payroll processing, reporting, and compliance with applicable laws and labor agreements.
                  - listitem [ref=f465e128]: Perform and oversee complex accounting activities in accordance with GAAP and GASB standards.
                  - listitem [ref=f465e129]: Prepare and review journal entries, reconciliations, and financial schedules.
                  - listitem [ref=f465e130]: Support annual financial reporting, audits, and compliance requirements.
                  - listitem [ref=f465e131]: Participate in developing, updating, and implementing accounting policies and procedures, including capital asset policies.
                  - listitem [ref=f465e132]: Identify and implement process improvements to enhance efficiency, accuracy, and internal controls.
                  - listitem [ref=f465e133]: Support a collaborative, mission-driven environment supporting essential public services.
                  - listitem [ref=f465e134]: Opportunity for continued professional growth in governmental and utility accounting.
                - strong [ref=f465e135]: "The ideal candidate for this position will possess the following:"
                - list [ref=f465e136]:
                  - listitem [ref=f465e137]: Deep technical accounting expertise with strong leadership.
                  - listitem [ref=f465e138]: Background in capital asset management within a governmental or utility environment.
                  - listitem [ref=f465e139]: Supporting capital projects and maintaining strong internal controls across financial operations.
                - text: For more information and essential functions, see our
                - link "job description" [ref=f465e140] [cursor=pointer]:
                  - /url: https://www.governmentjobs.com/careers/stpaul/classspecs/772096?keywords=accountant%20iii&pagetype=classSpecifications
                - text: .
                - strong [ref=f465e141]: "Our Benefits:"
                - text: We offer competitive wages, and a variety of
                - link "excellent benefits" [ref=f465e142] [cursor=pointer]:
                  - /url: https://www.stpaul.gov/sites/default/files/human-resources/2026-summary-benefits-document-professional-employees.pdf
                - link "(Download PDF reader)" [ref=f465e143] [cursor=pointer]:
                  - /url: https://get.adobe.com/reader/
                - text: ", including health insurance, retirement contributions and paid vacation and sick time."
                - paragraph [ref=f465e144]:
                  - strong [ref=f465e145]: "Equity, Inclusion and Belonging:"
                  - text: The City of Saint Paul is dedicated to dismantling systemic racial, cultural, and economic barriers that prevent people from fully enjoying and participating in our community and ensuring fairness in opportunities and outcomes for all individuals. At the City of Saint Paul, we want our workforce to reflect the diverse city that we serve. Our leaders are guided by an unapologetic equity agenda, which promotes the belief that true equity is building a city that works for all of us.
                  - strong [ref=f465e146]
                  - text: We encourage you to apply as we are most interested in finding the best candidate for this job.
                - paragraph
