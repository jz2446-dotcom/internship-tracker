                - heading "Learn more about our Hiring Process" [level=2] [ref=f465e169]
              - definition [ref=f465e170]:
                - paragraph
                - paragraph [ref=f465e171]:
                  - strong [ref=f465e172]: "Open Job Posting:"
                  - text: This posting is open to anyone who meets the position requirements.
                - paragraph [ref=f465e173]:
                  - strong [ref=f465e174]: "Selection Process:"
                  - text: Applicants who meet the minimum job requirements will be placed on a hiring list for consideration. Hiring Managers may interview/hire anyone from the list. You will be notified if you are invited to participate in the final selection process which may include an interview, job simulation, work sample submission, or other evaluation method.
                - strong [ref=f465e175]: "Pre-Employment Screening:"
                - text: This position requires a credit check, drug test, and a background check which may include criminal history, and employment history as a condition of employment.
                - strong [ref=f465e176]: Candidates will be required to submit proof of education to Human Resources.
                - strong [ref=f465e177]: "Human Resources Contact Information:"
                - text: "Danni Smith at 651-266-6566Email:"
                - link "danni.smith@stpaul.gov" [ref=f465e178] [cursor=pointer]:
                  - /url: mailto:danni.smith@stpaul.gov
                - text: The City of Saint Paul encourages individuals to apply for positions regardless of criminal history.
                - strong [ref=f465e179]: Veteran’s Preference
                - text: ": If you are a veteran and would like to receive Veteran’s preference in accordance with MN Statute 197.455, you must submit a photocopy of your DD214 preferably at time of application."
