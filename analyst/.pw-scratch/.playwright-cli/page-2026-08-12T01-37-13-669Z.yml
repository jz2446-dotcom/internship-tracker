      - generic [ref=f669e40]:
        - generic [ref=f669e41]:
          - generic [ref=f669e42]: Job Type
          - generic [ref=f669e43]: Full-time
        - generic [ref=f669e44]: Description
        - generic [ref=f669e45]:
          - paragraph [ref=f669e46]:
            - text: The Public Safety Officer is responsible for providing security for the Kansas City Public Library staff, patrons and assets while unarmed. This is a full-time non-exempt position. The pay is $20.28 per hour, plus excellent
            - link "benefits." [ref=f669e47] [cursor=pointer]:
              - /url: https://kclibrary.org/jobs/employee-benefits
          - paragraph [ref=f669e48]
          - paragraph [ref=f669e49]:
            - strong [ref=f669e50]: Schedule & Location
          - list [ref=f669e51]:
            - listitem [ref=f669e52]: Hours and location may vary.
            - listitem [ref=f669e53]: Must have the ability to work multiple locations including weekends during the hours between 9 am - 9 pm.
            - listitem [ref=f669e54]: All Public Safety Officer positions are subject to working at other Library locations.
          - paragraph [ref=f669e55]:
            - strong [ref=f669e56]: Job Duties (Essential Functions)
          - list [ref=f669e57]:
            - listitem [ref=f669e58]: Patrols Library-owned property, both inside the building and its perimeters.
            - listitem [ref=f669e59]: Conducts a monthly inspection on assigned Library locations.
            - listitem [ref=f669e60]: Creates incident reports to track safety concerns, including daily activities and irregularities.
            - listitem [ref=f669e61]: Reviews surveillance footage related to incidents.
            - listitem [ref=f669e62]: Examines doors, windows, and gates to ensure security.
            - listitem [ref=f669e63]: Notifies Police and Fire Department by telephone in case of emergency situations.
            - listitem [ref=f669e64]: Enforces Library rules related to safety and customer courtesy & conduct, including providing warnings and apprehending/evicting violators.
            - listitem [ref=f669e65]: Activates and deactivates security alarms.
            - listitem [ref=f669e66]: May respond to public safety matters after hours.
            - listitem [ref=f669e67]: Supports library safety efforts at all locations as needed.
            - listitem [ref=f669e68]: Gains and maintains knowledge of confidentiality of customer information, freedom of information, and intellectual freedom and reflects understanding and compliance in interactions with staff and the public.
            - listitem [ref=f669e69]: Maintains knowledge of relevant equipment, policies, procedures, and strategies to promote effective local, state, and national security operations.
            - listitem [ref=f669e70]: Other duties as assigned.
        - generic [ref=f669e71]: Requirements
        - generic [ref=f669e72]:
          - list [ref=f669e73]:
            - listitem [ref=f669e74]: Demonstrated ability to work independently.
            - listitem [ref=f669e75]: Ability to follow both oral and written directions.
            - listitem [ref=f669e76]: Ability to stand and walk for extended periods of time.
            - listitem [ref=f669e77]: Ability to work with and take direction from Administration and Branch Managers.
            - listitem [ref=f669e78]: Basic Computer skills including Microsoft Office (Excel, Outlook, and Word), Surveillance Security DVR systems, Alarm interfaces.
            - listitem [ref=f669e79]: Knowledge of confidentiality of customer information, freedom of information, and intellectual freedom.
            - listitem [ref=f669e80]: Access to transportation.
            - listitem [ref=f669e81]: Knowledge of relevant equipment, policies, procedures, and strategies to promote effective local, state, and national security operations.
            - listitem [ref=f669e82]: Must obtain and maintain a security license through Kansas City Missouri Police Department.
            - listitem [ref=f669e83]: Possess a reliable means of transportation between Library Branch locations.
            - listitem [ref=f669e84]: Ability to effectively communicate in and understand English and Spanish is required. Additional consideration may be given to individuals that are proficient in any non-English languages utilized in the Kansas City area including American Sign Language, Vietnamese, French, Arabic, and Swahili.
          - paragraph [ref=f669e85]:
            - strong [ref=f669e86]: Required Education and Experience
          - list [ref=f669e87]:
            - listitem [ref=f669e88]: One year certificate from college or technical school; or (three to) six months related experience preferred.
            - listitem [ref=f669e89]:
              - text: Licensed with KCPD or meets
              - link "eligibility requirements" [ref=f669e90] [cursor=pointer]:
                - /url: https://kcpolice.org/about/services/private-officers-licensing/
              - text: to become licensed within 2-months of hire.
            - listitem [ref=f669e91]: Experience and/or training; or equivalent combination of education and experience.
            - listitem [ref=f669e92]: Previous verbal de-escalation training or obtained within the first 30-days of employment.
            - listitem [ref=f669e93]: A minimum of 1 year customer service experience.
          - paragraph [ref=f669e94]:
            - strong [ref=f669e95]: Work Environment
          - paragraph [ref=f669e96]: Work is performed at the Central Library and Library Branches throughout the district. Primary workspace is shared with co-workers in an office environment, other work will be performed in a public space amongst staff and patrons from a diverse socio-economic community.
          - paragraph [ref=f669e97]
          - paragraph [ref=f669e98]:
            - strong [ref=f669e99]: Other Duties
          - paragraph [ref=f669e100]: Please note this job description is not designed to cover or contain a comprehensive list of activities, duties or responsibilities that are required of the employee for this job. Duties, responsibilities, and activities may change at any time with or without notice.
          - paragraph [ref=f669e101]
          - paragraph [ref=f669e102]:
            - emphasis [ref=f669e103]: The employee must be able to perform the essential functions and job requirements of the position satisfactorily. If requested, reasonable accommodations may be made to enable employees with disabilities to perform the essential functions of the job, absent undue hardship.
          - paragraph [ref=f669e104]
          - paragraph [ref=f669e105]:
            - strong [ref=f669e106]: How to Apply
          - paragraph [ref=f669e107]:
            - text: Please apply for this position through our web application system. We only accept applications for specific currently open positions made through our online system. Access the online application from the job listing on the
            - link "Job Opportunities page" [ref=f669e108] [cursor=pointer]:
              - /url: https://recruiting.paylocity.com/Recruiting/Jobs/All/a45c252a-e08e-4f47-8138-cd684ec9a0dd
            - text: . The
          - paragraph [ref=f669e109]: application system allows you to attach a document (such as a cover letter or a resume) to your application (10MB limit per document). When you submit your application, an acknowledgement will be sent to the email address you provided. You are welcome to apply for as many positions as you wish. However, to minimize problems, close and restart your browser between each application.
          - paragraph [ref=f669e110]
          - paragraph [ref=f669e111]: All online Application for Employment forms must be completely filled out. For technical assistance, call 816.701.3712.
          - paragraph [ref=f669e112]
          - paragraph [ref=f669e113]: Kansas City Public Library is an equal opportunity employer and is committed to creating an inclusive environment for all employees.
