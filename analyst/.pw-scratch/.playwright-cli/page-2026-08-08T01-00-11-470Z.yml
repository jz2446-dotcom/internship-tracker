          - generic [ref=f268e107]:
            - paragraph [ref=f268e108]:
              - strong [ref=f268e109]: The job search is a process.
              - text: First, you have to discover what career options you might be interested in and gain experience to meet the requirements of that industry. You might talk to a few people who are currently in that field and get tips and ideas to become a stronger candidate. When you find a position you're interested in, it's time to create a resume and cover letter tailored to that position. Then, you'll prepare for an interview and the job offer negotiation.
            - paragraph [ref=f268e110]: The job search process takes time and strategy. Network with those around you, attend events, leverage social media. If you don't know where to begin, come to the Division of Career Pathways and together, we'll explore your options and build a plan.
            - paragraph [ref=f268e111]:
