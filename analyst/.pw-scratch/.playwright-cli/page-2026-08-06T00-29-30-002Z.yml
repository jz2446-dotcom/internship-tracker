          - paragraph [ref=f151e95]: We come from many places and perspectives, but we’re united by our values. They reflect what we believe, how we behave and how we treat each other. We lead with care, champion inclusion, and act with empathy and respect—so everyone feels they belong.
        - generic [ref=f151e112]:
          - heading "Accelerate your growth" [level=2] [ref=f151e113]
          - paragraph [ref=f151e114]: At PwC, you’ll learn by doing—working on real client challenges, alongside diverse teams, using the latest technology. You’ll stretch your skills, deepen your expertise, and build momentum in the areas that matter most to your future.
          - paragraph [ref=f151e115]: Through PwC’s Learning Collective, development is embedded into your everyday work. You’ll learn at pace through immersive experiences, hands-on problem solving, and pioneering programs that bring human skills and AI capability together. Along the way, you’ll learn from leading practitioners, experiment boldly, and grow market-ready skills—so you can do work that makes a meaningful impact, faster.
